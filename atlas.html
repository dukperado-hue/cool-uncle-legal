<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thai Legal Atlas — สารบบกฎหมายไทย</title>
<meta name="description" content="Thai Legal Atlas — ชั้นนำทางเดียวเหนือโครงสร้างกฎหมายไทยหลายระบบ: ประมวลแพ่ง อาญา วิ.แพ่ง วิ.อาญา รัฐธรรมนูญ ปกครอง ทรัพย์สินทางปัญญา ฯลฯ โดยคงลำดับชั้นดั้งเดิมของกฎหมายแต่ละฉบับ">
<link rel="canonical" href="https://coolunclelab.com/atlas.html">
<!--
  Thai Legal Atlas — host page.
  Phase 2 deliverable: the NAVIGATION STRUCTURE only.
  The stylesheet below is a plain baseline. Phase 3 replaces/extends it —
  atlas-ui.js emits semantic `atlas-*` classes and no visual CSS, so a
  restyle should not need to touch the JS.
-->
<style>
  :root{
    --bg:#FBF9F4; --panel:#fff; --ink:#1f2430; --muted:#5b6472;
    --line:#e6e1d6; --accent:#2E4A7A; --accent-soft:#eaf0f8; --chip:#f2ede1;
    /* spacing scale — whitespace communicates structure, not decoration */
    --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:36px;
    --radius:10px;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --bg:#14161b;--panel:#1c1f27;--ink:#e8eaed;--muted:#9aa3b2;
    --line:#2c313c;--accent:#8fb4e8;--accent-soft:#20293a;--chip:#232733;}}
  :root[data-theme="dark"]{
    --bg:#14161b;--panel:#1c1f27;--ink:#e8eaed;--muted:#9aa3b2;
    --line:#2c313c;--accent:#8fb4e8;--accent-soft:#20293a;--chip:#232733;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"Sarabun","IBM Plex Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;
    line-height:1.6;font-size:15px}
  a{color:var(--accent);text-decoration:none}
  a:hover{text-decoration:underline}
  .atlas-wrap{max-width:1120px;margin:0 auto;padding:var(--s5) var(--s5) 80px}
  /* the 1120px shell centres the composition; individual views stay at a
     sane reading width inside it rather than being forced edge-to-edge */
  .atlas-home{max-width:840px}
  .atlas-collection,.atlas-instrument{max-width:940px}

  .atlas-masthead{padding:var(--s5) 0 var(--s4);border-bottom:2px solid var(--line);margin-bottom:var(--s5)}
  .atlas-masthead h1{margin:0 0 var(--s2);font-size:25px;letter-spacing:-.01em;font-weight:700}
  .atlas-masthead .sub{color:var(--muted);font-size:13.5px;max-width:64ch;line-height:1.6}
  .atlas-principle{margin-top:var(--s3);font-size:12px;color:var(--muted);
    border-left:2px solid var(--line);padding:2px 0 2px var(--s3);max-width:78ch}

  .atlas-loading,.atlas-error{padding:32px 6px;text-align:center;color:var(--muted)}
  .atlas-error{color:#b4453a}
  .atlas-empty{margin:var(--s3) 0;padding:var(--s4) var(--s4);color:var(--muted);
    font-size:12.5px;border:1px dashed var(--line);border-radius:8px;background:transparent}
  .atlas-empty-planned{opacity:.85}

  .atlas-crumbs{font-size:13px;color:var(--muted);margin:0 0 var(--s4);display:flex;
    flex-wrap:wrap;gap:var(--s2);align-items:center}
  .atlas-crumb-sep{opacity:.45}
  .atlas-crumb-current{color:var(--ink);font-weight:600}

  /* ---- home : subject-area bands ------------------------------------
     Taxonomy reads as a labelled index: the area name sits in a left rail
     on wide screens, its collections beside it. No surfaces, no boxes;
     a hairline divides one area from the next. */
  .atlas-area{display:grid;grid-template-columns:170px 1fr;gap:var(--s5);
    padding:var(--s5) 0;margin:0}
  .atlas-area + .atlas-area{border-top:1px solid var(--line)}
  .atlas-area:first-child{padding-top:var(--s2)}
  .atlas-area-planned{opacity:.6}
  .atlas-area-title{margin:2px 0 0;font-size:12px;font-weight:700;letter-spacing:.05em;
    text-transform:uppercase;color:var(--muted);line-height:1.5}
  .atlas-tag{display:inline-block;font-size:10px;padding:1px 6px;border-radius:999px;
    background:var(--chip);color:var(--muted);margin-left:var(--s2);vertical-align:middle;
    letter-spacing:normal;text-transform:none;font-weight:400}
  /* fixed 240–300px tracks, left-packed: 1–2 cards keep a readable width and
     never stretch across the column; 3+ reflow into a tidy grid */
  .atlas-collection-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,300px));
    gap:var(--s2);margin:0;justify-content:start}
  .atlas-collection-card{display:flex;gap:var(--s3);align-items:flex-start;padding:var(--s3) var(--s4);
    border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);
    transition:border-color .12s,background .12s}
  .atlas-collection-card:hover{border-color:var(--accent);background:var(--accent-soft);text-decoration:none}
  .atlas-collection-card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .atlas-collection-card-planned{opacity:.55;cursor:not-allowed}
  .atlas-collection-icon{font-size:17px;line-height:1.3}
  .atlas-collection-body{display:flex;flex-direction:column;gap:2px;min-width:0}
  .atlas-collection-name{font-weight:600;font-size:14px;color:var(--ink)}
  .atlas-collection-full{font-size:11.5px;color:var(--muted);line-height:1.45}
  .atlas-collection-meta{font-size:11px;color:var(--muted);margin-top:var(--s1)}

  /* ---- collection / instrument header -------------------------------- */
  .atlas-collection-header,.atlas-instrument-header{background:var(--panel);
    border:1px solid var(--line);border-radius:var(--radius);padding:var(--s4) var(--s5);margin-bottom:var(--s5)}
  .atlas-collection-h1{margin:0 0 var(--s3);font-size:19px;font-weight:700;line-height:1.35}
  .atlas-level-path{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;
    gap:var(--s1) 6px;align-items:center;margin:var(--s3) 0}
  .atlas-level-path-label{font-weight:600;color:var(--muted)}
  /* every hierarchy chip shares one neutral, non-interactive treatment —
     the terminal มาตรา/ข้อ chip must not read as a button */
  .atlas-level-chip,.atlas-level-chip-unit{background:var(--chip);color:var(--muted);
    border-radius:5px;padding:2px 8px;font-weight:400}
  .atlas-level-arrow{opacity:.4;font-size:11px}
  .atlas-collection-facts{display:flex;flex-wrap:wrap;gap:var(--s1) var(--s5);font-size:12px;
    color:var(--muted);margin-top:var(--s3)}
  .atlas-fact-k{font-weight:600;margin-right:6px}
  .atlas-structure-note{margin:var(--s3) 0 0;font-size:12.5px;color:var(--ink);opacity:.85;
    max-width:68ch;line-height:1.65}
  .atlas-source{margin:var(--s2) 0 0;font-size:11px;color:var(--muted)}

  /* ---- multi-instrument list (aviation) ---------------------------- */
  .atlas-instrument-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));
    gap:var(--s2);max-width:840px}
  .atlas-instrument-card{display:flex;flex-direction:column;gap:var(--s1);padding:var(--s3) var(--s4);
    border:1px solid var(--line);border-radius:var(--radius);background:var(--panel)}
  .atlas-instrument-card:hover{border-color:var(--accent);background:var(--accent-soft);text-decoration:none}
  .atlas-instrument-card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .atlas-instrument-card-empty{opacity:.5}
  .atlas-instrument-type{font-size:10.5px;color:var(--muted);font-weight:700;
    text-transform:uppercase;letter-spacing:.04em}
  .atlas-instrument-title{font-size:13.5px;font-weight:600;color:var(--ink);line-height:1.4}
  .atlas-instrument-meta{font-size:11px;color:var(--muted)}

  /* ---- structure tree --------------------------------------------
     Hierarchy is carried by weight, size, indentation and a single guide
     rule per level — never by colour coding or nested boxes. */
  .atlas-tree{list-style:none;margin:0;padding:0}
  .atlas-tree .atlas-tree{padding-left:14px;margin-left:8px;border-left:1px solid var(--line)}
  .atlas-node-row{display:flex;gap:var(--s2);align-items:baseline;min-height:30px;
    padding:4px 8px;border-radius:6px;border-left:2px solid transparent;
    transition:background .1s}
  .atlas-node-row:hover{background:var(--chip)}
  /* expanded node: emphasis stays LOCAL — a thin rule + a heavier value,
     never a full-width tinted strip */
  .atlas-node-open > .atlas-node-row{border-left-color:var(--accent)}
  .atlas-node-open > .atlas-node-row .atlas-node-value{font-weight:700}
  /* Phase 4B: transient landing highlight for a node reached from a
     breadcrumb click — JS removes the class after ~1.5s. */
  .atlas-node-focus > .atlas-node-row{
    background:var(--accent-soft);
    box-shadow:inset 0 0 0 1px var(--accent);
  }
  @media (prefers-reduced-motion:no-preference){
    .atlas-node-focus > .atlas-node-row{transition:background .25s,box-shadow .25s}
  }
  .atlas-node-toggle{border:0;background:none;color:var(--muted);cursor:pointer;
    font-size:10px;width:16px;flex:none;padding:0;font-family:inherit;text-align:center;
    align-self:center}
  .atlas-node-toggle:focus-visible{outline:2px solid var(--accent);outline-offset:1px;border-radius:3px}
  .atlas-node-label{cursor:pointer;display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 6px}
  .atlas-node-value{color:var(--ink);font-weight:600;font-size:14px}
  .atlas-tree .atlas-tree .atlas-node-value{font-size:13.5px;font-weight:400}
  .atlas-node-levelword{font-size:11px;color:var(--muted);font-weight:400}
  .atlas-node-title{color:var(--muted);font-weight:400;font-size:13px}
  .atlas-node-count{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
  /* provisions — a compact aligned grid, subordinate to the hierarchy.
     Tracks are wide enough for the longest identifier ("มาตรา 1755") so a
     number is never clipped; a short list stays tidy instead of floating. */
  .atlas-provision-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));
    gap:5px 6px;padding:var(--s2) 6px var(--s4) 24px;max-width:660px}
  .atlas-provision{display:block;padding:3px 8px;border:1px solid var(--line);
    border-radius:5px;font-size:12px;background:var(--panel);color:var(--ink);
    text-align:center;font-variant-numeric:tabular-nums;white-space:nowrap}
  .atlas-provision:hover{border-color:var(--accent);background:var(--accent-soft);text-decoration:none}
  .atlas-provision:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  .atlas-provision-cancelled{opacity:.5;text-decoration:line-through}
  /* Phase 4C: provision → associated PUBLIC cases. Additive; applied by
     atlas-cases.js, which wraps a pill in .atlas-pcases only when the
     provision has at least one public case. The wrapper becomes the grid
     cell; the provision link itself is unchanged. */
  .atlas-pcases{display:flex;flex-direction:column;gap:2px;min-width:0}
  .atlas-pcases > .atlas-provision{width:100%}
  .atlas-pcases-d{font-size:10.5px;line-height:1.4}
  .atlas-pcases-sum{list-style:none;cursor:pointer;color:var(--muted);
    text-align:center;padding:1px 4px;border-radius:4px;
    font-variant-numeric:tabular-nums;-webkit-user-select:none;user-select:none}
  .atlas-pcases-sum::-webkit-details-marker{display:none}
  .atlas-pcases-sum::marker{content:""}
  .atlas-pcases-sum:hover{color:var(--accent);background:var(--chip)}
  .atlas-pcases-d[open] > .atlas-pcases-sum{color:var(--accent);font-weight:600}
  /* the open list may exceed the narrow provision-grid column — let it size
     to its content (capped) and sit above neighbouring pills */
  .atlas-pcases-list{position:relative;z-index:2;display:flex;flex-direction:column;
    gap:4px;padding:5px 6px;margin-top:2px;border:1px solid var(--line);
    border-radius:5px;background:var(--panel);width:max-content;
    min-width:100%;max-width:230px;box-shadow:0 2px 8px rgba(0,0,0,.10)}
  .atlas-pcases-link{font-size:10.5px;color:var(--accent);line-height:1.35;
    text-align:left;padding:1px 2px;white-space:normal}
  .atlas-pcases-link:hover{text-decoration:underline}
  @media (prefers-reduced-motion:no-preference){
    .atlas-pcases-sum{transition:color .12s,background .12s}
  }
  /* Phase 4C-2: structural leaf node → aggregated PUBLIC cases. Additive;
     atlas-cases.js inserts .atlas-node-cases at the top of an expanded leaf
     node body (above the provision grid) only when ≥1 unique public case
     exists. Subordinate to the heading + provisions: a small dashed pill. */
  .atlas-node-cases{display:block;margin:2px 0 var(--s3) 24px;font-size:11px}
  .atlas-node-cases-d{display:inline-block;max-width:100%}
  .atlas-node-cases-sum{list-style:none;cursor:pointer;color:var(--muted);
    display:inline-block;padding:2px 10px;border:1px dashed var(--line);
    border-radius:999px;font-variant-numeric:tabular-nums;
    -webkit-user-select:none;user-select:none}
  .atlas-node-cases-sum::-webkit-details-marker{display:none}
  .atlas-node-cases-sum::marker{content:""}
  .atlas-node-cases-sum:hover{color:var(--accent);border-color:var(--accent)}
  .atlas-node-cases-d[open] > .atlas-node-cases-sum{color:var(--accent);
    border-style:solid;border-color:var(--accent);font-weight:600}
  .atlas-node-case-list{display:flex;flex-direction:column;gap:5px;
    margin-top:6px;padding:8px 10px;border:1px solid var(--line);
    border-radius:6px;background:var(--panel);max-width:420px}
  .atlas-node-case-link{font-size:11px;color:var(--accent);line-height:1.4;text-align:left}
  .atlas-node-case-link:hover{text-decoration:underline}
  @media (prefers-reduced-motion:no-preference){
    .atlas-node-cases-sum{transition:color .12s,border-color .12s}
  }

  .atlas-foot{margin-top:64px;padding-top:var(--s4);border-top:1px solid var(--line);
    font-size:11.5px;color:var(--muted);line-height:1.7}
  .atlas-foot code{background:var(--chip);border-radius:4px;padding:1px 5px;
    font-size:11px;white-space:nowrap}
  .atlas-foot a{margin:0 2px}
  [hidden]{display:none!important}

  @media (max-width:760px){
    .atlas-wrap{padding:var(--s4) var(--s4) 64px}
    .atlas-area{grid-template-columns:1fr;gap:var(--s3);padding:var(--s4) 0}
    .atlas-area-title{margin-bottom:var(--s1)}
    .atlas-collection-header,.atlas-instrument-header{padding:var(--s4)}
    .atlas-instrument-list{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<div class="atlas-wrap">
  <header class="atlas-masthead">
    <h1>Thai&nbsp;Legal&nbsp;Atlas</h1>
    <div class="sub">ชั้นนำทางและค้นพบเดียว เหนือโครงสร้างกฎหมายไทยหลายระบบ — โดยคงลำดับชั้นดั้งเดิมของกฎหมายแต่ละฉบับไว้ ไม่บีบให้เป็นทรงเดียวกัน</div>
    <div class="atlas-principle">สารบบเดียว หลายระบบกฎหมาย — ไล่จากสาขากฎหมาย → ฉบับกฎหมาย → ลำดับชั้นดั้งเดิมของฉบับนั้น → มาตราหรือข้อ → ตัวบท</div>
  </header>

  <div id="atlas-search"></div>

  <div id="atlas-root"><div class="atlas-loading">กำลังโหลดสารบบกฎหมาย…</div></div>

  <footer class="atlas-foot" id="atlas-foot"></footer>
</div>

<script src="atlas-patches.js?v=20260907d"></script>
<script src="atlas-core.js?v=20260907d"></script>
<script src="atlas-ui.js?v=20260907f"></script>
<script src="atlas-cases.js?v=20260907b"></script>
<script src="atlas-clusters.js?v=20260909a"></script>
<script src="atlas-concepts.js?v=20260910a"></script>
<script src="atlas-provision-concepts.js?v=20260909a"></script>
<script src="atlas-provision-view.js?v=20260909e"></script>
<script src="atlas-search.js?v=20260909a"></script>
<script>
(function () {
  'use strict';
  var CODEX_VERSION = '20260903b';
  var root = document.getElementById('atlas-root');
  var foot = document.getElementById('atlas-foot');

  Promise.all([
    fetch('codex-data.json?v=' + CODEX_VERSION).then(function (r) {
      if (!r.ok) throw new Error('codex-data.json ' + r.status); return r.json();
    }),
    AtlasCore.loadRegistry('collections-registry.json?v=20260907d')
  ]).then(function (res) {
    AtlasCore.attachCorpus(res[0]);
    AtlasUI.mount(root);
    // Phase 4E-1 — inline provision viewer (standalone; progressive enhancement,
    // the provision pills keep their legacy href either way).
    if (window.AtlasProvisionView) AtlasProvisionView.init({ root: root });
    // F5 — search / jump box (standalone; additive consumer, fails soft)
    if (window.AtlasSearch) AtlasSearch.mount(document.getElementById('atlas-search'), { root: root });
    renderFoot();
  }).catch(function (err) {
    root.innerHTML = '<div class="atlas-error">โหลดข้อมูลไม่สำเร็จ: ' +
      String(err && err.message || err) + '</div>';
  });

  function renderFoot() {
    var cols = AtlasCore.listCollections();
    var total = cols.reduce(function (s, c) { return s + c.articleCount; }, 0);
    var patches = (window.AtlasPatches && AtlasPatches.describe) ? AtlasPatches.describe() : [];
    foot.innerHTML =
      '<div>' + cols.length + ' คลังกฎหมาย · ' + total.toLocaleString('th-TH') +
        ' บทบัญญัติ</div>' +
      '<div style="margin-top:6px">ลิงก์ของแต่ละมาตรา/ข้อ ชี้ไปยังหน้าตัวบทเดิมเสมอ — ' +
        'Atlas เป็นชั้นนำทางเสริม ไม่เปลี่ยนที่อยู่เดิมของบทบัญญัติ</div>' +
      (patches.length
        ? '<div style="margin-top:6px">แก้ช่องว่างจากต้นฉบับ: ' +
          patches.map(function (p) { return p.collection + ' ' + p.range; }).join(' · ') + '</div>'
        : '') +
      '<div style="margin-top:6px">ทดลอง: <a href="encyclopedia.html">สารานุกรมคำกฎหมาย</a> · ' +
        '<a href="concept.html">ชั้นแนวคิดทางกฎหมาย (ดัชนีแนวคิด)</a> ' +
        '(ส่วนเสริม ยังไม่รวมเข้าเส้นทางนำทางของ Atlas)</div>' +
      '<div style="margin-top:6px"><a href="index.html">← หน้าหลัก Cool Uncle</a> · ' +
        '<a href="codex-search.html">ค้นมาตรา</a> · ' +
        '<a href="neural-network.html">รัศมีนิติธรรม (กราฟ)</a></div>';
  }
})();
</script>
</body>
</html>
