<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thai Legal Atlas — สารบบกฎหมายไทย</title>
<meta name="description" content="Thai Legal Atlas — ชั้นนำทางเดียวเหนือโครงสร้างกฎหมายไทยหลายระบบ: ประมวลแพ่ง อาญา วิ.แพ่ง วิ.อาญา รัฐธรรมนูญ ปกครอง ทรัพย์สินทางปัญญา ฯลฯ โดยคงลำดับชั้นดั้งเดิมของกฎหมายแต่ละฉบับ">
<link rel="canonical" href="https://coolunclelab.com/atlas.html">
<!--
  Thai Legal Atlas — host page.
  Phase 2 deliverable: the NAVIGATION STRUCTURE only.
  The stylesheet below is a plain baseline. Phase 3 replaces/extends it —
  atlas-ui.js emits semantic `atlas-*` classes and no visual CSS, so a
  restyle should not need to touch the JS.
-->
<style>
  :root{
    --bg:#FBF9F4; --panel:#fff; --ink:#1f2430; --muted:#5b6472;
    --line:#e6e1d6; --accent:#2E4A7A; --accent-soft:#eaf0f8; --chip:#f2ede1;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --bg:#14161b;--panel:#1c1f27;--ink:#e8eaed;--muted:#9aa3b2;
    --line:#2c313c;--accent:#8fb4e8;--accent-soft:#20293a;--chip:#232733;}}
  :root[data-theme="dark"]{
    --bg:#14161b;--panel:#1c1f27;--ink:#e8eaed;--muted:#9aa3b2;
    --line:#2c313c;--accent:#8fb4e8;--accent-soft:#20293a;--chip:#232733;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"Sarabun","IBM Plex Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;
    line-height:1.65;font-size:15px}
  a{color:var(--accent);text-decoration:none}
  a:hover{text-decoration:underline}
  .atlas-wrap{max-width:1120px;margin:0 auto;padding:24px 24px 80px}
  /* single-document / reference content stays comfortably narrow inside the shell */
  .atlas-collection,.atlas-instrument{max-width:960px}
  .atlas-masthead{padding:26px 0 14px;border-bottom:2px solid var(--line);margin-bottom:18px}
  .atlas-masthead h1{margin:0 0 4px;font-size:26px;letter-spacing:-.01em}
  .atlas-masthead .sub{color:var(--muted);font-size:13.5px;max-width:62ch}
  .atlas-principle{margin-top:12px;font-size:12.5px;color:var(--muted);
    border-left:3px solid var(--accent);padding:4px 0 4px 10px}
  .atlas-loading,.atlas-error{padding:32px 6px;text-align:center;color:var(--muted)}
  .atlas-error{color:#b4453a}
  .atlas-empty{margin:10px 0;padding:18px 14px;text-align:center;color:var(--muted);
    font-size:12.5px;border:1px dashed var(--line);border-radius:10px;background:var(--bg)}
  .atlas-empty-planned{opacity:.85}

  .atlas-crumbs{font-size:13px;color:var(--muted);margin:0 0 16px;display:flex;
    flex-wrap:wrap;gap:6px;align-items:center}
  .atlas-crumb-sep{opacity:.5}
  .atlas-crumb-current{color:var(--ink);font-weight:600}

  /* Subject-area grouping communicates taxonomy — a labelled band, not a
     boxed dashboard panel. No surface, no border; a hairline separates areas. */
  .atlas-area{padding:0;margin:0 0 26px}
  .atlas-area + .atlas-area{border-top:1px solid var(--line);padding-top:20px}
  .atlas-area-planned{opacity:.6}
  .atlas-area-title{margin:0 0 10px;font-size:12px;font-weight:700;letter-spacing:.06em;
    text-transform:uppercase;color:var(--muted)}
  .atlas-tag{display:inline-block;font-size:10.5px;padding:1px 6px;border-radius:999px;
    background:var(--chip);color:var(--muted);margin-left:8px;vertical-align:middle;
    letter-spacing:normal;text-transform:none;font-weight:400}
  /* left-packed grid; 1–2 cards keep a readable fixed width, never span the row */
  .atlas-collection-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,320px));
    gap:10px;margin:0;justify-content:start}
  .atlas-collection-card{display:flex;gap:11px;align-items:flex-start;padding:12px 14px;
    border:1px solid var(--line);border-radius:10px;background:var(--panel);
    transition:border-color .12s,background .12s}
  .atlas-collection-card:hover{border-color:var(--accent);background:var(--accent-soft);text-decoration:none}
  .atlas-collection-card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .atlas-collection-card-planned{opacity:.55;cursor:not-allowed}
  .atlas-collection-icon{font-size:18px;line-height:1.2}
  .atlas-collection-body{display:flex;flex-direction:column;gap:3px}
  .atlas-collection-name{font-weight:600;font-size:14px}
  .atlas-collection-full{font-size:11.5px;color:var(--muted);line-height:1.45}
  .atlas-collection-meta{font-size:11px;color:var(--muted);margin-top:3px}

  .atlas-collection-header,.atlas-instrument-header{background:var(--panel);
    border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:16px}
  .atlas-collection-h1{margin:0 0 6px;font-size:19px}
  .atlas-level-path{font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;
    gap:6px;align-items:center;margin:8px 0}
  .atlas-level-path-label{font-weight:600;color:var(--muted)}
  /* every hierarchy chip gets the same neutral, non-interactive treatment —
     the terminal มาตรา/ข้อ chip must not read as a button */
  .atlas-level-chip{background:var(--chip);color:var(--muted);border-radius:6px;
    padding:1px 8px;font-weight:400}
  .atlas-level-chip-unit{background:var(--chip);color:var(--muted);font-weight:400}
  .atlas-level-arrow{opacity:.45;font-size:11px}
  .atlas-collection-facts{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;
    color:var(--muted);margin-top:6px}
  .atlas-fact-k{font-weight:600;margin-right:4px}
  .atlas-structure-note{margin:8px 0 0;font-size:12.5px;color:var(--muted);max-width:66ch;line-height:1.6}
  .atlas-source{margin:8px 0 0;font-size:11.5px;color:var(--muted)}

  .atlas-instrument-list{display:grid;gap:8px}
  .atlas-instrument-card{display:flex;flex-direction:column;gap:3px;padding:11px 14px;
    border:1px solid var(--line);border-radius:10px;background:var(--panel)}
  .atlas-instrument-card:hover{border-color:var(--accent);background:var(--accent-soft);text-decoration:none}
  .atlas-instrument-card-empty{opacity:.55}
  .atlas-instrument-type{font-size:11px;color:var(--accent);font-weight:700;
    text-transform:uppercase;letter-spacing:.03em}
  .atlas-instrument-title{font-size:14px;font-weight:600}
  .atlas-instrument-meta{font-size:11.5px;color:var(--muted)}

  .atlas-tree{list-style:none;margin:0;padding:0}
  .atlas-tree .atlas-tree{padding-left:16px;margin-left:7px;border-left:1px solid var(--line)}
  .atlas-node-row{display:flex;gap:8px;align-items:baseline;padding:5px 8px;
    border-radius:6px;border-left:2px solid transparent}
  .atlas-node-row:hover{background:var(--chip)}
  /* expanded node: emphasis is LOCAL to the node — a thin left rule + a
     stronger label, never a full-width tinted strip */
  .atlas-node-open > .atlas-node-row{border-left-color:var(--accent)}
  .atlas-node-open > .atlas-node-row .atlas-node-value{font-weight:600;color:var(--ink)}
  .atlas-node-toggle{border:0;background:none;color:var(--muted);cursor:pointer;
    font-size:11px;width:16px;flex:none;padding:0;font-family:inherit}
  .atlas-node-toggle:focus-visible{outline:2px solid var(--accent);outline-offset:1px;border-radius:3px}
  .atlas-node-label{cursor:pointer}
  .atlas-node-value{color:var(--ink)}
  .atlas-node-levelword{font-size:11px;color:var(--muted);margin-right:5px}
  .atlas-node-title{color:var(--muted);margin-left:5px}
  .atlas-node-count{font-size:11px;color:var(--muted);margin-left:6px}
  .atlas-provision-list{display:flex;flex-wrap:wrap;gap:6px;padding:8px 6px 14px 26px}
  .atlas-provision{display:inline-block;padding:3px 10px;border:1px solid var(--line);
    border-radius:6px;font-size:12.5px;background:var(--panel);color:var(--ink)}
  .atlas-provision:hover{border-color:var(--accent);background:var(--accent-soft);text-decoration:none}
  .atlas-provision:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  .atlas-provision-cancelled{opacity:.5;text-decoration:line-through}

  .atlas-foot{margin-top:40px;padding-top:16px;border-top:1px solid var(--line);
    font-size:12px;color:var(--muted);line-height:1.7}
  .atlas-foot code{background:var(--chip);border-radius:4px;padding:1px 5px;
    font-size:11px;white-space:nowrap}
  .atlas-foot a{margin:0 2px}
  .atlas-principle code{background:var(--chip);border-radius:4px;padding:1px 5px;font-size:11.5px}
  [hidden]{display:none!important}
</style>
</head>
<body>
<div class="atlas-wrap">
  <header class="atlas-masthead">
    <h1>Thai&nbsp;Legal&nbsp;Atlas</h1>
    <div class="sub">ชั้นนำทางและค้นพบเดียว เหนือโครงสร้างกฎหมายไทยหลายระบบ — โดยคงลำดับชั้นดั้งเดิมของกฎหมายแต่ละฉบับไว้ ไม่บีบให้เป็นทรงเดียวกัน</div>
    <div class="atlas-principle">สารบบเดียว หลายระบบกฎหมาย — ไล่จากสาขากฎหมาย → ฉบับกฎหมาย → ลำดับชั้นดั้งเดิมของฉบับนั้น → มาตราหรือข้อ → ตัวบท</div>
  </header>

  <div id="atlas-root"><div class="atlas-loading">กำลังโหลดสารบบกฎหมาย (codex-data.json)…</div></div>

  <footer class="atlas-foot" id="atlas-foot"></footer>
</div>

<script src="atlas-patches.js?v=20260907d"></script>
<script src="atlas-core.js?v=20260907d"></script>
<script src="atlas-ui.js?v=20260907d"></script>
<script>
(function () {
  'use strict';
  var CODEX_VERSION = '20260903b';
  var root = document.getElementById('atlas-root');
  var foot = document.getElementById('atlas-foot');

  Promise.all([
    fetch('codex-data.json?v=' + CODEX_VERSION).then(function (r) {
      if (!r.ok) throw new Error('codex-data.json ' + r.status); return r.json();
    }),
    AtlasCore.loadRegistry('collections-registry.json?v=20260907d')
  ]).then(function (res) {
    AtlasCore.attachCorpus(res[0]);
    AtlasUI.mount(root);
    renderFoot();
  }).catch(function (err) {
    root.innerHTML = '<div class="atlas-error">โหลดข้อมูลไม่สำเร็จ: ' +
      String(err && err.message || err) + '</div>';
  });

  function renderFoot() {
    var cols = AtlasCore.listCollections();
    var total = cols.reduce(function (s, c) { return s + c.articleCount; }, 0);
    var patches = (window.AtlasPatches && AtlasPatches.describe) ? AtlasPatches.describe() : [];
    foot.innerHTML =
      '<div>' + cols.length + ' collections · ' + total.toLocaleString('th-TH') +
        ' บทบัญญัติ · atlas-core ' + AtlasCore.version + ' · atlas-ui ' + AtlasUI.version + '</div>' +
      '<div style="margin-top:6px">ID ของบทบัญญัติทุกฉบับ resolve เป็น ' +
        '<code>codex-article-viewer.html?id=&lt;collection&gt;_&lt;number&gt;</code> เหมือนเดิม ' +
        '(หลายฉบับ: <code>&lt;collection&gt;_&lt;instrument&gt;::&lt;number&gt;</code>). Atlas เป็นชั้นเสริม ไม่แก้ ID เดิม</div>' +
      (patches.length
        ? '<div style="margin-top:6px">แก้ช่องว่างต้นฉบับ: ' +
          patches.map(function (p) { return p.collection + ' ' + p.range; }).join(' · ') + '</div>'
        : '') +
      '<div style="margin-top:6px"><a href="index.html">← หน้าหลัก Cool Uncle</a> · ' +
        '<a href="codex-search.html">ค้นมาตรา</a> · ' +
        '<a href="neural-network.html">รัศมีนิติธรรม (กราฟ)</a></div>';
  }
})();
</script>
</body>
</html>
