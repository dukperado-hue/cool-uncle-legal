    stats: [['SPEED', 1], ['POWER', 3], ['RANGE', 3], ['SAFETY', 5]] },
  vijay: { name: 'VIJAY', cn: 'THALAPATHY', th: 'วิชัย (แนวล้อ)', tag: 'DUAL GUNNER', col: '#ffb040',
    lines: ['J  TWO GUNS, SPLIT: FRONT + BACK (↑ = BOTH UP)', 'K  SLIDE & SHOOT (= STYLE RELOAD)', '24-ROUND MAGAZINE, THEN RELOAD', 'L  BULLET STORM (ULTIMATE)'],
    stats: [['SPEED', 5], ['POWER', 3], ['RANGE', 5], ['SAFETY', 1]] },
  ram: { name: 'RAM', cn: 'BEAST COMMANDER', th: 'ราม จรัญ (แนวล้อ)', tag: 'BEAST SUMMONER', col: '#ff8a1a',
    lines: ['J  RIFLE (PIERCES 2) · CLOSE = RIFLE BUTT', 'S+J IN THE AIR  POUNCE, GRAB, BODY SLAM', 'K  CALL A BEAST (TIGER / WOLVES / BEAR)', 'L  BEAST RAMPAGE · NEEDS THE BEAST GAUGE'],
    stats: [['SPEED', 3], ['POWER', 5], ['RANGE', 3], ['SAFETY', 3]] }
};
const CHAR_KEYS = ['wah', 'ma', 'fei', 'nine', 'siang', 'sura', 'li', 'ximen', 'chiru', 'dong', 'zhang', 'vijay', 'ram'];
const heroOf = p => CHARS[p && p.ch] || CHARS[CHOSEN] || CHARS.wah;
let CHOSEN = 'wah';
let NOINPUT = false;

// ---------- canvas ----------
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
cv.width = VW; cv.height = VH;
function resize() {
  let s = Math.min(innerWidth / VW, innerHeight / VH);
  if (s >= 1) s = Math.floor(s);
  cv.style.width = (VW * s) + 'px'; cv.style.height = (VH * s) + 'px';
}
addEventListener('resize', resize); resize();
ctx.imageSmoothingEnabled = false;

// ---------- utils ----------
const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const sign = v => v < 0 ? -1 : v > 0 ? 1 : 0;
const approach = (v, t, d) => v < t ? Math.min(v + d, t) : Math.max(v - d, t);
const overlap = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
function mulberry(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

// ---------- input ----------
const keys = {}, pressed = {};
const KEYMAP = {
  ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right',
  ArrowUp: 'up', KeyW: 'jump', ArrowDown: 'down', KeyS: 'down',
  ControlLeft: 'jump', Space: 'jump', KeyJ: 'shoot', KeyK: 'bomb', KeyR: 'restart', Enter: 'start',
  KeyM: 'music', KeyP: 'pause', Escape: 'pause', KeyC: 'chars', Digit1: 'c1', Digit2: 'c2', Digit3: 'c3', Digit4: 'c4', Digit5: 'c5', Digit6: 'c6', Digit7: 'c7', Digit8: 'c8', Digit9: 'c9', Digit0: 'c10', Minus: 'c11', Equal: 'c12', Backspace: 'c13', KeyL: 'ult', Numpad1: 'c1', Numpad2: 'c2', Numpad3: 'c3', Numpad4: 'c4', Numpad5: 'c5'
};
addEventListener('keydown', e => {
  const a = KEYMAP[e.code];
  audio.unlock();
  if (a) { if (!keys[a]) pressed[a] = true; keys[a] = true; e.preventDefault(); }
  else if (e.ctrlKey) e.preventDefault();          // Ctrl is the jump button: swallow browser shortcuts where the browser allows it
});
addEventListener('keyup', e => { const a = KEYMAP[e.code]; if (a) { keys[a] = false; e.preventDefault(); } });
const mouse = { l: false, x: 0, y: 0, click: false };
cv.addEventListener('mousedown', e => {
  audio.unlock(); cv.focus();
  const r = cv.getBoundingClientRect(); mouse.x = (e.clientX - r.left) * VW / r.width; mouse.y = (e.clientY - r.top) * VH / r.height;
  if (e.button === 0) { if (!mouse.l) { pressed.shoot = true; pressed.click = true; } mouse.l = true; }
  if (e.button === 2) pressed.bomb = true;
  e.preventDefault();
});
addEventListener('mouseup', e => { if (e.button === 0) mouse.l = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; mouse.l = false; });
cv.addEventListener('contextmenu', e => e.preventDefault());
let pad = {}, padPrev = {};
function pollPad() {
  pad = {};
  const gps = navigator.getGamepads ? navigator.getGamepads() : [];
  for (const g of gps) {
    if (!g) continue;
    const ax = g.axes[0] || 0, ay = g.axes[1] || 0, b = i => g.buttons[i] && g.buttons[i].pressed;
    pad.left = ax < -0.4 || b(14); pad.right = ax > 0.4 || b(15);
    pad.up = ay < -0.55 || b(12); pad.down = ay > 0.55 || b(13);
    pad.jump = b(0); pad.shoot = b(2) || b(7); pad.bomb = b(1) || b(6); pad.ult = b(3);
    pad.start = b(9); pad.restart = b(8);
    break;
  }
  for (const k in pad) if (pad[k] && !padPrev[k]) { pressed[k] = true; audio.unlock(); }
  padPrev = pad;
}
const held = a => !NOINPUT && !!(keys[a] || (a === 'shoot' && mouse.l) || pad[a]);

// ---------- audio (all procedural) ----------
const audio = (() => {
  let ac = null, sfx, mus, noiseBuf, musicOn = true, nextNote = 0, stepN = 0;
  const last = {};
  function unlock() {
    if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
    try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
    const comp = ac.createDynamicsCompressor(); comp.threshold.value = -12; comp.ratio.value = 6; comp.connect(ac.destination);
    const master = ac.createGain(); master.gain.value = 0.6; master.connect(comp);
    sfx = ac.createGain(); sfx.gain.value = 1; sfx.connect(master);
    mus = ac.createGain(); mus.gain.value = 0.2; mus.connect(master);
    const len = ac.sampleRate * 1.5; noiseBuf = ac.createBuffer(1, len, ac.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    nextNote = ac.currentTime + 0.1;
  }
  function env(g, t, a, peak, dec) {
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, peak), t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + a + dec);
  }
  function noise(t, dur, type, f0, f1, vol, q, out) {
    const s = ac.createBufferSource(); s.buffer = noiseBuf; s.loop = true;
    const f = ac.createBiquadFilter(); f.type = type; f.Q.value = q || 1;
    f.frequency.setValueAtTime(f0, t); if (f1) f.frequency.exponentialRampToValueAtTime(f1, t + dur);
    const g = ac.createGain(); env(g, t, 0.003, vol, dur);
    s.connect(f); f.connect(g); g.connect(out || sfx); s.start(t, Math.random()); s.stop(t + dur + 0.05);
  }
  function tone(t, dur, type, f0, f1, vol, out) {
    const o = ac.createOscillator(); o.type = type; o.frequency.setValueAtTime(f0, t);
    if (f1) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    const g = ac.createGain(); env(g, t, 0.003, vol, dur);
    o.connect(g); g.connect(out || sfx); o.start(t); o.stop(t + dur + 0.05);
  }
  const GAP = { shot: 0.03, eshot: 0.035, step: 0.06, hit: 0.025, tile: 0.03, boom: 0.04, bounce: 0.05 };
  function play(name, vol) {
    if (!ac || ac.state !== 'running') return;
    vol = vol || 1;
    const t = ac.currentTime;
    if (GAP[name] && last[name] && t - last[name] < GAP[name]) return;
    last[name] = t;
    const r = rnd(0.92, 1.08);
    switch (name) {
      case 'shot': noise(t, 0.07, 'bandpass', 2600 * r, 900, 0.32 * vol, 0.8); tone(t, 0.06, 'square', 190 * r, 55, 0.16 * vol); break;
      case 'eshot': noise(t, 0.08, 'bandpass', 1300 * r, 500, 0.16 * vol); tone(t, 0.07, 'triangle', 240 * r, 90, 0.1 * vol); break;
      case 'boom': { const v = Math.min(1.2, vol); noise(t, 0.5 + 0.6 * v, 'lowpass', 1900, 110, 0.9 * v, 0.7); tone(t, 0.5, 'sine', 95, 28, 0.75 * v); noise(t, 0.1, 'highpass', 3200, null, 0.25 * v); break; }
      case 'jump': tone(t, 0.08, 'square', 250, 520, 0.06); break;
      case 'land': noise(t, 0.07, 'lowpass', 520, 110, 0.28 * vol); break;
      case 'step': noise(t, 0.025, 'highpass', 2400, null, 0.045); break;
      case 'hit': tone(t, 0.04, 'square', 900 * r, 450, 0.07); noise(t, 0.04, 'bandpass', 3000, null, 0.1); break;
      case 'edie': tone(t, 0.26, 'sawtooth', 430 * r, 70, 0.11); noise(t, 0.12, 'bandpass', 800, null, 0.14); break;
      case 'crate': noise(t, 0.15, 'bandpass', 700 * r, 280, 0.42, 1.5); tone(t, 0.08, 'triangle', 140, 70, 0.2); break;
      case 'tile': noise(t, 0.05, 'bandpass', 1200 * r, null, 0.13, 2); break;
      case 'ric': tone(t, 0.09, 'sine', 2400 * r, 1400, 0.035); break;
      case 'throw': noise(t, 0.18, 'bandpass', 600, 2400, 0.12, 2); break;
      case 'bounce': tone(t, 0.04, 'triangle', 520, 300, 0.07); break;
      case 'warn': tone(t, 0.07, 'square', 1320, null, 0.06); tone(t + 0.09, 0.07, 'square', 1320, null, 0.06); break;
      case 'spin': tone(t, 0.7, 'sawtooth', 70, 640, 0.09); break;
      case 'hurt': tone(t, 0.2, 'square', 320, 90, 0.2); noise(t, 0.12, 'lowpass', 900, null, 0.22); break;
      case 'pickup': [660, 880, 1320].forEach((f, i) => tone(t + i * 0.05, 0.08, 'square', f, null, 0.07)); break;
      case 'ignite': noise(t, 0.28, 'highpass', 2000, 6000, 0.12); break;
      case 'check': [523, 659, 784].forEach((f, i) => tone(t + i * 0.07, 0.12, 'triangle', f, null, 0.15)); break;
      case 'roar': tone(t, 0.9, 'sawtooth', 120, 55, 0.22); noise(t, 0.9, 'lowpass', 700, 180, 0.3); break;
      case 'win': [523, 659, 784, 1046, 784, 1046, 1318].forEach((f, i) => tone(t + i * 0.11, 0.22, 'square', f, null, 0.1)); break;
      case 'slam': noise(t, 0.5, 'lowpass', 420, 60, 0.85); tone(t, 0.42, 'sine', 70, 25, 0.85); break;
      case 'die': tone(t, 0.6, 'square', 440, 60, 0.18); break;
      case 'rev': tone(t, 0.35, 'sawtooth', 90, 260, 0.13); noise(t, 0.3, 'bandpass', 300, 900, 0.12, 2); break;
      case 'skid': noise(t, 0.12, 'bandpass', 2600, 1800, 0.07, 6); break;
      case 'stomp': noise(t, 0.12, 'lowpass', 700, 120, 0.5); tone(t, 0.12, 'square', 160, 60, 0.18); break;
      case 'coo': for (let i = 0; i < 3; i++) { tone(t + i * 0.13, 0.12, 'sine', 520 + i * 40, 430, 0.08); noise(t + i * 0.05, 0.06, 'bandpass', 1800, null, 0.08, 3); } break;
      case 'romance': [[523, 659, 784], [587, 740, 880], [659, 830, 988], [784, 988, 1175]].forEach((c, i) => c.forEach(f => tone(t + i * 0.32, 0.5, 'triangle', f, null, 0.05))); break;
      case 'punch': noise(t, 0.07, 'lowpass', 1200, 300, 0.4); tone(t, 0.06, 'square', 220 * r, 90, 0.12); break;
      case 'whoosh': noise(t, 0.08, 'bandpass', 900 * r, 2400, 0.08, 2); break;
      case 'paper': noise(t, 0.09, 'highpass', 3000 * r, 6000, 0.08); break;
      case 'ghost': tone(t, 0.9, 'sine', 300, 600, 0.08); tone(t + 0.1, 0.8, 'sine', 450, 220, 0.06); tone(t, 0.3, 'triangle', 1800, 1700, 0.04); break;
      case 'fuse': noise(t, 0.25, 'highpass', 2500, 7000, 0.12); tone(t + 0.2, 0.4, 'sawtooth', 180, 900, 0.07); break;
      case 'hic': tone(t, 0.12, 'square', 300, 700, 0.1); tone(t + 0.13, 0.08, 'square', 500, 350, 0.06); break;
      case 'gulp': for (let i = 0; i < 4; i++) tone(t + i * 0.14, 0.09, 'sine', 180 + i * 10, 90, 0.18); break;
      case 'cough': noise(t, 0.12, 'bandpass', 700, 400, 0.3, 2); noise(t + 0.18, 0.1, 'bandpass', 650, 380, 0.25, 2); break;
      case 'blow': noise(t, 0.45, 'bandpass', 1200, 600, 0.12, 1.5); break;
      case 'slap': noise(t, 0.09, 'highpass', 1800, null, 0.6); noise(t, 0.05, 'lowpass', 900, null, 0.4); tone(t, 0.08, 'square', 600, 200, 0.12); break;
      case 'clang': tone(t, 0.25, 'square', 180, 150, 0.12); noise(t, 0.2, 'bandpass', 900, null, 0.25, 3); break;
    }
  }
  // tiny procedural action-movie groove: bass ostinato + kick/snare/hat, 138 bpm
  const BASS = [0, 0, 12, 0, 3, 0, 5, 7, 0, 0, 12, 0, 10, 0, 7, 5];
  const ROOTS = [40, 40, 36, 38];
  function music() {
    if (!ac || !musicOn || ac.state !== 'running') return;
    const s16 = 60 / 138 / 4;
    if (nextNote < ac.currentTime - 0.2) nextNote = ac.currentTime + 0.05;
    while (nextNote < ac.currentTime + 0.15) {
      const t = nextNote, s = stepN % 16, bar = Math.floor(stepN / 16) % 4;
      const n = ROOTS[bar] + BASS[s], f = 440 * Math.pow(2, (n - 69) / 12);
      if (s % 2 === 0 || BASS[s] > 0) tone(t, 0.11, 'sawtooth', f, null, 0.22, mus);
      if (s % 4 === 0) tone(t, 0.13, 'sine', 125, 40, 0.9, mus);
      if (s % 8 === 4) noise(t, 0.12, 'highpass', 1500, null, 0.45, 1, mus);
      if (s % 2 === 1) noise(t, 0.03, 'highpass', 7000, null, 0.12, 1, mus);
      if (bar === 3 && s >= 12) tone(t, 0.09, 'square', f * 2, null, 0.06, mus);
      nextNote += s16; stepN++;
    }
  }
  return {
    unlock, play, music,
    toggle() { musicOn = !musicOn; if (ac) nextNote = ac.currentTime + 0.05; },
    get on() { return musicOn; }, get ready() { return !!ac && ac.state === 'running'; }
  };
})();

// =====================================================================
// LEVEL
// =====================================================================
const LW = 232, LH = 22;
const T = { E: 0, G: 1, S: 2, B: 3, W: 4, C: 5, P: 6, D: 7 };   // empty, ground, steel, brick, wall, crate, one-way platform, door
const SOLID = [false, true, true, true, true, true, false, true];
const HPS = [0, 1e9, 1e9, 4, 7, 2, 0, 1e9];
const DESTRUCT = [false, false, false, true, true, true, false, false];
let tiles, thp, ruin;
const ARENA = { x0: 188, x1: 218, trigger: 192 };
// Metal Slug-style screen locks: camera holds, reinforcements arrive in waves, then "GO!"
const LOCKS = [
  { x0: 50, x1: 80, trig: 57, waves: [
    [['soldier', 77], ['soldier', 74], ['gunner', 64]],
    [['soldier', 53], ['heavy', 76], ['soldier', 70]]
  ] },
  { x0: 145, x1: 175, trig: 152, waves: [
    [['soldier', 166], ['soldier', 169], ['soldier', 149]],
    [['heavy', 170], ['gunner', 150], ['soldier', 160]]
  ] }
];

function buildLevel() {

  }

    const pr = o.byPlayer ? r * 0.42 : (o.barrel ? r * 0.6 : r * 0.75);

}
function explodeBarrel(b) {

// =====================================================================
// DAMAGE
// =====================================================================
function damageEnemy(e, dmg, srcX, explosive, chain) {
  if (e.dead) return;
  e.hp -= dmg; e.flash = 0.07; e.alerted = true;
  const dir = sign(e.x + e.w / 2 - srcX) || 1;
  if (e.type === 'heavy') { if (explosive) { e.stun = 0.9; e.vx = dir * 120; e.vy = -150; } }
  else {
    e.vx = dir * (explosive ? 160 : 55); if (!explosive) e.stun = Math.max(e.stun, 0.09);
    if (e.state === 'patrol') { e.state = 'react'; e.t = 0.15; }

  if (e.hp <= 0) killEnemy(e, dir, explosive, chain);
}
function killEnemy(e, dir, explosive, chain) {

  e.vy = explosive ? -rnd(260, 380) : -rnd(130, 190);

  if (c.n >= 2) popup(G.player.x + 5, G.player.y - 8, c.n >= 5 ? 'MASSACRE x' + c.n : 'KILL x' + c.n, c.n >= 5 ? '#ff5a3a' : '#ffe48a', false, 'combo');
  if (e.type === 'heavy') later(0.28, () => { popup(e.x + 8, e.y, 'FUEL TANK!', '#ff9a3a'); explode(e.x + e.w / 2, e.y + 8, 44, 16, { chain: chain || 0 }); });
}
function hurtPlayer(n, srcX, contact) {
  const p = G.player;
  if (p.dead || p.inv > 0 || G.mode !== 'play' || G.cine || p.superT > 0 || (p.lungeT > 0 && p.ch === 'ximen') || p.phantom || (p.ch === 'zhang' && p.stormT > 0)) return;
  // Ah Wah is untouchable while ramming: the bike is the armour

  p.hp -= n; p.inv = 1.1; p.flash = 0.1; G.stats.damage += n;
  const dir = sign(p.x + p.w / 2 - srcX) || -p.face;
  p.vx = dir * 170; p.vy = Math.min(p.vy, -170);
  shake(0.35); hitstop(0.06); audio.play('hurt');
  gore(p.x + p.w / 2, p.y + 8, 5, 0.6);
  if (p.hp <= 0) {
    p.dead = true; p.deadT = 0; p.vy = -280; G.stats.deaths++; audio.play('die');
    if (p.crouch) { p.crouch = false; p.y -= PC.standH - PC.crouchH; p.h = PC.standH; }
    popup(p.x + p.w / 2, p.y - 10, 'CUT!', '#ff4040', true);
    if (p.ch === 'wah') debris(p.x + 10, p.y + 12, 10, ['#b01818', '#222', '#888', '#e8e8e8'], 1);

}
function respawn() {

// =====================================================================
// PLAYER — shared
// =====================================================================
function gunTip(p) {
  const fx = p.x + p.w / 2, fy = p.y + p.h;
  const hy = p.hand ? 3 : 0, hx = p.hand ? -2 : 0;               // Siu Ma alternates hands
  if (p.aimUp) return { x: fx + p.face * (2.5 + hx), y: fy - 28, dx: 0, dy: -1 };
  if (p.aimDown) return { x: fx + p.face * (2.5 + hx), y: fy + 1, dx: 0, dy: 1 };
  if (p.crouch) return { x: fx + p.face * (11 + hx), y: fy - 6 + (p.hand ? 1 : 0), dx: p.face, dy: 0 };
  return { x: fx + p.face * (11 + hx), y: fy - 13 + hy, dx: p.face, dy: 0 };
}
function setCrouch(p, on) {
  if (on === p.crouch) return true;
  if (on) { p.crouch = true; p.y += PC.standH - PC.crouchH; p.h = PC.crouchH; return true; }
  if (solidRect(p.x, p.y - (PC.standH - PC.crouchH), p.w, PC.standH - PC.crouchH)) return false;
  p.crouch = false; p.y -= PC.standH - PC.crouchH; p.h = PC.standH; return true;
}
function doJumpLogic(p, ip, D, jumpV) {
  if (ip.jump) p.buffer = PC.buffer;
  p.buffer -= dtNow; p.dropT -= dtNow;
  p.coyote = p.onGround ? PC.coyote : p.coyote - dtNow;
  if (p.buffer > 0) {
    if (D && p.onGround && standingOnPlatformOnly(p)) {
      setCrouch(p, false); p.dropT = 0.22; p.buffer = 0; p.coyote = 0; p.y += 1;
    } else if (p.coyote > 0) {
      setCrouch(p, false);
      p.vy = -jumpV; p.buffer = 0; p.coyote = 0; p.cutDone = false; p.jumpT = 0.1;
      audio.play('jump'); dust(p.x + p.w / 2, p.y + p.h, 4, 4);
      return true;
    }
  }
  return false;
}
function throwBomb(p, ip) {
  p.bombCd -= dtNow;
  if (!(ip.bomb && p.bombCd <= 0)) return;
  if (p.bombs > 0) {
    p.bombs--; p.bombCd = 0.35;
    const cx = p.x + p.w / 2, cy = p.y + (p.crouch ? 4 : 6);
    let vx = p.face * 200 + p.vx * 0.45, vy = -240;
    if (p.aimUp) { vx = p.face * 70 + p.vx * 0.3; vy = -380; }
    else if (p.crouch) { vx = p.face * 230 + p.vx * 0.3; vy = -110; }
    G.bombs.push({ x: cx - 3, y: cy, w: 6, h: 6, vx, vy, fuse: 1.15, rot: 0, onGround: false, enemy: false, chain: 0 });
    audio.play('throw');
  } else { popup(p.x + p.w / 2, p.y - 10, 'NO DYNAMITE', '#aaa'); p.bombCd = 0.5; }
}
function landFx(p, vyBefore, wasGround) {
  if (p.onGround && !wasGround) {
    if (p.airT > 0.1) {
      p.landT = 0.11; audio.play('land', clamp(vyBefore / 500, 0.3, 1));
      dust(p.x + p.w / 2, p.y + p.h, vyBefore > 400 ? 7 : 3, 6);
      if (vyBefore > 480) shake(0.06);
    }
    p.airT = 0;
    return true;
  } else if (!p.onGround) p.airT += dtNow;
  return false;
}
function clampToLock(p) {
  if (!G.cam.lock) return;
  const lx = G.cam.lock.x0 + 2, rx = G.cam.lock.x1 - p.w - 2;
  if (p.x < lx) { p.x = lx; p.vx = Math.max(0, p.vx); } if (p.x > rx) { p.x = rx; p.vx = Math.min(0, p.vx); }
}
let dtNow = STEP;
function updatePlayer(dt, ip) {
  const p = G.player; dtNow = dt;
  p.animT += dt; p.inv -= dt; p.flash -= dt; p.landT -= dt; p.shootT -= dt; p.jumpT -= dt; p.drawT -= dt;
  if (p.dead) {
    p.deadT += dt; p.vy = Math.min(p.vy + PC.gDown * dt, PC.maxFall);
    moveBody(p, dt); if (p.onGround) p.vx = approach(p.vx, 0, 600 * dt);
    if (p.deadT > 1.5) respawn();
    return;
  }
  if (G.cine && G.cine.ghost) { p.x += p.vx * dt; return; }     // ride-off at the end ignores the level edge
  if (p.ch === 'wah') updateBike(p, dt, ip);
  else if (p.ch === 'fei') updFei(p, dt, ip);
  else if (p.ch === 'nine') updNine(p, dt, ip);
  else if (p.ch === 'siang') updSiang(p, dt, ip);
  else if (p.ch === 'sura') updSura(p, dt, ip);
  else if (p.ch === 'li') updLi(p, dt, ip);
  else if (p.ch === 'ximen') updXimen(p, dt, ip);
  else if (p.ch === 'chiru') updChiru(p, dt, ip);
  else if (p.ch === 'dong') updDong(p, dt, ip);
  else if (p.ch === 'zhang') updZhang(p, dt, ip);
  else if (p.ch === 'vijay') updVijay(p, dt, ip);
  else if (p.ch === 'ram') updRam(p, dt, ip);
  else updateGunman(p, dt, ip);
  if (p.y > LH * TS + 40) { p.hp = 1; p.inv = 0; hurtPlayer(1, p.x); }
}

// =====================================================================
// SIU MA — twin pistols, long coat, sunglasses (and doves)
// =====================================================================
// movement shared by every on-foot hero (tuned per hero)
const RUNCFG = { zhang: { run: 165, jump: 440 }, vijay: { run: 238, jump: 465 }, ram: { run: 212, jump: 470 }, chiru: { run: 205, jump: 470 }, dong: { run: 225, jump: 470 }, sura: { run: 198, jump: 460 }, li: { run: 195, jump: 450 }, ximen: { run: 208, jump: 460 }, ma: { run: 205, jump: 450 }, fei: { run: 215, jump: 480 }, nine: { run: 192, jump: 450 }, siang: { run: 208, jump: 455 } };
function moveRunner(p, dt, ip) {
  const C = RUNCFG[p.ch] || RUNCFG.ma;
  const L = held('left'), R = held('right'), D = held('down'), U = held('up');
  const dir = (R ? 1 : 0) - (L ? 1 : 0);
  if (p.superT > 0) { /* shadowless kick drives the body itself */ }
  else {
    if (p.onGround) setCrouch(p, D); else if (p.crouch) setCrouch(p, false);
    if (dir !== 0) p.face = dir;                                   // instant turn, even mid-air
    const maxV = p.crouch ? PC.crouchRun : C.run;
    const tv = dir * maxV;
    let a;
    if (p.onGround) a = dir === 0 ? PC.decG : (p.vx !== 0 && sign(p.vx) !== dir ? PC.turnG : PC.accG);
    else a = dir === 0 ? PC.decA : (p.vx !== 0 && sign(p.vx) !== dir ? PC.accA * 1.4 : PC.accA);
    if (Math.abs(p.vx) > maxV && sign(p.vx) === dir) a = PC.decA; // keep knockback / lunge momentum briefly
    p.vx = approach(p.vx, tv, a * dt);
  }
  doJumpLogic(p, ip, D, C.jump);
  if (!p.cutDone && p.vy < 0 && !held('jump')) { p.vy *= PC.cut; p.cutDone = true; }
  if (p.vy >= 0) p.cutDone = true;
  let g = p.vy < 0 ? PC.gUp : PC.gDown;
  if (Math.abs(p.vy) < 45 && held('jump')) g *= PC.apexHang;
  p.vy = Math.min(p.vy + g * dt, PC.maxFall);
  const wasGround = p.onGround, vyBefore = p.vy;
  moveBody(p, dt);
  clampToLock(p);
  if (p.hitCeil && p.vy === 0) p.cutDone = true;
  landFx(p, vyBefore, wasGround);
  if (WUXIA.has(p.ch)) wallRun(p, dt, dir, ip);
  if (p.onGround && Math.abs(p.vx) > 60) {
    p.runPhase += Math.abs(p.vx) * dt * 0.075;
    p.stepT -= dt;
    if (p.stepT <= 0) { p.stepT = p.crouch ? 0.3 : 0.17; audio.play('step'); if (Math.random() < 0.5) dust(p.x + 5 - p.face * 4, p.y + p.h, 1, 2); }
  } else if (p.onGround) p.runPhase = 0;
  p.aimUp = U && !p.crouch;
  p.aimDown = !p.onGround && D && !U;
  return { D, U, dir };
}
function updateGunman(p, dt, ip) {
  moveRunner(p, dt, ip);
  // the meme: sometimes, drawing the guns releases doves. Nobody knows where they were kept.
  G.doveCd -= dt;
  if (ip.shoot && G.doveCd <= 0 && Math.random() < 0.3) {
    G.doveCd = 4; spawnDoves(p.x + p.w / 2 + p.face * 6, p.y + 6, 5 + (Math.random() * 4 | 0), true);
  }
  p.fireCd -= dt;
  if ((held('shoot') || ip.shoot) && p.fireCd <= 0) fireTwin(p);
  throwBomb(p, ip);
}

// ---------- melee core (Fei-hung, Siang) ----------
function meleeSwing(p, o) {
  const fx = p.x + p.w / 2, fy = p.y + p.h;
  const box = { x: p.face > 0 ? fx : fx - o.reach, y: fy + o.y0, w: o.reach, h: o.y1 - o.y0 };
  let hit = false;
  if (o.dmg > 0) for (const e of G.enemies) if (!e.dead && overlap(box, e)) {
    damageEnemy(e, o.dmg, fx, !!o.launch);
    if (!o.launch && !e.dead) e.vx = p.face * (e.type === 'heavy' ? 20 : 45);   // small push keeps them in combo range
    hit = true; gore(e.x + e.w / 2, e.y + 8, 2, 0.4);
  }
  const b = G.boss;
  if (o.dmg > 0 && b && !b.dead && b.dying <= 0 && b.state !== 'enter' && b.state !== 'roar' && overlap(box, b)) { damageBoss(o.dmg, fx); hit = true; }
  if (o.dmg > 0) for (const br of G.barrels) if (!br.dead && overlap(box, br)) {
    hit = true;
    if (o.launch || o.kick) { br.vx = p.face * 260; br.vy = -190; br.kicked = true; if (br.lit < 0) { br.lit = 0.85; br.chain = ++G.chainSeq; audio.play('ignite'); } popup(br.x + 6, br.y - 6, 'KICK!', '#ffd23f'); }
    else { br.hp--; if (br.hp <= 0 && br.lit < 0) { br.lit = 0.75; br.chain = ++G.chainSeq; audio.play('ignite'); popup(br.x + 6, br.y - 8, 'RUN!', '#ff5a3a'); } }   // longer fuse: melee heroes get time to escape
  }
  let tileHit = false;
  for (let ty = Math.floor(box.y / TS); ty <= Math.floor((box.y + box.h - 1) / TS); ty++)
    for (let tx = Math.floor(box.x / TS); tx <= Math.floor((box.x + box.w - 1) / TS); tx++)
      if (o.dmg > 0 && DESTRUCT[tileAt(tx, ty)]) { damageTile(tx, ty, o.tile || 1); tileHit = true; }
  // fists and feet swat bullets out of the air
  for (let i = G.ebullets.length - 1; i >= 0; i--) {
    const eb = G.ebullets[i];
    if (eb.x > box.x - 3 && eb.x < box.x + box.w + 3 && eb.y > box.y - 3 && eb.y < box.y + box.h + 3) {
      G.ebullets.splice(i, 1); sparks(eb.x, eb.y, 4, p.face, '#ffffff'); G.stats.deflect++; hit = true;
    }
  }
  const sx = fx + p.face * o.reach * 0.8, sy = fy + (o.y0 + o.y1) / 2;
  if (o.quiet) return hit;
  if (hit) { G.stats.melee++; audio.play(p.ch === 'ximen' ? 'clang' : 'punch'); hitstop(0.028); sparks(sx, sy, 4, p.face, '#fff2b0'); if (p.ch === 'fei') p.chi = Math.min(3, p.chi + 0.1); }
  else if (tileHit) { audio.play('tile'); sparks(sx, sy, 2, -p.face, '#ffcf7a'); }
  else audio.play('whoosh');
  return hit;
}

// =====================================================================
// WONG FEI-HUNG — punch/kick combo + the Shadowless Kick
// =====================================================================
function updFei(p, dt, ip) {
  p.atkCd -= dt; p.comboT -= dt; p.swingT -= dt;
  p.chi = Math.min(3, p.chi + dt / 4.5);
  if (p.superT > 0) {
    p.superT -= dt; p.superTick -= dt;
    p.vx = p.face * 175; if (!p.onGround) p.vy = Math.min(p.vy, 30);
    if (p.superTick <= 0) {
      p.superTick = 0.055; p.kickFrame = (p.kickFrame + 1) % 4;
      meleeSwing(p, { dmg: 1.3, reach: 28, y0: -22, y1: -1, tile: 1 });
      part('after', p.x + p.w / 2, p.y + p.h, 0, 0, 0.18, 1, '#ffffff', { face: p.face, fr: p.kickFrame });
    }
  }
  moveRunner(p, dt, ip);
  if (p.superT > 0) return;
  if (ip.bomb) {
    if (p.chi >= 1) { p.chi -= 1; p.superT = 0.7; p.superTick = 0; p.kickFrame = 0; G.stats.supers++; popup(p.x + 5, p.y - 16, '無影腳  SHADOWLESS KICK!', '#ffe9b8'); audio.play('roar'); shake(0.15); }
    else popup(p.x + 5, p.y - 10, 'NOT ENOUGH CHI', '#aaa');
  }
  if ((held('shoot') || ip.shoot) && p.atkCd <= 0) {
    if (!p.onGround) {                                   // flying kick
      p.atkCd = 0.26; p.swingT = 0.2; p.swingK = 'fly';
      meleeSwing(p, { dmg: 3, reach: 24, y0: -14, y1: 2, launch: true, tile: 2 });
      p.vx += p.face * 60;
    } else {
      if (p.comboT <= 0) p.combo = 0;
      const k = p.combo % 4; p.combo++; p.comboT = 0.5;
      const big = k === 3;
      p.atkCd = big ? 0.3 : 0.13; p.swingT = big ? 0.16 : 0.1;
      p.swingK = big ? 'bigkick' : (k % 2 ? 'kick' : 'punch');
      meleeSwing(p, { dmg: big ? 4.5 : 2.5, reach: big ? 26 : (k % 2 ? 22 : 18), y0: p.crouch ? -10 : -20, y1: p.crouch ? 0 : -3, launch: big, kick: big, tile: big ? 2 : 1 });
      if (!p.crouch) p.vx += p.face * (big ? 90 : 35);
    }
  }
}

// =====================================================================

// SPIRIT WARD: while spirits are out, the closest one blinks in front of a bullet aimed at the priest (costs it 1s of life)
function spiritWard(p, b) {
  if (!G.allies.length || p.inv > 0) return false;
  const spirits = G.allies.filter(o => o.kind !== 'beast'); if (!spirits.length) return false;
  let a = spirits[0]; for (const o of spirits) if (Math.abs(o.x - p.x) < Math.abs(a.x - p.x)) a = o;

function updBride(dt) {

    if (B.st === 'hop' && B.vy > 0 && B.y + 18 >= groundBelow(B.x + 4, B.y + 10)) { B.y = groundBelow(B.x + 4, B.y + 10) - 18; B.st = 'wait'; B.face = 1; dust(B.x + 4, B.y + 18, 3, 4, '#e8e0f0'); }
    return;

function win() {

  const t = G.finalTime != null ? G.finalTime : G.time; G.time = t;
  G.newBest = G.best == null || t < G.best;
  if (G.newBest) { G.best = t; saveBest(t); }
  const acc = G.stats.shots ? G.stats.hits / G.stats.shots : 0;
  const d = G.stats.deaths;

  G.acc = acc;
}

// ---------- camera ----------
function camBounds() {
  const L = G.cam.lock;
  return { x0: L ? L.x0 : 0, x1: (L ? L.x1 : LW * TS) - VW, y0: 0, y1: LH * TS - VH };
}
function camTarget() {
  const p = G.player, c = G.cam, B = camBounds();
  return { x: clamp(p.x + p.w / 2 - VW / 2 + c.look, B.x0, B.x1), y: clamp(p.y + p.h / 2 - VH * 0.42, B.y0, B.y1) };
}

function updateCamera(dt) {
  const p = G.player, c = G.cam;
  const want = p.dead ? 0 : p.face * 46 + p.vx * 0.1;
  c.look += (want - c.look) * Math.min(1, dt * 2.6);
  const t = camTarget();
  c.x += (t.x - c.x) * Math.min(1, dt * 7);
  c.y += (t.y - c.y) * Math.min(1, dt * 4.5);

let LEVELCV = null, LCTX = null;
function rebuildLevelCanvas() {

function paintTile(tx, ty) {
  {
    const i = ty * LW + tx, t = tiles[i], x = tx * TS, y = ty * TS;
    if (t === T.E) { if (ruin[i]) LCTX.drawImage(TSPR.ruin, x, y); return; }
    let s;
    switch (t) {
      case T.G: s = tileAt(tx, ty - 1) === T.G ? TSPR.gmid : TSPR.gtop; break;
      case T.S: s = TSPR.steel; break;
      case T.B: { const f = thp[i] / HPS[T.B]; s = TSPR['brick' + (f > 0.7 ? 0 : f > 0.35 ? 1 : 2)]; break; }
      case T.W: { const f = thp[i] / HPS[T.W]; s = TSPR['wall' + (f > 0.7 ? 0 : f > 0.35 ? 1 : 2)]; break; }

      case T.P: s = TSPR.plat; break;

  txt(audio.on ? 'M:MUSIC ON' : 'M:MUSIC OFF', 118, 7, 'rgba(255,233,184,0.45)', 8, 'left', false);
  txt(heroOf(p).name, 118, 16, heroOf(p).col, 8, 'left');
  if (p.ch === 'wah') { const r = p.boostCd <= 0; txt(r ? 'BOOST' : 'BOOST..', 176, 16, r ? '#7dff8a' : '#6a6a6a', 8, 'left', false); txt('AIR DASH', 214, 16, p.airDash ? '#7dff8a' : '#6a6a6a', 8, 'left', false); }
  if (G.cine && G.cine.kind.indexOf('intro') === 0) { ctx.fillStyle = '#000'; ctx.fillRect(0, 0, VW, 20); ctx.fillRect(0, VH - 20, VW, 20); txt(heroOf(p).name + '  ' + heroOf(p).cn + '  —  ' + heroOf(p).tag, VW / 2, VH - 15, heroOf(p).col, 8, 'center', false); }
  const b = G.boss;
  if (b && !b.dead && b.state !== 'enter') {
    const w = 220, x = (VW - w) / 2, y = VH - 16;
    ctx.fillStyle = 'rgba(0,0,0,0.7)'; ctx.fillRect(x - 2, y - 10, w + 4, 16);
    txt('THE FOREMAN', x, y - 9, '#ffd23f', 8, 'left');
    ctx.fillStyle = '#3a1010'; ctx.fillRect(x, y, w, 4);
    ctx.fillStyle = b.flash > 0 ? '#fff' : (b.phase === 2 ? '#ff3a2a' : '#ff8a2a'); ctx.fillRect(x, y, w * b.hp / b.maxHp, 4);
  }
  if (p.dead) txt('TAKE 2...', VW / 2, VH / 2 - 20, '#ff5a3a', 14, 'center');
  if (G.goT > 0) { if (Math.floor(G.goT * 4) % 2) txt('GO!  >>', VW - 12, VH / 2 - 10, '#ffd23f', 16, 'right'); }
}
function drawBanner() {
  const b = G.banner, t = b.t;
  const k = t < 0.3 ? t / 0.3 : t > 2.7 ? 1 - (t - 2.7) / 0.5 : 1;
  ctx.fillStyle = 'rgba(0,0,0,' + (0.75 * k) + ')'; ctx.fillRect(0, 0, VW, 26 * k); ctx.fillRect(0, VH - 26 * k, VW, 26 * k);
  const x = -300 + Math.min(1, t / 0.35) * 300 + (t > 2.7 ? (t - 2.7) * 900 : 0);
  ctx.fillStyle = '#b01818'; ctx.fillRect(x + 40, 92, 400, 44);
  ctx.fillStyle = '#ffd23f'; ctx.fillRect(x + 40, 92, 400, 2); ctx.fillRect(x + 40, 134, 400, 2);
  txt(b.title, x + 240, 96, '#ffffff', 22, 'center');
  txt(b.sub, x + 240, 121, '#ffd23f', 8, 'center');
}
function drawPause() {
  ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(0, 0, VW, VH);
  txt('|| PAUSE', VW / 2, VH / 2 - 20, '#fff', 18, 'center');
  txt('P / ESC  RESUME     R  RESTART     C  CHANGE CHARACTER', VW / 2, VH / 2 + 6, '#ffe9b8', 8, 'center');
}
function drawTitle() {
  ctx.fillStyle = 'rgba(8,2,12,0.62)'; ctx.fillRect(0, 0, VW, VH);
  const t = G.clock;
  txt('▶ PLAY', 14, 12, '#e8f0ff', 10, 'left');
  txt('SP  ' + fmtTime(t % 600), VW - 14, 12, '#e8f0ff', 10, 'right');
  const jit = Math.random() < 0.06 ? rnd(-2, 2) : 0;
  ctx.save(); ctx.translate(VW / 2 + jit, 52);
  ctx.font = 'bold 40px monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  ctx.fillStyle = '#5a0a0a'; ctx.fillText('ONE MORE RUN', 3, 3);
  const g = ctx.createLinearGradient(0, 0, 0, 40); g.addColorStop(0, '#fff2a0'); g.addColorStop(0.5, '#ff9a2a'); g.addColorStop(1, '#d0281a');
  ctx.fillStyle = g; ctx.fillText('ONE MORE RUN', 0, 0);
  ctx.restore();
  txt('THE LOST TAPE  ·  STAGE 01 — THE OLD FACTORY', VW / 2, 98, '#ffd23f', 8, 'center');
  ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillRect(VW / 2 - 150, 116, 300, 98);
  const rows = [['MOVE', 'A / D  or  ← →'], ['JUMP', 'W  or  LEFT CTRL  (hold = higher)'], ['ATTACK', 'J  or  LEFT CLICK'], ['SPECIAL', 'K  or  RIGHT CLICK'], ['CROUCH', 'S / ↓   ·  drop through: S + CTRL'], ['AIM UP / DOWN', '↑  ·  S/↓ in the air'], ['RESTART · PAUSE', 'R  ·  P / ESC   ·  MUSIC: M'], ['GAMEPAD', 'A jump · X attack · B special']];
  rows.forEach((r, i) => { txt(r[0], VW / 2 - 140, 121 + i * 11, '#ffb070', 8, 'left'); txt(r[1], VW / 2 - 40, 121 + i * 11, '#ffe9b8', 8, 'left'); });
  txt('TIP: jump with W  —  or with Ctrl, but never press Ctrl+W (it closes the tab)', VW / 2, 216, '#ff9a7a', 8, 'center');
  if (Math.floor(t * 2) % 2 === 0) txt('PRESS ENTER / CTRL / CLICK TO CHOOSE YOUR HERO', VW / 2, 232, '#ffffff', 10, 'center');
}
function drawWin() {
  const t = G.winT, k = Math.min(1, t / 0.4);
  ctx.fillStyle = 'rgba(6,0,10,' + (0.72 * k) + ')'; ctx.fillRect(0, 0, VW, VH);
  if (t < 0.15) return;
  txt('STAGE CLEAR', VW / 2, 28, '#ffd23f', 28, 'center');
  txt('"THAT WAS RIDICULOUS."', VW / 2, 60, '#ffe9b8', 8, 'center');
  const s = G.stats;
  const mid = {
    wah: [['RAM HITS', String(s.rams)], ['CRUSHES', String(s.stomps)]],
    ma: [['ACCURACY', Math.round(G.acc * 100) + '%'], ['DOVES RELEASED', String(s.doves)]],
    fei: [['HITS LANDED', String(s.melee)], ['SHADOWLESS / DEFLECTS', s.supers + ' / ' + s.deflect]],
    nine: [['TALISMANS THROWN', String(s.shots)], ['SPIRITS / BULLETS EATEN', s.spirits + ' / ' + s.blocked]],
    siang: [['ROCKETS LAUNCHED', String(s.rockets)], ['MELEE HITS', String(s.melee)]],
    sura: [['AUTO-DODGES', String(s.dodges)], ['DRINKS', String(s.drinks)]],
    li: [['KNIVES THROWN', String(s.shots)], ['CHARGED / COUGHS', s.charged + ' / ' + s.coughs]],
    ximen: [['SLASH HITS', String(s.melee)], ['BLOOD BLOWN OFF', String(s.blows)]],
    chiru: [['SLAP LAUNCHES', String(s.slaps)], ['DOMINO HITS / HERO ENTRIES', s.domino + ' / ' + s.ults]],
    dong: [['NEEDLE VOLLEYS', String(s.shots)], ['THOUSAND NEEDLES', String(s.ults)]],
    zhang: [['BULLETS ABSORBED', String(s.absorbed)], ['SENT BACK / TAI CHI STORMS', s.reflected + ' / ' + s.ults]],
    vijay: [['ROUNDS FIRED', String(s.shots)], ['RELOADS / SLIDES', s.reloads + ' / ' + s.slides]],
    ram: [['BEASTS CALLED', String(s.beasts)], ['POUNCES / RAMPAGES', s.pounces + ' / ' + s.ults]] }[G.player.ch];
  const rows = [['TIME', fmtTime(G.time) + (G.newBest ? '   NEW BEST!' : '')], ['KILLS', String(s.kills)], ...mid, ['BARRELS BLOWN', String(s.barrels)], ['BIGGEST CHAIN', 'x' + s.maxChain], ['RETAKES (DEATHS)', String(s.deaths)]];
  txt(heroOf(G.player).name + '  ' + heroOf(G.player).cn, VW / 2, 74, heroOf(G.player).col, 8, 'center');
  rows.forEach((r, i) => { if (t > 0.3 + i * 0.12) { txt(r[0], VW / 2 - 110, 90 + i * 14, '#ffb070', 8, 'left'); txt(r[1], VW / 2 + 110, 90 + i * 14, r[1].includes('BEST') ? '#7dff8a' : '#fff', 8, 'right'); } });
  if (t > 1.3) {
    const sc = Math.max(1, 3 - (t - 1.3) * 8);
    ctx.save(); ctx.translate(VW / 2 + 170, 120); ctx.scale(sc, sc);
    txt(G.rank, 0, -20, G.rank === 'S' ? '#ffd23f' : '#ff9a3a', 36, 'center'); ctx.restore();
    txt('RANK', VW / 2 + 170, 150, '#ffb070', 8, 'center');
  }
  if (t > 1.0 && Math.floor(t * 2) % 2 === 0) txt('R / ENTER / SPACE  —  ONE MORE RUN', VW / 2, 196, '#ffffff', 10, 'center');
  if (t > 1.0) txt('C  —  CHANGE CHARACTER', VW / 2, 212, '#ffb070', 8, 'center');
}

// =====================================================================
// MAIN LOOP
// =====================================================================
let lastT = performance.now(), acc = 0;
function startGame() { newGame('play'); audio.unlock(); acc = 0; startIntro(); }
function frame(now) {
  let dt = Math.min(0.1, (now - lastT) / 1000); lastT = now;
  pollPad();
  const ip = {}; for (const k in pressed) { ip[k] = true; delete pressed[k]; }
  if (ip.music) audio.toggle();
  if (G.mode === 'title' || G.mode === 'select') {
    G.clock += dt; G.cam.x = (G.cam.x + dt * 20) % (40 * TS); G.cam.y = 18 * TS - VH * 0.75;
    if (G.mode === 'title') { if (ip.start || ip.jump || ip.shoot) enterSelect(); }
    else {
      G.selT += dt; updUIDoves(dt);
      const n = CHAR_KEYS.length;
      if (ip.left) { G.sel = (G.sel + n - 1) % n; audio.play('bounce'); }
      if (ip.right) { G.sel = (G.sel + 1) % n; audio.play('bounce'); }
      if (ip.up || ip.down) { G.sel = G.sel < CARD.cols ? Math.min(G.sel + CARD.cols, n - 1) : G.sel - CARD.cols; audio.play('bounce'); }
      let num = -1; ['c1', 'c2', 'c3', 'c4', 'c5', 'c6', 'c7', 'c8', 'c9', 'c10', 'c11', 'c12', 'c13'].forEach((c, i) => { if (ip[c] && i < n) num = i; });
      if (num >= 0) G.sel = num;
      let go = G.selT > 0.25 && (ip.start || ip.jump || (ip.shoot && !ip.click) || num >= 0);
      if (ip.click && G.selT > 0.25) { const c = cardAt(mouse.x, mouse.y); if (c >= 0) { if (c === G.sel) go = true; G.sel = c; } }
      if (go) { CHOSEN = CHAR_KEYS[G.sel]; audio.play('check'); startGame(); }
    }
  } else {
    if (ip.chars && (G.paused || G.mode === 'win')) { enterSelect(); }
    else if (ip.restart) { startGame(); }
    else if (G.mode === 'win') {
      G.winT += dt; G.clock += dt;
      acc += dt; while (acc >= STEP) { step(STEP, {}); acc -= STEP; }
      if (G.winT > 0.9 && (ip.start || ip.jump)) startGame();
    } else {
      if (ip.pause) G.paused = !G.paused;
      if (!G.paused) {
        for (const k in ip) G.pin[k] = true;
        acc += dt * G.timeScale; let n = 0;
        while (acc >= STEP && n < 24) { step(STEP, G.pin); G.pin = {}; acc -= STEP; n++; }
        if (n >= 24) acc = 0;
      }
    }
  }
  audio.music();
  render();
  requestAnimationFrame(frame);
}
buildTileSprites(); buildBackgrounds();
newGame('title');
G.cam.y = 18 * TS - VH * 0.75;
cv.focus();
requestAnimationFrame(frame);

// small hook for automated tests / debugging (harmless in normal play)
window.ONE = {
  get G() { return G; }, PC, TS, step, startGame, newGame, render, explode, enterSelect, setChar(k) { CHOSEN = k; },
  tile: (x, y) => tileAt(x, y),
  teleport(tx, row) { const p = G.player; p.x = tx * TS + 3; p.y = (row || 18) * TS - p.h; p.vx = p.vy = 0; snapCamera(); }
};
