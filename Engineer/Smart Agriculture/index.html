<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ผังน้ำไร่</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: full-height map on the left, working panel on the right (stacks under the map on phones).
   Palette: cool field-paper neutrals, water blue as the single accent; status colors kept separate. */
:root{
  --bg:#eef2ee; --panel:#fbfcfa; --ink:#15211b; --muted:#5b6a61; --line:#d4dcd5; --soft:#e6ece7;
  --water:#1b6aa8; --water-soft:#dcebf7; --on-water:#ffffff;
  --ok:#2c8a4b; --warn:#b97a0c; --bad:#c03a2b; --ok-soft:#e1f2e6; --warn-soft:#f8eed8; --bad-soft:#f8e1de;
  --font-display:"Bai Jamjuree","IBM Plex Sans Thai",system-ui,sans-serif;
  --font-body:"IBM Plex Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:8px;
  --stage-1:#e9eee9; --stage-2:#d5ddd6; --floor:#f4f2ec; --floor-l:#d6d1c5; --floor-r:#bfb9ab; --floor-grid:rgba(60,72,62,.09); --shadow:rgba(24,34,28,.16); --tag:#ffffff; --tag-ink:#15211b;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0e1411; --panel:#141c18; --ink:#e4ebe6; --muted:#93a39a; --line:#27332d; --soft:#1b2520;
  --water:#5aa8e4; --water-soft:#16293a; --on-water:#06121c;
  --ok:#5cc07c; --warn:#e2a93c; --bad:#ec6a5a; --ok-soft:#163222; --warn-soft:#33270f; --bad-soft:#3a1914;
  --stage-1:#1b2420; --stage-2:#0e1411; --floor:#2a332e; --floor-l:#1f2723; --floor-r:#171d1a; --floor-grid:rgba(220,235,225,.06); --shadow:rgba(0,0,0,.35); --tag:#1d2722; --tag-ink:#e4ebe6;
  color-scheme:dark; } }
:root[data-theme="dark"]{
  --stage-1:#1b2420; --stage-2:#0e1411; --floor:#2a332e; --floor-l:#1f2723; --floor-r:#171d1a; --floor-grid:rgba(220,235,225,.06); --shadow:rgba(0,0,0,.35); --tag:#1d2722; --tag-ink:#e4ebe6;
  --bg:#0e1411; --panel:#141c18; --ink:#e4ebe6; --muted:#93a39a; --line:#27332d; --soft:#1b2520;
  --water:#5aa8e4; --water-soft:#16293a; --on-water:#06121c;
  --ok:#5cc07c; --warn:#e2a93c; --bad:#ec6a5a; --ok-soft:#163222; --warn-soft:#33270f; --bad-soft:#3a1914;
  color-scheme:dark; }
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 var(--font-body);display:flex;flex-direction:column;overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--water);outline-offset:2px}
.num,.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}

/* top bar */
.top{display:flex;align-items:center;gap:16px;padding:8px 16px;padding-top:calc(8px + env(safe-area-inset-top,0px));background:var(--panel);border-bottom:1px solid var(--line);position:relative;z-index:20;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;min-width:0}
.brand b{font:700 17px/1.1 var(--font-display);display:block}
.brand small{color:var(--muted);font-size:12px;display:block;max-width:180px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.steps{display:flex;gap:2px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
.steps button{border:0;background:none;padding:6px 10px;border-radius:6px;white-space:nowrap;color:var(--muted);display:flex;gap:6px;align-items:center}
.steps button i{font:500 11px var(--font-mono);font-style:normal;border:1px solid currentColor;border-radius:50%;width:19px;height:19px;display:grid;place-items:center}
.steps button:hover{background:var(--soft);color:var(--ink)}
.steps button.on{background:var(--ink);color:var(--panel)}
.topActions{display:flex;gap:6px;position:relative}
.ghost{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:5px 10px}
.ghost:hover{background:var(--soft)}
.menu{position:absolute;right:0;top:calc(100% + 6px);background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 10px 30px rgba(0,0,0,.18);padding:6px;min-width:260px;display:flex;flex-direction:column}
.menu button{border:0;background:none;text-align:left;padding:7px 10px;border-radius:5px}
.menu button:hover{background:var(--soft)}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 0}

/* main layout */
.layout{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 380px;min-height:0}
.mapWrap{position:relative;min-width:0;min-height:0;overflow:hidden}
#map{position:absolute;inset:0;overflow:hidden;touch-action:none;cursor:grab;
  background-color:#26302b;background-image:linear-gradient(rgba(255,255,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.06) 1px,transparent 1px);background-size:32px 32px}
#map.drawing{cursor:crosshair}
#map.panning{cursor:grabbing}
#map .tiles{position:absolute;inset:0}
#map .tile{position:absolute;left:0;top:0;width:256px;height:256px;transform-origin:0 0;opacity:0;transition:opacity .2s;user-select:none;pointer-events:none}
#map .tile.ok{opacity:1}
#map canvas{position:absolute;inset:0;width:100%;height:100%}
.mapTop{position:absolute;top:12px;left:12px;right:12px;display:flex;align-items:flex-start;justify-content:space-between;gap:8px;pointer-events:none}
.mapTop>*{pointer-events:auto}
.seg{display:flex;background:rgba(15,22,18,.82);border-radius:7px;padding:3px;backdrop-filter:blur(4px)}
.seg button{border:0;background:none;color:#cfd9d2;padding:4px 10px;border-radius:5px;font-size:13px}
.seg button.on{background:#f1f5f2;color:#15211b}
.zoomBtns{display:flex;flex-direction:column;gap:4px}
.zoomBtns button{width:34px;height:34px;border:0;border-radius:7px;background:rgba(15,22,18,.82);color:#fff;font-size:18px;line-height:1}
.drawBar{position:absolute;top:56px;left:50%;transform:translateX(-50%);display:flex;gap:6px;align-items:center;background:rgba(15,22,18,.9);color:#fff;padding:6px 6px 6px 12px;border-radius:9px;max-width:calc(100% - 24px);flex-wrap:wrap}
.drawBar span{font-size:13px}
.drawBar button{border:0;border-radius:6px;padding:4px 10px;background:#33413a;color:#fff}
.drawBar button.primary{background:#4fb3ff;color:#06121c;font-weight:600}
.verdict{position:absolute;left:12px;bottom:26px;max-width:min(420px,calc(100% - 24px));background:var(--panel);border-radius:var(--r);box-shadow:0 8px 28px rgba(0,0,0,.28);padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.verdict select{border:1px solid var(--line);border-radius:6px;background:var(--panel);padding:3px 6px;max-width:100%}
.verdict .head{font:600 15px/1.35 var(--font-display);display:flex;gap:8px;align-items:flex-start}
.verdict .sub{color:var(--muted);font-size:12.5px}
.legend{position:absolute;right:12px;bottom:26px;background:rgba(15,22,18,.82);color:#e8efe9;border-radius:7px;padding:8px 10px;font-size:12px;display:flex;flex-direction:column;gap:4px}
.legend .row{display:flex;align-items:center;gap:6px}
.legend .sw{width:16px;height:4px;border-radius:2px}
.legend .dot{width:9px;height:9px;border-radius:50%}
.legend .seg{background:none;padding:0;margin-bottom:2px}
.legend .seg button{padding:2px 7px;font-size:12px}
.attrib{position:absolute;right:0;bottom:0;font-size:10.5px;background:rgba(255,255,255,.75);color:#222;padding:1px 6px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.attrib a{color:inherit}

/* panel */
.panel{background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;padding:16px;padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px;min-width:0}
.panel h2{font:600 20px/1.25 var(--font-display);margin:0;text-wrap:balance}
.panel h3{font:600 14px/1.3 var(--font-display);margin:0;letter-spacing:.02em}
.panel p{margin:0;color:var(--muted)}
.eyebrow{font:500 11px var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.card{border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:10px}
.card.sel{border-color:var(--water);box-shadow:0 0 0 1px var(--water)}
.btnrow{display:flex;gap:6px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:6px 11px}
.btn:hover{background:var(--soft)}
.btn.primary{background:var(--water);border-color:var(--water);color:var(--on-water);font-weight:600}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--bad)}
.btn.on{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.btn.sm{padding:3px 8px;font-size:13px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px}
.fld{display:flex;flex-direction:column;gap:3px;min-width:0}
.fld.full{grid-column:1/-1}
.fld label{font-size:12px;color:var(--muted)}
.fld input,.fld select{border:1px solid var(--line);border-radius:6px;padding:5px 8px;background:var(--panel);width:100%;min-width:0}
.fld .unit{display:flex;align-items:center;border:1px solid var(--line);border-radius:6px;background:var(--panel)}
.fld .unit input{border:0;font-family:var(--font-mono)}
.fld .unit span{padding:0 8px;color:var(--muted);font-size:12px;white-space:nowrap}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:8px}
.stat{background:var(--soft);border-radius:6px;padding:8px 10px;min-width:0}
.stat b{display:block;font:500 18px/1.2 var(--font-mono);font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.list .item{display:flex;align-items:center;gap:8px;padding:7px 10px;border:0;border-top:1px solid var(--line);background:none;text-align:left;width:100%}
.list .item:first-child{border-top:0}
.list .item:hover{background:var(--soft)}
.list .item.sel{background:var(--water-soft)}
.list .item .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list .item small{color:var(--muted);font-family:var(--font-mono);font-size:12px;white-space:nowrap}
.ico{width:22px;height:22px;border-radius:5px;display:grid;place-items:center;font-size:11px;font-weight:600;color:#fff;flex:none}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:1px 8px;font-size:12px;font-weight:500;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.off{background:var(--soft);color:var(--muted)}
.toggle{display:flex;align-items:center;gap:8px;padding:6px 10px;border-top:1px solid var(--line)}
.toggle:first-child{border-top:0}
.toggle .grow{flex:1;min-width:0}
.switch{position:relative;width:38px;height:22px;flex:none}
.switch input{opacity:0;position:absolute;inset:0;margin:0;cursor:pointer}
.switch span{position:absolute;inset:0;border-radius:11px;background:var(--line);transition:.15s;pointer-events:none}
.switch span::after{content:"";position:absolute;width:16px;height:16px;border-radius:50%;background:#fff;top:3px;left:3px;transition:.15s;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.switch input:checked+span{background:var(--water)}
.switch input:checked+span::after{left:19px}
.note{font-size:12.5px;color:var(--muted);border-left:3px solid var(--line);padding-left:10px}
.warnbox{font-size:13px;border-radius:6px;padding:8px 10px;background:var(--warn-soft);color:var(--ink)}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{text-align:left;padding:5px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:500;color:var(--muted);font-size:12px}
td.n{font-family:var(--font-mono);text-align:right;white-space:nowrap}
.curve{width:100%;height:auto;display:block}
.curve text{font:10px var(--font-mono);fill:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:8px 14px;border-radius:8px;z-index:50;max-width:calc(100% - 32px)}
.searchRow{display:flex;gap:6px}
.searchRow input{flex:1;min-width:0;border:1px solid var(--line);border-radius:6px;padding:6px 9px;background:var(--panel)}
.results .item{cursor:pointer}

@media (max-width:860px){
  body{overflow:auto;height:auto;min-height:100%}
  .layout{display:flex;flex-direction:column}
  .mapWrap{height:62vh;min-height:360px;flex:none}
  .panel{border-left:0;border-top:1px solid var(--line);overflow:visible}
  .steps{order:3;flex-basis:100%}
  .verdict{bottom:22px;max-width:calc(100% - 24px)}
  .legend{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---------- mode switch + formula sandbox ---------- */
.modeSw{display:flex;background:var(--soft);border-radius:8px;padding:3px;gap:2px}
.modeSw button{border:0;background:none;padding:5px 12px;border-radius:6px;color:var(--muted);font-weight:500;white-space:nowrap}
.modeSw button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
body.mode-simple .steps{visibility:hidden}
body.mode-simple #btnFile{display:none}
.isoWrap{position:relative;min-width:0;min-height:0;overflow:hidden}
#isoStage,#houseStage{position:absolute;inset:0;overflow:hidden;touch-action:none;background:var(--stage-2)}
#isoStage canvas,#houseStage canvas{position:absolute;inset:0;width:100%;height:100%;cursor:grab}
.simCtl{position:absolute;top:12px;right:12px;display:flex;flex-wrap:wrap;gap:4px;justify-content:flex-end;max-width:calc(100% - 24px)}
.simCtl button{min-width:34px;height:34px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);font-size:16px;line-height:1;box-shadow:0 2px 6px rgba(0,0,0,.08)}
.simCtl button.wide{font-size:13px;padding:0 10px}
.simCtl button.on{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.simHint{position:absolute;left:12px;bottom:12px;font-size:12.5px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:4px 10px;max-width:calc(100% - 24px)}
.simMenu{position:absolute;z-index:6;width:300px;max-width:calc(100% - 16px);background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 14px 40px rgba(0,0,0,.25);padding:10px;display:flex;flex-direction:column;gap:9px}
.simMenu .mhead{display:flex;justify-content:space-between;align-items:center;font-family:var(--font-display)}
.simMenu .x{border:0;background:none;font-size:20px;line-height:1;color:var(--muted);padding:0 4px}
.msec{display:flex;flex-direction:column;gap:5px}
.msec>span{font-size:12px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chips button{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:4px 9px;font-size:13px}
.chips button:hover{background:var(--water-soft);border-color:var(--water)}
.dirBtn{min-width:36px;font-size:17px!important;line-height:1.1;padding:3px 0!important;font-family:var(--font-mono)}
.dirBtn.on{background:var(--water)!important;color:var(--on-water);border-color:var(--water)!important}
.segc{display:flex;background:var(--soft);border-radius:7px;padding:3px;gap:2px}
.segc button{flex:1;border:0;background:none;border-radius:5px;padding:4px 8px;color:var(--muted)}
.segc button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.pumpGrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.pumpCard{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px;text-align:left;display:flex;flex-direction:column;gap:2px;min-width:0}
.pumpCard svg{width:44px;height:30px}
.pumpCard b{font-size:13.5px}
.pumpCard small{font-size:11.5px;color:var(--muted);line-height:1.35}
.pumpCard.on{border-color:var(--water);box-shadow:0 0 0 1px var(--water);background:var(--water-soft)}
input[type=range]{width:100%;accent-color:var(--water)}
.toggle.bordered{border:1px solid var(--line);border-radius:8px}
.outRow{display:flex;align-items:center;gap:10px;padding:8px 10px;border-top:1px solid var(--line)}
.outRow:first-child{border-top:0}
.outRow.sel{background:var(--water-soft)}
.linkish{border:0;background:none;text-align:left;padding:0;display:flex;flex-direction:column;gap:2px;min-width:0}
.linkish small{color:var(--muted);font-family:var(--font-mono);font-size:12px}
.meter{position:relative;height:6px;border-radius:3px;background:var(--bad-soft);margin-top:4px}
.meter .zone{position:absolute;top:0;bottom:0}
.meter .zone.weak{background:var(--warn-soft)}
.meter .zone.good{background:var(--ok-soft);border-radius:0 3px 3px 0}
.meter i{position:absolute;top:-3px;width:4px;height:12px;border-radius:2px;margin-left:-2px;box-shadow:0 0 0 2px var(--panel)}
.ladder{display:flex;flex-direction:column;gap:5px}
.lrow{display:grid;grid-template-columns:minmax(0,1fr) 80px 60px;gap:8px;align-items:center;font-size:12.5px}
.lrow.sub{font-size:11.5px;color:var(--muted)}
.lrow.sub .lt{padding-left:12px}
.lrow .lbar{height:8px;background:var(--soft);border-radius:4px;overflow:hidden}
.lrow .lbar i{display:block;height:100%;border-radius:4px}
.lrow .lbar i.pos{background:var(--water)}
.lrow .lbar i.neg{background:var(--bad)}
.lrow .lv{text-align:right}
.lrow.total{border-top:1px solid var(--line);padding-top:6px;font-weight:600}
details summary{cursor:pointer;color:var(--water);font-size:13px}
.formula{display:flex;flex-direction:column;gap:6px;font-size:12.5px;margin-top:8px}
.formula p{color:var(--ink)}
@media (max-width:860px){
  .modeSw{order:2}
  body.mode-simple .steps{display:none}
  .isoWrap{height:60vh;min-height:360px;flex:none}
}

/* ---------- house plumbing editor ---------- */
.hTools{position:absolute;top:12px;left:12px;display:flex;flex-direction:column;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px;box-shadow:0 4px 14px rgba(0,0,0,.1);max-height:calc(100% - 24px);overflow-y:auto;width:124px;z-index:3}
.hTools button{border:0;background:none;text-align:left;padding:5px 8px;border-radius:6px;font-size:13px;color:var(--ink)}
.hTools button:hover{background:var(--soft)}
.hTools button.on{background:var(--water);color:var(--on-water)}
.hTools .sep{font:500 10.5px var(--font-mono);letter-spacing:.06em;color:var(--muted);padding:6px 8px 2px;border-top:1px solid var(--line);margin-top:2px}
.hTools .row{display:flex;gap:2px}
.hTools .row button{flex:1;text-align:center;font-size:16px;padding:4px 0}
.hBar{position:absolute;top:12px;left:148px;right:12px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:rgba(15,22,18,.9);color:#fff;padding:6px 6px 6px 12px;border-radius:9px;z-index:3}
.hBar span{font-size:13px}
.hBar .lvl{color:#bfe0ff;margin-left:auto}
.hBar button{border:0;border-radius:6px;padding:4px 10px;background:#33413a;color:#fff}
.hBar button.primary{background:#4fb3ff;color:#06121c;font-weight:600}
.pumpSpec{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.pumpRow{border-top:1px solid var(--line);padding:8px 0}
.pumpRow:first-of-type{border-top:0}
.pumpRow .note{font-size:12px}
@media (max-width:860px){
  .hTools{flex-direction:row;flex-wrap:wrap;width:auto;right:12px;max-height:none;padding:4px}
  .hTools .sep{display:none}
  .hTools button{padding:4px 7px;font-size:12px}
  .hBar{top:auto;bottom:12px;left:12px}
}

.simMenu .msec b{color:var(--water)}
.hTools{width:150px}
.hBar{left:174px}

</style>
</head>
<body>
<header class="top">
  <div class="brand">

<script>
/* ===== Hyd: steady-state pipe network solver (Global Gradient Algorithm, Todini & Pilati) =====
   Units inside: flow m³/s, head m, length m, diameter m.
   net.nodes: [{fixed:bool, head:number(if fixed), elev:number}]
   net.links: [{a, b, type:'pipe'|'pump'|'emit', ...}]
     pipe : r, m  (h = r·Q^1.852 Hazen-Williams + m·Q² fittings)
     pump : A, B, cap?  (gain = min(cap, A − B·Q²), built-in check valve)
     emit : K, x  (Q = K·p^x, flows from junction a to an atmosphere node b; no backflow)
*/
var Hyd = (function () {
  var G_REV = 1e8, QMIN = 1e-7;

  function hwR(L, D, C) { return 10.67 * L / (Math.pow(C, 1.852) * Math.pow(D, 4.871)); }

  // returns [headloss a→b, d(headloss)/dQ]
  function hg(l, Q) {
    if (l.type === 'pipe') {
      var aq = Math.abs(Q), m = l.m || 0;
      if (aq < QMIN) { var g0 = 1.852 * l.r * Math.pow(QMIN, 0.852) + 2 * m * QMIN; return [g0 * Q, g0]; }
      var h = l.r * Math.pow(aq, 1.852) + m * aq * aq;
      return [Q < 0 ? -h : h, 1.852 * l.r * Math.pow(aq, 0.852) + 2 * m * aq];
    }
    if (l.type === 'pump') {
      var top = l.cap != null ? Math.min(l.A, Math.max(0, l.cap)) : l.A;
      if (Q < 0) return [-top + G_REV * Q, G_REV];
      var gain = l.A - l.B * Q * Q, gp = Math.max(2 * l.B * Q, 1e-3);
      if (gain > top) { gain = top; gp = 1e-3; }   // pressure-regulated pump: gain limited to what the controller asks for
      return [-gain, gp];
    }
    // emitter
    if (Q <= 0) return [G_REV * Q, G_REV];
    var ix = 1 / l.x, qq = Math.max(Q, QMIN);
    var hh = Math.pow(Q / l.K, ix);
    var gg = ix * Math.pow(qq / l.K, ix - 1) / l.K;
    return [hh, gg];
  }

  // elimination order: greedy minimum degree on the symbolic graph (computed once per network)
  function minDegreeOrder(n, adj) {
    var sets = adj.map(function (s) { return new Set(s); });
    var alive = new Uint8Array(n).fill(1), order = [];
    for (var step = 0; step < n; step++) {
      var best = -1, bd = Infinity;
      for (var i = 0; i < n; i++) if (alive[i] && sets[i].size < bd) { bd = sets[i].size; best = i; if (bd <= 1) break; }
      var k = best, nb = Array.from(sets[k]);
      for (var a = 0; a < nb.length; a++) {
        sets[nb[a]].delete(k);
        for (var b = 0; b < nb.length; b++) if (a !== b) sets[nb[a]].add(nb[b]);
      }
      alive[k] = 0; order.push(k);
    }
    return order;
  }

  // symmetric sparse solve by elimination in a given order (rows: array of Map col→val, diag, rhs)
  function solveSym(n, diag, rows, rhs, order) {
    var elim = new Array(n), x = new Float64Array(n);
    for (var t = 0; t < n; t++) {
      var k = order[t], dk = diag[k];
      if (!(Math.abs(dk) > 1e-300)) dk = 1e-300;
      var nb = Array.from(rows[k].entries());
      elim[t] = [nb, dk];
      for (var a = 0; a < nb.length; a++) rows[nb[a][0]].delete(k);
      for (var a2 = 0; a2 < nb.length; a2++) {
        var i = nb[a2][0], aik = nb[a2][1], f = aik / dk;
        diag[i] -= f * aik;
        rhs[i] -= f * rhs[k];
        var ri = rows[i];
        for (var b = 0; b < nb.length; b++) {
          if (b === a2) continue;
          var j = nb[b][0];
          ri.set(j, (ri.get(j) || 0) - f * nb[b][1]);
        }
      }
    }
    for (var t2 = n - 1; t2 >= 0; t2--) {
      var k2 = order[t2], e = elim[t2], s = rhs[k2];
      for (var c = 0; c < e[0].length; c++) s -= e[0][c][1] * x[e[0][c][0]];
      x[k2] = s / e[1];
    }
    return x;
  }

  function solve(net, opts) {
    opts = opts || {};
    var nodes = net.nodes, links = net.links, nN = nodes.length, nL = links.length;
    var jIdx = new Int32Array(nN).fill(-1), nJ = 0, fixedSum = 0, fixedN = 0;
    for (var i = 0; i < nN; i++) {
      if (nodes[i].fixed) { fixedSum += nodes[i].head; fixedN++; }
      else jIdx[i] = nJ++;
    }
    var H = new Float64Array(nN), Q = new Float64Array(nL);
    var h0 = fixedN ? fixedSum / fixedN : 0;
    for (i = 0; i < nN; i++) H[i] = nodes[i].fixed ? nodes[i].head : h0;
    for (var k = 0; k < nL; k++) Q[k] = links[k].q0 || 1e-4;

    // symbolic structure
    var adj = []; for (i = 0; i < nJ; i++) adj.push([]);
    for (k = 0; k < nL; k++) {
      var ja = jIdx[links[k].a], jb = jIdx[links[k].b];
      if (ja >= 0 && jb >= 0 && ja !== jb) { adj[ja].push(jb); adj[jb].push(ja); }
    }
    var order = minDegreeOrder(nJ, adj);
    var maxIt = opts.maxIter || 200, it = 0, converged = false, relErr = 1;
    var Pk = new Float64Array(nL), Yk = new Float64Array(nL);

    for (it = 1; it <= maxIt; it++) {
      var diag = new Float64Array(nJ), rhs = new Float64Array(nJ), rows = [];
      for (i = 0; i < nJ; i++) rows.push(new Map());
      for (k = 0; k < nL; k++) {
        var l = links[k], r = hg(l, Q[k]), p = 1 / r[1], y = p * r[0];
        Pk[k] = p; Yk[k] = y;
        var a = jIdx[l.a], b = jIdx[l.b], qy = Q[k] - y;
        if (a >= 0) { diag[a] += p; rhs[a] -= qy; if (b < 0) rhs[a] += p * H[l.b]; }
        if (b >= 0) { diag[b] += p; rhs[b] += qy; if (a < 0) rhs[b] += p * H[l.a]; }
        if (a >= 0 && b >= 0 && a !== b) {
          rows[a].set(b, (rows[a].get(b) || 0) - p);
          rows[b].set(a, (rows[b].get(a) || 0) - p);
        }
      }
      var x = solveSym(nJ, diag, rows, rhs, order);
      for (i = 0; i < nN; i++) if (jIdx[i] >= 0) H[i] = x[jIdx[i]];
      var dsum = 0, qsum = 0, relax = it > 40 ? 0.5 : 1;
      for (k = 0; k < nL; k++) {
        var qn = Q[k] - Yk[k] + Pk[k] * (H[links[k].a] - H[links[k].b]);
        var dq = (qn - Q[k]) * relax;
        Q[k] += dq; dsum += Math.abs(dq); qsum += Math.abs(Q[k]);
      }
      relErr = qsum > 0 ? dsum / qsum : 0;
      if (it > 2 && relErr < 1e-7) { converged = true; break; }
    }
    return { H: H, Q: Q, iterations: Math.min(it, maxIt), converged: converged, relErr: relErr };
  }

  return { solve: solve, hwR: hwR, hg: hg };
})();
if (typeof module !== 'undefined') module.exports = Hyd;

</script>

const PUMP_PRESETS = {

  cen2:   { label: 'หอยโข่ง ~2 แรง', kind: 'surface', H0: 38, Qd: 12, Hd: 25, Qmax: 18, eff: 55 },
  sub15:  { label: 'ซับเมิร์สบ่อบาดาล ~1.5 แรง', kind: 'sub', H0: 60, Qd: 3, Hd: 45, Qmax: 5, eff: 45 },
  solar:  { label: 'ปั๊มโซลาร์ DC ~750 วัตต์', kind: 'surface', H0: 35, Qd: 4, Hd: 22, Qmax: 6, eff: 45 },
};
const SRC = {
  pond: { label: 'บ่อ / สระ', short: 'บ่อ', color: '#2b8cc4' },
  well: { label: 'บ่อบาดาล', short: 'บาดาล', color: '#7b5cc4' },
  tank: { label: 'แท็งก์', short: 'แท็งก์', color: '#1f9884' },
  city: { label: 'ประปา', short: 'ประปา', color: '#cf7a1c' },
};
const SRC_DEFAULT = {
  pond: { ground: 0, waterDepth: 1.0 },
  well: { ground: 0, level: 12, drawdown: 3, yield: 4 },
  tank: { ground: 0, stand: 3, height: 1.5, cap: 2000, fill: 70 },
  city: { ground: 0, pressure: 1.0 },
};
const BAR = 10.197; // metres of water per bar
const STEPS = [
  ['land', 'ที่ดิน'], ['fence', 'รั้ว'], ['plant', 'ปลูก'], ['water', 'แหล่งน้ำ'], ['pipe', 'ท่อ & ปั๊ม'], ['run', 'สถานการณ์ & ผล'],
];

// ---------- small utils ----------
const $ = s => document.querySelector(s);
const uid = p => p + Math.random().toString(36).slice(2, 8);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmt = (v, d = 1) => (v == null || !isFinite(v)) ? '–' : Number(v).toLocaleString('th-TH', { minimumFractionDigits: d, maximumFractionDigits: d });
const fmt0 = v => fmt(v, 0);
const dist = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]);
function projSeg(p, a, b) {
  const dx = b[0] - a[0], dy = b[1] - a[1], L2 = dx * dx + dy * dy;
  let t = L2 ? ((p[0] - a[0]) * dx + (p[1] - a[1]) * dy) / L2 : 0;
  t = clamp(t, 0, 1);
  const q = [a[0] + t * dx, a[1] + t * dy];
  return { t, q, d: dist(p, q), len: Math.sqrt(L2) };
}
const polyLen = pts => pts.reduce((s, p, i) => i ? s + dist(pts[i - 1], p) : 0, 0);
function polyArea(poly) { let s = 0; for (let i = 0; i < poly.length; i++) { const a = poly[i], b = poly[(i + 1) % poly.length]; s += a[0] * b[1] - b[0] * a[1]; } return Math.abs(s) / 2; }
function polyPerim(poly) { let s = 0; for (let i = 0; i < poly.length; i++) s += dist(poly[i], poly[(i + 1) % poly.length]); return s; }
function inPoly(p, poly) {
  let c = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const a = poly[i], b = poly[j];
    if (((a[1] > p[1]) !== (b[1] > p[1])) && (p[0] < (b[0] - a[0]) * (p[1] - a[1]) / (b[1] - a[1]) + a[0])) c = !c;
  }
  return c;
}
function edgeDist(p, poly) { let m = Infinity; for (let i = 0; i < poly.length; i++) m = Math.min(m, projSeg(p, poly[i], poly[(i + 1) % poly.length]).d); return m; }
function raiText(m2) {
  const rai = Math.floor(m2 / 1600), ngan = Math.floor((m2 % 1600) / 400), wa = (m2 % 400) / 4;
  return `${rai} ไร่ ${ngan} งาน ${fmt(wa, 0)} ตร.ว.`;
}

  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.append(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

const hist = [];

}

    pts.sort((a, b) => a.s - b.s);
    const open = pipeOpen(sc, p.id), spec = pipeSpec(p);
    let prev = null;
    pts.forEach(q => {
      const n = nodeAt(q.x, q.y, q.elev);
      if (q.elev != null && !nodes[n].fixed) nodes[n].elev = q.elev;
      if (prev && prev.n !== n && open) {
        const L = Math.max(0.05, q.s - prev.s);
        links.push({ a: prev.n, b: n, type: 'pipe', r: Hyd.hwR(L * minorF, spec.d / 1000, spec.C), kind: 'pipe', pid: p.id, L, Leff: L * minorF, d: spec.d, C: spec.C,
          q0: 0.5 * Math.PI * Math.pow(spec.d / 2000, 2) });
      }
      prev = { n, s: q.s };
    });
  });
  plants.forEach(pl => {
    if (!pl.pipe) return;
    const j = nodeAt(pl.q[0], pl.q[1]);
    const e = pl.b.emitter, K = emitK(e) * Math.max(1, +pl.b.perPlant || 1);
    pl.node = j;
    links.push({ a: j, b: atmNode(+pl.b.elev || 0), type: 'emit', K, x: 0.5, kind: 'emit', bid: pl.b.id, k: pl.k, q0: K * Math.sqrt(10) });
  });
  P.pumps.forEach(u => {
    if (!pumpOn(sc, u.id)) return;
    const { A, B } = pumpAB(u);
    links.push({ a: nodeAt(u.a[0], u.a[1]), b: nodeAt(u.b[0], u.b[1]), type: 'pump', A, B, kind: 'pump', uid: u.id, q0: (+u.Qd || 1) / 3600 });
  });

  // keep only what is hydraulically connected to a real water source
  const adj = nodes.map(() => []);
  links.forEach((l, k) => { if (l.type !== 'emit') { adj[l.a].push(l.b); adj[l.b].push(l.a); } });
  const reached = new Uint8Array(nodes.length), stack = [];
  nodes.forEach((n, i) => { if (n.fixed && !n.atm) { reached[i] = 1; stack.push(i); } });
  while (stack.length) { const i = stack.pop(); for (const j of adj[i]) if (!reached[j]) { reached[j] = 1; stack.push(j); } }
  const keepNode = nodes.map((n, i) => reached[i] || n.atm);
  return { nodes, links, plants, keepNode, nodeAt };
}

function runScenario(sc, topIn) {
  const net = buildNet(sc, topIn);
  const idx = new Int32Array(net.nodes.length).fill(-1), sN = [];
  net.nodes.forEach((n, i) => { if (net.keepNode[i]) { idx[i] = sN.length; sN.push(n); } });
  const sL = [], lmap = [];
  net.links.forEach((l, k) => {
    if (idx[l.a] < 0 || idx[l.b] < 0) return;
    if (l.type !== 'emit' && net.nodes[l.a].fixed && net.nodes[l.b].fixed && l.a === l.b) return;
    sL.push({ ...l, a: idx[l.a], b: idx[l.b] }); lmap.push(k);
  });
  let sol = { H: new Float64Array(sN.length), Q: new Float64Array(sL.length), converged: true, iterations: 0 };
  const t0 = performance.now();
  if (sL.length && sN.some(n => !n.fixed)) sol = Hyd.solve({ nodes: sN, links: sL });
  else sN.forEach((n, i) => { sol.H[i] = n.fixed ? n.head : 0; });
  const ms = performance.now() - t0;
  const Hn = i => idx[i] >= 0 ? sol.H[idx[i]] : null;
  const res = { sc, net, sol, idx, sL, lmap, ms, Hn, segs: [], plants: [], pumps: [], tanks: [], warnings: [], blocks: [] };

  // pipe segments
  sL.forEach((l, k) => {
    if (l.kind !== 'pipe') return;
    const Q = sol.Q[k], A = Math.PI * Math.pow(l.d / 2000, 2), na = sN[l.a], nb = sN[l.b];
    const pa = sol.H[l.a] - na.elev, pb = sol.H[l.b] - nb.elev;
    res.segs.push({ pid: l.pid, a: [na.x, na.y], b: [nb.x, nb.y], Q, v: Math.abs(Q) / A, p: Math.min(pa, pb), hl: Math.abs(sol.H[l.a] - sol.H[l.b]), L: l.L });
  });
  // plants
  const emitQ = new Map();
  sL.forEach((l, k) => { if (l.kind === 'emit') emitQ.set(l.bid + ':' + l.k, sol.Q[k]); });
  net.plants.forEach(pl => {
    const e = pl.b.emitter, minP = (+e.min || 0) * BAR;
    let status = 'none', p = null, q = 0;
    if (pl.pipe) {
      const h = Hn(pl.node);
      if (h == null) status = 'dry';
      else {
        p = h - (+pl.b.elev || 0); q = Math.max(0, emitQ.get(pl.b.id + ':' + pl.k) || 0) * 3600 * 1000;
        status = p < 0.05 * BAR || q < 0.01 ? 'dry' : p < minP ? 'low' : 'ok';
      }
    }
    res.plants.push({ bid: pl.b.id, x: pl.x, y: pl.y, status, p, q });
  });
  // blocks
  P.blocks.forEach(b => {
    const ps = res.plants.filter(p => p.bid === b.id), wet = ps.filter(p => p.status === 'ok' || p.status === 'low');
    const qs = wet.map(p => p.q), pr = wet.map(p => p.p);
    const avg = qs.length ? qs.reduce((a, c) => a + c, 0) / qs.length : 0;
    res.blocks.push({ b, n: ps.length, ok: ps.filter(p => p.status === 'ok').length, low: ps.filter(p => p.status === 'low').length,
      dry: ps.filter(p => p.status === 'dry').length, none: ps.filter(p => p.status === 'none').length,
      qavg: avg, qmin: qs.length ? Math.min(...qs) : 0, pmin: pr.length ? Math.min(...pr) : null, pmax: pr.length ? Math.max(...pr) : null,
      total: qs.reduce((a, c) => a + c, 0), runMin: avg > 0 ? (+b.waterL || 0) / avg * 60 : null });
  });
  // pumps
  P.pumps.forEach(u => {
    const on = pumpOn(sc, u.id);
    const r = { u, on, Q: 0, H: null, kW: null, status: 'off', msg: 'ปิดอยู่ในสถานการณ์นี้' };
    if (on) {
      const k = sL.findIndex(l => l.kind === 'pump' && l.uid === u.id);
      if (k < 0) { r.status = 'bad'; r.msg = 'ไม่ได้ต่อกับแหล่งน้ำ ตรวจว่าปลายด้านดูดของปั๊มต่อกับบ่อ แท็งก์ หรือท่อที่มีน้ำ'; }
      else {
        const l = sL[k]; r.Q = Math.max(0, sol.Q[k]) * 3600; r.H = sol.H[l.b] - sol.H[l.a];
        r.kW = r.Q > 0 ? 1000 * 9.81 * (r.Q / 3600) * r.H / (Math.max(10, +u.eff || 50) / 100) / 1000 : 0;
        if (r.Q < 0.05) { r.status = 'bad'; r.msg = 'น้ำแทบไม่ไหล: ปั๊มส่งไม่ถึงปลายทาง หรือปลายทางถูกปิด'; }
        else if (r.Q > +u.Qmax) { r.status = 'warn'; r.msg = `ไหล ${fmt(r.Q)} ม³/ชม. เกินช่วงใช้งานของปั๊ม (สูงสุด ${fmt(+u.Qmax)}) ปั๊มจะทำงานหนักและกินไฟ`; }
        else if (r.Q < 0.3 * +u.Qd) { r.status = 'warn'; r.msg = 'ไหลน้อยมาก ใกล้จุดปิดหัว ปั๊มจะร้อน ควรเปิดโซนเพิ่มหรือใช้ปั๊มเล็กลง'; }
        else { r.status = 'ok'; r.msg = 'อยู่ในช่วงใช้งานของปั๊ม'; }
        // suction lift for surface pumps drawing from pond / well
        const src = P.sources.find(s => dist([s.x, s.y], u.a) < 0.3);
        if (src && (src.type === 'pond' || src.type === 'well') && u.kind !== 'sub') {
          const lift = (+src.ground || 0) - srcHead(src);
          if (lift > 7) { r.status = 'bad'; r.msg = `ระดับน้ำลึก ${fmt(lift)} ม. ปั๊มผิวดินดูดได้จริงราว 6–7 ม. ต้องใช้ปั๊มจุ่ม (ซับเมิร์ส)`; }
        }
      }
    }
    res.pumps.push(r);
  });
  // well yield
  P.sources.filter(s => s.type === 'well' && +s.yield > 0).forEach(s => {
    const out = res.pumps.filter(r => r.on && dist(r.u.a, [s.x, s.y]) < 0.3).reduce((a, r) => a + r.Q, 0);
    if (out > +s.yield) res.warnings.push({ lvl: 'warn', text: `สูบจาก${s.name} ${fmt(out)} ม³/ชม. มากกว่าที่บ่อให้ได้ (${fmt(+s.yield)} ม³/ชม.) ระดับน้ำจะลดลงเรื่อย ๆ` });
  });
  // tanks & other sources: net flow (positive = water leaving the source)
  P.sources.forEach(s => {
    const n = net.nodeAt(s.x, s.y); const ii = idx[n]; let out = 0;
    if (ii >= 0) sL.forEach((l, k) => { if (l.a === ii) out += sol.Q[k]; if (l.b === ii) out -= sol.Q[k]; });
    const Qh = out * 3600; const r = { s, Qh };

  // fast pipes
  const fast = new Map(); res.segs.forEach(g => { if (g.v > 2) fast.set(g.pid, Math.max(fast.get(g.pid) || 0, g.v)); });
  fast.forEach((v, pid) => { const p = P.pipes.find(q => q.id === pid); res.warnings.push({ lvl: 'warn', text: `${p ? p.name : 'ท่อ'}: น้ำวิ่ง ${fmt(v)} ม./วินาที เร็วเกิน 2 ม./วินาที ควรขยายท่อ` }); });
  if (!sol.converged) res.warnings.push({ lvl: 'bad', text: 'การคำนวณไม่ลู่เข้า ผลอาจคลาดเคลื่อน ตรวจท่อที่ต่อวนหรือปั๊มที่ต่อชนกัน' });
  // a tank that is being filled receives water at its top inlet: solve again with that head
  if (!topIn) {
    const filling = res.tanks.filter(t => t.s.type === 'tank' && t.Qh < -0.01);
    if (filling.length) return runScenario(sc, Object.fromEntries(filling.map(t => [t.s.id, true])));
  }
  res.verdict = verdictOf(res);
  return res;
}

function verdictOf(res) {
  const all = res.plants.filter(p => p.status !== 'none');
  const ok = all.filter(p => p.status === 'ok').length, low = all.filter(p => p.status === 'low').length, dry = all.filter(p => p.status === 'dry').length;
  const pumpsBad = res.pumps.filter(r => r.on && r.status === 'bad'), pumpsWarn = res.pumps.filter(r => r.on && r.status === 'warn');
  const filling = res.tanks.filter(t => t.s.type === 'tank' && t.Qh < -0.01);
  const supplying = res.tanks.filter(t => t.s.type === 'tank' && t.Qh > 0.01);
  const lines = [];
  let lvl, head;
  const watered = ok + low;
  if (watered > 0) {
    if (low === 0 && dry === 0 && !pumpsBad.length) { lvl = pumpsWarn.length ? 'warn' : 'ok'; head = `รดได้ครบ ${fmt0(ok)} ต้น แรงดันพอทุกต้น`; }
    else { lvl = 'bad'; head = `แรงดันพอ ${fmt0(ok)} จาก ${fmt0(all.length)} ต้น`; }
    if (low) lines.push(`แรงดันไม่ถึงเกณฑ์ ${fmt0(low)} ต้น`);
    if (dry) lines.push(`ไม่มีน้ำ ${fmt0(dry)} ต้น`);
    const tot = res.blocks.reduce((a, b) => a + b.total, 0) / 1000;
    lines.push(`ใช้น้ำรวม ${fmt(tot)} ม³/ชม.`);
  } else if (filling.length) {
    lvl = 'info';
    head = filling.map(t => `เติม${t.s.name} ${fmt(-t.Qh)} ม³/ชม.`).join(' · ');
    filling.forEach(t => { if (t.minutes != null) lines.push(`จากระดับปัจจุบันเต็มในราว ${fmt0(t.minutes)} นาที`); });
  } else { lvl = 'off'; head = 'ยังไม่มีน้ำไหลไปที่ต้นไม้'; lines.push('เปิดปั๊มหรือวาล์วในสถานการณ์นี้ หรือต่อท่อจากแหล่งน้ำถึงแปลง'); }
  const runMax = Math.max(0, ...res.blocks.map(b => b.runMin || 0));
  supplying.forEach(t => { if (t.minutes != null && watered) {
    lines.push(`${t.s.name} หมดในราว ${fmt0(t.minutes)} นาที`);
    if (runMax > t.minutes) { lines.push(`น้ำในแท็งก์หมดก่อนรดครบรอบ (ต้องเปิดราว ${fmt0(runMax)} นาที) ต้องเติมไปพร้อมกันหรือแบ่งรดหลายรอบ`); if (lvl === 'ok') lvl = 'warn'; }
  } });
  pumpsBad.concat(pumpsWarn).forEach(r => lines.push(`${r.u.name}: ${r.msg}`));
  return { lvl, head, lines, ok, low, dry, n: all.length };
}

let RES = null, ALL = null;
function recompute() {
  RES = runScenario(scenario());
  ALL = null; // comparison table computed lazily
}

// ===================================================================
// Drawing
// ===================================================================
const COL = { boundary: '#ffe066', block: '#a6e88f', pipe: '#5cc8ff', closed: 'rgba(225,230,226,.55)', ok: '#3fdc84', low: '#ffb020', dry: '#ff5a4a', none: '#d7ddd9', sel: '#ffffff' };
function pressColor(pBar) { if (pBar == null) return COL.closed; if (pBar < 0.3) return '#ff5a4a'; if (pBar < 0.8) return '#ff9a2e'; if (pBar < 1.5) return '#ffd23f'; if (pBar < 2.5) return '#3fdc84'; return '#36c2ff'; }
function velColor(v) { if (v < 0.05) return '#9aa7a0'; if (v < 0.5) return '#5cc8ff'; if (v < 1.5) return '#3fdc84'; if (v < 2) return '#ffb020'; return '#ff5a4a'; }
function pathPoly(ctx, pts, close) { pts.forEach((p, i) => { const s = S(p); i ? ctx.lineTo(s[0], s[1]) : ctx.moveTo(s[0], s[1]); }); if (close) ctx.closePath(); }
function label(ctx, text, x, y, opt = {}) {
  ctx.font = `${opt.bold ? 600 : 500} ${opt.size || 12}px "IBM Plex Sans Thai", system-ui, sans-serif`;
  const w = ctx.measureText(text).width + 10, h = (opt.size || 12) + 8;
  const bx = opt.align === 'left' ? x : x - w / 2;
  ctx.fillStyle = opt.bg || 'rgba(12,18,15,.82)'; roundRect(ctx, bx, y - h / 2, w, h, 4); ctx.fill();
  ctx.fillStyle = opt.color || '#fff'; ctx.textBaseline = 'middle'; ctx.textAlign = 'left'; ctx.fillText(text, bx + 5, y + 0.5);
}
function roundRect(ctx, x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function isSel(kind, id) { return ui.sel && ui.sel.kind === kind && ui.sel.id === id; }

function drawAll(ctx, W, H) {
  if (!P) return;
  const mpp = Map2.mpp(), sc = scenario();
  // boundary
  if (P.boundary) {
    ctx.beginPath(); pathPoly(ctx, P.boundary, true);
    ctx.fillStyle = 'rgba(255,224,102,.07)'; ctx.fill();
    ctx.setLineDash([8, 5]); ctx.lineWidth = isSel('boundary', 'b') ? 3.5 : 2.2; ctx.strokeStyle = COL.boundary; ctx.stroke(); ctx.setLineDash([]);
    if (P.fence.show && (ui.step === 'fence' || ui.step === 'land')) {
      const sp = Math.max(0.5, +P.fence.spacing || 2.5);

    }

    if (!open) { ctx.beginPath(); pathPoly(ctx, p.pts); ctx.setLineDash([4, 5]); ctx.lineWidth = Math.max(1.5, w - 1); ctx.strokeStyle = COL.closed; ctx.stroke(); ctx.setLineDash([]); return; }
    ctx.beginPath(); pathPoly(ctx, p.pts); ctx.lineWidth = w + 2; ctx.strokeStyle = 'rgba(8,14,11,.7)'; ctx.stroke();
    const segs = segsBy.get(p.id);

    ps.forEach(p => {

    });
  });
  // pumps
  P.pumps.forEach(u => {
    const a = S(u.a), b = S(u.b), m = [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2], on = pumpOn(sc, u.id);
    const r = RES && RES.pumps.find(x => x.u.id === u.id);

    const col = !on ? '#6f7b75' : r && r.status === 'ok' ? '#2c8a4b' : r && r.status === 'warn' ? '#c98a12' : r && r.status === 'bad' ? '#c23b2b' : '#2b6ea6';

    ctx.beginPath(); ctx.arc(m[0], m[1], 11, 0, 7); ctx.fillStyle = col; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = '#fff'; ctx.stroke();

    ctx.save(); ctx.translate(m[0], m[1]); ctx.rotate(ang); ctx.beginPath(); ctx.moveTo(5, 0); ctx.lineTo(-3, -4.5); ctx.lineTo(-3, 4.5); ctx.closePath(); ctx.fillStyle = '#fff'; ctx.fill(); ctx.restore();
    const txt = on && r && r.Q > 0.01 ? `${u.name} · ${fmt(r.Q)} ม³/ชม. · ${fmt(r.H, 0)} ม.` : `${u.name}${on ? '' : ' (ปิด)'}`;
    label(ctx, txt, m[0] + 14, m[1] - 16, { align: 'left', size: 11.5 });
  });
  // sources
  P.sources.forEach(s => {
    const c = S([s.x, s.y]), meta = SRC[s.type];
    if (isSel('source', s.id)) { ctx.beginPath(); ctx.arc(c[0], c[1], 19, 0, 7); ctx.fillStyle = 'rgba(255,255,255,.6)'; ctx.fill(); }
    roundRect(ctx, c[0] - 14, c[1] - 14, 28, 28, 6); ctx.fillStyle = meta.color; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = '#fff'; ctx.stroke();
    if (s.type === 'tank') { const f = clamp(+s.fill || 0, 0, 100) / 100; ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.fillRect(c[0] - 10, c[1] + 10 - 20 * f, 20, 20 * f); }
    ctx.fillStyle = '#fff'; ctx.font = '600 10px "IBM Plex Sans Thai", system-ui'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(meta.short, c[0], c[1] + 0.5);
    const t = RES && RES.tanks.find(x => x.s.id === s.id);
    const extra = t && Math.abs(t.Qh) > 0.01 ? (t.Qh > 0 ? ` · ออก ${fmt(t.Qh)} ม³/ชม.` : ` · เข้า ${fmt(-t.Qh)} ม³/ชม.`) : '';
    label(ctx, s.name + extra, c[0], c[1] + 27, { size: 11.5 });
  });
  // selection handles
  const hs = handles();
  hs.forEach(h => { const s = S(h.p); ctx.fillStyle = '#fff'; ctx.strokeStyle = '#0d1a14'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.rect(s[0] - 5, s[1] - 5, 10, 10); ctx.fill(); ctx.stroke(); });
  // draft

function pumpCurveSVG(u, r) {
  const W = 300, H = 140, pl = 30, pb = 22, pt = 8, pr = 8;
  const { A, B } = pumpAB(u); const qmax = Math.max(+u.Qmax || 1, r && r.Q ? r.Q : 0) * 1.15, hmax = Math.max(A, r && r.H ? r.H : 0) * 1.1;
  const X = q => pl + q / qmax * (W - pl - pr), Y = h => pt + (1 - h / hmax) * (H - pt - pb);
  let d = ''; for (let i = 0; i <= 40; i++) { const q = qmax * i / 40, h = A - B * Math.pow(q / 3600, 2); if (h < 0) break; d += (i ? 'L' : 'M') + X(q).toFixed(1) + ' ' + Y(h).toFixed(1); }
  const ticksQ = [0, 0.25, 0.5, 0.75, 1].map(f => +(qmax * f).toFixed(1)), ticksH = [0, 0.5, 1].map(f => Math.round(hmax * f));
  const op = r && r.on && r.Q > 0.01 && r.H != null ? `<circle cx="${X(r.Q)}" cy="${Y(Math.max(0, r.H))}" r="5" fill="var(--water)" stroke="var(--panel)" stroke-width="2"/><text x="${X(r.Q) + 8}" y="${Y(Math.max(0, r.H)) - 6}" style="fill:var(--ink)">${fmt(r.Q)} ม³/ชม. · ${fmt(r.H, 0)} ม.</text>` : '';
  return `<svg class="curve" viewBox="0 0 ${W} ${H}" role="img" aria-label="กราฟปั๊ม">
    ${ticksH.map(h => `<line x1="${pl}" x2="${W - pr}" y1="${Y(h)}" y2="${Y(h)}" stroke="var(--line)"/><text x="${pl - 4}" y="${Y(h) + 3}" text-anchor="end">${h}</text>`).join('')}
    ${ticksQ.map(q => `<text x="${X(q)}" y="${H - 6}" text-anchor="middle">${q}</text>`).join('')}
    <rect x="${X(+u.Qmax)}" y="${pt}" width="${Math.max(0, W - pr - X(+u.Qmax))}" height="${H - pt - pb}" fill="var(--warn-soft)" opacity=".7"/>
    <path d="${d}" fill="none" stroke="var(--ink)" stroke-width="2"/>
    ${op}
    <text x="${pl}" y="${pt + 8}" style="fill:var(--muted)">ม.</text><text x="${W - pr}" y="${H - pb - 4}" text-anchor="end">ม³/ชม.</text>
  </svg>`;
}

function setPath(obj, path, val) { const ks = path.split('.'); let o = obj; for (let i = 0; i < ks.length - 1; i++) o = o[ks[i]]; o[ks[ks.length - 1]] = val; }

// ---------- view helpers ----------
function allPts() {
  const pts = [];
  if (P.boundary) pts.push(...P.boundary);
  P.blocks.forEach(b => pts.push(...b.poly)); P.pipes.forEach(p => pts.push(...p.pts)); P.pumps.forEach(u => pts.push(u.a, u.b)); P.sources.forEach(s => pts.push([s.x, s.y]));
  return pts;
}
function bboxCenter() { const pts = allPts(); if (!pts.length) return [0, 0]; const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]); return [(Math.min(...xs) + Math.max(...xs)) / 2, (Math.min(...ys) + Math.max(...ys)) / 2]; }
function shiftAll(dx, dy) {
  const mv = p => { p[0] += dx; p[1] += dy; };
  if (P.boundary) P.boundary.forEach(mv);
  P.blocks.forEach(b => { b.poly.forEach(mv); b._sig = null; }); P.pipes.forEach(p => p.pts.forEach(mv)); P.pumps.forEach(u => { mv(u.a); mv(u.b); }); P.sources.forEach(s => { s.x += dx; s.y += dy; });
}
function fitPts(pts, pad = 60) {
  if (!pts.length) return;
  const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
  const c = toLL([(Math.min(...xs) + Math.max(...xs)) / 2, (Math.min(...ys) + Math.max(...ys)) / 2]);
  const w = Math.max(20, Math.max(...xs) - Math.min(...xs)), h = Math.max(20, Math.max(...ys) - Math.min(...ys));
  const [W, H] = Map2.size();
  const mppNeed = Math.max(w / Math.max(50, W - pad * 2), h / Math.max(50, H - pad * 2 - 120));
  const z = Math.log2(40075016.686 * Math.cos(c.lat * Math.PI / 180) / (TS * mppNeed));
  Map2.setView(c.lat, c.lng, Math.min(20.5, z));
}
function fitAll() { const pts = allPts(); if (pts.length) fitPts(pts); else Map2.setView(P.origin.lat, P.origin.lng, 17); }
function zoomToSel() {
  const o = selObj(); if (!o) return;
  const pts = o.poly || o.pts || (o.a ? [o.a, o.b] : [[o.x, o.y]]);
  const [W, H] = Map2.size(); const inView = pts.every(p => { const s = S(p); return s[0] > 0 && s[1] > 0 && s[0] < W && s[1] < H; });
  if (!inView) fitPts(pts, 120);
}
async function doSearch() {
  const q = ($('#search').value || '').trim(); if (!q) return;
  const m = q.match(/(-?\d{1,2}\.\d+)\s*[, ]\s*(-?\d{1,3}\.\d+)/) || q.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/);
  if (m) { Map2.setView(+m[1], +m[2], 18); toast('ไปยังพิกัดแล้ว'); return; }
  const box = $('#searchRes'); box.hidden = false; box.innerHTML = '<div class="item">กำลังค้นหา…</div>';
  try {
    const r = await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=6&accept-language=th&q=${encodeURIComponent(q)}`);
    const js = await r.json();
    if (!js.length) { box.innerHTML = '<div class="item">ไม่พบสถานที่ ลองพิมพ์ชื่ออำเภอหรือจังหวัด หรือวางพิกัด</div>'; return; }
    box.innerHTML = js.map(x => `<button class="item" data-lat="${x.lat}" data-lng="${x.lon}"><span class="grow">${esc(x.display_name)}</span></button>`).join('');
    box.querySelectorAll('button').forEach(b => b.onclick = () => { Map2.setView(+b.dataset.lat, +b.dataset.lng, 17); box.hidden = true; });
  } catch (er) { box.innerHTML = '<div class="item">ค้นหาไม่ได้ตอนนี้ (ต้องต่ออินเทอร์เน็ต) วางพิกัดแทนได้ เช่น 12.73, 102.12</div>'; }
}

// EPANET export: reservoirs for sources/tanks, junction emitters for plants
function toINP(sc) {
  const net = buildNet(sc), keep = net.keepNode, N = net.nodes;
  const id = i => (N[i].fixed ? 'R' : 'J') + i;
  const emit = new Map();
  const L = []; net.links.forEach(l => { if (keep[l.a] && keep[l.b]) L.push(l); });
  L.filter(l => l.kind === 'emit').forEach(l => emit.set(l.a, (emit.get(l.a) || 0) + l.K * 3600));
  const out = ['[TITLE]', `${P.name} - ${sc.name} (ส่งออกจากผังน้ำไร่)`, '', '[JUNCTIONS]', ';ID Elev Demand'];
  N.forEach((n, i) => { if (keep[i] && !n.fixed) out.push(`${id(i)} ${n.elev.toFixed(3)} 0`); });
  out.push('', '[RESERVOIRS]', ';ID Head');
  N.forEach((n, i) => { if (keep[i] && n.fixed && !n.atm) out.push(`${id(i)} ${n.head.toFixed(3)}`); });
  out.push('', '[PIPES]', ';ID N1 N2 Length Diam Rough Minor Status');
  L.filter(l => l.kind === 'pipe').forEach((l, k) => out.push(`P${k} ${id(l.a)} ${id(l.b)} ${l.Leff.toFixed(3)} ${l.d} ${l.C} 0 Open`));
  const curves = [];
  out.push('', '[PUMPS]');
  L.filter(l => l.kind === 'pump').forEach((l, k) => {
    const u = P.pumps.find(x => x.id === l.uid), B = l.B / 3600 / 3600; // per (m³/h)²
    let q3 = +u.Qd * 1.4, h3 = l.A - B * q3 * q3; if (h3 <= 0.05 * l.A) { q3 = Math.sqrt(0.9 * l.A / B); h3 = 0.1 * l.A; }
    curves.push(`C${k} 0 ${l.A.toFixed(3)}`, `C${k} ${(+u.Qd).toFixed(4)} ${(l.A - B * u.Qd * u.Qd).toFixed(3)}`, `C${k} ${q3.toFixed(4)} ${h3.toFixed(3)}`);
    out.push(`PU${k} ${id(l.a)} ${id(l.b)} HEAD C${k}`);
  });
  out.push('', '[CURVES]', ...curves, '', '[EMITTERS]');
  emit.forEach((K, j) => out.push(`${id(j)} ${K.toFixed(8)}`));
  out.push('', '[OPTIONS]', 'Units CMH', 'Headloss H-W', 'Emitter Exponent 0.5', 'Accuracy 0.000001', 'Trials 200', '', '[COORDINATES]');
  N.forEach((n, i) => { if (keep[i] && !n.atm) out.push(`${id(i)} ${n.x.toFixed(2)} ${n.y.toFixed(2)}`); });
  out.push('', '[END]');
  return out.join('\n');
}

// ---------- boot ----------
(function boot() {
  let loaded = null;
  try { const s = localStorage.getItem(LS_KEY); if (s) loaded = JSON.parse(s); } catch (e) { }
  if (loaded && loaded.origin && loaded.scenarios) P = loaded; else sampleProject();
  let base = 'sat'; try { base = localStorage.getItem(LS_KEY + '.base') || 'sat'; } catch (e) { }
  if (!BASES[base]) base = 'sat';
  document.querySelectorAll('#baseSeg button').forEach(x => x.classList.toggle('on', x.dataset.base === base));
  Map2.setBase(base);
  Map2.draw(drawAll);
  Map2.resize();
  ui.step = P.boundary ? 'run' : 'land';
  recompute(); renderPanel(); renderVerdict(); renderLegend(); $('#projName').textContent = P.name;
  requestAnimationFrame(() => { Map2.resize(); fitAll(); });
  window.__farm = { get P() { return P; }, get RES() { return RES; }, runScenario, toINP, Map2, S };
})();

<script>
'use strict';
/* ===================================================================
   ทดลองสูตร — isometric sandbox: water source → pump → pipes, elbows, tees → outlets.
   Pure 2D canvas with hand-drawn shading (no WebGL), redrawn only on change;
   water animation runs at ~30 fps only while something is flowing.
   =================================================================== */
const SIM = (() => {
  const G = 9.81;
  const DIRS = { '+x': [1, 0, 0], '-x': [-1, 0, 0], '+y': [0, 1, 0], '-y': [0, -1, 0], '+z': [0, 0, 1], '-z': [0, 0, -1] };

  // ---------- pump model ----------

  // ===================================================================
  // Rendering
  // ===================================================================
  const stage = document.getElementById('isoStage');

      <div class="fld"><label for="s_defsize">ขนาดท่อเมื่อเพิ่มท่อใหม่</label><select id="s_defsize" data-s="size">${SIZES.map(k => `<option value="${k}"${k === SM.size ? ' selected' : ''}>${PIPES[k].label}</option>`).join('')}</select></div>
    </div>
    ${selEditor()}
    <div class="card">
      <h3>จุดใช้น้ำ ${RESS.static ? '' : `· รวม ${fmt(RESS.total, 1)} ล./นาที`}</h3>
      ${RESS.outs.length ? `<div class="list">${RESS.outs.map(o => `<div class="outRow ${sel === o.pc.id ? 'sel' : ''}">
        <button class="grow linkish" data-pick="${o.pc.id}"><b>${esc(o.pc.name || o.t.label)}</b><small>${o.pc.open ? `${fmt(o.p, 2)} บาร์ · ${fmt(o.q, 1)} ล./นาที · ${stText[o.st]}` : `ปิด · รอ ${fmt(o.p, 2)} บาร์`}</small>${meter(o)}</button>
        <span class="switch"><input type="checkbox" aria-label="เปิด ${esc(o.pc.name)}" data-otoggle="${o.pc.id}" ${o.pc.open ? 'checked' : ''}><span></span></span></div>`).join('')}</div>
        <p class="note">แถบเขียว = ใช้ได้ดี · เหลือง = เบา (ปรับตามชนิด เช่น ฝักบัวต้องการ ≥ 1 บาร์)</p>` : '<p class="note">ยังไม่มีจุดใช้น้ำ แตะ + ที่ปลายท่อแล้วเลือก "จุดใช้น้ำ"</p>'}
    </div>
    ${focus ? `<div class="card">
      <h3>ที่มาของแรงดัน · ${esc(focus.pc.name)}</h3>
      <div class="ladder">${rows.map(r => `<div class="lrow"><span class="lt">${esc(r.t)}</span><span class="lbar"><i class="${r.v >= 0 ? 'pos' : 'neg'}" style="width:${Math.abs(r.v) / maxAbs * 100}%"></i></span><span class="lv num">${r.v >= 0 ? '+' : '−'}${fmt(Math.abs(r.v), 2)}</span></div>${r.det && r.det.length > 1 ? r.det.map(d => `<div class="lrow sub"><span class="lt">${esc(d.t)}</span><span></span><span class="lv num">−${fmt(Math.abs(d.v), 2)}</span></div>`).join('') : ''}`).join('')}
        <div class="lrow total"><span class="lt">แรงดันที่เหลือ = ${fmt(sum, 2)} ม. ÷ 10.2</span><span></span><span class="lv num">${fmt(sum / BAR, 2)} บาร์</span></div>
      </div>
      <details><summary>สูตรที่ใช้</summary><div class="formula">
        <p><b>แรงดันที่ก๊อก</b> P = (H<sub>ต้นทาง</sub> + H<sub>ปั๊ม</sub> − Σh<sub>f</sub> − Σh<sub>m</sub> − z) ÷ 10.2 บาร์</p>
        <p><b>แรงเสียดทานท่อ</b> (Hazen–Williams) h<sub>f</sub> = 10.67 · L · Q<sup>1.852</sup> ÷ (C<sup>1.852</sup> · D<sup>4.87</sup>) ใช้ C = 150 สำหรับ PVC</p>
        <p><b>ข้องอ สามทาง</b> h<sub>m</sub> = K · v² ÷ 2g</p>
        <p><b>ก๊อก</b> Q = K<sub>ก๊อก</sub> · √P ยิ่งแรงดันมาก น้ำยิ่งไหลมาก เมื่อเปิดหลายจุด น้ำไหลมากขึ้น แรงเสียดทานเพิ่ม แรงดันทุกจุดจึงตกพร้อมกัน</p>
        <p><b>ปั๊ม</b> ส่งสูง = H<sub>0</sub> − B · Q² · ปั๊มแรงดันคงที่และอินเวอร์เตอร์จะจำกัดแรงดันขาออกไม่ให้เกินค่าที่ตั้ง</p>
        <p>แก้สมการทั้งระบบพร้อมกันด้วยวิธี Global Gradient (แบบเดียวกับ EPANET) ${RESS.sol.iterations} รอบ</p>
      </div></details>
    </div>` : ''}
    <div class="btnrow"><button class="btn" data-sact="reset">กลับเป็นแบบตัวอย่าง</button><button class="btn" data-sact="clear">ล้างท่อทั้งหมด</button></div>`;
  }
  function pumpCurve(ps, rp) {
    const Wd = 300, Hd = 120, pl = 30, pb = 20, pt = 8, pr = 10;
    const qmax = ps.Qm * 1.05, hmax = ps.H0 * 1.1;
    const X = q => pl + q / qmax * (Wd - pl - pr), Y = h => pt + (1 - h / hmax) * (Hd - pt - pb);
    let d = ''; for (let i = 0; i <= 40; i++) { const q = qmax * i / 40; let h = ps.A - ps.B * Math.pow(q / 60000, 2); if (SM.pump.type === 'const' || SM.pump.type === 'inverter') h = Math.min(h, ps.set * BAR + (RESS && RESS.pump && RESS.pump.gain != null ? 0 : 0)); if (h < 0) break; d += (i ? 'L' : 'M') + X(q).toFixed(1) + ' ' + Y(h).toFixed(1); }
    let raw = ''; if (SM.pump.type !== 'tank') for (let i = 0; i <= 40; i++) { const q = qmax * i / 40, h = ps.A - ps.B * Math.pow(q / 60000, 2); if (h < 0) break; raw += (i ? 'L' : 'M') + X(q).toFixed(1) + ' ' + Y(h).toFixed(1); }
    const band = SM.pump.type === 'tank' ? `<rect x="${pl}" y="${Y(ps.cutOut * BAR)}" width="${Wd - pl - pr}" height="${Y(ps.cutIn * BAR) - Y(ps.cutOut * BAR)}" fill="var(--warn-soft)"/><text x="${Wd - pr - 2}" y="${Y(ps.cutOut * BAR) + 10}" text-anchor="end">ช่วงสวิตช์ ${fmt(ps.cutIn, 1)}–${fmt(ps.cutOut, 1)} บาร์</text>` : '';
    const op = rp && !RESS.static && rp.Q > 0.05 ? `<circle cx="${X(rp.Q)}" cy="${Y(rp.gain)}" r="5" fill="var(--water)" stroke="var(--panel)" stroke-width="2"/>` : '';
    return `<svg class="curve" viewBox="0 0 ${Wd} ${Hd}" role="img" aria-label="กราฟปั๊ม แรงส่งเทียบอัตราไหล">
      ${band}
      ${[0, 0.5, 1].map(f => `<line x1="${pl}" x2="${Wd - pr}" y1="${Y(hmax * f / 1.1)}" y2="${Y(hmax * f / 1.1)}" stroke="var(--line)"/><text x="${pl - 4}" y="${Y(hmax * f / 1.1) + 3}" text-anchor="end">${fmt0(hmax * f / 1.1)}</text>`).join('')}
      ${[0, 0.5, 1].map(f => `<text x="${X(ps.Qm * f)}" y="${Hd - 5}" text-anchor="middle">${fmt0(ps.Qm * f)}</text>`).join('')}
      ${raw ? `<path d="${raw}" fill="none" stroke="var(--muted)" stroke-width="1" stroke-dasharray="3 3"/>` : ''}
      <path d="${d}" fill="none" stroke="var(--ink)" stroke-width="2"/>${op}
      <text x="${pl}" y="${pt + 6}" style="fill:var(--muted)">ม. ที่ปั๊มเพิ่ม</text><text x="${Wd - pr}" y="${Hd - pb - 4}" text-anchor="end">ล./นาที</text></svg>`;
  }
  panel.addEventListener('change', e => {
    const t = e.target;
    if (t.dataset.otoggle) { const f = findWithParent(t.dataset.otoggle); if (f) { snap(); f.pc.open = t.checked; changedS(); } return; }
    const k = t.dataset.s; if (!k) return;
    snap();
    let v = t.value; const isNum = t.type === 'number' || t.type === 'range' || k === 'pump.watt';
    if (isNum) v = v === '' ? null : parseFloat(v);
    if (isNum && v != null && !isFinite(v)) { toast('ใส่เป็นตัวเลข'); hist.pop(); renderPanelS(); return; }
    if (k.startsWith('src.')) SM.source[k.slice(4)] = Math.max(0, v || 0);
    else if (k.startsWith('pump.')) { SM.pump[k.slice(5)] = v; if (k === 'pump.watt') { SM.pump.set = SM.pump.type === 'inverter' ? SM.pump.set : null; } }
    else if (k === 'size') SM.size = v;
    else if (k.startsWith('pc.')) { const f = findWithParent(sel); if (!f) return; const kk = k.slice(3); f.pc[kk] = kk === 'len' ? clamp(v || 0.1, 0.1, 100) : v; }
    changedS();
  });
  panel.addEventListener('input', e => { if (e.target.type === 'range') { const lab = e.target.closest('.fld').querySelector('b'); if (lab) lab.textContent = `${fmt(+e.target.value, 1)} บาร์`; } });
  panel.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.src) { snap(); SM.source.type = b.dataset.src; changedS(); fit(); return; }
    if (b.dataset.ptype) { snap(); SM.pump.type = b.dataset.ptype; SM.pump.set = null; changedS(); return; }
    if (b.dataset.unit) { SM.unit = b.dataset.unit; changedS(); return; }
    if (b.dataset.pick) { sel = b.dataset.pick; renderPanelS(); request(); return; }
    if (b.dataset.dirset) { const f = findWithParent(sel); if (!f) return; snap(); f.pc[f.pc.kind === 'bend' ? 'to' : 'branch'] = b.dataset.dirset; changedS(); return; }
    const a = b.dataset.sact;
    if (a === 'del') deleteSel();
    if (a === 'reset') { snap(); SM = sample(); sel = null; changedS(); fit(); toast('กลับเป็นแบบตัวอย่างแล้ว · กดย้อนเพื่อเอาคืน'); }
    if (a === 'clear') { snap(); SM.root.next[0] = null; sel = null; changedS(); toast('ล้างท่อแล้ว แตะ + ที่ปากปั๊มเพื่อเริ่มต่อใหม่'); }
    if (a === 'insTee') { const f = findWithParent(sel); if (!f) return; snap(); const d = f.pc._d, br = dirOptions(d).find(x => x !== '+z' && x !== '-z') || '+z'; f.pc.next[0] = tee(br, f.pc.next[0]); sel = f.pc.next[0].id; changedS(); toast('เพิ่มสามทางแล้ว แตะ + ที่ทางแยกเพื่อต่อท่อ'); }
    if (a === 'sizeDown') { const f = findWithParent(sel); if (!f) return; snap(); walk(f.pc, p => { if (p.kind === 'pipe') p.size = f.pc.size; }); changedS(); }
  });
  // stage controls
  document.getElementById('simCtl').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    const a = b.dataset.v;
    if (a === 'rotL') { view.rot = (view.rot + 3) & 3; L = layout(); fit(); }
    if (a === 'rotR') { view.rot = (view.rot + 1) & 3; L = layout(); fit(); }
    if (a === 'in') zoomBy(1.2, W / 2, H / 2);
    if (a === 'out') zoomBy(1 / 1.2, W / 2, H / 2);
    if (a === 'fit') fit();
    if (a === 'color') { SM.colorBy = SM.colorBy === 'pressure' ? 'pipe' : 'pressure'; b.classList.toggle('on', SM.colorBy === 'pressure'); save(); request(); }
    closeMenu();
  });
  function resize() {
    const r = stage.getBoundingClientRect(); W = Math.max(1, r.width); H = Math.max(1, r.height);
    dpr = Math.min(2, window.devicePixelRatio || 1); cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); request();
  }
  new ResizeObserver(() => { const first = W <= 1; resize(); if (first && active) fit(); }).observe(stage);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) request(); });
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', request);

  // ---------- boot ----------
  try { const s = localStorage.getItem(LS); if (s) SM = JSON.parse(s); } catch (e) { }
  if (!SM || !SM.root || !SM.pump) SM = sample();
  return {
    show() { active = true; resize(); L = layout(); RESS = solveSim(); renderPanelS(); document.getElementById('simCtl').querySelector('[data-v=color]').classList.toggle('on', SM.colorBy === 'pressure'); fit(); },
    hide() { active = false; closeMenu(); },
    undo, deleteSel, closeMenu,
    get active() { return active; },
    get SM() { return SM; }, get RES() { return RESS; }, solveSim, pumpSpec, Pj, layout, ladder,
  };
})();

  };
  const TANK_SIZES = { 500: [0.8, 1.1], 1000: [1.0, 1.45], 1500: [1.12, 1.65], 2000: [1.25, 1.8] };

  // ---------- model ----------
  function sample() {

    if (c && c.kind === 'outlet') {
      const o = R && R.outs.find(x => x.c === c);
      title = 'จุดใช้น้ำ';
      body = `<div class="grid2"><div class="fld full"><label for="h_oname">ชื่อ</label><input id="h_oname" type="text" data-h="c.name" value="${esc(c.name)}"></div>
        <div class="fld full"><label for="h_otype">ชนิด</label><select id="h_otype" data-h="c.type">${Object.entries(OUTLETS).map(([k, v]) => `<option value="${k}"${k === c.type ? ' selected' : ''}>${v.label} (${v.q} ล./นาที ที่ ${v.p} บาร์)</option>`).join('')}</select></div>
        ${hf('ความสูงจากพื้นดิน', 'c.z', c.z, 'ม.')}</div>
        <label class="toggle bordered"><span class="grow">เปิดน้ำ</span><span class="switch"><input type="checkbox" data-hb="c.open" ${c.open ? 'checked' : ''}><span></span></span></label>
        ${o && o.p != null ? `<div class="note">แรงดันที่จุดนี้ ${fmt(o.p, 2)} บาร์ · ใช้ได้ดีตั้งแต่ ${o.t.good} บาร์</div>` : '<div class="note">ยังไม่ได้ต่อน้ำ ลากท่อมาที่จุดสีขาวของอุปกรณ์นี้</div>'}
        <div class="btnrow"><button class="btn sm" data-hact="rot">หมุน 90°</button></div>`;
    }
    if (node) {
      const info = R && R.net.F.byKey.get('n:' + sel);
      title = info ? { elbow: 'ข้องอ', coupling: 'ข้อต่อตรง', tee: 'สามทาง', cross: 'สี่ทาง' }[info.kind] || 'จุดปลายท่อ' : 'จุดปลายท่อ';
      body = `<div class="grid2">${hf('ความสูงจากพื้นดิน', 'n.z', node.z, 'ม.')}</div><div class="btnrow"><button class="btn sm primary" data-hact="branch">แยกท่อออกจากจุดนี้</button></div><p class="note">${info && info.n >= 2 ? `มีท่อมาต่อ ${info.n} เส้น ระบบเลือกข้อต่อให้เอง` : 'ปลายท่อเปิดอยู่ ใช้ "ลากท่อ" แตะจุดนี้เพื่อต่อไปยังอุปกรณ์'}</p>`;
    }
    if (pipe) {
      const r = R && R.pipes.get(pipe.id), L = routeLen(route(pipe));
      title = 'ท่อ';
      body = `<div class="grid2"><div class="fld full"><label for="h_psize">ขนาดท่อ</label><select id="h_psize" data-h="p.size">${SIZES.map(k => `<option value="${k}"${k === pipe.size ? ' selected' : ''}>${PIPES[k].label}</option>`).join('')}</select></div></div>
        <div class="stats"><div class="stat"><b>${fmt(L, 2)}</b><span>ม. ยาว</span></div>${r ? `<div class="stat"><b>${fmt(Math.abs(r.Q) * 60000, 1)}</b><span>ล./นาที</span></div><div class="stat"><b>${fmt(r.v, 2)}</b><span>ม./วินาที</span></div>` : ''}</div>
        ${r && r.pA != null ? `<p class="note">แรงดันต้นท่อ ${fmt(r.pA, 2)} → ปลายท่อ ${fmt(r.pB, 2)} บาร์ · เสียไปกับแรงเสียดทาน ${fmt(r.hf, 2)} ม. และข้อต่อ ${fmt(r.hm, 2)} ม.</p>` : ''}
        ${r && r.v > 2 ? '<div class="warnbox">น้ำวิ่งเร็วเกิน 2 ม./วินาที ท่ออาจมีเสียงดังและแรงดันตก ควรขยายท่อ</div>' : ''}
        <div class="btnrow"><button class="btn sm primary" data-hact="tee">ใส่สามทางตรงจุดที่แตะ</button><button class="btn sm" data-hact="flip">สลับแนวเดินท่อ (ขึ้นก่อน/ราบก่อน)</button></div>`;
    }
    return `<div class="card sel" id="hSelCard"><div class="eyebrow">ชิ้นที่เลือก · ${title}</div>${body}<div class="btnrow"><button class="btn danger sm" data-hact="del">ลบ</button></div></div>`;
  }
  function renderPanel() {
    if (!R) return;
    const h = S.house, lv = levels();
    const focus = (sel && R.outs.find(o => o.c.id === sel)) || R.outs.find(o => o.c.open && o.p != null) || null;
    const rows = focus ? ladder(focus) : [], sum = rows.reduce((a, r) => a + r.v, 0), maxAbs = Math.max(1, ...rows.map(r => Math.abs(r.v)));
    const B = R.bom, Fx = B.F;
    panel.innerHTML = `
    <div><div class="eyebrow">ต่อน้ำในบ้าน</div><h2>วางถัง ปั๊ม ท่อ และก๊อก แล้วดูแรงดันทุกจุด</h2><p>วางอุปกรณ์จากแถบซ้าย แล้วกดวงกลม <b>+</b> ที่ปลายท่อหรือจุดต่อที่ยังว่าง เลือกทิศ ↗↘↙↖↑↓ และความยาวท่อ เลี้ยวเมื่อไรจะใส่ข้องอให้ แตะท่อแล้วกด "ใส่สามทาง" เพื่อแยกทาง</p></div>
    ${selEditor()}
    <div class="card">
      <h3>จุดใช้น้ำ ${R.total > 0 ? `· รวม ${fmt(R.total, 1)} ล./นาที` : ''}</h3>
      ${R.outs.length ? `<div class="list">${R.outs.map(o => `<div class="outRow ${sel === o.c.id ? 'sel' : ''}"><button class="grow linkish" data-pick="${o.c.id}"><b>${esc(o.c.name)}</b><small>${o.p == null ? 'ยังไม่ได้ต่อน้ำ' : o.c.open ? `${fmt(o.p, 2)} บาร์ · ${fmt(o.q, 1)} ล./นาที · ${stText[o.st]}` : `ปิด · รอ ${fmt(o.p, 2)} บาร์`}</small>${meter(o)}</button><span class="switch"><input type="checkbox" aria-label="เปิด ${esc(o.c.name)}" data-open="${o.c.id}" ${o.c.open ? 'checked' : ''}><span></span></span></div>`).join('')}</div>
      <p class="note">เปิดหลายจุดพร้อมกันเพื่อดูว่าแรงดันตกเท่าไร แถบเขียว = ใช้ได้ดี เหลือง = เบา</p>` : '<p class="note">ยังไม่มีจุดใช้น้ำ</p>'}
    </div>
    ${R.pumps.length ? `<div class="card"><h3>ปั๊ม</h3>${R.pumps.map(p => `<button class="linkish pumpRow" data-pick="${p.c.id}"><b>${esc(p.c.name)} · ${esc(p.sp.brand)} ${esc(p.sp.model)}</b><small>${p.connected && p.Q > 0.05 ? `${fmt(p.Q, 1)} ล./นาที · ขาออก ${fmt(p.pOut, 2)} บาร์ · ~${fmt0(p.watt)} วัตต์` : ''}</small><span class="note">${esc(p.note)}</span></button>`).join('')}</div>` : ''}
    ${focus ? `<div class="card"><h3>ที่มาของแรงดัน · ${esc(focus.c.name)}</h3>
      <div class="ladder">${rows.map(r => `<div class="lrow"><span class="lt">${esc(r.t)}</span><span class="lbar"><i class="${r.v >= 0 ? 'pos' : 'neg'}" style="width:${Math.abs(r.v) / maxAbs * 100}%"></i></span><span class="lv num">${r.v >= 0 ? '+' : '−'}${fmt(Math.abs(r.v), 2)}</span></div>`).join('')}
      <div class="lrow total"><span class="lt">เหลือ ${fmt(sum, 2)} ม. ÷ 10.2</span><span></span><span class="lv num">${fmt(sum / BAR, 2)} บาร์</span></div></div>
      <details><summary>สูตรที่ใช้</summary><div class="formula">
        <p><b>แรงดันที่ก๊อก</b> P = (H<sub>ต้นทาง</sub> + H<sub>ปั๊ม</sub> − Σh<sub>f</sub> − Σh<sub>m</sub> − z) ÷ 10.2 บาร์ ไล่ตามทางที่น้ำไหลมามากที่สุด</p>
        <p><b>แรงเสียดทานท่อ</b> h<sub>f</sub> = 10.67 · L · Q<sup>1.852</sup> ÷ (C<sup>1.852</sup> · D<sup>4.87</sup>) · C = 150 (PVC)</p>
        <p><b>ข้อต่อ</b> h<sub>m</sub> = K · v² ÷ 2g · ข้องอ K ${K_ELBOW} · สามทาง K ${K_TEE} · ข้อต่อตรง K ${K_COUP}</p>
        <p><b>ก๊อก</b> Q = K<sub>ก๊อก</sub> · √P · <b>ปั๊ม</b> ส่งสูง = H<sub>0</sub> − B·Q² และไม่เกินแรงดันที่สวิตช์หรือตัวคุมตั้งไว้</p>
        <p>แก้สมการทั้งบ้านพร้อมกันด้วยวิธี Global Gradient (แบบเดียวกับ EPANET) ${R.iters} รอบ</p></div></details></div>` : ''}
    <div class="card"><h3>รายการของที่ต้องซื้อ</h3><div class="tbl"><table>
      ${Object.entries(B.len).map(([k, v]) => `<tr><td>ท่อ ${PIPES[k].label}</td><td class="n">${fmt(v, 1)} ม. (${fmt0(Math.ceil(v / 4))} เส้น ยาว 4 ม.)</td></tr>`).join('')}
      ${[['elbow', 'ข้องอ 90°'], ['coupling', 'ข้อต่อตรง'], ['tee', 'สามทาง'], ['cross', 'สี่ทาง'], ['reducer', 'ข้อลด (ต่อท่อต่างขนาด)'], ['adapter', 'ข้อต่อเกลียว (เข้าอุปกรณ์)']].filter(([k]) => Fx[k]).map(([k, t]) => `<tr><td>${t}</td><td class="n">${Fx[k]} ตัว</td></tr>`).join('')}
    </table></div><p class="note">นับจากแนวท่อในแบบ ยังไม่รวมวาล์ว กาว เทปพันเกลียว และตัวยึดท่อ ควรเผื่อท่อเพิ่ม 10%</p></div>
    <div class="card"><h3>ตัวบ้าน</h3><div class="grid2">${hf('กว้าง', 'h.w', h.w, 'ม.')}${hf('ลึก', 'h.d', h.d, 'ม.')}${hf('จำนวนชั้น', 'h.floors', h.floors, 'ชั้น', { step: 1 })}${hf('สูงต่อชั้น', 'h.fh', h.fh, 'ม.')}</div>
      <div class="fld"><label>พื้นทำงาน (วางของและท่อที่ระดับนี้)</label><div class="segc">${lv.map((z, i) => `<button data-level="${z}" class="${S.level === z ? 'on' : ''}">${levelName(z, i, lv)}</button>`).join('')}</div></div>
      <div class="fld"><label for="h_defsize">ขนาดท่อเมื่อลากท่อใหม่</label><select id="h_defsize" data-h="size">${SIZES.map(k => `<option value="${k}"${k === S.size ? ' selected' : ''}>${PIPES[k].label}</option>`).join('')}</select></div>
      <div class="fld"><label>หน่วยกำลังปั๊ม</label><div class="segc"><button data-unit="w" class="${S.unit !== 'hp' ? 'on' : ''}">วัตต์</button><button data-unit="hp" class="${S.unit === 'hp' ? 'on' : ''}">แรงม้า</button></div></div>
    </div>
    <div class="btnrow"><button class="btn" data-hact="reset">กลับเป็นบ้านตัวอย่าง</button><button class="btn" data-hact="clear">ล้างทั้งหมด</button></div>`;
  }
  panel.addEventListener('change', e => {
    const t = e.target;
    if (t.dataset.open) { const c = comp(t.dataset.open); if (c) { snap(); c.open = t.checked; changed(); } return; }
    if (t.dataset.hb) { const c = comp(sel); if (!c) return; snap(); c[t.dataset.hb.slice(2)] = t.checked; changed(); return; }
    const k = t.dataset.h; if (!k) return;
    snap();
    let v = t.value; const isNum = t.type === 'number' || t.type === 'range' || k === 'c.liters';
    if (isNum) { v = parseFloat(v); if (!isFinite(v)) { hist.pop(); toast('ใส่เป็นตัวเลข'); renderPanel(); return; } }
    if (k === 'size') S.size = v;
    else if (k.startsWith('h.')) { const kk = k.slice(2); S.house[kk] = kk === 'floors' ? clamp(Math.round(v), 1, 5) : clamp(v, 1, 60); if (!levels().includes(S.level)) S.level = 0; }
    else if (k.startsWith('c.')) { const c = comp(sel); if (!c) return; const kk = k.slice(2); c[kk] = kk === 'z' ? Math.max(0, v) : v; if (kk === 'model' && c.model !== 'custom') delete c.set; }
    else if (k === 'n.z') { const n = S.nodes[sel]; if (n) n.z = Math.max(0, v); }
    else if (k === 'p.size') { const p = S.pipes.find(x => x.id === sel); if (p) p.size = v; }
    changed();
  });
  panel.addEventListener('input', e => { if (e.target.type === 'range') { const b = e.target.closest('.fld').querySelector('b'); if (b) b.textContent = `${fmt(+e.target.value, 1)} บาร์`; } });
  panel.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.pick) { sel = b.dataset.pick; renderPanel(); request(); return; }
    if (b.dataset.level != null) { S.level = +b.dataset.level; save(); renderPanel(); updateBar(); request(); return; }
    if (b.dataset.unit) { S.unit = b.dataset.unit; save(); renderPanel(); request(); return; }
    const a = b.dataset.hact;
    if (a === 'del') deleteSel();
    if (a === 'rot') { const c = comp(sel); if (c) { snap(); c.rot = ((c.rot || 0) + 1) & 3; changed(); } }
    if (a === 'tee') { const pp = S.pipes.find(x => x.id === sel); if (!pp) return; let pt = lastPipePt && lastPipePt.id === sel ? lastPipePt.p : null; if (!pt) { const r = route(pp); const a0 = r[0], b0 = r[1]; pt = a0.map((v, i) => snapG((v + b0[i]) / 2)); } teeOnPipe(sel, pt); return; }
    if (a === 'branch') { const n = S.nodes[sel]; if (!n) return; const used = ((R.net.F.byKey.get('n:' + sel) || { dirs: [] }).dirs || []).map(dkey); const cand = ['+y', '-y', '+x', '-x', '+z', '-z'].find(d => !used.includes(d)); const h = { ref: { n: sel }, p: [n.x, n.y, n.z], d: cand, used, kind: used.length >= 2 ? 'tee' : '' }; const q = handleAt(h); menu = null; openMenu(h, q[0], q[1]); return; }
    if (a === 'flip') { const p = S.pipes.find(x => x.id === sel); if (p) { snap(); p.zfirst = !p.zfirst; changed(); } }
    if (a === 'reset') { snap(); S = sample(); sel = null; changed(); fit(); toast('กลับเป็นบ้านตัวอย่างแล้ว · กดย้อนเพื่อเอาคืน'); }
    if (a === 'clear') { snap(); S.comps = []; S.pipes = []; S.nodes = {}; sel = null; changed(); toast('ล้างแล้ว เริ่มจากวาง "ประปาเข้า" ด้วยแถบเครื่องมือซ้าย'); }
  });
  function resize() { const r = stage.getBoundingClientRect(); W = Math.max(1, r.width); H = Math.max(1, r.height); dpr = Math.min(2, window.devicePixelRatio || 1); cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); request(); }
  new ResizeObserver(() => { const first = W <= 1; resize(); if (first && active) fit(); }).observe(stage);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) request(); });
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', request);

  try { const s = localStorage.getItem(LS); if (s) S = JSON.parse(s); } catch (e) { }
  if (!S || !S.comps || !S.house) S = sample();
  return {
    show() { active = true; resize(); R = solveHouse(); renderPanel(); labelBtn(); document.querySelector('#hTools [data-v=color]').classList.toggle('on', S.colorBy === 'pressure'); setTool('select'); fit(); },
    hide() { active = false; closeMenuH(); },
    undo, deleteSel, closeMenu() { if (menu) { closeMenuH(); return; } if (tool !== 'select') { if (draft) finishPipe(); else setTool('select'); } else { sel = null; renderPanel(); request(); } },
    get active() { return active; }, get S() { return S; }, get RES() { return R; },
    solveHouse, Pj, ports, route, ladder, CATALOG, pumpSpec, setTool,
  };
})();

</script>
<script>
/* mode switch: lab (formula sandbox) · house plumbing · farm plan */
window.ISO = null;
(function () {
  const sw = document.getElementById('modeSw');
  const views = { lab: ['labView', SIM], house: ['houseView', HOUSE], farm: ['farmView', null] };
  function setMode(m) {
    if (!views[m]) m = 'farm';
    document.body.classList.toggle('mode-simple', m !== 'farm');
    Object.entries(views).forEach(([k, [id, mod]]) => { document.getElementById(id).hidden = k !== m; if (k !== m && mod) mod.hide(); });
    sw.querySelectorAll('button').forEach(b => { b.classList.toggle('on', b.dataset.mode === m); b.setAttribute('aria-selected', b.dataset.mode === m); });
    window.ISO = views[m][1];
    if (window.ISO) window.ISO.show(); else Map2.resize();
    try { localStorage.setItem('phangnamrai.mode', m); } catch (e) { }
  }
  sw.addEventListener('click', e => { const b = e.target.closest('button'); if (b) setMode(b.dataset.mode); });
  let m = 'farm'; try { m = localStorage.getItem('phangnamrai.mode') || 'farm'; } catch (e) { }
  if (m === 'simple') m = 'house';
  setMode(m);
})();
</script>
