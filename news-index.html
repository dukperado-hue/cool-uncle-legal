<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cool Uncle ⚖ Legal Lab | เรียนกฎหมายจากคดีจริง</title>
<link rel="stylesheet" href="prototype/shared.css">
<style>
/* ================================================================
   HOME V2 REDESIGN — "เปิดแฟ้มคดี" (case-file) editorial concept
   READ THE CASE → THINK LIKE A LAWYER → MAKE YOUR OWN VERDICT
   Presentation layer only — all content still fetched live from
   golden-cases.json + per-case JSON (One Source of Truth intact).
   ================================================================ */

.home-v2{max-width:1120px;margin:0 auto;padding:0 20px 80px}

/* ---------- shared section chrome ---------- */
.v2-kicker{font-family:'JetBrains Mono',monospace;font-size:.78rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);display:flex;align-items:center;gap:10px;margin:0 0 10px}
.v2-kicker::before{content:"";width:26px;height:2px;background:var(--gold)}
.v2-section{margin:76px 0}
.v2-section-head{max-width:640px;margin:0 0 30px}
.v2-section-head h2{font-family:'Noto Serif Thai',serif;font-weight:900;font-size:1.9rem;line-height:1.3;color:var(--ink);margin:0 0 10px}
.v2-section-head p{color:var(--ink-soft);font-size:1.02rem;line-height:1.8;margin:0}

/* ---------- HERO ---------- */
.hero-v2{
  position:relative;overflow:hidden;border-radius:22px;margin:18px 0 0;
  background:
    radial-gradient(900px 420px at 82% -10%, rgba(176,138,60,.35), transparent 62%),
    linear-gradient(150deg,#161C2C 0%,#1B2437 46%,#2A3654 100%);
  padding:56px 48px 44px;color:#F5F2E8;
}
.hero-v2::before{
  /* fine grain texture, pure CSS — no image asset needed */
  content:"";position:absolute;inset:0;opacity:.06;mix-blend-mode:overlay;pointer-events:none;
  background-image:radial-gradient(rgba(255,255,255,.9) .6px, transparent .6px);
  background-size:3px 3px;
}
.hero-v2::after{
  /* folded case-file corner, top-right */
  content:"";position:absolute;top:0;right:0;width:0;height:0;
  border-style:solid;border-width:0 64px 64px 0;
  border-color:transparent rgba(245,242,232,.10) transparent transparent;
}
.hero-file-tab{
  position:relative;z-index:2;display:inline-flex;align-items:center;gap:8px;
  font-family:'JetBrains Mono',monospace;font-size:.78rem;font-weight:700;letter-spacing:.1em;
  color:#E8C989;background:rgba(232,201,137,.12);border:1px solid rgba(232,201,137,.4);
  border-radius:999px;padding:6px 14px;margin-bottom:22px;text-transform:uppercase;
}
.hero-file-tab .dot{width:6px;height:6px;border-radius:50%;background:#E8635A;box-shadow:0 0 0 3px rgba(230,99,90,.25)}
.hero-v2 h1{
  position:relative;z-index:2;font-family:'Noto Serif Thai',serif;font-weight:900;
  font-size:2.7rem;line-height:1.28;color:#fff;margin:0 0 20px;max-width:15ch;
}
.hero-v2 h1 em{font-style:normal;color:#E8C989}
.hero-v2 .hero-sub{position:relative;z-index:2;font-size:1.08rem;line-height:1.9;color:#C9CEDD;max-width:52ch;margin:0 0 30px}
.hero-actions-v2{position:relative;z-index:2;display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.btn-v2{
  font-family:'Sarabun',sans-serif;font-weight:700;font-size:1rem;border-radius:13px;
  padding:15px 26px;text-decoration:none;display:inline-flex;align-items:center;gap:9px;
  transition:transform .18s ease,box-shadow .18s ease;border:none;cursor:pointer;
}
.btn-v2.primary{background:var(--gold, #E8C989);background:linear-gradient(135deg,#E8C989,#C9A24B);color:#241A05;box-shadow:0 10px 26px rgba(201,162,75,.35)}
.btn-v2.primary:hover{transform:translateY(-3px);box-shadow:0 14px 32px rgba(201,162,75,.45)}
.btn-v2.ghost{background:transparent;border:1.5px solid rgba(255,255,255,.45);color:#fff}
.btn-v2.ghost:hover{background:rgba(255,255,255,.1);transform:translateY(-3px)}
.hero-file-title{position:relative;z-index:2;margin-top:34px;padding-top:22px;border-top:1px dashed rgba(255,255,255,.2);font-size:.85rem;color:#9AA0C0}
.hero-file-title b{color:#E8C989;font-family:'Noto Serif Thai',serif;font-weight:700}

/* ---------- THREE ENTRY POINTS ---------- */
.entry-grid{display:grid;grid-template-columns:1fr 1.18fr 1fr;gap:18px;align-items:stretch}
.entry-card{
  position:relative;border-radius:18px;padding:30px 26px;text-decoration:none;color:inherit;
  display:flex;flex-direction:column;gap:12px;transition:transform .2s ease,box-shadow .2s ease;
  border:1px solid var(--line);
}
.entry-card .ep-num{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:.82rem;opacity:.55}
.entry-card .ep-ico{font-size:2rem;line-height:1}
.entry-card h3{font-family:'Noto Serif Thai',serif;font-size:1.32rem;font-weight:900;margin:0}
.entry-card p{font-size:.94rem;line-height:1.7;margin:0;flex:1}
.entry-card .ep-cta{font-weight:700;font-size:.9rem;display:flex;align-items:center;gap:6px}
.entry-card.read{background:#fff}
.entry-card.read:hover{transform:translateY(-4px);box-shadow:0 14px 30px rgba(34,40,58,.12);border-color:#c9cee0}
.entry-card.play{
  background:linear-gradient(160deg,#1B2437,#2E3A55);color:#F5F2E8;border-color:#1B2437;
  transform:scale(1.03);box-shadow:0 18px 40px rgba(27,36,55,.28);
}
.entry-card.play:hover{transform:scale(1.03) translateY(-4px);box-shadow:0 22px 46px rgba(27,36,55,.36)}
.entry-card.play .ep-num{opacity:.5;color:#E8C989}
.entry-card.play .ep-cta{color:#E8C989}
.entry-card.cases{background:var(--gold-soft, #F3E8CF)}
.entry-card.cases:hover{transform:translateY(-4px);box-shadow:0 14px 30px rgba(176,138,60,.18)}
@media(max-width:860px){.entry-grid{grid-template-columns:1fr}.entry-card.play{transform:none}.entry-card.play:hover{transform:translateY(-4px)}}

/* ---------- CASE OF THE WEEK ---------- */
.cow-card{background:var(--card);border-radius:20px;box-shadow:var(--shadow);overflow:hidden;border:1px solid var(--line)}
.cow-top{padding:30px 34px 8px}
.cow-tags{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.cow-title{font-family:'Noto Serif Thai',serif;font-size:1.7rem;font-weight:900;color:var(--ink);line-height:1.4;margin:0 0 12px}
.cow-blurb{color:var(--ink-soft);font-size:1.02rem;line-height:1.85;margin:0 0 6px}
.flow-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin-top:8px;border-top:1px solid var(--line)}
.flow-step{padding:22px 20px;border-right:1px solid var(--line);position:relative}
.flow-step:last-child{border-right:none}
.flow-step .fs-label{font-family:'JetBrains Mono',monospace;font-size:.7rem;font-weight:700;letter-spacing:.1em;color:var(--gold);text-transform:uppercase;display:block;margin-bottom:8px}
.flow-step p{font-size:.87rem;line-height:1.65;color:var(--ink-soft);margin:0;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.flow-step.verdict p{color:var(--ink);font-weight:600}
.cow-cta-wrap{padding:22px 34px 28px;display:flex;justify-content:flex-end}
.cow-cta{font-weight:700;color:var(--accent);text-decoration:none;font-size:.98rem;display:inline-flex;align-items:center;gap:8px}
.cow-cta:hover{text-decoration:underline}
@media(max-width:760px){.flow-strip{grid-template-columns:1fr 1fr}.flow-step{border-bottom:1px solid var(--line)}.flow-step:nth-child(2){border-right:none}.flow-step p{-webkit-line-clamp:3}}
@media(max-width:480px){.flow-strip{grid-template-columns:1fr}.flow-step{border-right:none!important}}

/* ---------- PLAY MODE SHOWCASE ---------- */
.play-showcase{background:#1B2437;border-radius:22px;padding:46px 40px;color:#F5F2E8;position:relative;overflow:hidden}
.play-showcase::before{content:"";position:absolute;inset:0;opacity:.05;mix-blend-mode:overlay;pointer-events:none;background-image:radial-gradient(rgba(255,255,255,.9) .6px, transparent .6px);background-size:3px 3px}
.ps-head{position:relative;z-index:2;max-width:560px;margin-bottom:36px}
.ps-head .v2-kicker{color:#E8C989}
.ps-head .v2-kicker::before{background:#E8C989}
.ps-head h2{font-family:'Noto Serif Thai',serif;font-weight:900;font-size:1.9rem;color:#fff;line-height:1.35;margin:0 0 10px}
.ps-head p{color:#C9CEDD;font-size:1rem;line-height:1.8;margin:0}
.ps-track{position:relative;z-index:2;display:flex;gap:0;overflow-x:auto;padding-bottom:6px;margin:0 -4px}
.ps-step{flex:1 0 150px;padding:0 14px;position:relative}
.ps-step::before{content:"";position:absolute;top:19px;left:0;width:100%;height:2px;background:rgba(255,255,255,.16)}
.ps-step:first-child::before{left:50%;width:50%}
.ps-step:last-child::before{width:50%}
.ps-step .ps-circle{
  position:relative;z-index:2;width:40px;height:40px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;
  font-weight:700;font-size:.9rem;background:#2E3A55;border:2px solid rgba(232,201,137,.5);color:#E8C989;margin-bottom:14px;
}
.ps-step.locked .ps-circle{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.22);color:#8A90A8}
.ps-step h4{font-family:'Sarabun',sans-serif;font-weight:700;font-size:.95rem;color:#fff;margin:0 0 6px;line-height:1.5}
.ps-step p{font-size:.8rem;color:#9AA0C0;line-height:1.6;margin:0}
.ps-step.locked h4{color:#B7BCD4}
.ps-lock-ico{font-size:.75rem;margin-left:4px;opacity:.7}
.ps-cta{position:relative;z-index:2;margin-top:34px}
@media(max-width:760px){.play-showcase{padding:32px 22px}.ps-track{overflow-x:auto}.ps-step{flex:0 0 140px}}

/* ---------- CASE LIBRARY ---------- */
.lib-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px;margin-bottom:18px}
.lib-card{
  background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 24px;
  text-decoration:none;color:inherit;position:relative;transition:transform .18s ease,box-shadow .18s ease;
  display:flex;flex-direction:column;gap:12px;
}
.lib-card:hover{transform:translateY(-4px);box-shadow:0 14px 30px rgba(34,40,58,.14);border-color:var(--gold)}
.lib-card-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.lib-grade{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:.78rem;color:var(--gold);border:1px solid var(--gold);border-radius:999px;padding:2px 10px}
.lib-card h3{font-family:'Noto Serif Thai',serif;font-size:1.14rem;font-weight:900;color:var(--ink);margin:0;line-height:1.5}
.lib-card p{font-size:.9rem;color:var(--ink-soft);line-height:1.65;margin:0;flex:1}
.lib-cta{font-weight:700;font-size:.86rem;color:var(--accent)}
.lib-note{background:#F3F0E7;border:1px dashed var(--line);border-radius:14px;padding:18px 22px;font-size:.9rem;color:var(--ink-soft);line-height:1.75}
.lib-note strong{color:var(--ink)}
.lib-filter-row{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 20px}
.lib-chip{background:#fff;border:1px solid var(--line);border-radius:999px;padding:7px 15px;font-size:.88rem;font-weight:600;color:var(--ink-soft);cursor:pointer;font-family:'Sarabun',sans-serif;transition:all .15s}
.lib-chip:hover{border-color:var(--gold)}
.lib-chip.on{background:#1B2437;color:#fff;border-color:#1B2437}
.lib-chip .n{font-weight:800;margin-left:2px;opacity:.75}
</style>
</head>
<body>
<div class="topbar mag">
  <a class="tb-brand" href="news-index.html"><img src="prototype/assets/capybara-64.webp" alt="" width="36" height="36">Cool Uncle <span style="color:#B08A3C">⚖</span> Legal Lab</a>
  <span class="tb-sep">|</span>
  <span>เรียนกฎหมายจากคดีจริง</span>
  <div class="topbar-right"><span class="topbar-pill" id="db-count">⏳ กำลังโหลด...</span></div>
</div>

<div class="home-v2" id="app">
  <p style="padding:80px 0;text-align:center;color:var(--ink-faint)">กำลังเปิดแฟ้มคดี...</p>
</div>

<footer>
  Cool Uncle ⚖ Legal Lab — curated public surface (Golden Cases) · ฐานข้อมูลเต็มอยู่หลัง validation gate (RULE 4, 5, 10) · Better 10 excellent cases than 300 inconsistent cases
</footer>

<script>
/* ================================================================
   HOME V2 REDESIGN — data layer: golden-cases.json + per-case JSON
   under prototype/assets/cases/ (this page lives at repo root, one
   level above prototype/, hence the prototype/ prefix on every path).
   ================================================================ */
const GOLDEN_URL = 'prototype/assets/cases/golden-cases.json';
const CASE_URL = id => `prototype/assets/cases/${id}.json`;
const CAT_BADGE = { 'คดีอาญา':'criminal', 'คดีแพ่ง':'civil', 'คดีปกครอง':'admin', 'คดีรัฐธรรมนูญ':'const', 'คดีองค์กรธุรกิจ':'corporate', 'กฎหมายระหว่างประเทศ':'international' };
const PLAY_STEP_ICONS = { case_setup:'📋', legal_issue:'❓', guess_law:'📖', predict_verdict:'⚖️', show_verdict:'🔓', show_reasoning:'💡' };

function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function truncate(s, n){ s = String(s||''); return s.length > n ? s.slice(0, n).trim() + '…' : s; }

async function fetchJson(url){
  const res = await fetch(url, {cache:'no-store'});
  if(!res.ok) throw new Error('HTTP '+res.status);
  return res.json();
}

function badgeHtml(catThai){
  const cls = CAT_BADGE[catThai] || 'civil';
  return `<span class="badge ${cls}">${esc(catThai || '')}</span>`;
}

function heroSection(featuredCase, featuredId){
  const m = featuredCase.meta || {};
  return `
  <section class="hero-v2">
    <span class="hero-file-tab"><span class="dot"></span> แฟ้มคดีวันนี้ · เปิดอ่านฟรี</span>
    <h1>คดีจริงไม่ได้มีไว้แค่<em>อ่าน</em><br>ลองตัดสินมันด้วยตัวคุณเอง</h1>
    <p class="hero-sub">เรียนกฎหมายไทยผ่านคดีจริง — อ่านข้อเท็จจริง วิเคราะห์ประเด็นกฎหมาย และลองคาดการณ์คำพิพากษาด้วยตัวเองก่อนที่คูลอังกิลจะเฉลย</p>
    <div class="hero-actions-v2">
      <a class="btn-v2 primary" href="prototype/play-case.html?id=${esc(featuredId)}">🎮 ลองตัดสินคดี</a>
      <a class="btn-v2 ghost" href="prototype/read-case.html?id=${esc(featuredId)}">📖 อ่านคดี</a>
    </div>
    <div class="hero-file-title">แฟ้มคดี: <b>${esc(m.title_display || m.title || '')}</b> · ${esc(m.cat || '')}${m.read_minutes ? ' · อ่าน ~'+esc(m.read_minutes)+' นาที' : ''}</div>
  </section>`;
}

function entryPointsSection(featuredId){
  return `
  <section class="v2-section">
    <div class="entry-grid">
      <a class="entry-card read" href="prototype/read-case.html?id=${esc(featuredId)}">
        <span class="ep-num">01</span>
        <span class="ep-ico">📖</span>
        <h3>อ่านคดี</h3>
        <p>อ่านคดีจริงแบบเป็นลำดับ ตั้งแต่ข้อเท็จจริง ประเด็นกฎหมาย บทบัญญัติ บทเรียน ไปจนถึงคำพิพากษา</p>
        <span class="ep-cta">เริ่มอ่าน →</span>
      </a>
      <a class="entry-card play" href="prototype/play-case.html?id=${esc(featuredId)}">
        <span class="ep-num">02</span>
        <span class="ep-ico">🎮</span>
        <h3>ลองตัดสินคดี</h3>
        <p>คิดเหมือนนักกฎหมายผ่าน 6 ขั้นตอน — ทายกฎหมาย ทายคำพิพากษา ก่อนคูลอังกิลจะเฉลยคำตอบจริง</p>
        <span class="ep-cta">เริ่มเล่น →</span>
      </a>
      <a class="entry-card cases" href="prototype/explore.html">
        <span class="ep-num">03</span>
        <span class="ep-ico">🗂️</span>
        <h3>สำรวจคดี</h3>
        <p>ค้นพบคดีที่ผ่านการคัดเลือกและพร้อมสำหรับการเรียนรู้ จัดกลุ่มตามหมวดกฎหมาย</p>
        <span class="ep-cta">ดูคดีทั้งหมด →</span>
      </a>
    </div>
  </section>`;
}

function caseOfWeekSection(featuredCase, featuredId){
  const m = featuredCase.meta || {};
  const sections = (featuredCase.read && featuredCase.read.sections) || [];
  const byKey = k => sections.find(s => s.key === k) || {};
  const facts = (byKey('overview').content || {}).paragraphs?.[0] || '';
  const issue = (byKey('legal_issues').content || {}).issues?.[0]?.question || '';
  const law = (byKey('provisions').content || {}).articles?.[0];
  const lawText = law ? `${law.ref} — ${law.text}` : '';
  const verdict = (byKey('judicial').content || {}).verdict?.decision || '';

  return `
  <section class="v2-section">
    <div class="v2-kicker">Case of the Week</div>
    <div class="cow-card">
      <div class="cow-top">
        <div class="cow-tags">${badgeHtml(m.cat)}<span class="mag-tag exam">📌 Featured · Golden Case</span></div>
        <h2 class="cow-title">${esc(m.title_display || m.title || '')}</h2>
        <p class="cow-blurb">${esc(m.blurb_60 || '')}</p>
      </div>
      <div class="flow-strip">
        <div class="flow-step"><span class="fs-label">01 · Facts</span><p>${esc(truncate(facts, 190))}</p></div>
        <div class="flow-step"><span class="fs-label">02 · Issue</span><p>${esc(truncate(issue, 190))}</p></div>
        <div class="flow-step"><span class="fs-label">03 · Law</span><p>${esc(truncate(lawText, 190))}</p></div>
        <div class="flow-step verdict"><span class="fs-label">04 · Verdict</span><p>${esc(truncate(verdict, 190))}</p></div>
      </div>
      <div class="cow-cta-wrap"><a class="cow-cta" href="prototype/read-case.html?id=${esc(featuredId)}">Explore this case →</a></div>
    </div>
  </section>`;
}

function playShowcaseSection(flow, featuredId){
  const steps = flow.map((s, i) => {
    const locked = s.key === 'show_verdict' || s.key === 'show_reasoning';
    const icon = PLAY_STEP_ICONS[s.key] || '▪';
    return `
      <div class="ps-step ${locked ? 'locked' : ''}">
        <div class="ps-circle">${locked ? '🔒' : (s.step || i+1)}</div>
        <h4>${icon} ${esc(s.title || '')}</h4>
        <p>${locked ? 'ล็อกไว้จนกว่าคุณจะทายคำพิพากษา' : 'ขั้นตอนที่ ' + (s.step || i+1) + ' จาก ' + flow.length}</p>
      </div>`;
  }).join('');

  return `
  <section class="v2-section">
    <div class="play-showcase">
      <div class="ps-head">
        <div class="v2-kicker">Play Mode</div>
        <h2>อย่าเพิ่งดูคำตอบ<br>ลองตัดสินคดีด้วยตัวเองก่อน</h2>
        <p>คูลอังกิลจะไม่บอกคำพิพากษาจริงจนกว่าคุณจะทายก่อน — 6 ขั้นตอนเดียวกับที่นักกฎหมายใช้คิด</p>
      </div>
      <div class="ps-track">${steps}</div>
      <div class="ps-cta"><a class="btn-v2 primary" href="prototype/play-case.html?id=${esc(featuredId)}">🎮 เริ่มเล่นเลย</a></div>
    </div>
  </section>`;
}

const CATEGORY_LABELS = {
  criminal: 'อาญา',
  economic: 'เศรษฐกิจ',
  family: 'ครอบครัว-มรดก',
  political: 'รธน.-การเมือง-ปกครอง',
  international: 'ระหว่างประเทศ',
  other: 'อื่นๆ',
};
const CATEGORY_ORDER = ['criminal','economic','family','political','international','other'];

function libraryCardHtml(c){
  const m = c.meta || {};
  const grade = (c.rank && c.rank.grade) || 'A';
  const sBadge = (c.rank && c.rank.s_verified) ? '<span class="lib-grade" style="color:#1E7A4F;border-color:#1E7A4F">S — Court Verified</span>' : `<span class="lib-grade">${esc(grade)} — Curated</span>`;
  const cats = (m.categories && m.categories.length) ? m.categories : ['other'];
  return `
    <a class="lib-card" data-cats="${esc(cats.join(' '))}" href="prototype/read-case.html?id=${esc(c.id)}">
      <div class="lib-card-top">${badgeHtml(m.cat)}${sBadge}</div>
      <h3>${esc(m.title_display || m.title || c.id)}</h3>
      <p>${esc(truncate(m.blurb_60 || '', 130))}</p>
      <span class="lib-cta">อ่านคดีนี้ →</span>
    </a>`;
}

function libraryFilterRow(libraryResults){
  const counts = {};
  libraryResults.forEach(c => {
    const cats = (c.meta && c.meta.categories && c.meta.categories.length) ? c.meta.categories : ['other'];
    cats.forEach(k => { counts[k] = (counts[k]||0) + 1; });
  });
  const allChip = `<button class="lib-chip on" data-filter="all">ทั้งหมด <span class="n">${libraryResults.length}</span></button>`;
  const chips = CATEGORY_ORDER.filter(k => counts[k]).map(k =>
    `<button class="lib-chip" data-filter="${k}">${esc(CATEGORY_LABELS[k])} <span class="n">${counts[k]}</span></button>`
  ).join('');
  return `<div class="lib-filter-row">${allChip}${chips}</div>`;
}

function librarySection(libraryResults){
  const cardsHtml = libraryResults.map(libraryCardHtml).join('');
  return `
  <section class="v2-section">
    <div class="v2-section-head">
      <div class="v2-kicker">The Case Library</div>
      <h2>คดีที่ผ่านการคัดเลือกเพื่อใช้เป็นสื่อการเรียนรู้กฎหมาย</h2>
    </div>
    ${libraryFilterRow(libraryResults)}
    <div class="lib-grid" id="lib-grid">${cardsHtml || ''}</div>
  </section>`;
}

function initLibraryFilter(){
  const row = document.querySelector('.lib-filter-row');
  if(!row) return;
  row.addEventListener('click', e => {
    const btn = e.target.closest('.lib-chip');
    if(!btn) return;
    row.querySelectorAll('.lib-chip').forEach(b => b.classList.remove('on'));
    btn.classList.add('on');
    const filter = btn.dataset.filter;
    document.querySelectorAll('#lib-grid .lib-card').forEach(card => {
      const cats = (card.dataset.cats || '').split(' ');
      card.style.display = (filter === 'all' || cats.includes(filter)) ? '' : 'none';
    });
  });
}

async function init(){
  const app = document.getElementById('app');
  let g;
  try{
    g = await fetchJson(GOLDEN_URL);
  }catch(e){
    app.innerHTML = `<div class="lib-note">โหลด curated content ไม่ได้: ${esc(e.message)}<br>ไฟล์: ${esc(GOLDEN_URL)}</div>`;
    return;
  }
  document.getElementById('db-count').textContent = '⚖ Golden Cases';

  const featuredId = (g.featured_cases || [])[0];
  const goldenPublic = (g.golden_cases || []).filter(x => x.visibility && x.visibility.public);

  let featuredCase;
  try{
    featuredCase = await fetchJson(CASE_URL(featuredId));
  }catch(e){
    app.innerHTML = `<div class="lib-note">โหลดคดีแนะนำ (${esc(featuredId)}) ไม่ได้: ${esc(e.message)}</div>`;
    return;
  }

  // Fetch each public golden case's own detail JSON — a card only renders
  // if the file actually exists, so a data-index entry with no matching
  // file never becomes a dead link. This never edits golden-cases.json,
  // only skips rendering.
  const libraryResults = (await Promise.all(goldenPublic.map(async c => {
    try{ const detail = await fetchJson(CASE_URL(c.id)); return {...c, meta: detail.meta}; }
    catch{ return null; }
  }))).filter(Boolean);

  app.innerHTML =
    heroSection(featuredCase, featuredId) +
    entryPointsSection(featuredId) +
    caseOfWeekSection(featuredCase, featuredId) +
    playShowcaseSection((featuredCase.play && featuredCase.play.flow) || [], featuredId) +
    librarySection(libraryResults);

  initLibraryFilter();
  window.__golden = g;
}
init();
</script>
</body>
</html>
