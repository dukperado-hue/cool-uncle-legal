name: Build Android App

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Checkout Code
      uses: actions/checkout@v4

    - name: ⚙️ Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        
    - name: ☕ Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: 📦 Install Dependencies
      run: npm install

    - name: 📂 Prepare Web Assets (Auto-Copy)
      run: |
        mkdir -p www
        # ก๊อปปี้ไฟล์ HTML และ JSON ทั้งหมดเข้า www
        cp *.html www/
        cp *.json www/
        # ถ้ามีโฟลเดอร์ pics หรือ docs ให้ก๊อปปี้ไปด้วย
        cp -r pics www/ 2>/dev/null || true
        cp -r docs www/ 2>/dev/null || true

    - name: 📱 Sync Capacitor
      run: npx cap sync android

    - name: 🏗️ Build Android APK
      working-directory: ./android
      run: ./gradlew assembleDebug

    - name: 📤 Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: android/app/build/outputs/apk/debug/app-debug.apk
