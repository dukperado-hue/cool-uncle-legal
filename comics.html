<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ลุงคูลคอมิก — การ์ตูนกฎหมาย</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#22283A;--ink-soft:#5A6072;--ink-faint:#8a8fa0;--line:#e2ded3;--accent:#c0392b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14161f;--card:#1c2030;--ink:#E9E7E1;--ink-soft:#A9AEC2;--ink-faint:#8a8fa5;--line:#2c3148;--accent:#ff7a6b}}
:root[data-theme="dark"]{--bg:#14161f;--card:#1c2030;--ink:#E9E7E1;--ink-soft:#A9AEC2;--ink-faint:#8a8fa5;--line:#2c3148;--accent:#ff7a6b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Sarabun',system-ui,sans-serif;line-height:1.6}
header{padding:20px 16px 8px;max-width:980px;margin:0 auto}
header a{color:var(--ink-soft);font-size:14px;text-decoration:none}
h1{margin:6px 0 2px;font-size:26px}
.sub{color:var(--ink-soft);font-size:14px}
main{max-width:980px;margin:0 auto;padding:8px 16px 60px}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.tab{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 15px;cursor:pointer;font:inherit;font-size:14px;font-weight:700}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
</style>
</head>
<body>
<header>
  <a href="index.html">← หน้าแรก</a>
  <h1>🎭 ลุงคูลคอมิก</h1>
  <div class="sub">การ์ตูนอธิบายกฎหมายทีละครั้งเรียน — กด ▶ เพื่ออ่านเต็มจอ (ทีละหน้า หรือเลื่อนต่อเนื่อง) ระบบจำหน้าที่อ่านค้างไว้ให้</div>
</header>
<main>
  <div class="tabs" id="tabs" role="tablist"></div>
  <div id="list"></div>
</main>
<script src="comics-tab.js?v=3"></script>
<script>
(function(){
  var V = '3';
  var list = document.getElementById('list'), tabs = document.getElementById('tabs');
  var data = null, cur = null;
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function render(){
    tabs.innerHTML = data.subjects.map(function(x){
      return '<button class="tab" role="tab" aria-selected="'+(x.code===cur)+'" data-code="'+esc(x.code)+'">'+esc(x.emoji||'')+' '+esc(x.name)+' ('+x.eps.length+')</button>';
    }).join('');
    ComicsTab.mount(cur, list, {idPrefix: cur + '-'});
  }
  document.addEventListener('click',function(ev){
    var t = ev.target.closest('.tab'); if(t){ cur=t.getAttribute('data-code'); try{history.replaceState(null,'','#'+cur)}catch(e){} render(); }
  });
  fetch('comics/index.json?v='+V).then(function(r){return r.json()}).then(function(d){
    data = d;
    var m = location.hash.match(/^#([a-z]+)/);
    cur = (m && d.subjects.some(function(x){return x.code===m[1]})) ? m[1] : d.subjects[0].code;
    render();
  }).catch(function(){ list.innerHTML='<div style="padding:24px 0;color:var(--ink-soft)">โหลดรายการไม่สำเร็จ</div>'; });
})();
</script>
</body>
</html>
