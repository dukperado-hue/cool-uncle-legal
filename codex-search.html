<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ประมวลกฎหมาย - ค้นหามาตรา</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Thai:wght@500;600;700;900&family=Sarabun:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
:root {
  --paper:#FBF9F4;
  --card:#FFFFFF;
  --ink:#22283A;
  --ink-soft:#5A6072;
  --ink-faint:#9AA0B0;
  --line:#E5E1D6;
  --gold:#B08A3C;
  --accent:#2E4A7A;
  --ok:#1E7A4F;
  --bad:#B23A3A;
  --radius:14px;
  --shadow:0 1px 2px rgba(34,40,58,.05),0 6px 20px rgba(34,40,58,.07);
}

/* ============ THEME: DARK ============ */
:root[data-theme="dark"]{
  --paper:#14161f;
  --card:#1c2030;
  --ink:#E9E7E1;
  --ink-soft:#A9AEC2;
  --ink-faint:#6C7188;
  --line:#2E3348;
  --gold:#E0BD73;
  --accent:#84A6E8;
  --ok:#4FCB8D;
  --bad:#E2685F;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 24px rgba(0,0,0,.45);
}

/* ============ THEME: HORROR (กระสือ mode) ============ */
:root[data-theme="horror"]{
  --paper:#0A070C;
  --card:#151019;
  --ink:#D9D2C9;
  --ink-soft:#9C8F93;
  --ink-faint:#5C5460;
  --line:#2B1F26;
  --gold:#8F1F2B;
  --accent:#4A8F5C;
  --ok:#3F7A4F;
  --bad:#FF3355;
  --shadow:0 1px 2px rgba(0,0,0,.6),0 10px 28px rgba(0,0,0,.6);
}

/* Surfaces that used hardcoded near-white hex instead of a CSS var —
   normalize them under dark/horror with a subtle translucent overlay
   so they still read as "a shade off the card" without needing a
   bespoke hex per element. */
:root[data-theme="dark"] .topbar,
:root[data-theme="horror"] .topbar{ background:var(--card); border-bottom-color:var(--line); }
:root[data-theme="dark"] body{
  background:radial-gradient(1200px 500px at 50% -200px,#232840 0%,transparent 60%),var(--paper);
}
:root[data-theme="horror"] body{
  background:radial-gradient(1200px 500px at 50% -220px,rgba(90,20,30,.35) 0%,transparent 60%),var(--paper);
}
:root[data-theme="dark"] .book-btn,
:root[data-theme="dark"] .btn-secondary,
:root[data-theme="dark"] .icon-btn,
:root[data-theme="horror"] .book-btn,
:root[data-theme="horror"] .btn-secondary,
:root[data-theme="horror"] .icon-btn{
  background:rgba(255,255,255,.04);color:var(--ink-soft);
}
:root[data-theme="dark"] .btn-secondary:hover,
:root[data-theme="horror"] .btn-secondary:hover{background:rgba(255,255,255,.08)}
:root[data-theme="dark"] .note-input,
:root[data-theme="horror"] .note-input{background:rgba(255,255,255,.03)}
:root[data-theme="dark"] .note-input:focus,
:root[data-theme="horror"] .note-input:focus{background:rgba(255,255,255,.06)}

/* THEME TOGGLE */
.theme-toggle{
  display:flex;gap:3px;margin-left:auto;background:var(--card);
  border:1px solid var(--line);border-radius:999px;padding:3px;
}
.theme-toggle button{
  border:none;background:transparent;border-radius:999px;width:28px;height:28px;
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  font-size:14px;transition:all .2s;font-family:inherit;
}
.theme-toggle button.active{background:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.theme-toggle button:hover{background:var(--line)}

/* AMBIENT DRONE MUTE — only shown while horror theme is active */
.drone-mute-btn{
  display:none;
  margin-left:6px;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:999px;
  width:28px;height:28px;
  align-items:center;justify-content:center;
  cursor:pointer;font-size:13px;
}
:root[data-theme="horror"] .drone-mute-btn{ display:flex; }
:root[data-theme="horror"] .drone-mute-btn:hover{ background:var(--line); }

/* GHOST COMPANION (horror mode — rotating cast of 4) */
.ghost-companion{
  position:fixed;right:16px;bottom:16px;width:200px;height:auto;
  pointer-events:auto;cursor:pointer;opacity:0;transform:translateY(8px);
  transition:opacity .6s ease;z-index:999;
  filter:drop-shadow(0 0 16px rgba(180,20,40,.45));
  animation:ghost-float 3.4s ease-in-out infinite;
}
@media(max-width:640px){
  .ghost-companion{width:38vw;max-width:160px;right:10px;bottom:10px}
}
.ghost-companion.visible{opacity:1}
.ghost-companion.pulse{filter:drop-shadow(0 0 26px rgba(180,20,40,.8)) drop-shadow(0 0 10px rgba(255,255,255,.3))}
@keyframes ghost-float{
  0%,100%{transform:translateY(0) rotate(-1.5deg)}
  50%{transform:translateY(-10px) rotate(1.5deg)}
}
.ghost-speech{
  position:fixed;max-width:200px;background:#fff;color:#1a1a1a;
  border-radius:14px;padding:8px 13px;font-size:13px;font-weight:700;
  font-family:'Sarabun',system-ui,sans-serif;line-height:1.4;
  box-shadow:0 8px 20px rgba(0,0,0,.4);z-index:1000;
  opacity:0;pointer-events:none;transform:translateY(6px) scale(.96);
  transition:opacity .2s ease,transform .2s ease;text-align:center;
}
.ghost-speech.visible{opacity:1;transform:translateY(0) scale(1)}
.ghost-speech::after{
  content:"";position:absolute;right:28px;bottom:-8px;width:0;height:0;
  border:8px solid transparent;border-top-color:#fff;
}

*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:'Sarabun',system-ui,sans-serif;
  background:radial-gradient(1200px 500px at 50% -200px,#F2EDDF 0%,transparent 60%),var(--paper);
  color:var(--ink);min-height:100vh;font-size:16px;line-height:1.75;
}

h1,h2,h3{font-family:'Noto Serif Thai',serif}

.topbar{
  display:flex;align-items:center;gap:10px;
  background:#EFEAE0;border-bottom:1px solid var(--line);
  padding:10px 18px;font-size:13px;color:var(--ink-soft);
  position:sticky;top:0;z-index:100;
}
.topbar-brand{font-weight:800;color:var(--ink);display:flex;align-items:center;gap:6px}

.wrap{max-width:1200px;margin:0 auto;padding:20px 18px 60px}

.back-button{
  display:inline-flex;align-items:center;gap:6px;color:var(--accent);
  font-weight:600;font-size:14px;text-decoration:none;margin-bottom:20px;transition:all .2s;
}
.back-button:hover{transform:translateX(-4px);color:var(--ink)}

.search-container{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:24px;margin-bottom:32px;box-shadow:var(--shadow);
}

.search-header h1{font-size:28px;margin-bottom:8px;color:var(--ink)}
.search-header p{font-size:14px;color:var(--ink-soft);margin-bottom:20px}

.book-selector{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
  gap:10px;margin-bottom:24px;
}
.book-btn{
  padding:12px;background:#F5F3F0;border:2px solid var(--line);
  border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;
  transition:all .2s;font-family:inherit;color:var(--ink-soft);
}
.book-btn:hover,.book-btn.active{
  border-color:var(--gold);background:var(--card);color:var(--ink);box-shadow:var(--shadow);
}

.search-form{
  display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px;
}

.form-group{display:flex;flex-direction:column}
.form-group label{
  font-size:13px;font-weight:600;color:var(--ink);margin-bottom:6px;
  text-transform:uppercase;letter-spacing:.05em;
}

input[type="text"],input[type="number"],select{
  padding:10px 12px;border:1px solid var(--line);border-radius:6px;
  font-size:14px;font-family:inherit;background:var(--card);color:var(--ink);
  transition:border-color .2s;
}

input[type="text"]:focus,input[type="number"]:focus,select:focus{
  outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(46,74,122,.1);
}

.search-buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px}

button{
  padding:12px;border:none;border-radius:6px;font-size:14px;
  font-weight:600;cursor:pointer;font-family:inherit;transition:all .2s;
}

.btn-primary{background:var(--accent);color:white}
.btn-primary:hover{background:#1d3a5a;transform:translateY(-1px)}

.btn-secondary{background:#F5F3F0;color:var(--ink);border:1px solid var(--line)}
.btn-secondary:hover{background:#E8E6E0}

.results-container{display:grid;grid-template-columns:250px 1fr;gap:24px}

.filters-sidebar{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:20px;height:fit-content;position:sticky;top:80px;
}

.filters-sidebar h3{font-size:16px;margin-bottom:16px;color:var(--ink)}

.filter-group{margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.filter-group:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0}

.filter-title{
  font-size:12px;font-weight:700;text-transform:uppercase;
  color:var(--ink-soft);margin-bottom:10px;letter-spacing:.05em;
}

.filter-item{display:flex;align-items:center;gap:8px;margin-bottom:8px;cursor:pointer}

.filter-item input[type="checkbox"]{cursor:pointer}

.filter-item label{font-size:13px;color:var(--ink-soft);cursor:pointer;flex:1}

.filter-item label:hover{color:var(--ink)}

.results-main{display:flex;flex-direction:column;gap:16px}

.result-count{
  font-size:13px;color:var(--ink-soft);margin-bottom:12px;
  padding-bottom:12px;border-bottom:1px solid var(--line);
}

.article-card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:20px;
}

.article-header{display:flex;justify-content:space-between;align-items:start;margin-bottom:10px;gap:12px}

.article-number{font-family:'JetBrains Mono',monospace;font-size:18px;font-weight:700;color:var(--accent)}

.article-meta{font-size:11px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.05em;display:flex;gap:8px}

.article-actions{display:flex;align-items:center;gap:6px;flex-shrink:0}

.icon-btn{
  background:#F5F3F0;border:1px solid var(--line);border-radius:6px;
  padding:6px 10px;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink);
  transition:all .2s;white-space:nowrap;
}
.icon-btn:hover{background:var(--card);border-color:var(--gold)}
.icon-btn:disabled{opacity:.4;cursor:not-allowed}
.icon-btn:disabled:hover{background:#F5F3F0;border-color:var(--line)}

.article-text{font-size:15px;color:var(--ink);line-height:1.8;margin:14px 0}

.matra-ref-link{color:var(--accent);text-decoration:underline;text-decoration-style:dotted;text-underline-offset:2px;font-weight:600}
.matra-ref-link:hover{color:var(--gold)}

.article-note{margin:14px 0}
.note-input{
  width:100%;min-height:56px;resize:vertical;
  border:1px dashed var(--ink-faint);border-radius:8px;
  background:#FBFAF6;color:var(--ink);
  font-family:inherit;font-size:13px;padding:10px 12px;line-height:1.6;
}
.note-input::placeholder{color:var(--ink-faint)}
.note-input:focus{outline:none;border-color:var(--gold);background:#fff}

#print-area{display:none}
@media print{
  body.printing-one > *:not(#print-area){display:none !important}
  body.printing-one #print-area{display:block !important;padding:24px}
}

.warak-row{display:grid;grid-template-columns:78px 1fr;gap:12px;align-items:baseline}
.warak-row + .warak-row{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.warak-label{color:var(--gold);font-weight:700;font-size:12px;white-space:nowrap}
.warak-text{white-space:pre-line}

.article-breadcrumb{font-size:12px;color:var(--ink-faint);margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}

.cancelled-badge{color:var(--bad);font-size:12px;font-weight:700;border:1px solid var(--bad);border-radius:4px;padding:2px 6px}

.empty-state{text-align:center;padding:60px 20px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius)}

.empty-state .icon{font-size:48px;margin-bottom:16px}

.empty-state h3{font-size:18px;margin-bottom:8px;color:var(--ink)}

.empty-state p{color:var(--ink-soft);margin-bottom:16px}

.loading{text-align:center;padding:40px;color:var(--ink-soft)}

.loading::after{content:"...";animation:dots 1.5s infinite}

@keyframes dots{0%,33%{content:"."} 66%{content:".."} 100%{content:"..."}}

@media(max-width:768px){
  .results-container{grid-template-columns:1fr}
  .filters-sidebar{position:static}
  .search-form{grid-template-columns:1fr}
  .book-selector{grid-template-columns:repeat(2,1fr)}
  .article-header{flex-wrap:wrap}
}
</style>

<script>
// =====================================================================
// CODEX SEARCH - LIVE VERSION
// Loads from codex-data.json
// =====================================================================

/* ================================================================
   HOVER SOUND (Web Audio API blip) — same implementation as index.html
   and the rest of the site, for consistency.
   ================================================================ */
let __hbAudioCtx;
function playHoverSound(){
  try{
    __hbAudioCtx = __hbAudioCtx || new (window.AudioContext||window.webkitAudioContext)();
    const c = __hbAudioCtx;
    if(c.state === 'suspended') c.resume();
    const t0 = c.currentTime;
    const osc = c.createOscillator(), gain = c.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(880, t0);
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(0.05, t0+0.008);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0+0.09);
    osc.connect(gain); gain.connect(c.destination);
    osc.start(t0); osc.stop(t0+0.1);
  }catch(e){}
}

/* ================================================================
   THEME SYSTEM (light / dark / horror) — shared via localStorage
   key "codex-theme" with codex-article-viewer.html.
   ================================================================ */
const THEME_KEY = 'codex-theme';

function setTheme(theme){
  if (theme === 'light') {
    document.documentElement.removeAttribute('data-theme');
  } else {
    document.documentElement.setAttribute('data-theme', theme);
  }
  try { localStorage.setItem(THEME_KEY, theme); } catch(e){}
  updateThemeToggleUI(theme);
  if (theme === 'horror') { playHorrorBgm(); startGhostRotation(); playHooSound(); startAmbientDrone(); scheduleDogHowl(); }
  else { stopGhostRotation(); stopAmbientDrone(); stopDogHowl(); }
}
let dogHowlTimer = null;
function scheduleDogHowl(){
  clearTimeout(dogHowlTimer);
  const delay = 18000 + Math.random() * 22000;
  dogHowlTimer = setTimeout(() => { playDogHowl(); scheduleDogHowl(); }, delay);
}
function playDogHowl(){
  if (document.documentElement.getAttribute('data-theme') !== 'horror') return;
  const howl = document.getElementById('dog-howl');
  if (!howl) return;
  let muted = false;
  try { muted = localStorage.getItem(DRONE_MUTE_KEY) === '1'; } catch(e){}
  if (muted) return;
  howl.currentTime = 0;
  howl.volume = 0.4;
  howl.play().catch(() => {});
  setTimeout(() => { if (!howl.paused) howl.pause(); }, 3000);
}
function stopDogHowl(){
  clearTimeout(dogHowlTimer); dogHowlTimer = null;
  const howl = document.getElementById('dog-howl');
  if (howl) howl.pause();
}

/* ================================================================
   AMBIENT HORROR DRONE — original Web Audio composition (a sub-bass
   rumble + slow-drifting eerie pad + occasional filtered-noise swells),
   NOT a copy of any existing recording. Loops quietly for as long as
   horror theme stays active; ramps in/out instead of hard cutting.
   Muted state persists via localStorage so the choice sticks across
   pages/reloads. Shared implementation with codex-article-viewer.html.
   ================================================================ */
const DRONE_MUTE_KEY = 'codex-drone-muted';
let __droneCtx, __droneNodes = null;
let __droneMuted = (function(){ try { return localStorage.getItem(DRONE_MUTE_KEY) === '1'; } catch(e){ return false; } })();

function startAmbientDrone(){
  if (__droneNodes) return;
  try {
    __droneCtx = __droneCtx || new (window.AudioContext||window.webkitAudioContext)();
    const c = __droneCtx;
    if (c.state === 'suspended') c.resume();

    const master = c.createGain();
    const targetVol = __droneMuted ? 0.0001 : 0.05;
    master.gain.setValueAtTime(0.0001, c.currentTime);
    master.gain.linearRampToValueAtTime(targetVol, c.currentTime + 2.5);
    master.connect(c.destination);

    const o1 = c.createOscillator(); o1.type = 'sine'; o1.frequency.value = 54;
    const o2 = c.createOscillator(); o2.type = 'sine'; o2.frequency.value = 57.5;
    const rumbleGain = c.createGain(); rumbleGain.gain.value = 0.6;
    o1.connect(rumbleGain); o2.connect(rumbleGain); rumbleGain.connect(master);

    const pad = c.createOscillator(); pad.type = 'sine'; pad.frequency.value = 220;
    const padLfo = c.createOscillator(); padLfo.type = 'sine'; padLfo.frequency.value = 0.07;
    const padLfoGain = c.createGain(); padLfoGain.gain.value = 6;
    padLfo.connect(padLfoGain); padLfoGain.connect(pad.frequency);
    const padGain = c.createGain(); padGain.gain.value = 0.25;
    pad.connect(padGain); padGain.connect(master);

    [o1, o2, pad, padLfo].forEach(n => n.start());

    __droneNodes = { master, nodes: [o1, o2, pad, padLfo], noiseTimer: null };
    scheduleNoiseSwell();
  } catch(e){}
}

function playHorrorBgm(){
  const bgm = document.getElementById('horror-bgm');
  if (!bgm) return;
  bgm.muted = false;
  bgm.volume = __droneMuted ? 0 : 0.35;
  const p = bgm.play();
  if (p && p.catch) p.catch(() => { bgm.load(); bgm.play().catch(() => {}); });
}

function stopHorrorBgm(){
  const bgm = document.getElementById('horror-bgm');
  if (!bgm) return;
  bgm.pause();
}

function scheduleNoiseSwell(){
  if (!__droneNodes) return;
  const delay = 8000 + Math.random() * 9000;
  __droneNodes.noiseTimer = setTimeout(() => { playNoiseSwell(); scheduleNoiseSwell(); }, delay);
}

function playNoiseSwell(){
  if (!__droneNodes || __droneMuted) return;
  const c = __droneCtx, t0 = c.currentTime, dur = 3 + Math.random() * 2;
  const bufferSize = Math.floor(c.sampleRate * dur);
  const buffer = c.createBuffer(1, bufferSize, c.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
  const src = c.createBufferSource(); src.buffer = buffer;
  const filter = c.createBiquadFilter();
  filter.type = 'bandpass';
  filter.frequency.value = 300 + Math.random() * 400;
  filter.Q.value = 0.8;
  const g = c.createGain();
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(0.02, t0 + dur * 0.4);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  src.connect(filter); filter.connect(g); g.connect(__droneNodes.master);
  src.start(t0); src.stop(t0 + dur);
}

function stopAmbientDrone(){
  if (!__droneNodes) return;
  const c = __droneCtx, t0 = c.currentTime;
  const nodesToStop = __droneNodes.nodes;
  __droneNodes.master.gain.cancelScheduledValues(t0);
  __droneNodes.master.gain.setValueAtTime(__droneNodes.master.gain.value, t0);
  __droneNodes.master.gain.linearRampToValueAtTime(0.0001, t0 + 1.2);
  clearTimeout(__droneNodes.noiseTimer);
  setTimeout(() => { nodesToStop.forEach(n => { try { n.stop(); } catch(e){} }); }, 1300);
  __droneNodes = null;
  stopHorrorBgm();
}

function toggleDroneMute(btn){
  __droneMuted = !__droneMuted;
  try { localStorage.setItem(DRONE_MUTE_KEY, __droneMuted ? '1' : '0'); } catch(e){}
  if (btn) btn.textContent = __droneMuted ? '🔇' : '🔊';
  if (__droneNodes) {
    const c = __droneCtx, t0 = c.currentTime;
    __droneNodes.master.gain.cancelScheduledValues(t0);
    __droneNodes.master.gain.setValueAtTime(__droneNodes.master.gain.value, t0);
    __droneNodes.master.gain.linearRampToValueAtTime(__droneMuted ? 0.0001 : 0.05, t0 + 0.8);
  }
  const bgm = document.getElementById('horror-bgm');
  if (bgm) bgm.volume = __droneMuted ? 0 : 0.35;
}

function updateThemeToggleUI(theme){
  document.querySelectorAll('.theme-toggle button').forEach(b => {
    b.classList.toggle('active', b.dataset.themeBtn === theme);
  });
}

let ghostEl = null, ghostRotateTimer = null, ghostPulseTimer = null, ghostIndex = 0;
let ghostSpeechEl = null, ghostSpeechTimer = null;
function ensureGhostSpeechEl(){
  if (ghostSpeechEl) return ghostSpeechEl;
  const el = document.createElement('div');
  el.className = 'ghost-speech';
  document.body.appendChild(el);
  ghostSpeechEl = el; return el;
}
function showGhostSpeech(){
  if (document.documentElement.getAttribute('data-theme') !== 'horror') return;
  const ghost = ensureGhostEl();
  const bubble = ensureGhostSpeechEl();
  bubble.textContent = GHOST_PHRASES[Math.floor(Math.random() * GHOST_PHRASES.length)];
  const rect = ghost.getBoundingClientRect();
  bubble.style.right = (window.innerWidth - rect.right) + 'px';
  bubble.style.bottom = (window.innerHeight - rect.top + 10) + 'px';
  bubble.classList.add('visible');
  clearTimeout(ghostSpeechTimer);
  ghostSpeechTimer = setTimeout(() => bubble.classList.remove('visible'), 2600);
  pulseGhost();
  playHooSound();
}

function ensureGhostEl(){
  if (ghostEl) return ghostEl;
  const img = document.createElement('img');
  img.src = GHOST_IMAGES[0];
  img.alt = '';
  img.setAttribute('aria-hidden', 'true');
  img.className = 'ghost-companion';
  img.addEventListener('mouseenter', showGhostSpeech);
  img.addEventListener('click', showGhostSpeech);
  document.body.appendChild(img);
  ghostEl = img;
  return img;
}

function startGhostRotation(){
  const el = ensureGhostEl();
  ghostIndex = 0;
  el.src = GHOST_IMAGES[ghostIndex];
  el.classList.add('visible');
  clearInterval(ghostRotateTimer);
  ghostRotateTimer = setInterval(rotateGhost, 5000);
}

function rotateGhost(){
  if (document.documentElement.getAttribute('data-theme') !== 'horror') return;
  const el = ensureGhostEl();
  ghostIndex = (ghostIndex + 1) % GHOST_IMAGES.length;
  el.style.opacity = '0.15';
  setTimeout(() => { el.src = GHOST_IMAGES[ghostIndex]; el.style.opacity = ''; }, 220);
  playHooSound();
}

function stopGhostRotation(){
  clearInterval(ghostRotateTimer);
  ghostRotateTimer = null;
  if (ghostEl) { ghostEl.classList.remove('visible'); ghostEl.style.opacity = ''; }
}

function pulseGhost(){
  if (document.documentElement.getAttribute('data-theme') !== 'horror') return;
  const el = ensureGhostEl();
  el.classList.add('pulse');
  clearTimeout(ghostPulseTimer);
  ghostPulseTimer = setTimeout(() => el.classList.remove('pulse'), 350);
}

/* Ambient "hoo~" — low breathy tone with vibrato, evoking Thai
   goosebump-story radio shows. Soft attack/decay, kept quiet since it
   can repeat every 5s for as long as horror mode stays on. */
let __ghostAudioCtx;
function playHooSound(){
  try{
    __ghostAudioCtx = __ghostAudioCtx || new (window.AudioContext||window.webkitAudioContext)();
    const c = __ghostAudioCtx;
    if (c.state === 'suspended') c.resume();
    const t0 = c.currentTime, dur = 1.6;
    const baseFreq = 180 + Math.random() * 50;

    const osc = c.createOscillator();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(baseFreq, t0);

    const lfo = c.createOscillator();
    lfo.type = 'sine';
    lfo.frequency.setValueAtTime(4.2, t0);
    const lfoGain = c.createGain();
    lfoGain.gain.setValueAtTime(6, t0);
    lfo.connect(lfoGain); lfoGain.connect(osc.frequency);

    const mainGain = c.createGain();
    mainGain.gain.setValueAtTime(0.0001, t0);
    mainGain.gain.exponentialRampToValueAtTime(0.035, t0 + 0.55);
    mainGain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);

    const bufferSize = Math.floor(c.sampleRate * dur);
    const noiseBuffer = c.createBuffer(1, bufferSize, c.sampleRate);
    const data = noiseBuffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
    const noise = c.createBufferSource();
    noise.buffer = noiseBuffer;
    const noiseFilter = c.createBiquadFilter();
    noiseFilter.type = 'bandpass';
    noiseFilter.frequency.setValueAtTime(baseFreq * 1.6, t0);
    noiseFilter.Q.setValueAtTime(0.7, t0);
    const noiseGain = c.createGain();
    noiseGain.gain.setValueAtTime(0.0001, t0);
    noiseGain.gain.exponentialRampToValueAtTime(0.01, t0 + 0.55);
    noiseGain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);

    osc.connect(mainGain); mainGain.connect(c.destination);
    noise.connect(noiseFilter); noiseFilter.connect(noiseGain); noiseGain.connect(c.destination);

    osc.start(t0); osc.stop(t0 + dur);
    lfo.start(t0); lfo.stop(t0 + dur);
    noise.start(t0); noise.stop(t0 + dur);
  } catch(e){}
}

const THAI_DIGIT_WORDS = ['', 'หนึ่ง', 'สอง', 'สาม', 'สี่', 'ห้า', 'หก', 'เจ็ด', 'แปด', 'เก้า'];
function thaiOrdinalWord(n) {
  if (n <= 0) return String(n);
  if (n < 10) return THAI_DIGIT_WORDS[n];
  if (n < 20) return n === 10 ? 'สิบ' : n === 11 ? 'สิบเอ็ด' : 'สิบ' + THAI_DIGIT_WORDS[n - 10];
  const tens = Math.floor(n / 10), ones = n % 10;
  const tensWord = tens === 2 ? 'ยี่สิบ' : THAI_DIGIT_WORDS[tens] + 'สิบ';
  if (ones === 0) return tensWord;
  return tensWord + (ones === 1 ? 'เอ็ด' : THAI_DIGIT_WORDS[ones]);
}

function escapeHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

const THAI_DIGIT_CHARS = '๐๑๒๓๔๕๖๗๘๙';
function thaiNumToArabic(s) {
  return s.replace(/[๐-๙]/g, d => String(THAI_DIGIT_CHARS.indexOf(d)));
}

// --- article-number sort/adjacency (ported from codex-article-viewer.html
// so prev/next navigation here uses the exact same ordering logic) --------
const SUFFIX_RANK = { '': 0, 'ทวิ': 1, 'ตรี': 2, 'จัตวา': 3, 'เบญจ': 4, 'ฉ': 5, 'สัตต': 6, 'อัฎฐ': 7, 'นว': 8, 'ทศ': 9 };

function sortKey(numStr) {
  const spaceIdx = numStr.indexOf(' ');
  const numPart = spaceIdx === -1 ? numStr : numStr.slice(0, spaceIdx);
  let suffix = spaceIdx === -1 ? '' : numStr.slice(spaceIdx + 1);
  const [main, sub] = numPart.split('/').map(Number);
  let suffixSub = 0;
  const suffixSlashIdx = suffix.indexOf('/');
  if (suffixSlashIdx !== -1) {
    suffixSub = Number(suffix.slice(suffixSlashIdx + 1)) || 0;
    suffix = suffix.slice(0, suffixSlashIdx);
  }
  return [main, sub || 0, SUFFIX_RANK[suffix] ?? 0, suffixSub];
}

function compareNumbers(a, b) {
  const ka = sortKey(a), kb = sortKey(b);
  for (let i = 0; i < 4; i++) if (ka[i] !== kb[i]) return ka[i] - kb[i];
  return 0;
}

function getAdjacentArticleNumbers(bookType, number) {
  const book = codexData && codexData.books[bookType];
  if (!book) return { prev: null, next: null };
  const numbers = Object.keys(book.articles).sort(compareNumbers);
  const idx = numbers.indexOf(number);
  if (idx === -1) return { prev: null, next: null };
  return {
    prev: idx > 0 ? numbers[idx - 1] : null,
    next: idx < numbers.length - 1 ? numbers[idx + 1] : null,
  };
}

// Re-runs the existing search flow scoped to one specific article number,
// so prev/next paging stays inside the same results-list UI.
// btn/role let us re-anchor scroll to whichever button was clicked (header
// prev/next vs the lecture-box prev/next are different vertical positions),
// so repeat clicks land on the same screen spot instead of the page jumping.
function navigateArticle(bookType, currentNum, direction, btn, role) {
  const adj = getAdjacentArticleNumbers(bookType, currentNum);
  const target = direction === 'prev' ? adj.prev : adj.next;
  if (!target) return;
  const beforeTop = btn ? btn.getBoundingClientRect().top : null;
  document.getElementById('search-text').value = '';
  document.getElementById('search-article').value = target;
  search();
  if (beforeTop !== null && role) {
    const newBtn = document.querySelector(`[data-navrole="${role}"]`);
    if (newBtn) {
      const afterTop = newBtn.getBoundingClientRect().top;
      window.scrollBy(0, afterTop - beforeTop);
      return;
    }
  }
  document.getElementById('results-list').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

// --- มาตรา cross-reference auto-linking -------------------------------
// Matches "มาตรา <number>[/sub][ suffix]" e.g. "มาตรา ๒๘", "มาตรา 193/1",
// "มาตรา ๔ ทวิ". Runs on already-escaped text; the matched substring only
// ever contains the literal word "มาตรา", whitespace, Thai/Arabic digits
// and a small fixed set of Thai suffix words, so it can never introduce
// HTML/attribute-breaking characters.
const MATRA_SUFFIXES = 'ทวิ|ตรี|จัตวา|เบญจ|ฉ|สัตต|อัฏฐ|นว|ทศ';
const MATRA_REF_RE = new RegExp(
  'มาตรา\\s*([0-9๐-๙]+(?:\\s*\\/\\s*[0-9๐-๙]+)?)(?:\\s+(' + MATRA_SUFFIXES + ')(?![ก-ฮ]))?',
  'g'
);

function normalizeMatraNumber(rawNum, rawSuffix) {
  const n = thaiNumToArabic(rawNum).replace(/\s+/g, '');
  return rawSuffix ? (n + ' ' + rawSuffix) : n;
}

// escapedText must already be HTML-escaped via escapeHtml(). Only wraps
// a match in <a> when it resolves to a real article in the same book,
// and never links the article's own current number (avoids self-links).
function linkifyMatraRefs(escapedText, bookType, currentNumber) {
  if (!bookType || !codexData || !codexData.books[bookType]) return escapedText;
  const articles = codexData.books[bookType].articles;
  return escapedText.replace(MATRA_REF_RE, (full, rawNum, rawSuffix) => {
    const candidate = normalizeMatraNumber(rawNum, rawSuffix);
    if (!candidate || candidate === currentNumber) return full;
    if (Object.prototype.hasOwnProperty.call(articles, candidate)) {
      const href = `codex-article-viewer.html?id=${bookType}_${encodeURIComponent(candidate)}`;
      return `<a href="${href}" class="matra-ref-link">${full}</a>`;
    }
    return full;
  });
}

      <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;">
        <button type="button" class="icon-btn" data-navrole="lec-prev" onclick="navigateArticle('${article.bookType}','${article.number}','prev',this,'lec-prev')" onmouseenter="playHoverSound()" ${adj.prev ? '' : 'disabled'}>‹ มาตราก่อนหน้า</button>
        <button type="button" class="icon-btn" data-navrole="lec-next" onclick="navigateArticle('${article.bookType}','${article.number}','next',this,'lec-next')" onmouseenter="playHoverSound()" ${adj.next ? '' : 'disabled'}>มาตราถัดไป ›</button>
        <button type="button" class="icon-btn" id="lec-read-${article.id}" onclick="speakLectureNotes('${article.id}', this)" onmouseenter="playHoverSound()">🔊 อ่านคำบรรยาย</button>
      </div>
    </div>`;
}

function speakLectureNotes(articleId, btn) {
  if (!('speechSynthesis' in window)) {
    alert('เบราว์เซอร์นี้ไม่รองรับการอ่านออกเสียง');
    return;
  }
  const wasSpeaking = btn.dataset.speaking === '1';
  window.speechSynthesis.cancel();
  document.querySelectorAll('[id^="lec-read-"]').forEach(b => {
    b.dataset.speaking = '';
    b.textContent = '🔊 อ่านคำบรรยาย';
  });
  if (wasSpeaking) return; // this button was already reading -> treat click as stop

  const article = currentResults.find(a => a.id === articleId);
  if (!article || !article.lectureNotes) return;
  const fullText = article.lectureNotes.map(n => `${n.topic}. ${n.text}`).join(' ');
  const utter = new SpeechSynthesisUtterance(fullText);
  utter.lang = 'th-TH';
  utter.onstart = () => { btn.dataset.speaking = '1'; btn.textContent = '⏸️ หยุด'; };
  utter.onend = () => { btn.dataset.speaking = ''; btn.textContent = '🔊 อ่านคำบรรยาย'; };
  utter.onerror = () => { btn.dataset.speaking = ''; btn.textContent = '🔊 อ่านคำบรรยาย'; };
  window.speechSynthesis.speak(utter);
}

function renderArticleTextHtml(text, bookType, currentNumber) {
  const chunks = text.split('\n').filter(p => p.trim());
  if (chunks.length <= 1) return linkifyMatraRefs(escapeHtml(text), bookType, currentNumber);
  let warakN = 0;
  return chunks.map(p => {
    const anuMatch = p.match(/^\(([๐-๙0-9]+)\)/);
    let label;
    if (anuMatch) {
      label = `อนุ ${thaiNumToArabic(anuMatch[1])}`;
    } else {
      warakN++;
      label = `วรรค${thaiOrdinalWord(warakN)}`;
    }
    return `
    <div class="warak-row">
      <div class="warak-label">${label}</div>
      <div class="warak-text">${linkifyMatraRefs(escapeHtml(p), bookType, currentNumber)}</div>
    </div>`;
  }).join('');
}

function applyBookLock(book) {

// --- quick group-search (ป.พ.พ. only) -----------------------------------
// Two filter shapes:
//  - meta-based: { phaak, laksana } matched against article.meta (works
//    even with gaps/sub-articles since it doesn't depend on numbering)
//  - numberRange-based: { numberRange: [[start,end],...], exclude: [[s,e],...] }
//    used where the real teaching boundary cuts across a ลักษณะ/หมวด instead
//    of matching it exactly. Ranges compare via parseArticleKey() so
//    sub-numbered articles like "193/5" sort correctly within their range.
function parseArticleKey(numStr) {
  const parts = String(numStr).split('/');
  const main = parseInt(parts[0], 10);
  const sub = parts[1] ? parseInt(parts[1], 10) : 0;
  return main + sub / 1000;
}

const GROUP_FILTERS = {
  'นิติกรรมและสัญญา': [
    { phaak: 'บรรพ 1', laksana: 'ลักษณะ 4' },
    { phaak: 'บรรพ 2', laksana: 'ลักษณะ 2' },
    { numberRange: [[193.001, 193.015], [193.030, 193.034]] },
  ],
  'หนี้': [{ phaak: 'บรรพ 2', laksana: 'ลักษณะ 1' }],
  'ทรัพย์': [{ phaak: 'บรรพ 1', laksana: 'ลักษณะ 3' }, { phaak: 'บรรพ 4' }],
  'ซื้อขาย': [{ numberRange: [[453, 517]], exclude: [[491, 502]] }],
  'แลกเปลี่ยน': [{ numberRange: [[518, 520]] }],
  'ให้': [{ phaak: 'บรรพ 3', laksana: 'ลักษณะ 3' }],
  'เช่าทรัพย์': [{ numberRange: [[537, 571]] }],
  'เช่าซื้อ': [{ numberRange: [[572, 574]] }],
  'ขายฝาก': [{ numberRange: [[491, 502]] }],
  'ยืม': [{ phaak: 'บรรพ 3', laksana: 'ลักษณะ 9' }],
  'จ้างทำของ': [{ phaak: 'บรรพ 3', laksana: 'ลักษณะ 7' }],
  'ตัวแทน': [{ numberRange: [[798, 844]] }],
  'ละเมิด': [{ phaak: 'บรรพ 2', laksana: 'ลักษณะ 5' }],
  'ครอบครัว': [{ phaak: 'บรรพ 5' }],
  'มรดก': [{ phaak: 'บรรพ 6' }],
};

function matchesGroupFilter(article, f, key) {
  if (f.numberRange) {
    const inRange = f.numberRange.some(([s, e]) => key >= s && key <= e);
    if (!inRange) return false;
    if (f.exclude && f.exclude.some(([s, e]) => key >= s && key <= e)) return false;
    return true;
  }
  const m = article.meta || {};
  return (!f.phaak || (m.phaak || '').includes(f.phaak)) &&
    (!f.laksana || (m.laksana || '').includes(f.laksana));
}

function renderGroupSearchButtons() {
  const row = document.getElementById('group-search-row');
  if (!row || selectedBook !== 'civil') { if (row) row.innerHTML = ''; return; }
  row.innerHTML = Object.keys(GROUP_FILTERS).map(name =>
    `<button type="button" class="icon-btn" style="font-size:12px;padding:4px 10px" onclick="searchGroup('${name.replace(/'/g, "\\'")}')" onmouseenter="playHoverSound()">${name}</button>`
  ).join('');
}

function searchGroup(name) {
  const filters = GROUP_FILTERS[name];
  if (!filters || !codexData || !codexData.books[selectedBook]) return;
  document.getElementById('search-text').value = '';
  document.getElementById('search-article').value = '';
  const articles = codexData.books[selectedBook].articles;
  let results = Object.values(articles).filter(article => {
    const key = parseArticleKey(article.number);
    return filters.some(f => matchesGroupFilter(article, f, key));
  }).map(article => ({ ...article, bookType: selectedBook }));

  results.sort((a, b) => compareNumbers(a.number, b.number));

  currentResults = results;
  currentPage = 0;
  displayResults(results);
}

function search() {
  if (!codexData) {
    showError('กำลังโหลดข้อมูล...');
    return;
  }
  if (!codexData.books[selectedBook]) return;

  const searchText = document.getElementById('search-text').value.toLowerCase();
  const searchArticle = document.getElementById('search-article').value;

  let results = [];
  const articles = codexData.books[selectedBook].articles;

  Object.values(articles).forEach(article => {
    const textMatch = !searchText ||
      article.text.toLowerCase().includes(searchText) ||
      (article.keywords && article.keywords.some(k => k.includes(searchText)));

    const numberMatch = !searchArticle || article.number === searchArticle ||
      article.number.startsWith(searchArticle + ' ') || article.number.startsWith(searchArticle + '/');

    if (textMatch && numberMatch) {
      results.push({ ...article, bookType: selectedBook });
    }
  });

  results.sort((a, b) => compareNumbers(a.number, b.number));

  currentResults = results;
  currentPage = 0;
  displayResults(results);
}

function goToPage(delta) {
  currentPage += delta;
  displayResults(currentResults);
  document.querySelector('.search-container')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function displayResults(results) {
  const resultsList = document.getElementById('results-list');
  const resultCount = document.getElementById('result-count-text');

  if (results.length === 0) {
    resultsList.innerHTML = `
      <div class="empty-state">
        <div class="icon">🔍</div>
        <h3>ไม่พบผลลัพธ์</h3>
        <p>ลองเปลี่ยนคำค้นหา</p>
      </div>
    `;
    resultCount.textContent = `ไม่พบผลลัพธ์`;
    return;
  }

  const totalPages = Math.max(1, Math.ceil(results.length / MAX_RESULTS));
  currentPage = Math.min(Math.max(0, currentPage), totalPages - 1);
  const start = currentPage * MAX_RESULTS;
  const shown = results.slice(start, start + MAX_RESULTS);
  resultCount.textContent = results.length > MAX_RESULTS
    ? `พบ ${results.length} มาตรา (หน้า ${currentPage + 1}/${totalPages} — แสดงมาตรา ${start + 1}-${start + shown.length})`
    : `พบ ${results.length} มาตรา`;

  resultsList.innerHTML = shown.map(article => {
    const adj = getAdjacentArticleNumbers(article.bookType, article.number);
    return `
    <article class="article-card" data-article-id="${article.id}">
      <div class="article-header">
        <div class="article-number">มาตรา ${article.number}</div>
        <div class="article-actions">
          ${article.cancelled ? '<span class="cancelled-badge">ยกเลิกแล้ว</span>' : ''}
          <button type="button" class="icon-btn" data-navrole="hdr-prev" title="มาตราก่อนหน้า" onclick="navigateArticle('${article.bookType}','${article.number}','prev',this,'hdr-prev')" onmouseenter="playHoverSound()" ${adj.prev ? '' : 'disabled'}>‹ ก่อนหน้า</button>
          <button type="button" class="icon-btn" data-navrole="hdr-next" title="มาตราถัดไป" onclick="navigateArticle('${article.bookType}','${article.number}','next',this,'hdr-next')" onmouseenter="playHoverSound()" ${adj.next ? '' : 'disabled'}>ถัดไป ›</button>
          <button type="button" class="icon-btn btn-read" title="อ่านออกเสียงมาตรานี้" onclick="speakArticle(this)" onmouseenter="playHoverSound()">🔊 อ่าน</button>
          <button type="button" class="icon-btn" title="พิมพ์เฉพาะมาตรานี้" onclick="printArticle(this)" onmouseenter="playHoverSound()">🖨️ พิมพ์</button>
        </div>
      </div>

      <div class="article-text">${renderArticleTextHtml(article.text, article.bookType, article.number)}</div>

      ${lectureNotesHtml(article)}

      <div class="article-note">
        <textarea class="note-input" data-note-key="codex-note-${article.id}" placeholder="📝 บันทึกส่วนตัวของคุณเกี่ยวกับมาตรานี้..."></textarea>
      </div>

      <div class="article-breadcrumb">
        📍 ${BOOK_INFO[article.bookType].short}
        ${[article.meta?.phaak, article.meta?.laksana, article.meta?.muad, article.meta?.suan]
          .filter(Boolean).map(v => ' › ' + v).join('')}
      </div>
    </article>
  `;
  }).join('');

  if (results.length > MAX_RESULTS) {
    resultsList.innerHTML += `
      <div class="page-nav" style="display:flex;justify-content:center;gap:10px;margin:20px 0;">
        <button type="button" class="icon-btn" onclick="goToPage(-1)" onmouseenter="playHoverSound()" ${currentPage <= 0 ? 'disabled' : ''}>‹ ย้อนกลับ 50 มาตรา</button>
        <span style="align-self:center;color:var(--ink-faint)">หน้า ${currentPage + 1}/${totalPages}</span>
        <button type="button" class="icon-btn" onclick="goToPage(1)" onmouseenter="playHoverSound()" ${currentPage >= totalPages - 1 ? 'disabled' : ''}>ชุดถัดไป 50 มาตรา ›</button>
      </div>
    `;
  }

  resultsList.querySelectorAll('.note-input').forEach(bindNoteInput);
}

// --- per-article read / print / note controls --------------------------

function bindNoteInput(el) {
  const key = el.dataset.noteKey;
  if (!key) return;
  el.value = localStorage.getItem(key) || '';
  const save = () => { try { localStorage.setItem(key, el.value); } catch (e) { /* storage unavailable/full */ } };
  el.addEventListener('input', save);
  el.addEventListener('blur', save);
}

function speakArticle(btn) {
  if (!('speechSynthesis' in window)) {
    alert('เบราว์เซอร์นี้ไม่รองรับการอ่านออกเสียง');
    return;
  }
  const wasThisSpeaking = btn.dataset.speaking === '1';
  window.speechSynthesis.cancel();
  document.querySelectorAll('.btn-read[data-speaking="1"]').forEach(b => {
    b.dataset.speaking = '';
    b.textContent = '🔊 อ่าน';
  });
  if (wasThisSpeaking) return; // this button was already reading -> treat click as stop

  const card = btn.closest('.article-card');
  const numberText = card.querySelector('.article-number').textContent;
  const bodyText = card.querySelector('.article-text').innerText;
  const utter = new SpeechSynthesisUtterance(`${numberText}. ${bodyText}`);
  utter.lang = 'th-TH';
  utter.onstart = () => { btn.dataset.speaking = '1'; btn.textContent = '⏸️ หยุด'; };
  utter.onend = () => { btn.dataset.speaking = ''; btn.textContent = '🔊 อ่าน'; };
  utter.onerror = () => { btn.dataset.speaking = ''; btn.textContent = '🔊 อ่าน'; };
  window.speechSynthesis.speak(utter);
}

function printArticle(btn) {
  const card = btn.closest('.article-card');
  const printArea = document.getElementById('print-area');
  if (!card || !printArea) return;
  const numberText = card.querySelector('.article-number').textContent;
  const bodyHtml = card.querySelector('.article-text').innerHTML;
  const breadcrumbHtml = card.querySelector('.article-breadcrumb') ? card.querySelector('.article-breadcrumb').innerHTML : '';
  const lectureEl = card.querySelector('.lecture-notes');
  const lectureHtml = lectureEl ? `<div style="margin-top:18px;padding-top:14px;border-top:2px solid #ccc;">${lectureEl.innerHTML}</div>` : '';
  printArea.innerHTML = `
    <h2 style="font-family:'Noto Serif Thai',serif;margin-bottom:14px;">${numberText}</h2>
    <div class="article-text">${bodyHtml}</div>
    <div class="article-breadcrumb">${breadcrumbHtml}</div>
    ${lectureHtml}
  `;
  document.body.classList.add('printing-one');
  window.print();
}

function printAllResults() {
  const printArea = document.getElementById('print-area');
  if (!printArea || !currentResults || currentResults.length === 0) return;
  const groupTitle = document.getElementById('result-count-text')?.textContent.split('(')[0].trim() || 'ผลการค้นหา';
  printArea.innerHTML = `
    <h1 style="font-family:'Noto Serif Thai',serif;margin-bottom:20px;">${groupTitle}</h1>
    ${currentResults.map(article => {
      const breadcrumb = [article.meta?.phaak, article.meta?.laksana, article.meta?.muad, article.meta?.suan]
        .filter(Boolean).map(v => ' › ' + v).join('');
      const lectureHtml = lectureNotesHtml(article);
      return `
      <div style="margin-bottom:26px;padding-bottom:20px;border-bottom:1px solid #ccc;break-inside:avoid;">
        <h2 style="font-family:'Noto Serif Thai',serif;margin-bottom:10px;">มาตรา ${article.number}</h2>
        <div class="article-text">${renderArticleTextHtml(article.text, article.bookType, article.number)}</div>
        <div class="article-breadcrumb">📍 ${BOOK_INFO[article.bookType].short}${breadcrumb}</div>
        ${lectureHtml ? `<div style="margin-top:14px;padding-top:10px;border-top:2px solid #ccc;">${lectureHtml}</div>` : ''}
      </div>`;
    }).join('')}
  `;
  document.body.classList.add('printing-one');
  window.print();
}

window.addEventListener('afterprint', () => {
  document.body.classList.remove('printing-one');
  const printArea = document.getElementById('print-area');
  if (printArea) printArea.innerHTML = '';
});

function clearSearch() {
  document.getElementById('search-text').value = '';
  document.getElementById('search-article').value = '';

  document.getElementById('results-list').innerHTML = `
    <div class="empty-state">
      <div class="icon">📖</div>
      <h3>เริ่มค้นหา</h3>
      <p>ใส่คำค้นหาหรือเลขมาตราแล้วกด ค้นหา หรือ Enter</p>
    </div>
  `;
  document.getElementById('result-count-text').textContent = 'ค้นหามาตรา 0 รายการ';
}

function showError(msg) {
  const resultsList = document.getElementById('results-list');
  resultsList.innerHTML = `
    <div class="empty-state">
      <div class="icon">⚠️</div>
      <h3>ข้อผิดพลาด</h3>
      <p>${msg}</p>
    </div>
  `;
}

// Load data, then lock the page to whichever ?book= the homepage linked to
document.addEventListener('DOMContentLoaded', async () => {
  const currentTheme = document.documentElement.getAttribute('data-theme') || 'light';
  updateThemeToggleUI(currentTheme);
  const droneMuteBtn = document.getElementById('drone-mute-btn');
  if (droneMuteBtn) droneMuteBtn.textContent = __droneMuted ? '🔇' : '🔊';
  if (currentTheme === 'horror') { playHorrorBgm(); startGhostRotation(); startAmbientDrone(); scheduleDogHowl(); }
  ['click','touchstart','keydown'].forEach(evt => {
    document.addEventListener(evt, function resumeBgmOnce(){
      const bgm = document.getElementById('horror-bgm');
      if (document.documentElement.getAttribute('data-theme') === 'horror' && bgm && bgm.paused) playHorrorBgm();
      ['click','touchstart','keydown'].forEach(e2 => document.removeEventListener(e2, resumeBgmOnce));
    }, { once: true });
  });

  await loadCodexData();

  const params = new URLSearchParams(window.location.search);
  const book = params.get('book');
  if (book === 'admin') {
    showAdminBookPicker();
  } else if (book && BOOK_INFO[book]) {
    applyBookLock(book);
  }
});
</script>
