<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ประมวลกฎหมาย - ค้นหามาตรา</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Thai:wght@500;600;700;900&family=Sarabun:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
:root {
  --paper:#FBF9F4;
  --card:#FFFFFF;
  --ink:#22283A;
  --ink-soft:#5A6072;
  --ink-faint:#9AA0B0;
  --line:#E5E1D6;
  --gold:#B08A3C;
  --accent:#2E4A7A;
  --ok:#1E7A4F;
  --bad:#B23A3A;
  --radius:14px;
  --shadow:0 1px 2px rgba(34,40,58,.05),0 6px 20px rgba(34,40,58,.07);
}

*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:'Sarabun',system-ui,sans-serif;
  background:radial-gradient(1200px 500px at 50% -200px,#F2EDDF 0%,transparent 60%),var(--paper);
  color:var(--ink);min-height:100vh;font-size:16px;line-height:1.75;
}

h1,h2,h3{font-family:'Noto Serif Thai',serif}

.topbar{
  display:flex;align-items:center;gap:10px;
  background:#EFEAE0;border-bottom:1px solid var(--line);
  padding:10px 18px;font-size:13px;color:var(--ink-soft);
  position:sticky;top:0;z-index:100;
}
.topbar-brand{font-weight:800;color:var(--ink);display:flex;align-items:center;gap:6px}

.wrap{max-width:1200px;margin:0 auto;padding:20px 18px 60px}

.back-button{
  display:inline-flex;align-items:center;gap:6px;color:var(--accent);
  font-weight:600;font-size:14px;text-decoration:none;margin-bottom:20px;transition:all .2s;
}
.back-button:hover{transform:translateX(-4px);color:var(--ink)}

.search-container{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:24px;margin-bottom:32px;box-shadow:var(--shadow);
}

.search-header h1{font-size:28px;margin-bottom:8px;color:var(--ink)}
.search-header p{font-size:14px;color:var(--ink-soft);margin-bottom:20px}

.book-selector{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
  gap:10px;margin-bottom:24px;
}
.book-btn{
  padding:12px;background:#F5F3F0;border:2px solid var(--line);
  border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;
  transition:all .2s;font-family:inherit;color:var(--ink-soft);
}
.book-btn:hover,.book-btn.active{
  border-color:var(--gold);background:var(--card);color:var(--ink);box-shadow:var(--shadow);
}

.search-form{
  display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px;
}

.form-group{display:flex;flex-direction:column}
.form-group label{
  font-size:13px;font-weight:600;color:var(--ink);margin-bottom:6px;
  text-transform:uppercase;letter-spacing:.05em;
}

input[type="text"],input[type="number"],select{
  padding:10px 12px;border:1px solid var(--line);border-radius:6px;
  font-size:14px;font-family:inherit;background:var(--card);color:var(--ink);
  transition:border-color .2s;
}

input[type="text"]:focus,input[type="number"]:focus,select:focus{
  outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(46,74,122,.1);
}

.search-buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px}

button{
  padding:12px;border:none;border-radius:6px;font-size:14px;
  font-weight:600;cursor:pointer;font-family:inherit;transition:all .2s;
}

.btn-primary{background:var(--accent);color:white}
.btn-primary:hover{background:#1d3a5a;transform:translateY(-1px)}

.btn-secondary{background:#F5F3F0;color:var(--ink);border:1px solid var(--line)}
.btn-secondary:hover{background:#E8E6E0}

.results-container{display:grid;grid-template-columns:250px 1fr;gap:24px}

.filters-sidebar{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:20px;height:fit-content;position:sticky;top:80px;
}

.filters-sidebar h3{font-size:16px;margin-bottom:16px;color:var(--ink)}

.filter-group{margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.filter-group:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0}

.filter-title{
  font-size:12px;font-weight:700;text-transform:uppercase;
  color:var(--ink-soft);margin-bottom:10px;letter-spacing:.05em;
}

.filter-item{display:flex;align-items:center;gap:8px;margin-bottom:8px;cursor:pointer}

.filter-item input[type="checkbox"]{cursor:pointer}

.filter-item label{font-size:13px;color:var(--ink-soft);cursor:pointer;flex:1}

.filter-item label:hover{color:var(--ink)}

.results-main{display:flex;flex-direction:column;gap:16px}

.result-count{
  font-size:13px;color:var(--ink-soft);margin-bottom:12px;
  padding-bottom:12px;border-bottom:1px solid var(--line);
}

.article-card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:20px;
}

.article-header{display:flex;justify-content:space-between;align-items:start;margin-bottom:10px}

.article-number{font-family:'JetBrains Mono',monospace;font-size:18px;font-weight:700;color:var(--accent)}

.article-meta{font-size:11px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.05em;display:flex;gap:8px}

.article-text{font-size:15px;color:var(--ink);line-height:1.8;margin:14px 0}

.warak-row{display:grid;grid-template-columns:78px 1fr;gap:12px;align-items:baseline}
.warak-row + .warak-row{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.warak-label{color:var(--gold);font-weight:700;font-size:12px;white-space:nowrap}
.warak-text{white-space:pre-line}

.article-breadcrumb{font-size:12px;color:var(--ink-faint);margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}

.cancelled-badge{color:var(--bad);font-size:12px;font-weight:700;border:1px solid var(--bad);border-radius:4px;padding:2px 6px}

.empty-state{text-align:center;padding:60px 20px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius)}

.empty-state .icon{font-size:48px;margin-bottom:16px}

.empty-state h3{font-size:18px;margin-bottom:8px;color:var(--ink)}

.empty-state p{color:var(--ink-soft);margin-bottom:16px}

.loading{text-align:center;padding:40px;color:var(--ink-soft)}

.loading::after{content:"...";animation:dots 1.5s infinite}

@keyframes dots{0%,33%{content:"."} 66%{content:".."} 100%{content:"..."}}

@media(max-width:768px){
  .results-container{grid-template-columns:1fr}
  .filters-sidebar{position:static}
  .search-form{grid-template-columns:1fr}
  .book-selector{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>

<div class="topbar">
  <span class="topbar-brand">📚 Cool Uncle</span>
  <span style="color:var(--ink-faint)">·</span>
  <span>ประมวลกฎหมาย</span>
</div>

<div class="wrap">
  
  <a href="index.html" class="back-button">← กลับหน้าแรก</a>

  <div class="search-container">
    <div class="search-header">
      <h1>📚 ค้นหาประมวลกฎหมาย</h1>
      <p>ค้นหาด้วยเลขมาตรา คำสำคัญ หรือหัวข้อเรื่อง (2,284 มาตรา)</p>
    </div>

    <div class="search-form">
      <div class="form-group">
        <label for="search-text">ค้นหา (คำสำคัญ)</label>
        <input type="text" id="search-text" placeholder="เช่น สัญญา, ความผิด, หนี้สิน" onkeydown="if(event.key==='Enter') search()">
      </div>
      <div class="form-group">
        <label for="search-article">เลขมาตรา</label>
        <input type="number" id="search-article" placeholder="เช่น 276" onkeydown="if(event.key==='Enter') search()">
      </div>
    </div>

    <div style="display:grid;grid-template-columns:1fr auto;gap:12px;align-items:end">
      <button class="btn-primary" onclick="search()">🔍 ค้นหา</button>
      <button class="btn-secondary" onclick="clearSearch()">ล้าง</button>
    </div>
  </div>

  <div class="results-container" id="results-container">
    <main class="results-main" style="grid-column:1/-1">
      <div class="result-count" id="result-count">ค้นหามาตรา 0 รายการ</div>

      <div id="results-list">
        <div class="empty-state">
          <div class="icon">📖</div>
          <h3>เริ่มค้นหา</h3>
          <p>ใส่คำค้นหาหรือเลขมาตราแล้วกด ค้นหา หรือ Enter</p>
        </div>
      </div>
    </main>

  </div>

</div>

<script>
// =====================================================================
// CODEX SEARCH - LIVE VERSION
// Loads from codex-data.json
// =====================================================================

let codexData = null;
let selectedBook = 'civil';
let currentResults = [];

// Load data on page load
async function loadCodexData() {
  try {
    const response = await fetch('codex-data.json');
    if (!response.ok) throw new Error('Failed to load codex data');
    codexData = await response.json();
    console.log('✅ Codex loaded:', Object.fromEntries(
      Object.entries(codexData.books).map(([k, v]) => [k, Object.keys(v.articles).length])
    ));
  } catch (error) {
    console.error('❌ Error loading codex:', error);
    showError('ไม่สามารถโหลดข้อมูลประมวลกฎหมาย');
  }
}

const BOOK_INFO = {
  civil: { title: 'ประมวลกฎหมายแพ่งและพาณิชย์', short: 'ประมวลแพ่ง', icon: '📖' },
  criminal: { title: 'ประมวลกฎหมายอาญา', short: 'ประมวลอาญา', icon: '📕' },
  civpro: { title: 'ประมวลกฎหมายวิธีพิจารณาความแพ่ง', short: 'ประมวลวิแพ่ง', icon: '⚖️' },
  crimpro: { title: 'ประมวลกฎหมายวิธีพิจารณาความอาญา', short: 'ประมวลวิอาญา', icon: '🔍' },
  constitution: { title: 'พระธรรมนูญศาลยุติธรรม', short: 'พระธรรมนูญศาลยุติธรรม', icon: '🏛️' },
};
const MAX_RESULTS = 50;

const THAI_DIGIT_WORDS = ['', 'หนึ่ง', 'สอง', 'สาม', 'สี่', 'ห้า', 'หก', 'เจ็ด', 'แปด', 'เก้า'];
function thaiOrdinalWord(n) {
  if (n <= 0) return String(n);
  if (n < 10) return THAI_DIGIT_WORDS[n];
  if (n < 20) return n === 10 ? 'สิบ' : n === 11 ? 'สิบเอ็ด' : 'สิบ' + THAI_DIGIT_WORDS[n - 10];
  const tens = Math.floor(n / 10), ones = n % 10;
  const tensWord = tens === 2 ? 'ยี่สิบ' : THAI_DIGIT_WORDS[tens] + 'สิบ';
  if (ones === 0) return tensWord;
  return tensWord + (ones === 1 ? 'เอ็ด' : THAI_DIGIT_WORDS[ones]);
}

function escapeHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function renderArticleTextHtml(text) {
  const paragraphs = text.split('\n').filter(p => p.trim());
  if (paragraphs.length <= 1) return escapeHtml(text);
  return paragraphs.map((p, i) => `
    <div class="warak-row">
      <div class="warak-label">วรรค${thaiOrdinalWord(i + 1)}</div>
      <div class="warak-text">${escapeHtml(p)}</div>
    </div>`).join('');
}

function applyBookLock(book) {
  selectedBook = book;
  const info = BOOK_INFO[book];
  if (!info) return;
  document.querySelector('.search-header h1').textContent = `${info.icon} ค้นหา${info.short}`;
  const count = codexData && codexData.books[book] ? Object.keys(codexData.books[book].articles).length : 0;
  document.querySelector('.search-header p').textContent = count
    ? `ค้นหาด้วยเลขมาตรา หรือคำสำคัญ (${count.toLocaleString()} มาตรา)`
    : 'ยังไม่มีข้อมูลประมวลนี้ กำลังจัดทำอยู่';
  if (!count) {
    document.getElementById('search-text').disabled = true;
    document.getElementById('search-article').disabled = true;
    document.getElementById('results-list').innerHTML = `
      <div class="empty-state">
        <div class="icon">🚧</div>
        <h3>ยังไม่มีข้อมูล</h3>
        <p>${info.title} กำลังอยู่ระหว่างจัดทำ</p>
      </div>`;
    document.getElementById('result-count').textContent = '';
  }
}

function search() {
  if (!codexData) {
    showError('กำลังโหลดข้อมูล...');
    return;
  }
  if (!codexData.books[selectedBook]) return;

  const searchText = document.getElementById('search-text').value.toLowerCase();
  const searchArticle = document.getElementById('search-article').value;

  let results = [];
  const articles = codexData.books[selectedBook].articles;

  Object.values(articles).forEach(article => {
    const textMatch = !searchText ||
      article.text.toLowerCase().includes(searchText) ||
      (article.keywords && article.keywords.some(k => k.includes(searchText)));

    const numberMatch = !searchArticle || article.number === searchArticle ||
      article.number.startsWith(searchArticle + ' ') || article.number.startsWith(searchArticle + '/');

    if (textMatch && numberMatch) {
      results.push({ ...article, bookType: selectedBook });
    }
  });

  results.sort((a, b) => {
    const an = parseInt(a.number), bn = parseInt(b.number);
    return an !== bn ? an - bn : a.number.localeCompare(b.number);
  });

  currentResults = results;
  displayResults(results);
}

function displayResults(results) {
  const resultsList = document.getElementById('results-list');
  const resultCount = document.getElementById('result-count');

  if (results.length === 0) {
    resultsList.innerHTML = `
      <div class="empty-state">
        <div class="icon">🔍</div>
        <h3>ไม่พบผลลัพธ์</h3>
        <p>ลองเปลี่ยนคำค้นหา</p>
      </div>
    `;
    resultCount.textContent = `ไม่พบผลลัพธ์`;
    return;
  }

  const shown = results.slice(0, MAX_RESULTS);
  resultCount.textContent = results.length > MAX_RESULTS
    ? `พบ ${results.length} มาตรา (แสดง ${MAX_RESULTS} รายการแรก — ลองค้นหาให้เจาะจงขึ้น)`
    : `พบ ${results.length} มาตรา`;

  resultsList.innerHTML = shown.map(article => `
    <article class="article-card">
      <div class="article-header">
        <div class="article-number">มาตรา ${article.number}</div>
        ${article.cancelled ? '<span class="cancelled-badge">ยกเลิกแล้ว</span>' : ''}
      </div>

      <div class="article-text">${renderArticleTextHtml(article.text)}</div>

      <div class="article-breadcrumb">
        📍 ${BOOK_INFO[article.bookType].short}
        ${[article.meta?.phaak, article.meta?.laksana, article.meta?.muad, article.meta?.suan]
          .filter(Boolean).map(v => ' › ' + v).join('')}
      </div>
    </article>
  `).join('');
}

function clearSearch() {
  document.getElementById('search-text').value = '';
  document.getElementById('search-article').value = '';

  document.getElementById('results-list').innerHTML = `
    <div class="empty-state">
      <div class="icon">📖</div>
      <h3>เริ่มค้นหา</h3>
      <p>ใส่คำค้นหาหรือเลขมาตราแล้วกด ค้นหา หรือ Enter</p>
    </div>
  `;
  document.getElementById('result-count').textContent = 'ค้นหามาตรา 0 รายการ';
}

function showError(msg) {
  const resultsList = document.getElementById('results-list');
  resultsList.innerHTML = `
    <div class="empty-state">
      <div class="icon">⚠️</div>
      <h3>ข้อผิดพลาด</h3>
      <p>${msg}</p>
    </div>
  `;
}

// Load data, then lock the page to whichever ?book= the homepage linked to
document.addEventListener('DOMContentLoaded', async () => {
  await loadCodexData();

  const params = new URLSearchParams(window.location.search);
  const book = params.get('book');
  if (book && BOOK_INFO[book]) {
    applyBookLock(book);
  }
});
</script>
</body>
</html>
