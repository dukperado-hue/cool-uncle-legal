<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>คดีเกรด A ที่ยังไม่เปิดเผย — Cool Uncle Legal Lab</title>
  <link rel="stylesheet" href="assets/style.css">
  <style>
    body { font-family: 'Sarabun', sans-serif; background: #f4f7f6; color: #333; margin: 0; padding: 20px; }
    .container { max-width: 1200px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
    h1 { color: #2c3e50; border-bottom: 3px solid #3498db; padding-bottom: 10px; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
    .stats { display: flex; gap: 20px; margin-bottom: 25px; flex-wrap: wrap; }
    .stat-box { background: #f8f9fa; padding: 15px 25px; border-radius: 8px; border-left: 5px solid #3498db; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    .stat-box strong { font-size: 1.2em; color: #2980b9; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 0.95em; }
    th { background: #2c3e50; color: #fff; text-align: left; padding: 12px; position: sticky; top: 0; }
    td { padding: 12px; border-bottom: 1px solid #eee; }
    tr:hover { background: #f1f4f6; }
    .grade-a { color: #27ae60; font-weight: bold; }
    .status-warn { color: #e67e22; font-weight: bold; }
    .status-block { color: #e74c3c; font-weight: bold; }
    .video-icon { font-size: 1.2em; }
    a { color: #3498db; text-decoration: none; font-weight: 500; }
    a:hover { text-decoration: underline; }
    #searchInput { width: 100%; padding: 12px; margin-bottom: 20px; border: 1px solid #ddd; border-radius: 6px; font-size: 1em; }
    #filterBar { margin-bottom: 20px; display: flex; gap: 10px; flex-wrap: wrap; }
    .filter-btn { padding: 8px 16px; border: 1px solid #3498db; background: #fff; color: #3498db; border-radius: 20px; cursor: pointer; transition: 0.3s; }
    .filter-btn.active { background: #3498db; color: #fff; }
  </style>
</head>
<body>
<div class="container">
  <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; border-bottom: 1px solid #eee; padding-bottom: 10px;">
    <a href="index.html" style="display: flex; align-items: center; gap: 10px; color: #333; font-weight: bold;">
      <img src="assets/capybara-64.webp" alt="logo" style="width: 32px;">
      Cool Uncle ⚖ Legal Lab
    </a>
    <div style="display: flex; gap: 15px;">
      <a href="news-index.html">← กลับหน้าหลัก</a>
      <a href="prototype/explore.html">🔍 Explore คลัง A</a>
    </div>
  </div>

  <h1>📋 คดีเกรด A ที่ยังไม่เปิดเผย (Unreleased Grade-A)</h1>
  <p>คดีที่ผ่าน Content/Legal Quality Gate (เกรด A) แต่ยังไม่ได้เปิดให้สาธาณชนเห็น — รอการตัดสินใจ publication</p>

  <div class="stats" id="stats"></div>
  
  <input type="text" id="searchInput" placeholder="ค้นหาคดี...">
  
  <div id="filterBar">
    <button class="filter-btn active" onclick="filterData('ทั้งหมด')">ทั้งหมด</button>
  </div>

  <div style="max-height: 800px; overflow-y: auto; border: 1px solid #eee; border-radius: 8px;">
    <table>
      <thead>
        <tr>
          <th style="width: 40px;">#</th>
          <th>คดี</th>
          <th style="width: 150px;">หมวด</th>
          <th style="width: 120px;">ปี</th>
          <th style="width: 80px;">คะแนน</th>
          <th style="width: 80px;">สถานะ</th>
          <th style="width: 60px;">วิดีโอ</th>
        </tr>
      </thead>
      <tbody id="caseTable"></tbody>
    </table>
  </div>
</div>
<script>
let allData = [];

function loadData() {
  fetch("assets/cases-unreleased-a.json?t=" + new Date().getTime())
    .then(r => r.json())
    .then(items => {
      allData = items;
      
      // Update Stats
      document.getElementById('stats').innerHTML = 
        '<div class="stat-box">ทั้งหมด <strong>' + items.length + '</strong> คดี</div>' +
        '<div class="stat-box">Warn <strong>' + items.filter(i => i.status === "Warn").length + '</strong></div>' +
        '<div class="stat-box">Blocked <strong>' + items.filter(i => i.status === "BLOCK").length + '</strong></div>' +
        '<div class="stat-box">มีวิดีโอ <strong>' + items.filter(i => i.video_status === "confirmed").length + '</strong></div>';

      // Update Filters
      const filterBar = document.getElementById('filterBar');
      const existingBtns = filterBar.querySelectorAll('.filter-btn:not([onclick*="ทั้งหมด"])');
      existingBtns.forEach(b => b.remove());
      
      const cats = [...new Set(items.map(i => i.cat_tag))].filter(c => c);
      cats.forEach(c => {
        const btn = document.createElement('button');
        btn.className = 'filter-btn';
        btn.innerText = c;
        btn.onclick = (e) => filterData(c, e.target);
        filterBar.appendChild(btn);
      });

      renderTable(items);
    })
    .catch(err => console.error("Error loading data:", err));
}

function renderTable(data) {
  const tbody = document.getElementById('caseTable');
  tbody.innerHTML = '';
  data.forEach((item, idx) => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${idx + 1}</td>
      <td><a href="${item.slug}">${item.title}</a></td>
      <td>${item.cat_tag || '-'}</td>
      <td>${item.year || '-'}</td>
      <td>${item.score || 0}</td>
      <td class="${item.status === 'BLOCK' ? 'status-block' : 'status-warn'}">${item.status || 'Warn'}</td>
      <td class="video-icon">${item.video_status === 'confirmed' ? '✅' : '⏳'}</td>
    `;
    tbody.appendChild(tr);
  });
}

function filterData(cat, btn) {
  const btns = document.querySelectorAll('.filter-btn');
  btns.forEach(b => b.classList.remove('active'));
  if (btn) {
    btn.classList.add('active');
  } else {
    document.querySelector('.filter-btn[onclick*="ทั้งหมด"]').classList.add('active');
  }
  
  const filtered = cat === 'ทั้งหมด' ? allData : allData.filter(i => i.cat_tag === cat);
  renderTable(filtered);
}

document.getElementById('searchInput').oninput = (e) => {
  const q = e.target.value.toLowerCase();
  const filtered = allData.filter(i => 
    (i.title && i.title.toLowerCase().includes(q)) || 
    (i.slug && i.slug.toLowerCase().includes(q))
  );
  renderTable(filtered);
};

// Initial load
loadData();
</script>
</body>
</html>
