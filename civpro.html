   <p>เมื่อไต่สวนมูลฟ้องเสร็จ ศาลประทับรับฟ้องเฉพาะ ม.326 ซึ่งอยู่ในอำนาจศาลแขวง ถือเป็นกรณี <b>"พฤติการณ์แห่งคดีเปลี่ยนแปลงไปทำให้คดีตกอยู่ในอำนาจของศาลแขวง"</b> ตาม <b>ม.19/1 วรรคสอง</b> ซึ่ง<b>บังคับ</b>ให้ศาลจังหวัดที่รับฟ้องไว้ถูกต้องแต่แรก <b>"ต้องพิจารณาพิพากษาคดีนั้นต่อไป"</b> จะสั่งโอนไปศาลแขวงไม่ได้ (แนว <b>ฎ.2817/2556</b>)</p>`},

  {src:"2/67 ข้อ 1 (ประเด็น 1)",
   tag:"ทุนทรัพย์ผลสืบเนื่อง — เพิกถอนนิติกรรม + ขอกำจัดมิให้รับมรดก (ฎ.13349/2557)",
   q:`นาย ก. ฟ้องนาย ข. ต่อ<b>ศาลแขวงนนทบุรี</b> ขอให้เพิกถอนสัญญาขายที่ดินมรดก (ราคา 250,000 บาท) ที่นาย ข. ปลอมพินัยกรรมแล้วขายให้นาย ค. และ<b>ขอให้กำจัดนาย ข. มิให้รับมรดก</b> ศาลแขวงรับฟ้อง นาย ข. โต้แย้งว่าทั้งคำขอเพิกถอนนิติกรรมและคำขอกำจัดมิให้รับมรดกเป็นคดีไม่มีทุนทรัพย์ ศาลแขวงไม่มีอำนาจ — ข้อโต้แย้งฟังขึ้นหรือไม่`,
   ans:`<p><b>ข้อโต้แย้งฟังไม่ขึ้น — คำสั่งรับฟ้องของศาลแขวงนนทบุรีชอบด้วยกฎหมาย</b></p>
   <p>คำขอเพิกถอนนิติกรรมขายที่ดินมรดก หากโจทก์ชนะคดี ที่ดินย่อมกลับคืนสู่กองมรดกเพื่อแบ่งปันแก่ทายาท จึงเป็น <b>คดีมีทุนทรัพย์ 250,000 บาท</b> ไม่เกิน 300,000 บาท อยู่ในอำนาจศาลแขวง</p>
   <p>ส่วนคำขอกำจัดมิให้รับมรดก แม้โดยสภาพเป็นคำขอที่ไม่อาจคำนวณเป็นราคาเงินได้ แต่เป็น<b>ผลสืบเนื่องโดยอัตโนมัติ</b>จากการเพิกถอนนิติกรรมที่เป็นการยักย้ายถ่ายเททรัพย์มรดกโดยฉ้อฉลในส่วนแรก ศาลแขวงจึงมีอำนาจพิจารณาพิพากษาไปได้ทั้งคดี (แนว <b>ฎ.13349/2557</b>)</p>`},

  {src:"2/67 ข้อ 1 (ประเด็น 2) — คาบเกี่ยว ครั้งที่ 5",
   tag:"ผู้พิพากษาอาวุโสไต่สวนมูลฟ้องได้ + ส่วนแพ่งเกี่ยวเนื่องอาญาเกิน 300k (ป.วิ.อ. ม.44/1, ฎ.10197/2556)",
   q:`นาย ข. ฟ้องนาย ก. เป็นคดีอาญาข้อหา<b>หมิ่นประมาท ม.326</b> ที่ศาลแขวงนนทบุรี และขอให้ชดใช้ค่าเสียหาย <b>400,000 บาท</b> นายยุติ<b>ผู้พิพากษาอาวุโส</b>ในศาลแขวงไต่สวนมูลฟ้องแล้วสั่งรับฟ้องทั้งส่วนอาญาและส่วนแพ่ง นาย ก. โต้แย้งว่าผู้พิพากษาอาวุโสไต่สวนมูลฟ้องคนเดียวไม่ได้ และค่าเสียหาย 400,000 บาทเกินอำนาจศาลแขวง — ข้อโต้แย้งฟังขึ้นหรือไม่`,
   ans:`<p><b>ข้อโต้แย้งฟังไม่ขึ้น — คำสั่งรับฟ้องชอบด้วยกฎหมาย</b></p>
   <p><b>ผู้พิพากษาอาวุโส</b>มีอำนาจทางคดีตาม ม.24 และ ม.25 เต็มเหมือนผู้พิพากษาทั่วไป ข้อจำกัดของผู้พิพากษาอาวุโสมีเพียงห้ามดำรงตำแหน่งบริหาร/ทำการแทนผู้รับผิดชอบราชการศาล จึงไต่สวนมูลฟ้องและมีคำสั่งในคดีอาญาตาม <b>ม.25(3)</b> ได้โดยลำพัง</p>
   <p>ส่วนค่าเสียหาย 400,000 บาท แม้เกินเพดานคดีแพ่งของศาลแขวง (300,000 บาท) แต่เป็น<b>คดีแพ่งที่เกี่ยวเนื่องกับคดีอาญา</b> (ม.326 โทษจำคุกไม่เกิน 1 ปี อยู่ในอำนาจศาลแขวง) ตาม <b>ป.วิ.อ. ม.44/1</b> ที่มุ่งอำนวยความสะดวกแก่ผู้เสียหายให้พิจารณาไปพร้อมกัน ศาลแขวงจึงมีอำนาจรับส่วนแพ่งนั้นไว้พิจารณาได้ (แนว <b>ฎ.10197/2556</b>)</p>`}
],

5: [
  {src:"แก้ตัว 64 ข้อ 1",
   tag:"ม.24(2) สั่งเลื่อนคดี · ม.25(5)+31(1) ไต่สวนมูลฟ้องแล้วยกฟ้องคดีโทษเกินอำนาจ",
   q:`นายอรรถ ผู้พิพากษา<b>ศาลจังหวัดชลบุรีเพียงคนเดียว</b> ในคดีที่นายอภิชัยฟ้องนายอภิสิทธิ์กับพวกฐาน<b>ปล้นทรัพย์ ป.อ. ม.340</b> (จำคุก 10–15 ปี ปรับ 200,000–300,000 บาท) มีคำสั่ง<br>ก. อนุญาตให้เลื่อนการสืบพยานโจทก์ไปอีกนัดหนึ่ง<br>ข. ไต่สวนมูลฟ้องแล้วเห็นว่าคดีไม่มีมูล จึงพิพากษายกฟ้อง<br>คำสั่งชอบด้วยกฎหมายหรือไม่ และหากไม่ชอบจะแก้ไขอย่างไร`,
   ans:`<p><b>ข้อ ก. ชอบด้วยกฎหมาย</b> — การอนุญาตให้เลื่อนการสืบพยานเป็นคำสั่งในระหว่างดำเนินกระบวนพิจารณาที่ "มิใช่เป็นทางวินิจฉัยชี้ขาดข้อพิพาทแห่งคดี" ผู้พิพากษาคนเดียวสั่งได้ตาม <b>ม.24(2)</b></p>
   <p><b>ข้อ ข. ไม่ชอบด้วยกฎหมาย</b> — ผู้พิพากษาคนเดียวไต่สวนมูลฟ้องได้ตาม ม.25(3) แต่การ "พิพากษายกฟ้อง" เป็นการวินิจฉัยชี้ขาดข้อพิพาท เมื่อข้อหาปล้นทรัพย์มีโทษจำคุก 10–15 ปี เกินอำนาจพิพากษาของผู้พิพากษาคนเดียวตาม <b>ม.25(5)</b> นายอรรถเพียงคนเดียวจึงพิพากษายกฟ้องไม่ได้</p>
   <p><b>วิธีแก้:</b> กรณีนี้เป็น "เหตุจำเป็นอันไม่อาจก้าวล่วงเสียได้" ตาม <b>ม.31(1)</b> — นายอรรถต้องนำสำนวนไปให้ผู้พิพากษาอีกคนหนึ่งในศาลจังหวัดชลบุรีตรวจสำนวนและร่วมลงลายมือชื่อทำคำพิพากษายกฟ้อง ให้ครบองค์คณะ 2 คนตาม ม.26 ประกอบ ม.31(1)</p>`},

  {src:"ลำปาง กลางภาค 65 ข้อ 1 (= สอบไล่กลางภาค 2/2565 ข้อ 1)",
   tag:"ผู้พิพากษาประจำศาลออกหมายจับ · ม.28/ม.30 นั่งพิจารณาแทน · ม.29 องค์คณะตายชั้นทำคำพิพากษา + หลักผู้ทำการแทน",
   q:`คดีฆ่าผู้อื่น ป.อ. ม.288 (ประหาร/ตลอดชีวิต/15–20 ปี) ที่ศาลจังหวัดลำปาง องค์คณะ = นายสอง (ผู้พิพากษาอาวุโส) + นางสาม (<b>ผู้พิพากษาประจำศาล</b>) — (1) ระหว่างพิจารณาจำเลยหลบหนี นางสาม<b>ออกหมายจับเพียงคนเดียว</b> (2) ระหว่างสืบพยานนายสองย้ายไปศาลอื่น นายหนึ่งหัวหน้าศาล<b>นั่งพิจารณาแทน</b>ร่วมกับนางสามจนเสร็จ (3) ระหว่างทำคำพิพากษานางสามถึงแก่ความตาย นายหนึ่งทำคำพิพากษา แล้วให้<b>นายสี่ผู้อาวุโสสูงสุด</b>ตรวจสำนวนและร่วมลงชื่อ ลงโทษจำคุก 20 ปี — แต่ละขั้นตอนชอบด้วยพระธรรมนูญศาลยุติธรรมหรือไม่`,
   ans:`<p><b>(1) ชอบ</b> — การออกหมายจับเป็นการ "ออกหมายอาญา" ตาม <b>ม.24(1)</b> ซึ่งผู้พิพากษาคนเดียวทำได้ ข้อจำกัดของผู้พิพากษาประจำศาลตาม <b>ม.25 วรรคสอง</b> ห้ามเฉพาะการพิจารณาพิพากษาตาม ม.25(3)(4)(5) ไม่ตัดอำนาจตาม ม.24 นางสามจึงออกหมายจับคนเดียวได้</p>
   <p><b>(2) ชอบ</b> — นายสองย้ายไปศาลอื่น = "พ้นจากตำแหน่งที่ดำรงอยู่" เป็นเหตุจำเป็นอันไม่อาจก้าวล่วงได้ตาม <b>ม.30</b> ที่เกิดขึ้นระหว่าง "การนั่งพิจารณา" (สืบพยาน) ตาม <b>ม.28</b> ผู้รับผิดชอบราชการศาล (นายหนึ่ง หัวหน้าศาล) เข้ามานั่งพิจารณาแทนเองได้</p>
   <p><b>(3) ชอบ</b> — นางสามถึงแก่ความตายระหว่าง "การทำคำพิพากษา" เป็นเหตุตาม <b>ม.29</b> ที่ให้หัวหน้าศาลลงลายมือชื่อทำคำพิพากษาแทนหลังตรวจสำนวน แต่เมื่อนายหนึ่งเป็นองค์คณะผู้พิจารณาอยู่แล้ว จะลงชื่อซ้ำสองฐานะเพื่อทดแทนองค์คณะที่ขาดไม่ได้ ต้องให้ <b>"ผู้พิพากษาที่มีอาวุโสสูงสุด"</b> (ที่ไม่ใช่ผู้พิพากษาอาวุโส/ประจำศาล) คือ นายสี่ ทำการแทนหัวหน้าศาล ตรวจสำนวนและร่วมลงชื่อจนครบองค์คณะ 2 คน</p>`},

  {src:"แก้ตัว 63 Online ข้อ 1",
   tag:"ผู้พิพากษาอาวุโสคนเดียวไต่สวนมูลฟ้อง ม.328 + ประทับฟ้อง ม.326 (ไม่จำกัดด้วยอัตราโทษ) · โอนไม่ได้ ม.19/1 ว.2",
   q:`นายเอกฟ้องนายตรีต่อ<b>ศาลจังหวัดลำปาง</b> ข้อหา<b>หมิ่นประมาทโดยการโฆษณา ม.328</b> (จำคุกไม่เกิน 2 ปี ปรับไม่เกิน 200,000 บาท) องค์คณะ = นายสมชาย (ผู้พิพากษาอาวุโส) + นายสมหวัง (ผู้พิพากษาประจำศาล) วันนัดไต่สวนมูลฟ้อง นายสมหวังลาป่วย <b>นายสมชายไต่สวนมูลฟ้องเพียงคนเดียว</b>จนเสร็จ เห็นว่าไม่ใช่การโฆษณา จึงสั่งว่าคดีมีมูลในข้อหา<b>หมิ่นประมาท ม.326</b> ให้ประทับฟ้อง ต่อมาองค์คณะออกนั่งพิจารณาแล้วมีคำสั่ง<b>ให้โอนคดีไปศาลแขวงลำปาง</b> — การไต่สวนมูลฟ้อง/ประทับฟ้อง และคำสั่งโอนคดี ชอบด้วยพระธรรมนูญศาลยุติธรรมหรือไม่`,
   ans:`<p><b>การไต่สวนมูลฟ้องและประทับฟ้อง — ชอบด้วยกฎหมาย</b> — ผู้พิพากษาคนเดียวมีอำนาจ "ไต่สวนมูลฟ้องและมีคำสั่งในคดีอาญา" ตาม <b>ม.25(3)</b> โดย<b>ไม่ถูกจำกัดด้วยอัตราโทษ</b> แม้ข้อหาเดิมตาม ม.328 จะมีโทษปรับเกินอำนาจพิพากษาของผู้พิพากษาคนเดียวตาม ม.25(5) ก็ตาม การที่นายสมชายไต่สวนคนเดียวและสั่งประทับฟ้อง ม.326 จึงชอบแล้ว</p>
   <p><b>คำสั่งโอนคดีไปศาลแขวง — ไม่ชอบด้วยกฎหมาย</b> — ขณะยื่นฟ้องคดีตาม ม.328 อยู่ในอำนาจศาลจังหวัดโดยถูกต้อง เมื่อประทับฟ้องเฉพาะ ม.326 ซึ่งอยู่ในอำนาจศาลแขวง ถือเป็น "พฤติการณ์แห่งคดีเปลี่ยนแปลงไป" ตาม <b>ม.19/1 วรรคสอง</b> (เรียนครั้งที่ 3) ที่บังคับให้ศาลจังหวัดพิจารณาพิพากษาต่อไป จะสั่งโอนไม่ได้</p>`},

  {src:"แก้ตัว 67 ข้อ 1",
   tag:"ม.25(5) วรรคท้าย ห้ามลงโทษจำคุกเกิน 6 เดือน · ผู้พิพากษาอาวุโสทำการแทนหัวหน้าศาลไม่ได้",
   q:`นางแดงฟ้องนายเขียวต่อ<b>ศาลแขวงเชียงใหม่</b> ข้อหา<b>หมิ่นประมาท ม.326</b> (จำคุกไม่เกิน 1 ปี ปรับไม่เกิน 20,000 บาท) นายศักดิ์ผู้พิพากษาศาลแขวงเห็นควรลงโทษจำคุก 1 ปี ลดโทษ 1 ใน 3 <b>คงจำคุก 8 เดือน</b> ขณะนั้นนายชัยหัวหน้าศาลแขวงถูกย้ายและยังไม่มีผู้มาแทน นายศักดิ์จึงให้<b>นายชาญ ผู้พิพากษาอาวุโส</b>ตรวจสำนวนและลงชื่อในคำพิพากษาในฐานะผู้ทำการแทนหัวหน้าศาล — คำพิพากษาที่ลงชื่อโดยนายศักดิ์และนายชาญชอบด้วยกฎหมายหรือไม่`,
   ans:`<p><b>ไม่ชอบด้วยพระธรรมนูญศาลยุติธรรม</b></p>
   <p>คดีอยู่ในอำนาจศาลแขวง ผู้พิพากษาคนเดียวพิจารณาพิพากษาได้ตาม ม.25(5) แต่เมื่อเห็นควรลงโทษ<b>จำคุก 8 เดือน ซึ่งเกิน 6 เดือน</b> ต้องห้ามตามข้อจำกัดในตอนท้าย <b>ม.25(5)</b> นายศักดิ์จึงลงชื่อในคำพิพากษาโดยลำพังคนเดียวไม่ได้ ต้องมีผู้พิพากษาอีกคนร่วมลงชื่อให้ครบองค์คณะ (ม.31(2) ประกอบ ม.29)</p>
   <p>แต่ผู้ที่จะลงชื่อร่วมคือผู้รับผิดชอบราชการศาลหรือผู้ทำการแทน — <b>"ผู้พิพากษาอาวุโส" ทำการแทนผู้รับผิดชอบราชการศาลไม่ได้</b> ตามข้อห้ามในพระธรรมนูญศาลยุติธรรม การที่นายชาญซึ่งเป็นผู้พิพากษาอาวุโสตรวจสำนวนและลงชื่อร่วม จึงไม่มีอำนาจ คำพิพากษาที่ลงชื่อโดยนายศักดิ์และนายชาญจึงไม่ชอบด้วยกฎหมาย</p>`},

  {src:"ลำปาง 2/67 ข้อ 1",
   tag:"ผู้พิพากษาประจำศาลสั่งรับฟ้อง (ม.24) · องค์คณะประจำศาล+อาวุโส (ม.26) · ม.19/1 ว.2 ลดทุนทรัพย์แล้วโอนได้",
   q:`โจทก์ฟ้องเรียกค่าเสียหายจากละเมิด <b>500,000 บาท</b> ต่อศาลจังหวัดเชียงใหม่ <b>นายนิติ ผู้พิพากษาประจำศาลเวรรับฟ้องเพียงคนเดียว</b> สั่งรับฟ้อง ต่อมาหัวหน้าศาลจ่ายสำนวนให้นายนิติ (ประจำศาล) + นายธรรมศาสตร์ (ผู้พิพากษาอาวุโส) เป็นองค์คณะ วันสืบพยานโจทก์ขอแก้ฟ้องลดทุนทรัพย์เหลือ <b>200,000 บาท</b> องค์คณะอนุญาตแล้วมีคำสั่ง<b>ให้โอนคดีไปศาลแขวงเชียงใหม่</b> — คำสั่งรับฟ้อง / การเป็นองค์คณะ / คำสั่งโอนคดี ชอบด้วยพระธรรมนูญศาลยุติธรรมหรือไม่`,
   ans:`<p><b>คำสั่งรับฟ้อง — ชอบ</b> — คำสั่งรับฟ้องเป็น "คำสั่งใด ๆ ซึ่งมิใช่เป็นการวินิจฉัยชี้ขาดข้อพิพาทแห่งคดี" ตาม <b>ม.24(2)</b> ผู้พิพากษาคนเดียวสั่งได้ ข้อจำกัดของผู้พิพากษาประจำศาลตาม ม.25 วรรคสอง ห้ามเฉพาะการพิจารณาพิพากษาตาม ม.25(3)(4)(5) ไม่ห้ามการใช้อำนาจตาม ม.24 นายนิติจึงสั่งรับฟ้องได้</p>
   <p><b>การเป็นองค์คณะ — ชอบ</b> — ม.26 ต้องมีผู้พิพากษาอย่างน้อย 2 คน และ<b>ห้ามเฉพาะผู้พิพากษาประจำศาล 2 คนนั่งคู่กัน</b> เมื่อองค์คณะเป็นผู้พิพากษาประจำศาล 1 + ผู้พิพากษาอาวุโส 1 จึงเป็นองค์คณะที่สมบูรณ์</p>
   <p><b>คำสั่งโอนคดี — ชอบ</b> — เดิมฟ้อง 500,000 บาท อยู่ในอำนาจศาลจังหวัดโดยแท้ เมื่อโจทก์แก้ฟ้องลดทุนทรัพย์เหลือ 200,000 บาท เป็น "พฤติการณ์เปลี่ยนแปลงไปทำให้คดีอยู่ในอำนาจศาลแขวง" ตาม <b>ม.19/1 วรรคสอง</b> ซึ่งให้ศาลจังหวัด<b>มีดุลพินิจ</b>ที่จะพิจารณาต่อไปเองหรือสั่งโอนไปศาลแขวงก็ได้ การสั่งโอนจึงเป็นการใช้ดุลพินิจที่ชอบ</p>
   <p><b>ข้อสังเกต:</b> ต่างจากกรณี ฎ.411/2550 (คดีขับไล่แล้วจำเลยสู้กรรมสิทธิ์) ที่ศาลจังหวัดต้องทำต่อและโอนไม่ได้ — จุดต่างคือคดีนี้เป็นคดีมีทุนทรัพย์ของศาลจังหวัดโดยแท้แล้วทุนทรัพย์ลดลงภายหลัง</p>`}
]

};

/* ---------- EXAM_BANK: ครั้งที่เหลือ (batch 1) จาก "วิแพ่ง War mode" ส่วนข้อสอบเก่าแยกหัวข้อ ---------- */

EXAM_BANK[2] = [
  {src:"ข้อสอบทฤษฎี (อธิบาย ม.55)",
   tag:"อำนาจฟ้อง ม.55 — คดีมีข้อพิพาท (โต้แย้งสิทธิ) vs คดีไม่มีข้อพิพาท (ต้องมีกฎหมายรับรอง)",
   q:`ป.วิ.พ. มาตรา 55 บัญญัติว่า "เมื่อมีข้อโต้แย้งเกิดขึ้นเกี่ยวกับสิทธิหรือหน้าที่ของบุคคลใดตามกฎหมายแพ่ง หรือบุคคลใดจะต้องใช้สิทธิทางศาล บุคคลนั้นชอบที่จะเสนอคดีของตนต่อศาลส่วนแพ่งที่มีเขตอำนาจได้…" ท่านได้ศึกษามาตรานี้ได้ความว่าอย่างไร จงอธิบาย`,
   ans:`<p>มาตรา 55 วางหลักเรื่อง <b>อำนาจฟ้อง</b> — หากขาดอำนาจฟ้อง ศาลยกฟ้องทันทีโดยไม่พิจารณาเนื้อหา แบ่ง 2 กรณี</p>
   <p><b>1) คดีมีข้อพิพาท</b> ("เมื่อมีข้อโต้แย้งเกิดขึ้นเกี่ยวกับสิทธิหรือหน้าที่…") — ต้องมีการ<b>โต้แย้งสิทธิ</b>เกิดขึ้นแล้ว โดยจำเลยที่ถูกฟ้องต้องเป็นผู้โต้แย้ง เสนอเป็น "คำฟ้อง" (มีโจทก์–จำเลย) · ถ้าความเสียหายเกิดจากคนอื่นที่ไม่ใช่จำเลย ไม่มีอำนาจฟ้องจำเลยนั้น เช่น เจ้าหน้าที่รังวัดผิดพลาด เจ้าของที่ข้างเคียงไม่ได้ทำอะไร (<b>ฎ.1479/2517</b>) · ผู้เช่าช่วงวางทรัพย์เพราะไม่แน่ใจว่าจ่ายใคร ไม่ถือว่าโต้แย้งสิทธิ (<b>ฎ.2949-2951/2540</b> มาบุญครอง)</p>
   <p><b>2) คดีไม่มีข้อพิพาท</b> ("…หรือบุคคลใดจะต้องใช้สิทธิทางศาล") — ต้องมี<b>กฎหมายบัญญัติรับรอง</b>ให้ใช้สิทธิทางศาลได้ เสนอเป็น "คำร้องขอ" (มีแต่ผู้ร้อง) เช่น ขอตั้งผู้จัดการมรดก ขอเป็นคนสาบสูญ ครอบครองปรปักษ์ · ถ้าไม่มีกฎหมายให้อำนาจ ศาลยกคำร้อง เช่น ขอให้ศาลสั่งว่าตนเป็นบุคคลคนเดียวกับคนเดิม (<b>ฎ.100/2524</b>) ขอเปลี่ยนคำนำหน้าหลังผ่าตัดแปลงเพศ (<b>ฎ.157/2524</b>)</p>
   <p>การตอบต้องปรับหลักกับข้อเท็จจริงว่าเข้าวงเล็บใด และผลคือศาลรับฟ้อง/รับคำร้องหรือไม่</p>`},

  {src:"ข้อสอบทฤษฎี (บุคคลจะนำคดีขึ้นสู่ศาลได้หรือไม่)",
   tag:"อำนาจฟ้อง ม.55 — หนี้ขาดอายุความ / สัญญาผิดแบบเป็นโมฆะ ฟ้องได้; ขอรับรองสถานะโดยไม่มีกฎหมาย ร้องไม่ได้",
   q:`บุคคลจะนำคดีขึ้นสู่ศาลได้หรือไม่ (ก) หนี้ที่ขาดอายุความ (ข) หนี้จากสัญญาทำผิดแบบตกเป็นโมฆะ (ค) นายมีร้องขอให้ศาลวินิจฉัยว่านายมีเป็นคนเดียวกับ ด.ช.มี ที่สูญหายไปในทะเลเมื่อ 20 ปีก่อน`,
   ans:`<p><b>(ก) ฟ้องได้</b> — อายุความเมื่อครบกำหนดหนี้ไม่ระงับ เพียงให้ลูกหนี้ยกขึ้นเป็น "ข้อต่อสู้" เมื่อลูกหนี้ไม่จ่าย = มีการโต้แย้งสิทธิแล้ว เจ้าหนี้มีอำนาจฟ้องตาม ม.55 (แพ้/ชนะขึ้นกับว่าลูกหนี้ยกอายุความขึ้นสู้หรือไม่)</p>
   <p><b>(ข) ฟ้องได้</b> — วิชานี้คือวิธีสบัญญัติ ไม่ใช่สารบัญญัติ เมื่อโจทก์อ้างสิทธิและจำเลยโต้แย้ง (ไม่ยอมโอน) ย่อมมีอำนาจฟ้อง ส่วนสัญญาเป็นโมฆะหรือไม่เป็นเรื่องเนื้อหาคดีว่าแพ้/ชนะ ไม่ใช่เรื่องอำนาจฟ้อง</p>
   <p><b>(ค) ร้องขอไม่ได้</b> — เป็นคดีไม่มีข้อพิพาท ต้องมีกฎหมายบัญญัติรับรอง เมื่อไม่มีกฎหมายให้ศาลสั่งรับรองว่าตนเป็นบุคคลคนเดียวกับคนอื่น จึงไม่มีอำนาจยื่นคำร้องขอ (<b>ฎ.100/2524</b>) — แต่ถ้ามีคนมาเถียงว่า "ไม่ใช่ตัวจริง ไม่มีสิทธิรับมรดก" จะกลายเป็นคดีมีข้อพิพาท ฟ้องได้</p>`},

  {src:"ลำปาง 60 ข้อ 1",
   tag:"อำนาจฟ้อง ม.55 — คณะกรรมการทำรายงานเสนอผู้บังคับบัญชา ยังไม่ถือว่าโต้แย้งสิทธิ",
   q:`โจทก์เช่าบ้านและเบิกค่าเช่าราชการโดยชอบ ต่อมาจำเลยทั้งสี่ (คณะกรรมการตรวจสอบการใช้สิทธิเบิกค่าเช่าบ้าน) ทำ<b>รายงานเสนอผู้บังคับบัญชา</b>ว่าโจทก์ไม่ได้เช่าบ้านจริง เบิกไม่ถูกต้อง ควรงดเบิก เรียกเงินคืน และตั้งกรรมการสอบวินัย โจทก์ฟ้องขอให้เพิกถอนคำวินิจฉัยนั้น ศาลชั้นต้นตรวจคำฟ้องแล้ววินิจฉัยว่าโจทก์ไม่มีอำนาจฟ้อง พิพากษายกฟ้อง — ชอบด้วย ป.วิ.พ. หรือไม่`,
   ans:`<p><b>ชอบด้วยประมวลกฎหมายวิธีพิจารณาความแพ่งแล้ว</b></p>
   <p>ตาม ม.55 ต้องมีการ<b>โต้แย้งสิทธิ</b>เกิดขึ้นก่อน จำเลยทั้งสี่เป็นเพียงคณะกรรมการที่ทำหน้าที่<b>ตรวจสอบและเสนอความเห็นต่อผู้บังคับบัญชา</b> ไม่มีอำนาจออกคำสั่งบังคับเรียกเงินคืนหรือลงโทษวินัยโจทก์ด้วยตนเอง การทำรายงานเสนอความเห็นจึงยังไม่เป็นการโต้แย้งสิทธิของโจทก์ตามกฎหมายแพ่ง โจทก์ไม่มีอำนาจฟ้องจำเลยทั้งสี่เพื่อขอเพิกถอนคำวินิจฉัยนั้น ศาลชั้นต้นยกฟ้องชอบแล้ว</p>`}
];

EXAM_BANK[4] = [
  {src:"2/67 ข้อ 2 · แก้ตัว 67 ข้อ 2 · ลำปาง 2/67 ข้อ 2 (ชุดคดีเช่าคอนโด–ยูเครน)",
   tag:"ม.55 คดีขาดอายุความยังฟ้องได้ · ม.4(1) มูลคดีเกิด · ม.3(2)(ก) ขยายภูมิลำเนา 2 ปี · ม.4ตรี ใช้เฉพาะมูลคดีเกิดนอกราชอาณาจักร",
   q:`ผู้เช่า (ต่างชาติ/คนไทย) ทำห้องคอนโดเสียหาย ค่าซ่อม 350,000 บาท รับปากจะโอนเงินแล้วไม่โอน ต่อมาย้ายไปยูเครน (ออกจากภูมิลำเนาเดิมในไทยเกิน 2 ปีก่อนวันฟ้อง) สัญญาเช่าทำที่กรุงเทพฯ (บางฉบับมีสัญญาโอนสิทธิเรียกร้องทำที่ภูเก็ต) จำเลยมีบัญชีเงินฝากในไทย · ป.พ.พ. ม.563 ห้ามผู้ให้เช่าฟ้องผู้เช่าเมื่อพ้น 6 เดือนนับแต่ส่งคืนทรัพย์ — โจทก์/ผู้รับโอนสิทธิฟ้องได้หรือไม่ ที่ศาลใด`,
   ans:`<p><b>ฟ้องได้</b> — การไม่ยอมชำระค่าซ่อมที่รับปากไว้ = โต้แย้งสิทธิตาม ม.55 ส่วนคดีพ้น 6 เดือนตาม ป.พ.พ. ม.563 เป็นเรื่อง<b>อายุความ</b> ซึ่งเป็นข้อต่อสู้ทางสารบัญญัติที่จำเลยต้องยกขึ้นอ้าง <b>ไม่ตัดอำนาจฟ้อง</b>ทางวิธีสบัญญัติ</p>
   <p><b>เขตศาล:</b> จำเลยย้ายออกจากภูมิลำเนาเดิมในไทย<b>เกิน 2 ปี</b>ก่อนวันฟ้อง จึงนำ ม.3(2)(ก) มาขยายภูมิลำเนาไม่ได้ ฟ้องที่ศาลตามภูมิลำเนาเดิมไม่ได้ · ฟ้องได้เฉพาะ<b>ศาลที่มูลคดีเกิด</b> (ที่ทำสัญญา) ตาม ม.4(1) — ถ้ามีหลายจุด (ที่ทำสัญญาเช่า + ที่ทำสัญญาโอนสิทธิเรียกร้อง) เลือกได้ตาม ม.5</p>
   <p><b>หลุมพราง:</b> บัญชีเงินฝากของจำเลยในไทย <b>ไม่</b>ทำให้ฟ้องศาลนั้นได้ตาม ม.4ตรี เพราะ ม.4ตรี ใช้ได้เฉพาะเมื่อ "มูลคดีเกิดนอกราชอาณาจักร" เมื่อคดีนี้มูลคดีเกิดในไทย จึงใช้ ม.4(1) ตามปกติ</p>`},

  {src:"แก้ตัว 64 ข้อ 2",
   tag:"ม.3(1) มูลคดีเกิดในอากาศยานไทยนอกราชอาณาจักร → ศาลแพ่ง · หนี้ยังไม่ถึงกำหนด = ยังไม่โต้แย้งสิทธิ · ม.3(2)(ก)",
   q:`นายทิม (อเมริกัน) เคยอยู่กินกับนางนกที่นราธิวาส ทำสัญญากู้ 1 ล้านดอลลาร์จากนายดันแคน (อังกฤษ) ลงนามที่มาเลเซีย ครบกำหนดคืน 1 ปี (1 ต.ค. 65) · 1 มิ.ย. 65 บนเครื่องบินการบินไทยเหนือน่านฟ้าเมียนมา นายทิมตีศีรษะนายดันแคนบาดเจ็บ แล้วนายทิมย้ายกลับสหรัฐฯ · 1 ก.ค. 65 นายดันแคนจะฟ้องเรียกหนี้เงินกู้ + ค่าเสียหาย 500,000 บาท — ฟ้องได้หรือไม่ ที่ศาลใด เมื่อใดจึงได้ประโยชน์สูงสุด`,
   ans:`<p><b>มูลละเมิด (ค่าเสียหาย 500,000):</b> เหตุเกิดในอากาศยานไทยนอกราชอาณาจักร ตาม <b>ม.3(1)</b> ให้ฟ้องต่อ<b>ศาลแพ่ง</b> — ฟ้องได้ทันที (1 ก.ค. 65)</p>
   <p><b>มูลหนี้เงินกู้:</b> วันที่ 1 ก.ค. 65 หนี้<b>ยังไม่ถึงกำหนดชำระ</b> (ครบ 1 ต.ค. 65) ลูกหนี้ปฏิเสธคืนก่อนกำหนดได้ ยังไม่ถือว่าโต้แย้งสิทธิ จึง<b>ยังไม่มีอำนาจฟ้อง</b> — ต้องรอพ้น 1 ต.ค. 65 · เมื่อฟ้องได้ แม้มูลคดีเกิดที่มาเลเซียและจำเลยอยู่สหรัฐฯ แต่จำเลยเพิ่งย้ายออกจากนราธิวาส 1 มิ.ย. 65 ยังไม่เกิน 2 ปี ตาม <b>ม.3(2)(ก)</b> ให้ถือนราธิวาสเป็นภูมิลำเนาจำเลย ฟ้องที่<b>ศาลจังหวัดนราธิวาส</b>ได้</p>`},

  {src:"ลำปาง ปลายภาค 65 ข้อ 1",
   tag:"ม.4(1) + ม.3(2)(ก) ทั้งสองฝ่ายเคยมีภูมิลำเนาในไทยไม่เกิน 2 ปี · ทรัพย์สินจำเลยไม่ทำให้เกิดเขตอำนาจ",
   q:`สัญญาซื้อขายผลิตภัณฑ์เกษตรทำที่บ้านนายเดชในแคนาดา 6 เดือนต่อมาเกิดข้อพิพาท · นายเดช (แคนาดาแล้ว) ย้ายออกจากหนองคายมา 1 ปี 9 เดือน มีบัญชีเงินฝากที่อุดรธานี · นางสาวเนตร (ลาว) ย้ายออกจากแม่ฮ่องสอนมา 1 ปี มีบัญชีเงินฝากที่พัทลุง — ทั้งสองจะฟ้องกันที่ศาลใดในไทยได้บ้าง`,
   ans:`<p>มูลคดีเกิดนอกราชอาณาจักร คู่สัญญาทั้งคู่ไม่มีภูมิลำเนาปัจจุบันในไทย แต่ต่างเพิ่งย้ายออก<b>ไม่เกิน 2 ปี</b>ก่อนฟ้อง จึงใช้ <b>ม.3(2)(ก)</b> ขยายภูมิลำเนาเดิมได้</p>
   <p><b>นางสาวเนตรฟ้องนายเดช</b> → ที่<b>ศาลจังหวัดหนองคาย</b> (ภูมิลำเนาเดิมนายเดช) · <b>นายเดชฟ้องนางสาวเนตร</b> → ที่<b>ศาลจังหวัดแม่ฮ่องสอน</b> (ภูมิลำเนาเดิมนางสาวเนตร) ตาม ม.4(1) ประกอบ ม.3(2)(ก)</p>
   <p><b>หลุมพราง:</b> บัญชีเงินฝากที่อุดรธานี/พัทลุง ไม่ทำให้เกิดเขตอำนาจศาลนั้น เพราะเมื่อปรับ ม.3(2)(ก) ได้แล้วก็เข้า ม.4(1) ตามปกติ ไม่ต้องใช้ ม.4ตรี (ศาลที่ทรัพย์สินตั้งอยู่)</p>`}
];

EXAM_BANK[7] = [
  {src:"2/67 ข้อ 3",
   tag:"ร้องสอด ม.57(3)(ก) หมายเรียกจำเลยร่วมเพื่อไล่เบี้ย · ม.57 ว.2 ยื่นหลังคำให้การได้ถ้ามีเหตุ",
   q:`นายอำนาจฟ้องนายเฉลิมว่าปล่อยสุนัขมากัดตน เรียกค่าเสียหาย 20,000 บาท นายเฉลิมให้การสู้คดี · หลังยื่นคำให้การ นายเฉลิมพาสุนัขไปตัดขนจึงพบว่ามีคนตีสุนัข สืบทราบว่านางเมตตาเพื่อนบ้านเป็นคนทำ · นายเฉลิมยื่นคำร้องขอให้ศาล<b>ออกหมายเรียกนางเมตตาเข้ามาเป็นจำเลยร่วม</b>เพื่อไล่เบี้ย โดยยื่นในวันเริ่มสืบพยานวันแรก — ศาลจะสั่งอย่างไร`,
   ans:`<p><b>ศาลต้องสั่ง "อนุญาต"</b> ให้ออกหมายเรียกนางเมตตาเข้ามาเป็นจำเลยร่วม</p>
   <p>จำเลยมีสิทธิขอให้เรียกบุคคลภายนอกเข้ามาเป็นจำเลยร่วมเพื่อ<b>ใช้สิทธิไล่เบี้ย</b>ตาม <b>ม.57(3)(ก)</b> — หากนายเฉลิมแพ้คดีต้องชดใช้นายอำนาจ ก็ย่อมไล่เบี้ยเอากับนางเมตตาผู้ทำร้ายสุนัขได้</p>
   <p>เรื่องเวลา: <b>ม.57 วรรคสอง</b> ให้ยื่นพร้อมคำให้การ เว้นแต่ศาลพอใจว่าไม่อาจยื่นก่อนนั้นได้ นายเฉลิมเพิ่งทราบเหตุ<b>หลังยื่นคำให้การไปแล้ว</b> จึงเป็นเหตุอันสมควร และยื่นในวันเริ่มสืบพยานซึ่งยัง<b>ก่อนมีคำพิพากษา</b> จึงเข้าข้อยกเว้น (เทียบ <b>ฎ.706/2505</b>)</p>`},

  {src:"2/67 ข้อ 4 (ประเด็นการทิ้งฟ้อง)",
   tag:"ทิ้งฟ้อง ม.174(2)/132(1) — จำหน่ายคดีไม่ใช่คำพิพากษาชี้ขาด ขอเพิกถอนได้; ฟ้องใหม่ไม่เป็นซ้อน/ซ้ำ/ดำเนินซ้ำ (ม.176)",
   q:`นายดำฟ้องนายแดงให้ชำระหนี้ผิดสัญญาก่อสร้าง 1,000,000 บาท ศาลรับฟ้อง สั่งให้โจทก์นำส่งหมายเรียก+สำเนาคำฟ้องภายใน 7 วัน โจทก์ไม่ไปนำส่ง (ป่วยหนัก) ศาลสั่งว่าโจทก์<b>ทิ้งฟ้อง จำหน่ายคดี</b> · 7 วันต่อมาโจทก์ยื่นคำร้องขอเพิกถอนคำสั่งจำหน่ายคดี ศาลยกคำร้องโดยอ้างว่า "พิพากษาคดีไปแล้ว เปลี่ยนแปลงไม่ได้" — ถูกต้องหรือไม่ และถ้าฟ้องใหม่ต้องห้ามฟ้องซ้อน/ซ้ำ/ดำเนินซ้ำหรือไม่`,
   ans:`<p><b>คำสั่งยกคำร้องไม่ถูกต้อง</b> — โจทก์ไม่นำส่งหมายตามคำสั่งศาล = ทิ้งฟ้องตาม <b>ม.174(2)</b> ศาลสั่งจำหน่ายคดีตาม <b>ม.132(1)</b> ซึ่งกฎหมายระบุชัดว่า "โดยไม่ต้องมีคำวินิจฉัยชี้ขาดในประเด็น" จึง<b>ไม่ใช่คำพิพากษาชี้ขาดเนื้อหาคดี</b> โจทก์ที่มีเหตุจำเป็น (ป่วยหนัก) ยื่นคำร้องขอให้เพิกถอนคำสั่งจำหน่ายคดีได้ เพราะศาลสั่งไปโดยยังไม่ทราบเหตุขัดข้อง</p>
   <p><b>ฟ้องใหม่ได้ ไม่ต้องห้าม</b> — ตาม <b>ม.176</b> การทิ้งฟ้องลบล้างผลการยื่นคำฟ้อง ฟ้องใหม่ได้ถ้ายังไม่ขาดอายุความ · ไม่เป็นฟ้องซ้อน (คดีแรกจำหน่ายไปแล้ว ไม่อยู่ระหว่างพิจารณา) · ไม่เป็นฟ้องซ้ำ/ดำเนินกระบวนพิจารณาซ้ำ (ศาลยังไม่ได้วินิจฉัยชี้ขาดประเด็นแห่งคดี)</p>`}
];

EXAM_BANK[8] = [
  {src:"ลำปาง ปลายภาค 65 ข้อ 2",
   tag:"ขอยกเว้นค่าธรรมเนียมศาล ม.155–157 · อุทธรณ์คำสั่งภายใน 7 วัน คำสั่งศาลอุทธรณ์เป็นที่สุด",
   q:`จงอธิบายหลักเกณฑ์ แนวทางการพิจารณา และผลของคำสั่งศาลเรื่องการขอยกเว้นค่าธรรมเนียมศาล`,
   ans:`<p><b>1) หลักเกณฑ์ (ม.155–156):</b> คู่ความ (โจทก์/จำเลย/ผู้ร้องสอด) ที่<b>ไม่สามารถเสียค่าธรรมเนียมศาล</b>ได้ ยื่นเป็นคำร้องต่อศาลชั้นต้น พร้อมคำฟ้อง/คำให้การ/อุทธรณ์/ฎีกา (หรือยื่นภายหลังได้หากเพิ่งยากจนลง) ต้องเสนอพยานหลักฐานแสดงว่า<b>ไม่มีทรัพย์สินพอ</b> หรือ<b>จะเดือดร้อนเกินสมควร</b> และถ้าเป็นฝ่ายเริ่มคดี การฟ้องต้องมี<b>เหตุผลอันสมควร</b>ที่จะฟ้องด้วย</p>
   <p><b>2) แนวทางพิจารณา (ม.156/1):</b> ศาลไต่สวนโดยเร็วเท่าที่จำเป็น (สั่งงดกระบวนพิจารณาส่วนอื่นชั่วคราวได้) แล้วสั่ง<b>อนุญาต</b> (ทั้งหมด/บางส่วน) หรือ<b>ยกคำร้อง</b></p>
   <p><b>3) ผลของคำสั่ง (ม.157):</b> อนุญาต → ไม่ต้องเสียค่าธรรมเนียม/ไม่ต้องวางเงินชั้นอุทธรณ์–ฎีกา มีผลเฉพาะอนาคต (เงินที่เสียไปก่อนแล้วขอคืนไม่ได้) ศาลถอนการอนุญาตได้หากประวิงคดี/ก่อความรำคาญ · ยกคำร้อง/อนุญาตบางส่วน → ผู้ร้อง<b>อุทธรณ์ได้ภายใน 7 วัน</b> นับแต่วันมีคำสั่ง และ<b>คำสั่งศาลอุทธรณ์เป็นที่สุด</b></p>`}
];

EXAM_BANK[10] = [
  {src:"แก้ตัว 64 ข้อ 3",
   tag:"ฟ้องแย้ง ม.177 ว.3 — ฟ้องแย้ง \"มีเงื่อนไข\" (หากรุกล้ำก็ครอบครองปรปักษ์แล้ว) ไม่เกี่ยวกับฟ้องเดิม",
   q:`โจทก์ฟ้องขับไล่+เรียกค่าเสียหาย อ้างว่าจำเลยขออาศัยที่ดินแล้วผิดสัญญาไม่จ่ายค่าตอบแทน · จำเลยให้การปฏิเสธว่าไม่เคยขออาศัย บ้านเป็นของตนปลูกบนที่ว่างเปล่า และ<b>ฟ้องแย้งว่า "หากมีส่วนใดรุกล้ำเข้าไปในที่ดินโจทก์ ที่ดินนั้นก็ตกเป็นของจำเลยโดยครอบครองปรปักษ์"</b> ศาลชั้นต้นไม่รับฟ้องแย้ง อ้างว่าไม่เกี่ยวกับฟ้องเดิม — ชอบหรือไม่`,
   ans:`<p><b>ชอบด้วยประมวลกฎหมายวิธีพิจารณาความแพ่งแล้ว</b></p>
   <p>ตาม <b>ม.177 วรรคสาม</b> ฟ้องแย้งต้องเกี่ยวกับฟ้องเดิมพอที่จะรวมพิจารณาได้ · ฟ้องแย้งของจำเลยเป็น <b>"ฟ้องแย้งมีเงื่อนไข"</b> — สิทธิตามฟ้องแย้งจะเกิดก็ต่อเมื่อศาลวินิจฉัยเสียก่อนว่าที่ดินส่วนนั้นเป็นของโจทก์ อีกทั้งขัดกับคำให้การของจำเลยเองที่ยืนยันว่าไม่ได้รุกล้ำ สิทธิจึงยังไม่เกิดขึ้นแน่นอนพร้อมบริบูรณ์ขณะยื่นฟ้องแย้ง ถือว่าไม่เกี่ยวกับฟ้องเดิมพอจะรวมพิจารณาได้ (แนว <b>ฎ.5974/2539</b>)</p>`},

  {src:"ลำปาง 2/67 ข้อ 3",
   tag:"ฟ้องแย้ง ม.177 ว.3 — เรียกเงินคืนตามสัญญาประนีประนอมยอมความที่ระงับข้อพิพาทละเมิดรายเดียวกัน = เกี่ยวกับฟ้องเดิม",
   q:`โจทก์ฟ้องเรียกค่าเสียหาย 400,000 บาท อ้างว่าจำเลยก่อสร้างอาคารโดยประมาททำให้บ้านโจทก์เสียหาย · จำเลยให้การว่าคดีขาดอายุความ และคู่ความได้<b>ทำสัญญาประนีประนอมยอมความ</b>กันแล้ว (จำเลยซ่อมให้ + จ่ายเพิ่ม) แต่โจทก์รับเงินค่าอพยพ 200,000 บาทไปแล้วไม่ยอมย้ายออก · จำเลย<b>ฟ้องแย้งเรียกเงิน 200,000 บาทคืน</b> ศาลชั้นต้นไม่รับฟ้องแย้ง อ้างว่าไม่เกี่ยวกับฟ้องเดิม — ชอบหรือไม่`,
   ans:`<p><b>ไม่ชอบด้วยประมวลกฎหมายวิธีพิจารณาความแพ่ง</b></p>
   <p>แม้ฟ้องแย้งจะเป็นการเรียกเงินคืนตามสัญญาประนีประนอมยอมความ แต่สัญญานั้นทำขึ้นเพื่อ<b>ระงับข้อพิพาทอันเป็นประเด็นสืบเนื่องจากเหตุละเมิดรายเดียวกัน</b>กับฟ้องเดิม ข้อเท็จจริงและพยานหลักฐานเชื่อมโยงกัน จึงเกี่ยวข้องกับฟ้องเดิมพอที่จะรวมพิจารณาและชี้ขาดเข้าด้วยกันได้ตาม <b>ม.177 วรรคสาม</b> ศาลต้องรับฟ้องแย้ง</p>`}
];

EXAM_BANK[13] = [
  {src:"ภาคปกติ 64 ข้อ 1",
   tag:"ฟ้องซ้ำ (ม.148 ถึงที่สุด) vs ดำเนินกระบวนพิจารณาซ้ำ (ม.144 แค่ชี้ขาดประเด็น) · คำร้องสอด ม.58 = ฟ้องคดีใหม่",
   q:`คดีแรก นายแดงฟ้องขับไล่นางเขียว ศาลชั้นต้นพิพากษายกฟ้อง วินิจฉัยว่าที่ดินเป็นของนางเขียว นายแดง<b>ขอขยายเวลาอุทธรณ์</b> (คดียังไม่ถึงที่สุด) · คดีที่สอง นางเขียวฟ้องขับไล่นายเหลือง · นายแดง<b>ยื่นคำร้องสอด</b>เข้าคดีที่สอง อ้างว่าที่ดินเป็นของตน ขอให้ขับไล่ทั้งนางเขียวและนายเหลือง — (ก) ฟ้องซ้ำต่างจากดำเนินกระบวนพิจารณาซ้ำอย่างไร (ข) คำร้องสอดของนายแดงเป็นอย่างใด`,
   ans:`<p><b>(ก)</b> จุดต่างสำคัญคือ <b>"ความถึงที่สุดของคดี"</b> — ฟ้องซ้ำ (<b>ม.148</b>) ต้องเป็นคดีที่คำพิพากษา<b>ถึงที่สุดแล้ว</b> · ดำเนินกระบวนพิจารณาซ้ำ (<b>ม.144</b>) เกิดทันทีที่ศาล<b>ชี้ขาดประเด็น</b>ใดไปแล้ว แม้คดียังไม่ถึงที่สุด (ยังอุทธรณ์/ฎีกาอยู่) ก็ห้ามรื้อประเด็นนั้นขึ้นใหม่</p>
   <p><b>(ข)</b> คำร้องสอดตาม ม.57(1) ถือเป็น<b>คำฟ้องตั้งคดีใหม่</b>ตาม <b>ม.58 วรรคหนึ่ง</b> · เมื่อคดีแรกยังไม่ถึงที่สุด คำร้องสอดจึง<b>ไม่เป็นฟ้องซ้ำ</b> · แต่ประเด็นกรรมสิทธิ์ที่นายแดงยกขึ้นเป็น<b>ประเด็นเดียวกัน</b>กับที่ศาลคดีแรกชี้ขาดไปแล้ว จึงเป็น<b>การดำเนินกระบวนพิจารณาซ้ำ</b> ต้องห้ามตาม ม.144 (แนว <b>ฎ.1295/2524</b>, <b>ฎ.3330-3331/2524</b>)</p>`},

  {src:"แก้ตัว 65 ข้อ 3",
   tag:"ฟ้องซ้อน ม.173 ว.2(1) — คดีแรกถอนฟ้อง แต่จำเลยอุทธรณ์คำสั่งอนุญาตถอนฟ้อง = ยังอยู่ระหว่างพิจารณา",
   q:`คดีที่หนึ่ง นาย ก. ฟ้องนาย ข. ที่ศาลจังหวัดขอนแก่นเรียกเงินตามเช็ค 30,000 บาท ต่อมาโจทก์ถอนฟ้อง ศาลอนุญาต จำเลย<b>อุทธรณ์คำสั่งที่อนุญาตให้ถอนฟ้อง</b> คดีอยู่ระหว่างพิจารณาของศาลอุทธรณ์ · คดีที่สอง นาย ก. ฟ้องนาย ข. ที่ศาลจังหวัดพิจิตรในมูลหนี้เดียวกัน คำขอเหมือนกันทุกประการ — ถ้าเป็นศาลจังหวัดพิจิตรจะตัดสินอย่างไร`,
   ans:`<p><b>พิพากษายกฟ้องคดีที่สอง เพราะเป็นฟ้องซ้อน</b> ต้องห้ามตาม <b>ม.173 วรรคสอง (1)</b></p>
   <p>แม้คดีแรกโจทก์จะถอนฟ้องและศาลชั้นต้นอนุญาตแล้ว แต่จำเลย<b>อุทธรณ์คำสั่งอนุญาตให้ถอนฟ้อง</b> และคดีอยู่ระหว่างพิจารณาของศาลอุทธรณ์ ย่อมถือว่าคดีแรก<b>ยังอยู่ในระหว่างพิจารณา</b> (ไม่ว่าชั้นต้น อุทธรณ์ หรือฎีกา) · เมื่อโจทก์คนเดิมฟ้องจำเลยคนเดิมในเรื่องเดียวกันซ้ำ จึงเป็นฟ้องซ้อน (แนว <b>ฎ.1935/2540</b>)</p>`},

  {src:"แก้ตัว 63 Online ข้อ 2",
   tag:"แก้ไขคำฟ้อง ม.180 — แก้ชื่อสะกดผิด = ข้อผิดหลงเล็กน้อย (ยื่นช้ากว่า 7 วันได้) · ฟ้องซ้อน: จำเลยที่ฟ้องแย้ง = โจทก์",
   q:`คดีแรก (280/2564) นายแดงฟ้องขับไล่นางเขียว นางเขียวให้การและ<b>ฟ้องแย้ง</b>ขอขับไล่นายแดง ศาลงดชี้สองสถาน นัดสืบพยาน 1 เม.ย. 64 · นายแดงยื่นคำร้อง 26 มี.ค. 64 ขอ<b>แก้ชื่อจำเลยที่สะกดผิด</b> · 1 เม.ย. 64 นางเขียวฟ้องนายแดงเป็นคดีใหม่ (380/2564) ขอขับไล่ในมูลเดียวกัน — (ก) คำสั่งอนุญาตแก้คำฟ้องชอบหรือไม่ (ข) คำสั่งรับฟ้องคดี 380/2564 ชอบหรือไม่`,
   ans:`<p><b>(ก) ชอบด้วยกฎหมาย</b> — ตาม <b>ม.180</b> ต้องยื่นก่อนวันสืบพยานไม่น้อยกว่า 7 วัน (ยื่น 26 มี.ค. ก่อนนัด 1 เม.ย. ไม่ถึง 7 วัน) แต่การแก้ชื่อจำเลยที่สะกดผิดเป็น <b>"การแก้ไขข้อผิดหลงเล็กน้อย"</b> ซึ่งเข้าข้อยกเว้นตอนท้าย ม.180 ศาลอนุญาตได้แม้พ้นกำหนด</p>
   <p><b>(ข) ไม่ชอบด้วยกฎหมาย</b> — คำว่า "โจทก์" ในเรื่องฟ้องซ้อนตาม <b>ม.173 วรรคสอง (1)</b> รวมถึง<b>จำเลยที่ฟ้องแย้ง</b>ด้วย นางเขียวฟ้องแย้งในคดีแรกจึงมีสถานะเป็นโจทก์ เมื่อคดีแรกยังอยู่ระหว่างพิจารณา การที่นางเขียวฟ้องนายแดงเป็นคดีใหม่ในมูลเดียวกันจึงเป็นฟ้องซ้อน ศาลต้องไม่รับฟ้อง/จำหน่ายคดี</p>`},

  {src:"ภาคปกติ 2566 ข้อ 2",
   tag:"วินิจฉัยเบื้องต้นข้อกฎหมาย ม.24 — ปัญหาดำเนินกระบวนพิจารณาซ้ำเป็นข้อกฎหมายความสงบเรียบร้อยฯ ยื่นขอชี้ขาดได้แม้ไม่ได้ให้การไว้",
   q:`โจทก์ฟ้องขอให้พิพากษาว่าสัญญาขายฝากเป็นนิติกรรมอำพรางและเป็นโมฆะ จำเลยให้การปฏิเสธ · ก่อนสืบพยาน จำเลยยื่นคำร้องขอให้ศาล<b>ชี้ขาดเบื้องต้นข้อกฎหมาย</b>ว่าคดีนี้เป็นการดำเนินกระบวนพิจารณาซ้ำ (คดีก่อนศาลชั้นต้น+อุทธรณ์วินิจฉัยแล้วว่าไม่เป็นนิติกรรมอำพราง คดีอยู่ชั้นฎีกา) ศาลยกฟ้อง · โจทก์อุทธรณ์ว่าจำเลยไม่ได้ให้การเรื่องนี้ไว้ จึงยื่นขอชี้ขาดไม่ได้ เป็นเรื่องนอกประเด็น — ฟังขึ้นหรือไม่`,
   ans:`<p><b>อุทธรณ์ของโจทก์ฟังไม่ขึ้น</b></p>
   <p>ปัญหาเรื่องดำเนินกระบวนพิจารณาซ้ำ (รวมทั้งฟ้องซ้อน/ฟ้องซ้ำ) เป็น<b>ปัญหาข้อกฎหมายอันเกี่ยวด้วยความสงบเรียบร้อยของประชาชน</b> ซึ่งศาลหยิบยกเองได้ และคู่ความยื่นคำร้องขอให้ศาล<b>วินิจฉัยเบื้องต้นในปัญหาข้อกฎหมาย</b>ตาม <b>ม.24</b> ได้ตลอดเวลา แม้จำเลยจะไม่ได้ยกข้อนี้ไว้ในคำให้การ ก็ยื่นขอได้ ไม่เป็นเรื่องนอกประเด็น (แนว <b>ฎ.7609/2550</b>)</p>`},

  {src:"ลำปาง 60 ข้อ 2",
   tag:"วินิจฉัยเบื้องต้นข้อกฎหมาย ม.24 — เป็นดุลพินิจศาล + ต้องเป็น \"ปัญหาข้อกฎหมาย\" ไม่ใช่ข้อเท็จจริง",
   q:`ศาลตั้งผู้ร้องเป็นผู้จัดการมรดกโดยพินัยกรรม ผู้คัดค้าน (ภริยา/มารดาผู้ร้อง) ยื่นขอถอนและอ้างว่าพินัยกรรมปลอม · ผู้ร้องยื่นขอให้ศาล<b>ชี้ขาดเบื้องต้นข้อกฎหมาย</b>ว่าผู้คัดค้านถูกกำจัดจากกองมรดกฐานปิดบัง/ยักยอกทรัพย์มรดกตาม ป.พ.พ. ม.1605 ศาลสั่ง<b>ให้รอวินิจฉัยชั้นตัดสิน + สืบพยานต่อไป</b> ต่อมาถอนผู้ร้องจากผู้จัดการมรดก · ผู้ร้องอุทธรณ์ว่าศาลต้องชี้ขาดข้อกฎหมายก่อนตาม ม.24 — ฟังขึ้นหรือไม่`,
   ans:`<p><b>อุทธรณ์ของผู้ร้องฟังไม่ขึ้น</b></p>
   <p><b>ม.24</b> ให้อำนาจศาล<b>ใช้ดุลพินิจ</b> ("เมื่อศาลเห็นสมควร") ไม่ได้บังคับให้ต้องชี้ขาดเบื้องต้นทุกครั้งที่คู่ความขอ และปัญหาที่ขอต้องเป็น <b>"ปัญหาข้อกฎหมาย"</b> เท่านั้น · การจะวินิจฉัยว่าผู้คัดค้านปิดบัง/ยักยอกทรัพย์มรดกจริงหรือไม่ตาม ม.1605 เป็น <b>"ปัญหาข้อเท็จจริง"</b> ที่ต้องสืบพยานก่อน ศาลจึงสั่งให้รอไว้วินิจฉัยชั้นตัดสันและสืบพยานต่อไปได้โดยชอบ</p>`}
];

EXAM_BANK[14] = [
  {src:"ภาคปกติ 2566 ข้อ 4",
   tag:"คดีมโนสาเร่ ม.193ทวิ ว.2 + ม.198ทวิ ว.3 — หนี้ละเมิด = ไม่แน่นอน ต้องสืบพยานฝ่ายเดียว จะสั่งส่งเอกสารแทนไม่ได้",
   q:`โจทก์ฟ้องมารดาเด็กชายสายฟ้าที่ขับจักรยานยนต์ชนรถยนต์โจทก์เสียหาย ค่าซ่อม 80,000 บาท (คดีมโนสาเร่) · นัดแรกจำเลยขอเลื่อนเพื่อรวบรวมเงิน · นัดต่อมาโจทก์มา จำเลยไม่มา ไม่ยื่นคำให้การ · ศาลสั่งให้โจทก์<b>ส่งหนังสือประเมินค่าซ่อมเป็นพยานเอกสารแทนการสืบพยาน</b> ถือว่าจำเลยขาดนัดยื่นคำให้การ แล้วพิพากษาให้จำเลยชำระตามฟ้องในวันเดียวกัน — กระบวนพิจารณาชอบหรือไม่`,
   ans:`<p><b>ไม่ชอบด้วยกฎหมาย</b></p>
   <p>คดีมโนสาเร่ เมื่อจำเลยไม่มาศาลในวันนัดพิจารณาและไม่ยื่นคำให้การ ให้ถือว่า<b>ขาดนัดยื่นคำให้การ</b> และนำ <b>ม.198ทวิ</b> มาใช้โดยอนุโลม (ม.193ทวิ ว.2) · ม.198ทวิ วรรคสาม แยก 2 กรณี — (1) หนี้เงินจำนวนแน่นอน (เช่น หนี้ตามสัญญากู้) ศาลสั่งให้ส่งพยานเอกสารแทนการสืบพยานได้ (2) หนี้เงินที่ไม่อาจกำหนดจำนวนได้แน่นอน ศาลต้อง<b>สืบพยานหลักฐานโจทก์ไปฝ่ายเดียว</b></p>
   <p>ค่าเสียหายในมูล<b>ละเมิด</b>เป็นหนี้ที่ศาลต้องใช้ดุลพินิจกำหนดตามพฤติการณ์ จึงเป็น<b>หนี้ที่ไม่อาจกำหนดจำนวนได้แน่นอน</b> แม้โจทก์ระบุ 80,000 บาทมาก็ตาม ศาลต้องสืบพยานโจทก์ฝ่ายเดียว จะสั่งให้ส่งเอกสารแทนแล้วพิพากษาเลยไม่ได้</p>`}
];

EXAM_BANK[15] = [
  {src:"แก้ตัว 63 Online ข้อ 3",
   tag:"การส่งคำคู่ความ ม.79 — ปิดหมายไว้ที่โต๊ะ รปภ. ชั้นล่าง (สำนักงานจำเลยอยู่ชั้น 6) = ไม่ชอบ → กระบวนพิจารณาเสียทั้งหมด",
   q:`โจทก์ฟ้องบังคับตามเช็ค 2,000,123 บาท จำเลยขาดนัดยื่นคำให้การ ศาลพิจารณาฝ่ายเดียวแล้วพิพากษาให้จำเลยชำระ · จำเลยขอพิจารณาคดีใหม่ อ้างว่า<b>การส่งหมายด้วยวิธีปิดหมายไม่ชอบ</b> เพราะเจ้าพนักงานศาลเพียง<b>วางหมายไว้ที่โต๊ะเจ้าหน้าที่รักษาความปลอดภัยชั้นล่างของอาคาร</b> ทั้งที่สำนักงานจำเลยอยู่ชั้น 6 · ไต่สวนได้ความตามที่จำเลยอ้างโดยไม่มีการโต้แย้ง — ศาลอุทธรณ์จะพิพากษาอย่างไร`,
   ans:`<p>การส่งหมายด้วยวิธีปิดหมายตาม <b>ม.79 วรรคหนึ่ง</b> ต้องปิดไว้ในที่แลเห็นได้ง่าย <b>ณ ภูมิลำเนาหรือสำนักทำการงานของจำเลย</b> · การวางหมายไว้ที่โต๊ะ รปภ. ชั้นล่าง ทั้งที่สำนักงานจำเลยอยู่ชั้น 6 <b>ถือไม่ได้ว่าเป็นการปิดหมาย ณ สำนักทำการงานของจำเลย</b> การส่งจึง<b>ไม่ชอบด้วยกฎหมาย</b></p>
   <p>เมื่อการส่งไม่ชอบ ต้องถือว่าศาลชั้นต้นยังไม่ได้ส่งหมายเรียก+สำเนาคำฟ้อง กระบวนพิจารณาตั้งแต่นั้น (สั่งว่าขาดนัดยื่นคำให้การ พิจารณาฝ่ายเดียว คำพิพากษา) <b>ไม่ชอบและไม่มีผลตามกฎหมาย</b> เป็นปัญหาความสงบเรียบร้อยฯ · <b>ศาลอุทธรณ์ต้องพิพากษายกคำพิพากษาศาลชั้นต้น ให้เริ่มดำเนินกระบวนพิจารณาใหม่</b> โดยส่งหมายให้ถูกต้อง (แนว <b>ฎ.2629/2562</b>)</p>`}
];

EXAM_BANK[5].push(
  {src:"แก้ตัว 65 ข้อ 2",
   tag:"เพิกถอนกระบวนพิจารณาที่ผิดระเบียบ ม.27 — ต้องยื่นก่อนมีคำพิพากษา + ไม่ให้สัตยาบัน",
   q:`ศาลจังหวัดสมุทรปราการสั่ง (1 มิ.ย. 64) ว่าคดีอยู่ในอำนาจศาลภาษีอากรกลาง เพิกถอนกระบวนพิจารณาแล้วส่งสำนวนไป · ประธานศาลฎีกาวินิจฉัยว่าไม่อยู่ในอำนาจศาลภาษีฯ ส่งสำนวนคืน · ศาลจังหวัดสมุทรปราการพิจารณาต่อ<b>โดยไม่ได้สั่งเพิกถอนคำสั่งเดิม</b> แล้วพิพากษาให้จำเลยชำระหนี้ จำเลยอุทธรณ์–ฎีกา ศาลฎีกาไม่รับฎีกา (คดีถึงที่สุด) · 1 เดือนต่อมาจำเลยยื่นคำร้องขอให้พิจารณาคดีใหม่ อ้างว่าเป็นกระบวนพิจารณาที่ผิดระเบียบ — ศาลจะสั่งอย่างไร`,
   ans:`<p><b>สั่งยกคำร้อง</b> — ตาม <b>ม.27</b> คำร้องขอให้เพิกถอนกระบวนพิจารณาที่ผิดระเบียบต้องยื่น <b>"ก่อนมีคำพิพากษา"</b> และไม่ช้ากว่า 8 วันนับแต่ทราบเหตุ และต้อง<b>ไม่มีการดำเนินการใดขึ้นใหม่</b>อันเป็นการให้สัตยาบัน</p>
   <p>คดีนี้ศาลชั้นต้นพิพากษาไปแล้ว จำเลยยังใช้สิทธิอุทธรณ์–ฎีกาจนคดีถึงที่สุด ถือว่าจำเลย<b>ให้สัตยาบัน</b>แก่กระบวนพิจารณาที่อ้างว่าผิดระเบียบไปแล้ว จึงมายื่นคำร้องขอเพิกถอนภายหลังคำพิพากษาไม่ได้</p>`}
);

EXAM_BANK[6] = [
  {src:"แก้ตัว 67 ข้อ 3",
   tag:"ฟ้องเคลือบคลุม ม.172 ว.2 (พินัยกรรมปลอม + ถูกฉ้อฉล/เมาสุรา ขัดกันเอง) · คู่ความร่วม ม.59(1) หนี้แบ่งแยกไม่ได้",
   q:`นางกรุณาฟ้องนายดำ/นายขาว/นางสาวเขียว ขอ<b>เพิกถอนพินัยกรรม</b>ที่ยกทรัพย์มรดกให้ทั้งสาม บรรยายว่าพินัยกรรม<b>ปลอม</b> และว่าเจ้ามรดกลงชื่อเพราะ<b>ถูกฉ้อฉล/ทำขณะเมาสุรา</b> · นายดำสู้ว่าพินัยกรรมแท้ · นายขาวขาดนัดยื่นคำให้การ · นางสาวเขียวสู้ว่าฟ้องเคลือบคลุม · ศาลชั้นต้นพิพากษาว่าฟ้องเคลือบคลุม ยกฟ้องจำเลยทั้งสาม — ตัดสินถูกหรือไม่ และยกฟ้องทั้งสามคนพร้อมกันถูกหรือไม่`,
   ans:`<p><b>ตัดสินว่าฟ้องเคลือบคลุม — ถูกต้อง</b> — คำฟ้องอ้างว่าพินัยกรรม "ปลอม" (เจ้ามรดกไม่ได้ทำเลย) กับ "ถูกฉ้อฉล/เมาสุรา" (เจ้ามรดกทำจริงแต่เจตนาบกพร่อง) เป็นข้อเท็จจริงที่<b>ขัดกันเองอย่างเด็ดขาด</b> จำเลยไม่อาจเข้าใจได้ว่าโจทก์อ้างเหตุใดเป็นหลัก ไม่แสดงแจ้งชัดซึ่งสภาพแห่งข้อหาตาม <b>ม.172 วรรคสอง</b> (แนว <b>ฎ.651/2498</b>)</p>
   <p><b>ยกฟ้องจำเลยทั้งสามพร้อมกัน — ถูกต้อง</b> — จำเลยทั้งสามเป็นผู้รับทรัพย์ตามพินัยกรรมฉบับเดียวกัน มูลความแห่งคดีเป็น<b>การชำระหนี้ซึ่งแบ่งแยกจากกันมิได้</b> ตาม <b>ม.59(1)</b> การที่นางสาวเขียวยกข้อต่อสู้เรื่องฟ้องเคลือบคลุมและศาลรับฟัง เป็นกระบวนพิจารณาที่เป็นคุณ จึงมีผลถึงนายดำและนายขาว (รวมทั้งคนที่ขาดนัด) ด้วย (แนว <b>ฎ.443/2511</b>)</p>`},

  {src:"2/66 ภาคปกติ ข้อ 2",
   tag:"ฟ้องเคลือบคลุม ม.172 ว.2 — อ้างข้อกฎหมาย 2 ทาง (ทางจำเป็น/ภาระจำยอม) ไม่ทำให้ฟ้องเคลือบคลุม",
   q:`นายดำฟ้องขอให้นายขาว<b>รื้อดินออกจากลำรางร่องเหมือง</b>ที่ไถกลบจนน้ำท่วมที่นา บรรยายว่าน้ำระบายผ่านลำรางในที่ดินนายขาวมาหลายสิบปี จึงเป็น<b>ทางจำเป็นหรือทางภาระจำยอม</b> · นายขาวสู้ว่าฟ้องเคลือบคลุม และเมื่อไม่ใช่กฎหมายตามที่โจทก์อ้าง ศาลบังคับให้ไม่ได้ — เป็นฟ้องเคลือบคลุมหรือไม่ ศาลวินิจฉัยอย่างไร`,
   ans:`<p><b>ไม่เป็นฟ้องเคลือบคลุม</b> — โจทก์บรรยาย<b>ข้อเท็จจริง</b> (สภาพที่ดิน ความเป็นมา การใช้ลำราง การกลบดิน ความเสียหาย) ครบถ้วนชัดเจนไม่ขัดกันเอง จำเลยเข้าใจและต่อสู้คดีได้</p>
   <p>การอ้างผลทางกฎหมายทั้ง "ทางจำเป็น" และ "ภาระจำยอม" ไม่ใช่ข้อเท็จจริงที่ขัดกัน (ต่างจากพินัยกรรมปลอม/ถูกฉ้อฉล) · <b>หน้าที่ชี้ขาดผลทางกฎหมายเป็นของศาล</b> ไม่ใช่โจทก์ต้องเลือกทางใดทางหนึ่งให้ถูก · ศาลจึง<b>ยกข้อต่อสู้ของจำเลย</b> สืบพยานต่อไป หากข้อเท็จจริงฟังได้ตามฟ้อง ศาลนำตัวบทที่ถูกต้องมาปรับและบังคับให้รื้อดินได้ (แนว <b>ฎ.3161/2533</b>)</p>`},

  {src:"2/66 ภาคปกติ ข้อ 3",
   tag:"คู่ความร่วม ม.59 — ค่าเสียหายเฉพาะตัวแยกได้ เลื่อนคดีแทนกันไม่ได้ · คำรับสารภาพจำเลยที่ 1 เป็นผลร้าย ไม่ผูกพันจำเลยที่ 2",
   q:`นายนที (หัวแตก) + นายทอง (แขนหัก) ร่วมกันฟ้องนายสุขคนขับ (จำเลยที่ 1) + นายแก้วนายจ้าง (จำเลยที่ 2) ฐานละเมิด · วันสืบพยาน นายนทีขอเลื่อนคดี (ป่วยโควิด) ศาล<b>อนุญาตและให้มีผลถึงนายทองด้วย</b> · นัดใหม่ นายสุขกลับคำให้การ<b>รับสารภาพว่าประมาทจริง</b> โจทก์พอใจ งดสืบพยานเพิ่ม · ศาลพิพากษาให้นายสุขชดใช้ แต่<b>ยกฟ้องนายแก้ว</b> เพราะฟังไม่ได้ว่าจำเลยที่ 1 ประมาท — คำสั่งเลื่อนคดีทั้งคดีถูกหรือไม่ / ยกฟ้องนายแก้วถูกหรือไม่`,
   ans:`<p><b>คำสั่งให้เลื่อนคดีมีผลถึงนายทอง — ไม่ถูกต้อง</b> — ค่าเสียหายจากการบาดเจ็บของโจทก์แต่ละคนเป็น<b>สิทธิเฉพาะตัวที่แยกจากกันได้</b> มูลความแห่งคดีมิใช่การชำระหนี้ซึ่งแบ่งแยกไม่ได้ โจทก์ร่วมจึง<b>ไม่ถือว่าทำแทนกัน</b> ตามข้อยกเว้น ม.59 วรรคสอง การเลื่อนคดีของนายนทีไม่มีผลถึงนายทอง</p>
   <p><b>ยกฟ้องนายแก้ว — ถูกต้อง</b> — คำรับสารภาพของนายสุข (จำเลยที่ 1) เป็นกระบวนพิจารณาที่<b>เป็นผลร้าย/เสื่อมเสีย</b>แก่นายแก้ว (จำเลยที่ 2) จึง<b>ไม่ผูกพัน</b>นายแก้วตาม <b>ม.59(1)</b> โจทก์ยังมีภาระพิสูจน์ว่านายสุขประมาทเพื่อให้นายจ้างร่วมรับผิด เมื่อโจทก์งดสืบพยาน ไม่มีหลักฐานยันนายแก้วได้ ศาลยกฟ้องนายแก้วชอบแล้ว (แนว <b>ฎ.382/2506</b>)</p>`}
];

EXAM_BANK[9] = [
  {src:"2/66 ภาคปกติ ข้อ 5",
   tag:"ส่งหมายทางไปรษณีย์ลงทะเบียนตอบรับ ม.73ทวิ = เสมือนพนักงานศาลส่งวิธีธรรมดา (ไม่ใช่ ม.79 ที่ต้องรอ 15 วัน) · ม.228(3) อุทธรณ์คำสั่งไม่รับคำให้การได้ทันที",
   q:`ศาลสั่งส่งหมายเรียก+สำเนาคำฟ้องให้นายดำ<b>ทางไปรษณีย์ลงทะเบียนตอบรับ</b> ส่งวันจันทร์ 1 เม.ย. 67 ไม่มีผู้รับ ออกใบแจ้ง นายดำไปรับที่ไปรษณีย์วันศุกร์ 5 เม.ย. 67 · นายดำยื่นคำให้การวันจันทร์ 22 เม.ย. 67 ศาล<b>ไม่รับ</b> อ้างว่าเกิน 15 วันนับแต่วันส่งไปรษณีย์ · นายดำอุทธรณ์คำสั่งไม่รับคำให้การ ศาลสั่งจำหน่ายคดี (โจทก์ไม่ยื่นขอชนะคดีขาดนัด) และ<b>ไม่รับอุทธรณ์</b> อ้างว่าเป็นคำสั่งระหว่างพิจารณา — คำสั่งไม่รับคำให้การ / ไม่รับอุทธรณ์ ถูกต้องหรือไม่`,
   ans:`<p><b>คำสั่งไม่รับคำให้การ — ไม่ถูกต้อง</b> — การส่งทางไปรษณีย์ลงทะเบียนตอบรับตาม <b>ม.73ทวิ</b> มีผล<b>เสมือนพนักงานศาลส่งตามวิธีธรรมดา</b> ไม่ใช่การส่งโดยวิธีอื่นตาม ม.79 ที่ต้องรอพ้น 15 วัน · เมื่อนายดำได้รับจริงวันศุกร์ 5 เม.ย. 67 กำหนดยื่นคำให้การ 15 วันครบวันเสาร์ 20 เม.ย. (วันหยุด) เลื่อนเป็นวันจันทร์ 22 เม.ย. 67 นายดำยื่นวันนั้นจึง<b>ในกำหนด</b> (แนว <b>ฎ.4293/2547</b>)</p>
   <p><b>คำสั่งไม่รับอุทธรณ์ — ไม่ถูกต้อง</b> — คำสั่งไม่รับคำให้การเป็นคำสั่ง<b>ไม่รับคำคู่ความตาม ม.18</b> ซึ่งไม่ทำให้คดีเสร็จไปทั้งเรื่อง เข้าข้อยกเว้น <b>ม.228(3)</b> ไม่ใช่คำสั่งระหว่างพิจารณา นายดำ<b>อุทธรณ์ได้ทันทีภายใน 1 เดือน โดยไม่ต้องโต้แย้งไว้ก่อน</b> · อีกทั้งเมื่อนายดำยื่นคำให้การโดยชอบ นายดำไม่ขาดนัดยื่นคำให้การ โจทก์ไม่ต้องยื่นขอตาม ม.198 การจำหน่ายคดีจึงมาจากความผิดพลาดแต่ต้น อุทธรณ์ยังเป็นสาระแก่คดี (แนว <b>ฎ.15019/2551</b>)</p>`}
];

EXAM_BANK[10].push(
  {src:"ภาคปกติ 64 ข้อ 2 (ก)(ข)(ค)",
   tag:"แก้ไขคำฟ้อง ม.179 — เปลี่ยนชื่อจำเลยจากนิติบุคคลเป็นบุคคลธรรมดา = เปลี่ยนตัวคู่ความ ทำไม่ได้ · ฟ้องแย้งละเมิดจากการฟ้อง = ไม่เกี่ยวฟ้องเดิม · แก้คำให้การของจำเลยอื่นไม่ได้",
   q:`โจทก์ฟ้องจำเลยที่ 1 (คนขับ) + จำเลยที่ 2 "บริษัทสายทอง จำกัด" (นายจ้าง) ส่งหมายจำเลยที่ 2 ไม่ได้ · โจทก์ขอ<b>แก้ไขคำฟ้องเปลี่ยนชื่อจำเลยที่ 2 เป็น "นายโชค เจริญดี"</b> (บุคคลธรรมดา) ศาลอนุญาต · นายโชคยื่นคำให้การและ<b>ฟ้องแย้งเรียกค่าเสียหายจากการถูกโจทก์ฟ้องโดยไม่สุจริต</b> 100,000 บาท และยัง<b>ขอแก้คำให้การของจำเลยที่ 1</b> ด้วย — (ก) อนุญาตแก้ฟ้องชอบหรือไม่ (ข) รับฟ้องแย้งหรือไม่ (ค) แก้คำให้การของจำเลยที่ 1 ได้หรือไม่`,
   ans:`<p><b>(ก) ไม่ชอบ</b> — การเปลี่ยนชื่อจำเลยจากนิติบุคคลเป็นบุคคลธรรมดามีผลเป็นการ<b>เปลี่ยนตัวคู่ความ</b> ไม่ใช่แก้ข้อผิดหลงเล็กน้อย ทำโดยขอแก้ไขคำฟ้องไม่ได้ ต้องถอนฟ้องจำเลยเดิมแล้วฟ้องนายโชคเป็นคดีใหม่ (แนว <b>ฎ.3844/2535</b>)</p>
   <p><b>(ข) ไม่รับฟ้องแย้ง</b> — ค่าเสียหายจากการที่โจทก์ฟ้องคดีโดยไม่สุจริตเป็น<b>ละเมิดที่เพิ่งเกิดจากการดำเนินคดี</b> คนละเรื่อง คนละมูลเหตุ ใช้พยานหลักฐานคนละชุดกับฟ้องเดิม (มูลรถชน) จึงไม่เกี่ยวกับฟ้องเดิมตาม <b>ม.177 วรรคสาม / ม.179</b> (แนว <b>ฎ.3903/2535</b>) ให้ไปฟ้องเป็นคดีต่างหาก</p>
   <p><b>(ค) ไม่อนุญาต</b> — คำให้การเป็นสิทธิและข้อต่อสู้เฉพาะตัว จำเลยที่ 2 ไม่มีอำนาจยื่นคำร้องขอแก้ "คำให้การของจำเลยที่ 1" แม้โจทก์และจำเลยที่ 1 ไม่คัดค้าน จำเลยที่ 1 ต้องเป็นผู้ยื่นขอแก้ด้วยตนเอง</p>`}
);

EXAM_BANK[15].push(
  {src:"แก้ตัว 63 Online ข้อ 4",
   tag:"ขาดนัดยื่นคำให้การ vs ขาดนัดพิจารณา — จำเลยที่ขาดนัดยื่นคำให้การ (ม.199ทวิ) ห้ามนำพยานเข้าสืบเด็ดขาด แม้ลบล้างขาดนัดพิจารณาได้ (ม.206 ว.3)",
   q:`โจทก์ฟ้องจำเลยทั้งสองร่วมกันหลอกลวงเงิน 500,000 บาท · จำเลยที่ 1 ให้การสู้คดี · จำเลยที่ 2 <b>ขาดนัดยื่นคำให้การ</b> · วันสืบพยานโจทก์ จำเลยทั้งสองไม่มา ศาลสั่งว่า<b>ขาดนัดพิจารณา</b> สืบพยานโจทก์ฝ่ายเดียว · นัดต่อมาโจทก์ไม่มา จำเลยทั้งสองมาศาลแจ้งว่าติด<b>กักกันโรค</b> พร้อมนำพยานมาสืบ ศาลถือว่าโจทก์ไม่ติดใจสืบต่อ และให้จำเลยทั้งสองสืบพยาน แล้วยกฟ้อง · โจทก์อุทธรณ์ว่าศาลฟังพยานจำเลยไม่ได้ — ฟังขึ้นหรือไม่`,
   ans:`<p><b>ฟังขึ้นบางส่วน</b> (ต้องแยกจำเลยที่ 1 กับที่ 2)</p>
   <p><b>จำเลยที่ 1 (ยื่นคำให้การแล้ว):</b> ขาดนัดพิจารณาเพราะกักกันโรค = <b>ไม่จงใจ/มีเหตุอันสมควร</b> ตาม <b>ม.206 วรรคสาม</b> ศาลให้พิจารณาคดีใหม่และให้จำเลยที่ 1 นำพยานเข้าสืบตามคำให้การได้ → การรับฟังพยานจำเลยที่ 1 ชอบแล้ว อุทธรณ์<b>ฟังไม่ขึ้น</b></p>
   <p><b>จำเลยที่ 2 (ขาดนัดยื่นคำให้การ):</b> ตาม <b>ม.199ทวิ</b> <b>ห้ามศาลยอมให้จำเลยที่ขาดนัดยื่นคำให้การนำพยานเข้าสืบ</b> เด็ดขาด แม้เหตุกักกันโรคจะลบล้าง "การขาดนัดพิจารณา" ได้ แต่ผลของ "การขาดนัดยื่นคำให้การ" ยังคงอยู่ ศาลให้จำเลยที่ 2 สืบพยานไม่ได้ อุทธรณ์<b>ฟังขึ้น</b> (แนว <b>ฎ.1326/2565</b>)</p>
   <p><b>หมายเหตุ:</b> โจทก์ที่ไม่มาในนัดต่อมาไม่ขาดนัดพิจารณา (มาศาลนัดแรกแล้ว) เป็นเพียงสละสิทธินำสืบในนัดนั้นตาม ม.200 วรรคสอง</p>`}
);

EXAM_BANK[16] = [
  {src:"ลำปาง 60 ข้อ 3",
   tag:"ขาดนัดพิจารณา ม.202 — โจทก์ไม่มา จำเลยขอให้พิจารณาต่อ → สืบพยานจำเลยฝ่ายเดียว (ไม่จำหน่ายคดี) · ทางแก้โจทก์ = ขอพิจารณาคดีใหม่ ม.207",
   q:`โจทก์ฟ้องเรียกค่าสินไหมทดแทน 300,000 บาท กำหนดวันนัดพิจารณาโดยชอบแล้ว วันนัด<b>มีแต่จำเลยมาศาล โจทก์ไม่มา</b> จำเลยยื่นคำให้การและ<b>ขอให้ดำเนินการพิจารณาคดีต่อไป</b> — ถ้าเป็นศาลชั้นต้นจะสั่งอย่างไร และโจทก์ที่ไม่มาศาลมีทางแก้อย่างไร`,
   ans:`<p>โจทก์ไม่มาศาลในวันนัดพิจารณา = <b>ขาดนัดพิจารณา</b> ตาม <b>ม.202</b> โดยหลักศาลต้องสั่ง<b>จำหน่ายคดี</b> เว้นแต่<b>จำเลยแจ้งขอให้ดำเนินการพิจารณาต่อไป</b></p>
   <p>เมื่อจำเลยขอให้พิจารณาต่อ ศาลต้อง<b>พิจารณาและชี้ขาดตัดสินคดีไปฝ่ายเดียว (สืบพยานจำเลยฝ่ายเดียว)</b> จะสั่งจำหน่ายคดีไม่ได้</p>
   <p><b>ทางแก้ของโจทก์:</b> เมื่อศาลพิพากษาให้โจทก์แพ้คดีโดยขาดนัดพิจารณา โจทก์<b>ยื่นคำขอให้พิจารณาคดีใหม่</b>ได้ตาม <b>ม.207</b> (ภายใน 15 วันนับแต่วันส่งคำบังคับ) หรือใช้สิทธิอุทธรณ์คำพิพากษาตามหลักทั่วไป</p>`},

  {src:"ลำปาง ปลายภาค 65 ข้อ 3",
   tag:"ขาดนัดพิจารณา ม.200 — \"วันนัดสืบพยาน\" = วันนัดสืบพยานครั้งแรก มาแล้วไม่ขาดนัด ไม่มีสิทธิขอพิจารณาคดีใหม่",
   q:`ชี้สองสถานกำหนดสืบพยานโจทก์ 27 เม.ย. 66 และสืบพยานจำเลย 28 เม.ย. 66 · 27 เม.ย. โจทก์+จำเลยมาศาล สืบพยานโจทก์ · <b>28 เม.ย. จำเลยไม่มา</b> ศาลถือว่าจำเลยไม่ติดใจสืบพยาน แล้วพิพากษาให้จำเลยรับผิด 1,000,000 บาท — จำเลยจะขอให้พิจารณาคดีใหม่ได้หรือไม่`,
   ans:`<p><b>ขอให้พิจารณาคดีใหม่ไม่ได้</b></p>
   <p>คำว่า "วันนัดสืบพยาน" ตาม <b>ม.200</b> หมายถึง <b>"วันนัดสืบพยานครั้งแรก"</b> ของคดี ไม่ว่าจะเป็นนัดของฝ่ายโจทก์หรือจำเลย · วันนัดสืบพยานครั้งแรกคือ 27 เม.ย. 66 ซึ่งจำเลยมาศาล จำเลยจึง<b>ไม่ขาดนัดพิจารณา</b> · การที่จำเลยไม่มาในวันที่ 28 เม.ย. (นัดสืบพยานจำเลย) เป็นเพียง<b>สละสิทธินำสืบพยานของตน</b> ไม่ทำให้จำเลยกลับเป็นผู้ขาดนัดพิจารณา</p>
   <p>เมื่อจำเลยไม่ใช่ผู้แพ้คดีโดยขาดนัดพิจารณา จึงใช้สิทธิตาม <b>ม.207</b> ไม่ได้ ต้องใช้วิธี<b>อุทธรณ์</b>เท่านั้น (แนว <b>ฎ.4683/2552</b>)</p>`},

  {src:"แก้ตัว 64 ข้อ 4",
   tag:"คู่ความไม่มาศาลทั้งสองฝ่ายในวันนัด (คดีมโนสาเร่) = ขาดนัดพิจารณาทั้งคู่ → ม.201 ต้องจำหน่ายคดี ไม่ใช่ยกฟ้องตาม ม.198ทวิ ว.5",
   q:`คดีเงินกู้ 500,000 บาท ศาลรับเป็นคดีไม่มีข้อยุ่งยาก พิจารณาอย่างคดีมโนสาเร่ นัดพิจารณา 22 ก.ค. 65 (ไกล่เกลี่ย/ให้การ/สืบพยานโจทก์) · <b>ไม่มีคู่ความมาศาลเลย</b> · ศาลสั่งว่าโจทก์ไม่นำพยานมาสืบ ถือว่าคดีไม่มีมูล <b>ยกฟ้องโจทก์ตาม ม.198ทวิ วรรคห้า</b> — ชอบด้วยกฎหมายหรือไม่`,
   ans:`<p><b>ไม่ชอบด้วยประมวลกฎหมายวิธีพิจารณาความแพ่ง</b></p>
   <p>วันนัดพิจารณาที่ให้ไกล่เกลี่ย/ให้การ/สืบพยานโจทก์ในวันเดียว ถือเป็น <b>"วันนัดสืบพยาน"</b> ด้วย · เมื่อ<b>ไม่มีคู่ความมาศาลทั้งสองฝ่าย</b>และไม่ได้รับอนุญาตให้เลื่อนคดี ถือว่า<b>ขาดนัดพิจารณาทั้งสองฝ่าย</b>ตาม ม.200 · ผลตาม <b>ม.201</b> ศาลมีอำนาจเพียง<b>สั่งจำหน่ายคดีออกจากสารบบความ</b>เท่านั้น</p>
   <p>การนำ <b>ม.198ทวิ วรรคห้า</b> (เรื่องขาดนัดยื่นคำให้การ ที่ใช้เมื่อโจทก์มาศาลแต่ไม่นำสืบ) มาใช้กับกรณีไม่มีใครมาศาลทั้งสองฝ่าย เป็นการปรับบทผิดกรณี ศาลต้องสั่งจำหน่ายคดีตาม ม.201</p>`}
];

EXAM_BANK[18] = [
  {src:"แก้ตัว 64 ข้อ 5 · ภาคปกติ 64 ข้อ 5 · ลำปาง ปลายภาค 65 ข้อ 4 (ทฤษฎี ม.224)",
   tag:"อุทธรณ์ปัญหาข้อเท็จจริง ม.224 — คิด \"ทุนทรัพย์ที่พิพาทกันในชั้นอุทธรณ์\" แยกรายคู่ความ เอาคำพิพากษาศาลชั้นต้นเป็นตัวตั้ง + ข้อยกเว้น",
   q:`จงอธิบายหลักการอุทธรณ์คำพิพากษาศาลชั้นต้นในปัญหาข้อเท็จจริง (ป.วิ.พ. ม.224) พร้อมตัวอย่าง · และกรณี โจทก์ฟ้อง 100,000 บาท ศาลพิพากษาให้ 40,000 บาท → โจทก์อุทธรณ์ขอเต็มจำนวน / จำเลยอุทธรณ์ขอยกฟ้อง อุทธรณ์ได้หรือไม่`,
   ans:`<p><b>หลักทั่วไป (ม.224 ว.1):</b> ห้ามอุทธรณ์ในข้อเท็จจริง ถ้า <b>"ทุนทรัพย์ที่พิพาทกันในชั้นอุทธรณ์" ไม่เกิน 50,000 บาท</b> — ต้องดูทุนทรัพย์<b>ชั้นอุทธรณ์</b> (ไม่ใช่ตอนฟ้อง) และ<b>คิดแยกรายคู่ความ</b> โดยเอาคำพิพากษาศาลชั้นต้นเป็นตัวตั้ง (เขียนตอบต้องมีคำว่า "ที่พิพาทกันในชั้นอุทธรณ์" เสมอ)</p>
   <p><b>ตัวอย่างตามโจทย์</b> (ฟ้อง 100,000 ศาลให้ 40,000): โจทก์อุทธรณ์ขอส่วนต่าง 60,000 บาท → <b>เกิน 50,000 อุทธรณ์ข้อเท็จจริงได้</b> · จำเลยอุทธรณ์ขอยกฟ้อง (จาก 40,000 → 0) ทุนทรัพย์ชั้นอุทธรณ์ = 40,000 บาท → <b>ไม่เกิน 50,000 ต้องห้ามอุทธรณ์ข้อเท็จจริง</b> · เทียบกรณีจำเลยที่ 2 ถูกยกฟ้องในศาลชั้นต้น โจทก์อุทธรณ์ขอให้รับผิด 215,000 บาท → ทุนทรัพย์ชั้นอุทธรณ์ = 215,000 อุทธรณ์ได้</p>
   <p><b>ข้อยกเว้นที่ 1 (ม.224 ว.1 ตอนท้าย):</b> แม้ทุนทรัพย์ไม่เกิน 50,000 ก็อุทธรณ์ข้อเท็จจริงได้ ถ้า (1) ผู้พิพากษาที่นั่งพิจารณาทำ<b>ความเห็นแย้ง</b> หรือ (2) <b>รับรอง</b>ว่ามีเหตุอันควรอุทธรณ์ หรือ (3) ได้รับ<b>อนุญาตเป็นหนังสือจากอธิบดีผู้พิพากษาศาลชั้นต้น/ภาค</b></p>
   <p><b>ข้อยกเว้นที่ 2 (ม.224 ว.2):</b> คดี<b>เกี่ยวด้วยสิทธิแห่งสภาพบุคคล/สิทธิในครอบครัว</b> และ<b>คดีไม่มีทุนทรัพย์</b> อุทธรณ์ข้อเท็จจริงได้เสมอไม่ต้องดูทุนทรัพย์ — <b>เว้นแต่</b>คดีฟ้องขับไล่ที่ค่าเช่า/อาจให้เช่าได้ขณะฟ้อง<b>ไม่เกินเดือนละ 4,000 บาท</b> ดึงกลับมาต้องห้ามอุทธรณ์ข้อเท็จจริง</p>`},

  {src:"ภาคปกติ 64 ข้อ 4",
   tag:"ม.225 ว.1 — ข้อที่มิได้ยกขึ้นว่ากันมาแล้วโดยชอบในศาลชั้นต้น (เปลี่ยนเหตุแห่งการเรียกร้องในชั้นอุทธรณ์)",
   q:`โจทก์ฟ้องขอเข้ารับส่วนแบ่งที่ดินในฐานะผู้สืบสันดาน อ้างว่าจำเลยที่ 1 <b>สละมรดก</b> (โดยยึดข้อเท็จจริงว่า "ที่ดินเป็นทรัพย์มรดก") ศาลชั้นต้นยกฟ้องว่าไม่ใช่การสละมรดกตามแบบ โจทก์ไม่มีอำนาจฟ้อง · โจทก์<b>อุทธรณ์เปลี่ยนข้ออ้างใหม่</b>ว่า "ที่ดินเป็นของจำเลยที่ 1 ไม่ใช่ทรัพย์มรดก และจำเลยที่ 2–3 หลอกลวงให้โอน" · ศาลอุทธรณ์ไม่รับวินิจฉัย พิพากษายืน — ชอบด้วย ป.วิ.พ. หรือไม่`,
   ans:`<p><b>ชอบด้วยประมวลกฎหมายวิธีพิจารณาความแพ่งแล้ว</b></p>
   <p>ตาม <b>ม.225 วรรคหนึ่ง</b> ข้อที่จะยกขึ้นอุทธรณ์ต้อง (1) <b>กล่าวไว้โดยชัดแจ้งในอุทธรณ์</b> (2) <b>เป็นข้อที่ได้ยกขึ้นว่ากันมาแล้วโดยชอบในศาลชั้นต้น</b> และ (3) <b>เป็นสาระแก่คดีอันควรได้รับการวินิจฉัย</b></p>
   <p>ในศาลชั้นต้นโจทก์ตั้งรูปคดีบนข้อเท็จจริงว่า "ที่ดินเป็นทรัพย์มรดกและจำเลยที่ 1 สละมรดก" แต่ในชั้นอุทธรณ์กลับเปลี่ยนเป็น "ที่ดินไม่ใช่ทรัพย์มรดก + ถูกหลอกลวงให้โอน" ซึ่งเป็นข้อเท็จจริงและเหตุแห่งการเรียกร้องที่<b>ไม่เคยยกขึ้นว่ากันและสืบพยานในศาลชั้นต้น</b> จึงเป็น "ข้อที่มิได้ยกขึ้นว่ากันมาแล้วโดยชอบในศาลชั้นต้น" ต้องห้ามอุทธรณ์ ศาลอุทธรณ์ไม่รับวินิจฉัยชอบแล้ว</p>`}
];

EXAM_BANK[19] = [
  {src:"ลำปาง 60 ข้อ 5(2)",
   tag:"อุทธรณ์คำสั่งระหว่างพิจารณา ม.226 — คำสั่งยกคำร้องขอพิจารณาคดีใหม่ (คดียังไม่เสร็จ) = คำสั่งระหว่างพิจารณา ต้องโต้แย้งไว้ก่อน",

function setReadLec(k){
  if(!LECTURE_READS[k]) return;
  state.readLec = k;
  TTS.stop();
  const nav = document.getElementById('study-nav');
  const panel = document.getElementById('study-panel');
  if(!nav || !panel){ render(); return; }
  nav.querySelectorAll('button').forEach(b=> b.classList.toggle('on', Number(b.dataset.lec)===k));
  panel.innerHTML = renderLecPanel(k);
  ttsInit();
}
function markRead(tKey){
  if(!GS.seenContent) GS.seenContent = {};
  if(!GS.seenContent[tKey]){
    GS.seenContent[tKey] = 1;
    saveScore(GS);
    addScore(100, 'อ่านจบ 📖');
  }
  const btn = document.getElementById('rbtn_'+tKey);
  if(btn){ btn.textContent='✓ อ่านแล้ว'; btn.classList.add('read'); }
  const prog = document.querySelector('.study-progress');
  const n = state.readLec;
  if(prog && tKey.indexOf('L'+n+'_t')===0){
    const reads = lecTopics(LECTURE_READS[n]);
    const readCount = reads.filter((t,ti)=> GS.seenContent && GS.seenContent['L'+n+'_t'+ti]).length;
    prog.textContent = `อ่านแล้ว ${readCount} / ${reads.length} หัวข้อในครั้งนี้`;
  }
}

const CAT_BG_ANGLE = {}; CAT_ORDER.forEach((id,i)=>{ CAT_BG_ANGLE[id] = (i*40)%360; });
function setTheme(catId){
  const cat = CATEGORIES[catId] ? catId : "appeal";
  const c = CATEGORIES[cat].color;
  document.documentElement.style.setProperty('--cat', c);
  const r=parseInt(c.slice(1,3),16), g=parseInt(c.slice(3,5),16), b=parseInt(c.slice(5,7),16);
  document.documentElement.style.setProperty('--cat-pale', `rgba(${r},${g},${b},0.09)`);
  const angle = CAT_BG_ANGLE[cat] || 0;
  const idx = CAT_ORDER.indexOf(cat);
  const posX = 10 + (idx%3)*35;
  const posY = idx%2===0 ? -10 : 90;
  // Light theme: subtle color tint over the page background
  document.body.style.background =
    `radial-gradient(900px 500px at ${posX}% ${posY}%, ${c}14 0%, transparent 55%)`;
}
function shuffle(arr){
  const a=arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function bestScore(key){
  try{ const v = localStorage.getItem('vpk_'+key); return v?JSON.parse(v):null; }catch(e){ return null; }
}
function saveBestScore(key,score,total){
  try{
    const cur = bestScore(key);
    const attempts = (cur? cur.attempts:0) + 1;
    if(!cur || score>cur.score){ localStorage.setItem('vpk_'+key, JSON.stringify({score,total,attempts})); }
    else { localStorage.setItem('vpk_'+key, JSON.stringify({score:cur.score,total,attempts})); }
  }catch(e){}
}

function shuffledIdx(n){
  const arr=[...Array(n).keys()];
  for(let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; }
  if(n>1 && arr.every((v,i)=>v===i)){ [arr[0],arr[1]]=[arr[1],arr[0]]; }
  return arr;
}

      <button class="btn btn-gold" onclick="sndClick();checkOrderB()">ตรวจคำตอบ</button>

function startOrder(i){ state.orderStartTime=Date.now(); state.orderCase=i; state.orderPool=null; state.orderChecked=false; render(); initOrderDndB(); }
function reshuffleOrderB(){ state.orderPool=shuffledIdx(PROCEDURE_ORDER[state.orderCase].steps.length); state.orderChecked=false; render(); initOrderDndB(); }
function nextOrderB(){ state.orderCase=(state.orderCase+1)%PROCEDURE_ORDER.length; state.orderPool=null; state.orderChecked=false; render(); initOrderDndB(); }
function checkOrderB(){
  const items=[...document.querySelectorAll('#orderList .order-item')];
  const order=items.map(it=>Number(it.dataset.idx));
  state.orderPool=order;
  let allCorrect=true;
  items.forEach((it,pos)=>{
    const ok=order[pos]===pos;
    it.classList.remove('correct','wrong');
    it.classList.add(ok?'correct':'wrong');
    if(!ok) allCorrect=false;
  });
  state.orderChecked=true;
  const elapsed = Date.now() - (state.orderStartTime||Date.now());
  if(allCorrect){ state.orderScore++; sndCorrect(); addScore(elapsed<20000?50:5, elapsed<20000?'เรียงได้ไว!':'เรียงถูก'); } else { sndWrong(); }
  const row = document.getElementById('orderBtnRowB');
  row.insertAdjacentHTML('beforeend', allCorrect
    ? `<span style="font-weight:700;color:var(--good);align-self:center;">✓ ถูกต้อง</span>`
    : `<span style="font-weight:700;color:var(--bad);align-self:center;">ยังไม่ถูก ลองใหม่</span>`);
  row.insertAdjacentHTML('beforeend', `<button class="btn btn-dark" onclick="sndClick();nextOrderB()">ชุดถัดไป ›</button>`);
}
function initOrderDndB(){
  const list = document.getElementById('orderList');
  if(!list) return;
  let dragEl = null;
  list.querySelectorAll('.order-item').forEach(item=>{
    item.addEventListener('dragstart', ()=>{ dragEl=item; item.classList.add('dragging'); });
    item.addEventListener('dragend', ()=>{ item.classList.remove('dragging'); renumber(); });
  });
  list.addEventListener('dragover', e=>{
    e.preventDefault();
    const after = getDragAfter(list, e.clientY);
    const dragging = list.querySelector('.dragging');
    if(!dragging) return;
    if(after==null) list.appendChild(dragging);
    else list.insertBefore(dragging, after);
  });
  function getDragAfter(container, y){
    const els = [...container.querySelectorAll('.order-item:not(.dragging)')];
    return els.reduce((closest, child)=>{
      const box = child.getBoundingClientRect();
      const offset = y - box.top - box.height/2;
      if(offset<0 && offset>closest.offset) return {offset, element:child};
      else return closest;
    }, {offset:-Infinity}).element;
  }
  function renumber(){
    list.querySelectorAll('.order-item').forEach((it,pos)=>{
      it.querySelector('.slot').textContent = pos+1;
      it.classList.remove('correct','wrong');
    });
  }
}

        ${WALK.map((w,i)=>`<div class="set-card" onclick="sndClick();startWalk(${i})"><b>ข้อที่ ${i+1}</b><div class="set-desc">${w.title}</div></div>`).join('')}
      </div>
    `;
  }
  const w = WALK[state.walkCase];
  if(state.issueIdx>=w.issues.length){
    const totalSteps = w.issues.length*4;
    const pct = Math.round(state.walkCorrectSteps/totalSteps*100);
    document.getElementById('floatbar').style.display='none';
    return `
      <h2>สรุปผล</h2>
      <div class="stars">${'⭐'.repeat(Math.max(1,Math.round(pct/20)))}</div>
      <div class="summary-score">${state.walkCorrectSteps} / ${totalSteps}</div>
      <div class="summary-sub">ขั้นตอนที่ตอบถูก (${pct}%) · ${w.title}</div>
      <div class="row row-center" style="margin-top:20px;">
        <button class="btn btn-gold" onclick="sndClick();state.walkCase=null; render();">‹ เลือกข้อสอบใหม่</button>
      </div>
    `;
  }
  const issue = w.issues[state.issueIdx];
  const stepNames=["เลือกประเด็น","เลือกมาตรา","ปรับบท","สรุปผล"];
  const stepIcons=["❓","📖","🔗","✅"];
  const stepMap=[
    {options:issue.issueOptions, correct:issue.issueCorrect, prompt:"ประเด็นนี้คือเรื่องอะไร?"},
    {options:issue.sectionOptions, correct:issue.sectionCorrect, prompt:"ควรใช้มาตราใดในการวินิจฉัย?"},
    {options:issue.applyOptions, correct:issue.applyCorrect, prompt:"ปรับข้อเท็จจริงเข้ากับมาตราอย่างไร?"},
    {options:issue.conclusionOptions, correct:issue.conclusionCorrect, prompt:"สรุปผลควรเป็นอย่างไร?"},
  ];
  const step = stepMap[state.stepIdx];
  document.getElementById('floatbar').style.display = state.walkAnswered ? 'flex':'none';
  if(state.walkAnswered){
    document.getElementById('floatbar').innerHTML = `<button class="btn btn-gold" onclick="sndClick();nextWalkStep()">${(state.stepIdx<3)?'ขั้นถัดไป ›':(state.issueIdx+1<w.issues.length?'ประเด็นถัดไป ›':'ดูสรุปผล ›')}</button>`;
  }
  return `
    <h2>${w.title}</h2>
    <div class="backrow"><button class="btn btn-ghost btn-sm" onclick="sndClick();state.walkCase=null;render();">‹ กลับไปเลือกข้อสอบ</button></div>
    <h2>${w.title}</h2>
    <span class="fact-toggle" onclick="sndClick();state.factExpanded=!state.factExpanded;render();">${state.factExpanded?'▲ ย่อโจทย์':'▼ ขยายโจทย์เต็ม'}</span>
    <div class="fact-block ${state.factExpanded?'':'collapsed'}">${w.fact}</div>
    <div style="margin-bottom:12px;"><span class="cat-pill">📋 ${issue.name}</span></div>
    <div class="step-track">
      ${[0,1,2,3].map(i=>`<div class="step-dot ${i<state.stepIdx?'done':(i===state.stepIdx?'active':'')}"></div>`).join('')}
    </div>
    <div class="step-label">
      <span class="step-badge">ขั้นที่ ${state.stepIdx+1}/4</span>
      ${stepIcons[state.stepIdx]} ${stepNames[state.stepIdx]}
    </div>
    <div style="font-weight:700;font-size:14.5px;margin-bottom:12px;color:var(--text-body);">${step.prompt}</div>
    <div id="walkChoices">
      ${step.options.map((opt,i)=>`<button class="choice" data-i="${i}" onclick="answerWalk(${i})">${opt}</button>`).join('')}
    </div>
    <div id="walkGuide"></div>
  `;
}
function startWalk(i){ state.walkCase=i; state.issueIdx=0; state.stepIdx=0; state.walkScore=0; state.walkAnswered=false; state.walkCorrectSteps=0; state.factExpanded=false; render(); }
function answerWalk(i){
  if(state.walkAnswered) return;
  const w = WALK[state.walkCase]; const issue = w.issues[state.issueIdx];
  const stepMap=[
    {options:issue.issueOptions, correct:issue.issueCorrect},
    {options:issue.sectionOptions, correct:issue.sectionCorrect},
    {options:issue.applyOptions, correct:issue.applyCorrect},
    {options:issue.conclusionOptions, correct:issue.conclusionCorrect},
  ];
  const step = stepMap[state.stepIdx];
  state.walkAnswered=true;
  document.querySelectorAll('#walkChoices .choice').forEach((btn,idx)=>{
    btn.disabled=true;
    if(idx===step.correct) btn.classList.add('correct');
    else if(idx===i) btn.classList.add('wrong');
  });
  if(i===step.correct){ state.walkCorrectSteps++; sndCorrect(); addScore(10,'ถูก ✓'); } else { sndWrong(); addScore(-5,'ผิด ✗'); }
  const isLastStep = state.stepIdx===3;
  document.getElementById('walkGuide').innerHTML = isLastStep ? `<div class="guide-box"><b>สรุปเหตุผล:</b> ${issue.guide}</div>` : '';
  const w2 = WALK[state.walkCase];
  document.getElementById('floatbar').style.display='flex';
  document.getElementById('floatbar').innerHTML = `<button class="btn btn-gold" onclick="sndClick();nextWalkStep()">${(state.stepIdx<3)?'ขั้นถัดไป ›':(state.issueIdx+1<w2.issues.length?'ประเด็นถัดไป ›':'ดูสรุปผล ›')}</button>`;
}
function nextWalkStep(){
  const w = WALK[state.walkCase];
  if(state.stepIdx<3){ state.stepIdx++; state.walkAnswered=false; render(); return; }
  state.issueIdx++; state.stepIdx=0; state.walkAnswered=false; render();
}

/* ================= INIT ================= */
render();


/* ── INIT ── */
GS = loadScore();
updateScoreUI();
render();
</script>

const THEME_KEY = 'codex-theme';
// Named setColorTheme (not setTheme) — this file already has a pre-existing
// setTheme(catId) used throughout the quiz app to color subject categories;
// this is the unrelated light/dark/horror site-wide appearance toggle.
function setColorTheme(theme){
  if (theme === 'light') { document.documentElement.removeAttribute('data-theme'); }
  else { document.documentElement.setAttribute('data-theme', theme); }
  try { localStorage.setItem(THEME_KEY, theme); } catch(e){}
  updateThemeToggleUI(theme);
  if (theme === 'horror') { playHorrorBgm(); startGhostRotation(); playHooSound(); scheduleDogHowl(); }
  else { stopGhostRotation(); stopHorrorBgm(); stopDogHowl(); }
}
const DRONE_MUTE_KEY = 'codex-drone-muted';
function playHorrorBgm(){
  const bgm = document.getElementById('horror-bgm');
  if (!bgm) return;
  let muted = false;
  try { muted = localStorage.getItem(DRONE_MUTE_KEY) === '1'; } catch(e){}
  bgm.muted = false;
  bgm.volume = muted ? 0 : 0.35;
  const p = bgm.play();
  if (p && p.catch) p.catch(() => { bgm.load(); bgm.play().catch(() => {}); });
}
function stopHorrorBgm(){
  const bgm = document.getElementById('horror-bgm');
  if (bgm) bgm.pause();
}
let dogHowlTimer = null;
function scheduleDogHowl(){
  clearTimeout(dogHowlTimer);
  const delay = 18000 + Math.random() * 22000; // every ~18-40s
  dogHowlTimer = setTimeout(() => { playDogHowl(); scheduleDogHowl(); }, delay);
}
function playDogHowl(){
  if (document.documentElement.getAttribute('data-theme') !== 'horror') return;
  const howl = document.getElementById('dog-howl');
  if (!howl) return;
  let muted = false;
  try { muted = localStorage.getItem(DRONE_MUTE_KEY) === '1'; } catch(e){}
  if (muted) return;
  howl.currentTime = 0;
  howl.volume = 0.4;
  howl.play().catch(() => {});
  setTimeout(() => { if (!howl.paused) howl.pause(); }, 3000);
}
function stopDogHowl(){
  clearTimeout(dogHowlTimer); dogHowlTimer = null;
  const howl = document.getElementById('dog-howl');
  if (howl) howl.pause();
}
function toggleDroneMute(btn){
  let muted = false;
  try { muted = localStorage.getItem(DRONE_MUTE_KEY) === '1'; } catch(e){}
  muted = !muted;
  try { localStorage.setItem(DRONE_MUTE_KEY, muted ? '1' : '0'); } catch(e){}
  if (btn) btn.textContent = muted ? '🔇' : '🔊';
  const bgm = document.getElementById('horror-bgm');
  if (bgm) bgm.volume = muted ? 0 : 0.35;
}
function updateThemeToggleUI(theme){
  document.querySelectorAll('.theme-toggle button').forEach(b => {

let ghostEl = null, ghostRotateTimer = null, ghostPulseTimer = null, ghostIndex = 0;
let ghostSpeechEl = null, ghostSpeechTimer = null;
function ensureGhostSpeechEl(){
  if (ghostSpeechEl) return ghostSpeechEl;
  const el = document.createElement('div');
  el.className = 'ghost-speech';
  document.body.appendChild(el);
  ghostSpeechEl = el; return el;
}
function showGhostSpeech(){
  if (document.documentElement.getAttribute('data-theme') !== 'horror') return;
  const ghost = ensureGhostEl();
  const bubble = ensureGhostSpeechEl();
  bubble.textContent = GHOST_PHRASES[Math.floor(Math.random() * GHOST_PHRASES.length)];
  const rect = ghost.getBoundingClientRect();
  bubble.style.right = (window.innerWidth - rect.right) + 'px';
  bubble.style.bottom = (window.innerHeight - rect.top + 10) + 'px';
  bubble.classList.add('visible');
  clearTimeout(ghostSpeechTimer);
  ghostSpeechTimer = setTimeout(() => bubble.classList.remove('visible'), 2600);
  pulseGhost();
  playHooSound();
}
function ensureGhostEl(){
  if (ghostEl) return ghostEl;
  const img = document.createElement('img');
  img.src = GHOST_IMAGES[0]; img.alt = ''; img.setAttribute('aria-hidden', 'true'); img.className = 'ghost-companion';
  img.addEventListener('mouseenter', showGhostSpeech);
  img.addEventListener('click', showGhostSpeech);
  document.body.appendChild(img); ghostEl = img; return img;
}
function startGhostRotation(){
  const el = ensureGhostEl(); ghostIndex = 0; el.src = GHOST_IMAGES[ghostIndex]; el.classList.add('visible');
  clearInterval(ghostRotateTimer); ghostRotateTimer = setInterval(rotateGhost, 5000);
}
function rotateGhost(){
  if (document.documentElement.getAttribute('data-theme') !== 'horror') return;
  const el = ensureGhostEl(); ghostIndex = (ghostIndex + 1) % GHOST_IMAGES.length;
  el.style.opacity = '0.15';
  setTimeout(() => { el.src = GHOST_IMAGES[ghostIndex]; el.style.opacity = ''; }, 220);
  playHooSound();
}
function stopGhostRotation(){
  clearInterval(ghostRotateTimer); ghostRotateTimer = null;
  if (ghostEl) { ghostEl.classList.remove('visible'); ghostEl.style.opacity = ''; }
}
function pulseGhost(){
  if (document.documentElement.getAttribute('data-theme') !== 'horror') return;
  const el = ensureGhostEl(); el.classList.add('pulse');
  clearTimeout(ghostPulseTimer); ghostPulseTimer = setTimeout(() => el.classList.remove('pulse'), 350);
}
document.addEventListener('input', (e) => {
  const t = e.target;
  if (!t) return;
  if (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || (t.classList && t.classList.contains('note-input'))) pulseGhost();
});
let __ghostAudioCtx;
function playHooSound(){
  try{
    __ghostAudioCtx = __ghostAudioCtx || new (window.AudioContext||window.webkitAudioContext)();
    const c = __ghostAudioCtx;
    if (c.state === 'suspended') c.resume();
    const t0 = c.currentTime, dur = 1.6;
    const baseFreq = 180 + Math.random() * 50;
    const osc = c.createOscillator(); osc.type = 'sine'; osc.frequency.setValueAtTime(baseFreq, t0);
    const lfo = c.createOscillator(); lfo.type = 'sine'; lfo.frequency.setValueAtTime(4.2, t0);
    const lfoGain = c.createGain(); lfoGain.gain.setValueAtTime(6, t0);
    lfo.connect(lfoGain); lfoGain.connect(osc.frequency);
    const mainGain = c.createGain();
    mainGain.gain.setValueAtTime(0.0001, t0);
    mainGain.gain.exponentialRampToValueAtTime(0.035, t0 + 0.55);
    mainGain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    const bufferSize = Math.floor(c.sampleRate * dur);
    const noiseBuffer = c.createBuffer(1, bufferSize, c.sampleRate);
    const data = noiseBuffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
    const noise = c.createBufferSource(); noise.buffer = noiseBuffer;
    const noiseFilter = c.createBiquadFilter();
    noiseFilter.type = 'bandpass'; noiseFilter.frequency.setValueAtTime(baseFreq * 1.6, t0); noiseFilter.Q.setValueAtTime(0.7, t0);
    const noiseGain = c.createGain();
    noiseGain.gain.setValueAtTime(0.0001, t0);
    noiseGain.gain.exponentialRampToValueAtTime(0.01, t0 + 0.55);
    noiseGain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(mainGain); mainGain.connect(c.destination);
    noise.connect(noiseFilter); noiseFilter.connect(noiseGain); noiseGain.connect(c.destination);
    osc.start(t0); osc.stop(t0 + dur);
    lfo.start(t0); lfo.stop(t0 + dur);
    noise.start(t0); noise.stop(t0 + dur);
  } catch(e){}
}
document.addEventListener('DOMContentLoaded', () => {
  const current = document.documentElement.getAttribute('data-theme') || 'light';
  updateThemeToggleUI(current);
  if (current === 'horror') { playHorrorBgm(); startGhostRotation(); scheduleDogHowl(); }
  const droneMuteBtn = document.getElementById('drone-mute-btn');
  if (droneMuteBtn) {
    let muted = false;
    try { muted = localStorage.getItem(DRONE_MUTE_KEY) === '1'; } catch(e){}
    droneMuteBtn.textContent = muted ? '🔇' : '🔊';
  }
  ['click','touchstart','keydown'].forEach(evt => {
    document.addEventListener(evt, function resumeBgmOnce(){
      const bgm = document.getElementById('horror-bgm');
      if (document.documentElement.getAttribute('data-theme') === 'horror' && bgm && bgm.paused) playHorrorBgm();
      ['click','touchstart','keydown'].forEach(e2 => document.removeEventListener(e2, resumeBgmOnce));
    }, { once: true });
  });
});
