        <div class="examAns" id="exam-judgment-1"><span class="exanslabel">✅ แนวคำตอบ</span><p>นายเอกยกอายุความตามมาตรา 20 ตรี วรรคท้ายขึ้นต่อสู้ไม่ได้ เพราะบทขยายอายุความ 60 วันตามมาตรานี้ใช้เฉพาะ 2 กรณีเท่านั้น คือ (1) อายุความสิ้นสุดลงไปแล้ว "หลังจากยื่นคำร้อง" ขอไกล่เกลี่ยก่อนฟ้อง หรือ (2) อายุความเหลือไม่ถึง 60 วันนับแต่วันที่การไกล่เกลี่ยสิ้นสุดลง ข้อเท็จจริงในปัญหานี้อายุความสิ้นสุดลงไปแล้ว "ก่อน" ที่นายเอกจะยื่นคำร้องขอไกล่เกลี่ยเสียอีก (สิ้นสุดก่อนยื่นคำร้อง 5 วัน) จึงไม่เข้าเงื่อนไขกรณีใดเลยตามมาตรา 20 ตรี วรรคท้าย คดีของนายเอกจึงขาดอายุความไปแล้วตั้งแต่ก่อนที่จะเริ่มกระบวนการไกล่เกลี่ยก่อนฟ้อง การไปยื่นคำร้องขอไกล่เกลี่ยภายหลังไม่อาจช่วยฟื้นอายุความที่สิ้นสุดไปแล้วให้กลับมาได้</p></div>
      </div>`},
    {heading:"3. การนั่งพิจารณาและการเลื่อนคดี (ม.35-45)",
     html:`
      <p><b>การนั่งพิจารณา</b>ตาม<b>มาตรา 1(9)</b> หมายถึงการที่ศาลออกนั่งบัลลังก์เพื่อดำเนินกระบวนพิจารณา เช่น ชี้สองสถาน สืบพยาน หรือไต่สวน โดยหลักต้องกระทำในศาลและในเวลาราชการตาม<b>มาตรา 35</b> เว้นแต่มีเหตุฉุกเฉินหรือจำเป็น เช่น การเดินเผชิญสืบนอกสถานที่ ตาม<b>มาตรา 36</b> การพิจารณาต้องกระทำต่อหน้าคู่ความและโดยเปิดเผยเพื่อความเท่าเทียมและความโปร่งใส แต่ศาลอาจสั่งพิจารณาลับหลังคู่ความที่ถูกไล่ออกจากศาลเพราะประพฤติไม่เรียบร้อย หรือกรณี<b>ขาดนัดพิจารณา</b> และอาจสั่งพิจารณาเป็นการลับ ห้ามประชาชนเข้าฟัง ในคดีครอบครัวอย่างฟ้องหย่าหรือฟ้องชายชู้ เพื่อคุ้มครองชื่อเสียงคู่ความ แต่คำพิพากษาต้องอ่านโดยเปิดเผยเสมอ จะสั่งห้ามคนเข้าฟังไม่ได้ ตาม<b>มาตรา 37</b> หลักคือต้องพิจารณาคดีติดต่อกันไปโดยไม่เลื่อนจนกว่าจะเสร็จการพิจารณาและพิพากษาคดี เพื่อความรวดเร็วและเพื่อให้ศาลจดจำรายละเอียดคดีได้โดยไม่ต้องทบทวนใหม่ทั้งหมด แต่ในทางปฏิบัติการเลื่อนคดีย่อมเกิดขึ้นได้เมื่อมีเหตุจำเป็นตามมาตรา 38-45</p>
      <p>เหตุเลื่อนคดีมีหลายกรณี <b>มาตรา 38</b> กิจธุระของศาล เช่น ผู้พิพากษาป่วยหรือมีวันหยุดราชการฉุกเฉินเกิดขึ้นภายหลังนัด <b>มาตรา 39</b> การรอผลชี้ขาดจากที่อื่น เช่น รอผลรังวัดที่ดินจากเจ้าพนักงานที่ดิน หรือรอผลคดีอาญาที่เกี่ยวเนื่องกัน เพราะมาตรา 46 ป.วิ.อ. กำหนดให้คดีแพ่งต้องถือข้อเท็จจริงตามที่ยุติในคดีอาญา หากต้องรอนานไม่มีกำหนดศาลอาจสั่ง "จำหน่ายคดีชั่วคราว" ได้ <b>มาตรา 40</b> เหตุจำเป็นของคู่ความ ต้องเป็นเหตุจำเป็นอันไม่อาจก้าวล่วงได้จริง เช่น เจ็บป่วยรุนแรง และหากไม่เลื่อนจะเสียความยุติธรรม เช่น ไม่มีทนายความช่วยต่อสู้คดี โดยฝ่ายที่ขอเลื่อนกะทันหันอาจต้องเสียค่าป่วยการพยานให้ฝ่ายตรงข้าม ซึ่งเงินนี้ตกเป็นพับทันที เรียกคืนไม่ได้แม้จะชนะคดีในที่สุด เพื่อป้องกันการประวิงคดี <b>มาตรา 41</b> ให้อำนาจศาลส่งเจ้าพนักงานหรือแพทย์ไปตรวจสอบข้ออ้างเรื่องเจ็บป่วย หากตรวจแล้วเห็นว่าไม่ร้ายแรงถึงขนาดมาศาลไม่ได้ ศาลจะไม่อนุญาตให้เลื่อนและถือว่าขาดนัดหรือเสียสิทธิในนัดนั้นไปเลย</p>
      <p>ตาม<b>มาตรา 42-44</b> หากตัวความฝ่ายใดมรณะระหว่างพิจารณาคดี ศาลต้องเลื่อนการนั่งพิจารณาเพื่อรอทายาท ผู้จัดการมรดก หรือผู้ปกครองทรัพย์มรดกเฉพาะส่วนที่พิพาทเข้ามาเป็นคู่ความแทนภายใน 1 ปี หากไม่มีผู้เข้ามาศาลจะสั่งจำหน่ายคดี แต่ศาลฎีกาวางแนวไว้ว่าระยะเวลา 1 ปีนี้เป็นเพียงบทบัญญัติให้แก่นายความ ไม่ใช่บทบังคับเด็ดขาด ความตายต้องเกิดขึ้นระหว่างพิจารณาคดี เว้นแต่ตายหลังศาลชั้นต้นพิพากษาแต่ยังอยู่ในช่วงที่ยื่นอุทธรณ์หรือฎีกาได้ ก็ยังขอรับมรดกความได้ หากตายก่อนฟ้องถือว่าไม่มีอำนาจฟ้องมาแต่แรก หากตายในชั้นบังคับคดีให้ว่าไปตามกฎหมายมรดกทั่วไป ผู้เข้าแทนที่จะมีสถานะเสมือนผู้มรณะ สิทธิที่เคยได้รับ เช่น การยกเว้นค่าธรรมเนียมศาล ย่อมตกทอดมาด้วยแม้ตนเองจะไม่ยากจน และความรับผิดผูกพันเฉพาะกองมรดกเท่านั้น หากผู้เข้าแทนที่ตายซ้ำอีก ต้องให้ทายาทของคู่ความเดิมเข้ามา ไม่ใช่ทายาทของผู้เข้าแทนที่ ส่วน<b>มาตรา 45</b> ใช้เมื่อคู่ความตกเป็นผู้ไร้ความสามารถหรือผู้แทนโดยชอบธรรมมรณะหรือหมดอำนาจ ซึ่งต้องเลื่อนคดีรอการตั้งผู้แทนใหม่ และเมื่อทนายความหรือผู้แทนมรณะหรือหมดอำนาจ ก็ต้องเลื่อนคดีให้ตัวความตั้งทนายใหม่หรือว่าความเองได้เช่นกัน</p>`},
  ],
  appeal: [
    {heading:"1. หลักทั่วไป ม.223-225",
     html:`
      <p>ตาม<b>มาตรา 223</b> คู่ความมีสิทธิอุทธรณ์ได้เสมอ เว้นแต่กฎหมายจะจำกัดไว้เป็นการเฉพาะ ข้อจำกัดสำคัญที่ต้องจำคือ<b>มาตรา 224</b> ซึ่งกำหนดว่าหากทุนทรัพย์ที่พิพาทกันในชั้นอุทธรณ์ไม่เกิน 50,000 บาท ห้ามอุทธรณ์ในปัญหาข้อเท็จจริง เว้นแต่จะมีความเห็นแย้งของผู้พิพากษาในข้อเท็จจริง มีคำรับรองให้อุทธรณ์ หรือมีหนังสืออนุญาตจากอธิบดี ส่วนความเห็นแย้งในปัญหาข้อกฎหมายใช้เป็นเหตุอุทธรณ์ไม่ได้</p>
      <p>ตาม<b>มาตรา 225</b> ประเด็นที่จะอุทธรณ์ต้องเป็นประเด็นที่ได้ยกขึ้นว่ากันมาแล้วโดยชอบในศาลชั้นต้น เว้นแต่เป็นปัญหาเกี่ยวกับความสงบเรียบร้อยของประชาชน หรือพฤติการณ์ไม่เปิดช่องให้ยกขึ้นต่อสู้ได้ตั้งแต่ต้น เช่น กรณีข้อเท็จจริงเพิ่งยุติในคดีอาญาที่เกี่ยวเนื่องกันในระหว่างที่คดีแพ่งกำลังพิจารณาอยู่ในศาลชั้นต้น</p>
      <p>จุดเก็งข้อสอบที่สำคัญที่สุดคือการแยก "<b>ปัญหาข้อเท็จจริง</b>" กับ "<b>ปัญหาข้อกฎหมาย</b>" เพราะมาตรา 224 ห้ามอุทธรณ์เฉพาะปัญหาข้อเท็จจริงเท่านั้น ปัญหาข้อเท็จจริงคือเรื่องที่ต้องพิสูจน์ด้วยพยานหลักฐานว่าเหตุการณ์เกิดขึ้นจริงหรือไม่ รวมถึงการโต้แย้ง "ดุลพินิจของศาล" เช่น ศาลกำหนดค่าเสียหายน้อยกว่าที่ขอ หรือศาลสั่งตัดพยาน ล้วนถือเป็นปัญหาข้อเท็จจริงทั้งสิ้น ส่วนปัญหาข้อกฎหมายคือกรณีที่ข้อเท็จจริงยุติแล้ว แล้วนำมาปรับเข้ากับตัวบทกฎหมาย การตีความกฎหมาย สัญญา หรือพินัยกรรม หากเถียงกันว่ากฎหมายต่างประเทศบัญญัติว่าอย่างไรถือเป็นปัญหาข้อเท็จจริง แต่ถ้าเห็นตรงกันแล้วเถียงแค่ว่าตีความอย่างไรจะกลายเป็นปัญหาข้อกฎหมาย</p>
      <p>สำหรับข้อยกเว้น "ความสงบเรียบร้อยของประชาชน" ตามมาตรา 225 วรรคสอง ที่ยกขึ้นอุทธรณ์ได้แม้ไม่เคยสู้ในศาลชั้นต้น ได้แก่ ปัญหาอำนาจฟ้อง สิทธิรักษาพยาบาลตามโครงการบัตรทอง การสมรสซ้อน การแบ่งสินสมรส และปัญหาศาลพิพากษาเกินคำขอตามมาตรา 142 แต่<b>ปัญหาฟ้องเคลือบคลุมและปัญหาคดีขาดอายุความไม่ใช่</b>ปัญหาความสงบเรียบร้อยฯ จะเพิ่งมายกขึ้นอ้างในชั้นอุทธรณ์โดยไม่เคยสู้มาก่อนไม่ได้ นอกจากนี้ในคดีที่มีจำเลยหลายคน จำเลยแต่ละคนต้องยกข้อต่อสู้ของตนเองไว้ในศาลชั้นต้นด้วยตนเอง จะดึงเอาข้อต่อสู้ของจำเลยร่วมคนอื่นมาอ้างอุทธรณ์แทนตนไม่ได้ ("จะยืมจมูกคนอื่นหายใจไม่ได้") และหากประเด็นที่อุทธรณ์แม้ศาลจะวินิจฉัยให้ก็ไม่ทำให้ผลคดีเปลี่ยนแปลง ถือเป็นข้อที่ไม่เป็นสาระแก่คดี กฎหมายห้ามอุทธรณ์เช่นกัน</p>
      <div class="examBox"><div class="exlabel">📝 โจทย์ฝึกจากหลักในคำบรรยาย</div>
        <div class="exq">โจทก์ฟ้องขอให้บังคับจำเลยชำระเงิน 3,000,000 บาท ศาลชั้นต้นพิพากษาให้จำเลยชำระ 700,000 บาท จำเลยไม่พอใจจะอุทธรณ์ จึงมอบอำนาจให้ "สมาพันธ์ตรวจสอบอำนาจรัฐแห่งประเทศไทย" เป็นผู้ดำเนินคดีแทนตน โดยประธานสมาพันธ์ลงลายมือชื่อในฐานะผู้อุทธรณ์และผู้เขียนฟ้องอุทธรณ์ ศาลชั้นต้นตรวจอุทธรณ์แล้วพบว่าสมาพันธ์ดังกล่าวไม่มีฐานะเป็นนิติบุคคลตามกฎหมายใดเลย จงวินิจฉัยว่าศาลชั้นต้นจะมีคำสั่งส่งหรือปฏิเสธไม่ส่งอุทธรณ์นี้ไปยังศาลอุทธรณ์ เพราะเหตุใด (คำใบ้: ประเด็นนี้ไม่เกี่ยวกับทุนทรัพย์ตามมาตรา 224 เลย)</div>
        <div class="exsrc">โจทย์ฝึกอิงหลักมาตรา 1(11), 67(5) ประกอบมาตรา 232</div>
        <button type="button" class="examToggle" onclick="toggleExamAns('exam-appeal-2')">🔎 ดูเฉลย</button>
        <div class="examAns" id="exam-appeal-2"><span class="exanslabel">✅ แนวคำตอบ</span><p>ศาลชั้นต้นจะมีคำสั่งปฏิเสธไม่ส่งอุทธรณ์นี้ไปยังศาลอุทธรณ์ ตามมาตรา 232 ที่ให้ศาลชั้นต้นตรวจอุทธรณ์ก่อนว่าทำถูกต้องตามหลักเกณฑ์พื้นฐานหรือไม่ ก่อนจะไปพิจารณาเนื้อหาเรื่องทุนทรัพย์ตามมาตรา 224 เลยด้วยซ้ำ มาตรา 1(11) กำหนดว่า "คู่ความ" รวมถึงบุคคลผู้มีสิทธิกระทำการแทนตามกฎหมาย แต่เมื่อสมาพันธ์ตรวจสอบอำนาจรัฐแห่งประเทศไทยไม่มีฐานะเป็นนิติบุคคล ไม่มีกฎหมายใดรองรับสถานะ จึงไม่อาจดำเนินคดีแทนจำเลยได้ ประกอบกับมาตรา 67(5) ที่กำหนดว่าคำคู่ความต้องมีลายมือชื่อของคู่ความหรือบุคคลผู้มีอำนาจโดยชอบ การที่ประธานสมาพันธ์ซึ่งไม่มีอำนาจตามกฎหมายมาลงลายมือชื่อในฐานะผู้อุทธรณ์และผู้เขียน จึงเป็นกระบวนพิจารณาที่ไม่ชอบด้วยกฎหมายตั้งแต่ต้น ศาลชั้นต้นจึงต้องปฏิเสธไม่ส่งอุทธรณ์นี้ไปยังศาลอุทธรณ์ทันทีตามมาตรา 232 โดยไม่ต้องพิจารณาว่าทุนทรัพย์ในชั้นอุทธรณ์เข้าข้อห้ามตามมาตรา 224 หรือไม่เลย</p></div>
      </div>`},
    {heading:"2. คำสั่งระหว่างพิจารณา ม.226-228",
     html:`
      <p>ตาม<b>มาตรา 226</b> คำสั่งระหว่างพิจารณาห้ามอุทธรณ์ทันที ต้องโต้แย้งคำสั่งนั้นไว้ก่อน แล้วจึงค่อยอุทธรณ์เมื่อศาลมีคำพิพากษาแล้ว หลักนี้ใช้แม้กับคำสั่งชี้สองสถานที่ไม่ได้กำหนดประเด็นให้ครบถ้วน แต่ตาม<b>มาตรา 227</b> และ<b>228</b> มีข้อยกเว้นสำหรับคำสั่งที่ทำให้คดีเสร็จไปทั้งเรื่องหรือเสร็จไปบางส่วน หรือคำสั่งไม่รับคำคู่ความ ซึ่งรวมถึงคำสั่งยกคำร้องขอแก้ไขคำให้การที่ถือเป็นคำคู่ความด้วย กรณีเหล่านี้อุทธรณ์ได้ทันทีโดยไม่ต้องโต้แย้งไว้ก่อน</p>
      <p>ตัวอย่างการปรับใช้ที่ต้องแม่นมาตราให้ตรง: คำสั่ง<b>งดชี้สองสถาน</b>โดยไม่ได้ใช้อำนาจวินิจฉัยชี้ขาดเบื้องต้นในปัญหาข้อกฎหมายตามมาตรา 24 ถือเป็นคำสั่งระหว่างพิจารณาตามมาตรา 226 ธรรมดา ต้องโต้แย้งไว้ก่อนจึงจะอุทธรณ์ได้ตามแนว<b>ฎ.13180/2553</b> ส่วนคำสั่งไม่รับคำให้การถือเป็นการไม่รับคำคู่ความแต่ไม่ทำให้คดีเสร็จไปทั้งเรื่อง จึงเข้าข้อยกเว้นมาตรา 228(3) อุทธรณ์ได้ทันทีโดยไม่ต้องโต้แย้งไว้ก่อน ข้อควรระวังคือการยื่นคำร้องขอเพิกถอนกระบวนพิจารณาที่ผิดระเบียบตามมาตรา 27 ไม่ใช่ช่องทางเดียวกับการโต้แย้งคำสั่งระหว่างพิจารณาตามมาตรา 226 หากคู่ความรู้ว่ากระบวนพิจารณาผิดระเบียบแต่ไม่ได้โต้แย้งคัดค้านไว้ กลับปล่อยให้ดำเนินคดีต่อไปจนจบ เช่น ทนายจำเลยไม่ได้คัดค้านที่เจ้าพนักงานศาลไม่นำสำนวนคดีอื่นมาผูกติดตามที่ขอ แล้วยังนำพยานเข้าเบิกความต่อจนเสร็จ ถือว่าสละสิทธิยกประเด็นนี้ขึ้นอุทธรณ์ฎีกาในภายหลังตามแนว<b>ฎ.5916/2544</b></p>`},
    {heading:"3. ⭐ ทุนทรัพย์ชั้นอุทธรณ์ (ออกสอบบ่อย)",
     html:`
      <p>ทุนทรัพย์ชั้นอุทธรณ์ไม่เท่ากับทุนทรัพย์ตอนฟ้อง แต่คิดจากส่วนที่แพ้คดีและยังโต้แย้งอยู่ โดยคิดแยกเฉพาะจำเลยแต่ละคน หากจำเลยรายหนึ่งชนะคดีเต็มจำนวนในศาลชั้นต้นคือศาลยกฟ้องทั้งหมด ทุนทรัพย์ชั้นอุทธรณ์ของโจทก์ต่อจำเลยรายนั้นจะคิดเต็มจำนวนเดิมที่ฟ้อง ไม่ใช่คิดจากผลต่าง สำหรับคดีฟ้องขับไล่ หากค่าเช่าไม่เกิน 4,000 บาทต่อเดือน ห้ามอุทธรณ์ในปัญหาข้อเท็จจริง แต่หากเกิน 4,000 บาทก็ไม่ต้องห้าม</p>
      <div class="examBox"><div class="exlabel">📝 โจทย์ฝึกจากหลักในคำบรรยาย</div>
        <div class="exq">โจทก์ฟ้องจำเลยที่ 1 และจำเลยที่ 2 ให้ร่วมกันชำระหนี้ 80,000 บาท ศาลชั้นต้นพิพากษาให้จำเลยที่ 1 ชำระหนี้ 30,000 บาท และยกฟ้องจำเลยที่ 2 ทั้งจำนวน โจทก์ไม่พอใจคำพิพากษาทั้งสองส่วนจะอุทธรณ์ ให้ท่านคำนวณว่าทุนทรัพย์ที่โจทก์จะใช้อุทธรณ์คำพิพากษาส่วนของจำเลยที่ 1 และทุนทรัพย์ที่จะใช้อุทธรณ์คำพิพากษาส่วนของจำเลยที่ 2 เป็นจำนวนเท่าใด และเข้าข้อห้ามอุทธรณ์ปัญหาข้อเท็จจริงตามมาตรา 224 หรือไม่</div>
        <div class="exsrc">โจทย์ฝึกอิงหลักการคิดทุนทรัพย์ชั้นอุทธรณ์แยกรายจำเลย</div>
        <button type="button" class="examToggle" onclick="toggleExamAns('exam-appeal-1')">🔎 ดูเฉลย</button>
        <div class="examAns" id="exam-appeal-1"><span class="exanslabel">✅ แนวคำตอบ</span><p>ทุนทรัพย์ชั้นอุทธรณ์ต้องคิดแยกเป็นรายจำเลยแต่ละคน ไม่ใช่คิดรวมยอด 80,000 บาทเหมือนตอนฟ้อง สำหรับจำเลยที่ 1 ศาลพิพากษาให้ชำระ 30,000 บาท จากที่ฟ้อง 80,000 บาท โจทก์แพ้ในส่วนต่าง 50,000 บาท ทุนทรัพย์ชั้นอุทธรณ์ของโจทก์ต่อจำเลยที่ 1 จึงเท่ากับ 50,000 บาท ซึ่งไม่เกิน 50,000 บาท จึงยังเข้าข้อห้ามอุทธรณ์ปัญหาข้อเท็จจริงตามมาตรา 224 (ต้องดูว่าเกินหรือไม่เกิน คำว่า "ไม่เกิน" รวมถึงจำนวนที่เท่ากันพอดีด้วย) สำหรับจำเลยที่ 2 ศาลยกฟ้องเต็มจำนวน โจทก์แพ้คดีเต็มจำนวนที่ฟ้อง ทุนทรัพย์ชั้นอุทธรณ์ของโจทก์ต่อจำเลยที่ 2 จึงคิดเต็มจำนวนเดิมที่ฟ้องคือ 80,000 บาท ไม่ใช่คิดจากผลต่างแต่อย่างใด เมื่อทุนทรัพย์เกิน 50,000 บาท จึงไม่ต้องห้ามอุทธรณ์ในปัญหาข้อเท็จจริงสำหรับส่วนของจำเลยที่ 2</p></div>
      </div>`},
    {heading:"4. ระบบฎีกา (ม.247-252) — ฎีกาอนุญาต",
     html:`
      <p>ต่างจากการอุทธรณ์ซึ่งเป็นสิทธิโดยอัตโนมัติ การฎีกาต้องยื่นคำร้องขออนุญาตฎีกาโดยแสดงให้เห็นว่าเป็นปัญหาสำคัญที่ศาลฎีกาควรจะวินิจฉัย ไม่มีสิทธิฎีกาได้เองโดยอัตโนมัติ นอกจากนี้ตาม<b>มาตรา 229</b> หากการอุทธรณ์กระทบคำพิพากษาในส่วนที่เกี่ยวกับเงิน ผู้อุทธรณ์ต้องวางเงินค่าธรรมเนียมที่จะต้องใช้แทนคู่ความอีกฝ่ายมาพร้อมกับอุทธรณ์ด้วย หากไม่วางถือว่าอุทธรณ์ไม่ชอบ แม้ประเด็นนั้นจะเป็นประเด็นที่อุทธรณ์ได้โดยไม่ต้องโต้แย้งคำสั่งไว้ก่อนก็ตาม</p>
      <p>หัวใจของระบบฎีกาอนุญาตตาม<b>มาตรา 247</b> คือผู้ฎีกาต้อง<b>ยื่นเอกสาร 2 ชนิดพร้อมกันเสมอ</b> คือคำฟ้องฎีกาและคำร้องขออนุญาตฎีกา หากยื่นมาเพียงคำฟ้องฎีกาอย่างเดียวโดยยึดติดกับระบบสิทธิแบบเดิม ศาลฎีกาจะสั่งไม่รับฎีกาทันที ศาลฎีกาจะพิจารณาคำร้องขออนุญาตฎีกาก่อนเป็นลำดับแรก โดยเกณฑ์ที่จะอนุญาตตาม<b>มาตรา 249</b> คือต้องเป็น "ปัญหาสำคัญที่ศาลฎีกาควรรับไว้วินิจฉัย" เช่น ปัญหาเกี่ยวด้วยความสงบเรียบร้อยของประชาชน คำพิพากษาศาลอุทธรณ์ขัดกับแนวคำพิพากษาศาลฎีกาเดิม เป็นปัญหาข้อกฎหมายใหม่ที่ยังไม่มีบรรทัดฐาน หรือคำพิพากษาศาลอุทธรณ์ขัดแย้งกันเองในสาระสำคัญ องค์คณะที่สั่งคำร้องขออนุญาตฎีกามี 4 ท่าน (รองประธานศาลฎีกา 1 + ผู้พิพากษาศาลฎีกา 3) ใช้เสียงข้างมาก หากเสียงเท่ากัน 2:2 กฎหมายให้ถือตามฝ่ายที่เห็นควรอนุญาตให้ฎีกา หากศาลฎีกามีคำสั่งยกคำร้องหรือไม่อนุญาตให้ฎีกา ผลคือไม่รับฎีกานั้นไปด้วยทันที คดีถึงที่สุดตามคำพิพากษาศาลอุทธรณ์</p>`},
    {heading:"5. ทุเลาการบังคับคดีและระยะเวลาอุทธรณ์ (ม.229-231)",
     html:`
      <p>ระยะเวลาอุทธรณ์คือ<b>1 เดือน</b>นับแต่วันที่ศาลอ่านคำพิพากษาหรือคำสั่ง หากพ้นกำหนดคดีถึงที่สุดทันที หากทำไม่ทันต้องยื่นคำร้องขอขยายระยะเวลาโดยอ้าง "พฤติการณ์พิเศษ" ตามมาตรา 23 และต้องยื่นขอก่อนสิ้นสุดระยะเวลา 1 เดือนนั้น เหตุที่พบบ่อยในทางปฏิบัติคือศาลพิมพ์คำพิพากษาไม่เสร็จทำให้คัดสำเนาล่าช้า ซึ่งศาลมักจะขยายเวลาให้เท่ากับจำนวนวันที่ล่าช้าจริงเท่านั้น</p>
      <p>ข้อสำคัญที่สุดคือการยื่นอุทธรณ์เพียงอย่างเดียว<b>ไม่ทำให้การบังคับคดีหยุดลง</b> ผู้แพ้คดียังอาจถูกยึดทรัพย์หรือบังคับคดีต่อไปได้ หากต้องการหยุดต้องยื่นคำร้อง "<b>ขอทุเลาการบังคับคดี</b>" ตาม<b>มาตรา 231</b> ซึ่งมี 2 ช่องทาง ช่องทางแรกตามวรรคหนึ่งคือยื่นคำร้องผ่านศาลชั้นต้นเพื่อส่งไปให้ศาลอุทธรณ์พิจารณา อำนาจสั่งอนุญาตเป็นของศาลอุทธรณ์เท่านั้น คำร้องต้องอธิบายเหตุผลและข้อเท็จจริงที่เป็นรูปธรรมชัดเจน เช่น คดีขับไล่ต้องระบุความเดือดร้อนที่แท้จริง จะเขียนลอย ๆ หรือลอกฎีกามาอ้างไม่ได้ และหากศาลอุทธรณ์ไม่อนุญาต คำสั่งนั้นเป็นที่สุด ฎีกาต่อไม่ได้ ช่องทางที่สองตามวรรคสามใช้เฉพาะกรณีหนี้เงิน คือนำเงินหรือหลักประกันที่ศาลพอใจมาวางต่อศาลชั้นต้นโดยตรง กรณีนี้ศาลชั้นต้นเองมีอำนาจสั่งอนุญาตได้เลยโดยไม่ต้องรอศาลอุทธรณ์ หลักประกันอาจเป็นเงินสดหรือโฉนดที่ดิน แต่ศาลจะไม่รับสินทรัพย์ดิจิทัลอย่าง Bitcoin เพราะไม่ถือเป็นทรัพย์สินที่ใช้เป็นหลักประกันในศาลได้ ข้อควรระวังคือหากศาลชั้นต้นพิพากษายกฟ้อง โจทก์จะมาขอทุเลาการบังคับคดีไม่ได้เลย เพราะไม่มีหนี้ใดที่จะต้องบังคับจำเลยตั้งแต่ต้น</p>`},
  ],
};

     html:`
      <p>กฎหมาย<b>พระธรรมนูญศาลยุติธรรม</b>ทำหน้าที่ \"จัดวางฮาร์ดแวร์\" ของระบบ คือกำหนดว่ามีศาลอะไรบ้าง แต่ละศาลมีอำนาจแค่ไหน และผู้พิพากษาแต่ละประเภทมีอำนาจเพียงใด ต้องใช้ควบคู่กับ<b>ประมวลกฎหมายวิธีพิจารณาความแพ่ง</b> (ป.วิ.พ.) และ<b>ประมวลกฎหมายวิธีพิจารณาความอาญา</b> (ป.วิ.อ.) ซึ่งเป็น \"ซอฟต์แวร์\" ที่บอกวิธีดำเนินคดี</p>
      <p>ศาลยุติธรรมแบ่งเป็น 3 ชั้น คือ <b>ศาลชั้นต้น</b> <b>ศาลอุทธรณ์</b> และ<b>ศาลฎีกา</b> นอกจากศาลชั้นต้นทั่วไป (ศาลแพ่ง ศาลอาญา ศาลจังหวัด ศาลแขวง) ยังมี<b>ศาลชำนัญพิเศษ</b>ที่ตั้งขึ้นพิจารณาคดีเฉพาะด้าน เช่น ศาลแรงงาน ศาลทรัพย์สินทางปัญญาและการค้าระหว่างประเทศ ศาลภาษีอากร ศาลล้มละลาย ศาลเยาวชนและครอบครัว และมีการตั้ง <b>\"แผนก\"</b> เฉพาะทางขึ้นภายในศาลปกติ เช่น แผนกคดีซื้อขายออนไลน์ในศาลแพ่ง แผนกคดียาเสพติด เพื่อให้ผู้พิพากษาที่เชี่ยวชาญเฉพาะด้านเป็นผู้พิจารณา</p>
      <p>เพื่อให้ประชาชนในพื้นที่ห่างไกลเข้าถึงศาลได้ กฎหมายยังเปิดช่องให้ตั้ง <b>\"ศาลสาขา\"</b> หรือกำหนด \"สถานที่นั่งพิจารณาคดี\" นอกที่ตั้งศาลได้ตาม <b>ป.วิ.พ. มาตรา 35</b></p>`},

    {heading:"2. ⭐ สูตร 3 ขั้นตอนตรวจเขตอำนาจศาล (ต้องทำทุกข้อสอบ)",
     html:`
      <p>ก่อนฟ้องคดีทุกครั้งต้องไล่ตรวจ 3 ชั้นตามลำดับเสมอ</p>
      <p><b>ขั้นที่ 1 — ชั้นของศาล:</b> ต้องเริ่มฟ้องที่<b>ศาลชั้นต้น</b>ก่อนเสมอ เว้นแต่มีกฎหมายบัญญัติให้ฟ้องตรงต่อศาลสูงกว่าได้เป็นการเฉพาะ (เช่น คดีเลือกตั้ง ส.ส./ส.ว. ยื่นตรงต่อศาลฎีกา คดีเลือกตั้งท้องถิ่นยื่นตรงต่อศาลอุทธรณ์)</p>
      <p><b>ขั้นที่ 2 — เขตศาล (Territorial Jurisdiction):</b> ดูพื้นที่ทางภูมิศาสตร์ว่า<b>มูลคดีเกิดที่ไหน</b> หรือ<b>จำเลยมีภูมิลำเนาที่ใด</b> ตาม <b>ป.วิ.พ. มาตรา 4</b> โดยตรวจเขตอำนาจที่แท้จริงได้จากพระราชบัญญัติจัดตั้งศาลนั้น ๆ</p>
      <p><b>ขั้นที่ 3 — อำนาจตามสภาพแห่งคำฟ้อง (Subject-matter Jurisdiction):</b> ดูว่าเป็น<b>คดีแพ่งหรือคดีอาญา</b> <b>มีทุนทรัพย์เท่าใด</b> และเป็นคดีที่ต้องขึ้น<b>ศาลชำนัญพิเศษ</b>หรือไม่ เพื่อชี้ว่าต้องขึ้นศาลจังหวัดหรือศาลแขวง</p>`},

    {heading:"3. ศาลจังหวัด (ม.18) vs ศาลแขวง (ม.17) — สองชั้นในจังหวัดเดียวกัน",
     html:`
      <p><b>ศาลจังหวัด</b>ตาม<b>มาตรา 18</b> มีอำนาจทั่วไป (General Jurisdiction) คือพิจารณาพิพากษาคดีแพ่งและอาญา <b>\"ทั้งปวง\"</b> ที่ไม่ได้อยู่ในอำนาจของศาลยุติธรรมอื่นเป็นการเฉพาะ องค์คณะต้องมีผู้พิพากษาอย่างน้อย 2 คนตามมาตรา 26</p>
      <p><b>ศาลแขวง</b>ตาม<b>มาตรา 17</b> มีอำนาจ \"เท่ากับที่ผู้พิพากษาคนเดียวมีตามมาตรา 24 และ 25\" เท่านั้น องค์คณะใช้ผู้พิพากษาคนเดียว จะรับคดีที่เกินขอบเขตนี้ไม่ได้เลย หัวใจคือ <b>อำนาจศาลแขวง = อำนาจผู้พิพากษาคนเดียว</b> จำคู่กันไว้เสมอ</p>
      <p>เกณฑ์คร่าว ๆ ที่ต้องท่อง: ศาลแขวง = คดีแพ่งทุนทรัพย์ <b>ไม่เกิน 300,000 บาท</b> / คดีอาญาอัตราโทษอย่างสูง <b>จำคุกไม่เกิน 3 ปี หรือปรับไม่เกิน 60,000 บาท</b> (แต่ลงโทษจริงเกินจำคุก 6 เดือน หรือปรับ 10,000 บาทไม่ได้) รายละเอียดทั้งหมดอยู่ในครั้งที่ 3 และ 5</p>`},

    {heading:"4. ตัวอย่างห้องเรียน — กู้เงิน 200,000 บาท ลำพูน/น่าน/เชียงใหม่",
     html:`
      <p><b>ข้อเท็จจริง:</b> นาย ก. ภูมิลำเนาจังหวัดลำพูน นาย ข. ภูมิลำเนาจังหวัดน่าน ทั้งคู่ไปเที่ยวเชียงใหม่ นาย ก. ทำสัญญากู้เงินนาย ข. ที่เชียงใหม่ 200,000 บาท ครบกำหนดไม่ชำระ นาย ข. จะฟ้องที่ใด</p>
      <p><b>ขั้นเขตศาล (ม.4(1)):</b> นาย ข. เลือกฟ้องได้ 2 จังหวัด คือ <b>ศาลที่จำเลยมีภูมิลำเนา = ลำพูน</b> หรือ <b>ศาลที่มูลคดีเกิด = เชียงใหม่</b> (สัญญาทำที่เชียงใหม่)</p>
      <p><b>ขั้นอำนาจตามสภาพแห่งคำฟ้อง:</b> ทุนทรัพย์ 200,000 บาท ไม่เกิน 300,000 บาท จึงเป็นคดีในอำนาจศาลแขวง</p>
      <ul>
        <li><b>ถ้าฟ้องที่ลำพูน:</b> ลำพูน<b>ไม่มีศาลแขวง</b> จึงต้องฟ้องที่<b>ศาลจังหวัดลำพูน</b> (ศาลจังหวัดมีอำนาจทั่วไปในเขตที่ไม่มีศาลแขวง)</li>
        <li><b>ถ้าฟ้องที่เชียงใหม่:</b> เชียงใหม่มีทั้งศาลจังหวัดและศาลแขวง เมื่อทุนทรัพย์ไม่เกิน 300,000 บาท ต้องฟ้อง<b>ศาลแขวงเชียงใหม่</b> จะข้ามไปฟ้องศาลจังหวัดเชียงใหม่ไม่ได้</li>
      </ul>
      <p>สรุป นาย ข. เลือกได้ 2 ทาง: ศาลจังหวัดลำพูน หรือ ศาลแขวงเชียงใหม่</p>`},

    {heading:"5. ⭐ กรณีศึกษา — ไต่สวนชันสูตรพลิกศพพลทหาร (ฎ.21697/2556)",
     html:`
      <p><b>ข้อเท็จจริง:</b> พลทหารแดงใช้ปืนยิงนายดำถึงแก่ความตายในร้านอาหาร พนักงานอัยการยื่นคำร้องขอให้<b>ศาลจังหวัดเพชรบุรี</b> (ท้องที่ที่ตาย) ไต่สวนและมีคำสั่งชันสูตรพลิกศพ ศาลจังหวัดเพชรบุรีมีอำนาจหรือไม่</p>
      <p><b>คำตอบ:</b> ไม่มีอำนาจ อำนาจเป็นของ<b>ศาลทหาร</b> โดยหลักทั้งศาลจังหวัดและศาลทหารต่างไต่สวนชันสูตรพลิกศพได้ แต่เมื่อผู้ก่อเหตุคือ \"พลทหาร\" ซึ่งเป็นบุคคลที่อยู่ในอำนาจศาลทหาร หากชันสูตรเสร็จแล้วต้องดำเนินคดีอาญาต่อ คดีนั้นย่อมอยู่ในอำนาจศาลทหาร การไต่สวนชันสูตรพลิกศพซึ่งเป็นกระบวนการตั้งต้นจึงต้องไปทำที่<b>ศาลทหาร</b>ด้วย เพื่อให้กระบวนการต่อเนื่องสอดคล้องกัน (แนว <b>ฎ.21697/2556</b>)</p>
      <p><b>บทเรียนออกสอบ:</b> เขตอำนาจ \"ตามตัวบุคคล\" (ทหาร) มาก่อนเขตพื้นที่ — อย่าตอบแค่ \"ท้องที่ที่ตาย\"</p>`},

    {heading:"6. ⭐ กรณีศึกษา — ผู้พิพากษาศาลแขวงไต่สวนมูลฟ้อง ม.365(3) (กรรมเดียวผิดหลายบท บทหนักเกินอำนาจ)",
     html:`
      <p><b>ข้อเท็จจริง:</b> นาย ก. ฟ้องคดีอาญาเองต่อ<b>ศาลแขวงราชบุรี</b> ว่านาย ข. บุกรุกและทำให้เสียทรัพย์ ขอให้ลงโทษตาม <b>ป.อ. ม.365(3)</b> ประกอบ ม.362 (จำคุกไม่เกิน 5 ปี หรือปรับไม่เกิน 100,000 บาท) และ ม.358 (จำคุกไม่เกิน 3 ปี) เป็น<b>กรรมเดียวผิดกฎหมายหลายบท</b> นาย ค. ผู้พิพากษาคนเดียวไต่สวนมูลฟ้องแล้วสั่งประทับฟ้อง — ชอบด้วยกฎหมายหรือไม่</p>
      <p><b>คำตอบ:</b> ไม่ชอบด้วยกฎหมาย (สำหรับข้อหาที่อัตราโทษเกินอำนาจ) ตรรกะของอาจารย์คือ แม้ <b>ม.25(3)</b> ให้อำนาจ \"ไต่สวนมูลฟ้อง\" ได้ แต่ต้องอ่านประกอบ <b>ม.25(5)</b> — หากไต่สวนแล้วเห็นว่า \"คดีไม่มีมูล\" ป.วิ.อ. ม.167 บังคับให้ศาลต้อง \"พิพากษายกฟ้อง\" ซึ่งเป็นการวินิจฉัยชี้ขาดคดี เมื่อบทหนักที่สุด (ม.365(3) โทษ 5 ปี) เกินอำนาจ \"พิพากษา\" ของผู้พิพากษาคนเดียว ผู้พิพากษาคนเดียวจึง<b>ไม่มีอำนาจแม้แต่จะไต่สวนมูลฟ้อง</b>ในข้อหานั้น คดีต้องส่งให้ศาลจังหวัดพิจารณาตั้งแต่ต้น</p>
      <p><b>เปรียบเทียบ:</b> ถ้าฟ้องเฉพาะ ม.297 (สาหัส) โดยไม่มีข้อหาอื่น ยัง \"ประทับฟ้อง\" ได้แม้โทษเกินอำนาจพิพากษา เพราะ \"ประทับฟ้อง\" เป็นเพียงการรับคดีไว้ ยังไม่ชี้ขาด — จุดต่างคือ \"ไต่สวนมูลฟ้องแล้วอาจต้องยกฟ้อง\" กับ \"ประทับฟ้องเฉย ๆ\"</p>
      <div class="examBox"><div class="exlabel">📝 โจทย์ฝึกจากหลักในคำบรรยาย</div>
        <div class="exq">พนักงานอัยการยื่นฟ้องจำเลยต่อศาลแขวงพระนครศรีอยุธยา ขอให้ลงโทษฐานทำร้ายร่างกายผู้อื่นเป็นเหตุให้ได้รับอันตรายแก่กายตาม ป.อ. มาตรา 295 (จำคุกไม่เกิน 2 ปี หรือปรับไม่เกิน 40,000 บาท) นาย ก. ผู้พิพากษาคนเดียวไต่สวนแล้วเห็นว่าพยานหลักฐานโจทก์ฟังไม่ได้ว่าจำเลยเป็นคนทำร้าย จึงพิพากษายกฟ้อง ต่อมาปรากฏว่าบาดแผลของผู้เสียห ายเข้าลักษณะอันตรายสาหัสตาม ม.297 ให้ท่านวินิจฉัยว่าการที่ผู้พิพากษาคนเดียวพิพากษายกฟ้องคดีนี้ชอบด้วยพระธรรมนูญศาลยุติธรรมหรือไม่</div>
        <div class="exsrc">โจทย์ฝึกอิงหลักการดูฐานความผิดที่โจทก์ขอให้ลงโทษเป็นเกณฑ์ (ม.25(5))</div>
        <button type="button" class="examToggle" onclick="toggleExamAns('exam-L1-1')">🔎 ดูเฉลย</button>
        <div class="examAns" id="exam-L1-1"><span class="exanslabel">✅ แนวคำตอบ</span><p>การพิพากษายกฟ้องของผู้พิพากษาคนเดียวชอบด้วยพระธรรมนูญศาลยุติธรรม เพราะการพิจารณาเขตอำนาจศาลและอำนาจผู้พิพากษาต้องถือตาม \"ฐานความผิดและอัตราโทษที่โจทก์ระบุมาในคำขอท้ายฟ้อง\" เป็นหลัก เมื่อพนักงานอัยการขอให้ลงโทษเพียงตาม ม.295 ซึ่งมีอัตราโทษจำคุกไม่เกิน 2 ปี ปรับไม่เกิน 40,000 บาท อันไม่เกินเกณฑ์ตามมาตรา 25(5) ผู้พิพากษาคนเดียวย่อมมีอำนาจพิจารณาพิพากษาคดีนี้ได้ทั้งการลงโทษและการยกฟ้อง แม้ข้อเท็จจริงที่ปรากฏภายหลังจะเข้าองค์ประกอบความผิดตาม ม.297 ซึ่งมีอัตราโทษเกินอำนาจ ก็ไม่ทำให้อำนาจที่มีอยู่เดิมเสียไป เพราะศาลพิพากษาได้ไม่เกินคำขอ (ต่างจากกรณีที่โจทก์ขอให้ลงโทษตามบทหนักที่เกินอำนาจมาตั้งแต่ต้น เช่น ม.365(3) ประกอบ ม.362 ซึ่งผู้พิพากษาคนเดียวจะไต่สวนมูลฟ้องหรือพิพากษาไม่ได้เลย)</p></div>
      </div>`},

    {heading:"7. การทำหน้าที่แทนผู้พิพากษา (เกริ่นนำ ม.28–31)",
     html:`
      <p>เมื่อผู้พิพากษาเจ้าของสำนวนหรือองค์คณะไม่อาจปฏิบัติหน้าที่ได้ (ป่วย เสียชีวิต ย้าย ถูกคัดค้าน) มีกลไกตาม <b>มาตรา 28–31</b> ให้ผู้มีอำนาจ (อธิบดี/ผู้พิพากษาหัวหน้าศาล) จ่ายสำนวนให้ผู้พิพากษาอื่น หรือเข้ามาทำหน้าที่แทน</p>
      <p>หัวใจที่ครั้งที่ 5 จะลงลึกคือ กฎหมาย<b>แยกเหตุขัดข้อง \"ระหว่างนั่งพิจารณา\" (ม.28) ออกจากเหตุขัดข้อง \"ในชั้นทำคำพิพากษา\" (ม.29)</b> เพราะผู้มีอำนาจให้ทำแทนและวิธีการแตกต่างกัน — ม.28 มอบหมายผู้พิพากษาคนใดก็ได้, ม.29 ผู้รับผิดชอบราชการศาลต้องลงชื่อทำคำพิพากษาเอง มอบหมายไม่ได้</p>`}
  ],
  cases:[

3: {
  n:3,
  navTitle:"อำนาจศาลชั้นต้น: คดีมี/ไม่มีทุนทรัพย์ + คำนวณทุนทรัพย์ + ม.19/1 + ศาลสูง",
  title:"อำนาจของศาลยุติธรรมต่าง ๆ (2) — คดีมี/ไม่มีทุนทรัพย์ · การคำนวณทุนทรัพย์ · คดีอาญาศาลแขวง · ม.19/1 · เขตอำนาจศาลสูง",
  date:"12 ม.ค. 69",
  lecturer:"อ.สรวิศ ลิมปรังษี",
  scope:"ครั้งที่หนักที่สุดของภาคพระธรรมนูญ — แบ่ง \"เค้กอำนาจ\" ระหว่างศาลแขวงกับศาลจังหวัด สอนเทคนิคแยกคดีมีทุนทรัพย์/ไม่มีทุนทรัพย์ (ออกสอบทุกปี ผ่านชุดฎีกากว่า 20 เรื่อง) การคำนวณทุนทรัพย์ (คำขอท้ายฟ้อง · ดอกเบี้ยถึงวันฟ้อง · สิทธิเฉพาะตัว · หนี้ร่วม · คดีสาขา) คดีอาญาศาลแขวง ม.25(5) การผ่อนคลายเขตอำนาจตาม ม.19/1 (แทน ม.16 ว.4 เดิม) และเขตอำนาจศาลอุทธรณ์/ศาลฎีกา",
  topics:[
    {heading:"1. ⭐ คดีมีทุนทรัพย์ vs ไม่มีทุนทรัพย์ — สูตรเดียวใช้ได้ทุกข้อ",
     html:`
      <p>ให้ดู <b>\"คำขอท้ายฟ้อง\"</b> เป็นหลัก แล้วถามตัวเองว่า <b>\"ถ้าชนะคดี โจทก์จะได้เงินหรือทรัพย์สินเพิ่มขึ้นใหม่มาเป็นของตนหรือไม่\"</b></p>
      <p><b>ถ้าใช่ = คดีมีทุนทรัพย์</b> (ปลดเปลื้องทุกข์อันอาจคำนวณเป็นราคาเงินได้) ต้องดูมูลค่าว่าเกิน 300,000 บาทหรือไม่เพื่อเลือกศาล ตัวอย่าง: ฟ้องเรียกเงินกู้ · ฟ้องค่าเสียหาย · <b>ฟ้องเพิกถอนการให้เพราะเนรคุณ</b> (ที่ดินโอนไปเป็นของจำเลยแล้ว ชนะแล้วได้กลับคืน) · <b>ฟ้องบังคับตามสัญญาจะซื้อจะขายให้โอนที่ดิน</b> · <b>ฟ้องไถ่ถอนการขายฝาก</b> (กรรมสิทธิ์อยู่ที่ผู้ซื้อฝากแล้ว ชนะแล้วได้คืน — <b>ฎ.1367/2494</b>) · <b>ฟ้องเรียกที่ดินมือเปล่า/สิทธิครอบครองคืน</b> เพราะสิทธิครอบครองก็เป็นทรัพย์สิน (<b>ฎ.459/2537</b>) · กรณีทะเบียนระบุว่าที่ดินเป็นทางสาธารณะแล้วต้องฟ้องให้กลับมาเป็นของตน (<b>ฎ.5543/2541</b>)</p>
      <p><b>ถ้าไม่ใช่ = คดีไม่มีทุนทรัพย์</b> (ปลดเปลื้องทุกข์อันไม่อาจคำนวณเป็นราคาเงินได้) <b>ต้องขึ้นศาลจังหวัดเสมอ ศาลแขวงรับไม่ได้ ไม่ว่าจำนวนเงินที่เกี่ยวข้องจะมากน้อยเพียงใด</b> ตัวอย่าง: <b>ฟ้องขับไล่ทั่วไป</b> (โจทก์เป็นเจ้าของอยู่แล้ว แค่ไล่คนออก — ยกเว้นค่าเช่าไม่เกินเดือนละ 30,000 บาทเข้าอำนาจศาลแขวงได้) · <b>ฟ้องเพิกถอนพินัยกรรมที่ไม่ชอบ</b> (ทายาทมีสิทธิในมรดกอยู่แล้ว เป็นการขจัดอุปสรรค ไม่ได้ก่อสิทธิใหม่) · <b>เพิกถอนการฉ้อฉล ม.237</b> (ทรัพย์กลับเข้ากองทรัพย์สินลูกหนี้ ไม่ใช่ของเจ้าหนี้) · <b>ฟ้องแบ่งแยกการครอบครองระหว่างเจ้าของรวม</b> (มีกรรมสิทธิ์ในทุกอณูอยู่แล้ว — <b>ฎ.4550/2540</b>) · <b>ฟ้องให้คืนโฉนด</b> ที่จำเลยยึดถือไว้ (บังคับสิทธิเหนือตัวกระดาษ กรรมสิทธิ์ที่ดินเป็นของโจทก์อยู่แล้ว — <b>ฎ.5070/2552</b>) · <b>ฟ้องห้ามใช้ชื่อทางการค้า</b> ที่คล้ายกัน ค่าเสียหายที่ขอมาเป็นเพียงคำขอรอง (<b>ฎ.846/2527</b>) · <b>คดีสถานะบุคคล</b> เช่น ขอเป็นคนสาบสูญ ขอตั้งผู้จัดการมรดก ขอให้เป็นคนไร้ความสามารถ</p>`},

    {heading:"2. ⭐ หลุมพราง — จำเลยต่อสู้เรื่องกรรมสิทธิ์ ทำให้คดีที่ดูไม่มีทุนทรัพย์กลายเป็นมีทุนทรัพย์",
     html:`
      <p>แม้คำขอท้ายฟ้องเดิมจะดูเป็นคดีไม่มีทุนทรัพย์ (เช่น ขอค่าเสียหาย ขอเพิกถอนคำคัดค้านการออกโฉนด) แต่ถ้า<b>จำเลยให้การต่อสู้แย่งกรรมสิทธิ์/สิทธิครอบครอง</b> ในตัวทรัพย์ ประเด็นแห่งคดีย่อมกลายเป็น \"ใครมีสิทธิในทรัพย์\" — ต้องคำนวณทุนทรัพย์จาก<b>ราคาประเมินของทรัพย์</b> ไม่ใช่ยอดเงินที่โจทก์เรียก</p>
      <p>ตัวอย่าง: ฟ้องขับไล่ + จำเลยสู้ว่าได้กรรมสิทธิ์โดยครอบครองปรปักษ์ → คิดทุนทรัพย์ตามราคาบ้านและที่ดิน (<b>ฎ.208/2507</b>, <b>ฎ.2020/2561</b>) · จำเลยปักป้ายประกาศห้ามโจทก์เข้าที่ดินและอ้างว่าเป็นของจำเลย = โต้แย้งกรรมสิทธิ์ชัดแจ้ง (<b>ฎ.411/2550</b>) · โจทก์ฟ้องเพิกถอนคำคัดค้านการออกโฉนด จำเลยฟ้องแย้งว่า น.ส.3 ออกทับที่ดินจำเลย → คิดตามราคาที่ดิน · <b>ข้อยกเว้นเดียว:</b> คำร้องขัดทรัพย์ในคดีของศาลแขวง ศาลแขวงพิจารณาได้แม้ทรัพย์ที่ยึดจะมีมูลค่าเกิน 300,000 บาท เพราะเป็น <b>\"คดีสาขา\"</b> ในชั้นบังคับคดีที่ต้องเสนอต่อศาลที่ออกหมายบังคับคดี ตาม ป.วิ.พ. ม.323, ม.7(2) (<b>ฎ.901/2511</b>)</p>`},

    {heading:"3. ทุนทรัพย์ผลสืบเนื่อง — คำขอสองส่วนในฟ้องเดียว (ฎ.13349/2557)",
     html:`
      <p>เมื่อฟ้องมีคำขอสองส่วน ส่วนหนึ่งมีทุนทรัพย์อยู่ในอำนาจศาลแขวง อีกส่วนหนึ่งไม่มีทุนทรัพย์ (ปกติต้องขึ้นศาลจังหวัด) แต่<b>ส่วนที่ไม่มีทุนทรัพย์เป็นผลสืบเนื่องโดยอัตโนมัติจากส่วนแรก</b> ศาลที่มีอำนาจในส่วนแรกย่อมพิจารณาได้ทั้งคดี</p>
      <p><b>ฎ.13349/2557:</b> ฟ้องเพิกถอนนิติกรรมขายที่ดินมรดกโดยฉ้อฉล ราคา 250,000 บาท (มีทุนทรัพย์ อยู่ในอำนาจศาลแขวง) + ขอให้กำจัดจำเลยที่ 1 มิให้รับมรดก (ไม่มีทุนทรัพย์) → การถูกกำจัดมิให้รับมรดกเป็น<b>ผลของกฎหมายที่เกิดสืบเนื่องอัตโนมัติ</b>จากการยักย้ายทรัพย์มรดกโดยฉ้อฉลในส่วนแรก ศาลแขวงจึงมีอำนาจสั่งได้ทั้งสองคำขอ</p>`},

    {heading:"4. ⭐ เทคนิคการคำนวณทุนทรัพย์ (จุดดักข้อสอบ)",
     html:`
      <ul>
        <li><b>ดูคำขอท้ายฟ้องเป็นหลัก:</b> เสียหายจริง 400,000 แต่ขอเพียง 300,000 เพื่อให้เข้าอำนาจศาลแขวง (forum shopping) ศาลยึดตามที่ขอจริง เพราะศาลพิพากษาเกินคำขอไม่ได้</li>
        <li><b>ดอกเบี้ย:</b> นับ<b>เงินต้น + ดอกเบี้ยค้างชำระถึงวันฟ้อง</b> รวมเป็นทุนทรัพย์เสมอ — เงินต้น 300,000 + ดอกเบี้ยถึงวันฟ้องอีกนิดเดียวก็เกินอำนาจศาลแขวงแล้ว (<b>ฎ.1619/2562</b>) ส่วน<b>ดอกเบี้ยนับแต่วันฟ้องเป็นต้นไป</b> (ดอกเบี้ยอนาคต) <b>ไม่นำมานับ</b></li>
        <li><b>สิทธิเฉพาะตัว:</b> โจทก์หลายคนได้รับความเสียหายจากเหตุเดียวกัน (เช่น รถชน) แต่สิทธิเรียกค่าเสียหายแยกเป็นของแต่ละคน → <b>แยกคำนวณทุนทรัพย์เป็นรายคน</b> ไม่รวมกัน (<b>ฎ.1525/2511</b>)</li>
        <li><b>หนี้ร่วม (เจ้าหนี้ฟ้องลูกหนี้ร่วม):</b> ฟ้องให้จำเลยหลายคนร่วมกันรับผิด 400,000 → ทุนทรัพย์ = 400,000 เต็มจำนวน หารเฉลี่ยไม่ได้ เพราะลูกหนี้ร่วมแต่ละคนต้องรับผิดเต็มจำนวน</li>
        <li><b>ไล่เบี้ยระหว่างลูกหนี้ร่วมกันเอง:</b> ต่างจากข้างบน — โจทก์ (ผู้ชำระหนี้แทน) ไล่เบี้ยเอาจากจำเลยที่ 1 จำนวน 300,000 และจำเลยที่ 2 จำนวน 200,000 → ความรับผิดแยกกันได้ <b>คำนวณทุนทรัพย์แยกรายคน</b> (<b>ฎ.7578/2538</b>)</li>
        <li><b>เจ้าของรวมฟ้องขอใส่ชื่อ/แบ่งที่ดิน + จำเลยสู้ว่าเป็นของตนคนเดียว:</b> คิดตาม<b>ราคาที่ดินทั้งแปลง</b> ไม่ใช่สัดส่วนที่โจทก์เรียก (<b>ฎ.5194/2537</b>, <b>ฎ.7158/2538</b>)</li>
        <li><b>สคบ. เป็นโจทก์ฟ้องแทนผู้บริโภคหลายราย:</b> แม้แต่ละรายไม่เกิน 300,000 แต่ให้ถือ<b>ยอดเงินรวมทั้งหมดในฟ้อง</b> (รถบรรทุกคันเดียว ดูน้ำหนักรวมทั้งคัน — <b>ฎ.7045/2553</b>)</li>
        <li><b>ฟ้องแย้ง:</b> เป็นคำฟ้องอีกฉบับ ต้องดูทุนทรัพย์ในตัวฟ้องแย้งเอง — ฟ้องเดิม 300,000 (ศาลแขวงรับได้) แต่ฟ้องแย้ง 400,000 (เกินอำนาจ) ศาลแขวงรับฟ้องแย้งไม่ได้ (<b>ฎ.651/2495</b>)</li>
        <li><b>เอาส่วนที่พิพาทจริง:</b> สัญญาแบ่งมรดกทั้งแปลง 5 ไร่ (2.5 ล้าน) แต่โอนขาดไปแค่ 100 ตร.ว. → ทุนทรัพย์ = ราคา 100 ตร.ว. = 25,000 บาท</li>
        <li><b>สิทธิการเช่า:</b> ฟ้องให้โอนสิทธิการเช่าที่ดินคืน คิดตาม<b>มูลค่าของสิทธิการเช่า</b> ไม่ใช่ยอดค่าเสียหายที่พ่วงมา — ถ้าเกิน 300,000 ศาลแขวงต้องไม่รับ และหากรับไว้พิจารณา กระบวนพิจารณา<b>ไม่ชอบทั้งหมด</b> ไม่ก่อสิทธิอุทธรณ์ฎีกา (<b>ฎ.7353/2560</b>)</li>
      </ul>`},

    {heading:"5. ⭐ คดีอาญาศาลแขวง (ม.25(5)) — ดูอัตราโทษอย่างสูงตามกฎหมาย",
     html:`
      <p>เกณฑ์: อัตราโทษอย่างสูง<b>จำคุกไม่เกิน 3 ปี หรือปรับไม่เกิน 60,000 บาท</b> — แต่ในการลงโทษจริงห้ามเกิน<b>จำคุก 6 เดือน หรือปรับ 10,000 บาท</b></p>
      <ul>
        <li><b>ลดมาตราส่วนโทษ (พยายาม/ผู้สนับสนุน):</b> <b>นำโทษที่ลดแล้ว (2 ใน 3) มาเช็คอำนาจ</b> — พยายามลักทรัพย์กลางคืน ม.335+80: 2/3 ของปรับ 100,000 = 66,666 บาท เกิน 60,000 → เกินอำนาจศาลแขวง</li>
        <li><b>เหตุลดโทษตามดุลพินิจ (ม.75/76 อายุ, ม.71 ผิดต่อบุพการี):</b> <b>ห้ามนำมาลดเพื่อเช็คอำนาจ</b> เพราะศาล \"จะลดหรือไม่ก็ได้\" ผลไม่แน่นอน — ยึดโทษปกติ</li>
        <li><b>เพิ่มโทษฐานไม่เข็ดหลาบ (ม.92/93):</b> <b>ไม่นำโทษส่วนที่เพิ่มมาคิด</b> เพราะเป็นผลจากพฤติการณ์ส่วนตัวในอดีต ไม่ทำให้ระดับความรุนแรงของฐานความผิดเปลี่ยน</li>
        <li><b>กรรมเดียวผิดหลายบท บทหนักเกินอำนาจ:</b> ศาลแขวงรับไม่ได้ทั้งคดี เช่น ยักยอก ม.352 (3 ปี — รับได้) + ม.354 (5 ปี — เกิน) → ต้องขึ้นศาลจังหวัด (<b>เทียบ ฎ.1351/2567</b>)</li>
        <li><b>กฎหมายภายหลังเพิ่มโทษ:</b> ใช้<b>กฎหมายที่เป็นคุณแก่จำเลย</b> — ถ้าขณะกระทำผิดอัตราโทษไม่เกินอำนาจศาลแขวง แม้ภายหลังแก้เพิ่มโทษ ก็ยังอยู่ในอำนาจศาลแขวง (<b>เทียบ ฎ.4212/2562</b>)</li>
        <li><b>ข้อจำกัดลงโทษ (วรรคท้าย) เป็นเรื่อง \"อำนาจลงโทษของผู้พิพากษาคนเดียว\" ไม่ใช่ \"เขตอำนาจศาล\":</b> หากผู้พิพากษาคนเดียวเห็นควรลงโทษหนักกว่านั้น ใช้วิธี ม.31(2) ประกอบ ม.29 ให้ผู้พิพากษาหัวหน้าศาลตรวจสำนวนและร่วมลงชื่อ</li>
      </ul>`},

    {heading:"6. คดีแพ่งเกี่ยวเนื่องกับคดีอาญา / คดีสาขา — ข้อยกเว้นทุนทรัพย์",
     html:`
      <p>เมื่อศาลแขวงมีอำนาจในคดีอาญาหลักอยู่แล้ว ย่อมมีอำนาจพิจารณา<b>ส่วนแพ่งที่พ่วงมาได้แม้เกิน 300,000 บาท</b> เพราะเจตนารมณ์คือ \"อำนวยความสะดวกแก่ผู้เสียหาย\"</p>
      <ul>
        <li><b>อัยการขอให้คืน/ใช้ราคาทรัพย์ตาม ป.วิ.อ. ม.43</b> (เช่น ลักทรัพย์ 400,000) → ศาลแขวงพิจารณาได้ (<b>ฎ.4419/2528</b>)</li>
        <li><b>ผู้เสียหายยื่นคำร้องเรียกค่าสินไหมทดแทนตาม ป.วิ.อ. ม.44/1</b> (400,000) → ศาลแขวงพิจารณาได้ (<b>ฎ.10197/2556</b>) รวมถึงกรณีผู้เสียหายเป็นโจทก์ฟ้องเอง</li>
        <li><b>ขอคืนของกลางมูลค่า 350,000</b> ในคดีอาญาของศาลแขวง = คดีสาขา ศาลแขวงพิจารณาได้</li>
        <li><b>⚠️ แต่ถ้าคดีอาญาถูกยกฟ้องไปก่อน</b> (เช่น ไต่สวนมูลฟ้องแล้วยกฟ้องคดีหมิ่นประมาท) เหลือแต่ส่วนแพ่ง 400,000 ลำพัง → ศาลแขวง<b>ไม่มีอำนาจ</b>รับส่วนแพ่งไว้ต่อ (รถหัวลากถูกถอด รถพ่วงใหญ่จอดลำพังไม่ได้ — <b>ฎ.1162/2564</b>)</li>
      </ul>`},

    {heading:"7. ⭐ ม.19/1 — ผ่อนคลายเขตอำนาจศาลจังหวัด/ศาลแขวง (แทน ม.16 ว.4 เดิม)",
     html:`
      <p><b>กฎหมายเดิม (ม.16 ว.4):</b> ถ้าคดีศาลแขวงไปฟ้องศาลจังหวัด ศาลจังหวัด \"ต้อง\" สั่งโอนไปศาลแขวงอย่างเคร่งครัด ทำให้ต้องโอนสำนวนไปมาเป็นภาระ</p>
      <p><b>ม.19/1 วรรคหนึ่ง (ตอนฟ้อง):</b> คดีที่อยู่ในอำนาจศาลแขวง หากยื่นฟ้องต่อศาลแพ่ง/ศาลอาญา/ศาลจังหวัด → <b>อยู่ในดุลพินิจของศาลใหญ่ที่จะรับไว้พิจารณาเองหรือสั่งโอนไปศาลแขวงก็ได้</b> และเมื่อสั่งรับฟ้องไว้แล้วให้พิจารณาต่อไป (โรงพยาบาลศูนย์รับคนไข้อาการเบาไว้เองได้) — ใช้กับกรณีฟ้องรวมหลายข้อหา/หลายกรรมที่บางส่วนอยู่ในอำนาจศาลแขวงด้วย (<b>ฎ.7497–7502/2561</b>)</p>
      <p><b>ม.19/1 วรรคสอง (พฤติการณ์เปลี่ยนระหว่างพิจารณา):</b> ขณะฟ้องเป็นคดีในอำนาจศาลจังหวัดอยู่แล้ว แม้ต่อมาพฤติการณ์เปลี่ยนจนกลายเป็นคดีศาลแขวง → <b>ศาลจังหวัดพิจารณาต่อไปจนจบ จะสั่งโอนไม่ได้</b> เช่น ฟ้องหมิ่นประมาทด้วยการโฆษณา (ม.328) ที่ศาลจังหวัด แต่ไต่สวนแล้วประทับฟ้องเฉพาะหมิ่นประมาทธรรมดา (ม.326) (<b>ฎ.2817/2556</b>)</p>
      <p><b>เทียบ ป.วิ.พ. ม.173(2):</b> เมื่อศาลรับฟ้องโดยชอบแล้ว แม้ภายหลังมีเหตุเปลี่ยนแปลงพฤติการณ์ (จำเลยย้ายภูมิลำเนา / โจทก์แก้ฟ้องจากขอโอนที่ดินเป็นขอค่าเสียหาย) ก็ไม่ตัดอำนาจศาลเดิม (<b>ฎ.8036/2561</b>)</p>`},

    {heading:"8. Class Action (ม.222/3) — ห้ามฟ้องศาลแขวงเด็ดขาด",
     html:`
      <p><b>การดำเนินคดีแบบกลุ่ม</b>ตาม ป.วิ.พ. ภาค 2 ลักษณะ 2 หมวด 4 (ม.222/1–222/49) <b>มาตรา 222/3</b> ให้ศาลที่มีอำนาจพิจารณาคดีแพ่งตามพระธรรมนูญฯ มีอำนาจดำเนินคดีแบบกลุ่ม <b>ยกเว้นศาลแขวง</b> เพราะเมื่อรวมทุนทรัพย์ของสมาชิกกลุ่มทั้งหมดแล้วมักมีมูลค่ามหาศาล ไม่เหมาะให้ผู้พิพากษาคนเดียวพิจารณา แม้ทุนทรัพย์ของผู้เริ่มคดีรายเดียวจะไม่เกิน 300,000 บาทก็ตาม</p>`},

    {heading:"9. เขตอำนาจศาลอุทธรณ์ (ม.22) และศาลฎีกา (ม.23)",
     html:`
      <p><b>ศาลอุทธรณ์ (ม.22)</b> มี 2 บทบาท: <b>(1) อำนาจพิจารณาอุทธรณ์จากศาลล่าง</b> (Appellate) — พิพากษายืน / แก้ / กลับ / ยก คำพิพากษาศาลชั้นต้น รวมถึงคดีที่ ป.วิ.อ. ม.245 วรรคสอง <b>บังคับ</b>ให้ศาลชั้นต้นส่งสำนวนคดีที่ลงโทษ<b>ประหารชีวิตหรือจำคุกตลอดชีวิต</b>ขึ้นมาตรวจเสมอแม้ไม่มีใครอุทธรณ์ (คำพิพากษายังไม่ถึงที่สุดจนกว่าศาลอุทธรณ์จะพิพากษายืน) <b>(2) อำนาจพิจารณาคดีเป็นครั้งแรก</b> (Original) เช่น อุทธรณ์คำวินิจฉัยคณะกรรมการค่าตอบแทนผู้เสียหายในคดีอาญา (พ.ร.บ. 2544 ม.25 — ยื่นตรงภายใน 30 วัน คำวินิจฉัยศาลอุทธรณ์เป็นที่สุด) และคดี<b>เลือกตั้งท้องถิ่น</b> (อบต./อบจ./เทศบาล) ตาม พ.ร.บ. เลือกตั้งสมาชิกสภาท้องถิ่นฯ พ.ศ. 2562</p>
      <p><b>ศาลฎีกา (ม.23)</b> รับคดีที่รัฐธรรมนูญ/กฎหมายให้เสนอตรงได้ เช่น <b>คดีเลือกตั้งระดับชาติ (ส.ส./ส.ว.)</b> และคดีอุทธรณ์/ฎีกาคำพิพากษาศาลล่าง ศาลฎีกามีอำนาจ <b>\"ไม่รับคดีไว้พิจารณา\"</b> หากเห็นว่าข้อกฎหมาย/ข้อเท็จจริงที่ยกขึ้นมาไม่เป็นสาระอันควรแก่การพิจารณา (<b>ฎ.13605/2558</b>) — เป็นกลไกกรองปริมาณคดี</p>
      <p><b>ศาลฎีกาแผนกคดีอาญาของผู้ดำรงตำแหน่งทางการเมือง:</b> รธน. 2540 พิจารณาชั้นเดียว องค์คณะ 9 คน → ถูกค้านว่าขัด ICCPR → รธน. 2560 เปิดให้<b>อุทธรณ์ต่อที่ประชุมใหญ่ศาลฎีกาได้ภายใน 30 วัน</b> ทั้งข้อเท็จจริงและข้อกฎหมาย โดยองค์คณะวินิจฉัยอุทธรณ์ 9 คนที่เลือกใหม่รายคดี ทั้งนี้หากพิพากษาให้พ้นจากตำแหน่ง มีผลทันทีตั้งแต่วันอ่านคำพิพากษา</p>
      <div class="examBox"><div class="exlabel">📝 โจทย์ฝึกจากหลักในคำบรรยาย</div>
        <div class="exq">โจทก์ฟ้องจำเลยต่อศาลแขวงดุสิต ขอให้จำเลยชำระค่าเสียหายจากมูลละเมิดเป็นเงิน 290,000 บาท พร้อมดอกเบี้ยอัตราร้อยละ 7.5 ต่อปี นับแต่วันทำละเมิด (ก่อนฟ้อง 2 ปี) จนกว่าจะชำระเสร็จ ศาลแขวงดุสิตมีอำนาจรับฟ้องคดีนี้ไว้พิจารณาหรือไม่</div>
        <div class="exsrc">โจทย์ฝึกอิงหลักการคำนวณทุนทรัพย์รวมดอกเบี้ยถึงวันฟ้อง (แนว ฎ.1619/2562)</div>
        <button type="button" class="examToggle" onclick="toggleExamAns('exam-L3-1')">🔎 ดูเฉลย</button>
        <div class="examAns" id="exam-L3-1"><span class="exanslabel">✅ แนวคำตอบ</span><p>ศาลแขวงดุสิตไม่มีอำนาจรับฟ้องคดีนี้ไว้พิจารณา เพราะการคำนวณ \"จำนวนเงินที่ฟ้อง\" อันถือเป็นทุนทรัพย์เพื่อกำหนดเขตอำนาจศาลตามพระธรรมนูญศาลยุติธรรม มาตรา 17 ประกอบมาตรา 25(4) จะต้องนำเงินต้นรวมกับดอกเบี้ยที่ค้างชำระนับถึงวันฟ้องมารวมคำนวณด้วยเสมอ เมื่อเงินต้น 290,000 บาท บวกดอกเบี้ยร้อยละ 7.5 ต่อปี เป็นเวลา 2 ปี (ประมาณ 43,500 บาท) ยอดรวมทุนทรัพย์ที่โจทก์เรียกร้องในศาลชั้นต้นย่อมเกินกว่า 300,000 บาท จึงเกินอำนาจพิจารณาพิพากษาของศาลแขวง ส่วนดอกเบี้ยที่ขอนับแต่วันฟ้องเป็นต้นไปนั้นเป็นดอกเบี้ยในอนาคตซึ่งไม่นำมารวมคำนวณ ศาลแขวงดุสิตต้องสั่งไม่รับฟ้องเพื่อให้โจทก์ไปฟ้องต่อศาลแพ่งหรือศาลจังหวัดที่มีเขตอำนาจ หากศาลแขวงรับฟ้องและพิจารณาพิพากษาไป กระบวนพิจารณาย่อมไม่ชอบด้วยกฎหมายทั้งหมดตามแนว ฎ.1619/2562 และ ฎ.7353/2560</p></div>
      </div>`}
  ],
  cases:[
    {cite:"ฎ.13349/2557", article:"พธน. ม.17+25(4)", note:"เพิกถอนนิติกรรมฉ้อฉลที่ดินมรดก 250,000 (มีทุนทรัพย์) + ขอกำจัดมิให้รับมรดก (ไม่มีทุนทรัพย์) → กำจัดมรดกเป็นผลสืบเนื่องอัตโนมัติ ศาลแขวงพิจารณาได้ทั้งคดี"},
    {cite:"ฎ.1619/2562", article:"พธน. ม.17+25(4)", note:"ฟ้องเรียก 300,000 + ดอกเบี้ยนับแต่วันละเมิดถึงวันฟ้อง → ทุนทรัพย์เกิน 300,000 ศาลแขวงต้องสั่งไม่รับฟ้อง การรับฟ้องและพิพากษาไม่ชอบ"},
    {cite:"ฎ.7353/2560", article:"พธน. ม.17+25(4)", note:"ฟ้องให้โอนสิทธิการเช่าที่ดิน+อาคารคืน มูลค่ารวมกว่า 1.4 ล้าน → เกินอำนาจศาลแขวง กระบวนพิจารณาตั้งแต่รับฟ้องไม่ชอบ ไม่ก่อสิทธิอุทธรณ์ฎีกา"},

    {cite:"ฎ.459/2537", article:"", note:"ฟ้องเรียกที่ดินมือเปล่า/สิทธิครอบครองคืน → มีทุนทรัพย์ เพราะสิทธิครอบครองเป็นทรัพย์สิน"},
    {cite:"ฎ.5543/2541", article:"", note:"ทะเบียนระบุที่ดินเป็นทางสาธารณะ โจทก์ฟ้องขอเปลี่ยนกลับเป็นของตน → มีทุนทรัพย์"},

    {cite:"ฎ.846/2527", article:"", note:"ฟ้องห้ามใช้ชื่อสถานประกอบการค้าที่คล้ายกัน + เรียกค่าเสียหาย → ประเด็นหลักคือสิทธิในชื่อ ค่าเสียหายเป็นคำขอรอง = ไม่มีทุนทรัพย์"},
    {cite:"ฎ.4550/2540", article:"", note:"เจ้าของรวมฟ้องแบ่งแยกการครอบครองเป็นส่วนสัด → ไม่มีทุนทรัพย์ เพราะมีกรรมสิทธิ์ในทุกอณูอยู่แล้ว"},

    {cite:"ฎ.208/2507 / ฎ.2020/2561", article:"", note:"ฟ้องขับไล่+เรียกค่าเสียหาย จำเลยสู้ว่าได้กรรมสิทธิ์โดยครอบครองปรปักษ์ → คิดทุนทรัพย์ตามราคาที่ดินและสิ่งปลูกสร้าง ไม่ใช่ยอดค่าเสียหาย"},
    {cite:"ฎ.901/2511", article:"ป.วิ.พ. ม.7(2), 323", note:"คำร้องขัดทรัพย์ในคดีของศาลแขวง (ทรัพย์ที่ยึด 500,000) → ศาลแขวงพิจารณาได้ เพราะเป็นคดีสาขาในชั้นบังคับคดี"},
    {cite:"ฎ.1525/2511", article:"", note:"โจทก์ 3 คนฟ้องเรียกค่าเสียหายจากเหตุรถชนเดียวกัน → สิทธิเฉพาะตัว แยกคำนวณทุนทรัพย์เป็นรายคน"},
    {cite:"ฎ.7578/2538", article:"", note:"ลูกหนี้ร่วมไล่เบี้ยกันเอง (จำเลยที่ 1 = 300,000, จำเลยที่ 2 = 200,000) → แยกคำนวณทุนทรัพย์รายคน อยู่ในอำนาจศาลแขวง"},
    {cite:"ฎ.5194/2537 / ฎ.7158/2538", article:"", note:"เจ้าของรวมฟ้องขอใส่ชื่อ/แบ่งที่ดิน จำเลยสู้ว่าเป็นของตนคนเดียว → คิดตามราคาที่ดินทั้งแปลง (800,000) เกินอำนาจศาลแขวง"},
    {cite:"ฎ.7045/2553", article:"", note:"สคบ. ฟ้องแทนผู้บริโภคหลายราย แต่ละรายไม่เกิน 300,000 → ให้ถือยอดเงินรวมทั้งฟ้อง (610,709.75) เกินอำนาจศาลแขวง"},
    {cite:"ฎ.651/2495", article:"", note:"ฟ้องเดิม 300,000 (ศาลแขวงรับได้) + ฟ้องแย้ง 400,000 → ฟ้องแย้งเป็นคำฟ้องอีกฉบับ ทุนทรัพย์เกินอำนาจ ศาลแขวงรับฟ้องแย้งไม่ได้"},
    {cite:"ฎ.1351/2567 (เทียบ)", article:"พธน. ม.25(5)", note:"ฟ้องยักยอก ม.352 (อยู่ในอำนาจ) + ม.354 (โทษ 5 ปี เกินอำนาจ) กรรมเดียวผิดหลายบท → ศาลแขวงรับไม่ได้ทั้งคดี"},
    {cite:"ฎ.4212/2562 (เทียบ)", article:"พธน. ม.25(5)", note:"กฎหมายภายหลังเพิ่มโทษเกินเพดานศาลแขวง → ใช้กฎหมายเดิมที่เป็นคุณ คดียังอยู่ในอำนาจศาลแขวง"},
    {cite:"ฎ.4419/2528", article:"ป.วิ.อ. ม.43", note:"อัยการฟ้องลักทรัพย์ + ขอให้ใช้ราคาทรัพย์ 400,000 → ศาลแขวงพิจารณาส่วนแพ่งได้แม้เกิน 300,000"},
    {cite:"ฎ.10197/2556", article:"ป.วิ.อ. ม.44/1", note:"ผู้เสียหายยื่นคำร้องเรียกค่าสินไหมทดแทน 400,000 ในคดีอาญาของศาลแขวง → ศาลแขวงพิจารณาได้"},
    {cite:"ฎ.1162/2564", article:"พธน. ม.25(4)", note:"ผู้เสียหายฟ้องอาญา+แพ่ง 400,000 ที่ศาลแขวง ศาลไต่สวนมูลฟ้องแล้วยกฟ้องอาญา → ศาลแขวงไม่มีอำนาจรับส่วนแพ่งไว้ต่อลำพัง"},
    {cite:"ฎ.2817/2556", article:"พธน. ม.19/1 ว.2", note:"ฟ้อง ม.328 ที่ศาลจังหวัด ไต่สวนแล้วประทับฟ้องเฉพาะ ม.326 (อำนาจศาลแขวง) → พฤติการณ์เปลี่ยน ศาลจังหวัดพิจารณาต่อจนจบ โอนไม่ได้"},
    {cite:"ฎ.7497–7502/2561", article:"พธน. ม.19/1 ว.1", note:"อัยการฟ้องหลายกรรมที่ศาลจังหวัดพัทยา บางข้อหาอยู่ในอำนาจศาลแขวง → ศาลจังหวัดมีดุลพินิจรับพิจารณาไว้เองได้"},
    {cite:"ฎ.8036/2561", article:"ป.วิ.พ. ม.173(2)", note:"ฟ้องขอโอนที่ดิน จำเลยโอนให้บุคคลภายนอกระหว่างพิจารณา โจทก์แก้ฟ้องเป็นเรียกค่าเสียหาย → ศาลเดิมพิจารณาต่อได้ แม้ฐานเขตศาลเปลี่ยน"},
    {cite:"ฎ.13605/2558", article:"พธน. ม.23 ว.1", note:"ฎีกาปัญหาข้อกฎหมายที่ศาลอุทธรณ์วินิจฉัยถูกต้องแล้ว → ศาลฎีกาไม่รับคดีไว้พิจารณา (ไม่เป็นสาระอันควรแก่การพิจารณา)"},
    {cite:"ป.วิ.อ. ม.245 ว.2 + พธน. ม.22(1)", article:"", note:"คดีลงโทษประหารชีวิต/จำคุกตลอดชีวิต ศาลชั้นต้นต้องส่งสำนวนให้ศาลอุทธรณ์ตรวจเสมอแม้ไม่มีอุทธรณ์ คำพิพากษายังไม่ถึงที่สุดจนศาลอุทธรณ์พิพากษายืน"}
  ]
},

5: {
  n:5,
  navTitle:"อำนาจผู้พิพากษา: ม.24–25 · องค์คณะ ม.26 · ทำการแทน ม.28–33",
  title:"อำนาจของผู้พิพากษา (3) — ม.24 / ม.25 · ผู้พิพากษาประจำศาล–อาวุโส–สมทบ · องค์คณะ ม.26 · การทำการแทน ม.28–31 · จ่าย/เรียกคืนสำนวน ม.32–33",
  date:"19 ม.ค. 69",
  lecturer:"อ.สรวิศ ลิมปรังษี",
  scope:"เจาะอำนาจ \"ตัวผู้พิพากษา\" — เส้นแบ่งคำสั่งที่ผู้พิพากษาคนเดียวสั่งได้ (ไม่ชี้ขาดข้อพิพาท ม.24) กับที่สั่งไม่ได้ (ชี้ขาดข้อพิพาท เช่น ร้องขัดทรัพย์/เฉลี่ยทรัพย์/ขอคืนของกลาง) อำนาจตาม ม.25 (5 อนุมาตรา + ข้อจำกัดลงโทษ) ข้อจำกัดผู้พิพากษาประจำศาล/อาวุโส/สมทบ องค์คณะตาม ม.26 และหัวใจที่ออกสอบบ่อย — การทำการแทนเมื่อเกิดเหตุ \"ระหว่างนั่งพิจารณา\" (ม.28 มอบหมายได้) vs \"ชั้นทำคำพิพากษา\" (ม.29 หัวหน้าศาลลงชื่อเอง)",
  topics:[
    {heading:"1. ⭐ ม.24 — อำนาจผู้พิพากษาคนเดียว \"ทุกชั้นศาล\"",
     html:`
      <p><b>มาตรา 24 ใช้ได้ทุกชั้นศาล</b> (ชั้นต้น อุทธรณ์ ฎีกา) ต่างจาก ม.25 ที่ใช้เฉพาะศาลชั้นต้น</p>
      <p><b>ม.24(1) — ออกหมาย:</b> หมายตาม ป.วิ.พ. เช่น หมายเรียกเข้าแทนที่ผู้มรณะ (ม.42) หมายเรียกผู้ร้องสอด (ม.57(3)) หมายเรียกให้จำเลยแก้คดี (ม.173) หมายเรียกพยาน (ม.106) · หมายตาม ป.วิ.อ. เช่น หมายเรียกบุคคล (ม.52) หมายอาญา (ม.58 — หมายจับ ค้น ขัง จำคุก ปล่อย) หมายเรียกจำเลย (ม.169)</p>
      <p><b>ม.24(2) — ออกคำสั่งใด ๆ ซึ่ง \"มิใช่การวินิจฉัยชี้ขาดข้อพิพาทแห่งคดี\":</b> คำถามหลักคือคำสั่งนั้นกระทบผลแพ้ชนะในเนื้อหาหลักหรือไม่ ถ้าไม่ ผู้พิพากษาคนเดียวสั่งได้เสมอไม่ว่าคดีใหญ่แค่ไหน เช่น
      <br>• สั่ง<b>ไม่รับฟ้อง/ไม่ประทับฟ้องเพราะฟ้องผิดเขตอำนาจศาล</b> (ยังไม่ตัดสินเนื้อหา)
      <br>• สั่ง<b>งดสืบพยานเพราะประวิงคดี</b>
      <br>• สั่ง<b>ลงโทษฐานละเมิดอำนาจศาล</b> (เช่น ปรับ 500 บาท)
      <br>• <b>ยกคำร้องขอออกหมายจับเพราะคดีขาดอายุความ</b> — อาศัย ม.24(1) ประกอบ ป.วิ.อ. ม.68 (หมายจับใช้ได้จนกว่าจะขาดอายุความ) เป็นการตรวจเงื่อนไขการออกหมาย ไม่ใช่ตัดสินว่าจำเลยผิดจริงหรือไม่</p>`},

    {heading:"2. ⭐ สิ่งที่ผู้พิพากษาคนเดียว \"สั่งไม่ได้\" — เพราะเป็นการวินิจฉัยชี้ขาดข้อพิพาท",
     html:`
      <p>แม้จะอยู่ในรูป \"คำร้อง\" ในชั้นบังคับคดี แต่ถ้าเป็นการชี้ขาดสิทธิ ถือเป็นการวินิจฉัยชี้ขาดข้อพิพาท <b>ในศาลจังหวัดต้องใช้องค์คณะ 2 คนเสมอ</b> (ม.26) ผู้พิพากษาคนเดียวสั่งไม่ได้</p>
      <ul>
        <li><b>ยกคำร้องขัดทรัพย์</b> (ชี้กรรมสิทธิ์ในทรัพย์ที่ยึด) — <b>ฎ.125/2526</b></li>
        <li><b>ยกคำร้องขอคืนของกลาง / ขอปล่อยทรัพย์</b> (ต้องชี้ว่าผู้ร้องเป็นเจ้าของจริงและรู้เห็นเป็นใจหรือไม่)</li>
        <li><b>ยกคำร้องขอเฉลี่ยทรัพย์</b> (เป็นคดีสาขาเอกเทศ) — <b>ฎ.3977/2553</b></li>
        <li><b>ยกคำร้องของผู้อ้างว่าไม่ใช่บริวาร</b> เพราะครอบครองปรปักษ์จนได้กรรมสิทธิ์</li>
        <li><b>คำร้องขอกำหนดโทษใหม่</b> (เช่น ตามประมวลกฎหมายยาเสพติดใหม่) เป็นการวินิจฉัยเนื้อหาโทษ — <b>ฎ.3374/2566</b></li>
      </ul>
      <p><b>ข้อยกเว้น:</b> ถ้าเป็น <b>คดีสาขาของศาลแขวง</b> ที่มาพิจารณาในศาลจังหวัด (เช่น ท้องที่ไม่มีศาลแขวง และคดีอาญาหลักอยู่ในอำนาจผู้พิพากษาคนเดียวตาม ม.25(5)) ผู้พิพากษาคนเดียวสั่งคำร้องขอคืนของกลางได้ แม้ของกลางมูลค่า 350,000 บาท (<b>ฎ.2345/2562</b>)</p>`},

    {heading:"3. ⭐ ม.25 — อำนาจผู้พิพากษาคนเดียว \"เฉพาะศาลชั้นต้น\" (5 อนุมาตรา)",
     html:`
      <p><b>ม.25 ใช้เฉพาะศาลชั้นต้น</b> ในศาลสูงต้องทำในรูปองค์คณะของแต่ละศาล</p>
      <ul>
        <li><b>(1) ไต่สวนและวินิจฉัยชี้ขาดคำร้อง/คำขอที่ยื่นต่อศาลในคดีทั้งปวง</b> เช่น คำร้องขอยกเว้นค่าธรรมเนียมศาล (ขออนาถาเดิม)</li>
        <li><b>(2) ไต่สวนและมีคำสั่งเกี่ยวกับวิธีการเพื่อความปลอดภัย</b> (ป.อ. ม.39 — กักกัน ห้ามเข้าเขตกำหนด เรียกประกันทัณฑ์บน คุมตัวไว้ในสถานพยาบาล ห้ามประกอบอาชีพบางอย่าง)</li>
        <li><b>(3) ไต่สวนมูลฟ้องและมีคำสั่งในคดีอาญา</b> — สั่ง <b>\"ประทับรับฟ้อง\"</b> ได้เสมอแม้อัตราโทษเกินอำนาจตาม (5) เช่นคดี ม.297 (สาหัส) เพราะยังไม่ชี้ขาดคดี แต่ถ้าจะ <b>\"พิพากษายกฟ้อง\"</b> ต้องดูว่าคดีนั้นเกินอำนาจตาม (5) หรือไม่ (ถ้าเกิน ยกฟ้องคนเดียวไม่ได้) · กรณีโจทก์ไม่มาศาลในวันนัดไต่สวนมูลฟ้อง ต้องยกฟ้องตาม ป.วิ.อ. ม.166 วรรคหนึ่ง</li>
        <li><b>(4) พิจารณาพิพากษาคดีแพ่งทุนทรัพย์ไม่เกิน 300,000 บาท</b> (ขยายได้โดยพระราชกฤษฎีกา)</li>
        <li><b>(5) พิจารณาพิพากษาคดีอาญาอัตราโทษอย่างสูงจำคุกไม่เกิน 3 ปี หรือปรับไม่เกิน 60,000 บาท</b></li>
      </ul>`},

    {heading:"4. ⭐ ข้อจำกัดการลงโทษของผู้พิพากษาคนเดียว (ม.25(5) วรรคท้าย)",
     html:`
      <p>แม้รับคดีได้ตาม (5) แต่ในการลงโทษจริง <b>ห้ามลงโทษจำคุกเกิน 6 เดือน หรือปรับเกิน 10,000 บาท</b></p>
      <ul>
        <li><b>รอการลงโทษก็ไม่ได้:</b> พิพากษาจำคุก 1 ปี ให้รอลงโทษ 2 ปี — ทำไม่ได้ เพราะโทษ 1 ปีอาจกลับมามีผลจริงในอนาคต (<b>ฎ.5943/2548</b>)</li>
        <li><b>ยกฟ้องคดีที่อัตราโทษเกินอำนาจก็ไม่ได้:</b> ฟ้อง ม.326 + ม.328 (ปรับสูงถึง 200,000) ผู้พิพากษาคนเดียวพิพากษายกฟ้องไม่ได้ แม้ไม่มีการลงโทษ (<b>ฎ.7651/2552</b>)</li>
        <li><b>บวกโทษจำคุกที่รอไว้ในคดีก่อน (6 เดือน) เข้ากับโทษคดีนี้ (6 เดือน) รวม 12 เดือน — ทำได้</b> เพราะโทษคดีก่อนศาลกำหนดไว้โดยชอบแล้ว ไม่ใช่ผู้พิพากษาคนเดียวพิพากษาเกิน 6 เดือนในคดีนี้</li>
        <li><b>หลายกรรมต่างกัน เรียงกระทงละ 6 เดือน รวม 18 เดือน — ทำได้</b> ดู <b>\"โทษสุทธิรายกระทง\"</b> ไม่ใช่ยอดรวม</li>
        <li><b>คำสั่งกักกันที่ต่อยอดจากโทษจำคุก 7 เดือน (เกินอำนาจ) — ไม่ชอบไปด้วย</b></li>
      </ul>`},

    {heading:"5. ผู้พิพากษาประจำศาล / ผู้พิพากษาอาวุโส / ผู้พิพากษาสมทบ",
     html:`
      <p><b>ผู้ช่วยผู้พิพากษา</b> ไม่มีอำนาจพิจารณาพิพากษาคดีและทำคำสั่งใด ๆ</p>
      <p><b>ผู้พิพากษาประจำศาล</b> (ผ่านผู้ช่วยฯ มาแล้วแต่ประสบการณ์ยังน้อย) ตาม <b>ม.25 วรรคสอง ไม่มีอำนาจตาม (3) (4) (5)</b> — ห้ามไต่สวนมูลฟ้อง ห้ามพิจารณาพิพากษาคดีแพ่ง/อาญาโดยลำพัง ต้องอยู่ในองค์คณะเสมอ (การไต่สวนมูลฟ้องและประทับฟ้องคดีอาญาโดยผู้พิพากษาประจำศาลคนเดียว = ไม่ชอบด้วยกฎหมาย)</p>
      <p><b>ผู้พิพากษาอาวุโส</b> (อายุ 60 ปีขึ้นไป ดำรงตำแหน่งมาแล้ว 20 ปี) มีอำนาจพิจารณาพิพากษาคดีได้เต็มที่เหมือนผู้พิพากษาทั่วไป <b>แต่ห้ามดำรงตำแหน่งบริหาร</b> (หัวหน้าศาล/ผู้รับผิดชอบราชการศาล) และ<b>ห้ามเป็นผู้ทำการแทน</b>ในการลงชื่อร่วมทำคำพิพากษาตาม ม.29</p>
      <p><b>ผู้พิพากษาสมทบ:</b> คดีร้องขอคืนของกลางในศาลเยาวชนและครอบครัว แม้สืบเนื่องจากคดีที่เด็ก/เยาวชนกระทำผิด แต่เป็นเพียง <b>\"คดีสาขา\"</b> ระหว่างโจทก์กับผู้ร้อง ไม่แตะเนื้อหาคดีเด็ก/เยาวชน จึง<b>ไม่ต้องมีผู้พิพากษาสมทบ</b>ร่วมองค์คณะ ผู้พิพากษาอาชีพ 2 คนเป็นองค์คณะได้ (<b>ฎ.1291/2562</b>)</p>`},

    {heading:"6. องค์คณะผู้พิพากษา (ม.26) และผลของการนั่งพิจารณาไม่ครบองค์คณะ",
     html:`
      <p><b>ม.26:</b> ศาลชั้นต้น (นอกจากศาลแขวง) ต้องมีผู้พิพากษา<b>อย่างน้อย 2 คน และต้องไม่เป็นผู้พิพากษาประจำศาลเกิน 1 คน</b> จึงเป็นองค์คณะที่มีอำนาจพิจารณาพิพากษาคดีแพ่งหรืออาญาทั้งปวง</p>
      <p><b>นั่งพิจารณาไม่ครบองค์คณะ = \"กระบวนพิจารณาที่ผิดระเบียบ\"</b> ตาม ป.วิ.พ. ม.27 คู่ความที่เสียหายต้องยื่นคำร้องคัดค้าน<b>ภายใน 8 วัน</b>นับแต่ทราบ มิฉะนั้นหมดสิทธิ (เรื่ององค์คณะไม่ครบ \"เห็นด้วยตาเปล่า\" อยู่แล้ว จะรอฟังผลแพ้ชนะแล้วค่อยโวยไม่ได้ — <b>ฎ.8435/2559</b>)</p>
      <p><b>องค์คณะไม่ครบเฉพาะชั้น \"ทำคำพิพากษา\"</b> (ลงลายมือชื่อไม่ครบ) มีผลให้เฉพาะคำพิพากษาและกระบวนพิจารณาหลังจากนั้นไม่ชอบ <b>ไม่ทำให้กระบวนพิจารณาก่อนหน้า (เช่น การสืบพยาน) เสียไป</b> — แก้โดยจัดทำคำพิพากษาใหม่ให้ครบองค์คณะ ณ จุดที่ผิด ไม่ต้องย้อนไปสืบพยานใหม่ (<b>ฎ.3988/2559</b>)</p>`},

    {heading:"7. ⭐ การทำการแทนองค์คณะ — \"ระหว่างนั่งพิจารณา\" (ม.28) vs \"ชั้นทำคำพิพากษา\" (ม.29)",
     html:`
      <p><b>นิยาม \"การนั่งพิจารณา\" (ป.วิ.พ. ม.1(9)):</b> การที่ศาลออกนั่งเกี่ยวกับการพิจารณาคดี เช่น ประชุมคดี ตรวจพยานหลักฐาน ชี้สองสถาน สืบพยาน ไต่สวน ฟังคำขอ ฟังคำแถลงการณ์ด้วยวาจา เดินเผชิญสืบ</p>
      <p><b>เหตุขัดข้อง \"ระหว่างนั่งพิจารณา\" (ม.28):</b> ผู้รับผิดชอบราชการศาล (หรือผู้ทำการแทน) <b>มอบหมายให้ผู้พิพากษาคนใดก็ได้</b>ในศาลนั้นมานั่งพิจารณาและทำคำพิพากษาต่อ · รวมถึง ม.31(4) ราคาทรัพย์เปลี่ยนจนเกินอำนาจผู้พิพากษาคนเดียว</p>
      <p><b>เหตุขัดข้อง \"ในชั้นทำคำพิพากษา\" (ม.29):</b> <b>ผู้รับผิดชอบราชการศาล (หัวหน้าศาล) ต้องตรวจสำนวนและลงลายมือชื่อทำคำพิพากษาด้วยตนเอง มอบหมายให้คนอื่นทำแทนไม่ได้</b> · หากหัวหน้าศาลไม่อยู่ ให้ผู้มีอาวุโสสูงสุดถัดลงมาทำแทน <b>แต่ต้องไม่ใช่ผู้พิพากษาอาวุโสหรือผู้พิพากษาประจำศาล</b> · รวมถึง ม.31(1) ไต่สวนมูลฟ้องแล้วเห็นควรยกฟ้องในคดีที่โทษเกิน (5), ม.31(2) เห็นควรลงโทษจำคุกเกิน 6 เดือน, ม.31(3) องค์คณะคดีแพ่งเห็นแย้งกันจนหาเสียงข้างมากไม่ได้ (คดีอาญาไม่มีปัญหานี้เพราะให้ถือความเห็นที่เป็นคุณแก่จำเลย)</p>
      <p><b>เส้นแบ่งที่ออกสอบบ่อย:</b></p>
      <ul>
        <li>คดีเช็ค สืบพยานเสร็จแล้ว นัดพร้อมเพื่อสอบถามการผ่อนชำระ ผู้พิพากษาถูกย้าย → ยังถือว่า<b>อยู่ระหว่างนั่งพิจารณา</b> (มีข้อเท็จจริงต้องตรวจสอบต่อ) มอบหมายได้ (<b>ฎ.5802/2554</b>)</li>
        <li>จำเลยรับสารภาพคดีที่<b>ไม่ต้องสืบพยานประกอบ</b> (โทษอย่างต่ำต่ำกว่า 5 ปี ตาม ป.วิ.อ. ม.176) → กระบวนพิจารณาเสร็จแล้ว ถือเป็น<b>ชั้นทำคำพิพากษา</b> ใช้ ม.29</li>
        <li>จำเลยรับสารภาพคดีที่<b>ต้องสืบพยานประกอบ</b> (เช่น ยาเสพติด) ผู้พิพากษาตายก่อนวันนัดสืบพยานประกอบ → ยัง<b>อยู่ระหว่างนั่งพิจารณา</b> มอบหมายได้</li>
        <li>ศาลอุทธรณ์<b>ย้อนสำนวนให้พิจารณาพิพากษาใหม่</b> แม้คู่ความตกลงใช้พยานหลักฐานเดิมไม่สืบเพิ่ม → ยังมี \"กระบวนพิจารณาเหลืออยู่\" (มีติ่งการนั่งพิจารณา) → เป็นเหตุระหว่างนั่งพิจารณา มอบหมายได้ / ผู้ลงชื่อร่วมองค์คณะต้องเป็นหัวหน้าศาล \"คนปัจจุบัน\" ไม่ใช่คนที่ย้ายไปแล้ว (<b>ฎ.17227/2557</b>, <b>ฎ.1400/2564</b>)</li>
        <li>องค์คณะศาลอุทธรณ์ลงชื่อในต้นร่างคำพิพากษาครบแล้ว แต่คนหนึ่งย้ายก่อนลงชื่อในคำพิพากษา → บันทึกจดแจ้งเหตุตาม ป.วิ.พ. ม.141 วรรคสอง เพียงพอ ไม่ใช่เหตุตาม ม.28/29 รองประธานฯ ไม่ต้องเข้าร่วมองค์คณะ (<b>ฎ.6341/2559</b>)</li>
      </ul>
      <div class="examBox"><div class="exlabel">📝 โจทย์ฝึกจากหลักในคำบรรยาย</div>
        <div class="exq">คดีอาญาข้อหาลักทรัพย์ในศาลแขวงนครปฐม นาย ก. ผู้พิพากษาเจ้าของสำนวนสืบพยานโจทก์จำเลยเสร็จสิ้น และนัดฟังคำพิพากษา ก่อนถึงวันนัด นาย ก. ถึงแก่กรรมด้วยโรคหัวใจ นาย ข. ผู้พิพากษาหัวหน้าศาลจึงมอบหมายให้ นาย ค. ผู้พิพากษาในศาลนั้นเป็นผู้ทำคำพิพากษาคดีนี้แทน การมอบหมายดังกล่าวชอบด้วยพระธรรมนูญศาลยุติธรรมหรือไม่</div>
        <div class="exsrc">โจทย์ฝึกอิงเส้นแบ่ง \"ชั้นทำคำพิพากษา\" ตาม ม.29</div>
        <button type="button" class="examToggle" onclick="toggleExamAns('exam-L5-1')">🔎 ดูเฉลย</button>
        <div class="examAns" id="exam-L5-1"><span class="exanslabel">✅ แนวคำตอบ</span><p>การมอบหมายไม่ชอบด้วยพระธรรมนูญศาลยุติธรรม เมื่อ นาย ก. สืบพยานเสร็จสิ้นและเหลือเพียงขั้นตอนการจัดทำคำพิพากษา การที่ นาย ก. ถึงแก่กรรมจึงเป็น \"เหตุจำเป็นอันไม่อาจก้าวล่วงได้\" ที่เกิดขึ้นในระหว่าง \"การทำคำพิพากษา\" มิใช่ระหว่างการนั่งพิจารณา กรณีนี้ต้องบังคับตามมาตรา 29 ซึ่งกำหนดให้ผู้รับผิดชอบราชการศาล คือ นาย ข. ผู้พิพากษาหัวหน้าศาล เป็นผู้ตรวจสำนวนและลงลายมือชื่อทำคำพิพากษาด้วยตนเอง จะใช้วิธีมอบหมายให้ผู้พิพากษาคนอื่น (นาย ค.) ทำคำพิพากษาแทนอย่างกรณีเหตุเกิดระหว่างนั่งพิจารณาตามมาตรา 28 ไม่ได้ (ต่างจากกรณีคดีที่ยังมีข้อเท็จจริงต้องตรวจสอบต่อ เช่น นัดพร้อมสอบถามการผ่อนชำระในคดีเช็คตาม ฎ.5802/2554 หรือคดีที่ศาลอุทธรณ์ย้อนสำนวนมาพิจารณาใหม่ตาม ฎ.17227/2557 ซึ่งถือว่ายังอยู่ระหว่างนั่งพิจารณา มอบหมายได้)</p></div>
      </div>`},

    {heading:"8. การจ่ายสำนวน / เรียกคืนสำนวน / โอนสำนวน (ม.32–33) และความอิสระของผู้พิพากษา",
     html:`
      <p><b>การจ่ายสำนวน</b> เป็นอำนาจของ<b>ผู้รับผิดชอบราชการศาล</b></p>
      <p><b>การเรียกคืนสำนวน</b>ที่จ่ายไปแล้ว ทำได้เฉพาะเมื่อ <b>\"กระทบกระเทือนต่อความยุติธรรมในการพิจารณาพิพากษาคดี\"</b> (ม.33) เช่น ป้องกันคำวินิจฉัยที่ขัดแย้งกันในคดีกลุ่มเดียวกัน โดยต้องให้<b>รองประธานศาล หรือผู้พิพากษาที่มีอาวุโสสูงสุดถัดจากหัวหน้าศาล</b>ทำความเห็นเสนอ (ผู้พิพากษาอาวุโส/ประจำศาลทำความเห็นเรื่องนี้ไม่ได้) และ<b>เรียกคืนได้เพียงครั้งเดียว</b>ต่อคดี เว้นแต่เจ้าของสำนวนสมัครใจคืนเอง</p>
      <p><b>การที่หัวหน้าศาลจ่ายสำนวนให้องค์คณะที่ประชุมคดีต่างจากองค์คณะที่พิจารณาพิพากษา ไม่ถือเป็นการเรียกคืนสำนวนตาม ม.33</b> (<b>ฎ.3449/2564</b>)</p>

/* ================= GAMIFICATION ================= */
const GK = 'viphaeng_score_v2';
function loadScore(){
  try{ return JSON.parse(localStorage.getItem(GK)||'{"total":0,"seenCards":{},"seenContent":{}}'); }
  catch(e){ return {total:0,seenCards:{},seenContent:{}}; }
}
function saveScore(s){ try{ localStorage.setItem(GK,JSON.stringify(s)); }catch(e){} }
let GS = loadScore();

function addScore(pts, reason){
  GS.total = Math.max(0, GS.total + pts);
  saveScore(GS);
  updateScoreUI();
  showScorePop(pts, reason);
}
function showScorePop(pts, reason){
  const el = document.getElementById('scorePop');
  if(!el) return;
  const minus = pts < 0;
  el.textContent = (minus ? '' : '+') + pts + (reason ? ' ' + reason : '');
  el.style.color = minus ? '#ef4444' : '#16a34a';
  el.style.borderColor = minus ? '#fca5a5' : '#bbf7d0';
  el.style.opacity = '1';
  el.style.transform = 'translateY(0)';
  clearTimeout(el._t);
  el._t = setTimeout(()=>{ el.style.opacity='0'; el.style.transform='translateY(-10px)'; }, 1400);
}
function updateScoreUI(){
  const el = document.getElementById('scoreNum');
  if(el) el.textContent = GS.total.toLocaleString();
}

const TERM_LIST = Object.keys(TERM_GLOSSARY)
  .sort((a,b)=>b.length-a.length)
  .map(t=>t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'));
const TERM_RE = TERM_LIST.length ? new RegExp('(' + TERM_LIST.join('|') + ')', 'g') : null;
function linkGlossary(html){
  if(!TERM_RE) return html;
  const seen = new Set();
  return html.replace(TERM_RE, (m)=>{
    if(seen.has(m)) return m;
    if(!TERM_GLOSSARY[m]) return m;
    seen.add(m);
    return '<span class="term-ref" onclick="toggleTermFull(this)" tabindex="0" role="button">'+m+'</span><span class="term-full">'+TERM_GLOSSARY[m]+'</span>';
  });
}
function toggleTermFull(el){
  const full = el.nextElementSibling;
  full.classList.toggle('open');
  el.classList.toggle('active');
}

/* ---------- ปุ่มอ่านออกเสียง (TTS) ---------- */
const TTS = (function(){
  const supported = typeof window !== 'undefined' && 'speechSynthesis' in window;
  let queue = [], qIdx = 0, currentEl = null, rate = 1;
  function pickThaiVoice(){
    const vs = window.speechSynthesis.getVoices();
    return vs.find(v => v.lang && v.lang.toLowerCase().startsWith('th')) || vs[0];
  }
  function clearHighlight(){ if(currentEl){ currentEl.classList.remove('tts-reading'); currentEl = null; } }
  function speakNext(){
    if(qIdx >= queue.length){ clearHighlight(); setBtns('idle'); return; }
    const item = queue[qIdx];
    clearHighlight();
    currentEl = item.el;
    if(currentEl){ currentEl.classList.add('tts-reading'); currentEl.scrollIntoView({behavior:'smooth', block:'center'}); }
    const u = new SpeechSynthesisUtterance(item.text);
    const v = pickThaiVoice();
    if(v) u.voice = v;
    u.lang = (v && v.lang) || 'th-TH';
    u.rate = rate;
    u.onend = ()=>{ qIdx++; speakNext(); };
    u.onerror = ()=>{ qIdx++; speakNext(); };
    window.speechSynthesis.speak(u);
  }
  function setBtns(state){
    const p = document.getElementById('tts-play');
    const pa = document.getElementById('tts-pause');
    const s = document.getElementById('tts-stop');
    if(!p) return;
    if(state === 'playing'){
      p.style.display = 'none'; pa.style.display = 'inline-flex'; s.style.display = 'inline-flex';
      pa.innerHTML = '⏸ หยุดชั่วคราว';
    } else if(state === 'paused'){
      pa.innerHTML = '▶ เล่นต่อ';
    } else {
      p.style.display = 'inline-flex'; pa.style.display = 'none'; s.style.display = 'none';
    }
  }
  function play(){
    if(!supported) return;
    const body = document.getElementById('panel');
    if(!body) return;
    if(window.speechSynthesis.paused){ window.speechSynthesis.resume(); setBtns('playing'); return; }
    stop();
    queue = [];
    body.querySelectorAll('.topic-html p, .topic-html li').forEach(el=>{
      if(el.offsetParent === null) return;
      const txt = el.textContent.trim();
      if(txt.length > 0) queue.push({el, text: txt});
    });
    if(queue.length === 0) return;
    qIdx = 0;
    setBtns('playing');
    speakNext();
  }
  function pauseToggle(){
    if(!supported) return;
    if(window.speechSynthesis.paused){ window.speechSynthesis.resume(); setBtns('playing'); }
    else if(window.speechSynthesis.speaking){ window.speechSynthesis.pause(); setBtns('paused'); }
  }
  function stop(){
    if(!supported) return;
    window.speechSynthesis.cancel();
    clearHighlight();
    queue = []; qIdx = 0;
    setBtns('idle');
  }
  function setRate(r){ rate = r; }
  return {supported, play, pauseToggle, stop, setRate};
})();
function ttsInit(){
  const play = document.getElementById('tts-play');
  const pause = document.getElementById('tts-pause');
  const stop = document.getElementById('tts-stop');
  const rate = document.getElementById('tts-rate');
  if(play) play.onclick = ()=> TTS.play();
  if(pause) pause.onclick = ()=> TTS.pauseToggle();
  if(stop) stop.onclick = ()=> TTS.stop();
  if(rate) rate.onchange = ()=> TTS.setRate(parseFloat(rate.value));
  if('speechSynthesis' in window){
    window.speechSynthesis.getVoices();
    window.speechSynthesis.onvoiceschanged = ()=>{ window.speechSynthesis.getVoices(); };
  }
}
