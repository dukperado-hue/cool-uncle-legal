<title>ประมวลกฎหมายวิธีพิจารณาความแพ่ง (วิแพ่ง) — อ่านและซ้อมสอบทุกมาตรา | Cool Uncle Legal Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Thai:wght@400;600;700;900&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ══ DESIGN TOKENS ══════════════════════════════════════════════════════════ */
:root{
  --bg-page:#eef2f7;
  --bg-panel:#ffffff;
  --bg-panel2:#f7f9fc;
  --border:#dde3ec;
  --border-med:#bfcce0;
  --text-h:#1a2332;
  --text-body:#374151;
  --text-soft:#6b7280;
  --text-muted:#9ca3af;
  --gold:#b5832c;
  --gold-l:#fef3c7;
  --good:#166534;
  --good-l:#dcfce7;
  --bad:#991b1b;
  --bad-l:#fee2e2;
  --cat:#1e40af;
  --cat-pale:#eff6ff;
  --shadow:0 1px 3px rgba(0,0,0,.07), 0 4px 14px rgba(0,0,0,.05);
  --shadow-lg:0 8px 24px rgba(0,0,0,.10);
  --radius:10px;
  --radius-sm:7px;
}

/* ============ THEME: DARK ============ */
:root[data-theme="dark"]{
  --bg-page:#14161f;--bg-panel:#1c2030;--bg-panel2:#232840;
  --border:#2E3348;--border-med:#3a4060;
  --text-h:#E9E7E1;--text-body:#c7cbdb;--text-soft:#A9AEC2;--text-muted:#6C7188;
  --gold:#E0BD73;--gold-l:#3A3320;
  --good:#4FCB8D;--good-l:#173425;
  --bad:#E2685F;--bad-l:#3A1E1C;
  --cat:#84A6E8;--cat-pale:#1f2740;
  --shadow:0 1px 3px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25);
  --shadow-lg:0 8px 24px rgba(0,0,0,.4);
}
/* ============ THEME: HORROR (กระสือ mode) ============ */
:root[data-theme="horror"]{
  --bg-page:#0A070C;--bg-panel:#151019;--bg-panel2:#1c1420;
  --border:#2B1F26;--border-med:#3d2a33;
  --text-h:#D9D2C9;--text-body:#c2b8ae;--text-soft:#9C8F93;--text-muted:#5C5460;
  --gold:#8F1F2B;--gold-l:#301418;
  --good:#3F7A4F;--good-l:#16241a;
  --bad:#FF3355;--bad-l:#301018;
  --cat:#4A8F5C;--cat-pale:#1a2a1e;
  --shadow:0 1px 3px rgba(0,0,0,.5), 0 4px 14px rgba(0,0,0,.4);
  --shadow-lg:0 8px 24px rgba(0,0,0,.55);
}
:root[data-theme="dark"] body,:root[data-theme="horror"] body{background:var(--bg-page)}
:root[data-theme="dark"] .subject-bar,:root[data-theme="dark"] .tab,:root[data-theme="dark"] select,
:root[data-theme="dark"] .face-front,:root[data-theme="dark"] .img-label,:root[data-theme="dark"] .list-item,
:root[data-theme="dark"] .set-card,:root[data-theme="dark"] .stog,:root[data-theme="dark"] .choice,
:root[data-theme="dark"] .order-item,:root[data-theme="dark"] .content-week,
:root[data-theme="horror"] .subject-bar,:root[data-theme="horror"] .tab,:root[data-theme="horror"] select,
:root[data-theme="horror"] .face-front,:root[data-theme="horror"] .img-label,:root[data-theme="horror"] .list-item,
:root[data-theme="horror"] .set-card,:root[data-theme="horror"] .stog,:root[data-theme="horror"] .choice,
:root[data-theme="horror"] .order-item,:root[data-theme="horror"] .content-week{background:var(--bg-panel)}
:root[data-theme="dark"] .btn-home-tab,:root[data-theme="dark"] .subject-tab:hover:not(.active),
:root[data-theme="dark"] .list-cat-tab,:root[data-theme="dark"] .fact-block,
:root[data-theme="dark"] .content-week-header,:root[data-theme="dark"] .topic-body,
:root[data-theme="horror"] .btn-home-tab,:root[data-theme="horror"] .subject-tab:hover:not(.active),
:root[data-theme="horror"] .list-cat-tab,:root[data-theme="horror"] .fact-block,
:root[data-theme="horror"] .content-week-header,:root[data-theme="horror"] .topic-body{background:var(--bg-panel2)}
:root[data-theme="dark"] .rika-item,:root[data-theme="horror"] .rika-item{background:rgba(251,191,36,.06)}
:root[data-theme="dark"] .content-week-header:hover,:root[data-theme="horror"] .content-week-header:hover{background:var(--border)}
:root[data-theme="dark"] .score-pop,:root[data-theme="horror"] .score-pop{background:var(--bg-panel);color:var(--good);border-color:var(--border)}
:root[data-theme="dark"] .list-item .case-tag,:root[data-theme="horror"] .list-item .case-tag{background:var(--gold-l);border-color:var(--gold)}

/* THEME TOGGLE */
.theme-toggle{display:flex;gap:3px;margin-left:auto;background:var(--bg-panel);border:1px solid var(--border);border-radius:999px;padding:3px}
.subject-bar .theme-toggle{margin-left:0}
.theme-toggle button{border:none;background:transparent;border-radius:999px;width:28px;height:28px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px;transition:all .2s;font-family:inherit}
.theme-toggle button.active{background:var(--cat);box-shadow:0 0 0 1px var(--cat)}
.theme-toggle button:hover{background:var(--border)}

/* GHOST COMPANION (horror mode — rotating cast of 4) */
.drone-mute-btn{
  display:none;
  margin-left:6px;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:999px;
  width:28px;height:28px;
  align-items:center;justify-content:center;
  cursor:pointer;font-size:13px;
}
:root[data-theme="horror"] .drone-mute-btn{ display:flex; }
:root[data-theme="horror"] .drone-mute-btn:hover{ background:var(--line); }

/* GHOST COMPANION (horror mode — rotating cast of 4) */
.ghost-companion{position:fixed;right:16px;bottom:16px;width:200px;height:auto;pointer-events:auto;cursor:pointer;opacity:0;transform:translateY(8px);transition:opacity .6s ease;z-index:999;filter:drop-shadow(0 0 16px rgba(180,20,40,.45));animation:ghost-float 3.4s ease-in-out infinite}
.ghost-companion.visible{opacity:1}
.ghost-companion.pulse{filter:drop-shadow(0 0 26px rgba(180,20,40,.8)) drop-shadow(0 0 10px rgba(255,255,255,.3))}
@keyframes ghost-float{0%,100%{transform:translateY(0) rotate(-1.5deg)}50%{transform:translateY(-10px) rotate(1.5deg)}}
.ghost-speech{
  position:fixed;max-width:200px;background:#fff;color:#1a1a1a;
  border-radius:14px;padding:8px 13px;font-size:13px;font-weight:700;
  font-family:'Sarabun',system-ui,sans-serif;line-height:1.4;
  box-shadow:0 8px 20px rgba(0,0,0,.4);z-index:1000;
  opacity:0;pointer-events:none;transform:translateY(6px) scale(.96);
  transition:opacity .2s ease,transform .2s ease;text-align:center;
}
.ghost-speech.visible{opacity:1;transform:translateY(0) scale(1)}
.ghost-speech::after{
  content:"";position:absolute;right:28px;bottom:-8px;width:0;height:0;
  border:8px solid transparent;border-top-color:#fff;
}

*{box-sizing:border-box;-webkit-font-smoothing:antialiased;}
html,body{margin:0;padding:0;}
body{background:var(--bg-page);color:var(--text-body);font-family:'Sarabun',sans-serif;font-size:15px;line-height:1.6;min-height:100vh;padding-bottom:70px;transition:background .35s;}
h1,h2,h3,.serif{font-family:'Noto Serif Thai',serif;}

/* ══ SUBJECT BAR ════════════════════════════════════════════════════════════ */
.subject-bar{position:sticky;top:0;z-index:80;display:flex;align-items:center;gap:8px;background:#fff;border-bottom:2px solid var(--border);padding:0 16px;height:52px;box-shadow:0 2px 8px rgba(0,0,0,.06);}
.brand-home{display:flex;align-items:center;gap:8px;text-decoration:none;color:inherit;padding:0 4px;}
.brand-logo{font-size:24px;line-height:1;transition:transform .15s;}
.brand-home:hover .brand-logo{transform:scale(1.1);}
.brand-name{font-family:'Noto Serif Thai',serif;font-size:16px;font-weight:700;color:var(--text-h);letter-spacing:.01em;white-space:nowrap;}
.home-btn-wrap{display:flex;align-items:center;margin-left:6px;}
.btn-home-tab{display:inline-flex;align-items:center;font-family:'Sarabun',sans-serif;font-size:12.5px;font-weight:700;color:var(--text-soft);background:#f1f5f9;border:1px solid var(--border);border-radius:6px;padding:5px 12px;text-decoration:none;transition:all .15s;white-space:nowrap;}
.btn-home-tab:hover{background:var(--cat);color:#fff;border-color:var(--cat);}
.course-title-bar{display:flex;flex-direction:column;justify-content:center;margin-left:10px;border-left:1.5px solid var(--border);padding-left:12px;}
.course-title-main{font-family:'Noto Serif Thai',serif;font-size:13.5px;font-weight:700;color:var(--text-h);line-height:1.2;white-space:nowrap;}
.course-title-sub{font-size:10px;color:var(--text-muted);white-space:nowrap;}
@media(max-width:640px){.course-title-bar{display:none;}}
.subject-tab{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 14px;height:100%;border-bottom:2px solid transparent;margin-bottom:-2px;cursor:pointer;transition:all .15s;min-width:72px;}
.subject-tab:hover:not(.active){background:#f3f4f6;}
.subject-tab.active{border-bottom-color:var(--cat);}
.stab-code{font-family:'Noto Serif Thai',serif;font-size:13px;font-weight:700;color:var(--cat);}
.stab-name{font-size:10px;color:var(--text-soft);}
.score-block{position:relative;display:flex;flex-direction:column;align-items:flex-end;padding:6px 12px;background:linear-gradient(135deg,#1e3a8a,#2563eb);border-radius:8px;min-width:80px;margin-left:auto;}
.score-label{font-size:9px;color:rgba(255,255,255,.7);letter-spacing:.06em;text-transform:uppercase;}
.score-num{font-family:'Noto Serif Thai',serif;font-size:20px;font-weight:700;color:#fbbf24;line-height:1.1;}
.score-pop{position:absolute;top:-22px;right:4px;font-size:12px;font-weight:700;color:#16a34a;opacity:0;transform:translateY(4px);transition:opacity .3s,transform .3s;pointer-events:none;white-space:nowrap;background:#fff;padding:2px 6px;border-radius:4px;border:1px solid #bbf7d0;}

/* ══ LAYOUT ══════════════════════════════════════════════════════════════════ */
.wrap{max-width:980px;margin:0 auto;padding:18px 16px 40px;}

/* ══ MODE TABS ═══════════════════════════════════════════════════════════════ */
.mode-tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:18px;}
.tab{background:#fff;border:1px solid var(--border);border-radius:8px;padding:10px 4px;text-align:center;font-size:11px;cursor:pointer;color:var(--text-soft);line-height:1.3;transition:all .15s;}
.tab b{display:block;font-family:'Noto Serif Thai',serif;font-size:16px;color:#94a3b8;}
.tab:hover:not(.active){border-color:var(--cat);color:var(--cat);background:var(--cat-pale);}
.tab.active{background:var(--cat);color:#fff;border-color:var(--cat);box-shadow:var(--shadow);}
.tab.active b{color:#fff;}

/* ══ PANEL ═══════════════════════════════════════════════════════════════════ */
.panel{background:var(--bg-panel);border:1px solid var(--border);border-radius:var(--radius);padding:24px;box-shadow:var(--shadow);max-height:calc(100vh - 130px);overflow-y:auto;}
.panel h2{margin:0 0 3px;font-size:19px;color:var(--text-h);}
.panel .desc{font-size:13px;color:var(--text-soft);margin-bottom:16px;}
.section-title{font-size:11px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.1em;margin:18px 0 10px;border-bottom:1px solid var(--border);padding-bottom:6px;}
select{font-family:'Sarabun',sans-serif;font-size:13.5px;padding:7px 10px;border-radius:var(--radius-sm);border:1px solid var(--border-med);background:#fff;color:var(--text-body);outline:none;}
select:focus{border-color:var(--cat);}
.btn{font-family:'Sarabun',sans-serif;font-weight:700;font-size:13px;border:none;border-radius:var(--radius-sm);padding:9px 16px;cursor:pointer;transition:transform .1s,filter .1s;white-space:nowrap;}
.btn:active{transform:scale(.97);}
.btn-gold{background:linear-gradient(180deg,#fde68a,#d4a017);color:#3a1a00;box-shadow:0 2px 0 #a0720d;}
.btn-gold:hover{filter:brightness(1.06);}
.btn-ghost{background:transparent;border:1.5px solid var(--border-med);color:var(--text-body);}
.btn-ghost:hover{border-color:var(--cat);color:var(--cat);background:var(--cat-pale);}
.btn-dark{background:var(--text-h);color:#fff;}
.btn-sm{padding:6px 12px;font-size:12px;}
.btn:disabled{opacity:.35;cursor:not-allowed;}
.cat-pill{display:inline-flex;align-items:center;font-size:11px;padding:2px 10px;border-radius:999px;background:var(--cat);color:#fff;font-weight:600;}
.qtag{display:inline-block;font-size:11px;font-weight:700;color:var(--bad);border:1.5px solid var(--bad);border-radius:4px;padding:1px 7px;margin:0 4px 6px 0;background:var(--bad-l);}
.floatbar{position:fixed;left:0;right:0;bottom:0;z-index:60;background:rgba(255,255,255,.95);backdrop-filter:blur(10px);border-top:1px solid var(--border);padding:10px 16px;display:flex;justify-content:center;align-items:center;gap:12px;box-shadow:0 -3px 12px rgba(0,0,0,.06);}
.progress-bar{height:4px;background:var(--border);border-radius:99px;overflow:hidden;margin:8px 0 14px;}
.progress-bar>div{height:100%;background:var(--cat);border-radius:99px;transition:width .4s ease;}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
.row-center{justify-content:center;}
.backrow{margin-bottom:12px;}
.timer-bar{height:4px;border-radius:99px;background:#e5e7eb;overflow:hidden;margin-bottom:10px;}
.timer-bar>div{height:100%;background:#f59e0b;border-radius:99px;transition:width 1s linear;}

/* ══ FLASHCARD ═══════════════════════════════════════════════════════════════ */
.flip-stage{perspective:1400px;max-width:540px;margin:14px auto;}
.flip-card{position:relative;min-height:270px;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.4,.2,.2,1);cursor:pointer;}
.flip-card.flipped{transform:rotateY(180deg);}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:var(--radius);overflow:hidden;}
.face-front{background:#fff;border:1px solid var(--border);display:flex;flex-direction:column;box-shadow:var(--shadow);}
.img-slot{height:110px;background:var(--bg-page);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--text-muted);font-size:11px;position:relative;}
.img-label{background:#fff;border-radius:4px;padding:3px 8px;border:1px dashed var(--border-med);}
.img-slot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.card-body{padding:16px 20px;flex:1;display:flex;flex-direction:column;justify-content:center;}
.card-body .cat-badge{font-size:10px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px;}
.card-body .code{font-family:'Noto Serif Thai',serif;font-size:26px;font-weight:700;color:var(--cat);}
.card-body .title{font-weight:600;font-size:14px;color:var(--text-body);margin-top:5px;}
.face-front .hint{position:absolute;bottom:10px;right:14px;font-size:10px;color:var(--text-muted);}
.face-back{background:#1a2332;color:#e2e8f0;transform:rotateY(180deg);padding:20px 22px;display:flex;flex-direction:column;box-shadow:var(--shadow);}
.face-back .code-mini{font-family:'Noto Serif Thai',serif;font-size:12.5px;color:#fbbf24;margin-bottom:8px;}
.face-back .txt{font-size:13.5px;line-height:1.75;}
.face-back .case-box{margin-top:12px;padding:9px 13px;background:rgba(251,191,36,.1);border-left:3px solid #fbbf24;font-size:12.5px;color:#fbbf24;border-radius:0 4px 4px 0;}
.card-controls{display:flex;justify-content:center;gap:8px;margin-top:12px;flex-wrap:wrap;}

/* ══ LIST MODE ════════════════════════════════════════════════════════════════ */
.list-cat-strip{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:14px;}
.list-cat-tab{font-size:12px;font-weight:600;padding:5px 12px;border-radius:999px;cursor:pointer;background:#f1f5f9;border:1px solid var(--border);color:var(--text-soft);transition:all .15s;}
.list-cat-tab:hover{border-color:var(--cat);color:var(--cat);background:var(--cat-pale);}
.list-cat-tab.active{background:var(--cat);color:#fff;border-color:var(--cat);}
.lct-count{font-size:10px;opacity:.7;margin-left:2px;}
.list-item{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:13px 16px;margin-bottom:7px;display:grid;grid-template-columns:68px 1fr;gap:0 12px;transition:box-shadow .15s,border-color .15s;}
.list-item:hover{border-color:var(--cat);box-shadow:var(--shadow);}
.list-item .code{font-family:'Noto Serif Thai',serif;color:var(--cat);font-size:14px;font-weight:700;padding-top:2px;}
.list-item .right{}
.list-item .title{font-weight:700;font-size:13px;color:var(--text-h);margin-bottom:3px;}
.list-item .txt{font-size:12.5px;color:var(--text-soft);line-height:1.6;}
.list-item .case-tag{display:inline-block;margin-top:5px;font-size:11px;color:var(--gold);background:#fef9ec;border-radius:4px;padding:1px 7px;border:1px solid #fde68a;}

/* ══ QUIZ ════════════════════════════════════════════════════════════════════ */
.set-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-bottom:16px;}
.set-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:14px 12px;text-align:center;cursor:pointer;transition:all .15s;box-shadow:var(--shadow);}
.set-card:hover{border-color:var(--cat);box-shadow:var(--shadow-lg);transform:translateY(-1px);}
.set-card b{display:block;font-family:'Noto Serif Thai',serif;font-size:20px;color:var(--cat);margin-bottom:4px;}
.set-card .set-desc{font-size:11.5px;color:var(--text-soft);}
.set-card .best{font-size:11px;color:var(--text-muted);margin-top:6px;padding-top:6px;border-top:1px solid var(--border);}
.subtoggle{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px;}
.stog{padding:14px 12px;border-radius:var(--radius);border:1px solid var(--border);background:#fff;cursor:pointer;text-align:center;font-size:13px;font-weight:600;color:var(--text-body);transition:all .15s;}
.stog b{display:block;font-size:15px;font-family:'Noto Serif Thai',serif;color:var(--cat);margin-bottom:3px;}
.stog:hover{border-color:var(--cat);background:var(--cat-pale);}
.stog.active{background:var(--cat);color:#fff;border-color:var(--cat);}
.stog.active b{color:#fff;}
.fact-block{background:#f8fafc;border-left:3px solid var(--cat);padding:13px 16px;border-radius:0 var(--radius-sm) var(--radius-sm) 0;font-size:13.5px;line-height:1.75;margin-bottom:14px;color:var(--text-body);}
.fact-block.collapsed{max-height:68px;overflow:hidden;position:relative;}
.fact-block.collapsed::after{content:"";position:absolute;bottom:0;left:0;right:0;height:30px;background:linear-gradient(transparent,#f8fafc);pointer-events:none;}
.fact-toggle{font-size:12px;font-weight:700;color:var(--cat);cursor:pointer;margin-bottom:8px;display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:4px;background:var(--cat-pale);border:1px solid #bfdbfe;}
.choice{display:block;width:100%;text-align:left;background:#fff;border:1.5px solid var(--border);border-radius:var(--radius-sm);padding:11px 15px;margin-bottom:8px;font-size:13.5px;cursor:pointer;font-family:'Sarabun',sans-serif;color:var(--text-body);transition:border-color .15s,background .15s,transform .1s;}
.choice:hover:not(:disabled){border-color:var(--cat);background:var(--cat-pale);transform:translateX(2px);}
.choice.correct{border-color:var(--good);background:var(--good-l);color:#0f3320;}
.choice.wrong{border-color:var(--bad);background:var(--bad-l);color:#5c0000;}
.choice:disabled{cursor:default;transform:none;}
.explain-box{margin-top:12px;background:#1a2332;color:#e2e8f0;border-radius:var(--radius);padding:14px 18px;font-size:13px;line-height:1.75;border-top:3px solid var(--cat);}
.explain-box b{color:#fbbf24;}

/* ══ ORDER / WALK ════════════════════════════════════════════════════════════ */
.order-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px;}
.order-item{background:#fff;border:1.5px solid var(--border);border-radius:var(--radius-sm);padding:11px 14px;display:flex;align-items:center;gap:12px;cursor:grab;font-size:13.5px;user-select:none;transition:box-shadow .15s;}
.order-item:hover{box-shadow:var(--shadow);}
.order-item.dragging{opacity:.35;}
.order-item .slot{width:24px;height:24px;border-radius:50%;background:#1a2332;color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-family:'Noto Serif Thai',serif;font-weight:700;flex-shrink:0;}

<script>
let __hbAudioCtx;
function playHoverSound(){
  try{
    __hbAudioCtx = __hbAudioCtx || new (window.AudioContext||window.webkitAudioContext)();
    const c = __hbAudioCtx;
    if(c.state === 'suspended') c.resume();
    const t0 = c.currentTime;
    const osc = c.createOscillator(), gain = c.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(880, t0);
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(0.05, t0+0.008);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0+0.09);
    osc.connect(gain); gain.connect(c.destination);
    osc.start(t0); osc.stop(t0+0.1);
  }catch(e){}
}
</script>

function beep(freq,dur,type,vol){
  try{
    const ctx=ac(); const o=ctx.createOscillator(); const g=ctx.createGain();
    o.type=type||'sine'; o.frequency.value=freq;
    g.gain.value=vol||0.08;

    o.start(); g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+dur);
    o.stop(ctx.currentTime+dur);
  }catch(e){}
}

   text:"คำฟ้องหรือคำร้องขอที่ 'เกี่ยวเนื่องกับคดีที่เคยอยู่ในศาลใด ให้เสนอต่อศาลนั้น' — เช่น ฟ้องแย้ง ต้องเสนอต่อศาลที่คดีเดิมพิจารณาอยู่"},
  // PARTIES
  {cat:"parties",code:"ม.55",title:"อำนาจฟ้อง",
   text:"ต้องปรากฏว่า 'มีการโต้แย้งสิทธิหรือหน้าที่ตามกฎหมายแพ่ง' (คดีมีข้อพิพาท) หรือจำเป็นต้อง 'ใช้สิทธิทางศาล' (คดีไม่มีข้อพิพาท)",
   case:"ฎ.4100/2530: จำเลยทำรั้วปิดกั้นทางเดินของโจทก์เจ้าของรวม = โต้แย้งสิทธิ → มีอำนาจฟ้อง"},
  {cat:"parties",code:"ม.57",title:"การร้องสอด (3 ทาง)",
   text:"(1) 'จำเป็นเพื่อยังให้ได้รับความรับรอง คุ้มครอง หรือบังคับตามสิทธิของตน' | (2) 'มีส่วนได้เสียตามกฎหมายในผลแห่งคดี' | (3) อาจถูกเรียกเพื่อ 'การใช้สิทธิไล่เบี้ยหรือเรียกค่าทดแทน'",
   case:"ฎ.774/2539 (ม.57(1)): ผู้ร้องสอดอ้างว่าตนได้กรรมสิทธิ์ที่ดินพิพาทโดยครอบครองปรปักษ์ → ร้องสอดเข้ามาเพื่อคุ้มครองสิทธิของตน"},
  {cat:"parties",code:"ม.58",title:"สิทธิของผู้ร้องสอด",
   text:"(1)(3): 'เสมือนหนึ่งว่าตนได้ฟ้องหรือถูกฟ้องเป็นคดีเรื่องใหม่' | (2): 'ห้ามมิให้ใช้สิทธิอย่างอื่นนอกจากสิทธิที่มีอยู่แก่คู่ความที่ตนเข้าร่วม และห้ามใช้สิทธิในทางที่ขัดกับคู่ความเดิม'",
   case:"ฎ.996/2549 (ม.57(2)): จำเลยร่วมร้องสอดเข้ามาร่วมกับจำเลยที่ 1 เมื่อจำเลยที่ 1 ขาดนัดยื่นคำให้การ → จำเลยร่วมจะมายื่นคำให้การของตนเองไม่ได้"},
  {cat:"parties",code:"ม.59",title:"คู่ความร่วม",
   text:"'มีผลประโยชน์ร่วมกันในมูลความแห่งคดี' → ฟ้องร่วมกัน/ถูกฟ้องร่วมกันได้ — 'ห้ามมิให้ถือว่าบุคคลเหล่านั้นแทนซึ่งกันและกัน' เว้นแต่หนี้แบ่งแยกไม่ได้",
   case:"ฎ.3252/2548: โจทก์ 109 คน เป็นสมาชิกสมาคมฌาปนกิจถูกจำเลยผิดสัญญา → มีผลประโยชน์ร่วมกัน ฟ้องร่วมกันในคดีเดียวได้"},
  {cat:"parties",code:"ม.42,43",title:"คู่ความมรณะ — เข้าแทนที่",
   text:"เมื่อคู่ความมรณะ ต้องสั่งเลื่อนคดีจนกว่า 'ทายาท ผู้จัดการมรดก หรือผู้มีส่วนได้เสีย จะเข้ามาเป็นคู่ความแทนที่' — กำหนด 1 ปีนับแต่วันมรณะ",
   case:"ฎ.4376/2540: โจทก์ถึงแก่กรรมระหว่างพิจารณาแต่ไม่ปรากฏต่อศาล ศาลพิพากษาไป → คำพิพากษาผูกพันจำเลย จำเลยขอให้ยกคำพิพากษาไม่ได้"},
  // SERVICE
  {cat:"service",code:"ม.74",title:"ส่งหมายโดยตรง — เวลาและสถานที่",
   text:"ส่งใน 'เวลากลางวัน (ระหว่างพระอาทิตย์ขึ้นและพระอาทิตย์ตก)' ณ ภูมิลำเนาหรือสำนักทำการงานของผู้รับ — เป็นวิธีหลัก ต้องทำก่อนวิธีอื่น"},
  {cat:"service",code:"ม.76",title:"ส่งให้ผู้รับแทน",
   text:"หากไม่พบตัวจำเลย ส่งให้บุคคลที่ 'มีอายุเกิน 20 ปี ซึ่งอยู่หรือทำงานในบ้านเรือนหรือสำนักทำการงาน' นั้นแทนได้"},
  {cat:"service",code:"ม.79",title:"ปิดหมาย — ใช้เมื่อส่งธรรมดาไม่ได้",
   text:"ต้องส่งธรรมดาก่อน หากส่งไม่ได้จึงจะ 'ปิดคำคู่ความไว้ในที่แลเห็นได้ง่าย ณ ภูมิลำเนา' ได้ — มีผลบังคับ 'เมื่อพ้นกำหนด 15 วัน นับแต่วันที่ปิดหมาย'",
   case:"ฎ.2215/2549: ศาลปิดประกาศหน้าศาลโดยไม่ส่งหมายวิธีธรรมดาก่อน = ข้ามขั้นตอน ไม่ชอบด้วย ม.79"},
  // PLEADING
  {cat:"pleading",code:"ม.172",title:"ฟ้องเคลือบคลุม",
   text:"คำฟ้องต้อง 'แสดงโดยแจ้งชัดซึ่งสภาพแห่งข้อหา ข้ออ้างที่อาศัยเป็นหลักแห่งข้อหา และคำขอบังคับ' — ไม่ใช่ข้อกฎหมายเกี่ยวความสงบฯ จำเลยต้องยกในคำให้การเอง",
   case:"ฎ.43/2525: ฟ้องว่าจำเลยทำละเมิดให้สินค้าเสียหาย พร้อมแจกแจงรายการและมูลค่า = ชัดแจ้งแล้ว ฟ้องไม่เคลือบคลุม"},
  {cat:"pleading",code:"ม.174",title:"ทิ้งฟ้อง",
   text:"โจทก์เพิกเฉย 'ไม่จัดการส่งหมายเรียกและสำเนาคำฟ้อง' ภายใน 7 วัน → ศาลสั่งจำหน่ายคดีได้ (ดุลพินิจ)"},
  {cat:"pleading",code:"ม.175,176",title:"ถอนฟ้อง และผล",
   text:"หลังจำเลยให้การแล้ว ต้องขออนุญาตศาลและศาลต้องฟังจำเลยก่อน — ผล: 'ลบล้างกระบวนพิจารณาทั้งหมด คืนสู่ฐานะเดิม' โจทก์นำมาฟ้องใหม่ได้ (แต่อายุความไม่สะดุด)",
   case:"ฎ.5477/2558: โจทก์ขอถอนเพราะเพิ่งทราบเอกสารใหม่ ไม่ได้เปรียบเชิงคดี = ถือว่าสุจริต ศาลอนุญาตให้ถอนได้"},
  {cat:"pleading",code:"ม.177,178",title:"คำให้การ และฟ้องแย้ง",
   text:"คำให้การต้อง 'แสดงโดยชัดแจ้งว่ายอมรับหรือปฏิเสธข้ออ้างของโจทก์ทั้งสิ้นหรือแต่บางส่วน รวมทั้งเหตุแห่งการนั้น' — ปฏิเสธลอยๆ = ไม่มีประเด็นนำสืบ",
   case:"ฎ.5974/2539: จำเลยให้การและฟ้องแย้งว่าครอบครองปรปักษ์เกิน 10 ปี = ชัดแจ้ง"},
  {cat:"pleading",code:"ม.179,180",title:"การแก้ไขคำคู่ความ",
   text:"ต้องยื่น 'ก่อนวันชี้สองสถาน หรือก่อนวันสืบพยานไม่น้อยกว่า 7 วัน' — ยื่นช้า ศาลอนุญาตได้ถ้าเข้าข้อยกเว้น 3 ประการ: (1)มีเหตุสมควร (2)ความสงบเรียบร้อยฯ (3)ข้อผิดพลาดเล็กน้อย",
   case:"ฎ.7465/2552: ขอแก้ว่าสัญญาค้ำประกัน 'โมฆะ' = ความสงบเรียบร้อยฯ → อนุญาตแม้ยื่นเกินกำหนด ⚠️ แต่ 'โมฆียะ' และ 'อายุความ' ไม่ใช่ความสงบฯ → ยื่นช้าไม่ได้"},
  {cat:"pleading",code:"ม.182,183",title:"การชี้สองสถาน",
   text:"ศาลนำข้ออ้างข้อเถียงมาเทียบ ข้อที่รับกัน = ยุติ ข้อที่ยังโต้เถียง → ศาล 'กำหนดเป็นประเด็นข้อพิพาท' และกำหนดภาระการพิสูจน์ว่าฝ่ายใดมีหน้าที่นำสืบ"},
  // EVIDENCE
  {cat:"evidence",code:"ม.84",title:"ข้อเท็จจริงที่ไม่ต้องพิสูจน์",
   text:"ไม่ต้องนำสืบถ้า: 'รู้กันอยู่ทั่วไปไม่อาจโต้แย้งได้' หรือ 'คู่ความรับกันแล้วในศาล' หรือกฎหมายสันนิษฐานไว้ก่อน"},
  {cat:"evidence",code:"ม.94",title:"ห้ามสืบพยานบุคคลแก้เอกสาร",
   text:"เมื่อกฎหมายบังคับต้องมีเอกสาร ห้ามสืบพยานบุคคลเพื่อ 'เพิ่มเติม ตัดทอน หรือเปลี่ยนแปลง' ข้อความในเอกสารนั้น",
   case:"ฎ.1402/2530: สัญญาระบุวางมัดจำ 400,000 บาท → จำเลยนำพยานบุคคลมาสืบเปลี่ยนแปลงข้อความในสัญญาไม่ได้ ต้องห้ามตาม ม.94"},
  {cat:"evidence",code:"ม.202",title:"โจทก์ขาดนัดพิจารณา — ผลต่อคดี",
   text:"โจทก์ขาดนัด → ศาล 'จำหน่ายคดีเสียจากสารบบความ' เว้นแต่จำเลยแจ้งประสงค์ให้พิจารณาต่อ — ถ้าจำเลยขอให้พิจารณาต่อ ศาลต้องวินิจฉัยตามภาระพิสูจน์จริง ไม่ใช่ชนะอัตโนมัติ"},
  // SUMMARY PROCEDURE
  {cat:"summary",code:"ม.150,156/1",title:"ขอยกเว้นค่าธรรมเนียมศาล (ขอนาถา)",
   text:"ผู้ไม่มีทรัพย์พอชำระค่าธรรมเนียม ยื่นขอยกเว้นได้ หากศาลยกคำร้อง อุทธรณ์ได้ภายใน 7 วัน (กรอบเวลาสั้นเป็นพิเศษ — ระวังสับสนกับ 15 วัน)"},
  {cat:"summary",code:"ม.189-195",title:"คดีมโนสาเร่",
   text:"ทุนทรัพย์ 'ไม่เกิน 300,000 บาท' หรือฟ้องขับไล่ค่าเช่า 'ไม่เกิน 30,000 บาท/เดือน' — โจทก์ 'ฟ้องด้วยวาจาได้' ศาลนัดให้คู่ความมา 'ไกล่เกลี่ย ให้การ และสืบพยานในวันเดียวกัน'"},
  {cat:"summary",code:"ม.196",title:"คดีไม่มีข้อยุ่งยาก",
   text:"คดีสามัญฟ้องตาม 'ตั๋วเงิน' หรือ 'สัญญาเป็นหนังสือ' ซึ่งดูเป็นสัญญาแท้จริงสมบูรณ์ → ศาลอาจสั่งใช้กระบวนการมโนสาเร่ได้"},
  {cat:"summary",code:"ม.197-199",title:"ขาดนัดยื่นคำให้การ — ขั้นตอน",
   text:"จำเลยรับหมายแล้วไม่ยื่นคำให้การใน 15 วัน (1) โจทก์ขอให้ตนชนะใน 15 วัน (ม.198) มิฉะนั้นศาลจำหน่ายคดี (2) ศาลดูว่าคำฟ้อง 'มีมูลและไม่ขัดกฎหมาย' (3) จำเลยร้องขอพิจารณาคดีใหม่ได้ใน 15 วันหลังส่งคำบังคับ (ม.199 ตรี)",
   case:"ฎ.5508/2545: โจทก์ไม่ขอภายใน 15 วัน → ศาลสั่งจำหน่ายคดีได้"},
  {cat:"summary",code:"ม.200-207",title:"ขาดนัดพิจารณา — ขั้นตอน",
   text:"ไม่มาศาล 'วันสืบพยานนัดแรก' = ขาดนัดพิจารณา | โจทก์ไม่มา (ม.202): ศาล 'จำหน่ายคดี' เว้นแต่จำเลยขอพิจารณาต่อ | จำเลยไม่มา (ม.204,206): โจทก์สืบพยานฝ่ายเดียว | ทางแก้ (ม.207): ร้องขอพิจารณาคดีใหม่หากมีเหตุสมควรและมิได้จงใจขาดนัด",
   case:"ฎ.3388/2545: มาสายเกินไปโดยไม่แจ้งเหตุ = ขาดนัดพิจารณา"},
  // JUDGMENT
  {cat:"judgment",code:"ม.132",title:"การจำหน่ายคดี",
   text:"ศาลสั่งจำหน่ายเมื่อ: 'ทิ้งฟ้อง ถอนฟ้อง โจทก์ขาดนัดพิจารณา' หรือคู่ความมรณะพ้น 1 ปีไม่มีทายาทเข้าแทนที่"},
  {cat:"judgment",code:"ม.138",title:"พิพากษาตามยอม",
   text:"คู่ความตกลง 'ประนีประนอมยอมความกันในข้อที่พิพาท' และไม่ฝ่าฝืนกฎหมาย ศาลพิพากษาตามยอม — 'ห้ามอุทธรณ์' เว้นแต่ขัดความสงบเรียบร้อย"},
  {cat:"judgment",code:"ม.142",title:"ห้ามพิพากษาเกินคำขอ",
   text:"'ห้ามมิให้ศาลพิพากษาหรือทำคำสั่งให้สิ่งใดๆ นอกเหนือไปจากที่ปรากฏในคำฟ้อง' — ข้อยกเว้น ม.142(1): คดีฟ้องขับไล่ ศาลพิพากษาบังคับไปถึง 'บริวาร' ของจำเลยด้วย"},
  {cat:"judgment",code:"ม.144",title:"ดำเนินกระบวนพิจารณาซ้ำ",
   text:"'ห้ามมิให้ดำเนินกระบวนพิจารณาในศาลนั้นอันเกี่ยวกับคดีหรือประเด็นที่วินิจฉัยชี้ขาดแล้วนั้นอีก'",
   case:"ฎ.8458/2558: ศาลฎีกาพิพากษาถึงที่สุดว่าจำเลยไม่มีสิทธิเก็บกินในที่ดิน จำเลยนำประเด็นนี้กลับมาอีก = ห้ามตาม ม.144"},
  {cat:"judgment",code:"ม.145",title:"ผลผูกพันคำพิพากษา",
   text:"คำพิพากษาย่อม 'ผูกพันคู่ความ' นับแต่วันที่พิพากษาหรือมีคำสั่ง จนกว่าจะถูกเปลี่ยนแปลง"},
  {cat:"judgment",code:"ม.148",title:"ฟ้องซ้ำ",
   text:"'ห้ามมิให้คู่ความเดียวกัน รื้อร้องฟ้องกันอีก ในประเด็นที่ได้วินิจฉัยโดยอาศัยเหตุอย่างเดียวกัน' เมื่อคดีก่อนถึงที่สุดแล้ว",
   case:"ฎ.5286/2531: คดีก่อนศาลวินิจฉัยถึงที่สุด คู่ความเดิมนำประเด็นเดิมมาฟ้องอีก = ฟ้องซ้ำ"},
  {cat:"judgment",code:"ม.173",title:"ฟ้องซ้อน",
   text:"'นับแต่เวลายื่นคำฟ้อง... ห้ามโจทก์ยื่นคำฟ้องเรื่องเดียวกันนั้น ต่อศาลเดียวกันหรือต่อศาลอื่น' — คดีก่อนยังไม่ถึงที่สุด",
   case:"ฎ.1091/2537: คดีแรกฟ้องอ้างครอบครองปรปักษ์ คดีหลังฟ้องอ้างการซื้อขาย = ข้ออ้างต่างกัน ไม่ถือเป็นฟ้องซ้อน"},
  // APPEAL
  {cat:"appeal",code:"ม.223",title:"หลักทั่วไปการอุทธรณ์",

   note:"คดีแรกฟ้องอ้างครอบครองปรปักษ์ คดีหลังฟ้องอ้างการซื้อขาย = ข้ออ้างต่างกัน ไม่ถือเป็นฟ้องซ้อน"},
  {id:"rk30",cat:"judgment",cite:"ฎ.5286/2531",article:"ม.148",topic:"ฟ้องซ้ำ",
   note:"คดีก่อนศาลวินิจฉัยถึงที่สุด คู่ความเดิมนำประเด็นเดิมมาฟ้องอีก = ฟ้องซ้ำ"},
  {id:"rk31",cat:"judgment",cite:"ฎ.8458/2558",article:"ม.144",topic:"ดำเนินกระบวนพิจารณาซ้ำ",
   note:"ศาลฎีกาพิพากษาถึงที่สุดว่าจำเลยไม่มีสิทธิเก็บกินในที่ดิน จำเลยนำประเด็นนี้กลับมาอีก = ห้ามตาม ม.144"},
  {id:"rk32",cat:"appeal",cite:"ฎ.1001/2559",article:"",topic:"จำเลยยกประเด็นนี้ขึ้นอุทธรณ์ได้หรือไม่ ทั้งที่ไม่เคยยกในศาลชั้นต้น?",
   note:"โดยหลัก ม.225 ต้องยกขึ้นว่ากันมาแล้วในศาลชั้นต้น แต่เมื่อคดีอาญาเพิ่งถึงที่สุดในระหว่างพิจารณาคดีแพ่งชั้นต้น พฤติการณ์ไม่เปิดช่องให้จำเลยยกขึ้นต่อสู้ได้ตั้งแต่ต้น จึงเป็นข้อยกเว้นที่ยกขึ้นอุทธรณ์ได้"},
  {id:"rk33",cat:"appeal",cite:"ฎ.11714/2553",article:"ม.225",topic:"ต้องยกขึ้นว่ากันมาแล้วโดยชอบ",
   note:"อุทธรณ์เรื่องอายุความโดยไม่กล่าวว่าคำพิพากษาผิดอย่างไร = อุทธรณ์ไม่ชัดแจ้ง ต้องห้าม"},
  {id:"rk34",cat:"appeal",cite:"ฎ.2170/2516",article:"",topic:"จำเลยจะยกประเด็นเรื่องไม่ได้บอกเลิกการเช่าขึ้นอุทธรณ์และฎีกาได้หรือไม่?",
   note:"แม้จำเลยจะเคยให้การต่อสู้ไว้ แต่เมื่อศาลชี้สองสถานไม่ได้กำหนดเป็นประเด็นนำสืบและจำเลยไม่ได้โต้แย้งคำสั่งนั้นไว้ ย่อมยกขึ้นอ้างในชั้นอุทธรณ์และฎีกาไม่ได้ ต้องห้ามตาม ม.226"},
  {id:"rk35",cat:"appeal",cite:"ฎ.3558/2530",article:"ม.224",topic:"ข้อจำกัดอุทธรณ์ข้อเท็จจริง",
   note:"โจทก์ 2 คนฟ้องรวม 60,619 บาท แต่แยกรายบุคคลไม่เกิน 50,000 → ห้ามอุทธรณ์ข้อเท็จจริง"},
  {id:"rk36",cat:"appeal",cite:"ฎ.3900/2549",article:"ม.227,228",topic:"ข้อยกเว้น — ไม่ใช่คำสั่งระหว่างพิจารณา",
   note:"ศาลสั่งงดสืบพยานแล้วพิพากษายกฟ้องเพราะโจทก์ไม่มีอำนาจฟ้อง = ชี้ขาดเบื้องต้น (ม.24) → โจทก์อุทธรณ์ได้ทันทีโดยไม่ต้องโต้แย้งก่อน"},
  {id:"rk37",cat:"appeal",cite:"ฎ.936/2548",article:"ม.226",topic:"คำสั่งระหว่างพิจารณา — ต้องโต้แย้งก่อน",
   note:"คำสั่งไม่อนุญาตให้จำเลยเลื่อนคดี = คำสั่งระหว่างพิจารณา ต้องโต้แย้งไว้ก่อน → ไม่โต้แย้ง ศาลชั้นต้นสั่งไม่รับอุทธรณ์ชอบแล้ว"},
  {id:"rk38",cat:"appeal",cite:"ฎ.96/2509 (ประชุมใหญ่)",article:"",topic:"จำเลยอุทธรณ์คำสั่งยกคำร้องขอแก้ไขคำให้การนี้ได้หรือไม่?",
   note:"คำร้องขอแก้ไขคำให้การเป็นการตั้งประเด็น จึงเป็นคำคู่ความ เมื่อศาลสั่งยกคำร้องมีผลเป็นคำสั่งไม่รับคำคู่ความ ทำให้ประเด็นที่ตั้งขึ้นเสร็จไป จำเลยอุทธรณ์ได้ตาม ม.223 โดยไม่ต้องโต้แย้งไว้ก่อน (ไม่ใช่การอุทธรณ์คำสั่งระหว่างพิจารณาตาม ม.226)"},
  {id:"rk39",cat:"phdn",cite:"ฎ.21697/2556",article:"พ.ธ.น. ม.25(1)",topic:"อำนาจไต่สวนชันสูตรพลิกศพ — ต้องดูอำนาจศาลของคดีอาญาที่จะตามมา",
   note:"พลทหารยิงพลเรือนตาย อัยการยื่นไต่สวนชันสูตรพลิกศพที่ศาลจังหวัด (ที่เกิดเหตุ) — ศาลจังหวัดไม่มีอำนาจ เพราะผู้ก่อเหตุเป็นบุคคลในอำนาจศาลทหาร เมื่อคดีอาญาที่จะตามมาต้องขึ้นศาลทหาร การไต่สวนชันสูตรพลิกศพซึ่งเป็นขั้นตอนตั้งต้นก็ต้องไปที่ศาลทหารเช่นกัน เพื่อความต่อเนื่องของกระบวนพิจารณา"},
  {id:"rk40",cat:"jurisdiction",cite:"ฎ.269/2543",article:"ม.4(1)",topic:"มูลคดีเกิดหลายแห่ง — สัญญาทางโทรศัพท์ข้ามจังหวัด",
   note:"เสนอ-สนองสัญญากันทางโทรศัพท์/แฟกซ์คนละจังหวัด ถือว่ามูลคดีเกิดขึ้นทั้ง 2 แห่ง โจทก์เลือกฟ้องที่ศาลใดศาลหนึ่งได้ตาม ม.4(1)"},
  {id:"rk41",cat:"jurisdiction",cite:"ฎ.3053/2533",article:"ม.4(1)",topic:"ภูมิลำเนา — ย้ายออกแต่ยังไม่เข้าที่ใหม่ (ลอยนวล)",
   note:"จำเลยแจ้งย้ายชื่อออกจากทะเบียนบ้านเดิมแต่ยังไม่แจ้งย้ายเข้าที่ใหม่ (ไม่มีเจตนาย้ายถิ่นที่อยู่จริง) ให้ถือว่าถิ่นที่อยู่เดิม (ภูมิลำเนาเดิม) ยังใช้บังคับได้ โจทก์ฟ้องที่ภูมิลำเนาเดิมได้"},
  {id:"rk42",cat:"jurisdiction",cite:"ฎ.13349/2557",article:"",topic:"⚠️ ทุนทรัพย์ผลสืบเนื่อง — เพิกถอนฉ้อฉล + กำจัดมรดก",
   note:"ฟ้องเพิกถอนนิติกรรมขายที่ดินฉ้อฉลราคา 250,000 บาท (มีทุนทรัพย์ อยู่ในอำนาจศาลแขวง) พ่วงขอกำจัดทายาทมิให้รับมรดก (โดยสภาพไม่มีทุนทรัพย์) — ศาลแขวงมีอำนาจพิจารณาทั้งคดี เพราะการกำจัดมรดกเป็นผลสืบเนื่องอัตโนมัติจากการฉ้อฉลในคำขอส่วนแรก"},
  {id:"rk43",cat:"jurisdiction",cite:"ฎ.1367/2494",article:"",topic:"คดีมีทุนทรัพย์ — ไถ่ถอนขายฝาก",
   note:"ฟ้องขอไถ่ถอนที่ดินที่ขายฝากไว้ (อ้างว่าชำระสินไถ่แล้ว) กรรมสิทธิ์ได้โอนไปยังผู้ซื้อฝากแล้วตั้งแต่ทำสัญญา หากชนะคดีโจทก์จะได้กรรมสิทธิ์กลับคืนมา ถือเป็นคดีมีทุนทรัพย์ตามราคาที่ดิน"},
  {id:"rk44",cat:"jurisdiction",cite:"ฎ.5543/2541",article:"",topic:"คดีมีทุนทรัพย์ — ที่ดินขึ้นทะเบียนเป็นสาธารณสมบัติแล้วฟ้องเอาคืน",
   note:"แม้โจทก์อ้างว่าที่ดินเป็นของตนมาตลอดไม่เคยยกให้ แต่เมื่อทะเบียน (เอกสารมหาชน) ระบุว่าที่ดินเป็นสาธารณสมบัติของแผ่นดินไปแล้ว การฟ้องขอให้แก้ทะเบียนกลับมาเป็นของโจทก์ถือเป็นการได้ทรัพย์สินเพิ่มขึ้น จึงเป็นคดีมีทุนทรัพย์ตามราคาที่ดิน"},
  {id:"rk45",cat:"jurisdiction",cite:"ฎ.846/2527",article:"",topic:"คดีไม่มีทุนทรัพย์ — ห้ามใช้ชื่อทางการค้า",
   note:"ฟ้องห้ามจำเลยใช้ชื่อสถานประกอบการค้าที่คล้ายกับของโจทก์ พ่วงเรียกค่าเสียหาย ประเด็นหลักคือ 'สิทธิในการใช้ชื่อ' ซึ่งคำนวณเป็นเงินไม่ได้ ค่าเสียหายที่ขอเป็นเพียงคำขอรอง จึงเป็นคดีไม่มีทุนทรัพย์ ต้องฟ้องศาลจังหวัด"},
  {id:"rk46",cat:"jurisdiction",cite:"ฎ.459/2537",article:"",topic:"คดีมีทุนทรัพย์ — แย่งสิทธิครอบครองที่ดินมือเปล่า",
   note:"ที่ดินมือเปล่าไม่มีกรรมสิทธิ์แต่มี 'สิทธิครอบครอง' ซึ่งเป็นทรัพย์สินที่กฎหมายรับรอง เมื่อคู่ความแย่งชิงสิทธิครอบครองกัน ฝ่ายชนะได้สิทธิในทรัพย์นั้นไป จึงเป็นคดีมีทุนทรัพย์ตามราคาที่ดิน"},
  {id:"rk47",cat:"jurisdiction",cite:"ฎ.4550/2540",article:"",topic:"คดีไม่มีทุนทรัพย์ — แบ่งแยกการครอบครองระหว่างเจ้าของรวม",
   note:"เจ้าของรวมทุกคนมีกรรมสิทธิ์ร่วมกันในทุกอณูของทรัพย์อยู่แล้ว การฟ้องขอแบ่งแยกการครอบครองให้เป็นส่วนสัดเป็นเพียงการจัดการทรัพย์สินของตนเองให้ชัดเจน ไม่ได้กรรมสิทธิ์เพิ่มขึ้นจากเดิม จึงเป็นคดีไม่มีทุนทรัพย์"},
  {id:"rk48",cat:"parties",cite:"ฎ.1479/2517",article:"ม.55",topic:"⚠️ ไม่มีอำนาจฟ้อง — จำเลยไม่ได้โต้แย้งสิทธิเอง",
   note:"เจ้าหน้าที่รัฐรังวัดที่ดินผิดพลาดทำให้ที่ดินโจทก์ล้ำเข้าไปในที่ของจำเลย โดยจำเลย (เจ้าของที่ข้างเคียง) ไม่ได้ทำอะไรเลย ถือว่าจำเลยยังไม่ได้โต้แย้งสิทธิโจทก์ โจทก์ไม่มีอำนาจฟ้องจำเลย ต้องไปว่ากล่าวกับเจ้าหน้าที่ผู้รังวัดผิดแทน"},
  {id:"rk49",cat:"parties",cite:"ฎ.2949-2951/2540 (คดีมาบุญครอง)",article:"ม.55",topic:"⚠️ ไม่มีอำนาจฟ้อง — วางทรัพย์เป็นการใช้สิทธิตามกฎหมาย",
   note:"ผู้เช่าช่วงนำเงินค่าเช่าไปวางทรัพย์เพราะไม่แน่ใจว่าต้องจ่ายให้ผู้ให้เช่าเดิมหรือผู้มีสิทธิใหม่ การวางทรัพย์เป็นการใช้สิทธิตามกฎหมายของผู้เช่าช่วงเอง ไม่ถือว่าเป็นการโต้แย้งสิทธิโจทก์ โจทก์จึงไม่มีอำนาจฟ้อง"},
  {id:"rk50",cat:"parties",cite:"ฎ.97/2534",article:"ม.55",topic:"มีอำนาจฟ้อง — ผู้เช่าฟ้องขับไล่ผู้บุกรุกเองได้",
   note:"ผู้เช่าที่ดินวัดมีเพียงสิทธิครอบครองในฐานะผู้เช่า เมื่อมีคนมาบุกรุกที่เช่า ถือเป็นการโต้แย้งสิทธิครอบครองของผู้เช่าโดยตรง ผู้เช่าฟ้องขับไล่ผู้บุกรุกได้เอง ไม่จำเป็นต้องให้เจ้าของที่ดิน (วัด) เป็นผู้ฟ้อง"},
  {id:"rk51",cat:"parties",cite:"ฎ.100/2524, ฎ.157/2524",article:"ม.55",topic:"⚠️ ไม่มีอำนาจยื่นคำร้องขอ — ไม่มีกฎหมายรับรองสิทธิ",
   note:"คดีไม่มีข้อพิพาทต้องมีกฎหมายบัญญัติรับรองไว้ชัดเจนจึงจะร้องขอต่อศาลได้ — ร้องขอให้ศาลสั่งว่าตนเป็นบุคคลเดียวกับคนเดิม (ฎ.100/2524) และร้องขอเปลี่ยนคำนำหน้าเป็น 'นางสาว' หลังผ่าตัดแปลงเพศ (ฎ.157/2524) ไม่มีกฎหมายมาตราใดให้อำนาจศาลสั่งเรื่องเหล่านี้ไว้ จึงไม่มีอำนาจยื่นคำร้องขอ"},
  {id:"rk52",cat:"jurisdiction",cite:"ฎ.2786/2540",article:"ม.4(1)",topic:"มูลคดีต้องแยกเป็นรายสัญญา ห้ามเหมารวม",
   note:"จำเลยขายรถสินสมรส 2 คันให้คนละคน สัญญาคนละที่คนละปี โจทก์ฟ้องเรียกเงินจากการขายทั้ง 2 คันรวมกันที่ศาลจังหวัดเชียงใหม่ (ที่ทำสัญญาคันแรก) — ฟ้องรวมไม่ได้ มูลคดีของรถแต่ละคันต้องพิจารณาแยกตามที่ทำสัญญาของคันนั้นๆ"},
  {id:"rk53",cat:"jurisdiction",cite:"ฎ.2098/2519",article:"ม.4ทวิ",topic:"เพิกถอนซื้อขาย+ให้โอนคืนที่ดิน = อสังหาริมทรัพย์",
   note:"ฟ้องขอเพิกถอนสัญญาซื้อขายที่ดินระหว่างจำเลยที่ไม่สุจริต และให้โอนโฉนดคืนโจทก์ — เป้าหมายคือกรรมสิทธิ์ในที่ดินโดยตรง จึงเป็นคำฟ้องเกี่ยวด้วยอสังหาริมทรัพย์ตาม ม.4ทวิ ฟ้องที่ศาลซึ่งที่ดินตั้งอยู่ได้"},
  {id:"rk54",cat:"jurisdiction",cite:"ฎ.1173/2518",article:"ม.4ทวิ",topic:"ค่าเสียหาย 'และ' ห้ามรบกวนครอบครอง = อสังหาริมทรัพย์",
   note:"ฟ้องเรียกค่าเสียหายจากการบุกรุกโค่นต้นไม้ 'และ' ขอห้ามจำเลยกับบริวารรบกวนสิทธิครอบครองต่อไป — แม้ดูเป็นค่าเสียหายละเมิด แต่คำขอส่วนหลังเล็งเป้าที่ตัวอสังหาริมทรัพย์โดยตรง ทำให้ทั้งคดีเข้า ม.4ทวิ"},
  {id:"rk55",cat:"jurisdiction",cite:"ฎ.797/2515",article:"ม.4ทวิ",topic:"ค่าเสียหาย 'และ' ขอแสดงว่าที่ดินเป็นสาธารณะ = อสังหาริมทรัพย์",
   note:"ฟ้องเรียกค่าเสียหายจากการถมเหมืองน้ำ 'และ' ขอให้ศาลพิพากษาแสดงว่าทำนบ/เหมืองน้ำเป็นสาธารณะ — คำขอส่วนหลังมีเป้าหมายวินิจฉัยความเป็นอยู่ของอสังหาริมทรัพย์โดยตรง ทำให้เข้า ม.4ทวิ"},
  {id:"rk56",cat:"jurisdiction",cite:"ฎ.1599/2529",article:"ม.4(1)",topic:"ขอเงินอย่างเดียวแม้เกี่ยวที่ดิน = ม.4(1) ไม่ใช่ ม.4ทวิ",
   note:"จำเลยโอนที่ดิน/สิ่งปลูกสร้างให้โจทก์ไปแล้ว โจทก์ฟ้องเรียกเพียงค่าเสียหายจากการผิดสัญญา ไม่มีคำขอบังคับตัวทรัพย์ต่อท้าย — แม้เนื้อหาเกี่ยวข้องกับที่ดิน แต่เป้าหมายคำฟ้องคือเงินเท่านั้น จึงเป็นหนี้เหนือบุคคลธรรมดาตาม ม.4(1) ไม่เข้า ม.4ทวิ"},
  {id:"rk57",cat:"jurisdiction",cite:"ฎ.1783/2527 (ประชุมใหญ่)",article:"ม.4ทวิ",topic:"⚠️ ต้องวินิจฉัยกรรมสิทธิ์ก่อนตัดสินละเมิด = อสังหาริมทรัพย์ (แม้ไม่มีคำขอบังคับทรัพย์)",
   note:"ฟ้องละเมิดสูญเสียที่ดิน จำเลยต่อสู้ว่าที่ดินเป็นสาธารณะ (ไม่ได้อ้างว่าเป็นของจำเลย) แม้คำฟ้องไม่มีคำขอบังคับตัวที่ดินเลย แต่การจะวินิจฉัยว่าจำเลยทำละเมิดหรือไม่ต้องชี้ขาดก่อนว่าที่ดินเป็นของโจทก์หรือที่สาธารณะ จึงเป็นคดีเกี่ยวด้วยอสังหาริมทรัพย์ตาม ม.4ทวิ — ⭐ หลักสำคัญ: 'มีอำนาจฟ้อง (ฟ้องได้ที่ศาลนั้น) กับชนะคดี เป็นคนละเรื่องกัน' คดีนี้ฟ้องได้ที่ศาลซึ่งที่ดินตั้งอยู่ แต่สุดท้ายศาลยกฟ้องเพราะจำเลยไม่มีอำนาจหน้าที่เกี่ยวกับที่สาธารณะ"},
  {id:"rk58",cat:"jurisdiction",cite:"ฎ.3818/2538",article:"ม.4(1)",topic:"มูลคดีเช็ค — ที่ออกเช็คชำระหนี้ ไม่ใช่ที่เรียกเก็บเงิน",
   note:"ผู้ทรงเช็คนำเช็คไปเรียกเก็บเงินที่จังหวัดหนึ่ง แต่มูลหนี้ที่แท้จริง (ต้นเหตุการโต้แย้งสิทธิ) คือการซื้อขายสินค้าและออกเช็คชำระหนี้ที่อีกจังหวัดหนึ่ง — มูลคดีเกิดที่จังหวัดซึ่งซื้อขายและออกเช็ค ไม่ใช่ที่ผู้ทรงเช็คคนหลังนำไปเข้าบัญชีเรียกเก็บเงิน"},
  {id:"rk59",cat:"jurisdiction",cite:"ฎ.5912/2539",article:"ม.4จัตวา",topic:"ภูมิลำเนาเจ้ามรดก — ดูข้อเท็จจริงจริง ไม่ใช่แค่ทะเบียนบ้าน",
   note:"แม้ผู้ตายมีชื่อในทะเบียนบ้านและถึงแก่ความตายที่จังหวัดหนึ่ง แต่อยู่กินฉันสามีภริยามีบุตร 4 คนและซื้อที่ดินไว้ที่อีกจังหวัดหนึ่ง ถือว่าจังหวัดหลังเป็นภูมิลำเนาจริงตาม ป.พ.พ. ม.37 ผู้ร้องยื่นคำร้องขอตั้งผู้จัดการมรดกที่ศาลจังหวัดนั้นได้ตาม ม.4จัตวา"},
  {id:"rk60",cat:"phdn",cite:"ฎ.3374/2566",article:"พ.ธ.น. ม.24(2)",topic:"คำร้องขอกำหนดโทษใหม่ = วินิจฉัยชี้ขาด ต้ององค์คณะ",
   note:"การพิจารณาคำร้องขอให้กำหนดโทษใหม่ (เช่น ตามกฎหมายยาเสพติดฉบับใหม่) เป็นการวินิจฉัยเนื้อหาสาระว่าจำเลยควรรับโทษมากน้อยเพียงใด ถือเป็นการวินิจฉัยชี้ขาดข้อพิพาทแห่งคดี ไม่อยู่ในอำนาจผู้พิพากษาคนเดียวตาม ม.24 เมื่อเป็นคดีในศาลจังหวัดต้องให้องค์คณะผู้พิพากษา 2 คนพิจารณา"},
  {id:"rk61",cat:"pleading",cite:"ฎ.651/2498",article:"ม.172 ว.2",topic:"⚠️ ฟ้องเคลือบคลุม — ข้อเท็จจริงขัดกันเอง",
   note:"ฟ้องอ้างว่าพินัยกรรม 'ปลอม' (เจ้ามรดกไม่ได้ทำ) และในขณะเดียวกันก็อ้างว่า 'ถูกหลอกลวงให้ทำ' (ทำแต่สำคัญผิด) — สองข้อเท็จจริงนี้เป็นไปพร้อมกันไม่ได้ เป็นฟ้องเคลือบคลุมเฉพาะส่วนนี้ แต่ศาลยกฟ้องทั้งคดีไม่ได้ ต้องพิจารณาส่วนที่ไม่เคลือบคลุม (เช่น พินัยกรรมฉบับอื่น) ต่อไป"},
  {id:"rk62",cat:"pleading",cite:"ฎ.5137/2533, ฎ.3161/2533",article:"ม.172 ว.2",topic:"ไม่เคลือบคลุม — ข้อเท็จจริง/ข้อกฎหมายสองทางที่ไปด้วยกันได้",
   note:"ฟ้องว่าถูกทั้ง 'กลฉ้อฉล' และ 'ข่มขู่' รวมกันไม่เคลือบคลุม เพราะเกิดพร้อมกันได้ในทางปฏิบัติ (ฎ.5137/2533) — ฟ้องบรรยายข้อเท็จจริงชัดเจนแต่ไม่ฟันธงว่าเป็น 'ทางจำเป็น' หรือ 'ภาระจำยอม' ก็ไม่เคลือบคลุม เพราะการปรับบทกฎหมายเป็นหน้าที่ศาล ไม่ใช่โจทก์ (ฎ.3161/2533)"},
  {id:"rk63",cat:"pleading",cite:"ฎ.759/2519, ฎ.5141/2549",article:"ม.172 ว.2",topic:"⚠️ ฟ้องเคลือบคลุม — ไม่บอกที่มาของหนี้/ค่าเสียหาย",
   note:"ฟ้องเรียกเงินค่าก่อสร้างเพิ่มเติมลอยๆ โดยไม่บอกว่าจ้างงานอะไร เมื่อไร คิดราคาเท่าไร (ฎ.759/2519) หรือฟ้องว่าผิดสัญญาซื้อขายที่ดินทำให้เสียหายไม่น้อยกว่า 500,000 บาท โดยไม่บอกว่าเสียหายอย่างไร (ฎ.5141/2549 — โจทก์แพ้คดีเพราะเหตุนี้) ล้วนเป็นฟ้องเคลือบคลุมเพราะขาดรายละเอียดสำคัญที่ทำให้จำเลยไม่เข้าใจสภาพแห่งข้อหา"},
  {id:"rk64",cat:"pleading",cite:"ฎ.1128/2508",article:"ม.172 ว.2",topic:"ไม่เคลือบคลุม — คดีละเมิดไม่ต้องระบุตัวเลขค่าเสียหาย",
   note:"ฟ้องละเมิดปักเสารุกล้ำ/ปิดทางเดิน เรียกค่าเสียหายโดยไม่ระบุจำนวนเจาะจง ไม่เคลือบคลุม เพราะกฎหมายให้ศาลกำหนดค่าเสียหายได้เองตามพฤติการณ์และความร้ายแรงแห่งละเมิด"},
  {id:"rk65",cat:"pleading",cite:"ฎ.948/2501, ฎ.1286/2508",article:"ม.172",topic:"⭐ กลยุทธ์ฟ้องขับไล่ — อย่าอ้างกรรมสิทธิ์ถ้าไม่ใช่เจ้าของ",
   note:"ผู้ให้เช่าที่ไม่ใช่เจ้าของที่ดินเอง (เช่าช่วง/เช่าที่ราชพัสดุมาปล่อยต่อ) เมื่อฟ้องขับไล่ควรอาศัยสิทธิตามสัญญาเช่าเท่านั้น หากไปบรรยายฟ้องอ้างกรรมสิทธิ์ในที่ดิน จะเปิดช่องให้จำเลยต่อสู้แทงสวนเรื่องความเป็นเจ้าของที่ดิน ทำให้ศาลต้องวินิจฉัยกรรมสิทธิ์ซึ่งเป็นประเด็นที่ไม่จำเป็นและอาจทำให้แพ้คดีได้ (ฎ.1286/2508 อ้างอิงหลัก ฎ.948/2501)"},
  {id:"rk66",cat:"parties",cite:"ฎ.8880/2547",article:"ม.59",topic:"⭐ คู่ความร่วม — ผลที่เป็นคุณแผ่ถึงกัน (ทำดีได้ดีด้วยกัน)",
   note:"สัญญาเช่าซื้อไม่ได้ปิดอากรแสตมป์ ใช้เป็นพยานหลักฐานไม่ได้ จำเลยที่ 1 (ลูกหนี้) จึงชนะคดี แม้จำเลยที่ 2 (ผู้ค้ำประกัน) จะเบิกความรับว่ามีสัญญาจริงก็ตาม ผลของการยกฟ้องจำเลยที่ 1 ยังแผ่ไปถึงจำเลยที่ 2 ให้พ้นความรับผิดไปด้วย เพราะมูลความแห่งคดีเป็นหนี้ที่แบ่งแยกไม่ได้"},
  {id:"rk67",cat:"parties",cite:"ฎ.914/2538, ฎ.2987/2525",article:"ม.59",topic:"คู่ความร่วม — อายุความและการเลื่อนคดีแผ่ถึงกัน",
   note:"ลูกหนี้ร่วมคนหนึ่งยกอายุความขึ้นต่อสู้สำเร็จ ผลแผ่ไปถึงลูกหนี้ร่วมคนอื่นที่ไม่ได้ยกขึ้นเองหรือไม่ได้ฎีกาด้วย (ฎ.914/2538) — ทนายจำเลยร่วมคนหนึ่งขอเลื่อนคดีเพราะป่วย ผลการอนุญาตเลื่อนแผ่ไปถึงจำเลยร่วมคนอื่นด้วย เพราะกระบวนพิจารณาแยกจากกันไม่ได้ (ฎ.2987/2525)"},
  {id:"rk68",cat:"parties",cite:"ฎ.1713/2523",article:"ม.59",topic:"⚠️ คู่ความร่วม — คำท้าไม่ผูกพันผู้ไม่ยินยอม",
   note:"จำเลยที่ 1 ตกลงท้าพิสูจน์ลายมือกับโจทก์โดยจำเลยที่ 2 ไม่ยินยอมด้วย คำท้าถือเป็นกระบวนพิจารณาที่อาจก่อผลเสีย ('ทำชั่วรับไปคนเดียว') ผลแพ้ชนะตามคำท้าจึงผูกพันเฉพาะจำเลยที่ 1 เท่านั้น ไม่ผูกพันจำเลยที่ 2"},
  {id:"rk69",cat:"parties",cite:"ฎ.5463/2534",article:"ม.57",topic:"⚠️ ร้องสอดไม่ได้ — ยังเป็นคู่ความเดิมอยู่",
   note:"จำเลยที่ขาดนัดยื่นคำให้การยังมีสถานะเป็นคู่ความ (จำเลย) ในคดีอยู่ จะใช้ช่องทางร้องสอดกลับเข้ามาสู้คดีไม่ได้ ต้องดำเนินการตามกระบวนคดีขาดนัดแทน — โจทก์เองก็ขอให้ศาลหมายเรียกจำเลยเดิมเข้ามาในคดีซ้ำอีกไม่ได้เช่นกัน"},
  {id:"rk70",cat:"parties",cite:"ฎ.6779/2506",article:"ม.57",topic:"ร้องสอดได้ — พ้นจากสถานะคู่ความแล้ว",
   note:"จำเลยที่ถูกโจทก์ถอนฟ้องไปแล้วและศาลอนุญาต ถือว่าพ้นจากสถานะคู่ความ กลับเป็น 'บุคคลภายนอก' อีกครั้ง จึงร้องสอดเข้ามาใหม่ หรือถูกคู่ความเดิมเรียกให้กลับเข้ามาในคดีได้อีกหากเข้าหลักเกณฑ์"},
  {id:"rk71",cat:"parties",cite:"ฎ.961/2506",article:"ม.57(3)",topic:"ร้องสอด — บุพการีถูกเรียกเป็นจำเลยร่วมไม่ใช่คดีอุทลุม",
   note:"บุตรจะยื่นคำร้องสอดเข้ามาเป็นโจทก์ร่วมเพื่อฟ้องบุพการีของตนไม่ได้ ต้องห้ามตามหลักคดีอุทลุม แต่ถ้าบุพการีถูกศาลหมายเรียกเข้ามาเป็นจำเลยร่วมตาม ม.57(3) ไม่ถือเป็นคดีอุทลุม เพราะไม่ใช่บุตรสมัครใจฟ้องบุพการีเอง"},
  {id:"rk72",cat:"parties",cite:"ฎ.1113/2535, ฎ.4517/2540, ฎ.344/2541",article:"ม.57",topic:"ร้องสอด — ศาลใช้ดุลพินิจปฏิเสธเพราะช้าเกินไป",
   note:"แม้ผู้ร้องจะเข้าหลักเกณฑ์ครบตาม ม.57 แต่ถ้าคดีใกล้เสร็จหรือสืบพยานเกือบเสร็จแล้ว การรับคำร้องสอดจะทำให้ต้องย้อนสืบพยานใหม่ทั้งหมด ศาลมีดุลพินิจไม่รับคำร้องสอดและให้ผู้ร้องไปฟ้องตั้งต้นเป็นคดีใหม่แทนได้ โดยไม่ถือว่าผู้ร้องเสียความยุติธรรม"},
  {id:"rk73",cat:"parties",cite:"ฎ.4477/2529",article:"ม.57(1)",topic:"⚠️ ร้องสอด — ต้องเกี่ยวข้องกับทรัพย์พิพาทโดยตรง",
   note:"โจทก์นำเจ้าพนักงานรังวัดรุกล้ำเข้าไปในที่ดินของบุคคลภายนอกซึ่งอยู่นอกเขตที่ดินพิพาทระหว่างโจทก์กับจำเลย — เจ้าของที่ดินแปลงนั้นร้องสอดเข้ามาไม่ได้ เพราะที่ดินส่วนนั้นไม่ใช่ประเด็นแห่งคดี (หากเป็นจำเลยที่รังวัดรุกล้ำเข้าไปแทน จึงจะถือว่าเกี่ยวข้องและร้องสอดได้)"},
  {id:"rk74",cat:"parties",cite:"ฎ.148/2522",article:"ม.57(1)",topic:"ร้องสอด — ใช้สิทธิของตนเองได้แม้โจทก์เดิมไม่มีอำนาจฟ้อง",
   note:"บิดาที่ไม่ชอบด้วยกฎหมายฟ้องผู้ทำละเมิดทำให้บุตรถึงแก่ความตาย (ซึ่งบิดาเองอาจไม่มีอำนาจฟ้อง) มารดาที่แท้จริงสามารถร้องสอดเข้ามาได้ เพราะเป็นการใช้สิทธิของตนเองขึ้นใหม่โดยเอกเทศ ไม่ได้อิงกับอำนาจฟ้องของโจทก์เดิม"},
  {id:"rk75",cat:"parties",cite:"ฎ.652/2510, ฎ.7091/2542",article:"ม.58 ว.3",topic:"ผลร้องสอด — คำขอท้ายฟ้องอนุโลมรวมผู้ร้องสอดด้วย",
   note:"แม้คำขอท้ายฟ้องเดิมของโจทก์จะมิได้เอ่ยถึงผู้ร้องสอดโดยตรง ก็ต้องอนุโลมว่าเป็นคำขอที่มีผลถึงผู้ร้องสอดด้วย หากศาลพิพากษาให้ผู้ร้องสอดร่วมรับผิด ไม่ถือว่าเป็นการพิพากษาเกินคำขอ"},
  {id:"rk76",cat:"parties",cite:"ฎ.875/2537",article:"ม.58 ว.2",topic:"จำเลยร่วมยื่นคำให้การก่อนจำเลยเดิมได้ ไม่ถือเกินสิทธิ",
   note:"ถ้าจำเลยร่วม (ตาม ม.57(2)) เข้ามาในขณะที่จำเลยเดิมยังไม่ได้ยื่นคำให้การและยังไม่พ้นกำหนดเวลา การที่จำเลยร่วมยื่นคำให้การของตนเข้าไปก่อน ไม่ถือว่าใช้สิทธิเกินกว่าหรือขัดกับสิทธิของจำเลยเดิม เพราะสิทธิของจำเลยเดิมยังไม่ถูกใช้ไป"},

 choices:[{t:"ได้ เพราะมีผลประโยชน์ร่วมกันในมูลความแห่งคดีตาม ม.59",c:true},{t:"ไม่ได้ เพราะแต่ละคนมีสัญญาเป็นรายบุคคลแยกจากกัน",c:false},{t:"ได้เฉพาะกรณีทุนทรัพย์รวมกันไม่เกินเกณฑ์ศาลแขวงเท่านั้น",c:false},{t:"ไม่ได้ เพราะจำนวนคู่ความมากเกินไป",c:false}],
 explain:"ฎ.3252/2548 — แม้สัญญาจะแยกรายบุคคล แต่มูลเหตุที่จำเลยผิดข้อตกลงและอ้างเท็จเป็นเรื่องเดียวกัน ถือว่าโจทก์แต่ละคนมีผลประโยชน์ร่วมกันในมูลความแห่งคดีตาม <b>ม.59</b> จึงรวมฟ้องเป็นคดีเดียวได้"},
{cat:"parties", fact:"โจทก์ 2 คนถูกจำเลยกระทำละเมิดในคราวเดียวกัน ค่าเสียหายแยกกันได้ โจทก์ที่ 1 เสียหาย 200,000 บาท โจทก์ที่ 2 เสียหายเพียง 40,000 บาท (ปกติอยู่ในเขตศาลแขวง)",
 question:"โจทก์ทั้งสองฟ้องรวมกันในคดีเดียวที่ศาลเดียวกันได้หรือไม่?",
 choices:[{t:"ได้ เพราะมูลหนี้เกิดจากละเมิดคราวเดียวกัน มีผลประโยชน์ร่วมกันในมูลความแห่งคดีตาม ม.59",c:true},{t:"ไม่ได้ เพราะทุนทรัพย์ของโจทก์แต่ละคนต่างกัน ต้องแยกฟ้อง",c:false},{t:"ได้เฉพาะโจทก์ที่ 1 เท่านั้น โจทก์ที่ 2 ต้องฟ้องศาลแขวงแยก",c:false},{t:"ไม่ได้ เพราะค่าเสียหายคำนวณแยกกันได้",c:false}],
 explain:"ฎ.7471/2541 — แม้ค่าเสียหายแยกกันได้และโจทก์ที่ 2 มีทุนทรัพย์เพียง 40,000 บาท แต่มูลหนี้เกิดจากละเมิดคราวเดียวกัน ถือมีผลประโยชน์ร่วมกันในมูลความแห่งคดีตาม <b>ม.59</b> ฟ้องรวมกันได้"},
{cat:"parties", fact:"จำเลยในฐานะผู้จัดการมรดกของ ป. ถึงแก่ความตายระหว่างพิจารณาคดี ผู้ร้องซึ่งเป็นทายาทของจำเลย (ไม่ใช่ทายาทของ ป.) ยื่นคำร้องขอเข้าเป็นคู่ความแทนที่จำเลย แต่ผู้ร้องไม่ได้เป็นผู้จัดการหรือผู้ปกครองทรัพย์มรดกของ ป. แต่อย่างใด",
 question:"ผู้ร้องเข้าเป็นคู่ความแทนที่จำเลยได้หรือไม่?",
 choices:[{t:"ไม่ได้ เพราะหน้าที่ผู้จัดการมรดกเป็นเรื่องเฉพาะตัว สิ้นสุดไปพร้อมจำเลย ผู้ร้องไม่มีอำนาจจัดการทรัพย์มรดกของ ป.",c:true},{t:"ได้ เพราะผู้ร้องเป็นทายาทของจำเลยผู้มรณะ",c:false},{t:"ได้ หากศาลอนุญาตตามดุลพินิจโดยไม่มีเงื่อนไข",c:false},{t:"ได้เสมอภายในกำหนด 1 ปีไม่ว่าผู้ร้องจะมีอำนาจจัดการทรัพย์มรดกหรือไม่",c:false}],
 explain:"หน้าที่ผู้จัดการมรดกเป็นเรื่องเฉพาะตัว ไม่ตกทอดไปยังทายาทของผู้จัดการมรดกเอง ผู้ร้องเป็นเพียงทายาทของจำเลย ไม่ใช่ผู้มีอำนาจจัดการทรัพย์มรดกของ ป. จึงเข้าแทนที่ไม่ได้ตาม <b>ม.42-43</b> เมื่อไม่มีคำขอของผู้มีอำนาจที่แท้จริงภายใน 1 ปี ศาลต้องจำหน่ายคดีตาม ม.132(3)"},
{cat:"summary", fact:"คดีมีฟ้องแย้ง ศาลกำหนดให้โจทก์นำสืบก่อน วันนัดสืบพยานจำเลย (ในฐานะจำเลยเดิมและโจทก์ฟ้องแย้ง) ไม่มาศาล ฝ่ายที่มาศาลนำพยานโจทก์สืบจนเสร็จ",
 question:"การไม่มาศาลของจำเลยมีผลต่อฐานะใดบ้าง?",
 choices:[{t:"ขาดนัดพิจารณาทั้งสองฐานะ คือฐานะจำเลยเดิมและฐานะโจทก์ฟ้องแย้ง",c:true},{t:"ขาดนัดเฉพาะฐานะจำเลยเดิมเท่านั้น",c:false},{t:"ขาดนัดเฉพาะฐานะโจทก์ฟ้องแย้งเท่านั้น",c:false},{t:"ไม่ถือว่าขาดนัดเลยเพราะมีฟ้องแย้ง",c:false}],
 explain:"ฎ.3778/2549 — เมื่อคู่ความมี 2 ฐานะพร้อมกัน การไม่มาศาลในวันสืบพยานย่อมถือว่า<b>ขาดนัดพิจารณาทั้งสองฐานะ</b> ศาลชั้นต้นต้องพิจารณาคดีต่อไปฝ่ายเดียวรวมถึงส่วนฟ้องแย้งด้วย"},
{cat:"evidence", fact:"โจทก์ฟ้องเรียกหนี้เงินกู้ จำเลยให้การปฏิเสธว่าไม่เคยกู้ยืมและสัญญากู้เป็นเอกสารปลอม ถึงวันนัดสืบพยานโจทก์ โจทก์ไม่มาศาล จำเลยมาศาลและแถลงไม่ติดใจสืบพยาน ศาลชั้นต้นจึงสั่งจำหน่ายคดีออกจากสารบบความ",
 question:"คำสั่งจำหน่ายคดีของศาลชั้นต้นชอบด้วยกฎหมายหรือไม่?",
 choices:[{t:"ไม่ชอบ เพราะเมื่อจำเลยขอให้พิจารณาต่อ ศาลต้องวินิจฉัยตามภาระพิสูจน์ ซึ่งโจทก์มีภาระแต่ไม่มาสืบ ต้องพิพากษายกฟ้อง ไม่ใช่จำหน่ายคดี",c:true},{t:"ชอบแล้ว เพราะจำเลยไม่ติดใจสืบพยานเท่ากับยุติคดี",c:false},{t:"ชอบแล้ว เพราะโจทก์ขาดนัดพิจารณาต้องจำหน่ายคดีเสมอ",c:false},{t:"ไม่ชอบ เพราะต้องเลื่อนคดีให้โจทก์มาสืบใหม่",c:false}],
 explain:"เมื่อโจทก์ขาดนัดพิจารณาแต่จำเลยแถลงขอให้พิจารณาต่อ ศาลต้องพิจารณาชี้ขาดไปฝ่ายเดียวตาม <b>ม.202</b> โดยดูภาระการพิสูจน์จริง คดีนี้โจทก์มีภาระพิสูจน์เรื่องกู้ยืม เมื่อไม่นำพยานมาสืบ ต้องพิพากษา<b>ยกฟ้อง</b> การสั่งจำหน่ายคดีจึงไม่ชอบ"},
{cat:"appeal", fact:"โจทก์ฟ้องเรียกเงินตามเช็ค 1,000,000 บาท จำเลยให้การปฏิเสธความรับผิด ศาลชั้นต้นเห็นว่าคดีพอวินิจฉัยได้จึงสั่งงดสืบพยานแล้วพิพากษาให้จำเลยชำระหนี้เต็มจำนวน จำเลยอุทธรณ์คำสั่งงดสืบพยานโดยไม่ได้โต้แย้งคำสั่งไว้ก่อน และวางค่าขึ้นศาลชั้นอุทธรณ์ 200 บาท แต่ไม่ได้วางค่าธรรมเนียมใช้แทนโจทก์",
 question:"คำสั่งของศาลชั้นต้นที่ไม่รับอุทธรณ์ของจำเลยชอบด้วยกฎหมายหรือไม่?",
 choices:[{t:"ชอบแล้ว เพราะแม้ประเด็นงดสืบพยานอุทธรณ์ได้โดยไม่ต้องโต้แย้งไว้ก่อน แต่จำเลยไม่วางค่าธรรมเนียมใช้แทนตาม ม.229 จึงเป็นอุทธรณ์ที่ไม่ชอบ",c:true},{t:"ไม่ชอบ เพราะจำเลยมีสิทธิอุทธรณ์คำสั่งงดสืบพยานได้เสมอ",c:false},{t:"ไม่ชอบ เพราะจำเลยไม่จำเป็นต้องวางค่าธรรมเนียมใดๆ เลย",c:false},{t:"ชอบแล้ว เพราะจำเลยไม่ได้โต้แย้งคำสั่งงดสืบพยานไว้ก่อน",c:false}],
 explain:"คำสั่งงดสืบพยานแล้ววินิจฉัยชี้ขาดคดีไปเลยเป็นคำสั่งตาม <b>ม.24</b> ซึ่งทำให้คดีเสร็จไปทั้งเรื่อง ไม่ใช่คำสั่งระหว่างพิจารณาตาม ม.226 จึงอุทธรณ์ได้โดยไม่ต้องโต้แย้งไว้ก่อน แต่เมื่ออุทธรณ์นี้กระทบคำพิพากษาเรื่องเงินโดยตรง จำเลยต้องนำค่าธรรมเนียมที่จะต้องใช้แทนโจทก์มาวางศาลพร้อมอุทธรณ์ตาม <b>ม.229</b> เมื่อไม่วาง จึงเป็นอุทธรณ์ที่ไม่ชอบ"},
{cat:"appeal", fact:"จำเลยยื่นคำร้องขอแก้ไขเพิ่มเติมคำให้การเพื่อตั้งประเด็นใหม่ ศาลมีคำสั่งยกคำร้องตาม ม.180 เมื่อศาลพิพากษาคดีเสร็จแล้ว จำเลยประสงค์จะอุทธรณ์คำสั่งยกคำร้องขอแก้ไขคำให้การนั้น โดยไม่เคยโต้แย้งคำสั่งไว้ก่อนเลย",
 question:"จำเลยอุทธรณ์คำสั่งยกคำร้องขอแก้ไขคำให้การนี้ได้หรือไม่?",
 choices:[{t:"ได้ เพราะเป็นคำสั่งไม่รับคำคู่ความซึ่งทำให้ประเด็นที่ตั้งขึ้นเสร็จไป จึงอุทธรณ์ตาม ม.223 ได้โดยไม่ต้องโต้แย้งไว้ก่อน",c:true},{t:"ไม่ได้ เพราะไม่เคยโต้แย้งคำสั่งไว้ก่อนตาม ม.226",c:false},{t:"ไม่ได้ เพราะคำร้องขอแก้ไขคำให้การไม่ใช่คำคู่ความ",c:false},{t:"ได้เฉพาะกรณีที่ศาลชั้นต้นอนุญาตให้อุทธรณ์เท่านั้น",c:false}],
 explain:"ฎ.96/2509 (ประชุมใหญ่) — คำร้องขอแก้ไขคำให้การเป็นการตั้งประเด็น จึงเป็นคำคู่ความ เมื่อศาลสั่งยกคำร้องมีผลเป็นคำสั่งไม่รับคำคู่ความ ทำให้ประเด็นที่ตั้งขึ้นเสร็จไป จำเลยอุทธรณ์ได้ตาม <b>ม.223</b> โดยไม่ต้องโต้แย้งไว้ก่อน (ไม่ใช่การอุทธรณ์คำสั่งระหว่างพิจารณาตาม ม.226)"},
{cat:"appeal", fact:"คดีแพ่งเกี่ยวเนื่องกับคดีอาญา ระหว่างพิจารณาคดีแพ่งในศาลชั้นต้น ศาลในคดีอาญามีคำพิพากษาถึงที่สุดว่าจำเลยไม่มีความผิด จำเลยในคดีแพ่งจึงยกประเด็นนี้ขึ้นอ้างในชั้นอุทธรณ์เป็นครั้งแรก โดยไม่เคยยกขึ้นในศาลชั้นต้นเลย เพราะขณะนั้นคดีอาญายังไม่ถึงที่สุด",
 question:"จำเลยยกประเด็นนี้ขึ้นอุทธรณ์ได้หรือไม่ ทั้งที่ไม่เคยยกในศาลชั้นต้น?",
 choices:[{t:"ได้ เพราะพฤติการณ์ไม่เปิดช่องให้จำเลยยกขึ้นต่อสู้ในศาลชั้นต้นได้ตั้งแต่แรก",c:true},{t:"ไม่ได้ เพราะเป็นข้อที่ไม่ได้ยกขึ้นว่ากันมาแล้วในศาลชั้นต้นตาม ม.225",c:false},{t:"ไม่ได้ เพราะเป็นเรื่องนอกประเด็นแห่งคดีแพ่งโดยสิ้นเชิง",c:false},{t:"ได้เฉพาะในชั้นฎีกาเท่านั้น อุทธรณ์ยกขึ้นไม่ได้",c:false}],
 explain:"ฎ.1001/2559 — โดยหลัก ม.225 ต้องยกขึ้นว่ากันมาแล้วในศาลชั้นต้น แต่เมื่อคดีอาญาเพิ่งถึงที่สุดในระหว่างพิจารณาคดีแพ่งชั้นต้น พฤติการณ์ไม่เปิดช่องให้จำเลยยกขึ้นต่อสู้ได้ตั้งแต่ต้น จึงเป็น<b>ข้อยกเว้น</b>ที่ยกขึ้นอุทธรณ์ได้"},
{cat:"appeal", fact:"คดีเช่าอสังหาริมทรัพย์ต่างตอบแทนพิเศษ โจทก์ฟ้องระบุว่าได้บอกเลิกการเช่ากับจำเลยแล้ว จำเลยให้การว่าโจทก์ไม่เคยบอกเลิกการเช่า แต่เมื่อศาลชั้นต้นชี้สองสถานและกำหนดประเด็นนำสืบ กลับไม่ได้กำหนดประเด็นเรื่องการบอกเลิกการเช่าไว้ และจำเลยก็ไม่ได้โต้แย้งคำสั่งชี้สองสถานนั้น",
 question:"จำเลยจะยกประเด็นเรื่องไม่ได้บอกเลิกการเช่าขึ้นอุทธรณ์และฎีกาได้หรือไม่?",
 choices:[{t:"ไม่ได้ เพราะไม่ได้โต้แย้งคำสั่งชี้สองสถานที่ไม่กำหนดประเด็นนี้ไว้ ต้องห้ามตาม ม.226",c:true},{t:"ได้เสมอ เพราะจำเลยเคยให้การต่อสู้ประเด็นนี้ไว้แล้ว",c:false},{t:"ได้ เพราะเป็นข้อกฎหมายเกี่ยวด้วยความสงบเรียบร้อย",c:false},{t:"ได้ เพราะศาลชั้นต้นมีหน้าที่ต้องกำหนดประเด็นให้ครบเองโดยไม่ต้องโต้แย้ง",c:false}],
 explain:"ฎ.2170/2516 — แม้จำเลยจะเคยให้การต่อสู้ไว้ แต่เมื่อศาลชี้สองสถานไม่ได้กำหนดเป็นประเด็นนำสืบและจำเลยไม่ได้โต้แย้งคำสั่งนั้นไว้ ย่อมยกขึ้นอ้างในชั้นอุทธรณ์และฎีกาไม่ได้ ต้องห้ามตาม <b>ม.226</b>"},
{cat:"appeal", fact:"ผู้ร้องขอตั้งผู้จัดการมรดกตามพินัยกรรม ผู้คัดค้านยอมรับว่าพินัยกรรมสมบูรณ์ เพียงแต่ข้อความที่ขีดฆ่าต่อเติมไม่สมบูรณ์ ศาลจึงกำหนดประเด็นเฉพาะส่วนที่ขีดฆ่าต่อเติม เมื่อสืบพยานเสร็จ ผู้คัดค้านกลับแถลงว่าพินัยกรรมปลอมทั้งฉบับ และยกประเด็นนี้ขึ้นอุทธรณ์",
 question:"ผู้คัดค้านยกประเด็นพินัยกรรมปลอมทั้งฉบับขึ้นอุทธรณ์ได้หรือไม่?",
 choices:[{t:"ไม่ได้ เพราะเป็นการกล่าวอ้างนอกประเด็นที่ตั้งไว้ในศาลชั้นต้น ไม่ใช่ข้อที่ว่ากันมาแล้วโดยชอบ",c:true},{t:"ได้ เพราะเป็นข้อกฎหมายเกี่ยวด้วยความสงบเรียบร้อยที่ยกขึ้นเองเมื่อใดก็ได้",c:false},{t:"ได้ เพราะผู้คัดค้านเคยยอมรับเรื่องพินัยกรรมไว้แล้วในคำคัดค้าน",c:false},{t:"ได้ เพราะเกี่ยวเนื่องกับประเด็นเรื่องขีดฆ่าต่อเติมโดยตรง",c:false}],
 explain:"ฎ.539/2532 — ประเด็นที่ศาลชั้นต้นกำหนดไว้มีเพียงส่วนขีดฆ่าต่อเติม การกล่าวอ้างว่าพินัยกรรมปลอมทั้งฉบับเป็นการกล่าวอ้าง<b>นอกประเด็น</b>ที่ตั้งไว้ ไม่ใช่ข้อที่ได้ยกขึ้นว่ากันมาแล้วโดยชอบในศาลชั้นต้นตาม <b>ม.225</b>"},

/* ---- เพิ่มจาก น.380 การสอบแก้ตัว ปีการศึกษา 2564 (ต้นฉบับไม่มีเฉลย ผู้ช่วยวิเคราะห์และเขียนเฉลยเพิ่มเติม) ---- */
{cat:"jurisdiction", fact:"นายทิม (สัญชาติอเมริกัน) อยู่กินฉันสามีภริยากับนางนกที่บ้านของนางนกในจังหวัดนราธิวาสมาตั้งแต่ต้นปี 2560 โดยเดินทางไปทำธุรกิจที่มาเลเซียเป็นประจำ วันที่ 1 ต.ค. 2564 นายทิมทำสัญญากู้ยืมเงิน 1 ล้านดอลลาร์สหรัฐจากนายดันแคน (สัญชาติอังกฤษ ภูมิลำเนาลอนดอน) ลงนามที่มาเลเซีย ตกลงคืนเงินภายใน 1 ปี (ครบกำหนด 1 ต.ค. 2565) วันที่ 1 มิ.ย. 2565 ขณะเดินทางกลับจากอินเดียโดยสายการบินไทยเหนือน่านฟ้าเมียนมาร์ ทั้งสองทะเลาะกันจนนายทิมใช้ขวดไวน์ตีศีรษะนายดันแคนบาดเจ็บ เมื่อถึงไทยนายดันแคนทวงเงินคืนทันทีแต่นายทิมปฏิเสธและเดินทางกลับบอสตันทันที วันที่ 1 ก.ค. 2565 นายดันแคนมาปรึกษาว่าจะฟ้องเรียกหนี้เงินกู้ได้หรือไม่",
 question:"ณ วันที่ 1 กรกฎาคม 2565 นายดันแคนมีอำนาจฟ้องเรียกหนี้เงินกู้คืนได้ทันทีหรือไม่?",
 choices:[{t:"ยังฟ้องไม่ได้ เพราะหนี้ยังไม่ถึงกำหนดชำระ (ครบกำหนด 1 ต.ค. 2565) จึงยังไม่มีข้อโต้แย้งสิทธิตาม ม.55 ควรรอถึงกำหนดก่อนจึงฟ้อง",c:true},{t:"ฟ้องได้ทันที เพราะนายทิมปฏิเสธไม่คืนเงินเมื่อถูกทวงถามแล้วถือเป็นข้อโต้แย้งสิทธิ",c:false},{t:"ฟ้องได้ทันที เพราะนายทิมหลบหนีไปต่างประเทศถือเป็นผิดสัญญาโดยปริยาย",c:false},{t:"ฟ้องไม่ได้เลยไม่ว่าเวลาใด เพราะสัญญาทำในต่างประเทศ",c:false}],
 explain:"แม้นายทิมจะปฏิเสธไม่คืนเงินและหลบหนีไป แต่สัญญากู้กำหนดเวลาชำระคืนไว้แน่นอน (ครบกำหนด 1 ต.ค. 2565) สิทธิเรียกร้องตามสัญญายังไม่เกิดขึ้นจนกว่าจะถึงกำหนด การทวงถามก่อนกำหนดยังไม่ถือเป็นข้อโต้แย้งสิทธิตาม <b>ม.55</b> นายดันแคนจึงควรรอจนถึงวันที่ 1 ต.ค. 2565 จึงจะมีอำนาจฟ้อง — ฟ้องก่อนกำหนดเสี่ยงถูกยกฟ้องเพราะยังไม่มีอำนาจฟ้อง<br><br><b>เขตอำนาจศาล</b> (เมื่อถึงเวลาฟ้อง): นายทิมเคยมีถิ่นที่อยู่หลักที่นราธิวาสมาหลายปี น่าจะถือเป็นภูมิลำเนาได้แม้ย้ายออกไปแล้วไม่เกิน 2 ปีตาม ม.3(2)(ก) ส่วนมูลคดีเงินกู้เกิดที่มาเลเซีย (ที่ทำสัญญา) ไม่ใช่เขตศาลไทย จึงอาศัยเขตศาลได้เฉพาะภูมิลำเนาจำเลย (นราธิวาส)<br><br><b>ส่วนค่าเสียหายจากการทำร้ายร่างกาย</b>ที่เกิดบนอากาศยานไทยเหนือน่านฟ้าเมียนมาร์ เป็นประเด็นที่ยังไม่มีบทบัญญัติชัดแจ้งในวิ.แพ่ง ต้องอาศัยการเทียบเคียงหลักที่ว่าการกระทำบนยานพาหนะจดทะเบียนไทยอาจถือเสมือนเกิดในราชอาณาจักร (ทำนองเดียวกับหลักในทางอาญา) ซึ่งยังมีน้ำหนักโต้แย้งได้ทั้งสองทาง ผู้เรียนควรฝึกวิเคราะห์เหตุผลประกอบ ไม่มีคำตอบตายตัวเดียวในส่วนนี้ <i>(หมายเหตุ: ข้อนี้ไม่มีเฉลยต้นฉบับ เป็นการวิเคราะห์เพิ่มเติม)</i>"},
{cat:"service", fact:"ศาลสั่งส่งหมายเรียกและสำเนาคำฟ้องแก่จำเลยทาง EMS ณ ภูมิลำเนาจำเลย เกิด 4 กรณีแยกกัน: (1) ไม่พบจำเลย ออกใบแจ้งให้ไปรับเองที่ทำการไปรษณีย์ภายใน 7 วัน (2) ไม่พบจำเลย จึงปิดหมายไว้ที่ประตูบ้านจำเลย (3) ไม่พบจำเลย นำเอกสารกลับไปที่ทำการไปรษณีย์ และบังเอิญพบภรรยาจำเลยอายุ 21 ปีที่อาศัยบ้านเดียวกันมาส่งพัสดุพอดี จึงส่งมอบเอกสารให้รับไว้ที่ที่ทำการไปรษณีย์ (4) รถขนส่งไปรษณีย์เกิดอุบัติเหตุทำให้จัดส่งล่าช้า หมายเรียกไปถึงมือจำเลยโดยตรงเวลา 20.30 น.",
 question:"กรณีใดต่อไปนี้ถือเป็นการส่งหมายที่ 'ไม่ชอบ' ด้วยกฎหมาย?",
 choices:[{t:"กรณีที่ 1 และกรณีที่ 3",c:true},{t:"กรณีที่ 2 และกรณีที่ 4 เท่านั้น",c:false},{t:"ทั้ง 4 กรณีชอบด้วยกฎหมายทั้งหมด",c:false},{t:"ทั้ง 4 กรณีไม่ชอบด้วยกฎหมายทั้งหมด",c:false}],
 explain:"กรณีที่ 1 เพียงออกใบแจ้งให้จำเลยไปรับเองไม่ถือเป็นการส่งถึงตัวหรือปิดหมายตามหลักเกณฑ์ ม.74/76/79 จึงไม่ชอบ • กรณีที่ 2 ปิดหมายไว้ ณ ภูมิลำเนาจำเลยเมื่อไม่พบตัว เข้าเกณฑ์ <b>ม.79</b> จึงชอบ • กรณีที่ 3 แม้ภรรยาจำเลยจะบรรลุนิติภาวะและอยู่บ้านเดียวกัน แต่ <b>ม.76</b> กำหนดให้ต้องส่ง ณ ภูมิลำเนา/สำนักทำการงานของจำเลยเท่านั้น การส่งมอบที่ทำการไปรษณีย์ไม่ตรงสถานที่ตามกฎหมาย จึงไม่ชอบ • กรณีที่ 4 ส่งถึงตัวจำเลยโดยตรงตาม <b>ม.74</b> แม้ล่าช้าเพราะอุบัติเหตุ แต่ยังเป็นการส่งถึงตัวจริง จึงชอบ <i>(หมายเหตุ: ข้อนี้ไม่มีเฉลยต้นฉบับ เป็นการวิเคราะห์เพิ่มเติม)</i>"},
{cat:"pleading", fact:"โจทก์ฟ้องว่าตนเป็นเจ้าของที่ดิน จำเลยขอเข้าปลูกบ้านอยู่อาศัยโดยเสียค่าตอบแทนปีละ 9,000 บาท ต่อมาโจทก์เรียกเก็บค่าใช้ประโยชน์ที่ดิน จำเลยไม่ยอมจ่ายและไม่ยอมทำหลักฐานเช่าเป็นหนังสือ โจทก์จึงฟ้องขับไล่พร้อมเรียกค่าเสียหาย จำเลยให้การและฟ้องแย้งว่าไม่เคยขออาศัยจากโจทก์ แต่บ้านพิพาทเดิมเป็นของนาย ก. ซึ่งยกให้จำเลย และจำเลยครอบครองปรปักษ์ที่ดินส่วนที่รุกล้ำมาเกิน 10 ปีแล้ว ขอให้ศาลพิพากษาว่าที่ดินพิพาทตกเป็นกรรมสิทธิ์จำเลยโดยครอบครองปรปักษ์ ศาลชั้นต้นสั่งว่าฟ้องแย้งไม่เกี่ยวกับฟ้องเดิม จึงไม่รับฟ้องแย้ง",
 question:"คำสั่งไม่รับฟ้องแย้งของศาลชั้นต้นชอบด้วยกฎหมายหรือไม่?",
 choices:[{t:"ไม่ชอบ เพราะฟ้องแย้งเรื่องกรรมสิทธิ์ที่ดินแปลงเดียวกันเกี่ยวข้องกับฟ้องเดิมโดยตรง หากจำเลยชนะประเด็นนี้ย่อมทำให้ฟ้องขับไล่เดิมตกไปทั้งหมด",c:true},{t:"ชอบแล้ว เพราะเป็นคนละเหตุกับที่โจทก์ฟ้อง (สัญญาเช่า vs ครอบครองปรปักษ์)",c:false},{t:"ชอบแล้ว เพราะฟ้องแย้งเรื่องกรรมสิทธิ์ต้องแยกฟ้องเป็นคดีใหม่เสมอ",c:false},{t:"ไม่ชอบ เพราะศาลไม่มีอำนาจไม่รับฟ้องแย้งไม่ว่ากรณีใด",c:false}],
 explain:"ฟ้องแย้งที่จะรวมพิจารณากับฟ้องเดิมได้ต้อง 'เกี่ยวข้องกัน' พอที่จะพิจารณาและชี้ขาดตัดสินเข้าด้วยกันได้ตาม <b>ม.177 วรรคสาม</b> แม้จำเลยจะอ้างเหตุต่างจากฟ้องเดิม แต่ประเด็นที่แท้จริงคือ 'กรรมสิทธิ์ในที่ดินแปลงเดียวกัน' ซึ่งเป็นรากฐานของฟ้องเดิมทั้งหมด หากจำเลยชนะเรื่องครอบครองปรปักษ์ ฟ้องขับไล่เดิมก็ไม่มีมูลอีกต่อไป ฟ้องแย้งจึงเกี่ยวข้องกับฟ้องเดิมโดยตรง ศาลต้องรับไว้พิจารณารวมกัน คำสั่งไม่รับฟ้องแย้งจึงไม่ชอบ <i>(หมายเหตุ: ข้อนี้ไม่มีเฉลยต้นฉบับ เป็นการวิเคราะห์เพิ่มเติม)</i>"},
{cat:"summary", fact:"โจทก์ฟ้องเรียกหนี้เงินกู้ 500,000 บาท ศาลรับฟ้องเป็นคดีไม่มีข้อยุ่งยากให้พิจารณาอย่างมโนสาเร่ นัดพิจารณาวันเดียวเพื่อไกล่เกลี่ย ให้จำเลยให้การ และสืบพยานโจทก์ในวันเดียวกัน ถึงวันนัดไม่มีคู่ความฝ่ายใดมาศาลเลย ศาลชั้นต้นมีคำสั่งว่าโจทก์ไม่นำพยานหลักฐานมาสืบตามกำหนด ถือว่าคดีของโจทก์ไม่มีมูล และให้ยกฟ้องโจทก์ตาม ม.198 ทวิ วรรคห้า",
 question:"คำสั่งยกฟ้องของศาลชั้นต้นโดยอาศัย ม.198 ทวิ วรรคห้า ชอบด้วยกฎหมายหรือไม่?",
 choices:[{t:"ไม่ชอบ เพราะเป็นกรณีคู่ความทั้งสองฝ่ายขาดนัดพิจารณาในวันสืบพยานนัดแรกของคดีมโนสาเร่ ต้องปรับด้วยหลักขาดนัดพิจารณา (ม.200-201) ไม่ใช่หลักขาดนัดยื่นคำให้การ",c:true},{t:"ชอบแล้ว เพราะโจทก์มีภาระพิสูจน์แต่ไม่นำพยานมาสืบจึงต้องยกฟ้องเสมอ",c:false},{t:"ชอบแล้ว เพราะ ม.198 ทวิ ใช้กับคดีมโนสาเร่ทุกกรณี",c:false},{t:"ไม่ชอบ เพราะศาลต้องเลื่อนคดีให้คู่ความมาใหม่เท่านั้น ห้ามสั่งอย่างอื่น",c:false}],
 explain:"ม.198 ทวิ ใช้กับกรณี 'จำเลยขาดนัดยื่นคำให้การ' ซึ่งศาลต้องพิจารณาฝ่ายเดียวและตรวจว่าคดีโจทก์มีมูลหรือไม่ก่อนพิพากษา แต่คดีมโนสาเร่/ไม่มีข้อยุ่งยากนัดแรกเป็นวันไกล่เกลี่ย ให้การ และสืบพยานพร้อมกัน ยังไม่เข้าสู่กระบวนขาดนัดยื่นคำให้การแบบคดีสามัญ เมื่อคู่ความทั้งสองฝ่ายไม่มาศาลในวันนัดซึ่งเป็นวันสืบพยานนัดแรกด้วย ต้องถือเป็น<b>ขาดนัดพิจารณา</b>ตาม ม.200-201 ศาลชอบที่จะสั่งจำหน่ายคดี ไม่ใช่ยกฟ้องตาม ม.198 ทวิ ว.5 การอ้างมาตราผิดทำให้คำสั่งไม่ชอบ <i>(หมายเหตุ: ข้อนี้ไม่มีเฉลยต้นฉบับ เป็นการวิเคราะห์เพิ่มเติม)</i>"},

{ title:"ที่ดินนางขำ (ข้อจำกัดอุทธรณ์ข้อเท็จจริง)",
  fact:"โจทก์ฟ้องขับไล่จำเลยจากที่ดิน (ค่าเช่าเดือนละ 5,000 บาท) จำเลยต่อสู้ว่าที่ดินเป็นของนางขำมารดาตนซึ่งครอบครองปรปักษ์แล้ว ศาลพิพากษาให้ขับไล่และให้จำเลยชดใช้ค่าเสียหาย 50,000 บาท จำเลยอุทธรณ์ 2 ประเด็น: (1) กรรมสิทธิ์ที่ดินเป็นของนางขำ (2) ค่าเสียหาย 50,000 บาทสูงเกินไป",
  issues:[
    { name:"ประเด็นที่ 1: อุทธรณ์เรื่องกรรมสิทธิ์ (คดีขับไล่)",
      issueOptions:["อุทธรณ์เรื่องกรรมสิทธิ์ที่ดินต้องห้ามหรือไม่","จำเลยต้องเสียค่าขึ้นศาลเท่าใด","ที่ดินเป็นของใครกันแน่","ศาลชั้นต้นมีอำนาจพิจารณาคดีนี้หรือไม่"], issueCorrect:0,
      sectionOptions:["ม.224 วรรคสอง วิ.แพ่ง","ม.224 วรรคแรก วิ.แพ่ง","ม.225 วิ.แพ่ง","ม.148 วิ.แพ่ง"], sectionCorrect:0,
      applyOptions:["คดีขับไล่ไม่มีทุนทรัพย์ ค่าเช่าเดือนละ 5,000 บาท เกิน 4,000 บาท จึงไม่ต้องห้ามอุทธรณ์ข้อเท็จจริง","คดีมีทุนทรัพย์ 50,000 บาท จึงต้องห้ามอุทธรณ์","ค่าเช่าต่ำกว่า 4,000 บาท จึงต้องห้ามอุทธรณ์","เป็นปัญหาข้อกฎหมายจึงอุทธรณ์ได้เสมอ"], applyCorrect:0,
      conclusionOptions:["ศาลชั้นต้นรับอุทธรณ์ประเด็นนี้ได้ ไม่ต้องห้าม","ศาลชั้นต้นต้องไม่รับอุทธรณ์ประเด็นนี้","ต้องรอศาลอุทธรณ์วินิจฉัยว่ารับได้หรือไม่ก่อน","ต้องให้จำเลยวางเงินประกันก่อนจึงรับได้"], conclusionCorrect:0,
      guide:"คดีฟ้องขับไล่ถือเป็นคดีไม่มีทุนทรัพย์ ข้อยกเว้นห้ามอุทธรณ์ข้อเท็จจริงใช้เฉพาะกรณีค่าเช่าไม่เกิน 4,000 บาท/เดือน เมื่อค่าเช่าที่นี่คือ 5,000 บาท (เกิน 4,000) จึงไม่ต้องห้าม อุทธรณ์ข้อเท็จจริงเรื่องกรรมสิทธิ์ได้ตาม ม.224 วรรคสอง" },
    { name:"ประเด็นที่ 2: อุทธรณ์เรื่องค่าเสียหาย (มีทุนทรัพย์)",
      issueOptions:["อุทธรณ์เรื่องจำนวนค่าเสียหายต้องห้ามหรือไม่","ค่าเสียหายคำนวณถูกต้องหรือไม่","จำเลยต้องชำระค่าเสียหายเมื่อใด","โจทก์มีสิทธิเรียกดอกเบี้ยหรือไม่"], issueCorrect:0,
      sectionOptions:["ม.224 วรรคแรก วิ.แพ่ง","ม.224 วรรคสอง วิ.แพ่ง","ม.223 วิ.แพ่ง","ม.226 วิ.แพ่ง"], sectionCorrect:0,
      applyOptions:["ทุนทรัพย์ชั้นอุทธรณ์คือ 50,000 บาท ไม่เกิน 50,000 บาท จึงต้องห้ามอุทธรณ์ข้อเท็จจริง เว้นแต่เข้าข้อยกเว้น","ทุนทรัพย์เกิน 50,000 บาท จึงอุทธรณ์ได้เสมอ","เป็นคดีไม่มีทุนทรัพย์จึงอุทธรณ์ได้เสมอ","ต้องพิจารณารวมกับประเด็นกรรมสิทธิ์เป็นเรื่องเดียว"], applyCorrect:0,
      conclusionOptions:["ศาลชั้นต้นต้องไม่รับอุทธรณ์ประเด็นนี้ เว้นแต่มีความเห็นแย้ง/คำรับรอง/หนังสืออนุญาต","ศาลชั้นต้นรับอุทธรณ์ประเด็นนี้ได้ตามปกติ","ต้องยกฟ้องประเด็นนี้ไปเลยโดยไม่ต้องพิจารณา","ต้องให้ศาลฎีกาวินิจฉัยประเด็นนี้โดยตรง"], conclusionCorrect:0,
      guide:"การอุทธรณ์จำนวนค่าเสียหายเป็นการโต้แย้งดุลพินิจซึ่งเป็นปัญหาข้อเท็จจริงในคดีมีทุนทรัพย์ เมื่อทุนทรัพย์ชั้นอุทธรณ์ (50,000 บาท) ไม่เกิน 50,000 บาท จึงต้องห้ามอุทธรณ์ข้อเท็จจริงตาม ม.224 วรรคแรก เว้นแต่จะเข้าข้อยกเว้น (ความเห็นแย้งของผู้พิพากษา/คำรับรอง/หนังสืออนุญาตอธิบดี)" },
  ]},
{ title:"ผู้จัดการมรดกถึงแก่ความตาย (คู่ความมรณะ)",
  fact:"จำเลยในฐานะผู้จัดการมรดกของ ป. ถึงแก่ความตายระหว่างพิจารณาคดี ผู้ร้องซึ่งเป็นทายาทของจำเลย (ไม่ใช่ทายาทของ ป. และไม่มีอำนาจจัดการทรัพย์มรดกของ ป.) ยื่นคำร้องขอเข้าเป็นคู่ความแทนที่จำเลย",
  issues:[
    { name:"ประเด็นที่ 1: ใครมีสิทธิเข้าเป็นคู่ความแทนที่",
      issueOptions:["ผู้ร้องมีสิทธิเข้าเป็นคู่ความแทนที่จำเลยหรือไม่","ผู้ร้องต้องชำระหนี้แทนจำเลยหรือไม่","ป. เป็นเจ้าของทรัพย์มรดกจริงหรือไม่","ศาลมีอำนาจพิจารณาคดีนี้ต่อไปหรือไม่"], issueCorrect:0,
      sectionOptions:["ม.42-43 วิ.แพ่ง","ม.55 วิ.แพ่ง","ม.148 วิ.แพ่ง","ม.132(3) วิ.แพ่ง"], sectionCorrect:0,
      applyOptions:["หน้าที่ผู้จัดการมรดกเป็นเรื่องเฉพาะตัว สิ้นสุดไปพร้อมจำเลย ผู้ร้องไม่มีอำนาจจัดการทรัพย์มรดกของ ป.","ผู้ร้องเป็นทายาทของจำเลยจึงรับช่วงสิทธิหน้าที่ทั้งหมดของจำเลยโดยอัตโนมัติ","หน้าที่ผู้จัดการมรดกตกทอดแก่ทายาทของจำเลยเสมอ","ไม่มีผลใดๆ เพราะจำเลยตายแล้วคดีเป็นอันยุติ"], applyCorrect:0,
      conclusionOptions:["ผู้ร้องเข้าเป็นคู่ความแทนที่จำเลยไม่ได้ เพราะไม่ใช่ผู้มีอำนาจจัดการทรัพย์มรดกของ ป.","ผู้ร้องเข้าเป็นคู่ความแทนที่ได้ทันที","ผู้ร้องต้องรอศาลแต่งตั้งเป็นผู้จัดการมรดกคนใหม่ก่อนเข้าคดีนี้ไม่ได้เลย","ผู้ร้องเข้าเป็นคู่ความแทนที่ได้แต่ต้องวางเงินประกันก่อน"], conclusionCorrect:0,
      guide:"หน้าที่ผู้จัดการมรดกเป็นเรื่องเฉพาะตัวของผู้ได้รับแต่งตั้ง เมื่อผู้จัดการมรดกตาย หน้าที่นั้นสิ้นสุดลง ไม่ตกทอดไปยังทายาทของผู้จัดการมรดกเอง ผู้ที่จะเข้าแทนที่ได้ต้องเป็นผู้มีอำนาจจัดการทรัพย์มรดกของเจ้ามรดกตัวจริง (ป.) เท่านั้น" },
    { name:"ประเด็นที่ 2: ผลเมื่อพ้นกำหนดไม่มีผู้เข้าแทนที่",
      issueOptions:["ถ้าพ้นกำหนด 1 ปีไม่มีผู้มีอำนาจเข้าแทนที่ ศาลต้องทำอย่างไร","ศาลต้องรอไปเรื่อยๆ จนกว่าจะมีผู้เข้าแทนที่","คดีเป็นโมฆะทันทีที่จำเลยตาย","โจทก์ต้องฟ้องทายาทของจำเลยเป็นคดีใหม่"], issueCorrect:0,
      sectionOptions:["ม.42 ประกอบ ม.132(3) วิ.แพ่ง","ม.148 วิ.แพ่ง","ม.55 วิ.แพ่ง","ม.226 วิ.แพ่ง"], sectionCorrect:0,
      applyOptions:["ไม่มีคำขอของผู้จัดการทรัพย์มรดก/ผู้ปกครองทรัพย์มรดกของ ป. เข้ามาเป็นคู่ความแทนที่ภายใน 1 ปีนับแต่จำเลยตาย","มีทายาทของจำเลยยื่นคำร้องแล้วจึงถือว่าครบกำหนดตามกฎหมาย","ไม่มีกำหนดเวลาใดๆ ในเรื่องนี้ตามกฎหมาย","ต้องนับระยะเวลาจากวันฟ้องคดี ไม่ใช่วันจำเลยตาย"], applyCorrect:0,
      conclusionOptions:["ศาลต้องมีคำสั่งจำหน่ายคดีออกจากสารบบความ","ศาลต้องยกฟ้องโจทก์ทันที","ศาลต้องพิพากษาให้โจทก์ชนะคดีโดยอัตโนมัติ","ศาลต้องเลื่อนการพิจารณาไปไม่มีกำหนด"], conclusionCorrect:0,
      guide:"เมื่อพ้นกำหนด 1 ปีนับแต่วันที่คู่ความฝ่ายนั้นมรณะโดยไม่มีคำขอของผู้มีอำนาจที่แท้จริงเข้ามาเป็นคู่ความแทนที่ ศาลต้องมีคำสั่งจำหน่ายคดีออกจากสารบบความตาม ม.42 ประกอบ ม.132(3)" },
  ]},
{ title:"อุทธรณ์คำสั่งงดสืบพยาน + ค่าธรรมเนียมใช้แทน",
  fact:"โจทก์ฟ้องเรียกเงินตามเช็ค 1,000,000 บาท จำเลยให้การปฏิเสธ ศาลชั้นต้นสั่งงดสืบพยานแล้วพิพากษาให้จำเลยชำระเต็มจำนวน จำเลยอุทธรณ์คำสั่งงดสืบพยานโดยไม่เคยโต้แย้งไว้ก่อน และวางค่าขึ้นศาลอุทธรณ์ 200 บาท แต่ไม่ได้วางค่าธรรมเนียมใช้แทนโจทก์",
  issues:[
    { name:"ประเด็นที่ 1: อุทธรณ์คำสั่งงดสืบพยานโดยไม่โต้แย้งไว้ก่อน",
      issueOptions:["คำสั่งงดสืบพยานแล้วพิพากษาเลย เป็นคำสั่งประเภทใด","จำเลยต้องเสียค่าขึ้นศาลเท่าใด","ศาลชั้นต้นมีอำนาจงดสืบพยานหรือไม่","จำเลยต้องอุทธรณ์ภายในกี่วัน"], issueCorrect:0,
      sectionOptions:["ม.24 วิ.แพ่ง (ไม่ใช่คำสั่งระหว่างพิจารณาตาม ม.226)","ม.226 วิ.แพ่ง (คำสั่งระหว่างพิจารณา ต้องโต้แย้งไว้ก่อน)","ม.174 วิ.แพ่ง","ม.148 วิ.แพ่ง"], sectionCorrect:0,
      applyOptions:["ศาลวินิจฉัยชี้ขาดเบื้องต้นในข้อกฎหมายทำให้คดีเสร็จไปทั้งเรื่อง จึงไม่ใช่คำสั่งระหว่างพิจารณา","ศาลเพียงเลื่อนการสืบพยานออกไป คดียังไม่เสร็จ","เป็นคำสั่งเกี่ยวกับพยานหลักฐานที่ต้องโต้แย้งไว้เสมอ","เป็นคำสั่งที่ไม่มีผลทางกฎหมายใดๆ"], applyCorrect:0,
      conclusionOptions:["จำเลยอุทธรณ์คำสั่งงดสืบพยานได้โดยไม่ต้องโต้แย้งไว้ก่อน","จำเลยอุทธรณ์ไม่ได้เพราะไม่เคยโต้แย้งไว้ก่อน","จำเลยต้องขออนุญาตศาลฎีกาก่อนจึงอุทธรณ์ได้","จำเลยต้องยื่นคำร้องขอให้ศาลชั้นต้นทบทวนเองก่อน"], conclusionCorrect:0,
      guide:"เมื่อศาลสั่งงดสืบพยานแล้ววินิจฉัยชี้ขาดคดีไปเลยโดยอาศัยข้อกฎหมาย ถือเป็นคำสั่งตาม ม.24 ซึ่งทำให้คดีเสร็จไปทั้งเรื่อง จึงไม่ใช่ 'คำสั่งระหว่างพิจารณา' ตาม ม.226 ที่ต้องโต้แย้งไว้ก่อน จำเลยจึงมีสิทธิอุทธรณ์คำสั่งนี้ได้ทันทีแม้ไม่เคยโต้แย้งไว้" },
    { name:"ประเด็นที่ 2: ค่าธรรมเนียมที่ต้องวางพร้อมอุทธรณ์",
      issueOptions:["อุทธรณ์นี้ต้องวางค่าธรรมเนียมใช้แทนโจทก์หรือไม่","ค่าขึ้นศาล 200 บาทที่วางไว้ถูกต้องหรือไม่","จำเลยต้องวางเงินตามจำนวนหนี้เต็มจำนวนหรือไม่","โจทก์ต้องคัดค้านค่าธรรมเนียมหรือไม่"], issueCorrect:0,
