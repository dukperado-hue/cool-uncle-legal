     body:"โครงสร้าง 3 ชั้น: ศาลชั้นต้น → ศาลอุทธรณ์ → ศาลฎีกา • มีศาลชำนาญพิเศษ (แรงงาน, ทรัพย์สินทางปัญญาฯ, ภาษีอากร, ล้มละลาย) และ 'แผนก' เฉพาะด้านในศาล (เช่น แผนกคดีซื้อขายออนไลน์, แผนกยาเสพติด) • ⭐ ทุกคดีต้องเช็คตามลำดับ 3 ขั้น: (1) ชั้นศาล — ต้องเริ่มที่ศาลชั้นต้นเสมอ เว้นแต่กฎหมายกำหนดอื่น (2) เขตศาล — มูลคดีเกิดที่ไหน/จำเลยมีภูมิลำเนาที่ไหน (ป.วิ.พ. ม.4) เช็คจาก พ.ร.บ.จัดตั้งศาลนั้นๆ (3) อำนาจตามสภาพคำฟ้อง — แพ่ง/อาญา ทุนทรัพย์เท่าไหร่ ชำนาญพิเศษหรือไม่"},
    {heading:"2. ศาลจังหวัด vs ศาลแขวง — สองชั้นในจังหวัดเดียวกัน",
     body:"ศาลจังหวัด (ม.18): อำนาจทั่วไป ('ทั้งปวง') ที่ไม่ได้อยู่ในอำนาจศาลอื่น องค์คณะ ≥ 2 คน • ศาลแขวง (ม.17): อำนาจเท่าที่ 'ผู้พิพากษาคนเดียว' มีตาม ม.24-25 เท่านั้น • ตัวอย่างในห้อง: กู้ยืม 200,000 บาท ทำสัญญาที่เชียงใหม่ จำเลยภูมิลำเนาลำพูน — ฟ้องได้ 2 ทาง: ศาลจังหวัดลำพูน (ตามภูมิลำเนาจำเลย, ลำพูนไม่มีศาลแขวง) หรือศาลแขวงเชียงใหม่ (ตามมูลคดีเกิด, ทุนทรัพย์ไม่เกิน 300,000 จึงต้องขึ้นศาลแขวง จะข้ามไปฟ้องศาลจังหวัดเชียงใหม่ไม่ได้)"},
    {heading:"3. ⭐ อำนาจผู้พิพากษาคนเดียว (ม.24-25) — บททดสอบยอดฮิตที่สุด",
     body:"⭐ บททดสอบหลัก ม.24(2): คำสั่งนี้ 'เป็นการวินิจฉัยชี้ขาดข้อพิพาทแห่งคดี' หรือไม่? ถ้าไม่ใช่ (แค่จัดการกระบวนพิจารณา) → ผู้พิพากษาคนเดียวสั่งได้เสมอไม่ว่าคดีจะใหญ่แค่ไหน เช่น สั่งไม่รับฟ้อง/ไม่ประทับฟ้องเพราะฟ้องผิดเขตอำนาจศาล (ยังไม่ได้ตัดสินเนื้อหา), สั่งงดสืบพยานเพราะเห็นว่าประวิงคดี, ลงโทษฐานละเมิดอำนาจศาล, ยกคำร้องขอออกหมายจับเพราะคดีขาดอายุความ (ม.24(1) ประกอบ ป.วิ.อ. ม.68 — เป็นการตรวจเงื่อนไขออกหมาย ไม่ใช่ตัดสินว่าผิดจริงหรือไม่) • ⚠️ แต่ถ้าเป็นการชี้ขาดสิทธิจริง แม้จะอยู่ในรูป 'คำร้อง' ก็ไม่ใช่คำสั่งระหว่างพิจารณา ต้องใช้องค์คณะเมื่อคดีอยู่ในศาลจังหวัด — ยกคำร้องขัดทรัพย์ (ฎ.125/2526), ยกคำร้องขอคืนของกลาง/ปล่อยทรัพย์ (ต้องชี้กรรมสิทธิ์+รู้เห็นเป็นใจหรือไม่), ยกคำร้องขอเฉลี่ยทรัพย์ (ถือเป็นคดีสาขาแยกต่างหาก), ยกคำร้องผู้อ้างว่าไม่ใช่บริวารเพราะครอบครองปรปักษ์ (คดีสาขา), คำร้องขอกำหนดโทษใหม่ (ฎ.3374/2566 — วินิจฉัยเนื้อหาโทษ) ล้วนต้ององค์คณะ 2 คนทั้งสิ้น หากอยู่ในศาลจังหวัด • ม.25(1): ไต่สวน+สั่งชันสูตรพลิกศพ • ม.25(3): ไต่สวนมูลฟ้องคดีอาญา — ⭐ แยกให้ออก: 'ประทับฟ้อง' (รับไว้ ยังไม่จบคดี) ทำได้เสมอแม้อัตราโทษจะเกินอำนาจตนเอง (เพราะยังไม่ใช่การชี้ขาดท้ายสุด) แต่ 'ยกฟ้อง' (จบคดีทันที) ทำไม่ได้ถ้าโทษเกินอำนาจตน • ม.25(4): คดีแพ่งทุนทรัพย์ ≤ 300,000 บาท • ม.25(5): คดีอาญาโทษจำคุกสูงสุด ≤ 3 ปี หรือปรับ ≤ 60,000 บาท แต่ลงจริงได้ไม่เกิน 6 เดือน/10,000 บาท (ดูโทษสุทธิหลังเพิ่ม-ลด, กระทงต่างกรรมต่างวาระดูแยกกระทง) • ⚠️ กรรมเดียวผิดกฎหมายหลายบท ถ้าบทหนักที่สุดเกินอำนาจ (เช่น ม.365(3) โทษ 5 ปี) ผู้พิพากษาคนเดียวไม่มีอำนาจแม้แต่จะ 'ไต่สวนมูลฟ้อง' เพราะถ้าไต่สวนแล้วไม่มีมูลจะต้องพิพากษายกฟ้องซึ่งเกินอำนาจตน (ต้องส่งศาลจังหวัดตั้งแต่ต้น) — ต่างจากกรณี ม.297 ข้างต้นที่โจทก์ไม่มีข้อหาอื่นประกอบ จึงยัง 'ประทับฟ้อง' ได้แม้โทษจะเกินอำนาจพิพากษาของตน"},
    {heading:"4. คดีไม่มีทุนทรัพย์ — ไม่อยู่ในอำนาจผู้พิพากษาคนเดียว/ศาลแขวง",
     body:"หลักจำ: 'ถ้าชนะคดี โจทก์ได้ทรัพย์/เงินเพิ่มขึ้นไหม? ไม่ใช่ = ไม่มีทุนทรัพย์' • ตัวอย่างจากคำบรรยาย: ร้องขอเป็นบุคคลสาบสูญ (เรื่องสถานะบุคคล) • ฟ้องขับไล่ทั่วไป (ขอปลดเปลื้องทุกข์จากการรบกวนสิทธิครอบครอง แม้มีค่าเช่าประกอบก็ดูคำขอหลัก) • เพิกถอนการฉ้อฉล (ม.237 — ทรัพย์กลับเข้ากองทรัพย์สินลูกหนี้ ไม่ใช่ของโจทก์เอง) • ละเมิดขอให้หยุดกิจการ/เหตุเดือดร้อนรำคาญ (คำขอหลักคือให้หยุดกระทำ ไม่ใช่ทรัพย์) • คดีเหล่านี้ต้องขึ้นศาลจังหวัดเสมอ ศาลแขวงไม่มีอำนาจไม่ว่าจำนวนเงินประกอบจะเท่าใด"},
    {heading:"5. ม.19/1 — ผ่อนคลายเขตอำนาจระหว่างศาลจังหวัด-ศาลแขวง",
     body:"ว.1: ฟ้องผิดศาล (คดีในอำนาจศาลแขวงแต่ไปฟ้องศาลจังหวัด) → ศาลจังหวัดมีดุลพินิจรับไว้พิจารณาเองหรือสั่งโอนก็ได้ • ว.2: ⚠️ พฤติการณ์เปลี่ยนระหว่างพิจารณา (เช่น ฟ้องหมิ่นประมาทโฆษณาที่ศาลจังหวัด แต่ไต่สวนแล้วรับเฉพาะหมิ่นธรรมดาที่อยู่ในอำนาจศาลแขวง) → ศาลจังหวัดต้องพิจารณาต่อไปจนจบ จะสั่งโอนไม่ได้"},
    {heading:"6. การทำหน้าที่แทนผู้พิพากษา (ม.28-31)",
     body:"กม.แยกเหตุนั่งพิจารณา (ม.28) ออกจากเหตุทำคำพิพากษา (ม.29) — ผู้มีอำนาจมอบหมายอาจต่างกัน • ม.28: เหตุขัดข้องระหว่างพิจารณา (ป่วย/ย้าย) → อธิบดี/หัวหน้าศาลจ่ายสำนวนให้ผู้พิพากษาอื่นนั่งแทนได้ • ม.29: ⚠️ เหตุขัดข้องระหว่าง 'ทำคำพิพากษา' (เช่น ผู้พิพากษาเจ้าของสำนวนย้ายไปที่อื่นก่อนพิพากษา) → หัวหน้าศาลต้องตรวจสำนวนและลงชื่อร่วมทำคำพิพากษาเองเท่านั้น มอบหมายให้คนอื่นทำแทนไม่ได้ (ฎ.17227/2557)"},
    {heading:"7. ประเภทผู้พิพากษาและข้อจำกัด",
     body:"ผู้พิพากษาประจำศาล (เพิ่งผ่านผู้ช่วยฯ ประสบการณ์น้อย): ตาม ม.25 วรรคสอง ไม่มีอำนาจตาม (3)(4)(5) — ห้ามไต่สวนมูลฟ้อง ห้ามพิพากษาคดีแพ่ง/อาญาคนเดียว ต้องทำงานร่วมองค์คณะเสมอ • ผู้พิพากษาอาวุโส: มีอำนาจพิจารณาพิพากษาเต็มเหมือนผู้พิพากษาทั่วไป แต่ห้ามเป็นหัวหน้าศาล/ผู้รับผิดชอบราชการศาล และห้ามทำหน้าที่แทนหัวหน้าศาลลงชื่อร่วมทำคำพิพากษาตาม ม.29 • องค์คณะศาลจังหวัด (ม.26): ต้อง ≥ 2 คน ห้ามผู้พิพากษาประจำศาล 2 คนนั่งคู่กันเอง ต้องมีผู้พิพากษาศาลชั้นต้น/อาวุโสประกบอย่างน้อย 1 คน"},
    {heading:"8. การจ่ายและเรียกคืนสำนวน (ม.32-33)",
     body:"การจ่ายสำนวน: เป็นอำนาจผู้รับผิดชอบราชการศาล • การเรียกคืนสำนวน: ทำได้เฉพาะเมื่อ 'กระทบกระเทือนต่อความยุติธรรม' เท่านั้น (เช่น ป้องกันคำวินิจฉัยขัดแย้งกันในคดีกลุ่มเดียวกัน) ต้องให้รองประธานฯ หรือผู้พิพากษาอาวุโสสูงสุดถัดจากหัวหน้าศาลเป็นผู้ทำความเห็นเสนอ (ผู้พิพากษาอาวุโส/ประจำศาล ทำความเห็นนี้ไม่ได้) และเรียกคืนได้เพียงครั้งเดียวต่อคดี เว้นแต่เจ้าของสำนวนสมัครใจคืนเอง"},
  ],
  jurisdiction: [
    {heading:"1. 3 ขั้นตอนตรวจเขตอำนาจศาล",
     body:"(1) ชั้นศาล: ต้องเริ่มที่ศาลชั้นต้นเสมอ (2) เขตพื้นที่: ดูภูมิลำเนาจำเลย/มูลคดีเกิด (ม.4) (3) อำนาจตามสภาพคำฟ้อง: คดีแพ่ง/อาญา ทุนทรัพย์เท่าไหร่"},
    {heading:"2. เขตศาล — ฟ้องที่ไหนได้บ้าง (ม.4(1), 4ทวิ, 4(2))",
     body:"ม.4(1) หลักทั่วไป (คดีมีข้อพิพาท): ฟ้องได้ 2 ที่ — ศาลที่จำเลยมีภูมิลำเนา หรือศาลที่มูลคดีเกิด • ⚠️ สัญญาทางโทรศัพท์/ไลน์ข้ามจังหวัด (เสนอ-สนองกันคนละที่) ถือว่ามูลคดีเกิดทั้ง 2 แห่ง ฟ้องได้ทั้งคู่ (ฎ.269/2543) • ย้ายภูมิลำเนาแบบ 'ลอยนวล' (แจ้งย้ายออกแต่ยังไม่เข้าที่ใหม่) กฎหมายให้ถือภูมิลำเนาเดิม (ฎ.3053/2533) • ม.4ทวิ (คดีอสังหาริมทรัพย์ เช่น บังคับจำนอง/ขับไล่/โอนที่ดิน): ฟ้องได้เฉพาะที่ทรัพย์ตั้งอยู่ หรือภูมิลำเนาจำเลยเท่านั้น — ตัดตัวเลือก 'มูลคดีเกิด' ออกไป • ม.4(2) คดีไม่มีข้อพิพาท (ไม่มีจำเลย): ดูมูลคดีเกิด หรือภูมิลำเนาผู้ร้อง"},
    {heading:"3. ⭐ คดีมีทุนทรัพย์ vs ไม่มีทุนทรัพย์ (ออกสอบทุกปี)",
     body:"เทคนิคจำ: 'ถ้าชนะคดี โจทก์ได้เงิน/ทรัพย์เพิ่มขึ้นใหม่ไหม? ใช่ = มีทุนทรัพย์' • มีทุนทรัพย์: เงินกู้ ค่าเสียหาย บังคับโอนที่ดินตามสัญญาจะซื้อจะขาย เพิกถอนนิติกรรมให้โดยเสน่หา (เนรคุณ) ไถ่ถอนขายฝาก (ฎ.1367/2494) เพิกถอนนิติกรรมฉ้อฉลคืนทรัพย์ (แม้เดิมโอนออกไปแล้ว มองที่ผลว่าจะได้กลับมา) เรียกที่ดินมือเปล่า/สิทธิครอบครองคืน (ฎ.459/2537 — สิทธิครอบครองก็เป็นทรัพย์สินชนิดหนึ่ง) เอกสารสิทธิถูกออกทับที่ดินคนอื่นแล้วสู้กลับ (ฎ.5543/2541) • ไม่มีทุนทรัพย์: ฟ้องขับไล่ (เจ้าของเดิมแค่ไล่คนออก ไม่ได้กรรมสิทธิ์ใหม่ ยกเว้นค่าเช่า ≤ 30,000/เดือน เข้าอำนาจศาลแขวงได้) เพิกถอนพินัยกรรมที่ไม่ชอบ (ทายาทมีสิทธิในกองมรดกอยู่แล้วแต่ต้น — ไม่ใช่ก่อตั้งสิทธิใหม่) เพิกถอนการฉ้อฉลเพื่อคืนกองทรัพย์สินลูกหนี้ (ไม่ใช่ทรัพย์โจทก์เอง) ขอสาบสูญ/ตั้งผู้จัดการมรดก ห้ามใช้ชื่อทางการค้า (ฎ.846/2527 — ค่าเสียหายที่ขอมาด้วยเป็นเพียงคำขอรอง) แบ่งแยกการครอบครองระหว่างเจ้าของรวม (ฎ.4550/2540 — มีกรรมสิทธิ์ในทุกอณูอยู่แล้ว ไม่ได้เพิ่มขึ้น)"},
    {heading:"4. เทคนิคคำนวณทุนทรัพย์",
     body:"ดูคำขอท้ายฟ้องเป็นหลัก แม้เสียหายจริงมากกว่าแต่ยอมลดคำขอเพื่อเข้าอำนาจศาลแขวง (Forum Shopping) ศาลยึดตามคำขอจริง • ดอกเบี้ย: นับถึงวันฟ้องเท่านั้น ดอกเบี้ยอนาคตไม่นับ • โจทก์หลายคน สิทธิเฉพาะตัว (เช่น รถชนคนละคัน): แยกทุนทรัพย์รายคน ไม่รวมกัน • หนี้ร่วม (ลูกหนี้ร่วมหลายคนรับผิดยอดเดียวกัน): ไม่หาร ถือเต็มจำนวน"},
    {heading:"5. ⚠️ ทุนทรัพย์ผลสืบเนื่อง — คำขอสองส่วนในฟ้องเดียว",
     body:"เมื่อฟ้องมีคำขอสองส่วนที่ 'ส่วนหนึ่งมีทุนทรัพย์ ส่วนหนึ่งไม่มีทุนทรัพย์' แต่ส่วนที่ไม่มีทุนทรัพย์เป็นผลสืบเนื่องอัตโนมัติจากส่วนแรก ศาลที่มีอำนาจในส่วนแรกมีอำนาจพิจารณาทั้งคดีได้เลย — ฎ.13349/2557: ฟ้องเพิกถอนนิติกรรมขายที่ดินฉ้อฉล (ราคา 250,000 บาท มีทุนทรัพย์ อยู่ในอำนาจศาลแขวง) พ่วงขอกำจัดทายาทมิให้รับมรดก (โดยสภาพไม่มีทุนทรัพย์) — ศาลแขวงมีอำนาจพิจารณาทั้งสองคำขอ เพราะการกำจัดมรดกเป็นผลต่อเนื่องจากการฉ้อฉลในส่วนแรกโดยตรง"},
    {heading:"6. คดีสาขา (แพ่งเกี่ยวเนื่องอาญา) และ Class Action — ข้อยกเว้นทุนทรัพย์",
     body:"คดีแพ่งเกี่ยวเนื่องคดีอาญา (ป.วิ.อ. ม.43, 44/1): แม้ค่าเสียหายที่เรียกเกิน 300,000 บาท ถ้าศาลแขวงมีอำนาจพิจารณาคดีอาญาหลักอยู่แล้ว ศาลแขวงมีอำนาจพิจารณาส่วนแพ่งที่พ่วงมาด้วยได้เสมอ ไม่ต้องแยกไปศาลจังหวัด • ⚠️ กลับกัน: คดีแบบกลุ่ม (Class Action, ม.222/3) ห้ามฟ้องศาลแขวงเด็ดขาด เพราะทุนทรัพย์รวมของสมาชิกกลุ่มมักมหาศาลเกินอำนาจศาลแขวงเสมอ"},
    {heading:"7. ⭐ ม.4(1) vs ม.4ทวิ — จุดตัดที่ออกสอบทุกปี",
     body:"หลักตัดสิน: ดูคำขอท้ายฟ้องเป็นตัวชี้ขาด — ขอ 'เงิน' อย่างเดียว (ค่าเสียหาย/ค่าเช่าค้าง) ไม่มีคำขอบังคับตัวทรัพย์ต่อท้าย = ม.4(1) เท่านั้น แม้จำเลยจะเคยครอบครอง/เกี่ยวข้องกับที่ดิน (ฎ.1599/2529 โจทก์รับโอนที่ดินคืนมาแล้ว เหลือแค่เรียกค่าเสียหาย = 4(1)) • ⚠️ แต่ถ้าคำขอมีคำว่า 'และ' บังคับเอาแก่ตัวทรัพย์ต่อท้ายคำขอเงิน (โอนโฉนด/บังคับจำนอง/ห้ามรบกวนครอบครอง/แสดงว่าที่ดินเป็นสาธารณะ) → 'เลี้ยวเข้า' ม.4ทวิ ทันที แม้ประเด็นหลักดูเป็นละเมิด/หนี้เงิน (ฎ.2098/2519 เพิกถอนซื้อขาย+ให้โอนคืน, ฎ.1173/2518 ค่าเสียหาย+ห้ามรบกวนครอบครอง, ฎ.797/2515 ค่าเสียหาย+ขอแสดงว่าเป็นที่สาธารณะ, ฎ.3530/2542 เงิน+บังคับจำนอง) • ⚠️ หลุมพรางลึก: แม้คำฟ้องไม่มีคำขอบังคับตัวทรัพย์เลย แต่ถ้า 'การวินิจฉัยแพ้ชนะต้องชี้กรรมสิทธิ์/ความเป็นอยู่ของที่ดินก่อน' (เช่น ฟ้องละเมิดแต่จำเลยต่อสู้ว่าที่ดินเป็นสาธารณะ) ก็ยังเข้า ม.4ทวิ อยู่ดี (ฎ.1783/2527 ประชุมใหญ่) — อาจารย์เน้น: 'มีอำนาจฟ้อง (ฟ้องได้ที่ศาลนั้น) กับชนะคดี เป็นคนละเรื่องกัน' • มูลคดีเกิดต้องแยกรายสัญญา ฟ้องรวมข้ามมูลคดีที่ศาลเดียวไม่ได้ (ฎ.2786/2540 รถ 2 คัน สัญญาคนละที่คนละปี)"},
    {heading:"8. คดีระหว่างประเทศพิเศษ (ม.3(1), 4ตรี, 4จัตวา)",
     body:"ม.3(1) เหตุเกิดในเรือไทย/อากาศยานไทยขณะอยู่นอกราชอาณาจักร (เช่น ทะเลาะกันบนเครื่องบินเหนือน่านฟ้าประเทศอื่น) → ฟ้องที่ศาลแพ่งเท่านั้น • ม.4ตรี ทางเลือกสุดท้าย ใช้เมื่อมูลคดีเกิดนอกราชอาณาจักร + จำเลยไม่มีภูมิลำเนาในไทยและขยายภูมิลำเนาตาม ม.3 ไม่ได้ → โจทก์ (สัญชาติไทย/ภูมิลำเนาไทย) ฟ้องได้ที่ศาลแพ่ง หรือศาลภูมิลำเนาโจทก์ หรือศาลที่ทรัพย์สินจำเลยตั้งอยู่ • ⚠️ ม.4ตรี vs ม.4ทวิ: ถ้าทรัพย์เป็นอสังหาฯ และต้องบังคับเอาแก่ตัวทรัพย์โดยตรง (เช่น โอนกรรมสิทธิ์) ยังคงใช้ ม.4ทวิ อยู่ แต่ถ้าเป็นการขายทอดตลาดทรัพย์เพื่อเอาเงินไปชำระหนี้ (มีเจ้าหนี้หลายคนรุมลูกหนี้) ใช้ ม.4ตรี • ม.4จัตวา คดีจัดการมรดก: ฟ้องที่ศาลซึ่งเจ้ามรดกมีภูมิลำเนาขณะตาย (ดูข้อเท็จจริงจริง เช่น ที่อยู่กินฉันสามีภริยา+มีบุตร+ซื้อที่ดินไว้ ไม่ใช่แค่ชื่อในทะเบียนบ้าน ฎ.5912/2539) หรือศาลที่ทรัพย์มรดกตั้งอยู่ถ้าเจ้ามรดกไม่มีภูมิลำเนาในไทย"},
    {heading:"9. ม.5 (มูลคดีเกี่ยวข้องกัน) และ ม.7 (ห้ามยื่นคำร้องแทรกบุคคลภายนอก)",
     body:"ม.5 เป็น 'มาตราปิดท้าย' เวลาตอบข้อสอบที่มีหลายศาลเข้าเงื่อนไข — เมื่อมูลคดีเกิดหลายที่ หรือจำเลยหลายคนอยู่คนละจังหวัดแต่มูลความแห่งคดีเกี่ยวข้องกัน โจทก์เลือกฟ้องศาลใดศาลหนึ่งได้ และแม้ภายหลังถอนฟ้องจำเลยเจ้าถิ่นที่ทำให้ศาลนั้นมีอำนาจแต่แรก ศาลก็ยังพิจารณาคดีต่อกับจำเลยที่เหลือได้ • ม.7: การจะบังคับเอากับบุคคลภายนอกที่ไม่ใช่คู่ความในคดีเดิม ต้องไปฟ้องเป็นคดีใหม่เท่านั้น จะยื่นคำร้องแทรกในคดีเดิมไม่ได้"},
  ],
  parties: [
    {heading:"1. ⭐ อำนาจฟ้อง ม.55 — คดีมีข้อพิพาท vs ไม่มีข้อพิพาท",
     body:"คดีมีข้อพิพาท (ใช้คำฟ้อง): ต้องมี 'ข้อโต้แย้งสิทธิ' ตามกฎหมายแพ่งเกิดขึ้นแล้ว โดยผู้ถูกโต้แย้งเป็นผู้เสนอคดีเอง • ⚠️ ถ้าความเสียหายเกิดจากบุคคลอื่นที่ไม่ใช่จำเลย จำเลยยังไม่ได้ 'โต้แย้งสิทธิ' จะฟ้องจำเลยไม่ได้ — เช่น เจ้าหน้าที่รังวัดที่ดินผิดทำให้ที่ดินโจทก์ล้ำเข้าที่คนอื่น โดยเจ้าของที่ข้างเคียงไม่ได้ทำอะไร (ฎ.1479/2517) หรือผู้เช่าช่วงวางทรัพย์เพราะไม่แน่ใจว่าใครมีสิทธิรับเงิน ไม่ถือว่าโต้แย้งสิทธิ (ฎ.2949-2951/2540 คดีมาบุญครอง) • แต่ผู้เช่าที่มีเพียง 'สิทธิครอบครอง' ก็ฟ้องขับไล่ผู้บุกรุกที่เช่าได้เองโดยไม่ต้องรอเจ้าของที่ดินมาฟ้อง (ฎ.97/2534) • อายุความ/สัญญาผิดแบบเป็นโมฆะ ไม่ตัดอำนาจฟ้อง — ยังฟ้องได้เสมอ เพียงแต่อาจแพ้คดีในเนื้อหาภายหลัง อย่าเอาผลแพ้ชนะทางสารบัญญัติมาปนกับอำนาจฟ้องทางวิแพ่ง • คดีไม่มีข้อพิพาท (ใช้คำร้องขอ ฝ่ายเดียว): ต้องมีกฎหมายบัญญัติรับรองให้ใช้สิทธิทางศาลไว้ชัดเจนเท่านั้น — ร้องขอให้ศาลสั่งว่าตนเป็นบุคคลเดียวกับคนเดิม หรือขอเปลี่ยนคำนำหน้าหลังผ่าตัดแปลงเพศ ไม่มีกฎหมายรองรับให้ทำได้ ร้องขอไม่ได้ (ฎ.100/2524, ฎ.157/2524) ⚠️ แต่ถ้ามีคนมาโต้แย้งสิทธินั้น (เช่น เถียงว่า 'ไม่ใช่ตัวจริง ไม่มีสิทธิรับมรดก') จะกลายเป็นคดีมีข้อพิพาทขึ้นมาทันที ฟ้องได้"},
    {heading:"2. ความสามารถ ม.56 — แยกจากอำนาจฟ้อง",
     body:"อำนาจฟ้อง (ม.55) ≠ ความสามารถ (ม.56): ผู้เยาว์มีอำนาจฟ้องได้ (เพราะเป็นผู้ถูกโต้แย้งสิทธิเอง) แต่บกพร่องเรื่องความสามารถ ต้องให้ผู้แทนโดยชอบธรรมฟ้องแทนหรือขออนุญาต เช่นเดียวกับคนไร้ความสามารถ/เสมือนไร้ฯ ต้องมีผู้อนุบาล/ผู้พิทักษ์ • ⭐ ข้อสำคัญ: ความบกพร่องเรื่องความสามารถ 'แก้ไขได้' ศาลสั่งให้ไปทำให้ถูกต้องก่อน ไม่ยกฟ้องทันที แต่ถ้าไม่มีอำนาจฟ้องตั้งแต่ต้น (เช่น ไม่ใช่ผู้ถูกโต้แย้งสิทธิ) แก้ไขไม่ได้ ศาลยกฟ้องเลย"},
    {heading:"3. ⭐ ร้องสอด ม.57 — 3 ช่องทาง + 5 หลักเกณฑ์",
     body:"จำคีย์เวิร์ด 3 อนุมาตรา: (1) สมัครใจเข้ามาเพื่อ 'บังคับตามสิทธิของตนเอง' (เอกเทศ ไม่อิงสิทธิคู่ความเดิม) รวมถึงร้องสอดในชั้นบังคับคดีได้ด้วย (2) สมัครใจเข้ามาเพราะมี 'ส่วนได้เสียตามกฎหมายในผลแห่งคดี' เป็นโจทก์ร่วม/จำเลยร่วม หรือขอเข้าแทนที่ (ต้องได้รับความยินยอมคู่ความเดิม แต่คู่ความเดิมยังผูกพันคำพิพากษาเสมือนไม่ได้แทนที่) (3) ถูกหมายเรียกเข้ามา — โดยคู่ความฝ่ายหนึ่งขอเพื่อ 'ใช้สิทธิไล่เบี้ย/ค่าทดแทน' หรือโดยคำสั่งศาลเพื่อประโยชน์ความยุติธรรม • ⭐ (1)(2) ถือเป็น 'คำคู่ความ' หากศาลไม่รับ อุทธรณ์ได้ทันที (ฎ.1226/2510) แต่ (3) ไม่ใช่คำคู่ความ หากศาลไม่อนุญาตต้องโต้แย้งไว้ก่อนแล้วรอคดีหลักเสร็จจึงอุทธรณ์ได้ (ม.226) • 5 หลักเกณฑ์ทั่วไป: [1] คดีต้องอยู่ระหว่างพิจารณา (คดีถูกจำหน่ายแล้วร้องสอดไม่ได้ เว้นแต่ภายหลังศาลเพิกถอนคำสั่งจำหน่าย หรือเป็น (1) ชั้นบังคับคดี) [2] ⚠️ ต้องเป็น 'บุคคลภายนอก' จริงๆ — คู่ความเดิมที่ขาดนัดยื่นคำให้การยังมีสถานะเป็นคู่ความอยู่ ร้องสอดกลับเข้ามาไม่ได้ (ฎ.5463/2534) แต่ถ้าพ้นจากคู่ความไปแล้ว (เช่น ถูกถอนฟ้อง) กลับมาร้องสอดใหม่ได้ (ฎ.6779/2506) [3] ต้องมีอำนาจฟ้อง+ความสามารถ และห้ามคดีอุทลุม — บุตรร้องสอดเป็นโจทก์ร่วมฟ้องบุพการีไม่ได้ แต่บุพการีถูกหมายเรียกเป็นจำเลยร่วมได้ (ไม่ใช่บุตรสมัครใจฟ้องเอง) (ฎ.961/2506) [4] เป็นดุลพินิจศาลเสมอ แม้เข้าหลักเกณฑ์ครบ — ถ้าร้องสอดช้าเกินไปจนต้องย้อนสืบพยานใหม่ ศาลให้ไปฟ้องคดีใหม่แทนได้ (ฎ.1113/2535, 4517/2540, 344/2541) [5] ต้องทำเป็นคำร้องมีคำขอบังคับชัดเจนตาม ม.172 ถ้าไม่มีคำขอบังคับ ไม่ชอบที่จะรับ (ฎ.1447/2530, 6445/2540) • ⚠️ ผู้ร้องสอดตาม (1) ต้องมีสิทธิเกี่ยวข้องกับทรัพย์/ประเด็นพิพาทโดยตรงเท่านั้น เช่น ที่ดินของผู้ร้องอยู่นอกเขตที่โจทก์จำเลยพิพาทกัน แม้โจทก์จะรังวัดรุกล้ำเข้าไปก็ร้องสอดไม่ได้ (ฎ.4477/2529) • ร้องสอดตาม (1) ใช้สิทธิของตนเองได้แม้โจทก์เดิมจะไม่มีอำนาจฟ้องเลยก็ตาม เช่น มารดาร้องสอดในคดีที่บิดานอกกฎหมายฟ้องละเมิดแทนบุตรที่ตาย (ฎ.148/2522)"},
    {heading:"3ข. ⭐ ผลของการร้องสอด (ม.58) — 57(1)(3) vs 57(2)",
     body:"57(1)+(3): มีสิทธิ 'เสมือนฟ้องหรือถูกฟ้องเป็นคดีใหม่' อิสระเต็มที่ ไม่ผูกกับคู่ความเดิม — นำพยานใหม่มาสืบได้ ถามค้านพยานที่สืบไปแล้วก่อนตนเข้ามาได้ ยื่นคำให้การตั้งประเด็นใหม่ได้เอง (เช่น เพิ่มอายุความ) แม้จำเลยเดิมขาดนัดยื่นคำให้การก็ไม่ตัดสิทธิ (ฎ.797/2515) แม้คำฟ้องเดิมของโจทก์จะเสียไปเพราะไม่มีอำนาจฟ้อง คำร้องสอดตาม (1) ก็ยังดำเนินต่อไปได้ (ฎ.148/2522 ประชุมใหญ่) • ⚠️ 57(2): ห้ามใช้สิทธิ 'เกินกว่า' หรือ 'ขัดแย้ง' กับคู่ความฝ่ายที่ตนเข้าร่วม — ถ้าจำเลยเดิมให้การไว้แค่ฟ้องเคลือบคลุม จำเลยร่วมเพิ่มประเด็นอายุความไม่ได้ แต่ถ้าเข้ามาขณะจำเลยเดิมยังไม่ได้ยื่นคำให้การและยังไม่หมดเวลา ยื่นคำให้การได้เต็มที่ไม่ถือว่าเกินสิทธิ (ฎ.875/2537) หากศาลไม่รับคำให้การของจำเลยร่วม จำเลยร่วมยังถือเอาคำให้การของจำเลยเดิมเป็นของตนได้ (ฎ.1131/2518) โจทก์เดิมไม่มีอำนาจฟ้อง จะร้องสอดเป็นโจทก์ร่วมไม่ได้ (ฎ.1050/2493) • ความผูกพันตามคำพิพากษา (ว.3): โดยหลักผูกพันผู้ร้องสอดเสมอ แม้คำขอท้ายฟ้องไม่ได้เอ่ยถึงผู้ร้องสอดก็อนุโลมรวมไว้ด้วย ไม่ถือว่าพิพากษาเกินคำขอ (ฎ.652/2510, ฎ.7091/2542) • ⚠️ ข้อยกเว้นเฉพาะผลระหว่างกันเอง (ไม่กระทบคู่ความอีกฝ่าย/บุคคลภายนอก): ไม่ผูกพันเมื่อ (ก) คู่ความเดิมประมาทเลินเล่อทำให้ผู้ร้องสอดเข้ามาช้าเกินจะยกข้อเถียงสำคัญได้ หรือ (ข) คู่ความเดิมจงใจ/ประมาทเลินเล่ออย่างร้ายแรงไม่ยกข้อเถียงสำคัญที่ผู้ร้องสอดไม่รู้ (เช่น ลูกหนี้ร่วมที่รู้ว่าชำระหนี้บางส่วนแล้วแต่ไม่สู้คดี ผลไม่ผูกพันผู้ค้ำร่วมที่ไม่รู้เรื่อง ใช้ไล่เบี้ยกันเองตามความจริงได้ แต่ยังต้องรับผิดเต็มจำนวนต่อโจทก์) • จำแนกคีย์เวิร์ด ม.59 vs ม.57: ม.59 คู่ความร่วมกันมาตั้งแต่ต้นฟ้อง ใช้คำว่า 'ผลประโยชน์ร่วมกันในมูลความแห่งคดี' (ฎ.695/2524); ม.57 เข้ามาภายหลัง ต้องใช้คีย์เวิร์ดเฉพาะแต่ละอนุมาตรา (จำเป็น/ส่วนได้เสีย/ไล่เบี้ย)"},
    {heading:"4. คู่ความร่วม ม.59 และคู่ความมรณะ ม.42-43",
     body:"คู่ความร่วม: ต้องมีผลประโยชน์ร่วมกันในมูลความแห่งคดี (เจ้าของรวม/ลูกหนี้ร่วม/ละเมิดจากเหตุเดียวกัน) ไม่ใช่แค่มูลหนี้คนละสัญญาที่บังเอิญคล้ายกัน (เช่น ต่างคนต่างขอครอบครองปรปักษ์คนละแปลง แม้ยื่นวันเดียวกันก็เป็นคู่ความร่วมกันไม่ได้) • ⭐ ผลการทำแทนกันระหว่างคู่ความร่วม แบ่ง 2 แบบ: (1) กระทำที่เสื่อมเสีย (รับสารภาพ/ท้ากัน) — 'ทำชั่วรับไปคนเดียว' ไม่ผูกพันคู่ความร่วมที่ไม่ยินยอม เช่น จำเลยที่ 1 (คนขับ) รับว่าประมาท ไม่ผูกพันจำเลยที่ 2 (นายจ้าง) ที่ยังสู้คดีต่อได้ หรือคำท้าพิสูจน์ลายมือที่จำเลยที่ 1 ตกลงเอง ไม่ผูกพันจำเลยที่ 2 ที่ไม่ยินยอม (ฎ.1713/2523) (2) กระทำที่เป็นคุณ หรือมูลหนี้แบ่งแยกไม่ได้ — 'ทำดีได้ดีด้วยกัน' ผลแผ่ไปถึงคู่ความร่วมทุกคนอัตโนมัติ เช่น สัญญาไม่มีอากรแสตมป์ทำให้จำเลยที่ 1 (ลูกหนี้) ชนะ ผลแผ่ไปถึงจำเลยที่ 2 (ผู้ค้ำ) แม้จำเลยที่ 2 เองจะรับว่ามีสัญญาจริงก็ตาม (ฎ.8880/2547), ลูกหนี้ร่วมคนหนึ่งยกอายุความขึ้นสู้สำเร็จ ผลแผ่ไปถึงลูกหนี้ร่วมคนอื่นที่ไม่ได้ยกขึ้นเองหรือไม่ได้ฎีกาด้วย (ฎ.914/2538), ทนายจำเลยคนหนึ่งขอเลื่อนคดีเพราะป่วย ผลเลื่อนแผ่ไปถึงจำเลยร่วมคนอื่นด้วยเพราะกระบวนพิจารณาแยกกันไม่ได้ (ฎ.2987/2525) • คู่ความมรณะ: หน้าที่เฉพาะตัว (เช่น ผู้จัดการมรดก) ไม่ตกทอดไปยังทายาทของคู่ความที่ตาย ต้องเป็นผู้มีอำนาจจัดการทรัพย์มรดกจริงจึงเข้าแทนที่ได้"},

    {heading:"1. รูปแบบและการยื่นคำคู่ความ (ม.67-69)",
     body:"ม.67: เอกสารต้องมีรายการครบ 5 อย่าง — (1) ชื่อศาล+เลขคดี (2) ชื่อคู่ความ (3) ชื่อผู้รับเอกสาร (4) ใจความ+เหตุผล (5) วันที่+ลายมือชื่อผู้ส่ง • ม.68: รองรับ e-Filing ตามข้อกำหนดประธานศาลฎีกา — ปัจจุบันประชาชนฟ้องเองได้จำกัดเฉพาะบางประเภทคดี (เช่น ผิดสัญญาซื้อขายออนไลน์, ร้องขอจัดการมรดก) เท่านั้น คดีอื่นยังต้องผ่านทนาย/อัยการ • ม.69: ยื่นได้ 2 ทาง — (1) ยื่นต่อเจ้าหน้าที่ศาล (ผู้ไปยื่นแทนต้องมีใบมอบฉันทะ) (2) ยื่นต่อศาลระหว่างนั่งพิจารณา แต่ต้องเป็นคดีนั้นและเกี่ยวข้องกับประเด็นที่พิจารณาอยู่ในขณะนั้นเท่านั้น"},
    {heading:"2. ⭐ 4 วิธีการส่งคำคู่ความ (ม.70-72)",
     body:"(1) คู่ความส่งเอง — เฉพาะหมายเรียกพยานฝ่ายตน (ม.70(1)) เว้นแต่พยานปฏิเสธไม่รับจึงให้เจ้าพนักงานส่งแทน (2) ลงลายมือชื่อรับรู้ในศาล (ม.70(2)) — ใช้กับคำสั่งศาล (วันนัด/เลื่อนคดี) หากคู่ความอยู่ในศาลตอนมีคำสั่งและลงชื่อไว้ ถือว่าส่งชอบทันที (3) รับไปโดยทางเจ้าพนักงานศาล — ใช้กับเอกสารที่รู้อยู่แล้วว่าต้องมี เช่น โจทก์ต้องมารับสำเนาคำให้การจำเลยเอง (ม.71 — เพราะโจทก์มีหน้าที่ติดตามคดี) แต่คำร้องขอแก้ไขคำให้การซึ่งเป็นเหตุแทรกซ้อนที่โจทก์คาดไม่ถึง เปลี่ยนเป็นหน้าที่เจ้าพนักงานต้องนำส่งแทน (ม.71 ว.2) (4) เจ้าพนักงานศาลเป็นผู้ส่ง — วิธีหลักสำหรับคำฟ้องตั้งต้น/หมายเรียก/คำสั่งศาล • ⭐ เรื่อง 'การนำส่ง': โจทก์มีหน้าที่แค่จ่ายค่าธรรมเนียมส่ง จะไปนำส่งเองหรือไม่ก็ได้ เว้นแต่ศาลสั่งให้มีหน้าที่นำส่ง หากสั่งแล้วเพิกเฉยไม่ไป ศาลสั่งจำหน่ายคดีฐาน 'ทิ้งฟ้อง' ได้"},
    {heading:"3. ส่งคำคู่ความให้คู่ความ/บุคคลภายนอก ม.74-79",
     body:"ลำดับ: ส่งโดยตรง (ม.74) → ส่งให้คนในบ้าน อายุ>20 ปี ณ ภูมิลำเนา/สำนักทำการงานของจำเลยเท่านั้น (ม.76) → ปิดหมาย (ม.79) มีผลเมื่อพ้น 15 วัน • ข้ามขั้นตอนไม่ได้! การส่งมอบเอกสารนอกสถานที่ตามกฎหมาย (เช่น ที่ทำการไปรษณีย์) ไม่ถือว่าชอบแม้ผู้รับจะเป็นคนในบ้านจริง • ส่งได้เฉพาะเวลากลางวัน (พระอาทิตย์ขึ้น-ตก) แต่ส่งวันเสาร์-อาทิตย์ได้ ไม่ใช่วันหยุดที่ห้าม • ⚠️ ห้ามส่งให้ทนายความในชั้นส่งคำฟ้องตั้งต้นคดี เพราะยังไม่มีการแต่งทนายในคดีนั้น (ม.75 ใช้ได้เฉพาะหลังแต่งทนายแล้ว) • ม.78 วางหมาย: ถ้าเจอตัวแต่ 'ปฏิเสธไม่รับ' เจ้าหน้าที่พาพยาน (ตำรวจ/ปกครอง) มาวางเอกสารไว้ มีผลทันที • ทางไปรษณีย์ (ม.73ทวิ): ต้องมีคำสั่งศาล ส่งแบบลงทะเบียนตอบรับ/EMS มีผลทันทีเมื่อเซ็นรับ ไม่ต้องรอ 15 วันเหมือนปิดหมาย"},

/* ================= GAMIFICATION ================= */
const GK = 'viphaeng_score_v2';
function loadScore(){
  try{ return JSON.parse(localStorage.getItem(GK)||'{"total":0,"seenCards":{},"seenContent":{}}'); }
  catch(e){ return {total:0,seenCards:{},seenContent:{}}; }
}
function saveScore(s){ try{ localStorage.setItem(GK,JSON.stringify(s)); }catch(e){} }
let GS = loadScore();

function addScore(pts, reason){
  GS.total = Math.max(0, GS.total + pts);
  saveScore(GS);
  updateScoreUI();
  showScorePop(pts, reason);
}
function showScorePop(pts, reason){
  const el = document.getElementById('scorePop');
  if(!el) return;
  const minus = pts < 0;
  el.textContent = (minus ? '' : '+') + pts + (reason ? ' ' + reason : '');
  el.style.color = minus ? '#ef4444' : '#16a34a';
  el.style.borderColor = minus ? '#fca5a5' : '#bbf7d0';
  el.style.opacity = '1';
  el.style.transform = 'translateY(0)';
  clearTimeout(el._t);
  el._t = setTimeout(()=>{ el.style.opacity='0'; el.style.transform='translateY(-10px)'; }, 1400);
}
function updateScoreUI(){
  const el = document.getElementById('scoreNum');
  if(el) el.textContent = GS.total.toLocaleString();
}

function setTheme(catId){

  document.documentElement.style.setProperty('--cat-pale', `rgba(${r},${g},${b},0.09)`);
  const angle = CAT_BG_ANGLE[cat] || 0;

function shuffle(arr){
  const a=arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function bestScore(key){
  try{ const v = localStorage.getItem('vpk_'+key); return v?JSON.parse(v):null; }catch(e){ return null; }
}
function saveBestScore(key,score,total){
  try{
    const cur = bestScore(key);
    const attempts = (cur? cur.attempts:0) + 1;
    if(!cur || score>cur.score){ localStorage.setItem('vpk_'+key, JSON.stringify({score,total,attempts})); }
    else { localStorage.setItem('vpk_'+key, JSON.stringify({score:cur.score,total,attempts})); }
  }catch(e){}
}

    const choices = shuffle([{t:card.title,c:true}, ...others.map(o=>({t:o.title,c:false}))]);
    return {cat:card.cat, tags:[CATEGORIES[card.cat].name], fact:`${CATEGORIES[card.cat].name}`, question:`มาตรา ${card.code} เกี่ยวข้องกับเรื่องใด?`, choices, explain:`${card.code}: ${card.text}${card.case?` (${card.case})`:''}`};
  });

function abandonQuiz(){ state.quizSet=null; state.quizPool=[]; state.quizIdx=0; state.quizAnswered=false; render(); }
function startQuizLevel(level){ state.quizLevel=level; state.quizSet=null; render(); }
function startBasicSet(){
  state.quizSet='basic'; state.quizPool=buildBasicSet(); state.quizIdx=0; state.quizAnswered=false; state.quizScore=0; render();
}
function startRealSet(i){
  state.quizSet='real-'+i; state.quizPool = realChunks()[i].map(m=>({cat:m.cat, tags:m.tags, fact:m.fact, question:m.question, choices:m.choices.map(c=>({t:c.t,c:c.c})), explain:m.explain}));
  state.quizIdx=0; state.quizAnswered=false; state.quizScore=0; render();
}
function answerQuiz(i){ state.quizStartTime = state.quizStartTime; // preserved

  if(state.quizAnswered) return;
  const q = state.quizPool[state.quizIdx];
  state.quizAnswered=true;
  document.querySelectorAll('#quizChoices .choice').forEach((btn,idx)=>{
    btn.disabled=true;
    if(q.choices[idx].c) btn.classList.add('correct');
    else if(idx===i) btn.classList.add('wrong');
  });
  const elapsed = Date.now() - (state.quizStartTime||Date.now());
  if(q.choices[i].c){
    state.quizScore++;
    sndCorrect();
    addScore(10, 'ถูก ✓');
  } else {
    sndWrong();
    addScore(-5, 'ผิด ✗');
  }
  document.getElementById('quizExplain').innerHTML = `<div class="explain-box"><b>คำอธิบาย:</b> ${q.explain}</div>`;
  document.getElementById('floatbar').innerHTML = `<button class="btn btn-gold" onclick="sndClick();nextQuiz()">${state.quizIdx+1<state.quizPool.length?'ข้อถัดไป ›':'ดูสรุปผล ›'}</button>`;
}
function nextQuiz(){
  if(state.quizIdx+1 < state.quizPool.length){ state.quizIdx++; state.quizAnswered=false; render(); return; }
  // finished
  if(state.quizSet && state.quizSet.startsWith('real-')){

/* ---- Sub-mode B: ไล่สาย (เรียงลำดับขั้นตอน) ---- */
function shuffledIdx(n){
  const arr=[...Array(n).keys()];
  for(let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; }
  if(n>1 && arr.every((v,i)=>v===i)){ [arr[0],arr[1]]=[arr[1],arr[0]]; }
  return arr;
}
function renderOrderModeB(){
  if(state.orderCase===null){
    return `
      <h2>ไล่สาย — เรียงลำดับขั้นตอน</h2>
      <div class="desc">เลือกโจทย์ แล้วลากการ์ดเพื่อจัดลำดับขั้นตอนที่ถูกต้อง · ตอบถูกครบสะสม ${state.orderScore} ชุด</div>
      <div class="set-grid">
        ${PROCEDURE_ORDER.map((p,i)=>`<div class="set-card" onclick="sndClick();startOrder(${i})"><b>ชุดที่ ${i+1}</b><div style="font-size:12px;">${p.title}</div></div>`).join('')}
      </div>
    `;
  }
  const p = PROCEDURE_ORDER[state.orderCase];
  if(!state.orderPool){ state.orderPool = shuffledIdx(p.steps.length); state.orderChecked=false; }
  return `
    <div class="backrow"><button class="btn btn-ghost" onclick="sndClick();state.orderCase=null; render();">‹ ถอยหลังไปเลือกชุด</button></div>
    <h2>${p.title}</h2>
    <div class="desc">ลากการ์ดเพื่อจัดลำดับขั้นตอนที่ถูกต้อง แล้วกด "ตรวจคำตอบ"</div>
    <ul class="order-list" id="orderList">
      ${state.orderPool.map((stepIdx,pos)=>`
        <li class="order-item" draggable="true" data-idx="${stepIdx}">
          <span class="slot">${pos+1}</span><span>${p.steps[stepIdx]}</span>
        </li>`).join('')}
    </ul>
    <div class="row" id="orderBtnRowB" style="margin-top:14px;">
      <button class="btn btn-gold" onclick="sndClick();checkOrderB()">ตรวจคำตอบ</button>
      <button class="btn btn-ghost" onclick="sndClick();reshuffleOrderB()">สลับใหม่</button>
    </div>
  `;
}
function startOrder(i){ state.orderStartTime=Date.now(); state.orderCase=i; state.orderPool=null; state.orderChecked=false; render(); initOrderDndB(); }
function reshuffleOrderB(){ state.orderPool=shuffledIdx(PROCEDURE_ORDER[state.orderCase].steps.length); state.orderChecked=false; render(); initOrderDndB(); }
function nextOrderB(){ state.orderCase=(state.orderCase+1)%PROCEDURE_ORDER.length; state.orderPool=null; state.orderChecked=false; render(); initOrderDndB(); }
function checkOrderB(){
  const items=[...document.querySelectorAll('#orderList .order-item')];
  const order=items.map(it=>Number(it.dataset.idx));
  state.orderPool=order;
  let allCorrect=true;
  items.forEach((it,pos)=>{
    const ok=order[pos]===pos;
    it.classList.remove('correct','wrong');
    it.classList.add(ok?'correct':'wrong');
    if(!ok) allCorrect=false;
  });
  state.orderChecked=true;
  const elapsed = Date.now() - (state.orderStartTime||Date.now());
  if(allCorrect){ state.orderScore++; sndCorrect(); addScore(elapsed<20000?50:5, elapsed<20000?'เรียงได้ไว!':'เรียงถูก'); } else { sndWrong(); }
  const row = document.getElementById('orderBtnRowB');
  row.insertAdjacentHTML('beforeend', allCorrect
    ? `<span style="font-weight:700;color:var(--good);align-self:center;">✓ ถูกต้อง</span>`
    : `<span style="font-weight:700;color:var(--bad);align-self:center;">ยังไม่ถูก ลองใหม่</span>`);
  row.insertAdjacentHTML('beforeend', `<button class="btn btn-dark" onclick="sndClick();nextOrderB()">ชุดถัดไป ›</button>`);
}
function initOrderDndB(){
  const list = document.getElementById('orderList');
  if(!list) return;
  let dragEl = null;
  list.querySelectorAll('.order-item').forEach(item=>{
    item.addEventListener('dragstart', ()=>{ dragEl=item; item.classList.add('dragging'); });
    item.addEventListener('dragend', ()=>{ item.classList.remove('dragging'); renumber(); });
  });
  list.addEventListener('dragover', e=>{
    e.preventDefault();
    const after = getDragAfter(list, e.clientY);
    const dragging = list.querySelector('.dragging');
    if(!dragging) return;
    if(after==null) list.appendChild(dragging);
    else list.insertBefore(dragging, after);
  });
  function getDragAfter(container, y){
    const els = [...container.querySelectorAll('.order-item:not(.dragging)')];
    return els.reduce((closest, child)=>{
      const box = child.getBoundingClientRect();
      const offset = y - box.top - box.height/2;
      if(offset<0 && offset>closest.offset) return {offset, element:child};
      else return closest;
    }, {offset:-Infinity}).element;
  }
  function renumber(){
    list.querySelectorAll('.order-item').forEach((it,pos)=>{
      it.querySelector('.slot').textContent = pos+1;
      it.classList.remove('correct','wrong');
    });
  }
}

function renderWalkMode(){
  if(state.walkCase===null){

      <div class="row row-center" style="margin-top:20px;">

      </div>
    `;
  }
  const issue = w.issues[state.issueIdx];
  const stepNames=["เลือกประเด็น","เลือกมาตรา","ปรับบท","สรุปผล"];
  const stepIcons=["❓","📖","🔗","✅"];
  const stepMap=[
    {options:issue.issueOptions, correct:issue.issueCorrect, prompt:"ประเด็นนี้คือเรื่องอะไร?"},
    {options:issue.sectionOptions, correct:issue.sectionCorrect, prompt:"ควรใช้มาตราใดในการวินิจฉัย?"},
    {options:issue.applyOptions, correct:issue.applyCorrect, prompt:"ปรับข้อเท็จจริงเข้ากับมาตราอย่างไร?"},
    {options:issue.conclusionOptions, correct:issue.conclusionCorrect, prompt:"สรุปผลควรเป็นอย่างไร?"},
  ];
  const step = stepMap[state.stepIdx];
  document.getElementById('floatbar').style.display = state.walkAnswered ? 'flex':'none';
  if(state.walkAnswered){
    document.getElementById('floatbar').innerHTML = `<button class="btn btn-gold" onclick="sndClick();nextWalkStep()">${(state.stepIdx<3)?'ขั้นถัดไป ›':(state.issueIdx+1<w.issues.length?'ประเด็นถัดไป ›':'ดูสรุปผล ›')}</button>`;
  }
  return `
    <h2>${w.title}</h2>
    <div class="backrow"><button class="btn btn-ghost btn-sm" onclick="sndClick();state.walkCase=null;render();">‹ กลับไปเลือกข้อสอบ</button></div>
    <h2>${w.title}</h2>
    <span class="fact-toggle" onclick="sndClick();state.factExpanded=!state.factExpanded;render();">${state.factExpanded?'▲ ย่อโจทย์':'▼ ขยายโจทย์เต็ม'}</span>
    <div class="fact-block ${state.factExpanded?'':'collapsed'}">${w.fact}</div>
    <div style="margin-bottom:12px;"><span class="cat-pill">📋 ${issue.name}</span></div>
    <div class="step-track">
      ${[0,1,2,3].map(i=>`<div class="step-dot ${i<state.stepIdx?'done':(i===state.stepIdx?'active':'')}"></div>`).join('')}
    </div>
    <div class="step-label">
      <span class="step-badge">ขั้นที่ ${state.stepIdx+1}/4</span>
      ${stepIcons[state.stepIdx]} ${stepNames[state.stepIdx]}
    </div>
    <div style="font-weight:700;font-size:14.5px;margin-bottom:12px;color:var(--text-body);">${step.prompt}</div>
    <div id="walkChoices">
      ${step.options.map((opt,i)=>`<button class="choice" data-i="${i}" onclick="answerWalk(${i})">${opt}</button>`).join('')}
    </div>
    <div id="walkGuide"></div>
  `;
}
function startWalk(i){ state.walkCase=i; state.issueIdx=0; state.stepIdx=0; state.walkScore=0; state.walkAnswered=false; state.walkCorrectSteps=0; state.factExpanded=false; render(); }
function answerWalk(i){
  if(state.walkAnswered) return;
  const w = WALK[state.walkCase]; const issue = w.issues[state.issueIdx];
  const stepMap=[
    {options:issue.issueOptions, correct:issue.issueCorrect},
    {options:issue.sectionOptions, correct:issue.sectionCorrect},
    {options:issue.applyOptions, correct:issue.applyCorrect},
    {options:issue.conclusionOptions, correct:issue.conclusionCorrect},
  ];
  const step = stepMap[state.stepIdx];
  state.walkAnswered=true;
  document.querySelectorAll('#walkChoices .choice').forEach((btn,idx)=>{
    btn.disabled=true;
    if(idx===step.correct) btn.classList.add('correct');
    else if(idx===i) btn.classList.add('wrong');
  });
  if(i===step.correct){ state.walkCorrectSteps++; sndCorrect(); addScore(10,'ถูก ✓'); } else { sndWrong(); addScore(-5,'ผิด ✗'); }
  const isLastStep = state.stepIdx===3;
  document.getElementById('walkGuide').innerHTML = isLastStep ? `<div class="guide-box"><b>สรุปเหตุผล:</b> ${issue.guide}</div>` : '';
  const w2 = WALK[state.walkCase];
  document.getElementById('floatbar').style.display='flex';
  document.getElementById('floatbar').innerHTML = `<button class="btn btn-gold" onclick="sndClick();nextWalkStep()">${(state.stepIdx<3)?'ขั้นถัดไป ›':(state.issueIdx+1<w2.issues.length?'ประเด็นถัดไป ›':'ดูสรุปผล ›')}</button>`;
}
function nextWalkStep(){
  const w = WALK[state.walkCase];
  if(state.stepIdx<3){ state.stepIdx++; state.walkAnswered=false; render(); return; }
  state.issueIdx++; state.stepIdx=0; state.walkAnswered=false; render();
}

function rotateGhost(){
  if (document.documentElement.getAttribute('data-theme') !== 'horror') return;
  const el = ensureGhostEl(); ghostIndex = (ghostIndex + 1) % GHOST_IMAGES.length;
  el.style.opacity = '0.15';
  setTimeout(() => { el.src = GHOST_IMAGES[ghostIndex]; el.style.opacity = ''; }, 220);
  playHooSound();
}
function stopGhostRotation(){
  clearInterval(ghostRotateTimer); ghostRotateTimer = null;
  if (ghostEl) { ghostEl.classList.remove('visible'); ghostEl.style.opacity = ''; }
}
function pulseGhost(){
  if (document.documentElement.getAttribute('data-theme') !== 'horror') return;
  const el = ensureGhostEl(); el.classList.add('pulse');
  clearTimeout(ghostPulseTimer); ghostPulseTimer = setTimeout(() => el.classList.remove('pulse'), 350);
}
document.addEventListener('input', (e) => {
  const t = e.target;
  if (!t) return;
  if (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || (t.classList && t.classList.contains('note-input'))) pulseGhost();
});
let __ghostAudioCtx;
function playHooSound(){
  try{
    __ghostAudioCtx = __ghostAudioCtx || new (window.AudioContext||window.webkitAudioContext)();
    const c = __ghostAudioCtx;
    if (c.state === 'suspended') c.resume();
    const t0 = c.currentTime, dur = 1.6;
    const baseFreq = 180 + Math.random() * 50;
    const osc = c.createOscillator(); osc.type = 'sine'; osc.frequency.setValueAtTime(baseFreq, t0);
    const lfo = c.createOscillator(); lfo.type = 'sine'; lfo.frequency.setValueAtTime(4.2, t0);
    const lfoGain = c.createGain(); lfoGain.gain.setValueAtTime(6, t0);
    lfo.connect(lfoGain); lfoGain.connect(osc.frequency);
    const mainGain = c.createGain();
    mainGain.gain.setValueAtTime(0.0001, t0);
    mainGain.gain.exponentialRampToValueAtTime(0.035, t0 + 0.55);
    mainGain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    const bufferSize = Math.floor(c.sampleRate * dur);
    const noiseBuffer = c.createBuffer(1, bufferSize, c.sampleRate);
    const data = noiseBuffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
    const noise = c.createBufferSource(); noise.buffer = noiseBuffer;
    const noiseFilter = c.createBiquadFilter();
    noiseFilter.type = 'bandpass'; noiseFilter.frequency.setValueAtTime(baseFreq * 1.6, t0); noiseFilter.Q.setValueAtTime(0.7, t0);
    const noiseGain = c.createGain();
    noiseGain.gain.setValueAtTime(0.0001, t0);
    noiseGain.gain.exponentialRampToValueAtTime(0.01, t0 + 0.55);
    noiseGain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(mainGain); mainGain.connect(c.destination);
    noise.connect(noiseFilter); noiseFilter.connect(noiseGain); noiseGain.connect(c.destination);
    osc.start(t0); osc.stop(t0 + dur);
    lfo.start(t0); lfo.stop(t0 + dur);
    noise.start(t0); noise.stop(t0 + dur);
  } catch(e){}
}
document.addEventListener('DOMContentLoaded', () => {
  const current = document.documentElement.getAttribute('data-theme') || 'light';
  updateThemeToggleUI(current);
  if (current === 'horror') { playHorrorBgm(); startGhostRotation(); scheduleDogHowl(); }
  const droneMuteBtn = document.getElementById('drone-mute-btn');
  if (droneMuteBtn) {
    let muted = false;
    try { muted = localStorage.getItem(DRONE_MUTE_KEY) === '1'; } catch(e){}
    droneMuteBtn.textContent = muted ? '🔇' : '🔊';
  }
  ['click','touchstart','keydown'].forEach(evt => {
    document.addEventListener(evt, function resumeBgmOnce(){
      const bgm = document.getElementById('horror-bgm');
      if (document.documentElement.getAttribute('data-theme') === 'horror' && bgm && bgm.paused) playHorrorBgm();
      ['click','touchstart','keydown'].forEach(e2 => document.removeEventListener(e2, resumeBgmOnce));
    }, { once: true });
  });
});
