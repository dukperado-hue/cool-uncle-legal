    {heading:"1. โครงสร้างศาลและ 3 ขั้นตอนตรวจเขตอำนาจศาล",
     html:`
      <p>ศาลยุติธรรมไทยแบ่งเป็น 3 ชั้น คือ ศาลชั้นต้น ศาลอุทธรณ์ และศาลฎีกา นอกจากนี้ยังมีการจัดตั้งศาลชำนาญพิเศษขึ้นเพื่อพิจารณาคดีเฉพาะด้าน เช่น ศาลแรงงาน ศาลทรัพย์สินทางปัญญาและการค้าระหว่างประเทศ ศาลภาษีอากร และศาลล้มละลาย รวมทั้งมีการตั้ง "แผนก" เฉพาะทางขึ้นภายในศาลปกติ เช่น แผนกคดีซื้อขายออนไลน์ หรือแผนกคดียาเสพติด เพื่อให้ผู้พิพากษาที่มีความเชี่ยวชาญเฉพาะด้านเป็นผู้พิจารณา</p>
      <p>ก่อนฟ้องคดีทุกครั้งต้องตรวจสอบตามลำดับ 3 ขั้นตอนเสมอ ขั้นแรกคือชั้นของศาล ซึ่งต้องเริ่มฟ้องที่ศาลชั้นต้นก่อนเสมอ เว้นแต่จะมีกฎหมายบัญญัติให้ฟ้องตรงต่อศาลสูงกว่าได้เป็นการเฉพาะ ขั้นที่สองคือเขตศาล ต้องพิจารณาว่ามูลคดีเกิดขึ้นที่ไหน หรือจำเลยมีภูมิลำเนาอยู่ที่ใด ตามหลักเกณฑ์ในประมวลกฎหมายวิธีพิจารณาความแพ่ง มาตรา 4 โดยตรวจสอบเขตอำนาจที่แท้จริงได้จากพระราชบัญญัติจัดตั้งศาลนั้น ๆ ขั้นที่สามคืออำนาจศาลตามสภาพแห่งคำฟ้อง ต้องดูว่าเป็นคดีแพ่งหรือคดีอาญา มีทุนทรัพย์เท่าใด และเป็นคดีที่ต้องขึ้นศาลชำนาญพิเศษหรือไม่</p>`},
    {heading:"2. ศาลจังหวัด vs ศาลแขวง — สองชั้นในจังหวัดเดียวกัน",
     html:`
      <p>ศาลจังหวัดตามมาตรา 18 มีอำนาจทั่วไป กล่าวคือมีอำนาจพิจารณาคดี "ทั้งปวง" ที่ไม่ได้อยู่ในอำนาจของศาลอื่นเป็นการเฉพาะ องค์คณะต้องมีผู้พิพากษาอย่างน้อย 2 คน ส่วน<b>ศาลแขวง</b>มีอำนาจจำกัดเท่ากับที่ "ผู้พิพากษาคนเดียว" มีตามมาตรา 24-25 เท่านั้น จะรับคดีที่เกินขอบเขตนี้ไม่ได้เลย</p>
      <p>ตัวอย่างจากห้องเรียน กรณีกู้ยืมเงิน 200,000 บาท ทำสัญญากันที่จังหวัดเชียงใหม่ แต่จำเลยมีภูมิลำเนาที่จังหวัดลำพูน เจ้าหนี้เลือกฟ้องได้ 2 ทาง คือฟ้องที่ศาลจังหวัดลำพูนตามภูมิลำเนาจำเลย (ลำพูนไม่มีศาลแขวง จึงต้องขึ้นศาลจังหวัด) หรือฟ้องที่ศาลแขวงเชียงใหม่ตามที่มูลคดีเกิด เนื่องจากทุนทรัพย์ไม่เกิน 300,000 บาทจึงต้องขึ้นศาลแขวง จะข้ามไปฟ้องที่ศาลจังหวัดเชียงใหม่ไม่ได้</p>`},
    {heading:"3. ⭐ อำนาจผู้พิพากษาคนเดียว (ม.24-25) — บททดสอบยอดฮิตที่สุด",
     html:`
      <p>คำถามที่ต้องถามเสมอคือคำสั่งนี้ "เป็นการวินิจฉัยชี้ขาดข้อพิพาทแห่งคดี" หรือไม่ ถ้าไม่ใช่ กล่าวคือเป็นเพียงการจัดการกระบวนพิจารณา<b>ผู้พิพากษาคนเดียว</b>สั่งได้เสมอไม่ว่าคดีจะใหญ่แค่ไหน เช่น สั่งไม่รับฟ้องหรือไม่ประทับฟ้องเพราะฟ้องผิดเขตอำนาจศาล (ยังไม่ได้ตัดสินเนื้อหา) สั่งงดสืบพยานเพราะเห็นว่าเป็นการประวิงคดี ลงโทษฐานละเมิดอำนาจศาล หรือยกคำร้องขอออกหมายจับเพราะคดีขาดอายุความ ซึ่งอาศัยมาตรา 24(1) ประกอบประมวลกฎหมายวิธีพิจารณาความอาญา มาตรา 68 เพราะเป็นเพียงการตรวจเงื่อนไขการออกหมาย ไม่ใช่การตัดสินว่าจำเลยผิดจริงหรือไม่</p>
      <p>แต่ถ้าคำสั่งนั้นเป็นการชี้ขาดสิทธิจริง แม้จะอยู่ในรูปของ "คำร้อง" ก็ไม่ถือเป็นคำสั่งระหว่างพิจารณาที่ผู้พิพากษาคนเดียวจะสั่งได้ เมื่อคดีอยู่ในศาลจังหวัดต้องใช้องค์คณะสองคนเสมอ ตัวอย่างที่พบบ่อยคือการยกคำร้องขัดทรัพย์ (<b>ฎ.125/2526</b>) การยกคำร้องขอคืนของกลางหรือปล่อยทรัพย์ซึ่งต้องชี้กรรมสิทธิ์และการรู้เห็นเป็นใจ การยกคำร้องขอเฉลี่ยทรัพย์ซึ่งถือเป็นคดีสาขาแยกต่างหาก การยกคำร้องของผู้ที่อ้างว่าไม่ใช่บริวารเพราะครอบครองปรปักษ์ และคำร้องขอกำหนดโทษใหม่ตาม<b>ฎ.3374/2566</b> ซึ่งเป็นการวินิจฉัยเนื้อหาโทษโดยตรง ล้วนต้องใช้องค์คณะสองคนทั้งสิ้นหากคดีนั้นอยู่ในศาลจังหวัด</p>
      <p>มาตรา 25(1) ให้อำนาจไต่สวนและสั่งชันสูตรพลิกศพ ส่วนมาตรา 25(3) ให้อำนาจไต่สวนมูลฟ้องคดีอาญา จุดที่ต้องแยกให้ออกคือ "ประทับฟ้อง" ซึ่งเป็นเพียงการรับคดีไว้ ยังไม่จบคดี ผู้พิพากษาคนเดียวทำได้เสมอแม้อัตราโทษของคดีนั้นจะเกินอำนาจของตนเอง เพราะยังไม่ใช่การชี้ขาดคดีในขั้นสุดท้าย แต่ "ยกฟ้อง" ซึ่งทำให้คดีจบทันที จะทำไม่ได้เลยถ้าโทษของคดีนั้นเกินอำนาจของตน สำหรับเกณฑ์อำนาจตามมาตรา 25(4)-(5) ผู้พิพากษาคนเดียวมีอำนาจพิจารณาพิพากษาคดีแพ่งที่มีทุนทรัพย์ไม่เกิน 300,000 บาท และคดีอาญาที่มีอัตราโทษจำคุกอย่างสูงไม่เกิน 3 ปี หรือปรับไม่เกิน 60,000 บาท แต่จะลงโทษจริงได้ไม่เกินจำคุก 6 เดือนหรือปรับไม่เกิน 10,000 บาทเท่านั้น โดยต้องดูจากโทษสุทธิหลังเพิ่มหรือลดโทษแล้ว และหากเป็นความผิดหลายกรรมต่างวาระกันให้พิจารณาแยกเป็นรายกระทงไป</p>
      <p>หากเป็นกรรมเดียวผิดกฎหมายหลายบทและบทที่หนักที่สุดมีโทษเกินอำนาจของตน เช่น มาตรา 365(3) ที่มีโทษจำคุกถึง 5 ปี ผู้พิพากษาคนเดียวไม่มีอำนาจแม้แต่จะไต่สวนมูลฟ้อง เพราะหากไต่สวนแล้วเห็นว่าไม่มีมูลก็จะต้องพิพากษายกฟ้องซึ่งเป็นการกระทำที่เกินอำนาจของตนอยู่ดี คดีเช่นนี้ต้องส่งให้ศาลจังหวัดพิจารณาตั้งแต่ต้น ซึ่งต่างจากกรณีความผิดตามมาตรา 297 ที่ไม่มีข้อหาอื่นประกอบ จึงยังประทับฟ้องได้แม้โทษของคดีจะเกินอำนาจพิพากษาของตนเองก็ตาม</p>
      <div class="examBox"><div class="exlabel">📝 โจทย์ฝึกจากหลักในคำบรรยาย</div>
        <div class="exq">โจทก์ฟ้องจำเลยเป็นคดีแพ่งที่ศาลจังหวัด เรียกเงินตามสัญญากู้ยืมจำนวน 250,000 บาท ระหว่างพิจารณาคดี จำเลยยื่นคำร้องขัดทรัพย์คัดค้านการที่โจทก์นำเจ้าพนักงานบังคับคดีไปยึดทรัพย์ของบุคคลภายนอกมาขายทอดตลาด อ้างว่าทรัพย์นั้นไม่ใช่ของจำเลย ผู้พิพากษาคนเดียวที่นั่งพิจารณาคดีนี้อยู่มีอำนาจไต่สวนและมีคำสั่งยกคำร้องขัดทรัพย์นี้ได้เองโดยลำพังหรือไม่ เพราะเหตุใด</div>
        <div class="exsrc">โจทย์ฝึกอิงหลักเขตอำนาจผู้พิพากษาคนเดียว ม.24-25</div>
        <button type="button" class="examToggle" onclick="toggleExamAns('exam-phdn-1')">🔎 ดูเฉลย</button>
        <div class="examAns" id="exam-phdn-1"><span class="exanslabel">✅ แนวคำตอบ</span><p>ผู้พิพากษาคนเดียวไม่มีอำนาจไต่สวนและมีคำสั่งยกคำร้องขัดทรัพย์นี้ได้โดยลำพัง แม้ทุนทรัพย์ของคดีเดิม 250,000 บาทจะอยู่ในเกณฑ์อำนาจผู้พิพากษาคนเดียวตามมาตรา 25(4) ก็ตาม เพราะคำร้องขัดทรัพย์เป็นคำร้องที่มีลักษณะเป็นคดีมีข้อพิพาทให้ปลดเปลื้องทุกข์อันอาจคำนวณเป็นราคาเงินได้ต่างหากจากคดีเดิม และการวินิจฉัยคำร้องขัดทรัพย์เป็นการชี้ขาดกรรมสิทธิ์ในทรัพย์นั้นโดยตรง ไม่ใช่เพียงการจัดการกระบวนพิจารณาทั่วไป ตามแนวฎ.125/2526 การยกคำร้องขัดทรัพย์จึงถือเป็นการวินิจฉัยชี้ขาดข้อพิพาทแห่งคดี ต้องใช้องค์คณะผู้พิพากษาอย่างน้อย 2 คนตามมาตรา 26 เมื่อคดีนี้อยู่ในศาลจังหวัด ผู้พิพากษาคนเดียวจึงต้องส่งเรื่องให้มีผู้พิพากษาอีกคนหนึ่งร่วมพิจารณาและลงลายมือชื่อในคำสั่งด้วยเสมอ จะสั่งยกคำร้องขัดทรัพย์เองโดยลำพังไม่ได้</p></div>
      </div>`},
    {heading:"4. คดีไม่มีทุนทรัพย์ — ไม่อยู่ในอำนาจผู้พิพากษาคนเดียว/ศาลแขวง",
     html:`
      <p>หลักจำง่าย ๆ คือให้ถามว่า "ถ้าชนะคดี โจทก์ได้ทรัพย์หรือเงินเพิ่มขึ้นไหม" ถ้าไม่ใช่ก็เป็นคดีไม่มีทุนทรัพย์ ตัวอย่างจากคำบรรยาย ได้แก่ การร้องขอให้เป็นบุคคลสาบสูญซึ่งเป็นเรื่องสถานะบุคคล การฟ้องขับไล่โดยทั่วไปซึ่งเป็นการขอปลดเปลื้องทุกข์จากการรบกวนสิทธิครอบครอง แม้จะมีการเรียกค่าเช่าประกอบมาด้วยก็ยังต้องดูที่คำขอหลักเป็นสำคัญ การฟ้องเพิกถอนการฉ้อฉลตามมาตรา 237 เพราะทรัพย์ที่เพิกถอนจะกลับเข้ากองทรัพย์สินของลูกหนี้ ไม่ใช่ตกเป็นของโจทก์เอง และการฟ้องละเมิดขอให้หยุดกิจการหรือระงับเหตุเดือดร้อนรำคาญ เพราะคำขอหลักคือให้หยุดกระทำ ไม่ใช่เรียกทรัพย์สิน คดีลักษณะนี้ต้องขึ้นศาลจังหวัดเสมอ ศาลแขวงไม่มีอำนาจไม่ว่าจำนวนเงินที่เกี่ยวข้องจะมากหรือน้อยเพียงใด</p>`},
    {heading:"5. ม.19/1 — ผ่อนคลายเขตอำนาจระหว่างศาลจังหวัด-ศาลแขวง",
     html:`
      <p>วรรคหนึ่งใช้กับกรณีฟ้องผิดศาล คือคดีที่อยู่ในอำนาจศาลแขวงแต่โจทก์ไปยื่นฟ้องที่ศาลจังหวัด กรณีนี้ศาลจังหวัดมีดุลพินิจจะรับไว้พิจารณาเองหรือจะสั่งโอนคดีไปศาลแขวงก็ได้ ส่วนวรรคสองใช้กับกรณีพฤติการณ์เปลี่ยนแปลงไประหว่างการพิจารณาคดี เช่น ฟ้องความผิดฐานหมิ่นประมาทโดยการโฆษณาที่ศาลจังหวัด แต่เมื่อไต่สวนแล้วกลับรับฟังได้เพียงความผิดฐานหมิ่นประมาทธรรมดาซึ่งอยู่ในอำนาจศาลแขวง กรณีเช่นนี้ศาลจังหวัดต้องพิจารณาคดีต่อไปจนจบ จะสั่งโอนคดีกลับไปศาลแขวงไม่ได้อีกแล้ว</p>`},
    {heading:"6. การทำหน้าที่แทนผู้พิพากษา (ม.28-31)",
     html:`
      <p>กฎหมายแยกเหตุขัดข้องระหว่างการนั่งพิจารณาคดีตามมาตรา 28 ออกจากเหตุขัดข้องระหว่างการทำคำพิพากษาตามมาตรา 29 เพราะผู้มีอำนาจมอบหมายให้ทำหน้าที่แทนอาจแตกต่างกันไป หากเป็นเหตุขัดข้องระหว่างพิจารณา เช่น ผู้พิพากษาป่วยหรือย้ายไปที่อื่น อธิบดีหรือหัวหน้าศาลสามารถจ่ายสำนวนให้ผู้พิพากษาคนอื่นนั่งพิจารณาแทนได้</p>
      <p>แต่ถ้าเป็นเหตุขัดข้องในช่วงที่ต้องทำคำพิพากษาแล้ว เช่น ผู้พิพากษาเจ้าของสำนวนย้ายไปรับตำแหน่งที่อื่นก่อนจะพิพากษาคดี หัวหน้าศาลจะต้องตรวจสำนวนและลงลายมือชื่อร่วมทำคำพิพากษาด้วยตนเองเท่านั้น จะมอบหมายให้บุคคลอื่นทำหน้าที่นี้แทนไม่ได้เลย ตามแนว<b>ฎีกาที่ 17227/2557</b></p>`},
    {heading:"7. ประเภทผู้พิพากษาและข้อจำกัด",
     html:`
      <p>ผู้พิพากษาประจำศาล คือผู้ที่เพิ่งผ่านตำแหน่งผู้ช่วยผู้พิพากษามาและยังมีประสบการณ์น้อย ตามมาตรา 25 วรรคสอง บุคคลกลุ่มนี้ไม่มีอำนาจตาม (3) (4) และ (5) กล่าวคือห้ามไต่สวนมูลฟ้อง และห้ามพิจารณาพิพากษาคดีแพ่งหรือคดีอาญาโดยลำพัง ต้องทำงานร่วมกับองค์คณะเสมอ ส่วนผู้พิพากษาอาวุโสมีอำนาจพิจารณาพิพากษาคดีได้เต็มเหมือนผู้พิพากษาทั่วไป แต่มีข้อห้ามเฉพาะเรื่องตำแหน่งบริหาร คือห้ามเป็นหัวหน้าศาลหรือผู้รับผิดชอบราชการศาล และห้ามทำหน้าที่แทนหัวหน้าศาลในการลงชื่อร่วมทำคำพิพากษาตามมาตรา 29</p>
      <p>ตามมาตรา 26 ศาลจังหวัดต้องมีองค์คณะอย่างน้อย 2 คน และห้ามผู้พิพากษาประจำศาล 2 คนนั่งเป็นองค์คณะคู่กันเอง ต้องมีผู้พิพากษาศาลชั้นต้นหรือผู้พิพากษาอาวุโสประกบร่วมด้วยอย่างน้อย 1 คนเสมอ</p>`},
    {heading:"8. การจ่ายและเรียกคืนสำนวน (ม.32-33)",
     html:`
      <p>การจ่ายสำนวนคดีให้ผู้พิพากษาคนใดเป็นเจ้าของสำนวน ถือเป็นอำนาจของผู้รับผิดชอบราชการศาล ส่วนการเรียกคืนสำนวนที่จ่ายไปแล้วทำได้เฉพาะเมื่อ "กระทบกระเทือนต่อความยุติธรรม" เท่านั้น เช่น เพื่อป้องกันไม่ให้เกิดคำวินิจฉัยที่ขัดแย้งกันในคดีกลุ่มเดียวกัน โดยต้องให้รองประธานศาลหรือผู้พิพากษาอาวุโสสูงสุดถัดจากหัวหน้าศาลเป็นผู้ทำความเห็นเสนอ ผู้พิพากษาอาวุโสหรือผู้พิพากษาประจำศาลไม่มีอำนาจทำความเห็นในเรื่องนี้ และเรียกคืนสำนวนได้เพียงครั้งเดียวต่อคดีเท่านั้น เว้นแต่เจ้าของสำนวนจะสมัครใจคืนสำนวนเอง</p>`},
  ],
  jurisdiction: [
    {heading:"1. 3 ขั้นตอนตรวจเขตอำนาจศาล",
     html:`
      <p>ขั้นแรกคือชั้นศาล ต้องเริ่มฟ้องที่ศาลชั้นต้นเสมอ ขั้นที่สองคือเขตพื้นที่ ต้องดูภูมิลำเนาจำเลยหรือสถานที่ที่มูลคดีเกิดตาม<b>มาตรา 4</b> และขั้นที่สามคืออำนาจตามสภาพแห่งคำฟ้อง ว่าเป็นคดีแพ่งหรือคดีอาญา มีทุนทรัพย์เท่าใด</p>`},
    {heading:"2. เขตศาล — ฟ้องที่ไหนได้บ้าง (ม.4(1), 4ทวิ, 4(2))",
     html:`
      <p>สำหรับคดีมีข้อพิพาททั่วไป โจทก์ฟ้องได้ 2 ที่ตาม<b>มาตรา 4(1)</b> คือศาลที่จำเลยมีภูมิลำเนา หรือศาลที่มูลคดีเกิด กรณีทำสัญญาทางโทรศัพท์หรือไลน์ข้ามจังหวัดโดยเสนอสนองกันคนละที่ ให้ถือว่ามูลคดีเกิดขึ้นทั้งสองแห่ง ฟ้องได้ทั้งคู่ (<b>ฎ.269/2543</b>) และหากจำเลยย้ายภูมิลำเนาแบบ "ลอยนวล" คือแจ้งย้ายออกแล้วแต่ยังไม่แจ้งเข้าที่ใหม่ กฎหมายให้ถือว่าภูมิลำเนาเดิมยังใช้บังคับได้ (<b>ฎ.3053/2533</b>)</p>
      <p>คดีเกี่ยวกับอสังหาริมทรัพย์ เช่น การบังคับจำนอง ฟ้องขับไล่ หรือฟ้องขอให้โอนที่ดิน ต้องใช้<b>มาตรา 4 ทวิ</b> ซึ่งฟ้องได้เฉพาะที่ศาลซึ่งทรัพย์นั้นตั้งอยู่ หรือศาลที่จำเลยมีภูมิลำเนาเท่านั้น ตัดตัวเลือก "มูลคดีเกิด" ออกไปโดยสิ้นเชิง ส่วนคดีไม่มีข้อพิพาทซึ่งไม่มีจำเลย ให้ใช้<b>มาตรา 4(2)</b> คือดูจากสถานที่มูลคดีเกิด หรือภูมิลำเนาของผู้ร้องแทน</p>`},
    {heading:"3. ⭐ คดีมีทุนทรัพย์ vs ไม่มีทุนทรัพย์ (ออกสอบทุกปี)",
     html:`
      <p>เทคนิคจำง่าย ๆ คือให้ถามตัวเองเสมอว่า "ถ้าชนะคดี โจทก์จะได้เงินหรือทรัพย์สินเพิ่มขึ้นใหม่หรือไม่" ถ้าใช่ก็เป็น<b>คดีมีทุนทรัพย์</b></p>
      <p>ตัวอย่างคดีมีทุนทรัพย์ ได้แก่ ฟ้องเงินกู้ ฟ้องเรียกค่าเสียหาย ฟ้องบังคับโอนที่ดินตามสัญญาจะซื้อจะขาย เพิกถอนนิติกรรมให้โดยเสน่หาเพราะเนรคุณ ไถ่ถอนทรัพย์ที่ขายฝาก (<b>ฎ.1367/2494</b>) เพิกถอนนิติกรรมฉ้อฉลเพื่อคืนทรัพย์ (แม้เดิมโอนออกไปแล้ว แต่มองที่ผลว่าจะได้ทรัพย์กลับคืนมา) เรียกที่ดินมือเปล่าหรือสิทธิครอบครองคืน เพราะสิทธิครอบครองก็ถือเป็นทรัพย์สินชนิดหนึ่ง (<b>ฎ.459/2537</b>) และกรณีเอกสารสิทธิถูกออกทับที่ดินคนอื่นแล้วต้องสู้คดีกลับ (<b>ฎ.5543/2541</b>)</p>
      <p>ตัวอย่างคดีไม่มีทุนทรัพย์ ได้แก่ การฟ้องขับไล่ เพราะเจ้าของเดิมเพียงไล่คนออกไป ไม่ได้กรรมสิทธิ์เพิ่มขึ้นใหม่ (ยกเว้นค่าเช่าไม่เกิน 30,000 บาทต่อเดือนซึ่งเข้าอำนาจศาลแขวงได้) การเพิกถอนพินัยกรรมที่ไม่ชอบ เพราะทายาทมีสิทธิในกองมรดกอยู่แล้วแต่ต้น ไม่ใช่การก่อตั้งสิทธิใหม่ การเพิกถอนการฉ้อฉลเพื่อคืนกองทรัพย์สินให้ลูกหนี้ ซึ่งไม่ใช่ทรัพย์ของโจทก์เอง การขอเป็นบุคคลสาบสูญหรือขอตั้งผู้จัดการมรดก การฟ้องห้ามใช้ชื่อทางการค้าซึ่งค่าเสียหายที่ขอมาด้วยเป็นเพียงคำขอรอง (<b>ฎ.846/2527</b>) และการฟ้องแบ่งแยกการครอบครองระหว่างเจ้าของรวม เพราะมีกรรมสิทธิ์ในทุกอณูของทรัพย์อยู่แล้ว ไม่ได้เพิ่มขึ้นจากเดิม (<b>ฎ.4550/2540</b>)</p>`},
    {heading:"4. เทคนิคคำนวณทุนทรัพย์",
     html:`
      <p>ให้ดูคำขอท้ายฟ้องเป็นหลักเสมอ แม้ความเสียหายจริงจะมากกว่า แต่หากโจทก์ยอมลดคำขอลงเพื่อให้เข้าอำนาจศาลแขวง (การเลือกศาลเพื่อความสะดวก) ศาลก็ยึดตามคำขอที่ฟ้องจริง ส่วนดอกเบี้ยให้นับถึงวันฟ้องเท่านั้น ดอกเบี้ยในอนาคตไม่นำมานับรวม หากโจทก์หลายคนมีสิทธิเฉพาะตัว เช่น รถชนกันคนละคัน ให้แยกคำนวณทุนทรัพย์เป็นรายคน ไม่เอามารวมกัน แต่ถ้าเป็นหนี้ร่วมที่ลูกหนี้หลายคนต้องรับผิดในยอดเดียวกัน ให้ถือทุนทรัพย์เต็มจำนวนโดยไม่หารเฉลี่ย</p>`},
    {heading:"5. ⚠️ ทุนทรัพย์ผลสืบเนื่อง — คำขอสองส่วนในฟ้องเดียว",
     html:`
      <p>เมื่อคำฟ้องมีคำขอสองส่วนซึ่งส่วนหนึ่งมีทุนทรัพย์และอีกส่วนหนึ่งไม่มีทุนทรัพย์ แต่ส่วนที่ไม่มีทุนทรัพย์นั้นเป็นผลสืบเนื่องอัตโนมัติจากส่วนแรก ศาลที่มีอำนาจพิจารณาส่วนแรกย่อมมีอำนาจพิจารณาทั้งคดีได้เลย ตัวอย่างตาม<b>ฎ.13349/2557</b> คือฟ้องเพิกถอนนิติกรรมขายที่ดินโดยฉ้อฉลราคา 250,000 บาทซึ่งมีทุนทรัพย์อยู่ในอำนาจศาลแขวง พ่วงมาด้วยคำขอให้กำจัดทายาทมิให้รับมรดกซึ่งโดยสภาพไม่มีทุนทรัพย์ ศาลแขวงยังคงมีอำนาจพิจารณาทั้งสองคำขอ เพราะการกำจัดมรดกเป็นผลต่อเนื่องโดยตรงจากการฉ้อฉลในคำขอส่วนแรกนั่นเอง</p>`},
    {heading:"6. คดีสาขา (แพ่งเกี่ยวเนื่องอาญา) และ Class Action — ข้อยกเว้นทุนทรัพย์",
     html:`
      <p>ตามประมวลกฎหมายวิธีพิจารณาความอาญา มาตรา 43 และ 44/1 แม้ค่าเสียหายที่เรียกร้องจะเกิน 300,000 บาท แต่ถ้าศาลแขวงมีอำนาจพิจารณาคดีอาญาหลักอยู่แล้ว ศาลแขวงย่อมมีอำนาจพิจารณาส่วนแพ่งที่พ่วงมาด้วยได้เสมอ ไม่ต้องแยกไปฟ้องที่ศาลจังหวัด ในทางกลับกัน<b>คดีแบบกลุ่ม (Class Action)</b> ตามมาตรา 222/3 ห้ามฟ้องที่ศาลแขวงโดยเด็ดขาด เพราะทุนทรัพย์รวมของสมาชิกกลุ่มมักมีมูลค่ามหาศาลเกินอำนาจของศาลแขวงเสมอ</p>`},
    {heading:"7. ⭐ ม.4(1) vs ม.4ทวิ — จุดตัดที่ออกสอบทุกปี",
     html:`
      <p>ให้ดูคำขอท้ายฟ้องเป็นตัวชี้ขาด หากขอเรียก "เงิน" เพียงอย่างเดียว เช่น ค่าเสียหายหรือค่าเช่าค้างชำระ โดยไม่มีคำขอบังคับตัวทรัพย์ต่อท้าย ต้องใช้มาตรา 4(1) เท่านั้น แม้จำเลยจะเคยครอบครองหรือเกี่ยวข้องกับที่ดินนั้นมาก่อนก็ตาม เช่น กรณีที่โจทก์ได้รับโอนที่ดินคืนมาแล้ว เหลือเพียงเรียกค่าเสียหายเท่านั้น ก็ยังเป็นมาตรา 4(1) (<b>ฎ.1599/2529</b>)</p>
      <p>แต่ถ้าคำขอท้ายฟ้องมีคำว่า "และ" ตามด้วยคำขอบังคับเอาแก่ตัวทรัพย์ต่อท้ายคำขอเงิน เช่น ขอให้โอนโฉนด บังคับจำนอง ห้ามรบกวนการครอบครอง หรือขอให้แสดงว่าที่ดินเป็นสาธารณะ คดีนั้นจะเลี้ยวเข้ามาตรา 4 ทวิทันที แม้ประเด็นหลักจะดูเป็นเรื่องละเมิดหรือหนี้เงินก็ตาม ดังปรากฏใน<b>ฎ.2098/2519</b> ที่ขอเพิกถอนการซื้อขายพร้อมให้โอนคืน <b>ฎ.1173/2518</b> ที่ขอค่าเสียหายพร้อมห้ามรบกวนการครอบครอง <b>ฎ.797/2515</b> ที่ขอค่าเสียหายพร้อมขอให้แสดงว่าเป็นที่สาธารณะ และ <b>ฎ.3530/2542</b> ที่ขอเงินพร้อมบังคับจำนอง</p>
      <p>หลุมพรางที่ลึกกว่านั้นคือ แม้คำฟ้องจะไม่มีคำขอบังคับตัวทรัพย์เลย แต่ถ้าการวินิจฉัยแพ้ชนะจำเป็นต้องชี้กรรมสิทธิ์หรือความเป็นอยู่ของที่ดินก่อน เช่น ฟ้องละเมิดแต่จำเลยต่อสู้ว่าที่ดินเป็นที่สาธารณะ คดีนั้นก็ยังเข้ามาตรา 4 ทวิอยู่ดี ตามแนวคำพิพากษา<b>ฎีกาที่ 1783/2527</b> ซึ่งเป็นมติที่ประชุมใหญ่ อาจารย์เน้นย้ำว่า "การมีอำนาจฟ้อง คือฟ้องได้ที่ศาลนั้น กับการชนะคดี เป็นคนละเรื่องกัน" นอกจากนี้มูลคดีที่เกิดขึ้นต้องแยกพิจารณาเป็นรายสัญญา จะนำหลายมูลคดีมาฟ้องรวมกันที่ศาลเดียวไม่ได้ ดังใน<b>ฎ.2786/2540</b> ซึ่งเป็นกรณีขายรถ 2 คันโดยทำสัญญาคนละที่คนละปีกัน</p>
      <div class="examBox"><div class="exlabel">📝 โจทย์ฝึกจากหลักในคำบรรยาย</div>
        <div class="exq">โจทก์มีภูมิลำเนาอยู่จังหวัดเชียงใหม่ ฟ้องจำเลยซึ่งมีภูมิลำเนาอยู่จังหวัดขอนแก่นต่อศาลจังหวัดเชียงใหม่ อ้างว่าจำเลยบุกรุกเข้าไปทำสวนในที่ดินมือเปล่าของโจทก์ที่จังหวัดเชียงใหม่ ทำให้โจทก์เสียหาย ขอให้จำเลยชดใช้ค่าเสียหาย 40,000 บาท โดยคำฟ้องไม่มีคำขอให้ขับไล่จำเลยออกจากที่ดินแต่อย่างใด จำเลยให้การต่อสู้ว่าที่ดินพิพาทเป็นที่สาธารณประโยชน์ ไม่ใช่ของโจทก์ ให้ท่านวินิจฉัยว่าศาลจังหวัดเชียงใหม่มีอำนาจรับฟ้องคดีนี้ไว้พิจารณาหรือไม่</div>

        <div class="examAns" id="exam-jurisdiction-1"><span class="exanslabel">✅ แนวคำตอบ</span><p>แม้คำขอท้ายฟ้องของโจทก์จะเรียกร้องเพียงเงินค่าเสียหาย 40,000 บาท โดยไม่มีคำขอบังคับเอาแก่ตัวทรัพย์เลยก็ตาม แต่เมื่อจำเลยให้การต่อสู้ว่าที่ดินพิพาทเป็นที่สาธารณประโยชน์ไม่ใช่ของโจทก์ ศาลจึงจำเป็นต้องวินิจฉัยชี้ขาดเรื่องกรรมสิทธิ์หรือสิทธิครอบครองในที่ดินก่อนจึงจะสามารถวินิจฉัยประเด็นค่าเสียหายต่อไปได้ ตามแนวคำพิพากษาศาลฎีกาที่ 1783/2527 (มติที่ประชุมใหญ่) คดีลักษณะนี้จึงยังคงเข้ามาตรา 4 ทวิ ซึ่งต้องฟ้องที่ศาลซึ่งทรัพย์นั้นตั้งอยู่หรือศาลที่จำเลยมีภูมิลำเนาเท่านั้น จะฟ้องที่ศาลซึ่งมูลคดีเกิดตามมาตรา 4(1) ไม่ได้ เนื่องจากที่ดินพิพาทตั้งอยู่ที่จังหวัดเชียงใหม่ ศาลจังหวัดเชียงใหม่จึงมีอำนาจรับฟ้องคดีนี้ไว้พิจารณาได้ในฐานะศาลที่ทรัพย์ตั้งอยู่ แม้จำเลยจะมีภูมิลำเนาอยู่คนละจังหวัดก็ตาม</p></div>
      </div>`},
    {heading:"8. คดีระหว่างประเทศพิเศษ (ม.3(1), 4ตรี, 4จัตวา)",
     html:`
      <p>หากเหตุเกิดขึ้นในเรือไทยหรืออากาศยานไทยขณะอยู่นอกราชอาณาจักร เช่น ทะเลาะวิวาทกันบนเครื่องบินขณะบินอยู่เหนือน่านฟ้าประเทศอื่น ให้ฟ้องที่ศาลแพ่งเท่านั้นตาม<b>มาตรา 3(1)</b> ส่วน<b>มาตรา 4 ตรี</b>เป็นทางเลือกสุดท้าย ใช้เมื่อมูลคดีเกิดนอกราชอาณาจักรและจำเลยไม่มีภูมิลำเนาในประเทศไทย ทั้งไม่อาจขยายภูมิลำเนาตามมาตรา 3 ได้ กรณีนี้โจทก์ซึ่งมีสัญชาติไทยหรือมีภูมิลำเนาในไทยฟ้องได้ที่ศาลแพ่ง หรือศาลที่โจทก์มีภูมิลำเนา หรือศาลที่ทรัพย์สินของจำเลยตั้งอยู่</p>
      <p>หากทรัพย์เป็นอสังหาริมทรัพย์และต้องบังคับเอาแก่ตัวทรัพย์โดยตรง เช่น การโอนกรรมสิทธิ์ ยังคงต้องใช้มาตรา 4 ทวิ แต่ถ้าเป็นการขายทอดตลาดทรัพย์เพื่อนำเงินไปชำระหนี้ เช่น กรณีมีเจ้าหนี้หลายคนรุมลูกหนี้คนเดียว ให้ใช้มาตรา 4 ตรีแทน สำหรับ<b>มาตรา 4 จัตวา</b> คดีจัดการมรดก ให้ฟ้องที่ศาลซึ่งเจ้ามรดกมีภูมิลำเนาอยู่ในขณะถึงแก่ความตาย โดยต้องดูจากข้อเท็จจริงที่แท้จริง เช่น การอยู่กินฉันสามีภริยา การมีบุตรด้วยกัน และการซื้อที่ดินไว้ในพื้นที่นั้น ไม่ใช่ดูเพียงชื่อในทะเบียนบ้าน (<b>ฎ.5912/2539</b>) หากเจ้ามรดกไม่มีภูมิลำเนาในประเทศไทย ให้ฟ้องที่ศาลซึ่งทรัพย์มรดกตั้งอยู่แทน</p>`},
    {heading:"9. ม.5 (มูลคดีเกี่ยวข้องกัน) และ ม.7 (ห้ามยื่นคำร้องแทรกบุคคลภายนอก)",
     html:`
      <p><b>มาตรา 5</b> มักถูกใช้เป็น "มาตราปิดท้าย" เวลาตอบข้อสอบที่มีหลายศาลเข้าเงื่อนไขพร้อมกัน เมื่อมูลคดีเกิดขึ้นหลายแห่ง หรือจำเลยหลายคนอยู่คนละจังหวัดแต่มูลความแห่งคดีเกี่ยวข้องกัน โจทก์เลือกฟ้องศาลใดศาลหนึ่งได้ตามใจ และแม้ภายหลังจะถอนฟ้องจำเลยเจ้าถิ่นที่ทำให้ศาลนั้นมีอำนาจแต่แรก ศาลก็ยังคงพิจารณาคดีต่อไปกับจำเลยที่เหลืออยู่ได้ ส่วน<b>มาตรา 7</b> ห้ามยื่นคำร้องแทรกบุคคลภายนอก คือหากจะบังคับเอากับบุคคลภายนอกที่ไม่ใช่คู่ความในคดีเดิม ต้องไปฟ้องเป็นคดีใหม่เท่านั้น จะยื่นคำร้องแทรกเข้ามาในคดีเดิมเพื่อบังคับกับบุคคลภายนอกโดยตรงไม่ได้</p>`},
  ],
  parties: [
    {heading:"1. ⭐ อำนาจฟ้อง ม.55 — คดีมีข้อพิพาท vs ไม่มีข้อพิพาท",
     html:`
      <p>คดีมีข้อพิพาทต้องมี<b>ข้อโต้แย้งสิทธิ</b>ตามกฎหมายแพ่งเกิดขึ้นแล้ว โดยผู้ถูกโต้แย้งต้องเป็นผู้เสนอคดีเอง หากความเสียหายเกิดจากบุคคลอื่นที่ไม่ใช่จำเลย เช่น เจ้าหน้าที่รังวัดที่ดินผิดทำให้ที่ดินของโจทก์ล้ำเข้าไปในที่ของคนอื่น โดยที่เจ้าของที่ข้างเคียงไม่ได้ทำอะไรเลย จำเลยยังไม่ได้โต้แย้งสิทธิ จะฟ้องจำเลยไม่ได้ (<b>ฎ.1479/2517</b>) เช่นเดียวกับผู้เช่าช่วงที่นำทรัพย์ไปวางเพราะไม่แน่ใจว่าใครมีสิทธิรับเงิน ก็ไม่ถือว่าโต้แย้งสิทธิเช่นกัน (<b>ฎ.2949-2951/2540</b> คดีมาบุญครอง) แต่ในทางกลับกัน ผู้เช่าที่มีเพียงสิทธิครอบครองก็ฟ้องขับไล่ผู้บุกรุกที่เช่าได้เองโดยไม่ต้องรอให้เจ้าของที่ดินเป็นผู้ฟ้อง (<b>ฎ.97/2534</b>) ส่วนเรื่องอายุความหรือสัญญาที่ผิดแบบเป็นโมฆะนั้นไม่ตัดอำนาจฟ้อง ยังฟ้องได้เสมอ เพียงแต่อาจแพ้คดีในเนื้อหาภายหลัง จึงไม่ควรเอาผลแพ้ชนะทางกฎหมายสารบัญญัติมาปนกับเรื่องอำนาจฟ้องทางวิธีสบัญญัติ</p>
      <p>คดีไม่มีข้อพิพาทใช้วิธีการยื่นคำร้องขอฝ่ายเดียว ต้องมีกฎหมายบัญญัติรับรองให้ใช้สิทธิทางศาลไว้ชัดเจนเท่านั้นจึงจะร้องขอได้ เช่น การร้องขอให้ศาลสั่งว่าตนเป็นบุคคลเดียวกับคนเดิม หรือขอเปลี่ยนคำนำหน้าหลังผ่าตัดแปลงเพศ ซึ่งไม่มีกฎหมายรองรับให้ทำได้ ศาลจึงไม่รับคำร้องขอ (<b>ฎ.100/2524</b>, <b>ฎ.157/2524</b>) แต่หากมีคนมาโต้แย้งสิทธินั้น เช่น เถียงว่า "ไม่ใช่ตัวจริง ไม่มีสิทธิรับมรดก" คดีนั้นจะกลายเป็นคดีมีข้อพิพาทขึ้นมาทันที และฟ้องได้</p>`},
    {heading:"2. ความสามารถ ม.56 — แยกจากอำนาจฟ้อง",
     html:`
      <p>อำนาจฟ้องตามมาตรา 55 กับ<b>ความสามารถ</b>ตาม<b>มาตรา 56</b> เป็นคนละเรื่องกัน ผู้เยาว์มีอำนาจฟ้องได้เพราะเป็นผู้ถูกโต้แย้งสิทธิเอง แต่บกพร่องในเรื่องความสามารถ จึงต้องให้ผู้แทนโดยชอบธรรมฟ้องแทนหรือขออนุญาตจากศาลก่อน เช่นเดียวกับคนไร้ความสามารถหรือคนเสมือนไร้ความสามารถที่ต้องมีผู้อนุบาลหรือผู้พิทักษ์ดำเนินการแทน ข้อสำคัญที่ต้องจำคือความบกพร่องเรื่องความสามารถนั้น "แก้ไขได้" ศาลจะสั่งให้ไปทำให้ถูกต้องก่อน ไม่ยกฟ้องทันที แต่ถ้าไม่มีอำนาจฟ้องมาตั้งแต่ต้น เช่น ไม่ใช่ผู้ถูกโต้แย้งสิทธิ กรณีนี้แก้ไขไม่ได้ ศาลต้องยกฟ้องไปเลย</p>`},
    {heading:"3. ⭐ ร้องสอด ม.57 — 3 ช่องทาง + 5 หลักเกณฑ์",
     html:`
      <p>อนุมาตรา (1) คือการสมัครใจเข้ามาเพื่อ "บังคับตามสิทธิของตนเอง" ซึ่งเป็นสิทธิเอกเทศไม่อิงกับคู่ความเดิม รวมถึงร้องสอดในชั้นบังคับคดีได้ด้วย อนุมาตรา (2) คือการสมัครใจเข้ามาเพราะมี "ส่วนได้เสียตามกฎหมายในผลแห่งคดี" เป็นโจทก์ร่วมหรือจำเลยร่วม หรือขอเข้าแทนที่คู่ความเดิมโดยต้องได้รับความยินยอมจากคู่ความเดิมด้วย ส่วนอนุมาตรา (3) คือการถูกหมายเรียกเข้ามา โดยคู่ความฝ่ายหนึ่งขอเพื่อใช้สิทธิไล่เบี้ยหรือเรียกค่าทดแทน หรือโดยคำสั่งศาลเพื่อประโยชน์แห่งความยุติธรรม คำร้องสอดตาม (1) และ (2) ถือเป็น "คำคู่ความ" หากศาลไม่รับก็อุทธรณ์ได้ทันที (<b>ฎ.1226/2510</b>) แต่ (3) ไม่ใช่คำคู่ความ หากศาลไม่อนุญาตต้องโต้แย้งไว้ก่อนแล้วรอให้คดีหลักเสร็จสิ้นจึงจะอุทธรณ์ได้ตามมาตรา 226</p>
      <p>สำหรับหลักเกณฑ์ทั่วไป 5 ข้อ หลักเกณฑ์แรก คดีต้องอยู่ระหว่างการพิจารณา คดีที่ถูกจำหน่ายไปแล้วร้องสอดไม่ได้ เว้นแต่ภายหลังศาลจะเพิกถอนคำสั่งจำหน่ายคดี หรือเป็นการร้องสอดตาม (1) ในชั้นบังคับคดี หลักเกณฑ์ที่สอง ผู้ร้องต้องเป็น<b>บุคคลภายนอก</b>อย่างแท้จริง คู่ความเดิมที่ขาดนัดยื่นคำให้การยังมีสถานะเป็นคู่ความอยู่ จะร้องสอดกลับเข้ามาไม่ได้ (<b>ฎ.5463/2534</b>) แต่ถ้าพ้นจากความเป็นคู่ความไปแล้ว เช่น ถูกถอนฟ้อง ก็กลับมาร้องสอดใหม่ได้ (<b>ฎ.6779/2506</b>) หลักเกณฑ์ที่สาม ต้องมีอำนาจฟ้องและความสามารถ และห้ามคดีอุทลุม บุตรจะร้องสอดเป็นโจทก์ร่วมเพื่อฟ้องบุพการีไม่ได้ แต่บุพการีถูกหมายเรียกเป็นจำเลยร่วมได้เพราะไม่ใช่บุตรสมัครใจฟ้องเอง (<b>ฎ.961/2506</b>) หลักเกณฑ์ที่สี่ การอนุญาตให้ร้องสอดเป็นดุลพินิจของศาลเสมอแม้จะเข้าหลักเกณฑ์ครบถ้วน หากร้องสอดช้าเกินไปจนต้องย้อนสืบพยานใหม่ ศาลให้ไปฟ้องเป็นคดีใหม่แทนได้ (<b>ฎ.1113/2535</b>, <b>ฎ.4517/2540</b>, <b>ฎ.344/2541</b>) และหลักเกณฑ์ที่ห้า ต้องทำเป็นคำร้องที่มีคำขอบังคับชัดเจนตามมาตรา 172 หากไม่มีคำขอบังคับ ศาลไม่รับไว้พิจารณา (<b>ฎ.1447/2530</b>, <b>ฎ.6445/2540</b>)</p>
      <p>ผู้ร้องสอดตามอนุมาตรา (1) ต้องมีสิทธิเกี่ยวข้องกับทรัพย์หรือประเด็นพิพาทโดยตรงเท่านั้น เช่น กรณีที่ดินของผู้ร้องอยู่นอกเขตที่โจทก์กับจำเลยพิพาทกัน แม้โจทก์จะรังวัดรุกล้ำเข้าไปในที่ดินของผู้ร้องด้วยก็ยังร้องสอดไม่ได้ (<b>ฎ.4477/2529</b>) แต่การร้องสอดตาม (1) นั้นใช้สิทธิของตนเองได้แม้โจทก์เดิมจะไม่มีอำนาจฟ้องเลยก็ตาม เช่น มารดาที่แท้จริงร้องสอดเข้ามาในคดีที่บิดานอกกฎหมายฟ้องละเมิดแทนบุตรที่เสียชีวิต (<b>ฎ.148/2522</b>)</p>
      <div class="examBox"><div class="exlabel">📝 โจทย์ฝึกจากหลักในคำบรรยาย</div>
        <div class="exq">โจทก์ฟ้องขับไล่จำเลยออกจากที่ดิน อ้างว่าที่ดินพิพาทเป็นของโจทก์ จำเลยให้การต่อสู้ว่าที่ดินเป็นของจำเลยโดยครอบครองปรปักษ์ ระหว่างพิจารณาคดี นายสามซึ่งเป็นบุตรของโจทก์ยื่นคำร้องขอเข้าร่วมเป็นโจทก์ร่วมเพราะที่ดินพิพาทเป็นสินสมรสระหว่างโจทก์กับมารดาของตนซึ่งถึงแก่กรรมไปแล้ว นายสามในฐานะทายาทจึงมีส่วนได้เสียในที่ดินด้วย ให้ท่านวินิจฉัยว่านายสามร้องสอดเข้ามาในคดีนี้ได้หรือไม่ ด้วยวิธีใด</div>
        <div class="exsrc">โจทย์ฝึกอิงหลักเกณฑ์การร้องสอด ม.57</div>

        <div class="examAns" id="exam-parties-1"><span class="exanslabel">✅ แนวคำตอบ</span><p>นายสามร้องสอดเข้ามาในคดีนี้ได้ โดยใช้ช่องทางตามมาตรา 57(2) คือการสมัครใจเข้ามาเพราะมีส่วนได้เสียตามกฎหมายในผลแห่งคดี เนื่องจากนายสามเป็นทายาทโดยธรรมของมารดาผู้ถึงแก่กรรม ซึ่งมีสิทธิในที่ดินพิพาทร่วมกับโจทก์ในฐานะสินสมรส ผลแพ้ชนะของคดีนี้ย่อมกระทบต่อกองมรดกที่นายสามมีสิทธิได้รับโดยตรง จึงเข้าเงื่อนไข "ส่วนได้เสียตามกฎหมายในผลแห่งคดี" ตามมาตรา 57(2) แต่เมื่อเข้ามาในฐานะโจทก์ร่วมตามอนุมาตรานี้ นายสามจะต้องระวังว่าตนใช้สิทธิ "เกินกว่า" หรือ "ขัดแย้ง" กับโจทก์เดิมไม่ได้ กล่าวคือต้องดำเนินคดีไปในทิศทางเดียวกับที่โจทก์เดิมฟ้องไว้ จะยกข้ออ้างใหม่ที่ขัดกับคำฟ้องเดิมของโจทก์ไม่ได้</p></div>
      </div>`},
    {heading:"3ข. ⭐ ผลของการร้องสอด (ม.58) — 57(1)(3) vs 57(2)",
     html:`
      <p>ผู้ร้องสอดตามอนุมาตรา (1) และ (3) มีสิทธิเสมือนหนึ่งว่าตนได้ฟ้องหรือถูกฟ้องเป็นคดีใหม่ อิสระเต็มที่ ไม่ผูกพันกับคู่ความเดิม สามารถนำพยานหลักฐานใหม่มาสืบได้ ถามค้านพยานที่สืบไปแล้วก่อนตนเข้ามาได้ และยื่นคำให้การตั้งประเด็นใหม่ของตนเองได้ เช่น เพิ่มข้อต่อสู้เรื่องอายุความ แม้จำเลยเดิมจะขาดนัดยื่นคำให้การก็ไม่ตัดสิทธินี้ (<b>ฎ.797/2515</b>) และแม้คำฟ้องเดิมของโจทก์จะเสียไปเพราะไม่มีอำนาจฟ้อง คำร้องสอดตามอนุมาตรา (1) ก็ยังดำเนินคดีต่อไปได้ (<b>ฎ.148/2522</b> มติที่ประชุมใหญ่)</p>
      <p>ในทางกลับกัน ผู้ร้องสอดตามอนุมาตรา (2) ห้ามใช้สิทธิ "เกินกว่า" หรือ "ขัดแย้ง" กับคู่ความฝ่ายที่ตนเข้าร่วม หากจำเลยเดิมให้การไว้เพียงว่าฟ้องเคลือบคลุม จำเลยร่วมจะมาเพิ่มประเด็นเรื่องอายุความไม่ได้ แต่หากเข้ามาในขณะที่จำเลยเดิมยังไม่ได้ยื่นคำให้การและยังไม่พ้นกำหนดเวลา จำเลยร่วมยื่นคำให้การของตนได้เต็มที่ ไม่ถือว่าเกินสิทธิ (<b>ฎ.875/2537</b>) และหากศาลไม่รับคำให้การของจำเลยร่วม จำเลยร่วมยังถือเอาคำให้การของจำเลยเดิมเป็นของตนเองได้ (<b>ฎ.1131/2518</b>) ส่วนกรณีที่โจทก์เดิมไม่มีอำนาจฟ้องมาตั้งแต่ต้น บุคคลภายนอกจะร้องสอดเข้ามาเป็นโจทก์ร่วมไม่ได้ (<b>ฎ.1050/2493</b>)</p>
      <p>โดยหลักแล้วคำพิพากษาผูกพันผู้ร้องสอดเสมอ แม้คำขอท้ายฟ้องเดิมจะไม่ได้เอ่ยถึงผู้ร้องสอดโดยตรง ก็ต้องอนุโลมว่าครอบคลุมผู้ร้องสอดด้วย ไม่ถือว่าศาลพิพากษาเกินคำขอ (<b>ฎ.652/2510</b>, <b>ฎ.7091/2542</b>) แต่มีข้อยกเว้นเฉพาะผลระหว่างคู่ความฝ่ายเดียวกันเอง ไม่กระทบคู่ความอีกฝ่ายหรือบุคคลภายนอก คือเมื่อคู่ความเดิมประมาทเลินเล่อทำให้ผู้ร้องสอดเข้ามาช้าเกินกว่าจะยกข้อเถียงสำคัญได้ หรือคู่ความเดิมจงใจหรือประมาทเลินเล่ออย่างร้ายแรงไม่ยกข้อเถียงสำคัญที่ผู้ร้องสอดไม่รู้ เช่น ลูกหนี้ร่วมที่รู้อยู่แล้วว่าได้ชำระหนี้บางส่วนไปแล้วแต่กลับไม่ยกขึ้นสู้คดี ผลของคำพิพากษาจะไม่ผูกพันผู้ค้ำร่วมที่ไม่รู้เรื่องนี้ในความสัมพันธ์ระหว่างกันเอง แม้ทั้งคู่จะยังต้องรับผิดเต็มจำนวนต่อโจทก์ก็ตาม</p>
      <p>ในการแยกคีย์เวิร์ด มาตรา 59 ใช้กับคู่ความที่ร่วมกันมาตั้งแต่ต้นฟ้อง โดยใช้คำว่า "ผลประโยชน์ร่วมกันในมูลความแห่งคดี" (<b>ฎ.695/2524</b>) ส่วนมาตรา 57 ใช้กับผู้ที่เข้ามาภายหลัง ซึ่งต้องใช้คีย์เวิร์ดเฉพาะของแต่ละอนุมาตรา คือความจำเป็นเพื่อรับรองสิทธิของตน ส่วนได้เสียตามกฎหมายในผลแห่งคดี หรือสิทธิไล่เบี้ย แล้วแต่กรณี</p>`},
    {heading:"4. คู่ความร่วม ม.59 และคู่ความมรณะ ม.42-43",
     html:`
      <p>คู่ความร่วมต้องมีผลประโยชน์ร่วมกันในมูลความแห่งคดี เช่น เป็นเจ้าของรวม เป็นลูกหนี้ร่วม หรือเกิดจากเหตุละเมิดเดียวกัน ไม่ใช่เพียงมีมูลหนี้คนละสัญญาที่บังเอิญมีลักษณะคล้ายกัน เช่น ต่างคนต่างขอครอบครองปรปักษ์ที่ดินคนละแปลง แม้จะยื่นฟ้องในวันเดียวกันก็ไม่ถือเป็นคู่ความร่วมกัน</p>
      <p>สำหรับผลการทำแทนกันระหว่างคู่ความร่วม มีสองหลักที่ต้องแยกให้ออก หลักแรกคือการกระทำที่เสื่อมเสีย เช่น การรับสารภาพหรือการทำคำท้า ถือหลัก "ทำชั่วรับไปคนเดียว" ไม่ผูกพันคู่ความร่วมที่ไม่ได้ยินยอมด้วย เช่น จำเลยที่ 1 ซึ่งเป็นคนขับรับว่าตนประมาท ไม่ผูกพันจำเลยที่ 2 ซึ่งเป็นนายจ้างที่ยังคงสู้คดีต่อไปได้ หรือคำท้าพิสูจน์ลายมือที่จำเลยที่ 1 ตกลงเอง ก็ไม่ผูกพันจำเลยที่ 2 ที่ไม่ได้ยินยอมด้วย (<b>ฎ.1713/2523</b>) หลักที่สองคือการกระทำที่เป็นคุณ หรือกรณีมูลหนี้ที่แบ่งแยกจากกันไม่ได้ ถือหลัก "ทำดีได้ดีด้วยกัน" ผลจะแผ่ไปถึงคู่ความร่วมทุกคนโดยอัตโนมัติ เช่น สัญญาที่ไม่มีอากรแสตมป์ทำให้จำเลยที่ 1 ซึ่งเป็นลูกหนี้ชนะคดี ผลนั้นแผ่ไปถึงจำเลยที่ 2 ซึ่งเป็นผู้ค้ำประกันด้วย แม้จำเลยที่ 2 เองจะเบิกความรับว่ามีสัญญาจริงก็ตาม (<b>ฎ.8880/2547</b>) เช่นเดียวกับกรณีที่ลูกหนี้ร่วมคนหนึ่งยกอายุความขึ้นต่อสู้จนสำเร็จ ผลก็แผ่ไปถึงลูกหนี้ร่วมคนอื่นที่ไม่ได้ยกขึ้นเองหรือไม่ได้ฎีกาด้วย (<b>ฎ.914/2538</b>) และกรณีทนายจำเลยคนหนึ่งขอเลื่อนคดีเพราะป่วย ผลของการเลื่อนก็แผ่ไปถึงจำเลยร่วมคนอื่นด้วย เพราะกระบวนพิจารณาแยกจากกันไม่ได้ (<b>ฎ.2987/2525</b>)</p>
      <p>สำหรับกรณีคู่ความมรณะ หน้าที่ที่เป็นการเฉพาะตัว เช่น หน้าที่ผู้จัดการมรดก จะไม่ตกทอดไปยังทายาทของคู่ความที่ถึงแก่ความตาย ผู้ที่จะเข้าแทนที่ได้ต้องเป็นผู้มีอำนาจจัดการทรัพย์มรดกอย่างแท้จริงเท่านั้น</p>`},
  ],
  service: [
    {heading:"1. รูปแบบและการยื่นคำคู่ความ (ม.67-69)",
     html:`
      <p>คำคู่ความและเอกสารทุกฉบับต้องมีรายการครบถ้วนตาม<b>มาตรา 67</b> 5 อย่าง คือ ชื่อศาลและเลขคดี ชื่อคู่ความ ชื่อผู้รับเอกสาร ใจความและเหตุผล และวันที่พร้อมลายมือชื่อผู้ส่ง ส่วน<b>มาตรา 68</b> รองรับการยื่นและส่งเอกสารทางอิเล็กทรอนิกส์ตามข้อกำหนดของประธานศาลฎีกา แต่ในทางปฏิบัติปัจจุบันประชาชนทั่วไปยังฟ้องคดีด้วยตนเองผ่านระบบ e-Filing ได้เฉพาะบางประเภทคดีเท่านั้น เช่น คดีผิดสัญญาซื้อขายออนไลน์ หรือคดีร้องขอจัดการมรดก ส่วนคดีประเภทอื่นยังต้องดำเนินการผ่านทนายความหรืออัยการอยู่</p>
      <p>สำหรับช่องทางการยื่นคำคู่ความตาม<b>มาตรา 69</b> มี 2 ทาง คือยื่นต่อเจ้าหน้าที่ศาลตามปกติ ซึ่งผู้ที่ไปยื่นแทนคู่ความต้องมีใบมอบฉันทะกำกับ หรือยื่นต่อศาลโดยตรงในระหว่างนั่งพิจารณาคดี แต่ต้องเป็นคำคู่ความของคดีนั้นและเกี่ยวข้องกับประเด็นที่กำลังพิจารณาอยู่ในขณะนั้นเท่านั้น จะยื่นเรื่องอื่นแทรกเข้ามาไม่ได้</p>`},
    {heading:"2. ⭐ 4 วิธีการส่งคำคู่ความ (ม.70-72)",
     html:`
      <p>วิธีการส่งคำคู่ความตามกฎหมายมี 4 วิธีหลัก ซึ่งแต่ละวิธีใช้กับเอกสารคนละประเภทกัน วิธีแรกคือ<b>คู่ความส่งเอง</b> ใช้เฉพาะหมายเรียกพยานฝ่ายตนตาม<b>มาตรา 70(1)</b> เว้นแต่พยานจะปฏิเสธไม่ยอมรับจึงเปลี่ยนให้เจ้าพนักงานศาลส่งแทน วิธีที่สองคือการ<b>ลงลายมือชื่อรับรู้ในศาล</b>ตาม<b>มาตรา 70(2)</b> ใช้กับคำสั่งศาลจำพวกวันนัดหรือการเลื่อนคดี หากคู่ความอยู่ในศาลขณะมีคำสั่งและลงชื่อรับทราบไว้ ถือว่าส่งโดยชอบทันทีโดยไม่ต้องส่งซ้ำอีก</p>
      <p>วิธีที่สามคือการ<b>รับไปเองทางเจ้าพนักงานศาล</b> ใช้กับเอกสารที่คู่ความรู้อยู่แล้วว่าจะต้องมี เช่น โจทก์ต้องมารับสำเนาคำให้การของจำเลยด้วยตนเองตาม<b>มาตรา 71</b> เพราะกฎหมายถือว่าโจทก์มีหน้าที่ติดตามความคืบหน้าของคดีอยู่แล้ว แต่ถ้าเป็นคำร้องขอแก้ไขคำให้การซึ่งเป็นเหตุแทรกซ้อนที่โจทก์คาดไม่ถึง หน้าที่จะเปลี่ยนกลับไปเป็นของเจ้าพนักงานศาลที่ต้องนำส่งให้แทน (มาตรา 71 วรรคสอง) ส่วนวิธีที่สี่ ซึ่งเป็นวิธีหลักและพบบ่อยที่สุด คือ<b>ให้เจ้าพนักงานศาลเป็นผู้ส่ง</b> ใช้กับคำฟ้องตั้งต้นคดี หมายเรียก และคำสั่งศาลทั่วไป</p>
      <p>ในแง่ค่าใช้จ่ายและหน้าที่ โจทก์มีหน้าที่เพียงชำระค่าธรรมเนียมในการส่งเท่านั้น ส่วนจะไปนำส่งเอกสารด้วยตนเองหรือไม่ก็ได้ เว้นแต่ศาลจะมีคำสั่งเฉพาะให้โจทก์มีหน้าที่นำส่งด้วยตนเอง ซึ่งหากศาลสั่งเช่นนั้นแล้วโจทก์เพิกเฉยไม่ไปดำเนินการ ศาลมีอำนาจสั่งจำหน่ายคดีออกจากสารบบความในฐานทิ้งฟ้องได้ทันที</p>`},
    {heading:"3. ส่งคำคู่ความให้คู่ความ/บุคคลภายนอก ม.74-79",
     html:`
      <p>เมื่อต้องส่งคำคู่ความให้แก่คู่ความหรือบุคคลภายนอก กฎหมายวางลำดับขั้นตอนไว้อย่างเคร่งครัด โดยต้องส่งโดยตรงแก่ตัวคู่ความก่อนตาม<b>มาตรา 74</b> หากไปแล้วไม่พบตัวจึงจะส่งให้คนในบ้านที่มีอายุเกิน 20 ปี ณ ภูมิลำเนาหรือสำนักทำการงานของจำเลยเท่านั้นตาม<b>มาตรา 76</b> ได้ และหากยังส่งไม่ได้อีกจึงใช้วิธี<b>ปิดหมาย</b>ตาม<b>มาตรา 79</b> เป็นทางเลือกสุดท้าย ซึ่งมีผลต่อเมื่อพ้น 15 วันนับแต่วันปิดเท่านั้น จะข้ามลำดับขั้นตอนไม่ได้ นอกจากนี้การส่งมอบเอกสารนอกสถานที่ตามกฎหมาย เช่น ที่ทำการไปรษณีย์ ก็ไม่ถือว่าชอบด้วยกฎหมายเช่นกัน แม้ผู้รับจะเป็นคนในบ้านจริงก็ตาม</p>
      <p>ในแง่เวลาและข้อห้าม การส่งทำได้เฉพาะเวลากลางวัน คือตั้งแต่พระอาทิตย์ขึ้นถึงพระอาทิตย์ตกเท่านั้น แต่สามารถส่งในวันเสาร์-อาทิตย์ได้เพราะไม่ใช่วันหยุดราชการที่กฎหมายห้าม และมีข้อห้ามสำคัญคือห้ามส่งคำฟ้องตั้งต้นคดีให้แก่ทนายความโดยเด็ดขาด เพราะยังไม่มีการแต่งตั้งทนายความในคดีนั้นเลย <b>มาตรา 75</b> ที่ให้ส่งแก่ทนายความได้จะใช้ได้ก็ต่อเมื่อมีการแต่งตั้งทนายความเข้ามาในคดีแล้วเท่านั้น</p>
      <p>สำหรับวิธีพิเศษเมื่อส่งไม่ได้ตามช่องทางปกติ <b>มาตรา 78</b> กำหนดว่าหากเจ้าหน้าที่พบตัวผู้รับแต่ผู้รับปฏิเสธไม่ยอมรับเอกสาร เจ้าหน้าที่ต้องพาพยาน เช่น ตำรวจหรือฝ่ายปกครอง มาเป็นสักขีพยานแล้ววางเอกสารไว้ ซึ่งมีผลทันทีโดยไม่ต้องรอ 15 วัน ส่วนการส่งทางไปรษณีย์ตาม<b>มาตรา 73 ทวิ</b> ต้องมีคำสั่งศาลอนุญาตก่อนเสมอ และต้องส่งแบบลงทะเบียนตอบรับหรือ EMS เท่านั้น ซึ่งก็มีผลทันทีเมื่อมีการเซ็นรับเช่นเดียวกัน ไม่ต้องรอครบ 15 วันเหมือนวิธีปิดหมาย</p>
      <div class="examBox"><div class="exlabel">📝 ตัวอย่างข้อสอบจริง</div>
        <div class="exq">โจทก์ฟ้องขับไล่จำเลยออกจากที่ดินของโจทก์ ศาลชั้นต้นสั่งรับฟ้อง หลังจากนั้นโจทก์และเจ้าพนักงานศาลนำหมายเรียกและสำเนาคำฟ้องไปส่งให้จำเลยที่บ้านของจำเลย ปรากฏว่า (ก) พบจำเลย แต่จำเลยไม่ยอมรับหมายเรียกและสำเนาคำฟ้อง เจ้าพนักงานศาลจึงวางหมายเรียกและสำเนาคำฟ้องไว้ ณ ที่นั้น (ข) ไม่พบจำเลย แต่พบนางโฉมฉายอายุ 19 ปี ซึ่งจดทะเบียนสมรสกับน้องชายจำเลยและอยู่บ้านเดียวกับจำเลย นางโฉมฉายยินดีรับหมายเรียกและสำเนาคำฟ้องไว้แทนจำเลย เจ้าพนักงานศาลจึงให้นางโฉมฉายรับหมายเรียกและสำเนาคำฟ้องไว้แทน ดังนี้ ให้วินิจฉัยว่าการส่งหมายเรียกและสำเนาคำฟ้องในกรณี (ก) และ (ข) ชอบด้วยกฎหมายหรือไม่ เพราะเหตุใด</div>
        <div class="exsrc">แบบฝึกหัดและข้อสอบเก่าวิชากฎหมายวิธีพิจารณาความแพ่งภาคทั่วไป ข้อ 15</div>
        <button type="button" class="examToggle" onclick="toggleExamAns('exam-service-1')">🔎 ดูเฉลย</button>
        <div class="examAns" id="exam-service-1"><span class="exanslabel">✅ แนวคำตอบ</span><p>กรณี (ก) ไม่ชอบด้วยกฎหมาย เพราะเมื่อเจ้าพนักงานศาลพบตัวจำเลยแล้วแต่จำเลยไม่ยอมรับเอกสาร กฎหมายกำหนดวิธีการไว้เฉพาะตามมาตรา 78 คือต้องนำพยาน (เช่น ตำรวจหรือฝ่ายปกครอง) มาเป็นสักขีพยานในการวางเอกสารไว้ ณ ที่นั้นด้วยเสมอ การที่เจ้าพนักงานศาลวางเอกสารไว้เองโดยไม่มีพยานมาเป็นสักขีพยานตามที่กฎหมายกำหนด จึงไม่ชอบด้วยมาตรา 78 กรณี (ข) ก็ไม่ชอบด้วยกฎหมายเช่นกัน เพราะมาตรา 76 กำหนดให้ส่งแก่ "คนในบ้าน" ที่มีอายุเกิน 20 ปีเท่านั้น นางโฉมฉายอายุเพียง 19 ปี แม้จะยินดีรับไว้และอยู่บ้านเดียวกับจำเลยจริง ก็ไม่เข้าเงื่อนไขอายุตามที่กฎหมายกำหนด การส่งจึงไม่ชอบด้วยกฎหมายเช่นกัน</p></div>
      </div>
      <div class="examBox"><div class="exlabel">📝 ตัวอย่างข้อสอบจริง</div>
        <div class="exq">ศาลชั้นต้นออกหมายนัดให้โจทก์และจำเลยในคดีแพ่งเรื่องหนึ่งมาฟังคำพิพากษาและมอบหน้าที่ให้นายวิเศษ เจ้าพนักงานของศาลเป็นผู้ไปส่งหมายนัด ปรากฏว่านายวิเศษพบนายส่วนสมีของโจทก์กำลังเดินอยู่ในศาล นายวิเศษจึงได้ส่งหมายนัดถึงโจทก์ให้นายส่วนอายุ 40 ปี รับไว้แทนโจทก์ แล้วนายวิเศษได้นำหมายนัดถึงจำเลยไปยังสำนักงานของนายสอ ทนายความที่จำเลยได้แต่งให้เป็นทนายความในคดีนั้น แต่ไม่พบนายสอ พบนางสาวส่งศรี อายุ 21 ปี นั่งอยู่ในสำนักงานของนายสอและแจ้งว่าทำงานอยู่สำนักงานใกล้ ๆ กัน ยินดีรับหมายนัดไว้แทน ครั้นถึงวันนัดฟังคำพิพากษา โจทก์และจำเลยไม่มาศาล ศาลจึงได้บันทึกไว้ในรายงานกระบวนพิจารณาว่าคู่ความไม่มาศาลให้ถือว่าอ่านคำพิพากษาให้คู่ความฟังแล้ว ดังนั้นท่านเห็นว่าการปฏิบัติของศาลเป็นการชอบด้วยกฎหมายหรือไม่</div>
        <div class="exsrc">แบบฝึกหัดและข้อสอบเก่าวิชากฎหมายวิธีพิจารณาความแพ่งภาคทั่วไป ข้อ 16</div>
        <button type="button" class="examToggle" onclick="toggleExamAns('exam-service-2')">🔎 ดูเฉลย</button>
        <div class="examAns" id="exam-service-2"><span class="exanslabel">✅ แนวคำตอบ</span><p>การส่งหมายนัดให้แก่โจทก์ชอบด้วยกฎหมาย เพราะมาตรา 74 ให้ส่งแก่ตัวคู่ความโดยตรงได้เสมอ นายส่วนคือตัวโจทก์เอง การพบตัวและส่งให้ ณ ที่ใดก็ได้ตามที่พบตัว จึงถือว่าส่งโดยชอบ ส่วนการส่งหมายนัดให้แก่จำเลยผ่านนายสอทนายความไม่ชอบด้วยกฎหมาย เพราะมาตรา 76 กำหนดให้ส่งแก่คนในบ้านหรือสำนักทำการงานของ "ผู้รับ" เอง (คือนายสอ) เท่านั้น นางสาวส่งศรีเพียงทำงานอยู่ในสำนักงานใกล้เคียงกัน มิใช่คนในสำนักทำการงานของนายสอ จึงไม่เข้าเงื่อนไขตามมาตรา 76 การส่งจึงไม่ชอบด้วยกฎหมาย เมื่อการส่งหมายนัดแก่จำเลยไม่ชอบ ย่อมถือว่าจำเลยยังไม่ทราบวันนัดฟังคำพิพากษาโดยชอบ การที่ศาลบันทึกว่าจำเลยไม่มาศาลให้ถือว่าอ่านคำพิพากษาให้ฟังแล้วจึงไม่ชอบด้วยกฎหมายเช่นกัน ต้องส่งหมายนัดฟังคำพิพากษาให้จำเลยใหม่ให้ถูกต้องก่อน</p></div>
      </div>`},

  pleading: [
    {heading:"1. ⭐ ฟ้องเคลือบคลุม (ม.172 ว.2) — หลักและตัวอย่างจริง",
     html:`
      <p>คำฟ้องต้องแสดงสภาพแห่งข้อหา ข้ออ้างที่อาศัยเป็นหลักแห่งข้อหา และคำขอบังคับ ให้จำเลยเข้าใจและต่อสู้คดีได้ โดยไม่จำเป็นต้องลงรายละเอียดที่นำสืบได้ในภายหลัง หากบรรยายฟ้องด้วยข้อเท็จจริงที่เป็นไปพร้อมกันไม่ได้ ถือว่า<b>ฟ้องเคลือบคลุม</b> เช่น ฟ้องว่าพินัยกรรมเป็นของปลอมคือเจ้ามรดกไม่ได้ทำ และในขณะเดียวกันก็อ้างว่าถูกหลอกลวงให้ทำคือทำจริงแต่สำคัญผิด (<b>ฎ.651/2498</b>) หรือฟ้องโดยไม่บอกที่มาของหนี้หรือค่าเสียหายเลย เช่น ระบุเพียงว่าค้างค่าก่อสร้าง 14,600 บาทโดยไม่บอกว่าเป็นงานอะไร (<b>ฎ.759/2519</b>) หรือระบุเพียงว่าเสียหายไม่น้อยกว่า 500,000 บาทโดยไม่บอกว่าเสียหายอย่างไร ซึ่งทำให้โจทก์แพ้คดีเพราะเหตุนี้โดยตรง (<b>ฎ.5141/2549</b>)</p>
      <p>ในทางกลับกัน หากข้อเท็จจริงยังไปด้วยกันได้ แม้จะอ้างข้อกฎหมายสองทาง ก็ไม่ถือว่าเคลือบคลุม เช่น ฟ้องว่าถูกทั้งกลฉ้อฉลและข่มขู่รวมกัน เพราะสองเหตุนี้เกิดขึ้นพร้อมกันได้ในทางปฏิบัติ (<b>ฎ.5137/2533</b>) หรือฟ้องโดยไม่แน่ใจว่าเป็นทางจำเป็นหรือภาระจำยอมก็ฟ้องมาทั้งสองทางได้ เพราะการปรับบทกฎหมายเป็นหน้าที่ของศาล ไม่ใช่หน้าที่โจทก์ (<b>ฎ.3161/2533</b>) นอกจากนี้คดีละเมิดไม่จำเป็นต้องระบุตัวเลขค่าเสียหายที่แน่นอน เพราะกฎหมายให้ศาลกำหนดได้เองตามพฤติการณ์และความร้ายแรงแห่งละเมิด (<b>ฎ.1128/2508</b>) และไม่จำเป็นต้องบรรยายรายละเอียดยิบย่อยที่นำสืบได้ภายหลัง เช่น ไม่ต้องระบุชื่อเจ้าของทรัพย์แต่ละรายการที่รับช่วงสิทธิมา (<b>ฎ.43/2525</b>) หรือไม่ต้องแนบเอกสารบัญชีเดินสะพัดโดยละเอียดทุกเดือนมาพร้อมฟ้อง (<b>ฎ.2074/2540</b>)</p>
      <p>ในเชิงกลยุทธ์การฟ้องขับไล่ หากผู้ให้เช่าไม่ใช่เจ้าของที่ดินเอง เช่น กรณีเช่าช่วงมา ควรฟ้องโดยอาศัยสิทธิตามสัญญาเช่าเท่านั้น ไม่ควรฟ้องโดยอ้างกรรมสิทธิ์ เพราะจะเปิดช่องให้จำเลยต่อสู้แทงสวนในเรื่องกรรมสิทธิ์ได้ (<b>ฎ.948/2501</b>, <b>ฎ.1286/2508</b>) และเมื่อคำฟ้องเคลือบคลุมเพียงบางส่วน ศาลจะตัดเฉพาะส่วนที่เคลือบคลุมออก ไม่ยกฟ้องทั้งคดี ส่วนที่ไม่เคลือบคลุมยังพิจารณาต่อไปได้ (<b>ฎ.651/2498</b>)</p>`},
    {heading:"2. ⭐ คำให้การ ม.177 — ต้องชัดแจ้งและมีเหตุแห่งการปฏิเสธ",
     html:`
      <p>คำให้การต้องแสดงโดยชัดแจ้งว่าจำเลยยอมรับหรือปฏิเสธข้อหาของโจทก์ทั้งสิ้นหรือแต่บางส่วน รวมทั้งต้องระบุเหตุแห่งการปฏิเสธด้วย จะให้การลอย ๆ ว่า "นอกจากที่ให้การต่อไปนี้ ขอให้ถือว่าจำเลยปฏิเสธ" โดยไม่มีเหตุผลไม่ได้ ถือเป็นคำให้การที่ไม่ชอบ และเมื่อจำเลยไม่ได้ให้การถึงข้อใดในฟ้อง ย่อมถือไม่ได้ว่าจำเลยปฏิเสธข้อนั้น กลายเป็นว่าจำเลยยอมรับไปโดยปริยาย โจทก์จึงไม่ต้องนำสืบในประเด็นนั้นอีก (<b>ฎ.1196/2511</b>)</p>
      <p>ตัวอย่างคำให้การที่ไม่ชอบ ได้แก่ กรณีจำเลยให้การว่า "ไม่ทราบ ไม่รับรอง" เช่น ในประเด็นสถานะนิติบุคคลของโจทก์ ถือเป็นคำกลาง ๆ ไม่ใช่ทั้งคำรับหรือคำปฏิเสธ จึงไม่ก่อให้เกิดประเด็นข้อพิพาทเลย (<b>ฎ.839/2535</b>) และในคดีที่โจทก์ฟ้องว่าจำเลยทำสัญญาค้ำประกันสามฉบับ หากจำเลยเพียงปฏิเสธลอย ๆ ว่าได้ทำสัญญาไว้ฉบับเดียวโดยไม่ระบุว่าฉบับใดจริงฉบับใดเท็จ ถือเป็นคำให้การปฏิเสธลอยที่ไม่มีประเด็นให้นำสืบเลย แม้ศาลชั้นต้นจะยอมให้สืบพยานไปก็ถือเป็นการพิจารณานอกประเด็นที่ศาลสูงรับฟังไม่ได้ (<b>ฎ.2662/2517</b>)</p>
      <p>ตัวอย่างผลของการไม่โต้แย้งครบทุกประเด็น หากโจทก์ฟ้องเรียกเงินตามสัญญาประนีประนอมยอมความ แต่จำเลยให้การเพียงว่าจำนวนเงินที่เรียกสูงเกินจริง โดยไม่ได้โต้แย้งเรื่องการทำสัญญาเลย ย่อมถือว่าจำเลยยอมรับว่าได้ทำสัญญาประนีประนอมยอมความแล้ว ศาลจึงไม่มีอำนาจหยิบยกเรื่องแบบพิธีของสัญญาขึ้นมาวินิจฉัยยกฟ้องเอง เพราะเป็นการวินิจฉัยนอกประเด็นที่จำเลยไม่ได้ยกขึ้นต่อสู้ไว้ (<b>ฎ.5290/2537</b>)</p>
      <p>หากคำให้การของจำเลยขัดแย้งกันเอง เช่น ตอนแรกอ้างว่าที่ดินเป็นของตนเองเพราะซื้อมา แต่ตอนหลังกลับสู้ว่าโจทก์ถูกแย่งการครอบครองเกิน 1 ปีจึงไม่มีอำนาจฟ้อง ซึ่งขัดกันในตัวเอง จำเลยสามารถแก้ไขได้โดยการสละข้อต่อสู้ที่ขัดแย้งนั้นทิ้งไปในชั้นชี้สองสถาน เมื่อสละประเด็นเรื่องกรรมสิทธิ์ออกไปแล้ว เหลือเพียงประเด็นเรื่องระยะเวลาฟ้องคดีเพียงอย่างเดียว ความขัดแย้งก็หมดไป คำให้การส่วนที่เหลือจึงชอบด้วยกฎหมายและดำเนินคดีต่อไปได้ (<b>ฎ.7082/2544</b>) ในส่วนของการตรวจคำให้การ ศาลตรวจด้วยหลักเกณฑ์ตามมาตรา 18 เช่นเดียวกับการตรวจคำฟ้อง หากศาลสั่งไม่รับคำให้การ คู่ความอุทธรณ์คำสั่งได้ทันทีตามมาตรา 228 โดยไม่ต้องโต้แย้งไว้ก่อน ส่วนบุคคลภายนอกที่ถูกหมายเรียกเข้ามาเป็นจำเลยร่วมตามมาตรา 57(3) ก็ต้องทำคำให้การของตนเองเช่นกัน เพราะมีสถานะเสมือนถูกฟ้องเข้ามาใหม่ ตั้งประเด็นต่อสู้ใหม่ได้อย่างอิสระ ต่างจากจำเลยร่วมตามมาตรา 57(2) ที่ต้องผูกพันตามคำให้การเดิมของคู่ความฝ่ายที่ตนเข้าร่วม</p>`},
    {heading:"2ข. ⭐ ฟ้องแย้ง ม.177 ว.3, 178",
     html:`
      <p><b>ฟ้องแย้ง</b>ถือเป็น "คำฟ้อง" ชนิดหนึ่งที่จำเลยฟ้องกลับโจทก์ในคดีเดียวกันเพื่อความสะดวกและประหยัด จึงต้องอยู่ภายใต้หลักเกณฑ์เรื่องคำฟ้องทั้งหมด เช่น จำเลยต้องมีอำนาจฟ้องตามมาตรา 55 และต้องเสียค่าขึ้นศาลตามทุนทรัพย์ในฟ้องแย้งด้วย เงื่อนไขสำคัญที่สุดคือฟ้องแย้งต้อง "เกี่ยวกับฟ้องเดิม" พอที่จะรวมพิจารณาเข้าด้วยกันได้ เช่น สัญญาเดียวกันหรือทรัพย์สินเดียวกัน หากเป็นเรื่องอื่นที่ไม่เกี่ยวข้องกัน ศาลจะสั่งไม่รับฟ้องแย้งและให้ไปฟ้องเป็นคดีใหม่แยกต่างหาก เช่น กรณีฟ้องขับไล่ตามสัญญาเช่า แต่จำเลยฟ้องแย้งเรียกค่าเสียหายจากการดัดแปลงตึกซึ่งเป็นเรื่องละเมิดคนละประเด็น (<b>ฎ.474/2517</b>) แต่ถ้าเกี่ยวเนื่องกันจริง เช่น ซื้อขายที่ดินแปลงเดียวกัน ก็รับไว้ได้ (<b>ฎ.933/2540</b>)</p>
      <p>ฟ้องแย้งที่แท้จริงต้องเป็นการเสนอข้อหาใหม่ที่กระทบสิทธิหรือหน้าที่ของโจทก์นอกเหนือไปจากผลของคำฟ้องเดิม หากจำเลยเพียงให้การว่าสัญญากู้เป็นโมฆะแล้วขอถือเป็นฟ้องแย้งให้เพิกถอนสัญญาด้วย กรณีนี้ผลของการวินิจฉัยว่าสัญญาเป็นโมฆะก็ทำให้โจทก์บังคับชำระหนี้ไม่ได้อยู่แล้วตามคำให้การปกติ ไม่ได้ก่อผลทางกฎหมายใหม่ใด ๆ แก่โจทก์ คำขอเช่นนี้จึงมีสภาพเป็นเพียงคำให้การ ไม่ใช่ฟ้องแย้ง (<b>ฎ.5520/2542</b>)</p>
      <p>ผู้มีสิทธิฟ้องแย้งคือจำเลยหรือบุคคลที่จำเลยมอบหมาย รวมถึงจำเลยร่วมตามมาตรา 57(3) ที่ถูกหมายเรียกเข้ามาด้วย แต่จำเลยร่วมตามมาตรา 57(2) ฟ้องแย้งไม่ได้ เพราะไม่มีสิทธิดีไปกว่าจำเลยเดิมที่ตนเข้าร่วม ผู้ถูกฟ้องแย้งได้คือโจทก์เดิมเท่านั้น จำเลยจะฟ้องแย้งไปยังจำเลยด้วยกันหรือบุคคลภายนอกไม่ได้ เมื่อฟ้องแย้งแล้วจำเลยมีหน้าที่เสียค่าธรรมเนียมและนำส่งหมายเรียกให้โจทก์ หากเพิกเฉยก็ถือว่าทิ้งฟ้องแย้งได้เช่นกัน และเมื่อโจทก์ได้รับแล้วต้องทำคำให้การแก้ฟ้องแย้งภายใน 15 วันตามมาตรา 178 นอกจากนี้แม้ฟ้องเดิมจะถูกจำหน่ายคดีไปในภายหลัง ฟ้องแย้งก็ยังมีผลอยู่ต่อไป เพราะมีสถานะเป็นคำฟ้องอิสระที่มีคู่ความครบถ้วนในตัวเอง เพียงแต่นำมารวมพิจารณาด้วยกันเพื่อความสะดวกเท่านั้น</p>
      <div class="examBox"><div class="exlabel">📝 โจทย์ฝึกจากหลักในคำบรรยาย</div>
        <div class="exq">โจทก์ฟ้องขับไล่จำเลยออกจากตึกแถวโดยอ้างว่าสัญญาเช่าครบกำหนดแล้ว จำเลยให้การต่อสู้ว่าสัญญาเช่ายังไม่ครบกำหนด และฟ้องแย้งเรียกค่าเสียหาย 200,000 บาท อ้างว่าเมื่อปีก่อนโจทก์ขับรถยนต์โดยประมาทชนรถของจำเลยเสียหาย ซึ่งเป็นคนละเหตุการณ์กับสัญญาเช่าโดยสิ้นเชิง ดังนี้ ศาลจะรับฟ้องแย้งของจำเลยไว้พิจารณารวมกับฟ้องเดิมได้หรือไม่</div>
        <div class="exsrc">โจทย์ฝึกอิงหลักความเกี่ยวพันของฟ้องแย้งกับฟ้องเดิม</div>
        <button type="button" class="examToggle" onclick="toggleExamAns('exam-pleading-1')">🔎 ดูเฉลย</button>
        <div class="examAns" id="exam-pleading-1"><span class="exanslabel">✅ แนวคำตอบ</span><p>ศาลรับฟ้องแย้งของจำเลยไว้พิจารณารวมกับฟ้องเดิมไม่ได้ เพราะฟ้องแย้งต้อง "เกี่ยวกับฟ้องเดิม" พอที่จะรวมการพิจารณาและชี้ขาดตัดสินเข้าด้วยกันได้ ฟ้องเดิมเป็นเรื่องขับไล่ตามสัญญาเช่าตึกแถว ประเด็นอยู่ที่สัญญาเช่าครบกำหนดหรือไม่ ส่วนฟ้องแย้งเป็นเรื่องละเมิดจากอุบัติเหตุทางรถยนต์เมื่อปีก่อน ซึ่งเป็นคนละมูลเหตุ คนละข้อเท็จจริง และคนละประเด็นแห่งคดีกันโดยสิ้นเชิง ไม่มีความเกี่ยวพันกับฟ้องเดิมเลย ศาลจึงต้องสั่งไม่รับฟ้องแย้งส่วนนี้ และให้จำเลยไปฟ้องเป็นคดีใหม่แยกต่างหากแทน แต่ส่วนคำให้การต่อสู้ว่าสัญญาเช่ายังไม่ครบกำหนดยังคงเป็นคำให้การที่ชอบและศาลต้องรับไว้พิจารณาตามปกติ</p></div>
      </div>`},
    {heading:"3. การแก้ไขคำคู่ความ ม.179-180",
     html:`
      <p>การขอแก้ไขคำคู่ความต้องทำก่อนวันสืบพยานไม่น้อยกว่า 7 วัน เว้นแต่เป็นเรื่องความสงบเรียบร้อยของประชาชนหรือข้อผิดหลงเล็กน้อย จึงจะยื่นเกินกำหนดได้ หลุมพรางสำคัญคือ "โมฆะ" และ "ฟ้องซ้อน" ซึ่งเกี่ยวพันกับอำนาจฟ้องโดยตรง ถือเป็นความสงบเรียบร้อยของประชาชนแก้ไขได้เสมอ แต่ "โมฆียะ" "อายุความ" และ "ฟ้องเคลือบคลุม" ซึ่งกระทบเพียงรูปคดีของตนเอง ไม่ใช่ความสงบเรียบร้อยฯ จึงยื่นล่าช้าเกินกำหนดไม่ได้</p>`},
    {heading:"3ข. การทิ้งฟ้อง ม.174",
     html:`
      <p>หากโจทก์เพิกเฉยไม่ดำเนินคดี ศาลมีอำนาจสั่งจำหน่ายคดีในฐาน<b>ทิ้งฟ้อง</b>ได้ 2 กรณี คือไม่ร้องขอให้ส่งหมายเรียกแก่จำเลยภายใน 7 วันนับแต่วันยื่นฟ้อง หรือเพิกเฉยไม่ดำเนินคดีตามคำสั่งศาลภายในเวลาที่กำหนด หลักนี้ใช้กับฟ้องแย้งด้วยเช่นกัน กล่าวคือจำเลยในฐานะโจทก์ตามฟ้องแย้งมีหน้าที่ต้องนำส่งหมายเรียกฟ้องแย้งให้โจทก์เดิม หากเพิกเฉยก็ถือว่าทิ้งฟ้องแย้งเช่นเดียวกัน</p>`},
    {heading:"4. ถอนฟ้อง ม.175-176",
     html:`
      <p>หากโจทก์ขอถอนฟ้องก่อนที่จำเลยจะยื่นคำให้การ เพียงยื่นคำบอกกล่าวเป็นหนังสือ ศาลต้องอนุญาตเสมอ แต่หากเป็นการถอนฟ้องหลังจากจำเลยยื่นคำให้การแล้ว โจทก์ต้องทำเป็นคำร้อง และศาลต้องฟังความเห็นของจำเลยหรือผู้ร้องสอดก่อน โดยศาลมีดุลพินิจจะอนุญาตหรือไม่อนุญาตก็ได้ แม้จำเลยจะคัดค้านหรือไม่คัดค้านก็ตาม ส่วนกรณีคู่ความตกลงประนีประนอมยอมความกัน ศาลต้องอนุญาตให้ถอนฟ้องเสมอ</p>
      <p>การถอนฟ้องมีผลลบล้างผลของการยื่นฟ้องเดิม คู่ความกลับคืนสู่ฐานะเดิมเสมือนไม่เคยฟ้องกันมาก่อน โจทก์จึงฟ้องคดีใหม่ได้อีกภายในอายุความ แต่ต้องระวังว่าหากตกลงถอนฟ้องกันโดยไม่ได้ระบุเงื่อนไขให้ชัดเจนว่าจะไม่ฟ้องกันอีก โจทก์ก็ยังอาจนำคดีเดิมกลับมาฟ้องใหม่ได้ (<b>ฎ.268/2489</b>)</p>`},
    {heading:"5. การตรวจคำคู่ความของศาล (ม.18)",
     html:`
      <p>เจ้าหน้าที่ธุรการมีหน้าที่รับคำฟ้องไว้เสนอต่อศาลเสมอ ไม่มีอำนาจปฏิเสธไม่รับด้วยตนเอง เพราะอำนาจสั่งรับหรือไม่รับเป็นของศาลเท่านั้น โดยศาลจะตรวจ 4 ด้านหลัก คือความเรียบร้อยตามแบบพิมพ์ เอกสารแนบ <b>ค่าธรรมเนียมศาล</b> และเขตอำนาจศาล คำสั่งของศาลมี 3 แบบ คือ "รับ" เมื่อถูกต้องครบถ้วน "คืน" เพื่อให้ไปแก้ไข เช่น พิมพ์ผิด ลืมลงลายมือชื่อ หรือคำนวณค่าขึ้นศาลผิด หรือให้ไปยื่นที่ศาลซึ่งมีเขตอำนาจ และ "ไม่รับ" หากแก้ไขไม่ได้หรือสั่งให้แก้แล้วไม่ยอมแก้ หรือไม่มีอำนาจฟ้องมาตั้งแต่ต้น คำสั่งไม่รับคำคู่ความถือเป็นการปฏิเสธ อุทธรณ์หรือฎีกาได้ทันที</p>`},
    {heading:"6. ค่าฤชาธรรมเนียมและการขอยกเว้นค่าธรรมเนียมศาล (ม.149-161)",
     html:`
      <p><b>ค่าฤชาธรรมเนียม</b>ตามมาตรา 149 เป็นคำที่กินความกว้างที่สุด ครอบคลุมทั้งค่าธรรมเนียมศาล ค่าสืบพยานหลักฐานนอกศาล ค่าป่วยการและค่าพาหนะของพยาน ค่าทนายความ และค่าใช้จ่ายอื่นในการดำเนินคดี โดยกฎหมายกำหนดให้คู่ความผู้ยื่นคำฟ้องเป็นผู้ชำระค่าธรรมเนียมศาลที่เป็นค่าขึ้นศาลเมื่อยื่นคำฟ้อง สำหรับคดีมีทุนทรัพย์ตาม<b>มาตรา 150</b> ค่าขึ้นศาลคิดในอัตราร้อยละ 2 ของทุนทรัพย์ (ไม่เกิน 200,000 บาทสำหรับทุนทรัพย์ไม่เกิน 50 ล้านบาท) ส่วนที่เกิน 50 ล้านบาทคิดร้อยละ 0.1 เท่านั้น ในชั้นอุทธรณ์หรือฎีกาให้คิดจากทุนทรัพย์ที่ยังพิพาทกันในชั้นนั้นเท่านั้น หากผู้อุทธรณ์พอใจคำพิพากษาศาลล่างไปบางส่วนแล้วก็เสียค่าขึ้นศาลเฉพาะส่วนที่ยังติดใจต่อ ในแง่ความรับผิดชั้นที่สุดตาม<b>มาตรา 161</b> โดยหลักฝ่ายแพ้คดีต้องรับผิดค่าฤชาธรรมเนียมทั้งปวง แต่ศาลมีดุลพินิจสั่งเป็นอย่างอื่นได้ตามความสุจริตในการดำเนินคดี เช่น หากฝ่ายชนะประวิงคดีเพื่อหวังผลประโยชน์จากดอกเบี้ยผิดนัดในอัตราสูง ศาลอาจสั่งให้ฝ่ายชนะเป็นผู้รับผิดค่าฤชาธรรมเนียมแทนได้</p>
      <p>สำหรับ<b>การขอยกเว้นค่าธรรมเนียมศาล</b> (หรือที่เรียกกันแต่เดิมว่า "ขออนาถา") ตาม<b>มาตรา 155</b> เป็นสิทธิของคู่ความทุกฝ่ายทั้งโจทก์และจำเลยในทุกชั้นศาล โดยต้องยื่นคำร้องต่อศาลชั้นต้นเสมอแม้จะเป็นคดีในชั้นอุทธรณ์หรือฎีกาก็ตาม พร้อมกับคำฟ้อง คำให้การ หรือคำร้องสอด ผู้ร้องต้องแสดงให้เห็นว่าตนไม่มีทรัพย์สินเพียงพอ หรือหากต้องจ่ายจะได้รับความเดือดร้อนเกินสมควรเมื่อพิจารณาถึงสถานะของตน และหากผู้ร้องเป็นโจทก์ ต้องแสดงด้วยว่าคดีมีเหตุผลอันสมควรที่จะฟ้อง เมื่อศาลอนุญาตแล้วตาม<b>มาตรา 157</b> ผู้นั้นไม่ต้องเสียค่าธรรมเนียมศาลในศาลนั้น รวมถึงเงินวางศาลในการยื่นอุทธรณ์หรือฎีกาด้วย แต่ผลจะจำกัดเฉพาะศาลชั้นที่อนุญาตเท่านั้น ไม่ขยายไปถึงศาลสูงโดยอัตโนมัติ ต้องยื่นขอใหม่เป็นรายชั้นศาล และไม่มีผลย้อนหลังไปคืนเงินที่จ่ายไปแล้วก่อนคำสั่งอนุญาต หากศาลยกคำร้องหรืออนุญาตเพียงบางส่วน ผู้ร้องมีสิทธิอุทธรณ์คำสั่งได้ภายใน 7 วันเท่านั้น และหากปรากฏภายหลังว่าผู้ที่ได้รับยกเว้นประพฤติตนไม่เรียบร้อย เช่น ก่อความรำคาญหรือจงใจประวิงคดี ศาลมีอำนาจถอนการอนุญาตได้ทุกเมื่อตาม<b>มาตรา 160</b> โดยมีผลเฉพาะกระบวนพิจารณาในอนาคตเท่านั้น</p>
      <div class="examBox"><div class="exlabel">📝 โจทย์ฝึกจากหลักในคำบรรยาย</div>
        <div class="exq">นางสมศรีมีที่ดินมรดกอยู่ 1 แปลงมูลค่า 3 ล้านบาท แต่ไม่มีเงินสด ประสงค์จะฟ้องเรียกค่าเสียหายจากอุบัติเหตุทางรถยนต์จำนวน 500,000 บาท จึงยื่นคำร้องขอยกเว้นค่าธรรมเนียมศาลพร้อมคำฟ้อง อ้างว่าตนไม่มีเงินสด มีเพียงที่ดินซึ่งขายไม่ได้ในเวลาอันสั้น ศาลชั้นต้นไต่สวนแล้วเห็นว่าคดีมีเหตุผลอันสมควรฟ้องจริง จึงอนุญาตให้ยกเว้นค่าธรรมเนียมศาล ต่อมาศาลชั้นต้นพิพากษายกฟ้องนางสมศรี นางสมศรีประสงค์จะอุทธรณ์ ให้ท่านวินิจฉัยว่านางสมศรีต้องยื่นคำร้องขอยกเว้นค่าธรรมเนียมศาลใหม่ในชั้นอุทธรณ์อีกหรือไม่ และหากต้องยื่นใหม่ ศาลอุทธรณ์ต้องไต่สวนซ้ำในประเด็นใดบ้าง</div>
        <div class="exsrc">โจทย์ฝึกอิงหลักการยกเว้นค่าธรรมเนียมศาล ม.155-157</div>
        <button type="button" class="examToggle" onclick="toggleExamAns('exam-pleading-2')">🔎 ดูเฉลย</button>
        <div class="examAns" id="exam-pleading-2"><span class="exanslabel">✅ แนวคำตอบ</span><p>นางสมศรีต้องยื่นคำร้องขอยกเว้นค่าธรรมเนียมศาลใหม่ในชั้นอุทธรณ์ เพราะผลของการได้รับยกเว้นตามมาตรา 157 จำกัดอยู่เฉพาะศาลชั้นที่ศาลมีคำสั่งอนุญาตเท่านั้น ไม่ขยายไปถึงศาลสูงโดยอัตโนมัติ อย่างไรก็ตาม เมื่อนางสมศรีเคยได้รับยกเว้นในศาลชั้นต้นมาแล้ว กฎหมายให้ข้อสันนิษฐานว่าฐานะความยากจนหรือความเดือดร้อนของนางสมศรียังคงมีอยู่ต่อเนื่อง ศาลอุทธรณ์จึงไม่จำต้องไต่สวนเรื่อง "สถานะทางทรัพย์สิน" ซ้ำอีก เว้นแต่จะปรากฏว่าฐานะเปลี่ยนแปลงไป แต่ศาลอุทธรณ์ยังคงต้องพิจารณาไต่สวนในประเด็นเรื่อง "เหตุผลอันสมควร" ของการยื่นอุทธรณ์ครั้งนี้ใหม่เสมอ เพราะเป็นคนละส่วนกับเรื่องความยากจน และต้องพิจารณาเป็นการเฉพาะไปในแต่ละชั้นศาลว่าการอุทธรณ์ครั้งนี้มีเหตุผลสมควรจริงหรือไม่</p></div>
      </div>`},

    {heading:"1. ขาดนัดยื่นคำให้การ (ม.197-199ตรี)",
     html:`
      <p>หากจำเลยไม่ยื่น<b>คำให้การ</b>ภายใน 15 วัน โจทก์ต้องยื่นคำขอให้ศาลชนะคดีภายใน 15 วันถัดไปตาม<b>มาตรา 198</b> มิฉะนั้นศาลจะสั่งจำหน่ายคดี เมื่อโจทก์ยื่นคำขอแล้ว ศาลจะพิจารณาว่าคำฟ้องนั้น "มีมูลและไม่ขัดต่อกฎหมาย" หรือไม่ตาม<b>มาตรา 198 ทวิ</b> สำหรับคดีพิเศษบางประเภท เช่น คดีเกี่ยวกับสิทธิสภาพบุคคล คดีครอบครัว คดีเกี่ยวกับอสังหาริมทรัพย์ หรือหนี้ที่ไม่แน่นอน ศาลต้องสืบพยานโจทก์ฝ่ายเดียวก่อนจึงจะพิพากษาได้ จะพิพากษาตามคำขอทันทีโดยไม่สืบพยานเลยไม่ได้</p>
      <p>จำเลยที่มายื่นคำให้การล่าช้าต้องมาศาลในโอกาสแรกและแจ้งความประสงค์จะต่อสู้คดีตามหลักเกณฑ์ใน<b>มาตรา 199</b> มิฉะนั้นศาลมีอำนาจปฏิเสธไม่รับคำให้การนั้นได้ และหากศาลพิพากษาให้โจทก์ชนะคดีไปแล้ว จำเลยยังมีสิทธิยื่นคำร้อง<b>ขอให้พิจารณาคดีใหม่</b>ได้ภายใน 15 วันนับแต่วันที่ได้รับการส่งคำบังคับตาม<b>มาตรา 199 ตรี</b> โดยคำร้องต้องกล่าวโดยละเอียดชัดแจ้งทั้งเหตุที่ขาดนัดยื่นคำให้การและข้อคัดค้านคำตัดสินชี้ขาดของศาลที่แสดงให้เห็นว่าหากพิจารณาใหม่ตนอาจเป็นฝ่ายชนะคดีได้ ทั้งสองส่วนขาดอย่างใดอย่างหนึ่งไม่ได้</p>
      <div class="examBox"><div class="exlabel">📝 โจทย์ฝึกจากหลักในคำบรรยาย</div>
        <div class="exq">โจทก์ฟ้องจำเลยให้ชำระหนี้กู้ยืม 500,000 บาท ศาลส่งหมายเรียกและสำเนาคำฟ้องให้จำเลยโดยชอบแล้ว จำเลยไม่ยื่นคำให้การภายในกำหนด โจทก์ยื่นคำขอให้ศาลพิพากษาชนะคดีตามมาตรา 198 ทวิ ภายในเวลาที่กฎหมายกำหนด ศาลไต่สวนแล้วเห็นว่าคำฟ้องมีมูลและไม่ขัดกฎหมาย จึงพิพากษาให้จำเลยชำระหนี้ตามฟ้อง ต่อมาเจ้าพนักงานบังคับคดีเข้ายึดทรัพย์จำเลย จำเลยจึงเพิ่งทราบว่าตนแพ้คดี เพราะช่วงที่ถูกฟ้องจำเลยได้ย้ายภูมิลำเนาไปทำงานต่างจังหวัดโดยไม่ได้แจ้งเปลี่ยนภูมิลำเนาไว้ จำเลยยื่นคำร้องขอพิจารณาคดีใหม่ทันทีที่ทราบเรื่อง โดยอ้างว่าตนไม่เคยกู้เงินโจทก์ตามฟ้องเลย ดังนี้ คำร้องขอพิจารณาคดีใหม่ของจำเลยชอบด้วยกฎหมายหรือไม่</div>
        <div class="exsrc">โจทย์ฝึกอิงหลักมาตรา 199, 199 ตรี</div>
        <button type="button" class="examToggle" onclick="toggleExamAns('exam-summary-1')">🔎 ดูเฉลย</button>
        <div class="examAns" id="exam-summary-1"><span class="exanslabel">✅ แนวคำตอบ</span><p>คำร้องของจำเลยชอบด้วยกฎหมาย เพราะเข้าองค์ประกอบครบถ้วนตามมาตรา 199 ตรี ประการแรก จำเลยไม่เคยได้รับโอกาสให้พิจารณาคดีนี้ใหม่มาก่อน ประการที่สอง กำหนดเวลายื่นคำร้อง 15 วันเริ่มนับแต่วันที่ "พฤติการณ์นอกเหนือไม่อาจบังคับได้" สิ้นสุดลง มิใช่นับแต่วันที่ศาลมีคำพิพากษา เมื่อจำเลยไม่ทราบเรื่องถูกฟ้องเพราะย้ายภูมิลำเนาไปแล้วโดยสุจริต จนกระทั่งถูกยึดทรัพย์จึงทราบว่าแพ้คดี พฤติการณ์นอกเหนือไม่อาจบังคับได้จึงเพิ่งสิ้นสุดลงในวันที่ถูกยึดทรัพย์ การที่จำเลยยื่นคำร้องทันทีจึงอยู่ในกำหนด 15 วัน ประการสุดท้าย เนื้อหาคำร้องต้องมีทั้งเหตุที่ขาดนัด (ย้ายภูมิลำเนาโดยไม่ทราบว่าถูกฟ้อง) และข้อคัดค้านคำพิพากษาที่แสดงว่าตนอาจชนะคดีได้ (อ้างว่าไม่เคยกู้เงินโจทก์) ซึ่งจำเลยมีครบทั้งสองส่วน คำร้องจึงชอบด้วยมาตรา 199 ตรี ศาลต้องรับคำร้องไว้พิจารณาและแจ้งให้เจ้าพนักงานบังคับคดีทราบเพื่อระงับการบังคับคดีไว้ก่อน</p></div>
      </div>`},
    {heading:"2. ขาดนัดพิจารณา (ม.200-207)",
     html:`
      <p>หากคู่ความไม่มาศาลในวันสืบพยานนัดแรก ถือเป็นการ<b>ขาดนัดพิจารณา</b> ส่วนการไม่มาในนัดถัดไปเพียงทำให้เสียสิทธิเฉพาะในนัดนั้นเท่านั้น หากโจทก์ไม่มาศาลตาม<b>มาตรา 202</b> ศาลจะสั่งจำหน่ายคดี เว้นแต่จำเลยจะขอให้ดำเนินการพิจารณาต่อไป ซึ่งศาลจะวินิจฉัยตามภาระการพิสูจน์ที่แท้จริง ไม่ใช่ให้จำเลยชนะคดีโดยอัตโนมัติเพียงเพราะโจทก์ไม่มา ส่วนกรณีจำเลยไม่มาศาลตาม<b>มาตรา 204</b> และ<b>206</b> ศาลจะสืบพยานโจทก์ไปฝ่ายเดียว โดยจำเลยเสียสิทธิซักค้านพยานเท่านั้น มิใช่แพ้คดีโดยอัตโนมัติเช่นกัน</p>
      <p>การมาสายเกินไปโดยไม่แจ้งเหตุถือว่าขาดนัด แต่หากมอบฉันทะให้เสมียนทนายมายื่นคำร้องหรือฟังคำสั่งแทน ถือว่าได้มาศาลแล้ว เพียงแต่เสียสิทธิในการซักค้านพยานเฉพาะนัดนั้นเท่านั้น และหากคู่ความมี 2 ฐานะพร้อมกัน เช่น เป็นทั้งจำเลยเดิมและโจทก์ฟ้องแย้ง การไม่มาศาลในวันสืบพยานจะถือเป็นการขาดนัดในทั้งสองฐานะพร้อมกันด้วย</p>
      <p>"<b>วันสืบพยาน</b>" ตามความหมายของกฎหมายหมายถึงวันเริ่มต้นทำนัดสืบพยานครั้งแรกเพียงวันเดียวเท่านั้น ไม่ว่าจะเริ่มสืบพยานฝ่ายใดก่อนก็ตาม หากมีการเลื่อนคดีอย่างถูกต้อง วันที่ถูกเลื่อนไปจะกลายเป็นวันสืบพยานแทนวันเดิม คู่ความต้องทราบวันนัดนี้โดยชอบมาก่อน เช่น ศาลกำหนดนัดไว้ตั้งแต่วันชี้สองสถานถือว่าทราบแล้ว และ "การไม่มาศาล" หมายถึงไม่ปรากฏตัวที่ห้องพิจารณาคดีตามเวลาที่ศาลกำหนด แม้จะมาศาลจริงแต่เดินผิดห้องจนเลยเวลา หรือมาช่วงบ่ายทั้งที่นัดช่วงเช้า ก็ถือว่าขาดนัดพิจารณาเช่นกัน คู่ความในที่นี้ครอบคลุมถึงทนายความ ผู้แทนโดยชอบธรรม หรือผู้รับมอบฉันทะที่ได้รับมอบหมายให้มาดำเนินการเกี่ยวกับการสืบพยานด้วย หากมีบุคคลเหล่านี้มาศาลแล้วไม่ถือว่าขาดนัด</p>
      <p>ผลของการขาดนัดพิจารณาแยกเป็น 3 กรณี คือ หากขาดนัดทั้งสองฝ่ายตาม<b>มาตรา 201</b> ศาลจะสั่งจำหน่ายคดีออกจากสารบบความ โจทก์มีสิทธินำคดีมาฟ้องใหม่ได้ภายใต้อายุความ แต่ห้ามอุทธรณ์คำสั่งจำหน่ายคดีนี้ หากโจทก์ขาดนัดฝ่ายเดียวตามมาตรา 202 ศาลจะสั่งจำหน่ายคดีเช่นกัน เว้นแต่จำเลยที่มาศาลจะแจ้งความประสงค์ให้ดำเนินคดีต่อไป ซึ่งหากจำเลยขอเช่นนั้น ศาลจะสืบพยานจำเลยไปฝ่ายเดียวและพิพากษาคดี อันอาจเป็นผลดีต่อจำเลยเพราะหากจำเลยชนะ โจทก์จะนำคดีมาฟ้องใหม่ไม่ได้เพราะเป็นฟ้องซ้ำ ส่วนหากจำเลยขาดนัดฝ่ายเดียวตามมาตรา 204 ศาลจะพิจารณาและชี้ขาดคดีไปฝ่ายเดียวโดยโจทก์ไม่ต้องแถลงขอให้ดำเนินคดีต่อแต่อย่างใด ทั้งนี้ตามมาตรา 206 ศาลจะพิพากษาให้ฝ่ายที่มาศาลชนะคดีได้ก็ต่อเมื่อข้ออ้างของฝ่ายนั้น "มีมูลและไม่ขัดต่อกฎหมาย" เท่านั้น ไม่ใช่ว่าอีกฝ่ายขาดนัดแล้วฝ่ายที่มาศาลจะชนะโดยอัตโนมัติ</p>
      <p>ทางแก้ของผู้ขาดนัดพิจารณาแบ่งเป็น 2 ช่วง หากมาศาล "ก่อน" ศาลมีคำพิพากษาตามมาตรา 206 ผู้ขาดนัดต้องแจ้งต่อศาลใน "โอกาสแรก" ที่มาถึงว่าประสงค์จะดำเนินคดี หากศาลไต่สวนแล้วเห็นว่าไม่ได้จงใจขาดนัดและไม่เคยขอพิจารณาคดีใหม่มาก่อน ศาลจะสั่งให้พิจารณาคดีใหม่ทั้งหมด แต่หากไม่แจ้งในโอกาสแรกจะเสียสิทธิคัดค้านหรือถามค้านพยานหลักฐานที่อีกฝ่ายสืบไปแล้วเท่านั้น ส่วนกรณีมาขอ "หลัง" จากศาลมีคำพิพากษาให้แพ้คดีตามมาตรา 207 ให้นำหลักเกณฑ์การขอพิจารณาคดีใหม่ของการขาดนัดยื่นคำให้การ (มาตรา 199 จัตวา-199 เบญจ) มาใช้บังคับโดยอนุโลม คือต้องยื่นภายใน 15 วันนับแต่ได้รับคำบังคับ โดยบรรยายเหตุที่ขาดนัดและข้อคัดค้านคำพิพากษาที่แสดงว่าตนอาจชนะคดีได้ ซึ่งหากศาลอนุญาตให้พิจารณาคดีใหม่ คำสั่งนั้นเป็นที่สุด แต่หากไม่อนุญาต ผู้ขอยังอุทธรณ์คำสั่งนั้นต่อศาลอุทธรณ์ได้</p>
      <div class="examBox"><div class="exlabel">📝 โจทย์ฝึกจากหลักในคำบรรยาย</div>
        <div class="exq">ในวันนัดสืบพยานโจทก์นัดแรก โจทก์มาศาลตรงเวลา แต่จำเลยไปผิดห้องพิจารณาจนมาถึงห้องที่ถูกต้องช้ากว่ากำหนด 40 นาที ศาลได้เริ่มกระบวนพิจารณาโดยถือว่าจำเลยขาดนัดพิจารณาไปแล้วตามมาตรา 204 และดำเนินการสืบพยานโจทก์ฝ่ายเดียว จำเลยเดินเข้าห้องพิจารณาทันทีที่ทราบว่าตนมาผิดห้อง และแจ้งต่อศาลทันทีว่าประสงค์จะดำเนินคดีต่อ ดังนี้ จำเลยจะขอให้ศาลพิจารณาคดีใหม่ทั้งหมดตามมาตรา 206 ได้หรือไม่</div>
        <div class="exsrc">โจทย์ฝึกอิงหลักมาตรา 204, 206</div>
        <button type="button" class="examToggle" onclick="toggleExamAns('exam-summary-2')">🔎 ดูเฉลย</button>
        <div class="examAns" id="exam-summary-2"><span class="exanslabel">✅ แนวคำตอบ</span><p>กรณีนี้ต้องแยกพิจารณา 2 ประเด็น ประเด็นแรกคือจำเลยตกเป็นผู้ขาดนัดพิจารณาจริงตามมาตรา 204 เพราะการไม่มาปรากฏตัวที่ห้องพิจารณาคดีตามเวลาที่ศาลกำหนด แม้จะมีเหตุผลอย่างไรก็ยังถือเป็นการขาดนัด กฎหมายไม่ได้ยกเว้นกรณีมาผิดห้อง ประเด็นที่สองคือจำเลยแจ้งความประสงค์ขอดำเนินคดีต่อในโอกาสแรกที่มาถึงจริงตามมาตรา 206 เมื่อศาลไต่สวนแล้วเห็นว่าจำเลยไม่ได้จงใจขาดนัด (เป็นเพียงความผิดพลาดเรื่องห้อง ไม่ใช่การหลีกเลี่ยงจงใจ) และจำเลยไม่เคยขอพิจารณาคดีใหม่ในคดีนี้มาก่อน ศาลจึงมีอำนาจสั่งให้พิจารณาคดีใหม่ทั้งหมดได้ตามมาตรา 206 กล่าวคือต้องสืบพยานโจทก์ที่สืบไปแล้วใหม่อีกครั้งเพื่อให้จำเลยมีโอกาสถามค้านได้เต็มที่ แต่หากจำเลยมาถึงห้องพิจารณาแล้วไม่รีบแจ้งศาลทันทีในโอกาสแรก กลับปล่อยเวลาผ่านไปก่อน จำเลยจะเสียสิทธิขอพิจารณาคดีใหม่ทั้งหมด เหลือเพียงสิทธิถามค้านพยานที่สืบไปแล้วในนัดต่อ ๆ ไปเท่านั้น</p></div>
      </div>`},
    {heading:"3. คดีมโนสาเร่ (ม.189-195) และไม่มีข้อยุ่งยาก (ม.196)",
     html:`
      <p>คดีที่มี<b>ทุนทรัพย์</b>ไม่เกิน 300,000 บาท หรือคดีฟ้องขับไล่ที่มีค่าเช่าไม่เกิน 30,000 บาทต่อเดือน ถือเป็น<b>คดีมโนสาเร่</b> ซึ่งฟ้องด้วยวาจาได้ และใช้นัดเดียวรวมทั้งการไกล่เกลี่ย การยื่นคำให้การ และการสืบพยานเข้าด้วยกัน ส่วนคดีที่ฟ้องตามตั๋วเงินหรือสัญญาเป็นหนังสือซึ่งไม่มีข้อยุ่งยาก ก็สามารถใช้กระบวนพิจารณาแบบคดีมโนสาเร่ได้เช่นกันโดยไม่จำกัดจำนวนทุนทรัพย์</p>
      <p>ข้อที่ต้องระวังเป็นพิเศษคือนัดแรกของคดีมโนสาเร่เป็นวันไกล่เกลี่ย ยื่นคำให้การ และสืบพยานรวมกันในคราวเดียว จึงยังไม่เข้าสู่กระบวนขาดนัดยื่นคำให้การแบบคดีสามัญ หากคู่ความทั้งสองฝ่ายไม่มาในนัดนี้ ต้องปรับด้วยหลักขาดนัดพิจารณาตามมาตรา 200-201 ไม่ใช่หลักขาดนัดยื่นคำให้การตามมาตรา 198 ทวิ ซึ่งเป็นจุดที่นักศึกษาสับสนบ่อยที่สุด</p>
      <p>หลักจำง่าย ๆ ว่าคดีใดเป็น<b>คดีมีทุนทรัพย์</b>ให้ถามว่า "ฟ้องแล้วโจทก์รวยขึ้นหรือไม่" หากศาลพิพากษาตามคำขอแล้วโจทก์ได้ทรัพย์สินหรือเงินมาเป็นของตนเพิ่มขึ้น ถือเป็นคดีมีทุนทรัพย์ แต่หากเป็นเพียงการเรียกคืนทรัพย์ที่ตนเป็นเจ้าของอยู่แล้ว เช่น ฟ้องเรียกคืนรถที่ให้ยืมไป ไม่ถือเป็นคดีมีทุนทรัพย์ การคำนวณทุนทรัพย์ให้ดูจากคำขอท้ายฟ้องเป็นหลัก โดยห้ามนำดอกเบี้ยที่ยังไม่ถึงกำหนดชำระ (ดอกเบี้ยในอนาคต) และค่าธรรมเนียมศาลมารวมคำนวณด้วยเด็ดขาด หากมีจำเลยหลายคนและมูลความแห่งคดีแบ่งแยกความรับผิดได้เฉพาะตัว ให้คิดทุนทรัพย์แยกเป็นรายคน แต่ถ้าเป็นหนี้ร่วมต้องนำมาบวกรวมกันเป็นก้อนเดียว ส่วนการตีราคาทรัพย์สินที่มีข้อโต้แย้งกัน ศาลจะกะประมาณตามสภาพที่เป็นอยู่ "ในเวลายื่นฟ้องคดี" ไม่ใช่ราคาขณะทำสัญญา</p>
      <p>ความพิเศษของวิธีพิจารณาคดีมโนสาเร่ได้แก่ ค่าขึ้นศาลจำกัดเพดานสูงสุดในศาลชั้นต้นไว้ไม่เกิน 1,000 บาทตาม<b>มาตรา 190 จัตวา</b> คำฟ้องและคำให้การทำด้วยวาจาต่อศาลได้โดยศาลช่วยแนะนำและสั่งแก้ไขให้ถูกต้อง และในวันนัดพิจารณาศาลใช้ระบบไต่สวนเชิงรุก คือศาลเป็นผู้ซักถามพยานก่อนแล้วจึงให้คู่ความซักถามเพิ่มเติมได้ตาม<b>มาตรา 193 ตรี</b> เลื่อนคดีได้ครั้งละไม่เกิน 7 วัน และเมื่อพิจารณาเสร็จศาลอ่านคำพิพากษาด้วยวาจาได้ทันทีตาม<b>มาตรา 193 จัตวา</b></p>
      <p>ส่วน<b>คดีไม่มีข้อยุ่งยาก</b>ตาม<b>มาตรา 196</b> คือคดีที่มีคำขอให้ชำระเงินจำนวนแน่นอนตามตั๋วเงิน (เช่น เช็คที่ธนาคารปฏิเสธการจ่าย) หรือตามสัญญาเป็นหนังสือที่ดูเบื้องต้นแล้วสมบูรณ์และบังคับได้ โดยไม่จำกัดเพดานทุนทรัพย์เลย จะฟ้องเรียกหลักล้านหรือพันล้านก็ได้ แต่หากมีคำขออื่นปะปนมานอกเหนือจากหนี้เงิน จะกลายเป็นคดียุ่งยากทันที โจทก์ต้องยื่นคำร้องขอให้ศาลพิจารณาคดีนี้อย่างคดีไม่มีข้อยุ่งยาก หากศาลอนุญาตจะนำวิธีพิจารณาคดีมโนสาเร่มาใช้ทั้งหมด ยกเว้นเรื่องเดียวคือเพดานค่าขึ้นศาล 1,000 บาทตามมาตรา 190 จัตวา จะไม่นำมาใช้ ยังคงต้องเสียค่าขึ้นศาลตามอัตราปกติ</p>
      <div class="examBox"><div class="exlabel">📝 โจทย์ฝึกจากหลักในคำบรรยาย</div>
        <div class="exq">โจทก์ฟ้องเรียกให้จำเลยชำระเงินตามเช็คที่ธนาคารปฏิเสธการจ่ายเงิน จำนวน 2,000,000 บาท พร้อมยื่นคำร้องขอให้ศาลพิจารณาคดีนี้อย่างคดีไม่มีข้อยุ่งยากตามมาตรา 196 ศาลไต่สวนแล้วเห็นว่าเช็คสมบูรณ์และบังคับได้จริง จึงมีคำสั่งอนุญาต ดังนี้ คดีนี้จะต้องเสียค่าขึ้นศาลจำกัดเพดานไม่เกิน 1,000 บาทตามมาตรา 190 จัตวาเช่นเดียวกับคดีมโนสาเร่หรือไม่ เพราะเหตุใด</div>
        <div class="exsrc">โจทย์ฝึกอิงหลักคดีไม่มีข้อยุ่งยาก ม.196</div>
        <button type="button" class="examToggle" onclick="toggleExamAns('exam-summary-3')">🔎 ดูเฉลย</button>
        <div class="examAns" id="exam-summary-3"><span class="exanslabel">✅ แนวคำตอบ</span><p>คดีนี้ไม่ได้รับเพดานค่าขึ้นศาล 1,000 บาทตามมาตรา 190 จัตวา แม้ศาลจะมีคำสั่งอนุญาตให้นำวิธีพิจารณาคดีไม่มีข้อยุ่งยากมาใช้ตามมาตรา 196 ก็ตาม เพราะกฎหมายกำหนดให้นำวิธีพิจารณาของคดีมโนสาเร่มาใช้บังคับกับคดีไม่มีข้อยุ่งยากเพียงบางส่วนเท่านั้น โดยยกเว้นมาตรา 190 จัตวาเรื่องเพดานค่าขึ้นศาลไว้เป็นการเฉพาะ เหตุผลเพราะคดีไม่มีข้อยุ่งยากไม่จำกัดเพดานทุนทรัพย์เหมือนคดีมโนสาเร่ที่จำกัดไว้ไม่เกิน 300,000 บาท หากให้เสียค่าขึ้นศาลเพียง 1,000 บาทสำหรับคดีที่มีทุนทรัพย์สูงถึง 2,000,000 บาท ย่อมไม่เป็นธรรมและขัดกับหลักการเก็บค่าธรรมเนียมตามสัดส่วนทุนทรัพย์ คดีนี้จึงยังต้องเสียค่าขึ้นศาลตามอัตราปกติของคดีแพ่งสามัญ ไม่ใช่เพดาน 1,000 บาท</p></div>
      </div>`},
    {heading:"4. การดำเนินกระบวนพิจารณาทั่วไปและละเมิดอำนาจศาล (ม.21-33)",
     html:`
      <p><b>มาตรา 21</b> วางหลักการเสนอ "คำขอ" (ประสงค์ให้ศาลสั่งอนุญาต) และ "คำแถลง" (แจ้งข้อเท็จจริงหรือคัดค้าน) ต่อศาล ซึ่งทำได้ทั้งด้วยวาจาและเป็นหนังสือ โดยหลักศาลต้องเปิดโอกาสให้คู่ความอีกฝ่ายคัดค้านก่อนมีคำสั่งเสมอ เว้นแต่เป็น "คำขอฝ่ายเดียว" โดยเคร่งครัดที่กฎหมายห้ามฟังอีกฝ่ายเลย เช่น ขอหมายเรียกให้การ ขอยึดหรืออายัดทรัพย์สินก่อนพิพากษา หรือขอออกหมายจับ เพราะหากอีกฝ่ายรู้ตัวก่อนอาจยักย้ายถ่ายเททรัพย์สินหรือหลบหนีเสียก่อน ศาลยังมีอำนาจไต่สวนหาข้อเท็จจริงประกอบดุลพินิจได้เสมอไม่ว่าจะเป็นคำขอฝ่ายเดียวหรือไม่</p>
      <p><b>มาตรา 23</b> ให้อำนาจขยายหรือย่นระยะเวลาตามประมวลกฎหมายนี้ ระยะเวลาที่ศาลกำหนด หรือระยะเวลาตามกฎหมายอื่นที่เกี่ยวกับวิธีพิจารณาความแพ่ง แต่ห้ามขยายอายุความหรือระยะเวลาตามกฎหมายสารบัญญัติเด็ดขาด เงื่อนไขแยกเป็น 2 ช่วง คือหากขอ<b>ก่อนครบกำหนด</b>ต้องอ้าง "พฤติการณ์พิเศษ" ซึ่งเป็นเหตุจำเป็นที่ไม่ใช่ความบกพร่องของตนเอง เช่น เอกสารมากมหาศาลทำคำให้การไม่ทัน แต่หากขอ<b>หลังครบกำหนด</b>ต้องมี "เหตุสุดวิสัย" เท่านั้น และเหตุนั้นต้องเกิดขึ้นในช่วงที่ระยะเวลายังไม่สิ้นสุดเสียก่อน หากเหตุสุดวิสัยเกิดขึ้นหลังพ้นกำหนดไปแล้วจะนำมาอ้างขอขยายไม่ได้ตามแนว<b>ฎ.5923/2545</b> ศาลมีดุลพินิจอนุญาตหรือไม่ก็ได้ และจะให้ตามที่ขอ มากกว่า หรือน้อยกว่าที่ขอก็ได้</p>
      <p><b>มาตรา 24</b> เปิดช่อง "ทางลัด" ให้ศาลวินิจฉัยชี้ขาดเบื้องต้นในปัญหาข้อกฎหมายก่อนโดยไม่ต้องสืบพยาน หากวินิจฉัยแล้วคดีเสร็จไปได้ทั้งเรื่องหรือบางประเด็น เช่น ปัญหาอำนาจฟ้อง ฟ้องเคลือบคลุม ฟ้องซ้อน หรือฟ้องซ้ำ ซึ่งต้องเป็นปัญหาข้อกฎหมายเท่านั้น ไม่ใช่ข้อเท็จจริง หากคำวินิจฉัยทำให้คดีเสร็จไปทั้งเรื่อง คู่ความอุทธรณ์ได้ทันทีตามมาตรา 227, 228, 247 <b>มาตรา 26</b> กำหนดว่าหากคู่ความไม่พอใจคำสั่งศาลระหว่างพิจารณา เช่น ไม่อนุญาตให้เลื่อนคดี ต้อง "โต้แย้ง" คำสั่งนั้นไว้ก่อนเพื่อสงวนสิทธิอุทธรณ์ภายหลังตามมาตรา 226 หากไม่โต้แย้งถือว่ายอมรับและอุทธรณ์คำสั่งนั้นไม่ได้อีก</p>
      <p><b>มาตรา 27</b> ให้อำนาจเพิกถอนกระบวนพิจารณาที่ผิดระเบียบ เช่น ส่งหมายไม่ชอบ หรือนั่งพิจารณาไม่ครบองค์คณะ โดยคู่ความที่เสียหายต้องยื่นคำร้องก่อนศาลมีคำพิพากษา ภายใน 8 วันนับแต่ทราบเรื่อง และต้องไม่ได้ให้สัตยาบันการกระทำนั้นมาก่อน เช่น หากรู้ว่าส่งหมายผิดแต่ยังยื่นคำให้การสู้คดีต่อไป ถือว่าให้สัตยาบันแล้ว ยกเพิกถอนไม่ได้อีก</p>
      <p>ส่วน<b>ละเมิดอำนาจศาล</b>ตาม<b>มาตรา 30-33</b> ศาลมีอำนาจออกข้อกำหนดเพื่อความสงบเรียบร้อยในบริเวณศาล ผู้กระทำผิดเป็นใครก็ได้ ไม่จำกัดเฉพาะคู่ความ พฤติการณ์ความผิดครอบคลุมตั้งแต่ขัดขืนข้อกำหนดศาลหรือประพฤติตนไม่เรียบร้อยในบริเวณศาล ใช้หลักฐานเท็จขอยกเว้นค่าธรรมเนียมศาลจนศาลหลงเชื่ออนุญาตไปแล้ว จงใจหลบเลี่ยงไม่รับหมายหรือเอกสารศาล ตรวจหรือคัดถ่ายเอกสารในสำนวนโดยไม่ได้รับอนุญาตตามมาตรา 54 ไปจนถึงขัดขืนไม่มาศาลเมื่อศาลเรียก โทษคือไล่ออกจากบริเวณศาล จำคุกไม่เกิน 6 เดือน หรือปรับตามที่กฎหมายกำหนด ซึ่งไม่ใช่คดีอาญาปกติ ศาลสั่งลงโทษได้เองทันทีโดยไม่ต้องมีการสอบสวน และการกระทำเดียวอาจผิดทั้งละเมิดอำนาจศาลและกฎหมายอาญาไปพร้อมกันได้โดยไม่ถือเป็นการลงโทษซ้ำซ้อน</p>
      <div class="examBox"><div class="exlabel">📝 โจทย์ฝึกจากหลักในคำบรรยาย</div>
        <div class="exq">จำเลยต้องยื่นคำให้การภายในวันที่ 15 ของเดือน ปรากฏว่าวันที่ 14 จำเลยประสบอุบัติเหตุรถชนสาหัสจนหมดสติเข้า ICU และเพิ่งรู้สึกตัวฟื้นในวันที่ 20 จำเลยจึงยื่นคำร้องขอขยายระยะเวลายื่นคำให้การในวันที่ 21 โดยอ้างเหตุสุดวิสัย ต่อมามีจำเลยอีกคนหนึ่งในคดีอื่นประสบอุบัติเหตุลักษณะเดียวกันแต่เกิดขึ้นในวันที่ 17 (หลังครบกำหนดยื่นคำให้การไปแล้ว) แล้วมาขอขยายเวลาเช่นกัน จงวินิจฉัยว่าจำเลยทั้งสองรายจะขอขยายระยะเวลาโดยอ้างเหตุสุดวิสัยได้หรือไม่ เพราะเหตุใด</div>
        <div class="exsrc">โจทย์ฝึกอิงหลักมาตรา 23 และแนว ฎ.5923/2545</div>
        <button type="button" class="examToggle" onclick="toggleExamAns('exam-summary-4')">🔎 ดูเฉลย</button>
        <div class="examAns" id="exam-summary-4"><span class="exanslabel">✅ แนวคำตอบ</span><p>จำเลยรายแรกขอขยายระยะเวลาได้ เพราะเหตุสุดวิสัย (อุบัติเหตุจนหมดสติ) เกิดขึ้นในวันที่ 14 ซึ่งยังอยู่ในช่วงเวลาที่กำหนดยื่นคำให้การยังไม่สิ้นสุด (ครบกำหนดวันที่ 15) ตรงตามเงื่อนไขมาตรา 23 ที่ว่าเหตุสุดวิสัยต้องเกิดขึ้นก่อนหรือในช่วงที่ระยะเวลายังไม่สิ้นสุด แม้จะมายื่นคำร้องหลังพ้นกำหนดไปแล้ว (วันที่ 21) ก็ยังอ้างได้เพราะเข้าเงื่อนไขเรื่องช่วงเวลาเกิดเหตุ ส่วนจำเลยรายที่สองขอขยายระยะเวลาโดยอ้างเหตุสุดวิสัยไม่ได้ เพราะอุบัติเหตุเกิดขึ้นในวันที่ 17 ซึ่งพ้นกำหนดเวลายื่นคำให้การ (วันที่ 15) ไปแล้ว ตามแนวฎ.5923/2545 เหตุสุดวิสัยที่จะนำมาอ้างขอขยายเวลาหลังครบกำหนดได้ ต้องเป็นเหตุที่เกิดขึ้นในช่วงที่ระยะเวลายังไม่สิ้นสุดเท่านั้น เมื่อเหตุเกิดขึ้นภายหลังพ้นกำหนดไปแล้ว จึงไม่เข้าเงื่อนไขและไม่อาจนำมาอ้างขอขยายระยะเวลาได้อีก</p></div>
      </div>`},

  judgment: [
    {heading:"1. คำพิพากษา (ม.131-148)",
     html:`
      <p><b>มาตรา 132</b> ให้อำนาจศาลจำหน่ายคดีในกรณีที่กำหนด <b>มาตรา 138</b> ว่าด้วย<b>คำพิพากษาตามยอม</b> ซึ่งห้ามอุทธรณ์เว้นแต่จะขัดต่อความสงบเรียบร้อยของประชาชน <b>มาตรา 142</b> ห้ามศาลพิพากษาเกินคำขอ โดยมีข้อยกเว้นสำคัญคือคดีฟ้องขับไล่ ศาลพิพากษาให้มีผลถึง "บริวาร" ของจำเลยได้แม้ไม่ได้ระบุชื่อไว้ในคำขอ</p>
      <p><b>มาตรา 144</b> ห้าม<b>ดำเนินกระบวนพิจารณาซ้ำ</b>ในประเด็นเดียวกันที่ศาลได้วินิจฉัยถึงที่สุดแล้วในคดีเดียวกัน ซึ่งรวมถึงในชั้นบังคับคดีด้วย <b>มาตรา 148</b> ห้าม<b>ฟ้องซ้ำ</b> คือกรณีคู่ความเดิม ประเด็นเดิม และคดีก่อนถึงที่สุดไปแล้ว ส่วน<b>มาตรา 173</b> ห้าม<b>ฟ้องซ้อน</b> ซึ่งใช้เมื่อคดีก่อนยังค้างอยู่ระหว่างการพิจารณา โดยต้องพิจารณาว่า "ข้ออ้าง" ในคำฟ้องเป็นเรื่องเดียวกันจริงหรือไม่ หากข้ออ้างต่างกัน แม้จะเป็นทรัพย์แปลงเดียวกันก็ไม่ถือว่าเป็นฟ้องซ้อน</p>
      <p>หัวใจของ<b>ฟ้องซ้ำ</b>ตามมาตรา 148 อยู่ที่การถามว่าคดีแรก "ศาลได้วินิจฉัยประเด็นแห่งคดีไปแล้วหรือยัง" หากศาลยกฟ้องเพียงเพราะโจทก์ยังไม่มีอำนาจฟ้องตามมาตรา 55 โดยยังไม่ได้ลงไปวินิจฉัยเนื้อหาเลยว่าสัญญาใช้ได้หรือไม่ เมื่อโจทก์ไปแก้ไขจนมีอำนาจฟ้องแล้วย่อมฟ้องใหม่ได้ไม่เป็นฟ้องซ้ำตามแนว<b>ฎ.1225/2511</b> แต่ถ้าศาลได้ลงไปวินิจฉัยเนื้อหาจริงแล้ว แม้จะเป็นการวินิจฉัยตามคำท้าของคู่ความ (<b>ฎ.1007/2522</b> — ท้ากันเรื่องกรรมสิทธิ์ที่ดินแล้วแพ้ตามคำท้า ถือว่าศาลวินิจฉัยประเด็นกรรมสิทธิ์แล้ว) คำพิพากษาคดีขาดนัดยื่นคำให้การ (<b>ฎ.554/2532</b>) หรือกรณีพยานหลักฐานรับฟังไม่ได้เพราะเอกสารไม่ติดอากรแสตมป์ (<b>ฎ.1220/2495</b>) ก็ถือว่าศาลวินิจฉัยเนื้อหาไปแล้วทั้งสิ้น นำมาฟ้องใหม่ไม่ได้ นอกจากนี้หากโจทก์มีสิทธิเรียกร้องได้เต็มจำนวนตั้งแต่คดีแรกแต่กลับเรียกไม่ครบ เช่น เรียกค่าเสียหายจากการทำนาไม่ได้เพียง 1 ปีทั้งที่เรียกค่าเสียหายในอนาคตได้ตั้งแต่ต้น (<b>ฎ.2588/2518</b>) การมาฟ้องเรียกส่วนที่เหลือในคดีใหม่ก็ถือเป็นฟ้องซ้ำเช่นกัน ส่วนการพิจารณาว่า "เหตุอย่างเดียวกัน" หรือไม่นั้น ต้องดูที่มูลเหตุแห่งการเรียกร้อง ไม่ใช่แค่ตัวทรัพย์สินที่พิพาท เช่น คดีแรกอ้างสิทธิจากสัญญาจะซื้อจะขายแต่แพ้เพราะลายมือชื่อผู้ขายปลอม คดีหลังมาฟ้องบุกรุกโดยอ้างความเป็นเจ้าของจากสัญญาฉบับเดิมอีกก็เป็นฟ้องซ้ำ (<b>ฎ.26/2514</b>) แต่หากคดีหลังอาศัยมูลเหตุใหม่ที่ศาลยังไม่เคยวินิจฉัย เช่น คดีแรกอ้างสิทธิทางมรดกแล้วแพ้ คดีหลังเปลี่ยนมาอ้างสิทธิทางครอบครองปรปักษ์ (<b>ฎ.545/2513</b>) หรือคดีแรกยกฟ้องขับไล่เพราะยังไม่ได้บอกเลิกสัญญาเช่า ต่อมาบอกเลิกสัญญาอย่างถูกต้องแล้วจึงฟ้องขับไล่ใหม่ (<b>ฎ.1259/2516</b>) กรณีเหล่านี้ไม่เป็นฟ้องซ้ำเพราะเป็นคนละมูลเหตุกับที่ศาลเคยชี้ขาด ผลของฟ้องซ้ำคือศาลยกฟ้องได้เองแม้คู่ความจะไม่ยกขึ้นต่อสู้ เพราะเป็นปัญหาข้อกฎหมายอันเกี่ยวด้วยความสงบเรียบร้อยของประชาชนตามมาตรา 142(5)</p>
      <p>ข้อยกเว้นที่ไม่ถือเป็นฟ้องซ้ำมี 3 กรณีตามมาตรา 148 วรรคท้าย ได้แก่ กระบวนพิจารณาชั้นบังคับคดี เช่น คดีร้องขัดทรัพย์ คำพิพากษาที่กำหนดวิธีการชั่วคราวซึ่งเปลี่ยนแปลงแก้ไขได้ตามพฤติการณ์ เช่น ค่าเสียหายฐานละเมิดต่อเนื่อง และคำพิพากษายกฟ้องโดยไม่ตัดสิทธิโจทก์ฟ้องใหม่ เช่น ยกฟ้องเพราะฟ้องผิดศาล ส่วน<b>ดำเนินกระบวนพิจารณาซ้ำ</b>ตามมาตรา 144 เป็นหลักที่กว้างกว่าฟ้องซ้ำมาก เพราะครอบคลุมการกระทำทุกอย่างในศาล ไม่ใช่แค่การฟ้องคดีใหม่ และไม่จำเป็นต้องรอให้คดีถึงที่สุดก่อน เพียงศาลเคยมีคำวินิจฉัยชี้ขาดประเด็นนั้นไปแล้วก็ห้ามทำซ้ำทันที ข้อยกเว้นที่ทำได้ ได้แก่ การขอแก้ไขข้อผิดพลาดเล็กน้อยตามมาตรา 143 การขอพิจารณาคดีใหม่กรณีขาดนัด การอุทธรณ์ฎีกา และการบังคับคดี</p>
      <div class="examBox"><div class="exlabel">📝 โจทย์ฝึกจากหลักในคำบรรยาย</div>
        <div class="exq">คดีแรกโจทก์ฟ้องขอให้ศาลบังคับจำเลยจดทะเบียนโอนที่ดินตามสัญญาจะซื้อจะขาย ศาลพิพากษายกฟ้องเพราะฟังว่าลายมือชื่อผู้ขายในสัญญาไม่ใช่ลายมือชื่อที่แท้จริงของจำเลย คดีถึงที่สุด ต่อมาโจทก์มาฟ้องคดีใหม่ว่าจำเลยบุกรุกเข้ามาในที่ดินแปลงเดียวกันนี้ โดยอ้างว่าตนเป็นเจ้าของที่ดินตามสัญญาซื้อขายฉบับเดิมนั่นเอง จงวินิจฉัยว่าคดีหลังเป็นฟ้องซ้ำต้องห้ามตามมาตรา 148 หรือไม่</div>
        <div class="exsrc">โจทย์ฝึกอิงแนว ฎ.26/2514</div>
        <button type="button" class="examToggle" onclick="toggleExamAns('exam-judgment-2')">🔎 ดูเฉลย</button>
        <div class="examAns" id="exam-judgment-2"><span class="exanslabel">✅ แนวคำตอบ</span><p>คดีหลังเป็นฟ้องซ้ำต้องห้ามตามมาตรา 148 เพราะเข้าองค์ประกอบครบถ้วน คือคู่ความเดียวกัน คดีก่อนถึงที่สุดแล้ว และเป็นการวินิจฉัยโดยอาศัยเหตุอย่างเดียวกัน แม้รูปคำฟ้องคดีหลังจะเปลี่ยนจากการฟ้องบังคับให้โอนที่ดินมาเป็นการฟ้องบุกรุก แต่มูลเหตุที่โจทก์อ้างว่าตนมีสิทธิในที่ดินก็ยังคงอาศัยสัญญาจะซื้อจะขายฉบับเดิมที่ศาลได้วินิจฉัยไปแล้วว่าลายมือชื่อผู้ขายปลอม ไม่ใช่ลายมือชื่อที่แท้จริงของจำเลย เมื่อศาลคดีแรกได้ชี้ขาดไปแล้วว่าสัญญาฉบับนี้ใช้ยันจำเลยไม่ได้ โจทก์ย่อมไม่มีสิทธิใด ๆ ในที่ดินตามสัญญานั้นอีก การนำเหตุแห่งการอ้างสิทธิเดิมกลับมาฟ้องใหม่ในรูปคดีบุกรุกจึงเป็นการรื้อร้องในประเด็นเดียวกันโดยอาศัยเหตุอย่างเดียวกันกับคดีก่อน ต้องห้ามเป็นฟ้องซ้ำตามมาตรา 148 ศาลยกฟ้องได้เองแม้จำเลยจะไม่ได้ยกขึ้นต่อสู้ เพราะเป็นปัญหาความสงบเรียบร้อยของประชาชน</p></div>
      </div>`},
    {heading:"2. นัดพร้อม ไกล่เกลี่ย และชี้สองสถาน (ม.19-20ตรี, 182-183ทวิ)",
     html:`
      <p>หลังยื่นคำฟ้องและคำให้การครบถ้วนแล้ว ศาลจะกำหนด "วันนัดพร้อม" เป็นนัดแรกที่คู่ความมาศาลเพื่อไกล่เกลี่ยตาม<b>มาตรา 19-20</b> เหตุที่นิยมไกล่เกลี่ยในวันนี้เพราะคู่ความยังไม่เห็นพยานหลักฐานของอีกฝ่าย โอกาสตกลงกันจึงสูงกว่าช่วงสืบพยานไปแล้ว ตาม<b>มาตรา 20 ทวิ</b> ศาลอาจสั่งให้ไกล่เกลี่ยเป็นการลับเฉพาะต่อหน้าตัวความ โดยให้ทนายความออกจากห้องได้ เพราะทนายความมักมองแง่กฎหมายและผลลัพธ์เลวร้ายที่สุดจนคู่ความไม่กล้าตัดสินใจ และอาจตั้ง<b>ผู้ประนีประนอม</b>ซึ่งเป็นผู้เชี่ยวชาญเฉพาะด้าน เช่น วิศวกรหรือแพทย์ มาช่วยไกล่เกลี่ยแทนได้ หากไกล่เกลี่ยสำเร็จ ควรเลือกให้ศาลมี<b>คำพิพากษาตามยอม</b>ตามมาตรา 138 มากกว่าการถอนฟ้อง เพราะหากอีกฝ่ายผิดสัญญาภายหลัง สามารถนำคำพิพากษาไปบังคับคดีได้ทันทีโดยไม่ต้องฟ้องใหม่ หากไกล่เกลี่ยสำเร็จเพียงบางส่วน ศาลจะบันทึกข้อตกลงไว้ในรายงานกระบวนพิจารณาเพื่อตัดทอนประเด็นที่เหลือให้กระชับขึ้น</p>
      <p><b>มาตรา 20 ตรี</b> เป็นกฎหมายที่เพิ่มเข้ามาปี 2563 เปิดช่องให้คู่พิพาทร้องขอให้ศาลแต่งตั้งผู้ประนีประนอมมาไกล่เกลี่ยได้ก่อนฟ้องคดี โดยไม่ต้องเสียค่าขึ้นศาล จุดสำคัญคือต้องอาศัย<b>ความสมัครใจ</b>ของอีกฝ่ายล้วน ๆ ศาลไม่มีอำนาจบังคับให้เข้าร่วม หากตกลงกันได้และประสงค์ให้ศาลพิพากษาตามยอม ต้องยื่นคำร้องแสดง "เหตุผลความจำเป็น" เสมอ และศาลต้องตรวจสอบเจตนาที่แท้จริงของคู่สัญญาอย่างเข้มงวด เพื่อป้องกันไม่ให้ใช้เป็นเครื่องมือหลีกเลี่ยงกฎหมายหรือทำให้บุคคลภายนอกเสียหาย เช่น ลูกหนี้แอบทำยอมความกับเจ้าหนี้ปลอมเพื่อโอนทรัพย์สินหนี หากการไกล่เกลี่ยไม่สำเร็จ กฎหมายคุ้มครองอายุความโดยขยายออกไปอีก 60 วันนับแต่วันที่การไกล่เกลี่ยสิ้นสุดลง เฉพาะกรณีอายุความสิ้นสุดไปแล้วหลังยื่นคำร้อง หรือเหลืออายุความไม่ถึง 60 วัน</p>
      <p>หากไกล่เกลี่ยไม่สำเร็จ ศาลจะดำเนินการ<b>ชี้สองสถาน</b>ตาม<b>มาตรา 182</b> เพื่อกำหนดประเด็นข้อพิพาทและหน้าที่นำสืบจากคำฟ้องและคำให้การที่โต้แย้งกัน โดยต้องแจ้งวันนัดล่วงหน้าไม่น้อยกว่า 15 วัน เว้นแต่เข้าข้อยกเว้น 6 กรณีที่งดการชี้สองสถานได้ ได้แก่ จำเลยขาดนัดยื่นคำให้การ จำเลยยอมรับตามฟ้องทั้งหมด จำเลยปฏิเสธโดยไม่มีเหตุแห่งการปฏิเสธ คดีมโนสาเร่หรือคดีไม่มีข้อยุ่งยาก หรือศาลเห็นว่าวินิจฉัยชี้ขาดได้เลยโดยไม่ต้องสืบพยาน ในวันชี้สองสถานตาม<b>มาตรา 183</b> ศาลจะตรวจคำคู่ความและสอบถามคู่ความ ข้อเท็จจริงที่ยอมรับกันเป็นอันยุติไป ส่วนที่โต้แย้งกันและเกี่ยวเนื่องกับประเด็นให้กำหนดเป็นประเด็นข้อพิพาท คู่ความมีสิทธิคัดค้านประเด็นที่ศาลกำหนดได้ภายใน 7 วัน แต่ตาม<b>มาตรา 183 ทวิ</b> หากคู่ความฝ่ายใดไม่มาศาลในวันนี้ ให้ถือว่าทราบกระบวนพิจารณาแล้วและไม่มีสิทธิคัดค้าน เว้นแต่มีเหตุจำเป็นอันไม่อาจก้าวล่วงได้ หรือเป็นการคัดค้านในปัญหาเกี่ยวกับความสงบเรียบร้อยของประชาชน</p>
      <div class="examBox"><div class="exlabel">📝 โจทย์ฝึกจากหลักในคำบรรยาย</div>
        <div class="exq">ก่อนฟ้องคดี นายเอกยื่นคำร้องต่อศาลขอให้แต่งตั้งผู้ประนีประนอมไกล่เกลี่ยหนี้เงินกู้กับนายโท ตามมาตรา 20 ตรี ศาลสอบถามนายโทแล้วนายโทไม่ยินยอมเข้าร่วมไกล่เกลี่ย ศาลจึงยกคำร้อง ต่อมาอีก 40 วัน นายเอกจึงนำเรื่องมาฟ้องนายโทเป็นคดี ปรากฏว่าอายุความเรียกหนี้เงินกู้ดังกล่าวได้สิ้นสุดลงไปแล้วตั้งแต่ก่อนนายเอกยื่นคำร้องขอไกล่เกลี่ย 5 วัน ดังนี้ นายเอกจะยกอายุความมาตรา 20 ตรี วรรคท้าย ขึ้นต่อสู้ข้อต่อสู้เรื่องฟ้องขาดอายุความของนายโทได้หรือไม่</div>
        <div class="exsrc">โจทย์ฝึกอิงหลักมาตรา 20 ตรี วรรคท้าย</div>
