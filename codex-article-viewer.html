<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>มาตรา - ประมวลกฎหมาย</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Thai:wght@500;600;700;900&family=Sarabun:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<script src="tts-helper.js"></script>
<style>
:root {
  --paper: #FBF9F4;
  --card: #FFFFFF;
  --ink: #22283A;
  --ink-soft: #5A6072;
  --ink-faint: #9AA0B0;
  --line: #E5E1D6;
  --gold: #B08A3C;
  --accent: #2E4A7A;
  --ok: #1E7A4F;
  --bad: #B23A3A;
  --radius: 14px;
  --shadow: 0 1px 2px rgba(34,40,58,.05), 0 6px 20px rgba(34,40,58,.07);
}

/* ============ THEME: DARK ============ */
:root[data-theme="dark"]{
  --paper:#14161f;
  --card:#1c2030;
  --ink:#E9E7E1;
  --ink-soft:#A9AEC2;
  --ink-faint:#6C7188;
  --line:#2E3348;
  --gold:#E0BD73;
  --accent:#84A6E8;
  --ok:#4FCB8D;
  --bad:#E2685F;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 24px rgba(0,0,0,.45);
}

/* ============ THEME: HORROR (กระสือ mode) ============ */
:root[data-theme="horror"]{
  --paper:#0A070C;
  --card:#151019;
  --ink:#D9D2C9;
  --ink-soft:#9C8F93;
  --ink-faint:#5C5460;
  --line:#2B1F26;
  --gold:#8F1F2B;
  --accent:#4A8F5C;
  --ok:#3F7A4F;
  --bad:#FF3355;
  --shadow:0 1px 2px rgba(0,0,0,.6),0 10px 28px rgba(0,0,0,.6);
}

/* Surfaces that used hardcoded near-white hex instead of a CSS var —
   normalize them under dark/horror with a subtle translucent overlay. */
:root[data-theme="dark"] .topbar,
:root[data-theme="horror"] .topbar{ background:var(--card); border-bottom-color:var(--line); }
:root[data-theme="dark"] body{
  background:radial-gradient(1200px 500px at 50% -200px,#232840 0%,transparent 60%),var(--paper);
}
:root[data-theme="horror"] body{
  background:radial-gradient(1200px 500px at 50% -220px,rgba(90,20,30,.35) 0%,transparent 60%),var(--paper);
}
:root[data-theme="dark"] .breadcrumb,
:root[data-theme="dark"] .article-body,
:root[data-theme="dark"] .icon-btn,
:root[data-theme="dark"] .note-input,
:root[data-theme="dark"] .case-summary,
:root[data-theme="dark"] .example-scenario,
:root[data-theme="dark"] .related-link,
:root[data-theme="dark"] .chapter-audio-active,
:root[data-theme="horror"] .breadcrumb,
:root[data-theme="horror"] .article-body,
:root[data-theme="horror"] .icon-btn,
:root[data-theme="horror"] .note-input,
:root[data-theme="horror"] .case-summary,
:root[data-theme="horror"] .example-scenario,
:root[data-theme="horror"] .related-link,
:root[data-theme="horror"] .chapter-audio-active{
  background:rgba(255,255,255,.04);
}
:root[data-theme="dark"] .note-input:focus,
:root[data-theme="horror"] .note-input:focus{background:rgba(255,255,255,.07)}
:root[data-theme="dark"] .nav-btn:hover,
:root[data-theme="horror"] .nav-btn:hover{background:rgba(255,255,255,.04)}
:root[data-theme="dark"] .related-link:hover,
:root[data-theme="horror"] .related-link:hover{background:var(--accent);color:var(--paper)}

/* THEME TOGGLE */
.theme-toggle{
  display:flex;gap:3px;margin-left:auto;background:var(--card);
  border:1px solid var(--line);border-radius:999px;padding:3px;
}
.theme-toggle button{
  border:none;background:transparent;border-radius:999px;width:28px;height:28px;
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  font-size:14px;transition:all .2s;font-family:inherit;
}
.theme-toggle button.active{background:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.theme-toggle button:hover{background:var(--line)}

/* กระสือ COMPANION (horror mode only) */
.krasue-companion{
  position:fixed;right:16px;bottom:16px;width:100px;height:auto;
  pointer-events:none;opacity:0;transform:translateY(8px);
  transition:opacity .5s ease,transform .5s ease;z-index:999;
  filter:drop-shadow(0 0 16px rgba(180,20,40,.45));
  animation:krasue-float 3.4s ease-in-out infinite;
}
.krasue-companion.visible{opacity:1;transform:translateY(0)}
@keyframes krasue-float{
  0%,100%{transform:translateY(0) rotate(-1.5deg)}
  50%{transform:translateY(-10px) rotate(1.5deg)}
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; }
body {
  font-family: 'Sarabun', system-ui, sans-serif;
  background: radial-gradient(1200px 500px at 50% -200px, #F2EDDF 0%, transparent 60%), var(--paper);
  color: var(--ink);
  min-height: 100vh;
  font-size: 16px;
  line-height: 1.75;
}

h1, h2, h3 { font-family: 'Noto Serif Thai', serif; }

.topbar {
  display: flex;
  align-items: center;
  gap: 10px;
  background: #EFEAE0;
  border-bottom: 1px solid var(--line);
  padding: 10px 18px;
  font-size: 13px;
  color: var(--ink-soft);
  position: sticky;
  top: 0;
  z-index: 100;
}

.wrap { max-width: 900px; margin: 0 auto; padding: 20px 18px 60px; }

.back-button {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  color: var(--accent);
  font-weight: 600;
  font-size: 14px;
  text-decoration: none;
  margin-bottom: 20px;
  transition: all .2s;
}
.back-button:hover { transform: translateX(-4px); }

/* BREADCRUMB */
.breadcrumb {
  font-size: 12px;
  color: var(--ink-faint);
  margin-bottom: 20px;
  padding: 12px;
  background: #F9F7F2;
  border-radius: 6px;
  border-left: 3px solid var(--gold);
}

/* ARTICLE HEADER */
.article-header {
  background: var(--card);
  border: 2px solid var(--line);
  border-radius: var(--radius);
  padding: 28px;
  margin-bottom: 24px;
  box-shadow: var(--shadow);
}

.article-number {
  font-family: 'JetBrains Mono', monospace;
  font-size: 48px;
  font-weight: 900;
  color: var(--accent);
  margin-bottom: 8px;
}

.article-subtitle {
  font-size: 14px;
  color: var(--ink-soft);
  margin-bottom: 20px;
  padding-bottom: 20px;
  border-bottom: 1px dashed var(--line);
}

.article-body {
  font-size: 16px;
  line-height: 1.8;
  color: var(--ink);
  background: #FEFDFB;
  padding: 20px;
  border-radius: 8px;
  border-left: 4px solid var(--gold);
  margin-bottom: 20px;
}

.warak-row {
  display: grid;
  grid-template-columns: 84px 1fr;
  gap: 14px;
  align-items: baseline;
}

.warak-row + .warak-row {
  margin-top: 14px;
  padding-top: 14px;
  border-top: 1px dashed var(--line);
}

.warak-label {
  color: var(--gold);
  font-weight: 700;
  font-size: 13px;
  white-space: nowrap;
}

.warak-text {
  white-space: pre-line;
}

.matra-ref-link {
  color: var(--accent);
  text-decoration: underline;
  text-decoration-style: dotted;
  text-underline-offset: 2px;
  font-weight: 600;
}
.matra-ref-link:hover { color: var(--gold); }

/* HEADER TOP ACTIONS (print) */
.article-header-top {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 12px;
}

.icon-btn {
  background: #F5F3F0;
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 6px 10px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  color: var(--ink);
  transition: all .2s;
  white-space: nowrap;
  font-family: inherit;
}
.icon-btn:hover { background: var(--card); border-color: var(--gold); }

/* PERSONAL NOTE */
.article-note { margin-top: 20px; }
.note-input {
  width: 100%;
  min-height: 70px;
  resize: vertical;
  border: 1px dashed var(--ink-faint);
  border-radius: 8px;
  background: #FBFAF6;
  color: var(--ink);
  font-family: inherit;
  font-size: 13px;
  padding: 10px 12px;
  line-height: 1.6;
}
.note-input::placeholder { color: var(--ink-faint); }
.note-input:focus { outline: none; border-color: var(--gold); background: #fff; }

#print-area { display: none; }
@media print {
  body.printing-one > *:not(#print-area) { display: none !important; }
  body.printing-one #print-area { display: block !important; padding: 24px; }
}

/* CHAPTER READ-ALOUD */
.chapter-audio-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: var(--accent);
  color: white;
  border: none;
  padding: 8px 12px;
  border-radius: 6px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  font-family: inherit;
  transition: all .2s;
}
.chapter-audio-btn:hover { background: #1d3a5a; }

.chapter-audio-active {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px;
  padding: 10px 14px;
  background: #F2F6FC;
  border: 1px solid var(--accent);
  border-radius: 8px;
}

.chapter-now-reading {
  font-size: 13px;
  font-weight: 700;
  color: var(--accent);
}

.chapter-audio-active button {
  background: var(--accent);
  color: white;
  border: none;
  padding: 6px 10px;
  border-radius: 6px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  font-family: inherit;
}
.chapter-audio-active button:hover { background: #1d3a5a; }

/* AUDIO CONTROLS */
.audio-control {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 16px;
  background: var(--ok-bg);
  border: 1px solid var(--ok);
  border-radius: 8px;
  margin-bottom: 20px;
}

.audio-control button {
  display: flex;
  align-items: center;
  gap: 6px;
  background: var(--ok);
  color: white;
  border: none;
  padding: 8px 12px;
  border-radius: 6px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  font-family: inherit;
  transition: all .2s;
}

.audio-control button:hover { background: #177047; }

/* TABS */
.tabs {
  display: flex;
  gap: 6px;
  margin-bottom: 20px;
  border-bottom: 2px solid var(--line);
  overflow-x: auto;
}

.tab-btn {
  padding: 12px 16px;
  background: transparent;
  border: none;
  border-bottom: 3px solid transparent;
  font-size: 14px;
  font-weight: 600;
  color: var(--ink-soft);
  cursor: pointer;
  transition: all .2s;
  white-space: nowrap;
  font-family: inherit;
}

.tab-btn:hover {
  color: var(--ink);
}

.tab-btn.active {
  color: var(--accent);
  border-bottom-color: var(--accent);
}

.tab-content {
  display: none;
}

.tab-content.active {
  display: block;
  animation: fadeIn .3s;
}

@keyframes fadeIn {
  from { opacity: .8; }
  to { opacity: 1; }
}

/* CASE LAW SECTION */
.case-item {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 16px;
  margin-bottom: 12px;
  border-left: 4px solid var(--bad);
}

.case-number {
  font-family: 'JetBrains Mono', monospace;
  font-weight: 700;
  color: var(--bad);
  font-size: 13px;
  margin-bottom: 6px;
}

.case-title {
  font-size: 14px;
  font-weight: 600;
  color: var(--ink);
  margin-bottom: 8px;
}

.case-summary {
  font-size: 13px;
  color: var(--ink-soft);
  line-height: 1.7;
  margin-bottom: 10px;
  padding: 10px;
  background: #FEFDFB;
  border-radius: 4px;
}

.case-action {
  font-size: 12px;
  margin-top: 10px;
  padding-top: 10px;
  border-top: 1px dashed var(--line);
}

.case-link {
  color: var(--accent);
  font-weight: 600;
  text-decoration: none;
}

.case-link:hover {
  text-decoration: underline;
}

/* EXAMPLE SECTION */
.example-item {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 16px;
  margin-bottom: 12px;
  border-left: 4px solid var(--ok);
}

.example-title {
  font-size: 14px;
  font-weight: 600;
  color: var(--ok);
  margin-bottom: 8px;
}

.example-scenario {
  font-size: 13px;
  color: var(--ink);
  background: #F0F9F6;
  padding: 10px;
  border-radius: 4px;
  margin-bottom: 8px;
  border-left: 2px solid var(--ok);
}

.example-explanation {
  font-size: 13px;
  color: var(--ink-soft);
  line-height: 1.7;
}

/* EMPTY STATE */
.empty-section {
  text-align: center;
  padding: 40px 20px;
  color: var(--ink-faint);
}

.empty-section .icon {
  font-size: 32px;
  margin-bottom: 12px;
}

/* NAVIGATION */
.article-nav {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-top: 32px;
  padding-top: 24px;
  border-top: 1px solid var(--line);
}

.nav-btn {
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding: 12px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 8px;
  text-decoration: none;
  color: inherit;
  transition: all .2s;
  cursor: pointer;
}

.nav-btn:hover {
  border-color: var(--gold);
  box-shadow: var(--shadow);
  background: #FEFDFB;
}

.nav-label {
  font-size: 11px;
  color: var(--ink-faint);
  text-transform: uppercase;
  letter-spacing: .05em;
}

.nav-title {
  font-weight: 600;
  color: var(--ink);
}

/* RELATED ARTICLES */
.related-articles {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 20px;
  margin-top: 32px;
}

.related-articles h3 {
  font-size: 16px;
  margin-bottom: 16px;
  color: var(--ink);
}

.related-list {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
  gap: 8px;
}

.related-link {
  padding: 8px;
  background: #F5F3F0;
  border: 1px solid var(--line);
  border-radius: 6px;
  text-align: center;
  text-decoration: none;
  color: var(--accent);
  font-weight: 600;
  font-size: 13px;
  transition: all .2s;
}

.related-link:hover {
  background: var(--accent);
  color: white;
}

/* MOBILE */
@media (max-width: 640px) {
  .article-header { padding: 18px; }
  .article-number { font-size: 36px; }
  .tabs { flex-wrap: wrap; }
  .article-nav { grid-template-columns: 1fr; }
}
</style>
</head>

<script>
// Apply the persisted theme as early as possible to avoid a flash of the
// wrong theme (light/dark/horror shared across codex pages via localStorage).
(function(){
  try {
    var t = localStorage.getItem('codex-theme');
    if (t === 'dark' || t === 'horror') document.documentElement.setAttribute('data-theme', t);
  } catch(e){}
})();
</script>

<div class="topbar">
  <span style="font-weight:800; color:var(--ink);">📚 Cool Uncle</span>
  <span style="color:var(--ink-faint)">·</span>
  <span>ประมวลกฎหมาย</span>
  <div class="theme-toggle" role="group" aria-label="เลือกธีม">
    <button type="button" data-theme-btn="light" onclick="setTheme('light')" onmouseenter="playHoverSound()" title="โหมดสว่าง">☀️</button>
    <button type="button" data-theme-btn="dark" onclick="setTheme('dark')" onmouseenter="playHoverSound()" title="โหมดมืด">🌙</button>
    <button type="button" data-theme-btn="horror" onclick="setTheme('horror')" onmouseenter="playHoverSound()" title="โหมดสยองขวัญ">👻</button>
  </div>
</div>

<div class="wrap">
  
  <a href="codex-search.html" class="back-button">← ค้นหาต่อ</a>

  <!-- BREADCRUMB -->
  <div class="breadcrumb" id="breadcrumb">
    📍 กำลังโหลด...
  </div>

  <!-- ARTICLE HEADER -->
  <article class="article-header" id="article-card">
    <div class="article-header-top">
      <div>

        <div id="article-cancelled-badge"></div>

    <!-- ARTICLE TEXT -->
    <div class="article-body" id="article-text">

    </div>

  <!-- TABS -->
  <div class="tabs">

    <button class="tab-btn" onclick="switchTab('related', this)">🔗 มาตราที่เกี่ยวข้อง</button>

  <!-- TAB: OVERVIEW -->
  <div id="tab-overview" class="tab-content active">
    <div style="background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px;">
      <h3 style="margin-bottom: 16px;">📖 ข้อมูลมาตรา</h3>

      <div id="overview-meta" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px;"></div>

      <div id="overview-keywords" style="margin-top: 20px; padding-top: 20px; border-top: 1px dashed var(--line);"></div>

  <!-- TAB: CASE LAW -->
  <div id="tab-caselaw" class="tab-content">
    <div id="caselaw-container"></div>

  <!-- TAB: EXAMPLES -->
  <div id="tab-examples" class="tab-content">

  <!-- TAB: RELATED -->
  <div id="tab-related" class="tab-content">
    <div class="related-articles">
      <h3>🔗 มาตราที่มีคำสำคัญร่วมกัน</h3>

  </div>

  <!-- ARTICLE NAVIGATION -->
  <div class="article-nav" id="article-nav"></div>

</div>

<script>
/* ================================================================
   ARTICLE VIEWER - LIVE VERSION
   Loads codex-data.json, reads ?id=civil_276 from the URL
   ================================================================ */

/* ================================================================
   HOVER SOUND (Web Audio API blip) — same implementation as index.html
   and the rest of the site, for consistency.
   ================================================================ */
let __hbAudioCtx;
function playHoverSound(){
  try{
    __hbAudioCtx = __hbAudioCtx || new (window.AudioContext||window.webkitAudioContext)();
    const c = __hbAudioCtx;
    if(c.state === 'suspended') c.resume();
    const t0 = c.currentTime;
    const osc = c.createOscillator(), gain = c.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(880, t0);
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(0.05, t0+0.008);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0+0.09);
    osc.connect(gain); gain.connect(c.destination);
    osc.start(t0); osc.stop(t0+0.1);
  }catch(e){}
}

/* ================================================================
   THEME SYSTEM (light / dark / horror) — shared via localStorage
   key "codex-theme" with codex-search.html.
   ================================================================ */
const THEME_KEY = 'codex-theme';

function setTheme(theme){
  if (theme === 'light') {
    document.documentElement.removeAttribute('data-theme');
  } else {
    document.documentElement.setAttribute('data-theme', theme);
  }
  try { localStorage.setItem(THEME_KEY, theme); } catch(e){}
  updateThemeToggleUI(theme);
  if (theme !== 'horror') hideKrasue(true);
}

function updateThemeToggleUI(theme){
  document.querySelectorAll('.theme-toggle button').forEach(b => {
    b.classList.toggle('active', b.dataset.themeBtn === theme);
  });
}

/* ================================================================
   กระสือ (Krasue) COMPANION — horror mode only, appears while typing
   in the personal note textarea.
   ================================================================ */
let krasueEl = null;
let krasueTimer = null;

function ensureKrasueEl(){
  if (krasueEl) return krasueEl;
  const img = document.createElement('img');
  img.src = 'pics/krasue-companion.png';
  img.alt = '';
  img.setAttribute('aria-hidden', 'true');
  img.className = 'krasue-companion';
  document.body.appendChild(img);
  krasueEl = img;
  return img;
}

function showKrasue(){
  if (document.documentElement.getAttribute('data-theme') !== 'horror') return;
  const el = ensureKrasueEl();
  el.classList.add('visible');
  clearTimeout(krasueTimer);
  krasueTimer = setTimeout(() => { el.classList.remove('visible'); }, 1800);
}

function hideKrasue(){
  clearTimeout(krasueTimer);
  if (krasueEl) krasueEl.classList.remove('visible');
}

// Delegated listener catches the note textarea (and any future typed
// input) without needing to rebind after each article load.
document.addEventListener('input', (e) => {
  const t = e.target;
  if (!t) return;
  if (t.classList && t.classList.contains('note-input')) {
    showKrasue();
  }
});

const BOOK_TITLES = {
  civil: 'ประมวลกฎหมายแพ่งและพาณิชย์',
  criminal: 'ประมวลกฎหมายอาญา',
  civpro: 'ประมวลกฎหมายวิธีพิจารณาความแพ่ง',
  crimpro: 'ประมวลกฎหมายวิธีพิจารณาความอาญา',
  constitution: 'พระธรรมนูญศาลยุติธรรม',
  adminproc: 'พระราชบัญญัติวิธีปฏิบัติราชการทางปกครอง',
  admincourt: 'พระราชบัญญัติจัดตั้งศาลปกครองและวิธีพิจารณาคดีปกครอง',
  const2560: 'รัฐธรรมนูญแห่งราชอาณาจักรไทย พุทธศักราช 2560',
};

let codexData = null;
let currentBookType = null;
let currentNumber = null;

const THAI_DIGIT_WORDS = ['', 'หนึ่ง', 'สอง', 'สาม', 'สี่', 'ห้า', 'หก', 'เจ็ด', 'แปด', 'เก้า'];

function thaiOrdinalWord(n) {
  if (n <= 0) return String(n);
  if (n < 10) return THAI_DIGIT_WORDS[n];
  if (n < 20) return n === 10 ? 'สิบ' : n === 11 ? 'สิบเอ็ด' : 'สิบ' + THAI_DIGIT_WORDS[n - 10];
  const tens = Math.floor(n / 10), ones = n % 10;
  const tensWord = tens === 2 ? 'ยี่สิบ' : THAI_DIGIT_WORDS[tens] + 'สิบ';
  if (ones === 0) return tensWord;
  return tensWord + (ones === 1 ? 'เอ็ด' : THAI_DIGIT_WORDS[ones]);
}

function escapeHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

const THAI_DIGIT_CHARS = '๐๑๒๓๔๕๖๗๘๙';
function thaiNumToArabic(s) {
  return s.replace(/[๐-๙]/g, d => String(THAI_DIGIT_CHARS.indexOf(d)));
}

// --- มาตรา cross-reference auto-linking -------------------------------
// Matches "มาตรา <number>[/sub][ suffix]" e.g. "มาตรา ๒๘", "มาตรา 193/1",
// "มาตรา ๔ ทวิ". Runs on already-escaped text; the matched substring only
// ever contains the literal word "มาตรา", whitespace, Thai/Arabic digits
// and a small fixed set of Thai suffix words, so it can never introduce
// HTML/attribute-breaking characters.
const MATRA_SUFFIXES = 'ทวิ|ตรี|จัตวา|เบญจ|ฉ|สัตต|อัฏฐ|นว|ทศ';
const MATRA_REF_RE = new RegExp(
  'มาตรา\\s*([0-9๐-๙]+(?:\\s*\\/\\s*[0-9๐-๙]+)?)(?:\\s+(' + MATRA_SUFFIXES + ')(?![ก-ฮ]))?',
  'g'
);

function normalizeMatraNumber(rawNum, rawSuffix) {
  const n = thaiNumToArabic(rawNum).replace(/\s+/g, '');
  return rawSuffix ? (n + ' ' + rawSuffix) : n;
}

// escapedText must already be HTML-escaped via escapeHtml(). Only wraps
// a match in <a> when it resolves to a real article in the same book,
// and never links the article's own current number (avoids self-links).
function linkifyMatraRefs(escapedText, bookType, currentNumber) {
  if (!bookType || !codexData || !codexData.books[bookType]) return escapedText;
  const articles = codexData.books[bookType].articles;
  return escapedText.replace(MATRA_REF_RE, (full, rawNum, rawSuffix) => {
    const candidate = normalizeMatraNumber(rawNum, rawSuffix);
    if (!candidate || candidate === currentNumber) return full;
    if (Object.prototype.hasOwnProperty.call(articles, candidate)) {
      const href = `codex-article-viewer.html?id=${bookType}_${encodeURIComponent(candidate)}`;
      return `<a href="${href}" class="matra-ref-link">${full}</a>`;
    }
    return full;
  });
}

function renderArticleBody(article) {
  const el = document.getElementById('article-text');
  const chunks = article.text.split('\n').filter(p => p.trim());
  if (chunks.length <= 1) {
    el.innerHTML = linkifyMatraRefs(escapeHtml(article.text), currentBookType, article.number);
    return;
  }
  let warakN = 0;
  el.innerHTML = chunks.map(p => {
    const anuMatch = p.match(/^\(([๐-๙0-9]+)\)/);
    let label;
    if (anuMatch) {
      label = `อนุ ${thaiNumToArabic(anuMatch[1])}`;
    } else {
      warakN++;
      label = `วรรค${thaiOrdinalWord(warakN)}`;
    }
    return `
    <div class="warak-row">
      <div class="warak-label">${label}</div>
      <div class="warak-text">${linkifyMatraRefs(escapeHtml(p), currentBookType, article.number)}</div>
    </div>`;
  }).join('');
}

function switchTab(tabName, btn) {
  document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('tab-' + tabName).classList.add('active');
  const activeBtn = btn || (typeof event !== 'undefined' && event.target);
  if (activeBtn) activeBtn.classList.add('active');
}

function emptyState(icon, text) {
  return `<div class="empty-section"><div class="icon">${icon}</div><p>${text}</p></div>`;
}

function renderOverview(article) {
  const meta = article.meta || {};
  const rows = [];
  if (meta.phaak) rows.push(['บรรพ/ภาค', meta.phaak + (meta.phaakTitle ? ' ' + meta.phaakTitle : '')]);
  if (meta.laksana) rows.push(['ลักษณะ', meta.laksana + (meta.laksanaTitle ? ' ' + meta.laksanaTitle : '')]);
  if (meta.muad) rows.push(['หมวด', meta.muad + (meta.muadTitle ? ' ' + meta.muadTitle : '')]);
  if (meta.suan) rows.push(['ส่วนที่', meta.suan + (meta.suanTitle ? ' ' + meta.suanTitle : '')]);
  document.getElementById('overview-meta').innerHTML = rows.length
    ? rows.map(([label, val]) => `
        <div>
          <div style="font-size:11px;color:var(--ink-faint);text-transform:uppercase;margin-bottom:6px;">${label}</div>
          <div style="font-weight:600;color:var(--ink);">${val}</div>
        </div>`).join('')
    : emptyState('📖', 'มาตรานี้อยู่ในบทบัญญัติทั่วไปก่อนเข้าบรรพ/ภาคใด ๆ');

  document.getElementById('overview-keywords').innerHTML = (article.keywords && article.keywords.length)
    ? `<div style="font-size:13px;color:var(--ink-soft);"><strong>คำสำคัญ:</strong> ${article.keywords.join(', ')}</div>`
    : '';
}

function renderCaseLaw(article) {
  const el = document.getElementById('caselaw-container');
  if (!article.caseLaw || article.caseLaw.length === 0) {
    el.innerHTML = emptyState('⚖️', 'ยังไม่มีฎีกาที่เกี่ยวข้องกับมาตรานี้ (อยู่ระหว่างรวบรวมข้อมูล)');
    return;
  }
  el.innerHTML = article.caseLaw.map(c => `
    <div class="case-item">
      <div class="case-number">⚖️ ${c.caseNumber || ''}</div>
      <div class="case-title">${c.title || ''}</div>
      <div class="case-summary">${c.summary || ''}</div>
    </div>`).join('');
}

function renderExamples(article) {
  const el = document.getElementById('examples-container');
  if (!article.examples || article.examples.length === 0) {
    el.innerHTML = emptyState('📝', 'ยังไม่มีตัวอย่างการใช้มาตรานี้ (อยู่ระหว่างรวบรวมข้อมูล)');
    return;
  }
  el.innerHTML = article.examples.map(ex => `
    <div class="example-item">
      <div class="example-title">📝 ${ex.title || ''}</div>
      <div class="example-scenario"><strong>สถานการณ์:</strong> ${ex.scenario || ''}</div>
      <div class="example-explanation"><strong>การประยุกต์:</strong> ${ex.explanation || ''}</div>
    </div>`).join('');
}

const SUFFIX_RANK = { '': 0, 'ทวิ': 1, 'ตรี': 2, 'จัตวา': 3, 'เบญจ': 4, 'ฉ': 5, 'สัตต': 6, 'อัฏฐ': 7, 'นว': 8, 'ทศ': 9 };

function sortKey(numStr) {
  const spaceIdx = numStr.indexOf(' ');
  const numPart = spaceIdx === -1 ? numStr : numStr.slice(0, spaceIdx);
  const suffix = spaceIdx === -1 ? '' : numStr.slice(spaceIdx + 1);
  const [main, sub] = numPart.split('/').map(Number);
  return [main, sub || 0, SUFFIX_RANK[suffix] ?? 0];
}

function compareNumbers(a, b) {
  const ka = sortKey(a), kb = sortKey(b);
  for (let i = 0; i < 3; i++) if (ka[i] !== kb[i]) return ka[i] - kb[i];
  return 0;
}

function pathKey(meta, depth) {
  const parts = [meta.phaak, meta.laksana, meta.muad, meta.suan].slice(0, depth);
  if (parts.some(p => !p)) return null;
  return parts.join(' / ');
}

function renderRelated(article, articles) {
  const el = document.getElementById('related-list');
  const meta = article.meta || {};
  // prefer the most specific full path available (phaak/laksana/muad), fall back to phaak/laksana
  const bucket = pathKey(meta, 3) || pathKey(meta, 2);
  if (!bucket) {
    el.innerHTML = emptyState('🔗', 'มาตรานี้ยังไม่มีหมวดหมู่ให้จับคู่มาตราที่เกี่ยวข้อง');
    return;
  }
  const depth = pathKey(meta, 3) ? 3 : 2;
  const sameSection = Object.values(articles)
    .filter(a => pathKey(a.meta || {}, depth) === bucket)
    .sort((a, b) => compareNumbers(a.number, b.number));
  const selfIdx = sameSection.findIndex(a => a.number === article.number);
  const windowStart = Math.max(0, selfIdx - 6);
  const related = sameSection
    .slice(windowStart, windowStart + 13)
    .filter(a => a.number !== article.number);

  el.innerHTML = related.length
    ? related.map(a => `<a href="codex-article-viewer.html?id=${currentBookType}_${encodeURIComponent(a.number)}" class="related-link">${a.number}</a>`).join('')
    : emptyState('🔗', 'ไม่พบมาตราอื่นในหมวดเดียวกัน');
}

function renderNav(articles) {
  const numbers = Object.keys(articles).sort(compareNumbers);
  const idx = numbers.indexOf(currentNumber);
  const prev = idx > 0 ? numbers[idx - 1] : null;
  const next = idx >= 0 && idx < numbers.length - 1 ? numbers[idx + 1] : null;

  const el = document.getElementById('article-nav');
  el.innerHTML = `
    ${prev ? `<a href="codex-article-viewer.html?id=${currentBookType}_${encodeURIComponent(prev)}" class="nav-btn">
      <span class="nav-label">← มาตราก่อนหน้า</span><span class="nav-title">มาตรา ${prev}</span>
    </a>` : '<div></div>'}
    ${next ? `<a href="codex-article-viewer.html?id=${currentBookType}_${encodeURIComponent(next)}" class="nav-btn">
      <span class="nav-label">มาตราถัดไป →</span><span class="nav-title">มาตรา ${next}</span>
    </a>` : '<div></div>'}
  `;
}

function showNotFound(msg) {
  document.getElementById('article-number').textContent = '—';
  document.getElementById('breadcrumb').textContent = '📍 ไม่พบมาตรา';
  document.getElementById('article-text').textContent = msg || 'ไม่พบมาตรานี้ในฐานข้อมูล';
}

// --- personal note (per-article, localStorage) --------------------------

function bindNoteInput(article) {
  const el = document.getElementById('article-note-input');
  if (!el) return;
  const key = 'codex-note-' + article.id;
  el.value = localStorage.getItem(key) || '';
  const save = () => { try { localStorage.setItem(key, el.value); } catch (e) { /* storage unavailable/full */ } };
  el.addEventListener('input', save);
  el.addEventListener('blur', save);
}

// --- print just this article --------------------------------------------

function printCurrentArticle() {
  const card = document.getElementById('article-card');
  const printArea = document.getElementById('print-area');
  if (!card || !printArea) return;
  const numberText = document.getElementById('article-number').textContent;
  const subtitleText = document.getElementById('article-subtitle').textContent;
  const bodyHtml = document.getElementById('article-text').innerHTML;
  printArea.innerHTML = `
    <h2 style="font-family:'Noto Serif Thai',serif;margin-bottom:6px;">มาตรา ${numberText}</h2>
    <div style="font-size:13px;color:var(--ink-soft);margin-bottom:14px;">${subtitleText}</div>
    <div class="article-body" style="border:none;padding:0;background:none;">${bodyHtml}</div>
  `;
  document.body.classList.add('printing-one');
  window.print();
}

window.addEventListener('afterprint', () => {
  document.body.classList.remove('printing-one');
  const printArea = document.getElementById('print-area');
  if (printArea) printArea.innerHTML = '';
});

// --- "อ่านทั้งหมวด" continuous chapter playback --------------------------

let chapterQueue = [];
let chapterQueueIdx = -1;
let chapterPaused = false;

function getChapterArticles(article, articles) {
  const meta = article.meta || {};
  if (!meta.muad) return [];
  return Object.values(articles)
    .filter(a => (a.meta || {}).muad === meta.muad)
    .sort((a, b) => compareNumbers(a.number, b.number));
}

function renderChapterAudioIdle(article, articles) {
  const el = document.getElementById('chapter-audio');
  if (!el) return;
  if (!('speechSynthesis' in window) || getChapterArticles(article, articles).length < 2) {
    el.innerHTML = '';
    return;
  }
  el.innerHTML = `<button type="button" class="chapter-audio-btn" onclick="startReadChapter()" onmouseenter="playHoverSound()">🔊 อ่านทั้งหมวด</button>`;
}

function renderChapterAudioActive() {
  const el = document.getElementById('chapter-audio');
  if (!el) return;
  el.innerHTML = `
    <div class="chapter-audio-active">
      <span class="chapter-now-reading" id="chapter-now-reading"></span>
      <button type="button" id="chapter-pause-btn" onclick="togglePauseResumeChapter()" onmouseenter="playHoverSound()">⏸️ หยุดชั่วคราว</button>
      <button type="button" onclick="stopReadChapter()" onmouseenter="playHoverSound()">⏹️ หยุดอ่าน</button>
    </div>`;
}

function startReadChapter() {
  if (!('speechSynthesis' in window)) {
    alert('เบราว์เซอร์นี้ไม่รองรับการอ่านออกเสียง');
    return;
  }
  const book = codexData.books[currentBookType];
  const article = book.articles[currentNumber];
  chapterQueue = getChapterArticles(article, book.articles);
  if (!chapterQueue.length) {
    alert('ไม่พบมาตราอื่นในหมวดเดียวกันนี้');
    return;
  }
  window.speechSynthesis.cancel();
  chapterPaused = false;
  const startIdx = chapterQueue.findIndex(a => a.number === currentNumber);
  renderChapterAudioActive();
  speakChapterFrom(startIdx >= 0 ? startIdx : 0);
}

function speakChapterFrom(idx) {
  if (idx < 0 || idx >= chapterQueue.length) {
    stopReadChapter();
    return;
  }
  chapterQueueIdx = idx;
  const art = chapterQueue[idx];
  const statusEl = document.getElementById('chapter-now-reading');
  if (statusEl) statusEl.textContent = `🔊 กำลังอ่าน: มาตรา ${art.number}`;

  const utter = new SpeechSynthesisUtterance(`มาตรา ${art.number}. ${art.text}`);
  utter.lang = 'th-TH';
  utter.onend = () => {
    if (!chapterPaused) speakChapterFrom(chapterQueueIdx + 1);
  };
  utter.onerror = () => {
    if (!chapterPaused) speakChapterFrom(chapterQueueIdx + 1);
  };
  window.speechSynthesis.speak(utter);
}

function togglePauseResumeChapter() {
  const btn = document.getElementById('chapter-pause-btn');
  if (chapterPaused) {
    window.speechSynthesis.resume();
    chapterPaused = false;
    if (btn) btn.textContent = '⏸️ หยุดชั่วคราว';
  } else {
    window.speechSynthesis.pause();
    chapterPaused = true;
    if (btn) btn.textContent = '▶️ อ่านต่อ';
  }
}

function stopReadChapter() {
  window.speechSynthesis.cancel();
  chapterQueue = [];
  chapterQueueIdx = -1;
  chapterPaused = false;
  const book = codexData && codexData.books[currentBookType];
  const article = book && book.articles[currentNumber];
  if (article) renderChapterAudioIdle(article, book.articles);
}

async function loadAndRender() {
  updateThemeToggleUI(document.documentElement.getAttribute('data-theme') || 'light');

  const params = new URLSearchParams(window.location.search);
  const id = params.get('id');
  if (!id || !id.includes('_')) { showNotFound('ไม่ได้ระบุมาตราที่ต้องการดู'); return; }

  currentBookType = id.slice(0, id.indexOf('_'));
  currentNumber = id.slice(id.indexOf('_') + 1);

  try {
    const res = await fetch('codex-data.json');
    if (!res.ok) throw new Error('fetch failed');
    codexData = await res.json();
  } catch (e) {
    showNotFound('โหลดฐานข้อมูลไม่สำเร็จ ลองรีเฟรชหน้าอีกครั้ง');
    return;
  }

  const book = codexData.books[currentBookType];
  const article = book && book.articles[currentNumber];
  if (!article) { showNotFound(`ไม่พบมาตรา ${currentNumber}`); return; }

  document.getElementById('breadcrumb').textContent = `📍 ${BOOK_TITLES[currentBookType] || currentBookType}`;
  document.getElementById('article-number').textContent = article.number;
  document.getElementById('article-cancelled-badge').innerHTML = article.cancelled
    ? '<span style="color:var(--bad);font-size:13px;font-weight:700;border:1px solid var(--bad);border-radius:4px;padding:2px 8px;">ยกเลิกแล้ว</span>'
    : '';
  document.getElementById('article-subtitle').textContent = BOOK_TITLES[currentBookType] || '';
  renderArticleBody(article);

  renderOverview(article);
  renderCaseLaw(article);
  renderExamples(article);
  renderRelated(article, book.articles);
  renderNav(book.articles);
  bindNoteInput(article);
  renderChapterAudioIdle(article, book.articles);

  if ('speechSynthesis' in window) {
    thaiTTS.createAudioControl('audio-controls', ['article-text']);
  }
}

document.addEventListener('DOMContentLoaded', loadAndRender);
