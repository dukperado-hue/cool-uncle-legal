<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>มาตรา - ประมวลกฎหมาย</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Thai:wght@500;600;700;900&family=Sarabun:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<script src="tts-helper.js"></script>
<style>
:root {
  --paper: #FBF9F4;
  --card: #FFFFFF;
  --ink: #22283A;
  --ink-soft: #5A6072;
  --ink-faint: #9AA0B0;
  --line: #E5E1D6;
  --gold: #B08A3C;
  --accent: #2E4A7A;
  --ok: #1E7A4F;
  --bad: #B23A3A;
  --radius: 14px;
  --shadow: 0 1px 2px rgba(34,40,58,.05), 0 6px 20px rgba(34,40,58,.07);
}

/* ============ THEME: DARK ============ */
:root[data-theme="dark"]{
  --paper:#14161f;
  --card:#1c2030;
  --ink:#E9E7E1;
  --ink-soft:#A9AEC2;
  --ink-faint:#6C7188;
  --line:#2E3348;
  --gold:#E0BD73;
  --accent:#84A6E8;
  --ok:#4FCB8D;
  --bad:#E2685F;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 24px rgba(0,0,0,.45);
}

/* ============ THEME: HORROR (Thai Horror Manga mode) ============ */
:root[data-theme="horror"]{
  --paper:#1a1a1a;
  --card:#242424;
  --ink:#D9D2C9;
  --ink-soft:#9C8F93;
  --ink-faint:#5C5460;
  --line:#2B1F26;
  --gold:#8F1F2B;
  --accent:#4A8F5C;
  --ok:#3F7A4F;
  --bad:#FF3355;
  --glow:#4a6b53;
  --shadow:0 1px 2px rgba(0,0,0,.6),0 10px 28px rgba(0,0,0,.6);
}

/* Surfaces that used hardcoded near-white hex instead of a CSS var —
   normalize them under dark/horror with a subtle translucent overlay. */
:root[data-theme="dark"] .topbar,
:root[data-theme="horror"] .topbar{ background:var(--card); border-bottom-color:var(--line); }
:root[data-theme="dark"] body{
  background:radial-gradient(1200px 500px at 50% -200px,#232840 0%,transparent 60%),var(--paper);
}
:root[data-theme="horror"] body{
  background:radial-gradient(1200px 500px at 50% -220px,rgba(90,20,30,.35) 0%,transparent 60%),var(--paper);
}
:root[data-theme="dark"] .breadcrumb,
:root[data-theme="dark"] .article-body,
:root[data-theme="dark"] .icon-btn,
:root[data-theme="dark"] .note-input,
:root[data-theme="dark"] .case-summary,
:root[data-theme="dark"] .example-scenario,
:root[data-theme="dark"] .related-link,
:root[data-theme="dark"] .chapter-audio-active,
:root[data-theme="horror"] .breadcrumb,
:root[data-theme="horror"] .article-body,
:root[data-theme="horror"] .icon-btn,
:root[data-theme="horror"] .note-input,
:root[data-theme="horror"] .case-summary,
:root[data-theme="horror"] .example-scenario,
:root[data-theme="horror"] .related-link,
:root[data-theme="horror"] .chapter-audio-active{
  background:rgba(255,255,255,.04);
}
:root[data-theme="dark"] .note-input:focus,
:root[data-theme="horror"] .note-input:focus{background:rgba(255,255,255,.07)}
:root[data-theme="dark"] .nav-btn:hover,
:root[data-theme="horror"] .nav-btn:hover{background:rgba(255,255,255,.04)}
:root[data-theme="dark"] .related-link:hover,
:root[data-theme="horror"] .related-link:hover{background:var(--accent);color:var(--paper)}

/* THEME TOGGLE */
.theme-toggle{
  display:flex;gap:3px;margin-left:auto;background:var(--card);
  border:1px solid var(--line);border-radius:999px;padding:3px;
}
.theme-toggle button{
  border:none;background:transparent;border-radius:999px;width:28px;height:28px;
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  font-size:14px;transition:all .2s;font-family:inherit;
}
.theme-toggle button.active{background:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.theme-toggle button:hover{background:var(--line)}

/* AMBIENT DRONE MUTE — only shown while horror theme is active */
.drone-mute-btn{
  display:none;
  margin-left:6px;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:999px;
  width:28px;height:28px;
  align-items:center;justify-content:center;
  cursor:pointer;font-size:13px;
}
:root[data-theme="horror"] .drone-mute-btn{ display:flex; }
:root[data-theme="horror"] .drone-mute-btn:hover{ background:var(--line); }

/* ============ HERO HEADER (ghost + manga speech bubble) ============
   Structure is shared across all 3 themes; the ghost avatar and
   pastel comic-bubble treatment only activate under horror — light/
   dark themes fall back to a plain header via the base rules below. */
.hero-row{
  display:flex;
  align-items:flex-start;
  gap:16px;
  margin-bottom:20px;
}
.hero-ghost{
  display:none;
  flex-shrink:0;
}
.speech-bubble{
  flex:1;
  min-width:0;
}
.speech-bubble-top{
  display:flex;
  align-items:baseline;
  flex-wrap:wrap;
  gap:8px;
  margin-bottom:10px;
}
.speech-bubble-actions{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}
.bubble-btn{
  background:#F5F3F0;
  border:1px solid var(--line);
  border-radius:8px;
  padding:6px 12px;
  font-size:13px;
  font-weight:700;
  cursor:pointer;
  color:var(--ink);
  font-family:inherit;
  text-decoration:none;
  transition:transform .15s ease, box-shadow .15s ease, background .15s ease;
  display:inline-flex;
  align-items:center;
  gap:4px;
}
.bubble-btn:hover{ transform:translateY(-2px); box-shadow:var(--shadow); border-color:var(--gold); }
.bubble-btn[disabled]{ opacity:.35; pointer-events:none; }

/* ---- Horror mode: pixel-manga ghost + comic speech bubble ---- */
:root[data-theme="horror"] .article-header{
  border:1px solid var(--glow);
  box-shadow:0 0 0 1px rgba(74,107,83,.25), 0 0 32px rgba(74,107,83,.28), var(--shadow);
}
:root[data-theme="horror"] .hero-ghost{
  display:block;
  width:132px;
  height:auto;
  margin-top:-56px;
  filter:drop-shadow(0 0 18px rgba(74,107,83,.55)) drop-shadow(0 6px 10px rgba(0,0,0,.5));
  transition:filter .3s ease, transform .3s ease;
}
:root[data-theme="horror"] .hero-ghost.pulse{
  filter:drop-shadow(0 0 28px rgba(74,107,83,.9)) drop-shadow(0 6px 10px rgba(0,0,0,.5));
  transform:scale(1.04);
}
:root[data-theme="horror"] .speech-bubble{
  position:relative;
  background:#e8f4ec;
  color:#1f3d2b;
  border-radius:18px;
  padding:14px 18px;
  margin-top:8px;
  box-shadow:0 6px 16px rgba(0,0,0,.4);
}
:root[data-theme="horror"] .speech-bubble::before{
  content:"";
  position:absolute;
  left:-14px;
  top:26px;
  width:0;
  height:0;
  border:11px solid transparent;
  border-right-color:#e8f4ec;
}
:root[data-theme="horror"] .speech-bubble .article-number-label{ color:#2f6b45; }
:root[data-theme="horror"] .speech-bubble .article-number{ color:#1f3d2b; font-size:22px; }
:root[data-theme="horror"] .bubble-btn{
  background:#fff;
  border-color:#bcd8c6;
  color:#1f3d2b;
}
:root[data-theme="horror"] .bubble-btn:hover{
  background:#2f6b45;
  border-color:#2f6b45;
  color:#e8f4ec;
}
:root[data-theme="horror"] .note-input{
  background:#2f2f2f;
  border-color:var(--glow);
}
:root[data-theme="horror"] .note-input:focus{ background:#333; border-color:#6ea37f; }

* { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; }
body {
  font-family: 'Sarabun', system-ui, sans-serif;
  background: radial-gradient(1200px 500px at 50% -200px, #F2EDDF 0%, transparent 60%), var(--paper);
  color: var(--ink);
  min-height: 100vh;
  font-size: 16px;
  line-height: 1.75;
}

h1, h2, h3 { font-family: 'Noto Serif Thai', serif; }

.topbar {
  display: flex;
  align-items: center;
  gap: 10px;
  background: #EFEAE0;
  border-bottom: 1px solid var(--line);
  padding: 10px 18px;
  font-size: 13px;
  color: var(--ink-soft);
  position: sticky;
  top: 0;
  z-index: 100;
}

.wrap { max-width: 900px; margin: 0 auto; padding: 20px 18px 60px; }

.back-button {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  color: var(--accent);
  font-weight: 600;
  font-size: 14px;
  text-decoration: none;
  margin-bottom: 20px;
  transition: all .2s;
}
.back-button:hover { transform: translateX(-4px); }

/* BREADCRUMB */
.breadcrumb {
  font-size: 12px;
  color: var(--ink-faint);
  margin-bottom: 20px;
  padding: 12px;
  background: #F9F7F2;
  border-radius: 6px;
  border-left: 3px solid var(--gold);
}

/* ARTICLE HEADER */
.article-header {
  background: var(--card);
  border: 2px solid var(--line);
  border-radius: var(--radius);
  padding: 28px;
  margin-bottom: 24px;
  box-shadow: var(--shadow);
}

.article-number-label {
  font-size: 16px;
  font-weight: 700;
  color: var(--ink-soft);
}

.article-number {
  font-family: 'JetBrains Mono', monospace;
  font-size: 18px;
  font-weight: 700;
  color: var(--accent);
}

.article-subtitle {
  font-size: 14px;
  color: var(--ink-soft);
  margin-bottom: 20px;
  padding-bottom: 20px;
  border-bottom: 1px dashed var(--line);
}

.article-body {
  font-size: 16px;
  line-height: 1.8;
  color: var(--ink);
  background: #FEFDFB;
  padding: 20px;
  border-radius: 8px;
  border-left: 4px solid var(--gold);
  margin-bottom: 20px;
}

.warak-row {
  display: grid;
  grid-template-columns: 84px 1fr;
  gap: 14px;
  align-items: baseline;
}

.warak-row + .warak-row {
  margin-top: 14px;
  padding-top: 14px;
  border-top: 1px dashed var(--line);
}

.warak-label {
  color: var(--gold);
  font-weight: 700;
  font-size: 13px;
  white-space: nowrap;
}

.warak-text {
  white-space: pre-line;
}

.matra-ref-link {
  color: var(--accent);
  text-decoration: underline;
  text-decoration-style: dotted;
  text-underline-offset: 2px;
  font-weight: 600;
}
.matra-ref-link:hover { color: var(--gold); }

.icon-btn {
  background: #F5F3F0;
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 6px 10px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  color: var(--ink);
  transition: all .2s;
  white-space: nowrap;
  font-family: inherit;
}
.icon-btn:hover { background: var(--card); border-color: var(--gold); }

/* PERSONAL NOTE */
.article-note { margin-top: 20px; }
.note-input {
  width: 100%;
  min-height: 70px;
  resize: vertical;
  border: 1px dashed var(--ink-faint);
  border-radius: 8px;
  background: #FBFAF6;
  color: var(--ink);
  font-family: inherit;
  font-size: 13px;
  padding: 10px 12px;
  line-height: 1.6;
}
.note-input::placeholder { color: var(--ink-faint); }
.note-input:focus { outline: none; border-color: var(--gold); background: #fff; }

#print-area { display: none; }
@media print {
  body.printing-one > *:not(#print-area) { display: none !important; }
  body.printing-one #print-area { display: block !important; padding: 24px; }
}

/* CHAPTER READ-ALOUD */
.chapter-audio-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: var(--accent);
  color: white;
  border: none;
  padding: 8px 12px;
  border-radius: 6px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  font-family: inherit;
  transition: all .2s;
}
.chapter-audio-btn:hover { background: #1d3a5a; }

.chapter-audio-active {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px;
  padding: 10px 14px;
  background: #F2F6FC;
  border: 1px solid var(--accent);
  border-radius: 8px;
}

.chapter-now-reading {
  font-size: 13px;
  font-weight: 700;
  color: var(--accent);
}

.chapter-audio-active button {
  background: var(--accent);
  color: white;
  border: none;
  padding: 6px 10px;
  border-radius: 6px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  font-family: inherit;
}
.chapter-audio-active button:hover { background: #1d3a5a; }

/* AUDIO CONTROLS */
.audio-control {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 16px;
  background: var(--ok-bg);
  border: 1px solid var(--ok);
  border-radius: 8px;
  margin-bottom: 20px;
}

.audio-control button {
  display: flex;
  align-items: center;
  gap: 6px;
  background: var(--ok);
  color: white;
  border: none;
  padding: 8px 12px;
  border-radius: 6px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  font-family: inherit;
  transition: all .2s;
}

.audio-control button:hover { background: #177047; }

/* TABS */
.tabs {
  display: flex;
  gap: 6px;
  margin-bottom: 20px;
  border-bottom: 2px solid var(--line);
  overflow-x: auto;
}

.tab-btn {
  padding: 12px 16px;
  background: transparent;
  border: none;
  border-bottom: 3px solid transparent;
  font-size: 14px;
  font-weight: 600;
  color: var(--ink-soft);
  cursor: pointer;
  transition: all .2s;
  white-space: nowrap;
  font-family: inherit;
}

.tab-btn:hover {
  color: var(--ink);
}

.tab-btn.active {
  color: var(--accent);
  border-bottom-color: var(--accent);
}

.tab-content {
  display: none;
}

.tab-content.active {
  display: block;
  animation: fadeIn .3s;
}

@keyframes fadeIn {
  from { opacity: .8; }
  to { opacity: 1; }
}

/* CASE LAW SECTION */
.case-item {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 16px;
  margin-bottom: 12px;
  border-left: 4px solid var(--bad);
}

.case-number {
  font-family: 'JetBrains Mono', monospace;
  font-weight: 700;
  color: var(--bad);
  font-size: 13px;
  margin-bottom: 6px;
}

.case-title {
  font-size: 14px;
  font-weight: 600;
  color: var(--ink);
  margin-bottom: 8px;
}

.case-summary {
  font-size: 13px;
  color: var(--ink-soft);
  line-height: 1.7;
  margin-bottom: 10px;
  padding: 10px;
  background: #FEFDFB;
  border-radius: 4px;
}

.case-action {
  font-size: 12px;
  margin-top: 10px;
  padding-top: 10px;
  border-top: 1px dashed var(--line);
}

.case-link {
  color: var(--accent);
  font-weight: 600;
  text-decoration: none;
}

.case-link:hover {
  text-decoration: underline;
}

/* EXAMPLE SECTION */
.example-item {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 16px;
  margin-bottom: 12px;
  border-left: 4px solid var(--ok);
}

.example-title {
  font-size: 14px;
  font-weight: 600;
  color: var(--ok);
  margin-bottom: 8px;
}

.example-scenario {
  font-size: 13px;
  color: var(--ink);
  background: #F0F9F6;
  padding: 10px;
  border-radius: 4px;
  margin-bottom: 8px;
  border-left: 2px solid var(--ok);
}

.example-explanation {
  font-size: 13px;
  color: var(--ink-soft);
  line-height: 1.7;
}

/* EMPTY STATE */
.empty-section {
  text-align: center;
  padding: 40px 20px;
  color: var(--ink-faint);
}

.empty-section .icon {
  font-size: 32px;
  margin-bottom: 12px;
}

/* NAVIGATION */
.article-nav {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-top: 32px;
  padding-top: 24px;
  border-top: 1px solid var(--line);
}

.nav-btn {
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding: 12px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 8px;
  text-decoration: none;
  color: inherit;
  transition: all .2s;
  cursor: pointer;
}

.nav-btn:hover {
  border-color: var(--gold);
  box-shadow: var(--shadow);
  background: #FEFDFB;
}

.nav-label {
  font-size: 11px;
  color: var(--ink-faint);
  text-transform: uppercase;
  letter-spacing: .05em;
}

.nav-title {
  font-weight: 600;
  color: var(--ink);
}

/* RELATED ARTICLES */
.related-articles {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 20px;
  margin-top: 32px;
}

.related-articles h3 {
  font-size: 16px;
  margin-bottom: 16px;
  color: var(--ink);
}

.related-list {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
  gap: 8px;
}

.related-link {
  padding: 8px;
  background: #F5F3F0;
  border: 1px solid var(--line);
  border-radius: 6px;
  text-align: center;
  text-decoration: none;
  color: var(--accent);
  font-weight: 600;
  font-size: 13px;
  transition: all .2s;
}

.related-link:hover {
  background: var(--accent);
  color: white;
}

/* MOBILE */
@media (max-width: 640px) {
  .article-header { padding: 18px; }
  .article-number { font-size: 16px; }
  .tabs { flex-wrap: wrap; }
  .article-nav { grid-template-columns: 1fr; }
  .hero-row { gap: 10px; }
  :root[data-theme="horror"] .hero-ghost { width: 84px; margin-top: -34px; }
  :root[data-theme="horror"] .speech-bubble { padding: 12px 14px; }
  :root[data-theme="horror"] .speech-bubble .article-number { font-size: 18px; }
  .bubble-btn { padding: 6px 9px; font-size: 12px; }
}
</style>
</head>
<body>
<script>
// Apply the persisted theme as early as possible to avoid a flash of the
// wrong theme (light/dark/horror shared across codex pages via localStorage).
(function(){
  try {
    var t = localStorage.getItem('codex-theme');
    if (t === 'dark' || t === 'horror') document.documentElement.setAttribute('data-theme', t);
  } catch(e){}
})();
</script>

<div class="topbar">
  <span style="font-weight:800; color:var(--ink);">📚 Cool Uncle</span>
  <span style="color:var(--ink-faint)">·</span>
  <span>ประมวลกฎหมาย</span>
  <div class="theme-toggle" role="group" aria-label="เลือกธีม">
    <button type="button" data-theme-btn="light" onclick="setTheme('light')" onmouseenter="playHoverSound()" title="โหมดสว่าง">☀️</button>
    <button type="button" data-theme-btn="dark" onclick="setTheme('dark')" onmouseenter="playHoverSound()" title="โหมดมืด">🌙</button>
    <button type="button" data-theme-btn="horror" onclick="setTheme('horror')" onmouseenter="playHoverSound()" title="โหมดสยองขวัญ">👻</button>
  </div>
  <button type="button" id="drone-mute-btn" class="drone-mute-btn" onclick="toggleDroneMute(this)" title="ปิด/เปิดเสียงบรรยากาศ">🔊</button>
</div>

<div class="wrap">
  
  <a href="codex-search.html" class="back-button">← ค้นหาต่อ</a>

  <!-- BREADCRUMB -->
  <div class="breadcrumb" id="breadcrumb">
    📍 กำลังโหลด...
  </div>

  <!-- ARTICLE HEADER -->
  <article class="article-header" id="article-card">
    <div class="hero-row">
      <img class="hero-ghost" id="hero-ghost" src="pics/krasue-companion.png" alt="" aria-hidden="true">
      <div class="speech-bubble">
        <div class="speech-bubble-top">
          <span class="article-number-label">มาตรา</span>
          <span class="article-number" id="article-number">-</span>
          <span id="article-cancelled-badge"></span>
        </div>
        <div class="speech-bubble-actions">
          <a href="#" id="nav-prev-btn" class="bubble-btn" onmouseenter="playHoverSound()" disabled>‹ ก่อนหน้า</a>
          <a href="#" id="nav-next-btn" class="bubble-btn" onmouseenter="playHoverSound()" disabled>ถัดไป ›</a>
          <button type="button" id="btn-header-read" class="bubble-btn" onclick="toggleHeaderRead(this)" onmouseenter="playHoverSound()">🔊 อ่าน</button>
          <button type="button" class="bubble-btn" title="พิมพ์มาตรานี้" onclick="printCurrentArticle()" onmouseenter="playHoverSound()">🖨️ พิมพ์</button>
        </div>
      </div>
    </div>

<script>
/* ================================================================

/* ================================================================
   HOVER SOUND (Web Audio API blip) — same implementation as index.html
   and the rest of the site, for consistency.
   ================================================================ */
let __hbAudioCtx;
function playHoverSound(){
  try{
    __hbAudioCtx = __hbAudioCtx || new (window.AudioContext||window.webkitAudioContext)();
    const c = __hbAudioCtx;
    if(c.state === 'suspended') c.resume();
    const t0 = c.currentTime;
    const osc = c.createOscillator(), gain = c.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(880, t0);
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(0.05, t0+0.008);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0+0.09);
    osc.connect(gain); gain.connect(c.destination);
    osc.start(t0); osc.stop(t0+0.1);
  }catch(e){}
}

/* ================================================================
   THEME SYSTEM (light / dark / horror) — shared via localStorage
   key "codex-theme" with codex-search.html.
   ================================================================ */
const THEME_KEY = 'codex-theme';

function setTheme(theme){
  if (theme === 'light') {
    document.documentElement.removeAttribute('data-theme');
  } else {
    document.documentElement.setAttribute('data-theme', theme);
  }
  try { localStorage.setItem(THEME_KEY, theme); } catch(e){}
  updateThemeToggleUI(theme);
  if (theme === 'horror') { startGhostRotation(); playHooSound(); startAmbientDrone(); }
  else { stopGhostRotation(); stopAmbientDrone(); }
}

function updateThemeToggleUI(theme){
  document.querySelectorAll('.theme-toggle button').forEach(b => {
    b.classList.toggle('active', b.dataset.themeBtn === theme);
  });
}

/* ================================================================
   HERO GHOST — rotating cast of 4 Thai spirits (กระสือ / ผีจีน /
   ผีเขียว / นางตานี), horror mode only. Sits anchored in the article
   card header (peeking over the top edge), cycling every 5s with a
   soft "hoo" tone. No longer a page-fixed floating element — it lives
   inline in the layout via #hero-ghost. Typing gives a brief glow
   pulse on top of the base presence.
   ================================================================ */
const GHOST_IMAGES = [
  'pics/krasue-companion.png',
  'pics/phijeen-companion.png',
  'pics/phikeaw-companion.png',
  'pics/nangtanee-companion.png'
];
let ghostRotateTimer = null, ghostPulseTimer = null, ghostIndex = 0;

function startGhostRotation(){
  const el = document.getElementById('hero-ghost');
  if (!el) return;
  ghostIndex = 0;
  el.src = GHOST_IMAGES[ghostIndex];
  clearInterval(ghostRotateTimer);
  ghostRotateTimer = setInterval(rotateGhost, 5000);
}

function rotateGhost(){
  if (document.documentElement.getAttribute('data-theme') !== 'horror') return;
  const el = document.getElementById('hero-ghost');
  if (!el) return;
  ghostIndex = (ghostIndex + 1) % GHOST_IMAGES.length;
  el.style.opacity = '0.15';
  setTimeout(() => { el.src = GHOST_IMAGES[ghostIndex]; el.style.opacity = ''; }, 220);
  playHooSound();
}

function stopGhostRotation(){
  clearInterval(ghostRotateTimer);
  ghostRotateTimer = null;
}

function pulseGhost(){
  if (document.documentElement.getAttribute('data-theme') !== 'horror') return;
  const el = document.getElementById('hero-ghost');
  if (!el) return;
  el.classList.add('pulse');
  clearTimeout(ghostPulseTimer);
  ghostPulseTimer = setTimeout(() => el.classList.remove('pulse'), 350);
}

// Delegated listener catches the note textarea (and any future typed
// input) without needing to rebind after each article load.
document.addEventListener('input', (e) => {
  const t = e.target;
  if (!t) return;
  if (t.classList && t.classList.contains('note-input')) {
    pulseGhost();
  }
});

/* Ambient "hoo~" — low breathy tone with vibrato, evoking Thai
   goosebump-story radio shows. Soft attack/decay, kept quiet since it
   can repeat every 5s for as long as horror mode stays on. */
let __ghostAudioCtx;
function playHooSound(){
  try{
    __ghostAudioCtx = __ghostAudioCtx || new (window.AudioContext||window.webkitAudioContext)();
    const c = __ghostAudioCtx;
    if (c.state === 'suspended') c.resume();
    const t0 = c.currentTime, dur = 1.6;
    const baseFreq = 180 + Math.random() * 50;

    const osc = c.createOscillator();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(baseFreq, t0);

    const lfo = c.createOscillator();
    lfo.type = 'sine';
    lfo.frequency.setValueAtTime(4.2, t0);
    const lfoGain = c.createGain();
    lfoGain.gain.setValueAtTime(6, t0);
    lfo.connect(lfoGain); lfoGain.connect(osc.frequency);

    const mainGain = c.createGain();
    mainGain.gain.setValueAtTime(0.0001, t0);
    mainGain.gain.exponentialRampToValueAtTime(0.035, t0 + 0.55);
    mainGain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);

    const bufferSize = Math.floor(c.sampleRate * dur);
    const noiseBuffer = c.createBuffer(1, bufferSize, c.sampleRate);
    const data = noiseBuffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
    const noise = c.createBufferSource();
    noise.buffer = noiseBuffer;
    const noiseFilter = c.createBiquadFilter();
    noiseFilter.type = 'bandpass';
    noiseFilter.frequency.setValueAtTime(baseFreq * 1.6, t0);
    noiseFilter.Q.setValueAtTime(0.7, t0);
    const noiseGain = c.createGain();
    noiseGain.gain.setValueAtTime(0.0001, t0);
    noiseGain.gain.exponentialRampToValueAtTime(0.01, t0 + 0.55);
    noiseGain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);

    osc.connect(mainGain); mainGain.connect(c.destination);
    noise.connect(noiseFilter); noiseFilter.connect(noiseGain); noiseGain.connect(c.destination);

    osc.start(t0); osc.stop(t0 + dur);
    lfo.start(t0); lfo.stop(t0 + dur);
    noise.start(t0); noise.stop(t0 + dur);
  } catch(e){}
}

/* ================================================================
   AMBIENT HORROR DRONE — original Web Audio composition (a sub-bass
   rumble + slow-drifting eerie pad + occasional filtered-noise swells),
   NOT a copy of any existing recording. Loops quietly for as long as
   horror theme stays active; ramps in/out instead of hard cutting.
   Muted state persists via localStorage so the choice sticks across
   pages/reloads.
   ================================================================ */
const DRONE_MUTE_KEY = 'codex-drone-muted';
let __droneCtx, __droneNodes = null;
let __droneMuted = (function(){ try { return localStorage.getItem(DRONE_MUTE_KEY) === '1'; } catch(e){ return false; } })();

function startAmbientDrone(){
  if (__droneNodes) return;
  try {
    __droneCtx = __droneCtx || new (window.AudioContext||window.webkitAudioContext)();
    const c = __droneCtx;
    if (c.state === 'suspended') c.resume();

    const master = c.createGain();
    const targetVol = __droneMuted ? 0.0001 : 0.05;
    master.gain.setValueAtTime(0.0001, c.currentTime);
    master.gain.linearRampToValueAtTime(targetVol, c.currentTime + 2.5);
    master.connect(c.destination);

    // Sub-bass rumble: two slightly detuned sines beating against each other.
    const o1 = c.createOscillator(); o1.type = 'sine'; o1.frequency.value = 54;
    const o2 = c.createOscillator(); o2.type = 'sine'; o2.frequency.value = 57.5;
    const rumbleGain = c.createGain(); rumbleGain.gain.value = 0.6;
    o1.connect(rumbleGain); o2.connect(rumbleGain); rumbleGain.connect(master);

    // Higher eerie pad, slowly drifting in pitch.
    const pad = c.createOscillator(); pad.type = 'sine'; pad.frequency.value = 220;
    const padLfo = c.createOscillator(); padLfo.type = 'sine'; padLfo.frequency.value = 0.07;
    const padLfoGain = c.createGain(); padLfoGain.gain.value = 6;
    padLfo.connect(padLfoGain); padLfoGain.connect(pad.frequency);
    const padGain = c.createGain(); padGain.gain.value = 0.25;
    pad.connect(padGain); padGain.connect(master);

    [o1, o2, pad, padLfo].forEach(n => n.start());

    __droneNodes = { master, nodes: [o1, o2, pad, padLfo], noiseTimer: null };
    scheduleNoiseSwell();
  } catch(e){}
}

function scheduleNoiseSwell(){
  if (!__droneNodes) return;
  const delay = 8000 + Math.random() * 9000;
  __droneNodes.noiseTimer = setTimeout(() => { playNoiseSwell(); scheduleNoiseSwell(); }, delay);
}

function playNoiseSwell(){
  if (!__droneNodes || __droneMuted) return;
  const c = __droneCtx, t0 = c.currentTime, dur = 3 + Math.random() * 2;
  const bufferSize = Math.floor(c.sampleRate * dur);
  const buffer = c.createBuffer(1, bufferSize, c.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
  const src = c.createBufferSource(); src.buffer = buffer;
  const filter = c.createBiquadFilter();
  filter.type = 'bandpass';
  filter.frequency.value = 300 + Math.random() * 400;
  filter.Q.value = 0.8;
  const g = c.createGain();
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(0.02, t0 + dur * 0.4);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  src.connect(filter); filter.connect(g); g.connect(__droneNodes.master);
  src.start(t0); src.stop(t0 + dur);
}

function stopAmbientDrone(){
  if (!__droneNodes) return;
  const c = __droneCtx, t0 = c.currentTime;
  const nodesToStop = __droneNodes.nodes;
  __droneNodes.master.gain.cancelScheduledValues(t0);
  __droneNodes.master.gain.setValueAtTime(__droneNodes.master.gain.value, t0);
  __droneNodes.master.gain.linearRampToValueAtTime(0.0001, t0 + 1.2);
  clearTimeout(__droneNodes.noiseTimer);
  setTimeout(() => { nodesToStop.forEach(n => { try { n.stop(); } catch(e){} }); }, 1300);
  __droneNodes = null;
}

function toggleDroneMute(btn){
  __droneMuted = !__droneMuted;
  try { localStorage.setItem(DRONE_MUTE_KEY, __droneMuted ? '1' : '0'); } catch(e){}
  if (btn) btn.textContent = __droneMuted ? '🔇' : '🔊';
  if (__droneNodes) {
    const c = __droneCtx, t0 = c.currentTime;
    __droneNodes.master.gain.cancelScheduledValues(t0);
    __droneNodes.master.gain.setValueAtTime(__droneNodes.master.gain.value, t0);
    __droneNodes.master.gain.linearRampToValueAtTime(__droneMuted ? 0.0001 : 0.05, t0 + 0.8);
  }
}

const BOOK_TITLES = {
  civil: 'ประมวลกฎหมายแพ่งและพาณิชย์',

  crimpro: 'ประมวลกฎหมายวิธีพิจารณาความอาญา',
  constitution: 'พระธรรมนูญศาลยุติธรรม',
  adminproc: 'พระราชบัญญัติวิธีปฏิบัติราชการทางปกครอง',
  admincourt: 'พระราชบัญญัติจัดตั้งศาลปกครองและวิธีพิจารณาคดีปกครอง',
  const2560: 'รัฐธรรมนูญแห่งราชอาณาจักรไทย พุทธศักราช 2560',
};

let codexData = null;
let currentBookType = null;
let currentNumber = null;

const THAI_DIGIT_WORDS = ['', 'หนึ่ง', 'สอง', 'สาม', 'สี่', 'ห้า', 'หก', 'เจ็ด', 'แปด', 'เก้า'];

function thaiOrdinalWord(n) {
  if (n <= 0) return String(n);
  if (n < 10) return THAI_DIGIT_WORDS[n];
  if (n < 20) return n === 10 ? 'สิบ' : n === 11 ? 'สิบเอ็ด' : 'สิบ' + THAI_DIGIT_WORDS[n - 10];
  const tens = Math.floor(n / 10), ones = n % 10;
  const tensWord = tens === 2 ? 'ยี่สิบ' : THAI_DIGIT_WORDS[tens] + 'สิบ';
  if (ones === 0) return tensWord;
  return tensWord + (ones === 1 ? 'เอ็ด' : THAI_DIGIT_WORDS[ones]);
}

function escapeHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

const THAI_DIGIT_CHARS = '๐๑๒๓๔๕๖๗๘๙';
function thaiNumToArabic(s) {
  return s.replace(/[๐-๙]/g, d => String(THAI_DIGIT_CHARS.indexOf(d)));
}

// --- มาตรา cross-reference auto-linking -------------------------------
// Matches "มาตรา <number>[/sub][ suffix]" e.g. "มาตรา ๒๘", "มาตรา 193/1",
// "มาตรา ๔ ทวิ". Runs on already-escaped text; the matched substring only
// ever contains the literal word "มาตรา", whitespace, Thai/Arabic digits
// and a small fixed set of Thai suffix words, so it can never introduce
// HTML/attribute-breaking characters.
const MATRA_SUFFIXES = 'ทวิ|ตรี|จัตวา|เบญจ|ฉ|สัตต|อัฏฐ|นว|ทศ';
const MATRA_REF_RE = new RegExp(
  'มาตรา\\s*([0-9๐-๙]+(?:\\s*\\/\\s*[0-9๐-๙]+)?)(?:\\s+(' + MATRA_SUFFIXES + ')(?![ก-ฮ]))?',
  'g'
);

function normalizeMatraNumber(rawNum, rawSuffix) {
  const n = thaiNumToArabic(rawNum).replace(/\s+/g, '');
  return rawSuffix ? (n + ' ' + rawSuffix) : n;
}

// escapedText must already be HTML-escaped via escapeHtml(). Only wraps
// a match in <a> when it resolves to a real article in the same book,
// and never links the article's own current number (avoids self-links).
function linkifyMatraRefs(escapedText, bookType, currentNumber) {
  if (!bookType || !codexData || !codexData.books[bookType]) return escapedText;
  const articles = codexData.books[bookType].articles;
  return escapedText.replace(MATRA_REF_RE, (full, rawNum, rawSuffix) => {
    const candidate = normalizeMatraNumber(rawNum, rawSuffix);
    if (!candidate || candidate === currentNumber) return full;
    if (Object.prototype.hasOwnProperty.call(articles, candidate)) {
      const href = `codex-article-viewer.html?id=${bookType}_${encodeURIComponent(candidate)}`;
      return `<a href="${href}" class="matra-ref-link">${full}</a>`;
    }
    return full;
  });
}

function renderArticleBody(article) {
  const el = document.getElementById('article-text');
  const chunks = article.text.split('\n').filter(p => p.trim());
  if (chunks.length <= 1) {
    el.innerHTML = linkifyMatraRefs(escapeHtml(article.text), currentBookType, article.number);
    return;
  }
  let warakN = 0;
  el.innerHTML = chunks.map(p => {
    const anuMatch = p.match(/^\(([๐-๙0-9]+)\)/);
    let label;
    if (anuMatch) {
      label = `อนุ ${thaiNumToArabic(anuMatch[1])}`;
    } else {
      warakN++;
      label = `วรรค${thaiOrdinalWord(warakN)}`;
    }
    return `
    <div class="warak-row">
      <div class="warak-label">${label}</div>
      <div class="warak-text">${linkifyMatraRefs(escapeHtml(p), currentBookType, article.number)}</div>
    </div>`;
  }).join('');
}

function emptyState(icon, text) {
  return `<div class="empty-section"><div class="icon">${icon}</div><p>${text}</p></div>`;
}

function renderLectureNotes(article) {
  const el = document.getElementById('lecture-container');
  if (!article.lectureNotes || article.lectureNotes.length === 0) {
    el.innerHTML = `
      <div style="background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px;">
        <h3 style="margin-bottom: 16px;">🎓 อธิบายมาตรา</h3>
        ${emptyState('🎓', 'ยังไม่มีคำอธิบายสำหรับมาตรานี้ (อยู่ระหว่างรวบรวมข้อมูล)')}
      </div>`;
    return;
  }
  el.innerHTML = `
    <div style="background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px;">
      <h3 style="margin-bottom: 16px;">🎓 อธิบายมาตรา</h3>
      ${article.lectureNotes.map(n => `
        <div class="case-item">
          <div class="case-number">🎓 ${escapeHtml(n.topic || '')}</div>
          <div class="case-summary" style="white-space:pre-line">${escapeHtml(n.text || '')}</div>
          <div style="margin-top:10px;font-size:12px;color:var(--ink-faint);border-top:1px dashed var(--line);padding-top:8px;">
            ℹ️ ${escapeHtml(n.source || 'สรุปโดย AI จากคำบรรยาย — โปรดตรวจสอบความถูกต้องก่อนใช้อ้างอิง')}
          </div>
        </div>`).join('')}
    </div>`;
}

const SUFFIX_RANK = { '': 0, 'ทวิ': 1, 'ตรี': 2, 'จัตวา': 3, 'เบญจ': 4, 'ฉ': 5, 'สัตต': 6, 'อัฏฐ': 7, 'นว': 8, 'ทศ': 9 };

function sortKey(numStr) {
  const spaceIdx = numStr.indexOf(' ');
  const numPart = spaceIdx === -1 ? numStr : numStr.slice(0, spaceIdx);
  const suffix = spaceIdx === -1 ? '' : numStr.slice(spaceIdx + 1);
  const [main, sub] = numPart.split('/').map(Number);
  return [main, sub || 0, SUFFIX_RANK[suffix] ?? 0];
}

function compareNumbers(a, b) {
  const ka = sortKey(a), kb = sortKey(b);
  for (let i = 0; i < 3; i++) if (ka[i] !== kb[i]) return ka[i] - kb[i];
  return 0;
}


function renderNav(articles) {
  const numbers = Object.keys(articles).sort(compareNumbers);
  const idx = numbers.indexOf(currentNumber);
  const prev = idx > 0 ? numbers[idx - 1] : null;
  const next = idx >= 0 && idx < numbers.length - 1 ? numbers[idx + 1] : null;

  const el = document.getElementById('article-nav');
  el.innerHTML = `
    ${prev ? `<a href="codex-article-viewer.html?id=${currentBookType}_${encodeURIComponent(prev)}" class="nav-btn">
      <span class="nav-label">← มาตราก่อนหน้า</span><span class="nav-title">มาตรา ${prev}</span>
    </a>` : '<div></div>'}
    ${next ? `<a href="codex-article-viewer.html?id=${currentBookType}_${encodeURIComponent(next)}" class="nav-btn">
      <span class="nav-label">มาตราถัดไป →</span><span class="nav-title">มาตรา ${next}</span>
    </a>` : '<div></div>'}
  `;

  // Mirror prev/next into the header speech-bubble quick-action buttons.
  const prevBtn = document.getElementById('nav-prev-btn');
  const nextBtn = document.getElementById('nav-next-btn');
  if (prevBtn) {
    if (prev) { prevBtn.href = `codex-article-viewer.html?id=${currentBookType}_${encodeURIComponent(prev)}`; prevBtn.removeAttribute('disabled'); }
    else { prevBtn.href = '#'; prevBtn.setAttribute('disabled', ''); }
  }
  if (nextBtn) {
    if (next) { nextBtn.href = `codex-article-viewer.html?id=${currentBookType}_${encodeURIComponent(next)}`; nextBtn.removeAttribute('disabled'); }
    else { nextBtn.href = '#'; nextBtn.setAttribute('disabled', ''); }
  }
}

// Lightweight play/stop toggle for the header's "🔊 อ่าน" bubble button —
// proxies the existing thaiTTS instance (configured in loadAndRender)
// rather than duplicating speech-synthesis logic.
function toggleHeaderRead(btn) {
  if (typeof thaiTTS === 'undefined') return;

  setTimeout(() => {
    btn.textContent = window.speechSynthesis.speaking ? '⏸️ หยุด' : '🔊 อ่าน';

  document.getElementById('breadcrumb').textContent = '📍 ไม่พบมาตรา';

// --- personal note (per-article, localStorage) --------------------------

function bindNoteInput(article) {
  const el = document.getElementById('article-note-input');
  if (!el) return;

// --- print just this article --------------------------------------------

function printCurrentArticle() {
  const card = document.getElementById('article-card');
  const printArea = document.getElementById('print-area');
  if (!card || !printArea) return;
  const numberText = document.getElementById('article-number').textContent;
  const subtitleText = document.getElementById('article-subtitle').textContent;
  const bodyHtml = document.getElementById('article-text').innerHTML;
  printArea.innerHTML = `
    <h2 style="font-family:'Noto Serif Thai',serif;margin-bottom:6px;">มาตรา ${numberText}</h2>
    <div style="font-size:13px;color:var(--ink-soft);margin-bottom:14px;">${subtitleText}</div>
    <div class="article-body" style="border:none;padding:0;background:none;">${bodyHtml}</div>
  `;
  document.body.classList.add('printing-one');
  window.print();
}

window.addEventListener('afterprint', () => {
  document.body.classList.remove('printing-one');
  const printArea = document.getElementById('print-area');
  if (printArea) printArea.innerHTML = '';
});

// --- "อ่านทั้งหมวด" continuous chapter playback --------------------------

let chapterQueue = [];
let chapterQueueIdx = -1;
let chapterPaused = false;

function getChapterArticles(article, articles) {
  const meta = article.meta || {};
  if (!meta.muad) return [];
  return Object.values(articles)
    .filter(a => (a.meta || {}).muad === meta.muad)
    .sort((a, b) => compareNumbers(a.number, b.number));
}

function renderChapterAudioIdle(article, articles) {
  const el = document.getElementById('chapter-audio');
  if (!el) return;
  if (!('speechSynthesis' in window) || getChapterArticles(article, articles).length < 2) {
    el.innerHTML = '';
    return;
  }
  el.innerHTML = `<button type="button" class="chapter-audio-btn" onclick="startReadChapter()" onmouseenter="playHoverSound()">🔊 อ่านทั้งหมวด</button>`;
}

function renderChapterAudioActive() {
  const el = document.getElementById('chapter-audio');
  if (!el) return;
  el.innerHTML = `
    <div class="chapter-audio-active">
      <span class="chapter-now-reading" id="chapter-now-reading"></span>
      <button type="button" id="chapter-pause-btn" onclick="togglePauseResumeChapter()" onmouseenter="playHoverSound()">⏸️ หยุดชั่วคราว</button>
      <button type="button" onclick="stopReadChapter()" onmouseenter="playHoverSound()">⏹️ หยุดอ่าน</button>
    </div>`;
}

function startReadChapter() {
  if (!('speechSynthesis' in window)) {
    alert('เบราว์เซอร์นี้ไม่รองรับการอ่านออกเสียง');
    return;
  }
  const book = codexData.books[currentBookType];
  const article = book.articles[currentNumber];
  chapterQueue = getChapterArticles(article, book.articles);
  if (!chapterQueue.length) {
    alert('ไม่พบมาตราอื่นในหมวดเดียวกันนี้');
    return;
  }
  window.speechSynthesis.cancel();
  chapterPaused = false;
  const startIdx = chapterQueue.findIndex(a => a.number === currentNumber);
  renderChapterAudioActive();
  speakChapterFrom(startIdx >= 0 ? startIdx : 0);
}

function speakChapterFrom(idx) {
  if (idx < 0 || idx >= chapterQueue.length) {
    stopReadChapter();
    return;
  }
  chapterQueueIdx = idx;
  const art = chapterQueue[idx];
  const statusEl = document.getElementById('chapter-now-reading');
  if (statusEl) statusEl.textContent = `🔊 กำลังอ่าน: มาตรา ${art.number}`;

  const utter = new SpeechSynthesisUtterance(`มาตรา ${art.number}. ${art.text}`);
  utter.lang = 'th-TH';
  utter.onend = () => {
    if (!chapterPaused) speakChapterFrom(chapterQueueIdx + 1);
  };
  utter.onerror = () => {
    if (!chapterPaused) speakChapterFrom(chapterQueueIdx + 1);
  };
  window.speechSynthesis.speak(utter);
}

function togglePauseResumeChapter() {
  const btn = document.getElementById('chapter-pause-btn');
  if (chapterPaused) {
    window.speechSynthesis.resume();
    chapterPaused = false;
    if (btn) btn.textContent = '⏸️ หยุดชั่วคราว';
  } else {
    window.speechSynthesis.pause();
    chapterPaused = true;
    if (btn) btn.textContent = '▶️ อ่านต่อ';
  }
}

function stopReadChapter() {
  window.speechSynthesis.cancel();
  chapterQueue = [];
  chapterQueueIdx = -1;
  chapterPaused = false;
  const book = codexData && codexData.books[currentBookType];
  const article = book && book.articles[currentNumber];
  if (article) renderChapterAudioIdle(article, book.articles);
}

async function loadAndRender() {
  const currentTheme = document.documentElement.getAttribute('data-theme') || 'light';
  updateThemeToggleUI(currentTheme);
  const droneMuteBtn = document.getElementById('drone-mute-btn');
  if (droneMuteBtn) droneMuteBtn.textContent = __droneMuted ? '🔇' : '🔊';
  if (currentTheme === 'horror') { startGhostRotation(); startAmbientDrone(); }

  const params = new URLSearchParams(window.location.search);
  const id = params.get('id');
  if (!id || !id.includes('_')) { showNotFound('ไม่ได้ระบุมาตราที่ต้องการดู'); return; }

  currentBookType = id.slice(0, id.indexOf('_'));
  currentNumber = id.slice(id.indexOf('_') + 1);

  try {
    const res = await fetch('codex-data.json?v=20260729ac');
    if (!res.ok) throw new Error('fetch failed');
    codexData = await res.json();
  } catch (e) {
    showNotFound('โหลดฐานข้อมูลไม่สำเร็จ ลองรีเฟรชหน้าอีกครั้ง');
    return;
  }

  const book = codexData.books[currentBookType];
  const article = book && book.articles[currentNumber];
  if (!article) { showNotFound(`ไม่พบมาตรา ${currentNumber}`); return; }

  const crumbParts = [BOOK_TITLES[currentBookType] || currentBookType];
  const m = article.meta || {};
  [m.phaak, m.laksana, m.muad, m.suan].forEach(part => { if (part) crumbParts.push(part); });
  document.getElementById('breadcrumb').textContent = `📍 ${crumbParts.join(' › ')}`;
  document.getElementById('article-number').textContent = article.number;
  document.getElementById('article-cancelled-badge').innerHTML = article.cancelled
    ? '<span style="color:var(--bad);font-size:13px;font-weight:700;border:1px solid var(--bad);border-radius:4px;padding:2px 8px;">ยกเลิกแล้ว</span>'
    : '';
  document.getElementById('article-subtitle').textContent = BOOK_TITLES[currentBookType] || '';
  renderArticleBody(article);

  renderLectureNotes(article);
  renderNav(book.articles);
  bindNoteInput(article);
  renderChapterAudioIdle(article, book.articles);

  if ('speechSynthesis' in window) {
    thaiTTS.createAudioControl('audio-controls', ['article-text']);
  }
}

document.addEventListener('DOMContentLoaded', loadAndRender);
</script>
</body>
</html>
