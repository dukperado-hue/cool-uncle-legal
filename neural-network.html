  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      overflow: hidden;
      background-color: #050510;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;

    }
    #graph-container { width: 100vw; height: 100vh; }

    #ui-panel {
      position: absolute;
      top: 16px;
      left: 16px;
      max-width: 300px;
      pointer-events: none;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.35);
      z-index: 5;
    }
    #ui-panel h2 { margin: 0 0 10px; font-size: 20px; }
    .brand-row { pointer-events: auto; margin-bottom: 6px; }
    .brand-row a.back-link {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #7fd8ff;
      text-decoration: none;
      font-size: 12.5px;
    }
    .brand-row a.back-link:hover { text-decoration: underline; }
    .brand-logo { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; flex: 0 0 auto; }

    .graph-tools { display: flex; gap: 8px; pointer-events: auto; flex-wrap: wrap; }
    .tool-btn {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.25);
      color: #fff;
      font-size: 11px;
      padding: 5px 10px;
      border-radius: 14px;

    }
    .tool-btn:hover { background: rgba(255,255,255,0.18); }
    .tool-btn.active { background: rgba(255,204,68,0.28); border-color: #ffcc44; }

    #settings-toggle {
      position: absolute; bottom: 16px; left: 16px; z-index: 6;
      width: 42px; height: 42px; border-radius: 50%;
      background: rgba(10,10,25,0.7); border: 1px solid rgba(255,255,255,0.25);
      color: #fff; font-size: 19px; cursor: pointer; pointer-events: auto;
    }
    #settings-toggle:hover { background: rgba(255,255,255,0.18); }
    #settings-panel {
      position: absolute; bottom: 66px; left: 16px; z-index: 6;
      background: rgba(10, 10, 25, 0.8); border: 1px solid rgba(255,255,255,0.15);
      border-radius: 10px; padding: 12px 14px; font-size: 12.5px;

    #side-panel {
      position: absolute;

    #side-panel .close-btn {

    #side-panel .kicker {

    #side-panel .section-title {

  <script src="https://unpkg.com/d3-quadtree"></script>

<body>

  <div id="loading"><div class="spinner"></div><div>กำลังโหลดฐานข้อมูลกฎหมาย (codex-data.json)...</div></div>

  <div id="ui-panel">
    <div class="brand-row">
      <a class="back-link" href="index.html">
        <img class="brand-logo" src="pics/capybara-detective.png" alt="">

    </div>
    <h2>รัศมีนิติธรรม</h2>
    <div class="graph-tools">
      <button id="reset-btn" class="tool-btn">🔄 รีเซ็ต</button>
      <button id="expand-all-btn" class="tool-btn">🌐 ขยายทุก node</button>

    </div>
  </div>

  <div id="graph-container"></div>

  <button id="settings-toggle" title="ตั้งค่า">⚙️</button>
  <div id="settings-panel">
    <div class="setting-row"><span>🎵 เพลงพื้นหลัง</span><button id="music-toggle" class="switch-btn">ปิด</button></div>
    <div class="setting-row"><span>🌀 Motion (ดาวเคลื่อนไหว)</span><button id="motion-toggle" class="switch-btn on">เปิด</button></div>
    <div class="setting-row"><span>🔄 รีเซ็ตกราฟ</span><button id="reset-btn-menu" class="switch-btn">รีเซ็ต</button></div>
    <div class="setting-row"><span>🧠 เส้นแสงประสาท (Synapse)</span><button id="synapse-toggle" class="switch-btn on">เปิด</button></div>
    <div class="setting-row"><span>💫 เส้นขยับตาม (Flow)</span><button id="flow-toggle" class="switch-btn on">เปิด</button></div>
  </div>
  <audio id="bgm" loop preload="none">
    <source src="music/u_jltxwion0i-little-star-lullaby-417636.mp3" type="audio/mpeg">
  </audio>

  <div id="side-panel">
    <button class="close-btn" id="panel-close">✕</button>
    <div id="panel-body"></div>
  </div>

  <script>
  (async function () {
    const BOOK_INFO = {
      civil:         { title: 'ประมวลกฎหมายแพ่งและพาณิชย์' },
      civpro:        { title: 'ประมวลกฎหมายวิธีพิจารณาความแพ่ง' },
      criminal:      { title: 'ประมวลกฎหมายอาญา' },
      crimpro:       { title: 'ประมวลกฎหมายวิธีพิจารณาความอาญา' },
      constitution:  { title: 'พระธรรมนูญศาลยุติธรรม' },
      const2560:     { title: 'รัฐธรรมนูญแห่งราชอาณาจักรไทย พ.ศ. 2560' },
      adminproc:     { title: 'พ.ร.บ.วิธีปฏิบัติราชการทางปกครอง' },
      admincourt:    { title: 'พ.ร.บ.จัดตั้งศาลปกครองฯ' },
      tortofficials: { title: 'พ.ร.บ.ความรับผิดทางละเมิดของเจ้าหน้าที่' },
      politicalparty:{ title: 'พ.ร.ป.พรรคการเมือง พ.ศ. 2560' },
      copyright:     { title: 'พ.ร.บ.ลิขสิทธิ์ พ.ศ. 2537' },
      patent:        { title: 'พ.ร.บ.สิทธิบัตร พ.ศ. 2522' },
      trademark:     { title: 'พ.ร.บ.เครื่องหมายการค้า พ.ศ. 2534' },
      carriage:      { title: 'พ.ร.บ.การรับขนของทางทะเล พ.ศ. 2534' },
      ipcourt:       { title: 'พ.ร.บ.จัดตั้งศาลทรัพย์สินทางปัญญาฯ' },
    };
    // Top-level: exactly 6 category nodes under root, per user's explicit
    // grouping — expand each to reveal its member ประมวล/พระราชบัญญัติ.
    // Categories with exactly one book (civil/criminal/civpro/crimpro) skip
    // straight to that book's own บรรพ/ลักษณะ hierarchy on click — no
    // redundant middle node that's really just the same law under another
    // label. มหาชน has a real intermediate split (กฎหมายปกครอง / รัฐธรรมนูญ)
    // since it genuinely groups two distinct legal subfields.
    const GROUP_INFO = {
      civil:    { label: 'แพ่งและพาณิชย์', color: '#00e6ff', books: ['civil'] },
      civpro:   { label: 'วิแพ่ง',           color: '#00b8d9', books: ['civpro'] },
      criminal: { label: 'อาญา',            color: '#ff0055', books: ['criminal'] },
      crimpro:  { label: 'วิอาญา',           color: '#ff4d8d', books: ['crimpro'] },
      public:   { label: 'มหาชน', color: '#aa00ff', subgroups: {
                    adminlaw: { label: 'กฎหมายปกครอง', books: ['adminproc', 'admincourt', 'tortofficials'] },
                    constlaw: { label: 'รัฐธรรมนูญ',   books: ['constitution', 'const2560', 'politicalparty'] },
                  } },
      other:    { label: 'อื่นๆ', color: '#ff9900', books: ['copyright', 'patent', 'trademark', 'carriage', 'ipcourt'] },
    };
    const LEAF_COLOR = '#00ffcc';
    const CASE_COLOR = '#ffcc44';
    const LEVELS = ['phaak', 'laksana', 'muad', 'suan'];

    const elem = document.getElementById('graph-container');
    const loadingEl = document.getElementById('loading');
    const panel = document.getElementById('side-panel');
    const panelBody = document.getElementById('panel-body');

    let codex, articleIndex;
    try {
      [codex, articleIndex] = await Promise.all([
        fetch('codex-data.json', { cache: 'no-store' }).then(r => r.json()),
        fetch('prototype/assets/cases/article-case-index.json', { cache: 'no-store' }).then(r => r.ok ? r.json() : {}),
      ]);
    } catch (e) {
      loadingEl.innerHTML = '<div style="color:#ff8080">โหลดข้อมูลไม่สำเร็จ: ' + (e.message || e) + '</div>';
      return;
    }
    loadingEl.style.display = 'none';

    // codex-data.json leaves some articles' meta untagged at the source -
    // nextLevelGroups (below) silently drops any article whose level field
    // is falsy instead of grouping it, so an untagged run of articles just
    // vanishes from the graph rather than forming its own group. Worst case:
    // อาญา ภาค 1 (มาตรา 1-106, 111 articles incl. sub-numbers) has NO phaak
    // tag at all in the source (only ภาค 2/3 are explicitly tagged, ภาค 1
    // being the implicit "everything before ภาค 2" default) - the entire
    // ภาค disappears from the "อาญา" node's children without this patch.
    // Same corrections as neuralnetworklegalcode's gen-legal-hierarchy.js
    // script (verified there against the real article text).
    function patchArticleMeta(bookKey, number, meta) {
      const m = meta || {};
      const n = parseInt(String(number), 10);
      if (bookKey === 'criminal') {
        if (n === 1 && !m.muad) { m.muad = 'หมวด 1'; m.muadTitle = 'บทนิยาม'; }
        if (n <= 101 && !m.laksana) { m.laksana = 'ลักษณะ 1'; m.laksanaTitle = 'บทบัญญัติที่ใช้แก่ความผิดทั่วไป'; }
        if (n <= 106 && !m.phaak) { m.phaak = 'ภาค 1'; m.phaakTitle = 'บทบัญญัติทั่วไป'; }
      }
      if (bookKey === 'civil') {
        // upstream mislabels 754-769 (จำนำ content) as ลักษณะ 22 (โอนหุ้น/หุ้นกู้)
        if (n >= 754 && n <= 769 && m.laksana === 'ลักษณะ 22') { m.laksana = 'ลักษณะ 13'; m.laksanaTitle = 'จำนำ'; }
        if (n >= 754 && n <= 757 && !m.muad) { m.muad = 'หมวด 1'; m.muadTitle = 'บทเบ็ดเสร็จทั่วไป'; }
      }
      return m;
    }
    for (const bookKey in codex.books) {
      for (const number in codex.books[bookKey].articles) {
        const art = codex.books[bookKey].articles[number];
        art.meta = patchArticleMeta(bookKey, number, art.meta);
      }
    }

    // ---- graph state ----
    const nodesById = new Map();   // id -> node object (currently in graph)
    const childrenOf = new Map();  // parentId -> Set(childId)
    const links = [];              // {source, target} (ids, resolved by force-graph)

    function naturalArticleSort(a, b) {
      const pa = String(a).split('/').map(Number);
      const pb = String(b).split('/').map(Number);
      if (pa[0] !== pb[0]) return pa[0] - pb[0];
      return (pa[1] || 0) - (pb[1] || 0);
    }

    // Extract the leading number (+ optional /n suffix) out of a level label
    // like "ภาค 2", "ลักษณะ 1/1", "หมวด 10" so level-3+ nodes list in
    // numeric order instead of raw document/insertion order.
    function levelSortKey(value) {
      const m = String(value).match(/([0-9]+)(?:\/([0-9]+))?/);
      if (!m) return [Number.MAX_SAFE_INTEGER, 0];
      return [parseInt(m[1], 10), m[2] ? parseInt(m[2], 10) : 0];
    }
    function sortedGroupEntries(groupsMap) {
      return [...groupsMap.entries()].sort((a, b) => {
        const ka = levelSortKey(a[0]), kb = levelSortKey(b[0]);
        return ka[0] - kb[0] || ka[1] - kb[1];
      });
    }

    function articlesOf(bookKey) {
      return Object.values(codex.books[bookKey].articles);
    }

    function matchesFilters(article, filters) {
      const meta = article.meta || {};
      for (const k in filters) { if (meta[k] !== filters[k]) return false; }
      return true;
    }

    // Find the next hierarchy level (after startIdx) that has real groups among `arts`.
    function nextLevelGroups(arts, startIdx) {
      for (let i = startIdx; i < LEVELS.length; i++) {
        const lvl = LEVELS[i];
        const groups = new Map();
        for (const a of arts) {
          const v = (a.meta || {})[lvl];
          if (v) {
            if (!groups.has(v)) groups.set(v, { title: (a.meta || {})[lvl + 'Title'] || '', articles: [] });
            groups.get(v).articles.push(a);
          }
        }
        if (groups.size > 0) return { levelIndex: i, level: lvl, groups };
      }
      return null;
    }

    function addNode(node) {
      nodesById.set(node.id, node);
      return node;
    }

    // Force-directed physics doesn't respect insertion order for siblings'
    // vertical position, so a numeric sort alone (sortedGroupEntries) isn't
    // visible on screen — pin each sibling's y to a fixed, evenly-spaced
    // slot in that same sorted order so the numbering is actually readable
    // top-to-bottom, not just internally consistent.
    function pinSiblingsVertically(parentNode, childIds, baseSpacing) {
      const n = childIds.length;
      const baseY = parentNode.y || 0;
      // A flat spacing constant is fine for a handful of siblings, but a
      // dense ring (e.g. อาญา ภาค 2's 14 ลักษณะ, or a หมวด with dozens of
      // มาตรา leaves) needs proportionally more room per node once there
      // are enough of them that circles start touching each other - scale
      // the effective spacing up past 6 siblings (similar in spirit to
      // neuralnetworklegalcode's ringRadiusFor, which hits the identical
      // problem for its own radial layout).
      const spacing = n > 6 ? baseSpacing * (1 + (n - 6) * 0.12) : baseSpacing;
      childIds.forEach((id, i) => {
        const node = nodesById.get(id);
        const fy = baseY + (i - (n - 1) / 2) * spacing;
        node.fy = fy;
        node.y = fy;
      });
    }

    function addLink(a, b, nexus) {
      if (!links.some(l => (l.source === a && l.target === b) || (l.source === b && l.target === a))) {
        links.push(nexus ? { source: a, target: b, __nexus: true } : { source: a, target: b });
      }
    }

    function removeSubtree(id) {
      const kids = childrenOf.get(id);
      if (kids) {
        for (const kid of [...kids]) removeSubtree(kid);
        childrenOf.delete(id);
      }
      nodesById.delete(id);
      for (let i = links.length - 1; i >= 0; i--) {
        if (links[i].source === id || links[i].source?.id === id || links[i].target === id || links[i].target?.id === id) {
          links.splice(i, 1);
        }
      }
      // drop any case node left with zero remaining links
      for (const n of [...nodesById.values()]) {
        if (n.type === 'case') {
          const stillLinked = links.some(l => l.source === n.id || l.source?.id === n.id || l.target === n.id || l.target?.id === n.id);
          if (!stillLinked) { nodesById.delete(n.id); }
        }
      }
    }

    function refresh() {
      Graph.graphData({ nodes: [...nodesById.values()], links: links.map(l => ({ source: l.source, target: l.target, __nexus: l.__nexus })) });
    }

    // ---- root + 6 category nodes (level 0, always visible) ----
    // fy pinned explicitly (dagMode already hard-pins fx by level) — root was
    // previously the one main-tree node with a fully free coordinate, only
    // settling near y=0 by the coincidence of its 6 children's symmetric
    // spacing rather than by any real guarantee.
    addNode({ id: 'root', name: 'ระบบกฎหมายไทย', type: 'root', size: 8, color: '#ffffff', fy: 0 });
    for (const groupKey in GROUP_INFO) {
      const g = GROUP_INFO[groupKey];
      const id = 'group:' + groupKey;
      const node = { id, name: g.label, type: 'group', groupKey, size: 6, color: g.color };
      if (g.subgroups) node.subgroups = g.subgroups;
      else if (g.books.length === 1) node.bookKey = g.books[0]; // merge group+book, one fewer click
      else node.books = g.books;
      addNode(node);
      addLink('root', id);
    }
    // Force-directed physics doesn't respect insertion order any more for
    // these 6 top-level categories than it does for any other sibling set -
    // without pinning, they settle in whatever order the simulation happens
    // to converge to (observed: วิแพ่ง/มหาชน/แพ่งและพาณิชย์/วิอาญา/อาญา/อื่นๆ,
    // unrelated to GROUP_INFO's own order). Pin them the same way
    // pinSiblingsVertically already pins every deeper sibling set, so the
    // list actually reads top-to-bottom in GROUP_INFO's declared order
    // (แพ่ง วิแพ่ง อาญา วิอาญา มหาชน อื่นๆ).
    pinSiblingsVertically(nodesById.get('root'), Object.keys(GROUP_INFO).map(k => 'group:' + k), 30);
    childrenOf.set('root', new Set(Object.keys(GROUP_INFO).map(k => 'group:' + k)));

    // Used by both plain multi-book groups (e.g. อื่นๆ) and มหาชน's subgroups
    // (กฎหมายปกครอง / รัฐธรรมนูญ) — both just carry a `books` array.
    function expandGroup(node) {
      const kids = new Set();
      for (const bookKey of node.books) {
        const id = 'book:' + bookKey;
        addNode({ id, name: BOOK_INFO[bookKey].title, type: 'book', bookKey, size: 5.5, color: node.color, parentId: node.id });
        addLink(node.id, id);
        kids.add(id);
      }
      pinSiblingsVertically(node, [...kids], 22);
      childrenOf.set(node.id, kids);
    }

    function expandSubgroups(node) {
      const kids = new Set();
      for (const subKey in node.subgroups) {
        const sg = node.subgroups[subKey];
        const id = 'subgroup:' + node.groupKey + ':' + subKey;
        addNode({ id, name: sg.label, type: 'subgroup', groupKey: node.groupKey, books: sg.books, size: 5.5, color: node.color, parentId: node.id });
        addLink(node.id, id);
        kids.add(id);
      }
      pinSiblingsVertically(node, [...kids], 22);
      childrenOf.set(node.id, kids);
    }

    function expandBook(node) {
      const arts = articlesOf(node.bookKey);
      const found = nextLevelGroups(arts, 0);
      const kids = new Set();
      if (!found) {
        // no hierarchy at all (e.g. tortofficials) -> go straight to มาตรา leaves
        for (const a of arts.sort((x, y) => naturalArticleSort(x.number, y.number))) {
          const id = 'article:' + node.bookKey + ':' + a.number;
          addNode({ id, name: 'มาตรา ' + a.number, type: 'article', bookKey: node.bookKey, number: a.number, size: 3.2, color: LEAF_COLOR, parentId: node.id });
          addLink(node.id, id);
          kids.add(id);
        }
      } else {
        for (const [value, g] of sortedGroupEntries(found.groups)) {
          const id = 'lvl:' + node.bookKey + ':' + found.level + ':' + value;
          const label = g.title ? (value + ' ' + g.title) : value;
          addNode({ id, name: label, type: found.level, bookKey: node.bookKey, filters: { [found.level]: value }, levelIndex: found.levelIndex, size: 4, color: node.color, parentId: node.id });
          addLink(node.id, id);
          kids.add(id);
        }
      }
      pinSiblingsVertically(node, [...kids], 22);
      childrenOf.set(node.id, kids);
    }

    function expandLevelNode(node) {
      const arts = articlesOf(node.bookKey).filter(a => matchesFilters(a, node.filters));
      const found = nextLevelGroups(arts, node.levelIndex + 1);
      const kids = new Set();
      if (!found) {
        for (const a of arts.sort((x, y) => naturalArticleSort(x.number, y.number))) {
          const id = 'article:' + node.bookKey + ':' + a.number;
          addNode({ id, name: 'มาตรา ' + a.number, type: 'article', bookKey: node.bookKey, number: a.number, size: 3.2, color: LEAF_COLOR, parentId: node.id });
          addLink(node.id, id);
          kids.add(id);
        }
      } else {
        for (const [value, g] of sortedGroupEntries(found.groups)) {
          const filters = Object.assign({}, node.filters, { [found.level]: value });
          const id = 'lvl:' + node.bookKey + ':' + found.level + ':' + Object.values(filters).join('|');
          const label = g.title ? (value + ' ' + g.title) : value;
          addNode({ id, name: label, type: found.level, bookKey: node.bookKey, filters, levelIndex: found.levelIndex, size: 4, color: node.color, parentId: node.id });
          addLink(node.id, id);
          kids.add(id);
        }
      }
      pinSiblingsVertically(node, [...kids], 22);
      childrenOf.set(node.id, kids);
    }

    function expandArticle(node) {
      const key = node.bookKey + ':' + node.number;
      const cases = (articleIndex[key] || []).filter(c => c.public);
      const kids = new Set();
      for (const c of cases) {
        const id = 'case:' + c.id;
        if (!nodesById.has(id)) {
          addNode({ id, name: c.title, type: 'case', caseId: c.id, cat: c.cat, size: 4.2, color: CASE_COLOR });
        }
        addLink(node.id, id);
        kids.add(id);
      }
      childrenOf.set(node.id, kids);
    }

    function toggleExpand(node) {
      if (childrenOf.has(node.id) && childrenOf.get(node.id).size > 0) {
        removeSubtree_childrenOnly(node.id);
        return;
      }
      if (node.type === 'group' && node.bookKey) expandBook(node);
      else if (node.type === 'group' && node.subgroups) expandSubgroups(node);
      else if (node.type === 'group' || node.type === 'subgroup') expandGroup(node);
      else if (node.type === 'book') expandBook(node);
      else if (LEVELS.includes(node.type)) expandLevelNode(node);
      else if (node.type === 'article') expandArticle(node);
    }

    // collapse: remove this node's descendants but keep the node itself
    function removeSubtree_childrenOnly(id) {
      const kids = childrenOf.get(id);
      if (!kids) return;
      for (const kid of [...kids]) removeSubtree(kid);
      childrenOf.set(id, new Set());
    }

    // ---- Nexus overlay: fan a case out to the REAL มาตรา leaves it cites ----
    // (not duplicate lookalike nodes — clicking an issue jumps straight to the
    // same article node that lives in the real ประมวล tree, so there's only
    // ever one "true" node per มาตรา on screen.)

    // Expand a node only if it isn't already expanded — unlike toggleExpand,
    // never collapses. Used while silently walking a path down to a cited
    // มาตรา so we don't accidentally undo whatever the user already had open.
    function ensureExpanded(node) {
      if (!node) return;
      if (childrenOf.has(node.id) && childrenOf.get(node.id).size > 0) return;
      if (node.type === 'group' && node.bookKey) expandBook(node);
      else if (node.type === 'group' && node.subgroups) expandSubgroups(node);
      else if (node.type === 'group' || node.type === 'subgroup') expandGroup(node);
      else if (node.type === 'book') expandBook(node);
      else if (LEVELS.includes(node.type)) expandLevelNode(node);
    }

    function findGroupKeyForBook(bookKey) {
      for (const groupKey in GROUP_INFO) {
        const g = GROUP_INFO[groupKey];
        if (g.books && g.books.includes(bookKey)) return { groupKey, subKey: null };
        if (g.subgroups) {
          for (const subKey in g.subgroups) {
            if (g.subgroups[subKey].books.includes(bookKey)) return { groupKey, subKey };
          }
        }
      }
      return null;
    }

    // Walk root -> group -> (subgroup) -> book -> level* -> article, expanding
    // only what isn't already open, using the SAME id-construction rules as
    // expandBook/expandLevelNode so we land on the real node, not a copy.
    function revealArticlePath(bookKey, number) {
      const art = codex.books[bookKey] && codex.books[bookKey].articles[number];
      if (!art) return null;
      const meta = art.meta || {};

      const loc = findGroupKeyForBook(bookKey);
      if (!loc) return null;
      const groupNode = nodesById.get('group:' + loc.groupKey);
      ensureExpanded(groupNode);

      let current;
      if (loc.subKey) {
        ensureExpanded(nodesById.get('subgroup:' + loc.groupKey + ':' + loc.subKey));
        current = nodesById.get('book:' + bookKey);
      } else if (groupNode.bookKey === bookKey) {
        current = groupNode; // single-book group merged with its book node
      } else {
        current = nodesById.get('book:' + bookKey);
      }
      if (!current) return null;
      ensureExpanded(current);

      let filters = {};
      let first = true;
      for (const lvl of LEVELS) {
        if (!meta[lvl]) continue;
        filters = Object.assign({}, filters, { [lvl]: meta[lvl] });
        const id = first
          ? 'lvl:' + bookKey + ':' + lvl + ':' + meta[lvl]
          : 'lvl:' + bookKey + ':' + lvl + ':' + Object.values(filters).join('|');
        first = false;
        const lvlNode = nodesById.get(id);
        if (!lvlNode) return null; // hierarchy mismatch — bail gracefully, no crash
        ensureExpanded(lvlNode);
        current = lvlNode;
      }
      return nodesById.get('article:' + bookKey + ':' + number) || null;
    }

    // Just case ids — everything else (title, which มาตรา each issue cites,
    // INCLUDING companion articles like "288 ประกอบ 289") is read live from
    // the case's own prototype/assets/cases/<id>.json "provisions" section
    // at nexus-open time, via the same ref-parsing rules as
    // build-article-case-index.py. This used to be a hand-copied
    // {bookKey,number} per issue here — which is exactly how it went stale:
    // a case's provisions ref said "มาตรา 1452 ประกอบมาตรา 1495" but only
    // 1452 got hand-copied in, and a separate "มาตรา 289 (4)" ref was
    // missing its required "มาตรา 288 ประกอบ" companion in the SOURCE data
    // too. Deriving from the live provisions data means a future case only
    // needs its id added here — its citations (and any companions) are
    // exactly what's already written for the case's own reading page, with
    // nothing to keep in sync by hand.
    const NEXUS_CASE_IDS = ['nualchawee-legend-2502'];

    // Mirrors build-article-case-index.py's BOOK_MATCHERS / extract_numbers
    // — keep the two in sync if either changes (the Python script is the
    // index's source of truth; this is the same logic ported to JS since
    // the site has no build step to share code between them).
    const NEXUS_BOOK_MATCHERS = [
      ['civpro', ['ประมวลกฎหมายวิธีพิจารณาความแพ่ง', 'วิ.แพ่ง', 'วิธีพิจารณาความแพ่ง']],
      ['crimpro', ['ประมวลกฎหมายวิธีพิจารณาความอาญา', 'วิ.อาญา', 'วิธีพิจารณาความอาญา']],
      ['const2560', ['รัฐธรรมนูญแห่งราชอาณาจักรไทย พ.ศ. 2560', 'รัฐธรรมนูญ 2560', 'รัฐธรรมนูญแห่งราชอาณาจักรไทย']],
      ['constitution', ['พระธรรมนูญศาลยุติธรรม']],
      ['adminproc', ['วิธีปฏิบัติราชการทางปกครอง']],
      ['admincourt', ['จัดตั้งศาลปกครอง', 'ศาลปกครอง']],
      ['tortofficials', ['ความรับผิดทางละเมิดของเจ้าหน้าที่']],
      ['copyright', ['ลิขสิทธิ์']],
      ['patent', ['สิทธิบัตร']],
      ['trademark', ['เครื่องหมายการค้า']],
      ['carriage', ['รับขนของทางทะเล']],
      ['ipcourt', ['ศาลทรัพย์สินทางปัญญา']],
      ['politicalparty', ['พรรคการเมือง']],
      ['criminal', ['ประมวลกฎหมายอาญา', 'ป.อ.', '— อาญา', '-อาญา']],
      ['civil', ['ประมวลกฎหมายแพ่งและพาณิชย์', 'ป.พ.พ.', '— แพ่ง', '-แพ่ง']],
    ];
    function nexusGuessBook(ref, loc) {
      const hay = ref + ' ' + loc;
      for (const [book, needles] of NEXUS_BOOK_MATCHERS) {
        for (const needle of needles) if (hay.includes(needle)) return book;
      }
      return null;
    }
    function nexusExtractNumbers(ref) {
      const thaiDigits = '๐๑๒๓๔๕๖๗๘๙';
      const s = ref.replace(/[๐-๙]/g, d => String(thaiDigits.indexOf(d)));
      let nums = [...s.matchAll(/มาตรา\s*([0-9]+(?:\/[0-9]+)?)/g)].map(m => m[1]);
      if (nums.length === 0) nums = [...s.matchAll(/ม\.\s*([0-9]+(?:\/[0-9]+)?)/g)].map(m => m[1]);
      if (nums.length === 0) {
        const m = s.match(/^\s*([0-9]+(?:\/[0-9]+)?)\s/);
        if (m) nums = [m[1]];
      }
      return [...new Set(nums)];
    }
    // Label built from the ref itself (book-name prefix stripped), never
    // hand-typed — "มาตรา 288 ประกอบมาตรา 289 (4)" reads the companion
    // relationship straight off the same text the case page shows, so it
    // can't drift out of sync the way a hand-written summary could.
    function nexusRefLabel(ref) {
      const i = ref.indexOf('มาตรา');
      return i >= 0 ? ref.slice(i) : ref;
    }
    // The nexus hub/issues are deliberately NOT force-graph nodes. dagMode
    // re-pins every node's fx from graph topology on every single tick
    // (proven live: a hard fx set on a parentless "hub" node visibly reverted
    // to the DAG's own left-edge answer within ~2s, even with a per-frame
    // override in nodeCanvasObject racing it — physics ticks can run more
    // often than paint, so paint-time overrides don't reliably win). A fixed
    // HUD-style overlay drawn straight in screen space after the normal
    // graph render sidesteps the fight entirely: true screen-space pinning,
    // zero physics, and the only thing that still needs graph coordinates is
    // the *live* endpoint (the real มาตรา node), read fresh every frame via
    // graph2ScreenCoords so the connecting line still tracks it through pan/
    // zoom/collapse exactly as it visually moves.
    let nexusOverlay = null; // { caseId, title, issues: [{label, targets: [artNode, ...]}], targetIds }
    let nexusHoverIndex = null; // -1 = hub, 0..n-1 = that issue, null = none

    function nexusHubScreenPos() {
      return { x: Graph.width() * 0.94, y: Graph.height() * 0.5 };
    }
    function nexusIssueScreenPos(i, n) {
      const hub = nexusHubScreenPos();
      return { x: hub.x - 130, y: hub.y + (i - (n - 1) / 2) * 62 };
    }

    // Bumped by closeNexus (and thus by doReset, which calls it) so an
    // openNexus() call already in flight when the user resets mid-fetch
    // notices it's been superseded and discards its result instead of
    // re-opening the nexus a moment after the user just closed it.
    let nexusRequestId = 0;

    function closeNexus() {
      nexusRequestId++;
      if (!nexusOverlay) return;
      nexusOverlay = null;
      document.getElementById('nexus-nualchawee-btn').classList.remove('active');
    }

    async function openNexus(caseId) {
      if (!NEXUS_CASE_IDS.includes(caseId)) return;
      const myRequestId = ++nexusRequestId;
      let caseData;
      try {
        caseData = await fetch('prototype/assets/cases/' + caseId + '.json', { cache: 'no-store' }).then(r => r.json());
      } catch (e) {
        console.error('nexus: failed to load case data for ' + caseId, e);
        return;
      }
      if (myRequestId !== nexusRequestId) return; // superseded by a close/reopen while this was loading
      const provisions = (caseData.read && caseData.read.sections || []).find(s => s.key === 'provisions');
      const rawArticles = (provisions && provisions.content && provisions.content.articles) || [];
      const issues = rawArticles.map(a => {
        const ref = a.ref || '', loc = a.loc || '';
        const book = nexusGuessBook(ref, loc);
        const numbers = (book && (nexusExtractNumbers(ref).length ? nexusExtractNumbers(ref) : nexusExtractNumbers(loc))) || [];
        const targets = numbers
          .map(n => revealArticlePath(book, n)) // also expands the real tree path down to each one
          .filter(Boolean);
        return { label: nexusRefLabel(ref || loc), targets };
      }).filter(issue => issue.targets.length > 0);
      if (issues.length === 0) {
        console.warn('nexus: no matchable provisions articles for ' + caseId);
        return;
      }
      const targetIds = new Set(issues.flatMap(i => i.targets.map(t => t.id)));
      nexusOverlay = {
        caseId,
        title: (caseData.meta && (caseData.meta.title_display || caseData.meta.title)) || caseId,
        issues,
        targetIds,
      };
      document.getElementById('nexus-nualchawee-btn').classList.add('active');
      pendingFit = true;
      refresh();
    }

    // -1 = hub, 0..n-1 = that issue, null = nothing under the cursor
    function nexusHitTest(mx, my) {
      if (!nexusOverlay) return null;
      const hub = nexusHubScreenPos();
      if (Math.hypot(mx - hub.x, my - hub.y) <= 14) return -1;
      for (let i = 0; i < nexusOverlay.issues.length; i++) {
        const p = nexusIssueScreenPos(i, nexusOverlay.issues.length);
        if (Math.hypot(mx - p.x, my - p.y) <= 11) return i;
      }
      return null;
    }
    elem.addEventListener('mousemove', e => {
      if (!nexusOverlay) return;
      const rect = elem.getBoundingClientRect();
      const hit = nexusHitTest(e.clientX - rect.left, e.clientY - rect.top);
      nexusHoverIndex = hit;
      elem.style.cursor = hit !== null ? 'pointer' : '';
    });
    // Capture phase so this wins before force-graph's own click handling on
    // the canvas underneath — the overlay isn't part of its node/link data,
    // so force-graph has no idea these circles are there.
    elem.addEventListener('click', e => {
      const rect = elem.getBoundingClientRect();
      const hit = nexusHitTest(e.clientX - rect.left, e.clientY - rect.top);
      if (hit === null) return;
      e.stopPropagation();
      if (hit === -1) {
        window.open('prototype/read-case.html?id=' + encodeURIComponent(nexusOverlay.caseId), '_blank', 'noopener');
      } else {
        const issue = nexusOverlay.issues[hit];
        // A "288 ประกอบ 289" issue has 2 targets - open the base article
        // (targets are in the same order as the ref text, so [0] is
        // whichever the ref names first, normally the base provision).
        if (issue.targets[0]) renderArticlePanel(issue.targets[0]);
      }
    }, true);

    // onRenderFramePost's ctx is still under the graph's own pan/zoom
    // transform (same space nodeCanvasObject draws in) — it is NOT a raw
    // screen-pixel overlay. So "pinned to 82% of the screen" is achieved by
    // re-deriving the graph-space point under that screen position every
    // single frame via screen2GraphCoords (cheap, and correct however the
    // user has panned/zoomed), then drawing everything in that same graph
    // space with sizes divided by globalScale so they read as a CONSTANT
    // screen size — exactly how nodeCanvasObject keeps label text a fixed
    // size regardless of zoom.
    function drawNexusOverlay(ctx, globalScale) {
      if (!nexusOverlay) return;
      const hubScreen = nexusHubScreenPos();
      const hub = Graph.screen2GraphCoords(hubScreen.x, hubScreen.y);
      const n = nexusOverlay.issues.length;
      const t = performance.now() / 1000;
      const issuePos = nexusOverlay.issues.map((_, i) => {
        const s = nexusIssueScreenPos(i, n);
        return Graph.screen2GraphCoords(s.x, s.y);
      });
      // A target มาตรา node's own circle bobs via nodeCanvasObject's
      // "twinkling star" drift (dy += sin(...)*2.5) — using the node's raw
      // .y here would leave the line's tip pointing at where the circle
      // WAS, not where it's actually drawn this frame, i.e. exactly "ปลาย
      // เส้นไม่ขยับตาม node สุดท้าย". Mirror the identical formula so the
      // line always lands exactly on the visible (bobbing) circle.
      function targetVisualPos(node) {
        let y = node.y;
        if (motionEnabled && node.type !== 'root') {
          if (node.__phase === undefined) node.__phase = Math.random() * Math.PI * 2;
          y += Math.sin(performance.now() / 1000 * 1.3 + node.__phase) * 2.5;
        }
        return { x: node.x, y };
      }

      function synapseStroke(x1, y1, x2, y2, hovered, phase) {
        if (!synapseEffectEnabled) {
          ctx.strokeStyle = 'rgba(255, 204, 68, 0.35)';
          ctx.lineWidth = 1.4 / globalScale;
          ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
          return;
        }
        // Neon-on-black needs more than a flat stroke color: shadowBlur
        // fakes the diffuse glow of stacked drop-shadows, 'lighter' makes
        // crossing lines burn brighter like an actual current, and the
        // breathing alpha (brighter still on hover) is the requested idle
        // pulse instead of a static line.
        const breathe = 0.5 + Math.sin(t * 1.6 + phase) * 0.28;
        const alpha = hovered ? 1 : breathe;
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        ctx.shadowColor = '#ffcc44';
        ctx.shadowBlur = (hovered ? 22 : 12) / globalScale;
        ctx.strokeStyle = `rgba(255, 204, 68, ${alpha})`;
        ctx.lineWidth = (hovered ? 2.6 : 1.6) / globalScale;
        ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
        ctx.restore();
      }
      // A small dot riding along the line itself ("ให้เส้นขยับตามจุด") — the
      // line stays put, this is what actually reads as motion/current.
      // Independent of the synapseEffectEnabled glow toggle since it's a
      // separately requested option.
      function drawFlowDot(x1, y1, x2, y2, phase) {
        if (!nexusFlowEnabled) return;
        const speed = 0.28; // cycles per second
        const tt = ((t * speed + phase) % 1 + 1) % 1;
        const fx = x1 + (x2 - x1) * tt;
        const fy = y1 + (y2 - y1) * tt;
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        ctx.shadowColor = '#fff3c4';
        ctx.shadowBlur = 10 / globalScale;
        ctx.fillStyle = 'rgba(255, 245, 200, 0.95)';
        ctx.beginPath();
        ctx.arc(fx, fy, 2.6 / globalScale, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
      function drawDot(x, y, r, label, hovered, labelBelow) {
        const rr = (hovered ? r * 1.15 : r) / globalScale;
        ctx.beginPath();
        ctx.arc(x, y, rr, 0, Math.PI * 2);
        ctx.fillStyle = CASE_COLOR;
        ctx.shadowColor = CASE_COLOR;
        ctx.shadowBlur = (hovered ? 20 : 10) / globalScale;
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.font = `${12 / globalScale}px Sans-Serif`;
        ctx.fillStyle = 'rgba(255,255,255,0.9)';
        // The hub's own title runs long and sits at the SAME height as
        // whichever issue lands in the middle of the fan — placing it below
        // the circle instead of to the left (where every issue label
        // already lives) keeps the two from overlapping into an unreadable
        // smear regardless of how many issues a case has.
        if (labelBelow) {
          ctx.textAlign = 'center';
          ctx.textBaseline = 'top';
          ctx.fillText(label, x, y + rr + 6 / globalScale);
        } else {
          ctx.textAlign = 'right';
          ctx.textBaseline = 'middle';
          ctx.fillText(label, x - rr - 6 / globalScale, y);
        }
      }

      // lines first, then flow dots on top of them, then circles/labels on
      // top of everything — each pass fully separate so nothing paints over
      // a later pass by accident.
      const segments = []; // {x1,y1,x2,y2,phase} in hub -> issue -> target order
      nexusOverlay.issues.forEach((issue, i) => {
        const p = issuePos[i];
        const hoveredThis = nexusHoverIndex === -1 || nexusHoverIndex === i;
        synapseStroke(hub.x, hub.y, p.x, p.y, hoveredThis, i * 1.7);
        segments.push({ x1: hub.x, y1: hub.y, x2: p.x, y2: p.y, phase: i * 0.31 });
        // An issue citing a companion article ("288 ประกอบ 289") fans out to
        // EVERY real มาตรา node it names, not just one — each target's own
        // position (already graph-space, no duplicate law node) is read
        // live every frame, so every line keeps landing correctly through
        // pan/zoom/collapse AND tracks its bob (targetVisualPos above).
        issue.targets.forEach((art, j) => {
          const tp = targetVisualPos(art);
          synapseStroke(p.x, p.y, tp.x, tp.y, hoveredThis, i * 1.7 + 3.1 + j * 0.6);
          // Continues at the SAME phase+distance the hub->issue leg left
          // off (offset by that leg's own on-screen length) so the dot
          // reads as one continuous trip from hub to law, not two dots
          // restarting independently mid-fan.
          const leg1Len = Math.hypot(p.x - hub.x, p.y - hub.y);
          segments.push({ x1: p.x, y1: p.y, x2: tp.x, y2: tp.y, phase: i * 0.31 + leg1Len * 0.002 });
        });
      });
      segments.forEach(s => drawFlowDot(s.x1, s.y1, s.x2, s.y2, s.phase));
      nexusOverlay.issues.forEach((issue, i) => {
        const p = issuePos[i];
        drawDot(p.x, p.y, 8, issue.label, nexusHoverIndex === i);
      });
      drawDot(hub.x, hub.y, 11, nexusOverlay.title, nexusHoverIndex === -1, true);
    }

    function articleText(bookKey, number) {
      return (codex.books[bookKey].articles[number]) || null;
    }

    function resizeGraph() {
      const panelWidth = panel.classList.contains('open') ? Math.min(360, window.innerWidth * 0.88) : 0;
      Graph.width(window.innerWidth - panelWidth).height(window.innerHeight);
      Graph.zoomToFit(400, 70);
    }

    function showPanel(html) {
      panelBody.innerHTML = html;
      const wasOpen = panel.classList.contains('open');
      panel.classList.add('open');
      if (!wasOpen) setTimeout(resizeGraph, 260); // wait for the slide-in transition
    }
    function closePanel() {
      if (!panel.classList.contains('open')) return;
      panel.classList.remove('open');
      setTimeout(resizeGraph, 260);
    }
    document.getElementById('panel-close').onclick = closePanel;
    window.addEventListener('resize', resizeGraph);

    function escapeHtml(s) {
      return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    }

    function renderArticlePanel(node) {
      const art = articleText(node.bookKey, node.number);
      const bookTitle = BOOK_INFO[node.bookKey].title;
      const key = node.bookKey + ':' + node.number;
      const cases = (articleIndex[key] || []);
      let html = `<div class="kicker">${escapeHtml(bookTitle)}</div>`;
      html += `<h3>มาตรา ${escapeHtml(node.number)}${art && art.cancelled ? ' (ยกเลิกแล้ว)' : ''}</h3>`;
      if (art) {
        html += `<div class="article-text${art.cancelled ? ' cancelled' : ''}">${escapeHtml(art.text)}</div>`;
      } else {
        html += `<p class="empty-note">ไม่พบข้อความมาตรานี้ในฐานข้อมูล</p>`;
      }
      html += `<div class="section-title">📁 คดีตัวอย่างที่เชื่อมโยงกับมาตรานี้</div>`;
      const publicCases = cases.filter(c => c.public);
      if (publicCases.length === 0) {
        html += `<p class="empty-note">ยังไม่มีคดีตัวอย่างในระบบที่อ้างอิงมาตรานี้โดยตรง (เชื่อมอัตโนมัติจากคำอ้างอิงกฎหมายในไฟล์คดีจริงเท่านั้น ไม่มีการเชื่อมด้วยมือ)</p>`;
      } else {
        for (const c of publicCases) {
          html += `<a class="case-card" href="prototype/read-case.html?id=${encodeURIComponent(c.id)}" target="_blank" rel="noopener">
            ${escapeHtml(c.title)}
            <div class="cat">${escapeHtml(c.cat || '')}</div>
          </a>`;
        }
      }
      const gatedCount = cases.length - publicCases.length;
      if (gatedCount > 0) {
        html += `<p class="hint-note">มีอีก ${gatedCount} คดีที่อ้างอิงมาตรานี้แต่ยังไม่เผยแพร่ public จึงไม่แสดงที่นี่</p>`;
      }
      showPanel(html);
    }

    function renderCasePanel(node) {
      let html = `<div class="kicker">คดีตัวอย่าง</div>`;
      html += `<h3>${escapeHtml(node.name)}</h3>`;
      html += `<div class="meta-line">${escapeHtml(node.cat || '')}</div>`;
      html += `<a class="open-case-btn" href="prototype/read-case.html?id=${encodeURIComponent(node.caseId)}" target="_blank" rel="noopener">🔗 เปิดคดีเต็ม</a>`;
      html += `<div class="section-title">⚖ เชื่อมโยงกับมาตรา</div>`;
      const linkedArticles = links.filter(l => l.target === node.id || l.target?.id === node.id || l.source === node.id || l.source?.id === node.id)
        .map(l => { const other = (l.source === node.id || l.source?.id === node.id) ? l.target : l.source; return typeof other === 'string' ? nodesById.get(other) : other; })
        .filter(n => n && n.type === 'article');
      if (linkedArticles.length === 0) {
        html += `<p class="empty-note">—</p>`;
      } else {
        for (const a of linkedArticles) {
          html += `<span class="art-link">${escapeHtml(BOOK_INFO[a.bookKey] ? BOOK_INFO[a.bookKey].title : a.bookKey)} — มาตรา ${escapeHtml(a.number)}</span>`;
        }
      }
      showPanel(html);
    }

    let motionEnabled = true; // toggled via the ⚙️ settings panel

    // Shake a node hard for `duration`ms before its children actually
    // appear — a little suspense/impact beat before the graph "splits".
    // The jitter itself is drawn in nodeCanvasObject while __shaking is
    // true; .autoPauseRedraw(false) below keeps the canvas repainting every
    // frame so it's actually visible. Uses setTimeout (not rAF) to drive
    // the timing so the expand still fires reliably even if the tab is
    // backgrounded/throttled and frames aren't running.
    function shakeNode(node, duration, callback) {
      node.__shaking = true;
      setTimeout(() => {
        node.__shaking = false;
        callback();
      }, duration);
    }

    let synapseEffectEnabled = true; // toggled via the ⚙️ settings panel
    let nexusFlowEnabled = true; // toggled via the ⚙️ settings panel — a dot traveling along each nexus line

    const Graph = ForceGraph()(elem)
      .graphData({ nodes: [...nodesById.values()], links })
      .autoPauseRedraw(false) // keep repainting every frame — needed for both the shake effect and the perpetual star-motion bob
      .dagMode('lr')
      .dagLevelDistance(80)
      .linkDirectionalParticles(3)
      .linkDirectionalParticleWidth(2.2)
      .linkDirectionalParticleSpeed(0.005)
      .linkDirectionalParticleColor(link => (link.target && link.target.color) || '#ffffff')
      .linkColor(() => 'rgba(255, 255, 255, 0.12)')
      .nodeCanvasObject((node, ctx, globalScale) => {
        const label = node.name;
        const fontSize = 12 / globalScale;
        let radius = node.size;
        let dx = node.x, dy = node.y;
        // Gentle up/down "twinkling star" drift on every node except root.
        if (motionEnabled && node.type !== 'root') {
          if (node.__phase === undefined) node.__phase = Math.random() * Math.PI * 2;
          dy += Math.sin(performance.now() / 1000 * 1.3 + node.__phase) * 2.5;
        }
        if (node.__shaking) {
          const amp = 4;
          dx += (Math.random() - 0.5) * amp * 2;
          dy += (Math.random() - 0.5) * amp * 2;
          radius = node.size * (1 + Math.random() * 0.3);
        }
        ctx.beginPath();
        ctx.arc(dx, dy, radius, 0, 2 * Math.PI, false);
        ctx.fillStyle = node.color;
        ctx.shadowColor = node.color;
        ctx.shadowBlur = node.__shaking ? 28 : 15;
        ctx.fill();
        ctx.shadowBlur = 0;
        // While a nexus is open, its whole point is "these specific มาตรา
        // are what this case is about" — everything else's label is just
        // noise competing with the glowing lines pointing at them. Keep the
        // circles (so the tree's shape still reads) but only the nexus's
        // own real target nodes keep their text — and those need to stay
        // legible AT ANY ZOOM LEVEL (opening a nexus routinely zooms out
        // to fit both revealed trees, well past the normal globalScale>0.9
        // label cutoff), since they're the one thing the whole feature is
        // meant to point at.
        const isNexusTarget = nexusOverlay && nexusOverlay.targetIds.has(node.id);
        const showLabel = nexusOverlay ? isNexusTarget : globalScale > 0.9;
        if (showLabel) {
          // A forced nexus-target label can be showing at a globalScale far
          // below the normal >0.9 floor (nexus routinely zooms out to fit
          // two revealed trees) — clamp so it reads as a normal-sized label
          // instead of ballooning with 12/globalScale like an unclamped
          // zoomed-out node would.
          const clampedFontSize = isNexusTarget ? Math.min(fontSize, 14) : fontSize;
          ctx.font = `${clampedFontSize}px Sans-Serif`;
          ctx.textAlign = 'left';
          ctx.textBaseline = 'middle';
          ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
          ctx.fillText(label, dx + radius + 4, dy);
        }
      })
      .onNodeClick(node => {
        if (node.type === 'case') { renderCasePanel(node); return; }
        if (node.type === 'root') { return; } // root's 6 children are always visible - nothing to expand, no content to show
        if (node.__shaking) return; // already mid-shake, ignore rapid re-clicks

        const isCollapsing = childrenOf.has(node.id) && childrenOf.get(node.id).size > 0;
        const finish = () => {
          toggleExpand(node);
          // The side panel ("หมวดหมู่กฎหมาย" etc.) is real content only for
          // มาตรา (and คดี, handled above) - a navigational click through
          // group/subgroup/book/level nodes just expands/collapses that
          // node in place. Opening a generic panel for every click used to
          // leave it obstructing the graph (worst on mobile, where it eats
          // up to 88vw) for the entire time someone was just drilling
          // through categories, not reading a specific มาตรา.
          if (node.type === 'article') renderArticlePanel(node);
          else closePanel();
          refresh();
          // A full zoomToFit() on EVERY single expand/collapse used to
          // reframe the WHOLE graph each click — with the camera re-fitting
          // mid-tween on the next click before the previous tween even
          // finished, the picture never visually settled ("node runs off,
          // never stops"). Only bulk actions (reset/expand-all/nexus) below
          // opt into a real refit via `pendingFit`; an ordinary expand just
          // gently recenters on what was actually clicked, at the current
          // zoom level, so the rest of the graph holds still.
          if (!isCollapsing) Graph.centerAt(node.x, node.y, 400);
        };
        if (isCollapsing) finish();
        else shakeNode(node, 450, finish);
      })
      .onEngineStop(() => { if (pendingFit) { Graph.zoomToFit(400, 70); pendingFit = false; } })
      .onRenderFramePost((ctx, globalScale) => drawNexusOverlay(ctx, globalScale));

    // Charge (Coulomb-style, unbounded inverse-square repulsion) is the
    // wrong tool for "keep nodes from overlapping" here: every node's x is
    // hard-pinned by dagMode, and every sibling's y is hard-pinned by
    // pinSiblingsVertically the instant it's created — charge can't actually
    // move ANY of them apart once pinned, it just pushes on the handful of
    // still-free coordinates (root's y; a nexus/case node shared by several
    // distant parents) and, at high strength, destabilizes those without
    // fixing any real overlap. A collision force is the correct primitive
    // for "don't overlap": short-range, only pushes while circles actually
    // intersect, and always converges (unlike charge's endless-range tug).
    // Kept small/residual charge purely for a little organic settle on
    // whatever's still unpinned.
    const chargeForce = Graph.d3Force('charge');
    if (chargeForce) chargeForce.strength(-20);
    if (window.d3 && typeof window.d3.forceCollide === 'function') {
      Graph.d3Force('collide', window.d3.forceCollide(n => n.size + 3).strength(0.9));
    }

    let pendingFit = true; // fit-to-view on initial load; bulk actions below re-arm this

    function doReset() {
      closeNexus();
      for (const id of [...childrenOf.get('root')]) removeSubtree_childrenOnly(id);
      panel.classList.remove('open');
      pendingFit = true;
      refresh();
    }
    document.getElementById('reset-btn').onclick = doReset;
    document.getElementById('reset-btn-menu').onclick = doReset;

    // Expand one level deeper for every node currently on screen that isn't
    // expanded yet — a bounded "expand the visible frontier" action, not a
    // full recursive expand-to-every-มาตรา (codex-data.json has 4,275
    // articles; doing that in one click would just produce an unusable
    // hairball). Click repeatedly to keep drilling the whole visible graph.
    document.getElementById('expand-all-btn').onclick = () => {
      const toExpand = [...nodesById.values()].filter(n =>
        n.type !== 'root' && n.type !== 'case' &&
        (!childrenOf.has(n.id) || childrenOf.get(n.id).size === 0)
      );
      for (const n of toExpand) toggleExpand(n);
      pendingFit = true;
      refresh();
    };

    document.getElementById('nexus-nualchawee-btn').onclick = () => {
      if (nexusOverlay) closeNexus();
      else openNexus('nualchawee-legend-2502');
    };

    // ---- ⚙️ settings menu: hide/show, music, motion, reset ----
    const settingsToggle = document.getElementById('settings-toggle');
    const settingsPanel = document.getElementById('settings-panel');
    settingsToggle.onclick = () => settingsPanel.classList.toggle('open');

    const bgm = document.getElementById('bgm');
    const musicBtn = document.getElementById('music-toggle');
    musicBtn.onclick = () => {
      const turningOn = !musicBtn.classList.contains('on');
      if (turningOn) { bgm.play().catch(() => {}); musicBtn.textContent = 'เปิด'; }
      else { bgm.pause(); musicBtn.textContent = 'ปิด'; }
      musicBtn.classList.toggle('on', turningOn);
    };

    const motionBtn = document.getElementById('motion-toggle');
    motionBtn.onclick = () => {
      motionEnabled = !motionEnabled;
      motionBtn.textContent = motionEnabled ? 'เปิด' : 'ปิด';
      motionBtn.classList.toggle('on', motionEnabled);
    };

    const synapseBtn = document.getElementById('synapse-toggle');
    synapseBtn.onclick = () => {
      synapseEffectEnabled = !synapseEffectEnabled;
      synapseBtn.textContent = synapseEffectEnabled ? 'เปิด' : 'ปิด';
      synapseBtn.classList.toggle('on', synapseEffectEnabled);
    };

    const flowBtn = document.getElementById('flow-toggle');
    flowBtn.onclick = () => {
      nexusFlowEnabled = !nexusFlowEnabled;
      flowBtn.textContent = nexusFlowEnabled ? 'เปิด' : 'ปิด';
      flowBtn.classList.toggle('on', nexusFlowEnabled);
    };
  })();
  </script>
</body>
</html>
