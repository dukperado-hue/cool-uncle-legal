<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>โครงข่ายประสาทกฎหมายไทย (Neural Network) — Cool Uncle Legal Lab</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      overflow: hidden;
      background-color: #050510;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #fff;
    }
    #graph-container { width: 100vw; height: 100vh; }

    #ui-panel {
      position: absolute;
      top: 16px;
      left: 16px;
      max-width: 300px;
      pointer-events: none;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.35);
      z-index: 5;
    }
    #ui-panel h2 { margin: 0 0 10px; font-size: 20px; }
    .brand-row { pointer-events: auto; margin-bottom: 6px; }
    .brand-row a.back-link {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #7fd8ff;
      text-decoration: none;
      font-size: 12.5px;
    }
    .brand-row a.back-link:hover { text-decoration: underline; }
    .brand-logo { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; flex: 0 0 auto; }

    .graph-tools { display: flex; gap: 8px; pointer-events: auto; flex-wrap: wrap; }
    .tool-btn {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.25);
      color: #fff;
      font-size: 11px;
      padding: 5px 10px;
      border-radius: 14px;
      cursor: pointer;
    }
    .tool-btn:hover { background: rgba(255,255,255,0.18); }

    #settings-toggle {
      position: absolute; bottom: 16px; left: 16px; z-index: 6;
      width: 42px; height: 42px; border-radius: 50%;
      background: rgba(10,10,25,0.7); border: 1px solid rgba(255,255,255,0.25);
      color: #fff; font-size: 19px; cursor: pointer; pointer-events: auto;
    }
    #settings-toggle:hover { background: rgba(255,255,255,0.18); }
    #settings-panel {
      position: absolute; bottom: 66px; left: 16px; z-index: 6;
      background: rgba(10, 10, 25, 0.8); border: 1px solid rgba(255,255,255,0.15);
      border-radius: 10px; padding: 12px 14px; font-size: 12.5px;
      backdrop-filter: blur(4px); display: none; min-width: 220px;
      pointer-events: auto;
    }
    #settings-panel.open { display: block; }
    #settings-panel .setting-row {
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px; margin: 8px 0;
    }
    #settings-panel .switch-btn {
      background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.3);
      color: #fff; font-size: 11px; padding: 4px 12px; border-radius: 14px;
      cursor: pointer; min-width: 44px;
    }
    #settings-panel .switch-btn.on { background: #2ecc71; border-color: #2ecc71; color: #06210f; font-weight: 700; }

    #loading {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 10px;
      background: #050510; z-index: 20;
      font-size: 14px; color: #9fd8ff;
    }
    #loading .spinner {
      width: 34px; height: 34px; border-radius: 50%;
      border: 3px solid rgba(159,216,255,0.25);
      border-top-color: #9fd8ff;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #side-panel {
      position: absolute;
      top: 0; right: 0;
      width: 360px;
      max-width: 88vw;
      height: 100vh;
      background: rgba(8, 8, 20, 0.92);
      border-left: 1px solid rgba(255,255,255,0.12);
      backdrop-filter: blur(6px);
      transform: translateX(100%);
      transition: transform 0.25s ease;
      z-index: 10;
      padding: 20px 18px;
      overflow-y: auto;
    }
    #side-panel.open { transform: translateX(0); }
    #side-panel .close-btn {
      position: absolute; top: 12px; right: 14px;
      background: none; border: none; color: #aaa;
      font-size: 20px; cursor: pointer; line-height: 1;
    }
    #side-panel .close-btn:hover { color: #fff; }
    #side-panel .kicker {
      font-size: 11px; text-transform: uppercase; letter-spacing: .08em;
      opacity: .6; margin-bottom: 6px;
    }
    #side-panel h3 { margin: 0 0 10px; font-size: 18px; line-height: 1.4; }
    #side-panel .meta-line { font-size: 12px; opacity: .75; margin-bottom: 14px; }
    #side-panel .article-text {
      white-space: pre-wrap;
      font-size: 13.5px;
      line-height: 1.7;
      background: rgba(255,255,255,0.05);
      border-radius: 8px;
      padding: 12px 14px;
      margin-bottom: 16px;
      border: 1px solid rgba(255,255,255,0.08);
    }
    #side-panel .article-text.cancelled { opacity: .5; text-decoration: line-through; }
    #side-panel .section-title {
      font-size: 12px; font-weight: 700; letter-spacing: .03em;
      opacity: .8; margin: 18px 0 8px; display: flex; align-items: center; gap: 6px;
    }
    .case-card {
      display: block;
      background: rgba(255, 200, 60, 0.08);
      border: 1px solid rgba(255, 200, 60, 0.35);
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 8px;
      text-decoration: none;
      color: #fff;
      font-size: 13px;
      transition: background 0.15s;
    }
    .case-card:hover { background: rgba(255, 200, 60, 0.18); }
    .case-card .cat { font-size: 10.5px; opacity: .7; margin-top: 3px; }
    .case-card .gated {
      font-size: 10px; color: #ff9d9d; margin-top: 3px;
    }
    .empty-note { font-size: 12.5px; opacity: .6; font-style: italic; }
    .hint-note { font-size: 11.5px; opacity: .55; margin-top: 4px; }
    #side-panel .open-case-btn {
      display: inline-block;
      margin-top: 4px;
      background: #ffcc44;
      color: #1a1a1a;
      font-weight: 700;
      font-size: 12.5px;
      padding: 8px 14px;
      border-radius: 6px;
      text-decoration: none;
    }
    #side-panel .open-case-btn:hover { background: #ffd970; }
    #side-panel .art-link {
      display: block;
      font-size: 12.5px;
      color: #9fd8ff;
      text-decoration: none;
      padding: 4px 0;
    }
    #side-panel .art-link:hover { text-decoration: underline; }
  </style>
  <script src="https://unpkg.com/force-graph"></script>
</head>
<body>

  <div id="loading"><div class="spinner"></div><div>กำลังโหลดฐานข้อมูลกฎหมาย (codex-data.json)...</div></div>

  <div id="ui-panel">
    <div class="brand-row">
      <a class="back-link" href="index.html">
        <img class="brand-logo" src="pics/capybara-detective.png" alt="">
        <span>back to coolunclelab</span>
      </a>
    </div>
    <h2>รัศมีนิติธรรม</h2>
    <div class="graph-tools">
      <button id="reset-btn" class="tool-btn">🔄 รีเซ็ต</button>
      <button id="expand-all-btn" class="tool-btn">🌐 ขยายทุก node</button>
    </div>
  </div>

  <div id="graph-container"></div>

  <button id="settings-toggle" title="ตั้งค่า">⚙️</button>
  <div id="settings-panel">
    <div class="setting-row"><span>🎵 เพลงพื้นหลัง</span><button id="music-toggle" class="switch-btn">ปิด</button></div>
    <div class="setting-row"><span>🌀 Motion (ดาวเคลื่อนไหว)</span><button id="motion-toggle" class="switch-btn on">เปิด</button></div>
    <div class="setting-row"><span>🔄 รีเซ็ตกราฟ</span><button id="reset-btn-menu" class="switch-btn">รีเซ็ต</button></div>
  </div>
  <audio id="bgm" loop preload="none">
    <source src="music/u_jltxwion0i-little-star-lullaby-417636.mp3" type="audio/mpeg">
  </audio>

  <div id="side-panel">
    <button class="close-btn" id="panel-close">✕</button>
    <div id="panel-body"></div>
  </div>

  <script>
  (async function () {
    const BOOK_INFO = {
      civil:         { title: 'ประมวลกฎหมายแพ่งและพาณิชย์' },
      civpro:        { title: 'ประมวลกฎหมายวิธีพิจารณาความแพ่ง' },
      criminal:      { title: 'ประมวลกฎหมายอาญา' },
      crimpro:       { title: 'ประมวลกฎหมายวิธีพิจารณาความอาญา' },
      constitution:  { title: 'พระธรรมนูญศาลยุติธรรม' },
      const2560:     { title: 'รัฐธรรมนูญแห่งราชอาณาจักรไทย พ.ศ. 2560' },
      adminproc:     { title: 'พ.ร.บ.วิธีปฏิบัติราชการทางปกครอง' },
      admincourt:    { title: 'พ.ร.บ.จัดตั้งศาลปกครองฯ' },
      tortofficials: { title: 'พ.ร.บ.ความรับผิดทางละเมิดของเจ้าหน้าที่' },
      politicalparty:{ title: 'พ.ร.ป.พรรคการเมือง พ.ศ. 2560' },
      copyright:     { title: 'พ.ร.บ.ลิขสิทธิ์ พ.ศ. 2537' },
      patent:        { title: 'พ.ร.บ.สิทธิบัตร พ.ศ. 2522' },
      trademark:     { title: 'พ.ร.บ.เครื่องหมายการค้า พ.ศ. 2534' },
      carriage:      { title: 'พ.ร.บ.การรับขนของทางทะเล พ.ศ. 2534' },
      ipcourt:       { title: 'พ.ร.บ.จัดตั้งศาลทรัพย์สินทางปัญญาฯ' },
    };
    // Top-level: exactly 6 category nodes under root, per user's explicit
    // grouping — expand each to reveal its member ประมวล/พระราชบัญญัติ.
    // Categories with exactly one book (civil/criminal/civpro/crimpro) skip
    // straight to that book's own บรรพ/ลักษณะ hierarchy on click — no
    // redundant middle node that's really just the same law under another
    // label. มหาชน has a real intermediate split (กฎหมายปกครอง / รัฐธรรมนูญ)
    // since it genuinely groups two distinct legal subfields.
    const GROUP_INFO = {
      civil:    { label: 'แพ่งและพาณิชย์', color: '#00e6ff', books: ['civil'] },
      criminal: { label: 'อาญา',            color: '#ff0055', books: ['criminal'] },
      civpro:   { label: 'วิแพ่ง',           color: '#00b8d9', books: ['civpro'] },
      crimpro:  { label: 'วิอาญา',           color: '#ff4d8d', books: ['crimpro'] },
      public:   { label: 'มหาชน', color: '#aa00ff', subgroups: {
                    adminlaw: { label: 'กฎหมายปกครอง', books: ['adminproc', 'admincourt', 'tortofficials'] },
                    constlaw: { label: 'รัฐธรรมนูญ',   books: ['constitution', 'const2560', 'politicalparty'] },
                  } },
      other:    { label: 'อื่นๆ', color: '#ff9900', books: ['copyright', 'patent', 'trademark', 'carriage', 'ipcourt'] },
    };
    const KICKER_LABELS = { group: 'หมวดหมู่กฎหมาย', subgroup: 'หมวดหมู่ย่อย', book: 'ประมวล/พระราชบัญญัติ' };
    const LEAF_COLOR = '#00ffcc';
    const CASE_COLOR = '#ffcc44';
    const LEVELS = ['phaak', 'laksana', 'muad', 'suan'];

    const elem = document.getElementById('graph-container');
    const loadingEl = document.getElementById('loading');
    const panel = document.getElementById('side-panel');
    const panelBody = document.getElementById('panel-body');

    let codex, articleIndex;
    try {
      [codex, articleIndex] = await Promise.all([
        fetch('codex-data.json', { cache: 'no-store' }).then(r => r.json()),
        fetch('prototype/assets/cases/article-case-index.json', { cache: 'no-store' }).then(r => r.ok ? r.json() : {}),
      ]);
    } catch (e) {
      loadingEl.innerHTML = '<div style="color:#ff8080">โหลดข้อมูลไม่สำเร็จ: ' + (e.message || e) + '</div>';
      return;
    }
    loadingEl.style.display = 'none';

    // ---- graph state ----
    const nodesById = new Map();   // id -> node object (currently in graph)
    const childrenOf = new Map();  // parentId -> Set(childId)
    const links = [];              // {source, target} (ids, resolved by force-graph)

    function naturalArticleSort(a, b) {
      const pa = String(a).split('/').map(Number);
      const pb = String(b).split('/').map(Number);
      if (pa[0] !== pb[0]) return pa[0] - pb[0];
      return (pa[1] || 0) - (pb[1] || 0);
    }

    // Extract the leading number (+ optional /n suffix) out of a level label
    // like "ภาค 2", "ลักษณะ 1/1", "หมวด 10" so level-3+ nodes list in
    // numeric order instead of raw document/insertion order.
    function levelSortKey(value) {
      const m = String(value).match(/([0-9]+)(?:\/([0-9]+))?/);
      if (!m) return [Number.MAX_SAFE_INTEGER, 0];
      return [parseInt(m[1], 10), m[2] ? parseInt(m[2], 10) : 0];
    }
    function sortedGroupEntries(groupsMap) {
      return [...groupsMap.entries()].sort((a, b) => {
        const ka = levelSortKey(a[0]), kb = levelSortKey(b[0]);
        return ka[0] - kb[0] || ka[1] - kb[1];
      });
    }

    function articlesOf(bookKey) {
      return Object.values(codex.books[bookKey].articles);
    }

    function matchesFilters(article, filters) {
      const meta = article.meta || {};
      for (const k in filters) { if (meta[k] !== filters[k]) return false; }
      return true;
    }

    // Find the next hierarchy level (after startIdx) that has real groups among `arts`.
    function nextLevelGroups(arts, startIdx) {
      for (let i = startIdx; i < LEVELS.length; i++) {
        const lvl = LEVELS[i];
        const groups = new Map();
        for (const a of arts) {
          const v = (a.meta || {})[lvl];
          if (v) {
            if (!groups.has(v)) groups.set(v, { title: (a.meta || {})[lvl + 'Title'] || '', articles: [] });
            groups.get(v).articles.push(a);
          }
        }
        if (groups.size > 0) return { levelIndex: i, level: lvl, groups };
      }
      return null;
    }

    function addNode(node) {
      nodesById.set(node.id, node);
      return node;
    }

    // Force-directed physics doesn't respect insertion order for siblings'
    // vertical position, so a numeric sort alone (sortedGroupEntries) isn't
    // visible on screen — pin each sibling's y to a fixed, evenly-spaced
    // slot in that same sorted order so the numbering is actually readable
    // top-to-bottom, not just internally consistent.
    function pinSiblingsVertically(parentNode, childIds, spacing) {
      const n = childIds.length;
      const baseY = parentNode.y || 0;
      childIds.forEach((id, i) => {
        const node = nodesById.get(id);
        const fy = baseY + (i - (n - 1) / 2) * spacing;
        node.fy = fy;
        node.y = fy;
      });
    }

    function addLink(a, b) {
      if (!links.some(l => (l.source === a && l.target === b) || (l.source === b && l.target === a))) {
        links.push({ source: a, target: b });
      }
    }

    function removeSubtree(id) {
      const kids = childrenOf.get(id);
      if (kids) {
        for (const kid of [...kids]) removeSubtree(kid);
        childrenOf.delete(id);
      }
      nodesById.delete(id);
      for (let i = links.length - 1; i >= 0; i--) {
        if (links[i].source === id || links[i].source?.id === id || links[i].target === id || links[i].target?.id === id) {
          links.splice(i, 1);
        }
      }
      // drop any case node left with zero remaining links
      for (const n of [...nodesById.values()]) {
        if (n.type === 'case') {
          const stillLinked = links.some(l => l.source === n.id || l.source?.id === n.id || l.target === n.id || l.target?.id === n.id);
          if (!stillLinked) { nodesById.delete(n.id); }
        }
      }
    }

    function refresh() {
      Graph.graphData({ nodes: [...nodesById.values()], links: links.map(l => ({ source: l.source, target: l.target })) });
    }

    // ---- root + 6 category nodes (level 0, always visible) ----
    addNode({ id: 'root', name: 'ระบบกฎหมายไทย', type: 'root', size: 8, color: '#ffffff' });
    for (const groupKey in GROUP_INFO) {
      const g = GROUP_INFO[groupKey];
      const id = 'group:' + groupKey;
      const node = { id, name: g.label, type: 'group', groupKey, size: 6, color: g.color };
      if (g.subgroups) node.subgroups = g.subgroups;
      else if (g.books.length === 1) node.bookKey = g.books[0]; // merge group+book, one fewer click
      else node.books = g.books;
      addNode(node);
      addLink('root', id);
    }
    childrenOf.set('root', new Set(Object.keys(GROUP_INFO).map(k => 'group:' + k)));

    // Used by both plain multi-book groups (e.g. อื่นๆ) and มหาชน's subgroups
    // (กฎหมายปกครอง / รัฐธรรมนูญ) — both just carry a `books` array.
    function expandGroup(node) {
      const kids = new Set();
      for (const bookKey of node.books) {
        const id = 'book:' + bookKey;
        addNode({ id, name: BOOK_INFO[bookKey].title, type: 'book', bookKey, size: 5.5, color: node.color, parentId: node.id });
        addLink(node.id, id);
        kids.add(id);
      }
      pinSiblingsVertically(node, [...kids], 16);
      childrenOf.set(node.id, kids);
    }

    function expandSubgroups(node) {
      const kids = new Set();
      for (const subKey in node.subgroups) {
        const sg = node.subgroups[subKey];
        const id = 'subgroup:' + node.groupKey + ':' + subKey;
        addNode({ id, name: sg.label, type: 'subgroup', groupKey: node.groupKey, books: sg.books, size: 5.5, color: node.color, parentId: node.id });
        addLink(node.id, id);
        kids.add(id);
      }
      pinSiblingsVertically(node, [...kids], 16);
      childrenOf.set(node.id, kids);
    }

    function expandBook(node) {
      const arts = articlesOf(node.bookKey);
      const found = nextLevelGroups(arts, 0);
      const kids = new Set();
      if (!found) {
        // no hierarchy at all (e.g. tortofficials) -> go straight to มาตรา leaves
        for (const a of arts.sort((x, y) => naturalArticleSort(x.number, y.number))) {
          const id = 'article:' + node.bookKey + ':' + a.number;
          addNode({ id, name: 'มาตรา ' + a.number, type: 'article', bookKey: node.bookKey, number: a.number, size: 3.2, color: LEAF_COLOR, parentId: node.id });
          addLink(node.id, id);
          kids.add(id);
        }
      } else {
        for (const [value, g] of sortedGroupEntries(found.groups)) {
          const id = 'lvl:' + node.bookKey + ':' + found.level + ':' + value;
          const label = g.title ? (value + ' ' + g.title) : value;
          addNode({ id, name: label, type: found.level, bookKey: node.bookKey, filters: { [found.level]: value }, levelIndex: found.levelIndex, size: 4, color: node.color, parentId: node.id });
          addLink(node.id, id);
          kids.add(id);
        }
      }
      pinSiblingsVertically(node, [...kids], 10);
      childrenOf.set(node.id, kids);
    }

    function expandLevelNode(node) {
      const arts = articlesOf(node.bookKey).filter(a => matchesFilters(a, node.filters));
      const found = nextLevelGroups(arts, node.levelIndex + 1);
      const kids = new Set();
      if (!found) {
        for (const a of arts.sort((x, y) => naturalArticleSort(x.number, y.number))) {
          const id = 'article:' + node.bookKey + ':' + a.number;
          addNode({ id, name: 'มาตรา ' + a.number, type: 'article', bookKey: node.bookKey, number: a.number, size: 3.2, color: LEAF_COLOR, parentId: node.id });
          addLink(node.id, id);
          kids.add(id);
        }
      } else {
        for (const [value, g] of sortedGroupEntries(found.groups)) {
          const filters = Object.assign({}, node.filters, { [found.level]: value });
          const id = 'lvl:' + node.bookKey + ':' + found.level + ':' + Object.values(filters).join('|');
          const label = g.title ? (value + ' ' + g.title) : value;
          addNode({ id, name: label, type: found.level, bookKey: node.bookKey, filters, levelIndex: found.levelIndex, size: 4, color: node.color, parentId: node.id });
          addLink(node.id, id);
          kids.add(id);
        }
      }
      pinSiblingsVertically(node, [...kids], 10);
      childrenOf.set(node.id, kids);
    }

    function expandArticle(node) {
      const key = node.bookKey + ':' + node.number;
      const cases = (articleIndex[key] || []).filter(c => c.public);
      const kids = new Set();
      for (const c of cases) {
        const id = 'case:' + c.id;
        if (!nodesById.has(id)) {
          addNode({ id, name: c.title, type: 'case', caseId: c.id, cat: c.cat, size: 4.2, color: CASE_COLOR });
        }
        addLink(node.id, id);
        kids.add(id);
      }
      childrenOf.set(node.id, kids);
    }

    function toggleExpand(node) {
      if (childrenOf.has(node.id) && childrenOf.get(node.id).size > 0) {
        removeSubtree_childrenOnly(node.id);
        return;
      }
      if (node.type === 'group' && node.bookKey) expandBook(node);
      else if (node.type === 'group' && node.subgroups) expandSubgroups(node);
      else if (node.type === 'group' || node.type === 'subgroup') expandGroup(node);
      else if (node.type === 'book') expandBook(node);
      else if (LEVELS.includes(node.type)) expandLevelNode(node);
      else if (node.type === 'article') expandArticle(node);
    }

    // collapse: remove this node's descendants but keep the node itself
    function removeSubtree_childrenOnly(id) {
      const kids = childrenOf.get(id);
      if (!kids) return;
      for (const kid of [...kids]) removeSubtree(kid);
      childrenOf.set(id, new Set());
    }

    function articleText(bookKey, number) {
      return (codex.books[bookKey].articles[number]) || null;
    }

    function resizeGraph() {
      const panelWidth = panel.classList.contains('open') ? Math.min(360, window.innerWidth * 0.88) : 0;
      Graph.width(window.innerWidth - panelWidth).height(window.innerHeight);
      Graph.zoomToFit(400, 70);
    }

    function showPanel(html) {
      panelBody.innerHTML = html;
      const wasOpen = panel.classList.contains('open');
      panel.classList.add('open');
      if (!wasOpen) setTimeout(resizeGraph, 260); // wait for the slide-in transition
    }
    document.getElementById('panel-close').onclick = () => {
      panel.classList.remove('open');
      setTimeout(resizeGraph, 260);
    };
    window.addEventListener('resize', resizeGraph);

    function escapeHtml(s) {
      return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    }

    function renderArticlePanel(node) {
      const art = articleText(node.bookKey, node.number);
      const bookTitle = BOOK_INFO[node.bookKey].title;
      const key = node.bookKey + ':' + node.number;
      const cases = (articleIndex[key] || []);
      let html = `<div class="kicker">${escapeHtml(bookTitle)}</div>`;
      html += `<h3>มาตรา ${escapeHtml(node.number)}${art && art.cancelled ? ' (ยกเลิกแล้ว)' : ''}</h3>`;
      if (art) {
        html += `<div class="article-text${art.cancelled ? ' cancelled' : ''}">${escapeHtml(art.text)}</div>`;
      } else {
        html += `<p class="empty-note">ไม่พบข้อความมาตรานี้ในฐานข้อมูล</p>`;
      }
      html += `<div class="section-title">📁 คดีตัวอย่างที่เชื่อมโยงกับมาตรานี้</div>`;
      const publicCases = cases.filter(c => c.public);
      if (publicCases.length === 0) {
        html += `<p class="empty-note">ยังไม่มีคดีตัวอย่างในระบบที่อ้างอิงมาตรานี้โดยตรง (เชื่อมอัตโนมัติจากคำอ้างอิงกฎหมายในไฟล์คดีจริงเท่านั้น ไม่มีการเชื่อมด้วยมือ)</p>`;
      } else {
        for (const c of publicCases) {
          html += `<a class="case-card" href="prototype/read-case.html?id=${encodeURIComponent(c.id)}" target="_blank" rel="noopener">
            ${escapeHtml(c.title)}
            <div class="cat">${escapeHtml(c.cat || '')}</div>
          </a>`;
        }
      }
      const gatedCount = cases.length - publicCases.length;
      if (gatedCount > 0) {
        html += `<p class="hint-note">มีอีก ${gatedCount} คดีที่อ้างอิงมาตรานี้แต่ยังไม่เผยแพร่ public จึงไม่แสดงที่นี่</p>`;
      }
      showPanel(html);
    }

    function renderCasePanel(node) {
      let html = `<div class="kicker">คดีตัวอย่าง</div>`;
      html += `<h3>${escapeHtml(node.name)}</h3>`;
      html += `<div class="meta-line">${escapeHtml(node.cat || '')}</div>`;
      html += `<a class="open-case-btn" href="prototype/read-case.html?id=${encodeURIComponent(node.caseId)}" target="_blank" rel="noopener">🔗 เปิดคดีเต็ม</a>`;
      html += `<div class="section-title">⚖ เชื่อมโยงกับมาตรา</div>`;
      const linkedArticles = links.filter(l => l.target === node.id || l.target?.id === node.id || l.source === node.id || l.source?.id === node.id)
        .map(l => { const other = (l.source === node.id || l.source?.id === node.id) ? l.target : l.source; return typeof other === 'string' ? nodesById.get(other) : other; })
        .filter(n => n && n.type === 'article');
      if (linkedArticles.length === 0) {
        html += `<p class="empty-note">—</p>`;
      } else {
        for (const a of linkedArticles) {
          html += `<span class="art-link">${escapeHtml(BOOK_INFO[a.bookKey] ? BOOK_INFO[a.bookKey].title : a.bookKey)} — มาตรา ${escapeHtml(a.number)}</span>`;
        }
      }
      showPanel(html);
    }

    function renderGenericPanel(node) {
      const kickerText = KICKER_LABELS[node.type] || 'หมวดหมู่ย่อย';
      let html = `<div class="kicker">${kickerText}</div>`;
      html += `<h3>${escapeHtml(node.name)}</h3>`;
      const kids = childrenOf.get(node.id);
      html += `<p class="hint-note">${kids && kids.size ? 'คลิกโหนดนี้อีกครั้งเพื่อยุบชั้นย่อย' : 'คลิกโหนดนี้เพื่อขยายชั้นถัดไป'}</p>`;
      showPanel(html);
    }

    let motionEnabled = true; // toggled via the ⚙️ settings panel

    // Shake a node hard for `duration`ms before its children actually
    // appear — a little suspense/impact beat before the graph "splits".
    // The jitter itself is drawn in nodeCanvasObject while __shaking is
    // true; .autoPauseRedraw(false) below keeps the canvas repainting every
    // frame so it's actually visible. Uses setTimeout (not rAF) to drive
    // the timing so the expand still fires reliably even if the tab is
    // backgrounded/throttled and frames aren't running.
    function shakeNode(node, duration, callback) {
      node.__shaking = true;
      setTimeout(() => {
        node.__shaking = false;
        callback();
      }, duration);
    }

    const Graph = ForceGraph()(elem)
      .graphData({ nodes: [...nodesById.values()], links })
      .autoPauseRedraw(false) // keep repainting every frame — needed for both the shake effect and the perpetual star-motion bob
      .dagMode('lr')
      .dagLevelDistance(80)
      .linkColor(() => 'rgba(255, 255, 255, 0.12)')
      .linkDirectionalParticles(3)
      .linkDirectionalParticleWidth(2.2)
      .linkDirectionalParticleSpeed(0.005)
      .linkDirectionalParticleColor(link => (link.target && link.target.color) || '#ffffff')
      .nodeCanvasObject((node, ctx, globalScale) => {
        const label = node.name;
        const fontSize = 12 / globalScale;
        let radius = node.size;
        let dx = node.x, dy = node.y;
        // Gentle up/down "twinkling star" drift on every node except root.
        if (motionEnabled && node.type !== 'root') {
          if (node.__phase === undefined) node.__phase = Math.random() * Math.PI * 2;
          dy += Math.sin(performance.now() / 1000 * 1.3 + node.__phase) * 2.5;
        }
        if (node.__shaking) {
          const amp = 4;
          dx += (Math.random() - 0.5) * amp * 2;
          dy += (Math.random() - 0.5) * amp * 2;
          radius = node.size * (1 + Math.random() * 0.3);
        }
        ctx.beginPath();
        ctx.arc(dx, dy, radius, 0, 2 * Math.PI, false);
        ctx.fillStyle = node.color;
        ctx.shadowColor = node.color;
        ctx.shadowBlur = node.__shaking ? 28 : 15;
        ctx.fill();
        ctx.shadowBlur = 0;
        if (globalScale > 0.9) {
          ctx.font = `${fontSize}px Sans-Serif`;
          ctx.textAlign = 'left';
          ctx.textBaseline = 'middle';
          ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
          ctx.fillText(label, dx + radius + 4, dy);
        }
      })
      .onNodeClick(node => {
        if (node.type === 'root') { renderGenericPanel(node); refresh(); return; }
        if (node.type === 'case') { renderCasePanel(node); return; }
        if (node.__shaking) return; // already mid-shake, ignore rapid re-clicks

        const isCollapsing = childrenOf.has(node.id) && childrenOf.get(node.id).size > 0;
        const finish = () => {
          toggleExpand(node);
          if (node.type === 'article') renderArticlePanel(node);
          else renderGenericPanel(node);
          refresh();
        };
        if (isCollapsing) finish();
        else shakeNode(node, 450, finish);
      })
      .onEngineStop(() => Graph.zoomToFit(400, 70));

    // Tune the default charge force in place — avoids needing a separate
    // global `d3` import; force-graph already bundles d3-force internally
    // and registers a default 'charge' force we can just re-strength.
    // Weaker than before since nodes/spacing shrank too.
    const chargeForce = Graph.d3Force('charge');
    if (chargeForce) chargeForce.strength(-130);

    function doReset() {
      for (const id of [...childrenOf.get('root')]) removeSubtree_childrenOnly(id);
      panel.classList.remove('open');
      refresh();
    }
    document.getElementById('reset-btn').onclick = doReset;
    document.getElementById('reset-btn-menu').onclick = doReset;

    // Expand one level deeper for every node currently on screen that isn't
    // expanded yet — a bounded "expand the visible frontier" action, not a
    // full recursive expand-to-every-มาตรา (codex-data.json has 4,275
    // articles; doing that in one click would just produce an unusable
    // hairball). Click repeatedly to keep drilling the whole visible graph.
    document.getElementById('expand-all-btn').onclick = () => {
      const toExpand = [...nodesById.values()].filter(n =>
        n.type !== 'root' && n.type !== 'case' &&
        (!childrenOf.has(n.id) || childrenOf.get(n.id).size === 0)
      );
      for (const n of toExpand) toggleExpand(n);
      refresh();
    };

    // ---- ⚙️ settings menu: hide/show, music, motion, reset ----
    const settingsToggle = document.getElementById('settings-toggle');
    const settingsPanel = document.getElementById('settings-panel');
    settingsToggle.onclick = () => settingsPanel.classList.toggle('open');

    const bgm = document.getElementById('bgm');
    const musicBtn = document.getElementById('music-toggle');
    musicBtn.onclick = () => {
      const turningOn = !musicBtn.classList.contains('on');
      if (turningOn) { bgm.play().catch(() => {}); musicBtn.textContent = 'เปิด'; }
      else { bgm.pause(); musicBtn.textContent = 'ปิด'; }
      musicBtn.classList.toggle('on', turningOn);
    };

    const motionBtn = document.getElementById('motion-toggle');
    motionBtn.onclick = () => {
      motionEnabled = !motionEnabled;
      motionBtn.textContent = motionEnabled ? 'เปิด' : 'ปิด';
      motionBtn.classList.toggle('on', motionEnabled);
    };
  })();
  </script>
</body>
</html>
