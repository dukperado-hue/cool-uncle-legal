<title>สำลีแมวน้อยล่าผี · Cool Uncle Legal Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Noto+Serif+Thai:wght@600;700;900&family=Sarabun:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FBF9F4; --card:#FFFFFF; --ink:#22283A; --ink-soft:#5A6072; --ink-faint:#9AA0B0;
  --line:#E5E1D6; --gold:#B08A3C; --gold-soft:#F3E8CF; --ok:#1E7A4F; --ok-bg:#E6F4EC;
  --bad:#B23A3A; --bad-bg:#FBEAEA; --accent:#2E4A7A; --radius:14px;
  --shadow:0 1px 2px rgba(34,40,58,.05),0 6px 20px rgba(34,40,58,.07);
  /* retro-RPG battle palette (Mizuki/Junji Ito eerie night, cut with a warm cat gold) */
  --rpg-bg0:#0b0e14; --rpg-bg1:#141a24; --rpg-panel:#161c2c; --rpg-panel-ink:#1e2740;
  --rpg-border-lt:#5b6a8c; --rpg-border-dk:#04060a; --rpg-text:#EDEAE0;
  --rpg-hp-hi:#3fbf6a; --rpg-hp-mid:#e0b23f; --rpg-hp-lo:#e0453f; --rpg-exp:#4a90e2;
  --rpg-gold:#e0c34a;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Sarabun',system-ui,sans-serif; background:var(--paper); color:var(--ink);
  min-height:100vh; -webkit-text-size-adjust:100%;
}
h1,h2,h3{font-family:'Noto Serif Thai',serif}
.pixel{font-family:'Press Start 2P','JetBrains Mono',monospace}
button{font-family:inherit; cursor:pointer}
img{max-width:100%; display:block}

/* ============ TOP BAR (site-consistent) ============ */
.topbar{
  display:flex; align-items:center; gap:10px; background:#EFEAE0; border-bottom:1px solid var(--line);
  padding:10px 16px; font-size:13px; color:var(--ink-soft); position:sticky; top:0; z-index:50;
}
.topbar a.back{color:var(--accent); font-weight:700; text-decoration:none; display:flex; align-items:center; gap:4px}
.topbar a.back:hover{color:var(--ink)}
.topbar .brand{font-weight:800; color:var(--ink); margin-left:4px}
.topbar .right{margin-left:auto; display:flex; align-items:center; gap:10px}
.mute-btn{
  background:var(--card); border:1px solid var(--line); border-radius:999px; padding:6px 12px;
  font-size:13px; color:var(--ink-soft);
}
.mute-btn.active{background:var(--gold-soft); color:#8F6511; border-color:var(--gold)}
.score-hud{
  display:flex; align-items:center; gap:5px; background:var(--gold-soft); border:1px solid var(--gold);
  border-radius:999px; padding:6px 12px; font-weight:800; font-size:13px; color:#8F6511;
  font-family:'JetBrains Mono',monospace;
}
.score-hud.score-pulse{animation:scorePulse .45s ease}
@keyframes scorePulse{
  0%{transform:scale(1)}
  30%{transform:scale(1.18); box-shadow:0 0 0 4px rgba(224,195,74,.35)}
  100%{transform:scale(1)}
}
.combo-hud{
  display:none; align-items:center; gap:4px; background:linear-gradient(135deg,#ff7a3c,#e0453f); color:#fff;
  border-radius:999px; padding:6px 11px; font-weight:800; font-size:12px;
  font-family:'JetBrains Mono',monospace; box-shadow:0 2px 8px rgba(224,69,63,.4);
}
.combo-hud.show{display:flex}
.combo-hud.combo-pulse{animation:comboPulse .35s ease}
@keyframes comboPulse{
  0%{transform:scale(1) rotate(0)}
  40%{transform:scale(1.22) rotate(-3deg)}
  100%{transform:scale(1) rotate(0)}
}

/* ============ APP SHELL ============ */
.app{position:relative; max-width:960px; margin:0 auto; padding:20px 18px 70px}

/* ============ HOME / STATUS CARD ============ */
.lee-status{
  background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
  box-shadow:var(--shadow); padding:18px; display:flex; gap:16px; align-items:center; margin-bottom:18px;
}
.lee-portrait{
  position:relative; width:108px; height:108px; border-radius:18px; background:var(--gold-soft);
  display:flex; align-items:center; justify-content:center; flex-shrink:0; overflow:hidden;
  border:2px solid var(--gold);
}
.lee-portrait .fallback{font-size:54px}
.lee-portrait img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover}
.lee-info{flex:1; min-width:0}
.lee-info .name{font-weight:800; font-size:16px}
.lee-info .title{color:var(--ink-soft); font-size:12.5px; margin-top:1px}
.exp-track{height:9px; background:var(--line); border-radius:999px; margin-top:8px; overflow:hidden}
.exp-fill{height:100%; background:linear-gradient(90deg,var(--accent),#5f86d1); border-radius:999px; transition:width .4s ease}
.exp-label{font-size:11px; color:var(--ink-faint); margin-top:4px}

.menu-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px}
.menu-card{
  background:var(--card); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow);
  padding:26px 16px; text-align:center; text-decoration:none; color:var(--ink); transition:transform .15s ease;
}
.menu-card:hover{transform:translateY(-2px); border-color:var(--gold)}
.menu-card .icon{font-size:38px; margin-bottom:10px}
.menu-card .label{font-weight:700; font-size:16px}
.menu-card .sub{font-size:12.5px; color:var(--ink-soft); margin-top:3px}
.menu-card.hero-card{
  grid-column:1 / -1; min-height:200px; padding:0; text-align:left; overflow:hidden;
  background-size:cover; background-position:center 12%; position:relative; border-color:#000;
}
.menu-card.hero-card:hover{border-color:var(--rpg-gold)}
.menu-card.hero-card .hero-overlay{
  position:absolute; inset:0; display:flex; flex-direction:column; justify-content:flex-end;
  padding:16px 18px; background:linear-gradient(180deg,rgba(10,10,14,0) 30%,rgba(10,10,14,.92) 100%);
}
.menu-card.hero-card .icon{font-size:30px; margin-bottom:4px; filter:drop-shadow(0 2px 4px #000)}
.menu-card.hero-card .label{color:#fff; font-size:19px}
.menu-card.hero-card .sub{color:#d8d4e8}
@media(max-width:480px){.menu-card.hero-card{min-height:160px}}

/* ============ QUEST MODE PICKER ============ */
.mode-pick-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:6px}
.mode-pick-card{
  background:var(--card); border:2px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow);
  padding:30px 16px; text-align:center; color:var(--ink);
}
.mode-pick-card:hover{border-color:var(--accent); transform:translateY(-2px)}
.mode-pick-card .icon{font-size:36px; margin-bottom:10px}
.mode-pick-card .label{font-weight:800; font-size:16px}
.mode-pick-card .sub{font-size:12.5px; color:var(--ink-soft); margin-top:4px; line-height:1.5}
@media(max-width:480px){.mode-pick-grid{grid-template-columns:1fr}}

/* ============ QUEST BOARD ============ */
.section-title{font-size:18px; font-weight:800; margin:4px 0 12px}
.subject-tabs{display:flex; gap:8px; overflow-x:auto; padding-bottom:6px; margin-bottom:14px}
.subject-tab{
  flex-shrink:0; background:var(--card); border:1px solid var(--line); border-radius:999px;
  padding:7px 14px; font-size:13px; font-weight:700; color:var(--ink-soft); white-space:nowrap;
}
.subject-tab.active{background:var(--accent); color:#fff; border-color:var(--accent)}
.subject-tab.locked{opacity:.5}
.quest-card{
  background:var(--card); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow);
  padding:14px; display:flex; gap:12px; align-items:center; margin-bottom:10px; position:relative;
}
.quest-hot-star{
  position:absolute; top:-7px; right:-7px; font-size:15px; line-height:1;
  background:var(--gold); color:#3a2a00; width:24px; height:24px; border-radius:50%;
  display:flex; align-items:center; justify-content:center; box-shadow:0 2px 6px rgba(0,0,0,.25);
  border:2px solid var(--card);
}
.quest-icon{font-size:28px; width:46px; text-align:center; flex-shrink:0}
.quest-meta{flex:1; min-width:0}
.quest-meta .name{font-weight:700; font-size:14.5px}
.quest-meta .enemy{font-size:12px; color:var(--ink-soft); margin-top:1px}
.quest-meta .stars{font-size:11px; color:var(--gold); margin-top:3px}
.quest-play{
  background:var(--accent); color:#fff; border:none; border-radius:10px; padding:9px 14px;
  font-weight:700; font-size:12.5px; flex-shrink:0;
}
.quest-play:hover{filter:brightness(1.08)}
.locked-note{
  text-align:center; color:var(--ink-faint); font-size:13px; padding:30px 10px;
  background:var(--card); border:1px dashed var(--line); border-radius:var(--radius);
}

/* ============ ล่าผี WORLD MAP ("LAW PLAYER SELECT" pixel-art illustration) ============ */
.worldmap-wrap{
  position:relative; width:100%; aspect-ratio:2752/1536; border-radius:16px; overflow:hidden;
  background:#0d1120; border:3px solid var(--rpg-border-dk); box-shadow:0 0 0 2px var(--rpg-gold) inset;
}
.worldmap-wrap img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block}
.worldmap-node{
  position:absolute; transform:translate(-50%,-50%); width:9%; aspect-ratio:.72/1; border-radius:8px;
  display:flex; align-items:center; justify-content:center; text-decoration:none;
}
.worldmap-node.unlocked{cursor:pointer; box-shadow:0 0 0 3px rgba(224,195,74,.9), 0 0 16px rgba(224,195,74,.65); animation:worldmapPulse 1.6s ease-in-out infinite}
.worldmap-node.unlocked:active{transform:translate(-50%,-50%) scale(.94)}
@keyframes worldmapPulse{0%,100%{box-shadow:0 0 0 3px rgba(224,195,74,.85), 0 0 12px rgba(224,195,74,.55)} 50%{box-shadow:0 0 0 3px rgba(224,195,74,1), 0 0 24px rgba(224,195,74,.95)}}
.worldmap-node.locked{background:rgba(6,8,14,.6)}
.worldmap-lock{font-size:min(4vw,22px)}
@media(max-width:420px){.worldmap-node{width:11%}}

/* ============ BATTLE SCREEN — early-2000s RPG chrome ============ */
.battle-wrap{
  background:
    radial-gradient(120% 70% at 50% 0%, #1c2338 0%, var(--rpg-bg0) 70%);
  border-radius:16px; padding:14px 12px 0; color:var(--rpg-text); overflow:hidden;
  box-shadow:0 10px 32px rgba(0,0,0,.35);
}
.battle-stage{position:relative; min-height:300px; border-radius:10px; overflow:hidden;
  background:linear-gradient(180deg,#232a42 0%,#141a2c 60%,#0b0e18 100%); margin-bottom:10px;}
.battle-stage::before{ /* eerie fog */
  content:""; position:absolute; inset:0;
  background:radial-gradient(60% 40% at 20% 90%, rgba(255,255,255,.05), transparent 70%);
  pointer-events:none;
}
.combatant{position:absolute; display:flex; flex-direction:column; align-items:center; gap:8px}
.combatant.enemy{top:18px; right:28px}
.combatant.player{bottom:14px; left:24px}
.sprite-wrap{position:relative; width:108px; height:108px; display:flex; align-items:center; justify-content:center}
.sprite-fallback{font-size:66px; filter:drop-shadow(0 6px 8px rgba(0,0,0,.5))}
.sprite-wrap img{position:absolute; inset:0; width:100%; height:100%; object-fit:contain}
.combatant.enemy .sprite-fallback{filter:drop-shadow(0 6px 10px rgba(0,0,0,.6)) saturate(1.1)}
.hit-shake{animation:hitShake .35s ease}
@keyframes hitShake{
  0%,100%{transform:translateX(0)} 20%{transform:translateX(-6px) rotate(-2deg)}
  40%{transform:translateX(5px) rotate(2deg)} 60%{transform:translateX(-4px)} 80%{transform:translateX(3px)}
}
.attack-lunge{animation:atkLunge .4s ease}
@keyframes atkLunge{
  0%,100%{transform:translateX(0)} 40%{transform:translateX(-14px) scale(1.06)}
}
.dmg-pop{
  position:absolute; top:-6px; left:50%; transform:translateX(-50%);
  font-family:'Press Start 2P',monospace; font-size:13px; color:var(--rpg-hp-lo);
  text-shadow:2px 2px 0 #000; animation:dmgPop .8s ease forwards; pointer-events:none;
}
.dmg-pop.heal{color:var(--rpg-hp-hi)}
@keyframes dmgPop{0%{opacity:0; transform:translate(-50%,4px)} 20%{opacity:1} 100%{opacity:0; transform:translate(-50%,-26px)}}

/* ============ ARCADE SCORE BREAKDOWN (inline, lives inside the result/recite
   card itself — not a separate floating popup — so it appears on the same
   screen as the win/lose menu instead of over the battle scene behind it) ============ */
.result-score-breakdown{
  margin:12px 0; padding:10px 14px; background:rgba(0,0,0,.28); border:1px solid var(--rpg-border-lt);
  border-radius:8px; font-family:'JetBrains Mono',monospace; text-align:left;
}
.sb-line{
  display:flex; justify-content:space-between; gap:18px; font-size:11.5px; color:#c9cede;
  padding:2px 0; opacity:0; animation:sbLineIn .25s ease forwards;
}
@keyframes sbLineIn{from{opacity:0; transform:translateX(-6px)} to{opacity:1; transform:translateX(0)}}
.sb-val.plus{color:var(--rpg-hp-hi)}
.sb-val.mult{color:var(--rpg-gold); font-weight:800}
.sb-rule{height:1px; background:var(--rpg-border-lt); margin:6px 0; opacity:.5}
.sb-total{
  display:flex; justify-content:space-between; gap:18px; font-family:'Press Start 2P',monospace;
  font-size:12px; color:var(--rpg-gold); opacity:0; text-shadow:0 0 10px rgba(224,195,74,.6);
  animation:sbTotalIn .3s cubic-bezier(.2,1.4,.35,1) forwards;
}
@keyframes sbTotalIn{from{opacity:0; transform:scale(1.4)} to{opacity:1; transform:scale(1)}}
@media(max-width:420px){
  .sb-line{font-size:10px} .sb-total{font-size:10.5px}
}

.hud{width:180px; background:var(--rpg-panel); border:2px solid var(--rpg-border-dk);
  box-shadow:0 0 0 2px var(--rpg-border-lt), 0 3px 0 rgba(0,0,0,.4); border-radius:4px; padding:6px 8px;}
.hud .who{font-size:10.5px; font-weight:700; margin-bottom:4px; color:var(--rpg-gold); letter-spacing:.02em}
.hp-track{height:10px; background:#3a0f10; border-radius:2px; overflow:hidden; box-shadow:inset 0 0 0 1px #000}
.hp-fill{height:100%; background:linear-gradient(180deg,var(--rpg-hp-hi),#2c9450); transition:width .5s ease}
.hp-fill.mid{background:linear-gradient(180deg,var(--rpg-hp-mid),#b5872c)}
.hp-fill.lo{background:linear-gradient(180deg,var(--rpg-hp-lo),#a32a25)}
.hp-num{font-size:9.5px; margin-top:3px; color:#c9cede; text-align:right; font-family:'JetBrains Mono',monospace}

.timer-track{height:6px; background:#0d1120; border-radius:3px; overflow:hidden; margin:10px 0 8px}
.timer-fill{height:100%; background:var(--rpg-hp-hi); transition:width .2s linear, background .3s}
.timer-fill.mid{background:var(--rpg-hp-mid)}
.timer-fill.lo{background:var(--rpg-hp-lo)}

.dialogue-box{
  background:var(--rpg-panel-ink); border:3px solid var(--rpg-border-dk);
  box-shadow:0 0 0 2px var(--rpg-border-lt) inset; border-radius:6px;
  padding:14px 14px 16px; margin-bottom:12px;
}
.dialogue-tag{font-size:10px; color:var(--rpg-gold); margin-bottom:6px; letter-spacing:.03em}
.dialogue-text{font-size:15.5px; line-height:1.65; color:var(--rpg-text); min-height:44px}
.answer-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:14px}
.answer-btn{
  background:#0f1424; border:2px solid var(--rpg-border-lt); color:var(--rpg-text);
  border-radius:6px; padding:13px 12px; font-size:13.5px; text-align:left; line-height:1.45;
  transition:all .12s ease;
}
.answer-btn:hover:not(:disabled){background:#1a2140; border-color:var(--rpg-gold)}
.answer-btn:disabled{opacity:.55}
.answer-btn.correct{background:#123a24; border-color:var(--rpg-hp-hi); color:#bdf5d2}
.answer-btn.wrong{background:#3a1414; border-color:var(--rpg-hp-lo); color:#f5c7c3}
@media(max-width:420px){.answer-grid{grid-template-columns:1fr}}

.battle-footer{padding:12px 0 16px; text-align:center}
.battle-footer .flavor{font-size:11.5px; color:#8891ab}

.result-overlay{
  position:fixed; inset:0; background:rgba(6,8,14,.86); z-index:100;
  display:flex; align-items:center; justify-content:center; padding:20px;
}
.result-card{
  background:var(--rpg-panel); border:3px solid var(--rpg-border-dk); box-shadow:0 0 0 2px var(--rpg-gold) inset;
  border-radius:10px; padding:26px 22px; max-width:360px; width:100%; text-align:center; color:var(--rpg-text);
}
.result-card h2{font-family:'Press Start 2P',monospace; font-size:16px; margin-bottom:12px; line-height:1.6}
.result-card.win h2{color:var(--rpg-hp-hi)}
.result-card.lose h2{color:var(--rpg-hp-lo)}
.result-card p{font-size:13px; color:#c9cede; margin-bottom:6px}
.result-actions{display:flex; gap:8px; justify-content:center; margin-top:16px}
.result-btn{
  background:var(--rpg-gold); color:#1a1200; border:none; border-radius:8px; padding:10px 16px;
  font-weight:800; font-size:12.5px;
}
.result-btn.secondary{background:transparent; border:1px solid var(--rpg-border-lt); color:var(--rpg-text)}
.evo-banner{
  font-family:'Press Start 2P',monospace; font-size:11px; color:var(--rpg-gold); line-height:1.9; margin:16px 4px;
  animation:evoGlow 1.4s ease-in-out infinite alternate;
}
@keyframes evoGlow{from{text-shadow:0 0 4px rgba(224,195,74,.3)} to{text-shadow:0 0 14px rgba(224,195,74,.9)}}

/* ============ VS INTRO (Capcom-style pre-fight stinger) ============ */
.vs-intro-overlay{
  position:fixed; inset:0; z-index:110; background:#000; overflow:hidden;
  display:flex; align-items:center; justify-content:center; gap:18vw;
  animation:vsBgFlash .5s ease;
}
.vs-intro-overlay.vs-out{animation:vsFadeOut .3s ease forwards}
@keyframes vsBgFlash{0%{background:#fff} 35%{background:#0a0a0a} 100%{background:#000}}
@keyframes vsFadeOut{to{opacity:0}}
.vs-fighter{display:flex; flex-direction:column; align-items:center; gap:10px}
.vs-fighter .sprite-wrap{width:118px; height:118px}
.vs-fighter .sprite-fallback{font-size:70px}
.vs-fighter-left{animation:vsInLeft .5s cubic-bezier(.2,.85,.25,1.15) both}
.vs-fighter-right{animation:vsInRight .5s cubic-bezier(.2,.85,.25,1.15) both}
@keyframes vsInLeft{from{transform:translateX(-50vw); opacity:0} to{transform:translateX(0); opacity:1}}
@keyframes vsInRight{from{transform:translateX(50vw); opacity:0} to{transform:translateX(0); opacity:1}}
.vs-name{font-family:'Press Start 2P',monospace; font-size:11px; color:var(--rpg-text); text-shadow:2px 2px 0 #000}
.vs-text{
  position:absolute; left:50%; top:50%; font-family:'Press Start 2P',monospace; font-size:clamp(38px,8vw,84px); color:var(--rpg-gold);
  text-shadow:3px 3px 0 #000,-3px -3px 0 #000, 0 0 30px rgba(224,195,74,.8); opacity:0; white-space:nowrap;
  animation:vsPop .45s cubic-bezier(.15,1.5,.4,1) .3s forwards;
}
@keyframes vsPop{
  0%{transform:translate(-50%,-50%) scale(2.6) rotate(-10deg); opacity:0}
  60%{transform:translate(-50%,-50%) scale(.88) rotate(4deg); opacity:1}
  100%{transform:translate(-50%,-50%) scale(1) rotate(0deg); opacity:1}
}
@media(max-width:480px){
  .vs-intro-overlay{gap:12vw}
  .vs-fighter .sprite-wrap{width:78px; height:78px}
  .vs-fighter .sprite-fallback{font-size:46px}
  .vs-text{font-size:clamp(28px,11vw,40px)}
}

/* ============ GHOST DEFEATED FLASH (Mega-Man-style boss-down stinger) ============ */
.defeat-flash-overlay{
  position:fixed; inset:0; z-index:105; background:#000; overflow:hidden; cursor:pointer;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px;
  animation:defeatBgFlash .9s ease forwards;
}
@keyframes defeatBgFlash{0%{background:#fff} 10%{background:#fff} 22%{background:#050505} 100%{background:#050505}}
.defeat-shadow-sweep{
  position:absolute; inset:-30% -70%; z-index:1; pointer-events:none;
  background:linear-gradient(100deg, transparent 42%, rgba(255,255,255,.22) 48%, rgba(255,255,255,.4) 50%, rgba(255,255,255,.22) 52%, transparent 58%);
  transform:translateX(-140%); animation:defeatSweep .9s ease .18s forwards;
}
@keyframes defeatSweep{to{transform:translateX(140%)}}
.defeat-ghost-wrap{
  position:relative; z-index:2; width:150px; height:150px; opacity:0; transform:scale(.6);
  animation:defeatGhostPop .75s cubic-bezier(.2,1.4,.35,1) .12s forwards;
}
.defeat-ghost-wrap .sprite-fallback{font-size:100px}
@keyframes defeatGhostPop{
  0%{opacity:0; transform:scale(.6) translateX(0)}
  40%{opacity:1; transform:scale(1.06) translateX(0)}
  48%{transform:scale(1) translateX(-7px)}
  56%{transform:scale(1) translateX(6px)}
  64%{transform:scale(1) translateX(-5px)}
  72%{transform:scale(1) translateX(4px)}
  80%{transform:scale(1) translateX(-2px)}

<script>
/* ================================================================
   สำลีแมวน้อยล่าผี — turn-based law-quiz RPG
   Self-contained page (no build step), following the same pattern as
   game-crimlaw-scenario.html: one file, inline state machine, render()
   dispatches on state.screen, graceful image fallback, shared mute key.
   ================================================================ */

const MUTE_KEY = 'codex-drone-muted'; // shared site-wide mute toggle
const SAVE_KEY = 'leeRpgSave_v1';
const DATA_URL = 'games/rpg-data.json?v=20260819b';
const CODEX_URL = 'codex-data.json';
const UNLOCK_THRESHOLD = 3; // correct answers on a มาตรา before its Lawbook entry unlocks

let DATA = null;
let codexCache = null; // lazy-loaded full law database, only fetched when Lawbook opens

const state = {
  screen: 'loading', // loading|home|quest|training|lawbook|battle|reciteTopicPick|reciteSubgroupPick|reciteQuiz|stats
  questSubject: 'civil',
  save: loadSave(),
  battle: null,
  reciteTopicId: null,
  reciteSubgroupId: null,
  reciteQuiz: null, // { pool:[{book,article}], qIndex, current, locked, startedAt, feedback, session:{correct,attempts,scoreEarned,baseTotal,bonusTotal,timeTotal,comboMult} }
};

function loadSave(){
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (!parsed.unlockedGhosts) parsed.unlockedGhosts = {};
      if (!parsed.reciteDone) parsed.reciteDone = {};
      if (typeof parsed.score !== 'number') parsed.score = 0;
      if (typeof parsed.combo !== 'number') parsed.combo = 0;
      if (!parsed.subjectStats) parsed.subjectStats = {};
      if (!parsed.streak) parsed.streak = { current: 0, best: 0, lastActive: null };
      return parsed;
    }
  }catch(e){}
  return { exp: 0, level: 1, score: 0, combo: 0, unlockedLawRefs: {}, questClears: {}, unlockedGhosts: {}, reciteDone: {}, subjectStats: {}, streak: { current: 0, best: 0, lastActive: null } };
}
function saveSave(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(state.save)); }catch(e){} }

/* ============ leveling ============
   Deliberately slower than the original curve (30 + (lvl-1)*22) — leveling up
   too fast made Lee's evolution stages fly by before players noticed the ล่าผี
   loop. ~1.5x steeper so each level feels earned. */
function expNeededForLevel(level){ return 45 + (level - 1) * 34; }
function maxHpForLevel(level){ return 20 + level * 6; }
function atkForLevel(level){ return 6 + level * 2; }
function gainExp(amount){
  const before = state.save.level;
  state.save.exp += amount;
  while (state.save.exp >= expNeededForLevel(state.save.level)) {
    state.save.exp -= expNeededForLevel(state.save.level);
    state.save.level++;
  }
  saveSave();
  return state.save.level > before; // did Lee level up?
}
function leeStageForLevel(level){
  const stages = DATA.leeEvolution;
  let stage = stages[0];
  for (const s of stages) { if (level >= s.level) stage = s; }
  return stage;
}
function evolutionCrossed(oldLevel, newLevel){
  return DATA.leeEvolution.find(s => s.level > oldLevel && s.level <= newLevel) || null;
}

/* ============ ARCADE SCORE SYSTEM (unified) ============
   Habit-loop reward, à la "Power of Habit"'s Pepsodent tingle — an immediate,
   sensory cue that fires right when you get a มาตรา right, separate from the
   slower EXP/level track. Upgraded to a dynamic arcade formula:
     TOTAL = round( (Base + RankBonus + TimeBonus) * ComboMultiplier )
   Shared by battle mode (rank = monster rank) and the ทดสอบเลขมาตรา quiz
   (rank slot repurposed as an examFreq-star difficulty bonus, see
   QUIZ_STAR_BONUS below) — same breakdown UI + same main score HUD either way. */
const SCORE_BASE = 2000;
const SCORE_RANK_BONUS = { D: 0, C: 300, B: 600, A: 1000, S: 1500, SS: 2000 };
const SCORE_TIME_BONUS_MAX = 500; // kept in the hundreds, not thousands
// Combo persists across battles (state.save.combo) — an arcade "don't break
// the chain" streak, not scoped to a single fight. Resets on any wrong/timeout.
const SCORE_COMBO_TIERS = [
  { min: 0, mult: 1   },
  { min: 3, mult: 1.5 },
  { min: 5, mult: 2   },
  { min: 8, mult: 3   },
];
function fmtScore(n){ return Math.round(n).toLocaleString('en-US'); }
function comboMultiplierFor(combo){
  let mult = 1;
  for (const tier of SCORE_COMBO_TIERS) { if (combo >= tier.min) mult = tier.mult; }
  return mult;
}
function computeBattleScoreBreakdown({ rank, timeLeft, timeLimitSec, combo }){
  const base = SCORE_BASE;
  const rankBonus = SCORE_RANK_BONUS[rank] || 0;
  const timeFrac = Math.max(0, Math.min(1, timeLeft / timeLimitSec));
  const timeBonus = Math.round(SCORE_TIME_BONUS_MAX * timeFrac);
  const mult = comboMultiplierFor(combo);
  const total = Math.round((base + rankBonus + timeBonus) * mult);
  return {
    total, base, rankBonus, timeBonus, mult,
    lines: [
      { label: 'Base Score', text: fmtScore(base), type: 'plus' },
      { label: 'Rank Bonus', text: '+ ' + fmtScore(rankBonus), type: 'plus' },
      { label: 'Time Bonus', text: '+ ' + fmtScore(timeBonus), type: 'plus' },
      { label: `Combo (x${mult})`, text: 'x ' + mult, type: 'mult' },
    ],
  };
}
/* Builds the breakdown block's HTML — lives inline inside whichever card is
   already on screen (battle result card, ทดสอบเลขมาตรา session summary),
   lines counting in with a staggered delay. No separate floating popup. */
function renderScoreBreakdownHtml(lines, total){
  return `
    <div class="result-score-breakdown">
      ${lines.map((l, i) => `<div class="sb-line" style="animation-delay:${i * 90}ms"><span>${l.label}</span><span class="sb-val ${l.type}">${l.text}</span></div>`).join('')}
      <div class="sb-rule"></div>
      <div class="sb-total" style="animation-delay:${lines.length * 90 + 60}ms"><span>TOTAL 🪙</span><span>${fmtScore(total)}</span></div>
    </div>
  `;
}
function addScore(amount){
  const before = state.save.score;
  state.save.score += amount;
  saveSave();
  tickScoreHud(before, state.save.score);
}
/* Arcade "rolling/ticking numbers" HUD animation: counts up with rapid tick
   blips (not just an instant snap) and lands with the existing ding flourish. */
function tickScoreHud(from, to){
  const el = document.getElementById('scoreVal');
  const wrap = document.getElementById('scoreHud');
  if (!el) return;
  wrap.classList.remove('score-pulse'); void wrap.offsetWidth; wrap.classList.add('score-pulse');
  const delta = to - from;
  const dur = Math.min(1300, Math.max(450, Math.abs(delta) * 0.5));
  const start = performance.now();
  let lastTick = 0;
  function step(now){
    const t = Math.min(1, (now - start) / dur);
    const eased = 1 - Math.pow(1 - t, 3);
    el.textContent = fmtScore(from + delta * eased);
    if (t < 1) {
      if (now - lastTick > 55) { playScoreTick(); lastTick = now; }
      requestAnimationFrame(step);
    } else {
      el.textContent = fmtScore(to);
      playDingSound();
    }
  }
  requestAnimationFrame(step);
}
function syncComboHud(){
  const wrap = document.getElementById('comboHud');
  const val = document.getElementById('comboVal');
  if (!wrap || !val) return;
  const combo = state.save.combo || 0;
  const mult = comboMultiplierFor(combo);
  if (mult > 1) {
    val.textContent = `x${mult} (${combo})`;
    wrap.classList.add('show');
  } else {
    wrap.classList.remove('show');
  }
}
let __dingAudioCtx;
function playDingSound(){
  if (isMuted()) return;
  try{
    __dingAudioCtx = __dingAudioCtx || new (window.AudioContext||window.webkitAudioContext)();
    const c = __dingAudioCtx;
    if (c.state === 'suspended') c.resume();
    const t0 = c.currentTime;
    [1318.5, 1975.5].forEach((freq, i) => { // E6 then B6 — a bright little "ting~"
      const osc = c.createOscillator(), gain = c.createGain();
      osc.type = 'sine'; osc.frequency.setValueAtTime(freq, t0 + i * 0.05);
      gain.gain.setValueAtTime(0.0001, t0 + i * 0.05);
      gain.gain.exponentialRampToValueAtTime(0.22, t0 + i * 0.05 + 0.012);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + i * 0.05 + 0.5);
      osc.connect(gain); gain.connect(c.destination);
      osc.start(t0 + i * 0.05); osc.stop(t0 + i * 0.05 + 0.52);
    });
  }catch(e){}
}
function playScoreTick(){
  if (isMuted()) return;
  try{
    __dingAudioCtx = __dingAudioCtx || new (window.AudioContext||window.webkitAudioContext)();
    const c = __dingAudioCtx;
    if (c.state === 'suspended') c.resume();
    const t0 = c.currentTime;
    const osc = c.createOscillator(), gain = c.createGain();
    osc.type = 'square'; osc.frequency.setValueAtTime(1600, t0);
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(0.08, t0 + 0.006);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.05);
    osc.connect(gain); gain.connect(c.destination);
    osc.start(t0); osc.stop(t0 + 0.06);
  }catch(e){}
}

/* ============ audio (reuses site-wide mute key) ============ */
function isMuted(){ try{ return localStorage.getItem(MUTE_KEY) === '1'; }catch(e){ return false; } }
function toggleMute(){
  try{ localStorage.setItem(MUTE_KEY, isMuted() ? '0' : '1'); }catch(e){}

}

  btn.classList.toggle('active', !isMuted());
}
const BGM = {
  quest: 'games/sound/music/rpg_quest_theme.mp3',
  battle: 'games/sound/music/rpg_battle_theme.mp3',
  boss: 'games/sound/music/rpg_boss_theme.mp3',
};
function playBgm(key){
  const el = document.getElementById('rpg-bgm');
  if (!el) return;
  if (isMuted()) { el.pause(); return; }
  const src = BGM[key];
  if (!src) { el.pause(); return; }
  if (el.dataset.key === key && !el.paused) return;
  el.dataset.key = key; el.src = src; el.loop = true; el.volume = 0.25; el.currentTime = 0;

}
const SFX = {

  correct: 'games/sound/effect/rpg_correct.mp3',
  wrong: 'games/sound/effect/rpg_wrong.mp3',
  levelup: 'games/sound/effect/rpg_levelup.mp3',
  victory: 'games/sound/effect/rpg_victory.mp3',

/* mnemonic songs (Lawbook gimmick) — try a real recording first, fall back to
   the browser's Thai text-to-speech reading the มาตรา's lecture note aloud */
function playMnemonic(book, article){
  const el = document.getElementById('rpg-sfx');
  const path = 'games/sound/mnemonic/' + book + '_' + article + '.mp3';
  if (isMuted() || !el) { speakMnemonicFallback(book, article); return; }
  el.src = path; el.volume = 0.85; el.currentTime = 0;
  el.onerror = () => { speakMnemonicFallback(book, article); };
  el.play().catch(() => speakMnemonicFallback(book, article));
}
function speakMnemonicFallback(book, article){
  if (!('speechSynthesis' in window) || !codexCache) return;
  const art = codexCache.books[book] && codexCache.books[book].articles[article];
  if (!art) return;
  const note = art.lectureNotes && art.lectureNotes[0];
  const text = (note ? note.text : art.text).slice(0, 500);
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'th-TH'; utter.rate = 1.0;
  speechSynthesis.cancel();
  speechSynthesis.speak(utter);
}

function pickRandomGhost(){
  const pool = DATA.folkGhosts;
  const total = pool.reduce((sum, g) => sum + RANK_META[g.rank].weight, 0);

  for (const g of pool) {

function extractDikaSnippet(lectureNotes){
  if (!lectureNotes) return null;
  const joined = lectureNotes.map(n => n.text || '').join('\n');
  const m = joined.match(/(?:คำพิพากษาศาลฎีกาที่|ฎีกาที่|ฎ\.)\s*[๐-๙0-9]+(?:\/[๐-๙0-9]+)?/);
  if (!m) return null;
  const idx = m.index;
  const start = Math.max(0, joined.lastIndexOf('\n', idx) + 1);
  const end = Math.min(joined.length, idx + 240);
  let snippet = joined.slice(start, end).trim();
  const lastPeriod = snippet.lastIndexOf('. ');
  if (lastPeriod > 60 && end < joined.length) snippet = snippet.slice(0, lastPeriod + 1);
  return snippet;
}
function escapeHtml(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

/* ============ ทดสอบเลขมาตรา — no-typing quiz (replaces the old typing-recite mode) ============
   Base/DifficultyBonus/TimeBonus × combo reuses the same arcade scoring engine
   built for ล่าผี (SCORE_BASE, SCORE_TIME_BONUS_MAX, comboMultiplierFor,
   addScore, renderScoreBreakdownHtml) — see that section above. Difficulty
   bonus substitutes for "rank" here since there's no monster: it's driven by
   codex examFreq.stars (how often a มาตรา shows up on the bar exam). */
const THAI_ORDINAL = ['วรรคหนึ่ง','วรรคสอง','วรรคสาม','วรรคสี่','วรรคห้า','วรรคหก'];
const QUIZ_STAR_BONUS = { 0: 0, 1: 200, 2: 500, 3: 1000 };
function quizTimeLimitFor(text){ return Math.min(35, Math.max(15, 10 + text.length / 12)); }

function startReciteQuiz(pool){
  app_showReciteLoading();
  ensureCodexLoaded().then(() => {
    state.reciteQuiz = {
      pool: shuffle(pool), qIndex: 0, current: null, locked: false, startedAt: null, feedback: null,
      session: { correct: 0, attempts: 0, scoreEarned: 0, baseTotal: 0, bonusTotal: 0, timeTotal: 0, comboMult: 1 },
    };
    state.screen = 'reciteQuiz';
    loadNextReciteQuestion();
  });
}
function loadNextReciteQuestion(){
  const q = state.reciteQuiz;
  if (q.qIndex >= q.pool.length) { q.pool = shuffle(q.pool); q.qIndex = 0; }
  const item = q.pool[q.qIndex++];
  const art = codexCache.books[item.book].articles[item.article];
  const paragraphs = (art.text || '').trim().split(/\n+/).map(s => s.trim()).filter(Boolean);
  q.current = { book: item.book, article: item.article, art, paragraphs };
  q.locked = false;
  q.startedAt = Date.now();
  q.feedback = null;
  render();
}
function renderReciteQuiz(app){
  const q = state.reciteQuiz;
  const s = q.session;
  const acc = s.attempts ? Math.round((s.correct / s.attempts) * 100) : 100;
  const topic = DATA.reciteTopics.find(t => t.id === state.reciteTopicId);
  const sg = topic.subgroups && state.reciteSubgroupId ? topic.subgroups.find(x => x.id === state.reciteSubgroupId) : null;
  const label = sg ? sg.name : topic.name;
  const paras = q.current.paragraphs;
  const bodyHtml = paras.length > 1
    ? paras.map((p, i) => `<div class="quiz-para"><span class="quiz-para-label">${THAI_ORDINAL[i] || 'วรรคที่ ' + (i + 1)}</span>${escapeHtml(p)}</div>`).join('')
    : `<div class="quiz-para">${escapeHtml(paras[0] || '')}</div>`;
  app.innerHTML = `
    <div class="back-row"><a href="#" onclick="exitReciteQuiz(event)">← กลับ</a></div>
    <div class="recite-wrap">
      <div class="recite-head"><span>${label}</span><span>${BOOK_LABEL[q.current.book]}</span></div>
      <div class="quiz-stat-bar">
        <div class="quiz-stat"><b>${s.correct}</b><span>ถูก</span></div>
        <div class="quiz-stat"><b>${s.attempts}</b><span>ทำไปแล้ว</span></div>
        <div class="quiz-stat"><b>${acc}%</b><span>ความแม่นยำ</span></div>
      </div>
      <div class="recite-card">
        <div class="quiz-prompt">มาตรานี้คือมาตราอะไร?</div>
        <div class="quiz-text">${bodyHtml}</div>
        ${q.feedback ? renderReciteFeedback(q.feedback) : renderReciteAnswerForm()}
      </div>
    </div>
  `;
  if (!q.feedback) {
    const input = document.getElementById('quizAnswerInput');
    if (input) input.focus();
  }
}
function renderReciteAnswerForm(){
  return `
    <form onsubmit="submitReciteAnswer(event)" class="quiz-answer-form">
      <label class="quiz-answer-label">มาตรา
        <input type="tel" inputmode="numeric" pattern="[0-9]*" id="quizAnswerInput" class="quiz-answer-input"
          autocomplete="off" enterkeyhint="done" placeholder="เลข">

function renderReciteFeedback(fb){
  const dika = extractDikaSnippet(fb.art.lectureNotes);
  return `
    <div class="quiz-feedback ${fb.correct ? 'ok' : 'bad'}">
      <div class="quiz-feedback-head">${fb.correct ? '✅ ถูกต้อง!' : '❌ ยังไม่ถูก'}</div>
      <div class="quiz-feedback-answer">คำตอบคือ <strong>มาตรา ${fb.correctArticle}</strong></div>
      ${fb.scoreGain ? `<div class="quiz-feedback-score">+${fmtScore(fb.scoreGain)} 🪙</div>` : ''}
    </div>
    ${dika ? `<div class="recite-dika">📜 <strong>ฎีกาที่เกี่ยวข้อง:</strong> ${escapeHtml(dika)}</div>` : ''}
    <div class="recite-actions" style="margin-top:14px; text-align:center">
      <button class="result-btn" onclick="loadNextReciteQuestion()">ข้อถัดไป →</button>
    </div>
  `;
}
function submitReciteAnswer(ev){
  ev.preventDefault();
  const q = state.reciteQuiz;
  if (q.locked) return;
  const input = document.getElementById('quizAnswerInput');
  const guess = (input.value || '').trim();
  if (!guess) { input.focus(); return; }
  q.locked = true;
  const correct = guess === String(q.current.article);
  const elapsedSec = (Date.now() - q.startedAt) / 1000;
  const s = q.session;
  s.attempts++;
  state.save.combo = correct ? (state.save.combo || 0) + 1 : 0;
  saveSave();
  syncComboHud();
  touchStreak();
  playSfx(correct ? 'correct' : 'wrong');

  let scoreGain = 0;
  if (correct) {
    s.correct++;
    const key = reciteDoneKey(q.current.book, q.current.article);
    if (!state.save.reciteDone[key]) state.save.reciteDone[key] = true;
    const stars = (q.current.art.examFreq && q.current.art.examFreq.stars) || 0;
    const bonus = QUIZ_STAR_BONUS[stars] || 0;
    const timeLimitSec = quizTimeLimitFor(q.current.paragraphs.join(''));
    const timeFrac = Math.max(0, Math.min(1, 1 - elapsedSec / timeLimitSec));
    const timeBonus = Math.round(SCORE_TIME_BONUS_MAX * timeFrac);
    const mult = comboMultiplierFor(state.save.combo);
    scoreGain = Math.round((SCORE_BASE + bonus + timeBonus) * mult);
    s.scoreEarned += scoreGain; s.baseTotal += SCORE_BASE; s.bonusTotal += bonus; s.timeTotal += timeBonus; s.comboMult = mult;
    addScore(scoreGain);
  }
  q.feedback = { correct, correctArticle: q.current.article, art: q.current.art, scoreGain };
  render();
}
function exitReciteQuiz(ev){
  ev.preventDefault();
  const q = state.reciteQuiz;
  if (!q || q.session.attempts === 0) { state.reciteQuiz = null; state.screen = 'reciteTopicPick'; render(); return; }
  showReciteQuizSummary();
}
function showReciteQuizSummary(){
  const s = state.reciteQuiz.session;

  const breakdownHtml = s.scoreEarned ? renderScoreBreakdownHtml([
    { label: 'Base Score', text: '+ ' + fmtScore(s.baseTotal), type: 'plus' },
    { label: 'ระดับออกสอบ', text: '+ ' + fmtScore(s.bonusTotal), type: 'plus' },
    { label: 'Time Bonus', text: '+ ' + fmtScore(s.timeTotal), type: 'plus' },
    { label: `Combo Bonus (x${s.comboMult})`, text: '+ ' + fmtScore(Math.max(0, s.scoreEarned - (s.baseTotal + s.bonusTotal + s.timeTotal))), type: 'plus' },
  ], s.scoreEarned) : '';
  const app = document.getElementById('app');
  const overlay = document.createElement('div');
  overlay.className = 'result-overlay';
  overlay.innerHTML = `
    <div class="result-card win">
      <h2>📖 สรุปผลการทดสอบ</h2>
      <p>ตอบถูก ${s.correct}/${s.attempts} ข้อ · แม่นยำ ${acc}%</p>
      <p>ได้รับ EXP +${expAwarded}</p>
      ${breakdownHtml}
      ${leveledUp ? `<p class="evo-banner">⭐ เลเวลอัพ! ตอนนี้ Lv.${state.save.level}</p>` : ''}
      <div class="result-actions">
        <button class="result-btn" onclick="closeReciteQuizSummary()">กลับ</button>
      </div>
    </div>
  `;
  app.appendChild(overlay);
}

}

/* ============ BATTLE ENGINE ============ */
function shuffle(arr){
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function startBattleState({ questId, mode, monster, subjectId, topicKey, questionPool, bgmKey, bgPath }){
  const playerMaxHp = maxHpForLevel(state.save.level);
  // ล่าผี ghosts get tankier than their base data — makes battles last a
  // few more correct answers, so the score/ding loop has room to build up.
  const monsterHp = mode === 'ghosthunt' ? Math.round(monster.hp * GHOST_TOUGHNESS_MULT) : monster.hp;
  state.battle = {
    questId, mode, monster, subjectId, topicKey,
    bgPath: bgPath || subjectBgPath(subjectId),
    monsterHp, monsterMaxHp: monsterHp,
    playerHp: playerMaxHp, playerMaxHp,
    queue: shuffle(questionPool),
    qIndex: 0,
    current: null,
    timeLeft: 0, timerHandle: null,
    locked: false,
    result: null, // null | 'win' | 'lose'
    expEarned: 0,
    scoreEarned: 0,
    scoreBaseTotal: 0, scoreRankTotal: 0, scoreTimeTotal: 0, scoreComboMult: 1,
  };
  state.screen = 'battle';
  render();
  playBgm(bgmKey || (monster.atk >= 8 ? 'boss' : 'battle'));
  showVsIntro(monster, () => loadNextQuestion());
}
/* Capcom-style "combatant slides in, VS pops" stinger shown right before the
   first question loads — purely presentational, doesn't touch battle state. */

/* Mega-Man-style boss-down stinger: one screen flash, the ghost's own sprite
   pops to center with a faint light-sweep passing behind it, then its name

function enterBattle(questId, mode){
  const quest = DATA.quests.find(q => q.id === questId);
  const monster = DATA.monsters.find(m => m.id === quest.enemyId);
  startBattleState({
    questId, mode, monster, subjectId: quest.subjectId,
    questionPool: quest.questionIds.map(id => DATA.questions.find(q => q.id === id)),
    bgmKey: quest.id.includes('288') ? 'boss' : undefined,
  });
}
function startGhostHunt(topicKey){
  const ghost = pickRandomGhost();
  const node = GHOSTHUNT_TOPICS.find(t => t.topic === topicKey);
  const pool = node ? ghostHuntQuestionPoolFor(node) : [];
  startBattleState({
    questId: null, mode: 'ghosthunt', monster: ghost, topicKey,
    bgPath: node && node.bg ? ghostHuntBgPath(node.bg) : ghostHuntBgPath('tokyo'),
    questionPool: shuffle(pool.length ? pool : DATA.questions).slice(0, 3),
  });

function loadNextQuestion(){
  const b = state.battle;
  if (b.qIndex >= b.queue.length) { b.queue = shuffle(b.queue); b.qIndex = 0; }
  b.current = b.queue[b.qIndex++];
  b.locked = false;
  b.timeLeft = b.current.timeLimitSec;
  renderBattleDialogue();
  startTimer();
}
function startTimer(){
  clearInterval(state.battle.timerHandle);
  updateTimerBar();
  state.battle.timerHandle = setInterval(() => {
    state.battle.timeLeft -= 0.2;
    if (state.battle.timeLeft <= 0) {
      clearInterval(state.battle.timerHandle);
      state.battle.timeLeft = 0;
      updateTimerBar();
      handleAnswer(-1);
      return;
    }
    updateTimerBar();
  }, 200);
}
function updateTimerBar(){
  const b = state.battle;
  const el = document.getElementById('timerFill');
  if (!el) return;
  const pct = Math.max(0, b.timeLeft / b.current.timeLimitSec * 100);
  el.style.width = pct + '%';
  el.className = 'timer-fill' + (pct < 25 ? ' lo' : pct < 55 ? ' mid' : '');
}
function handleAnswer(index){
  const b = state.battle;
  if (b.locked) return;
  b.locked = true;
  clearInterval(b.timerHandle);
  const correct = index === b.current.correctIndex;

  document.querySelectorAll('.answer-btn').forEach((btn, i) => {
    btn.disabled = true;
    if (i === b.current.correctIndex) btn.classList.add('correct');
    else if (i === index) btn.classList.add('wrong');
  });

  recordLawRefProgress(b.current.lawRef, correct);
  recordSubjectStat(b.current.subjectId, correct);
  touchStreak();

  if (correct) {
    playSfx('correct');
    state.save.combo = (state.save.combo || 0) + 1;
    saveSave();
    syncComboHud();
    const rank = b.monster.rank || 'D'; // quest-mode monsters have no rank tier — treat as base D
    // Score accrues silently per answer — the breakdown only renders once,
    // inline inside the result card at battle end (renderBattleResult), not
    // on every correct answer.
    const breakdown = computeBattleScoreBreakdown({ rank, timeLeft: b.timeLeft, timeLimitSec: b.current.timeLimitSec, combo: state.save.combo });
    b.scoreEarned += breakdown.total;
    b.scoreBaseTotal += breakdown.base;
    b.scoreRankTotal += breakdown.rankBonus;
    b.scoreTimeTotal += breakdown.timeBonus;
    b.scoreComboMult = breakdown.mult;
    const dmg = Math.round(atkForLevel(state.save.level) * (0.85 + Math.random()*0.3));
    b.monsterHp = Math.max(0, b.monsterHp - dmg);
    b.expEarned += b.current.expReward;
    animateHit('enemy', dmg, false);
    setTimeout(() => playSfx('attack'), 120);
  } else {
    playSfx('wrong');
    state.save.combo = 0;
    saveSave();
    syncComboHud();
    if (!isFreePractice(b.mode)) {
      const dmg = Math.round(b.monster.atk * (0.85 + Math.random()*0.3));
      b.playerHp = Math.max(0, b.playerHp - dmg);
      animateHit('player', dmg, false);
      flashMonsterAttackPose(b.monster);
    }
  }
  refreshHudOnly();

  setTimeout(() => {
    if (b.monsterHp <= 0) return finishBattle('win');
    if (b.playerHp <= 0 && !isFreePractice(b.mode)) return finishBattle('lose');
    loadNextQuestion();
  }, 1100);
}
function animateHit(side, amount, heal){
  const wrap = document.querySelector('.combatant.' + side + ' .sprite-wrap');
  if (!wrap) return;
  wrap.classList.remove('hit-shake'); void wrap.offsetWidth; wrap.classList.add('hit-shake');
  const pop = document.createElement('div');
  pop.className = 'dmg-pop' + (heal ? ' heal' : '');
  pop.textContent = (heal ? '+' : '-') + amount;
  wrap.appendChild(pop);
  setTimeout(() => pop.remove(), 800);
}
function refreshHudOnly(){
  const b = state.battle;
  setHpBar('enemyHud', b.monsterHp, b.monsterMaxHp);
  setHpBar('playerHud', b.playerHp, b.playerMaxHp);
}
function setHpBar(prefix, hp, maxHp){
  const fill = document.getElementById(prefix + 'Fill');
  const num = document.getElementById(prefix + 'Num');
  if (!fill) return;
  const pct = Math.max(0, hp / maxHp * 100);
  fill.style.width = pct + '%';
  fill.className = 'hp-fill' + (pct < 25 ? ' lo' : pct < 55 ? ' mid' : '');
  if (num) num.textContent = Math.max(0, hp) + ' / ' + maxHp;
}
function recordLawRefProgress(lawRef, correct){
  const key = lawRef.book + ':' + lawRef.article;
  const entry = state.save.unlockedLawRefs[key] || { correct: 0, wrong: 0, unlocked: false };
  if (correct) {
    entry.correct++;
    if (entry.correct >= UNLOCK_THRESHOLD) entry.unlocked = true;
  } else {
    entry.wrong = (entry.wrong || 0) + 1;
  }
  state.save.unlockedLawRefs[key] = entry;
  saveSave();
}
function recordSubjectStat(subjectId, correct){
  if (!subjectId) return;
  const e = state.save.subjectStats[subjectId] || { correct: 0, wrong: 0 };
  if (correct) e.correct++; else e.wrong++;
  state.save.subjectStats[subjectId] = e;
  saveSave();
}
/* ============ streak (consecutive days active) ============ */
function todayStr(d){
  d = d || new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function touchStreak(){
  const st = state.save.streak;
  const today = todayStr();
  if (st.lastActive === today) return; // already counted today
  const yesterday = new Date(); yesterday.setDate(yesterday.getDate() - 1);
  st.current = (st.lastActive === todayStr(yesterday)) ? st.current + 1 : 1;
  st.best = Math.max(st.best || 0, st.current);
  st.lastActive = today;
  saveSave();
}
function finishBattle(result){
  const b = state.battle;
  b.result = result;
  let leveledUp = false, newStage = null, ghostUnlocked = false;
  if (result === 'win') {
    playSfx('victory');
    if (b.mode === 'ghosthunt') {
      ghostUnlocked = !state.save.unlockedGhosts[b.monster.id];
      state.save.unlockedGhosts[b.monster.id] = true;
      b.expEarned = Math.round(b.expEarned * RANK_META[b.monster.rank].expMul);
    } else if (b.mode !== 'review') {
      const clears = state.save.questClears[b.questId] || 0;
      state.save.questClears[b.questId] = clears + 1;
    }
    const oldLevel = state.save.level;
    leveledUp = gainExp(b.expEarned);
    if (leveledUp) newStage = evolutionCrossed(oldLevel, state.save.level);
    saveSave();
    document.getElementById('rpg-bgm').pause();
    if (b.mode === 'ghosthunt') {
      showDefeatFlash(b.monster, () => renderBattleResult(leveledUp, newStage, ghostUnlocked));
      return;
    }
  } else {
    playSfx('defeat');
    document.getElementById('rpg-bgm').pause();
  }
  renderBattleResult(leveledUp, newStage, ghostUnlocked);
}

      <div class="dialogue-text">${q.prompt}</div>
      <div class="answer-grid">
        ${q.options.map((opt, i) => `<button class="answer-btn" onclick="handleAnswer(${i})">${opt}</button>`).join('')}
      </div>
    </div>
  `;
}
function confirmFlee(ev){
  ev.preventDefault();
  clearInterval(state.battle && state.battle.timerHandle);
  document.getElementById('rpg-bgm').pause();
  state.screen = state.battle.mode === 'training' ? 'training' : state.battle.mode === 'ghosthunt' ? 'ghosthunt' : 'quest';
  state.battle = null;
  render();
}
function nextQuestFor(quest){
  const siblings = DATA.quests
    .filter(q => q.subjectId === quest.subjectId)
    .sort((a, b) => a.recommendedLevel - b.recommendedLevel);
  const idx = siblings.findIndex(q => q.id === quest.id);
  return idx >= 0 && idx < siblings.length - 1 ? siblings[idx + 1] : null;
}
function renderBattleResult(leveledUp, newStage, ghostUnlocked){
  const b = state.battle;
  const app = document.getElementById('app');
  const overlay = document.createElement('div');
  overlay.className = 'result-overlay';
  const isHunt = b.mode === 'ghosthunt';
  const nextQuest = (b.result === 'win' && !isHunt) ? nextQuestFor(DATA.quests.find(q => q.id === b.questId)) : null;
  const backLabel = isHunt ? 'กลับ' : 'กลับด่าน';
  const primaryWinBtn = isHunt
    ? `<button class="result-btn" onclick="playSfx('rematch'); rematch()">👻 ล่าอีกตัว</button>`
    : (nextQuest
        ? `<button class="result-btn" onclick="goNextQuest('${nextQuest.id}')">▶ ด่านต่อไป: ${nextQuest.name}</button>`
        : `<button class="result-btn" onclick="rematch()">⚔️ สู้อีกครั้ง</button>`);
  const comboBonus = Math.max(0, b.scoreEarned - (b.scoreBaseTotal + b.scoreRankTotal + b.scoreTimeTotal));
  const scoreBreakdownHtml = (b.result === 'win' && b.scoreEarned) ? renderScoreBreakdownHtml([
    { label: 'Base Score', text: '+ ' + fmtScore(b.scoreBaseTotal), type: 'plus' },
    { label: 'Rank Bonus', text: '+ ' + fmtScore(b.scoreRankTotal), type: 'plus' },
    { label: 'Time Bonus', text: '+ ' + fmtScore(b.scoreTimeTotal), type: 'plus' },
    { label: `Combo Bonus (x${b.scoreComboMult})`, text: '+ ' + fmtScore(comboBonus), type: 'plus' },
  ], b.scoreEarned) : '';
  overlay.innerHTML = b.result === 'win' ? `
    <div class="result-card win">
      <h2>🎉 ชนะแล้ว!</h2>
      <p>ปราบ ${b.monster.name} สำเร็จ</p>
      <p>ได้รับ EXP +${b.expEarned}</p>
      ${scoreBreakdownHtml}
      ${isHunt && ghostUnlocked ? `<p class="evo-banner">👻 ปลดล็อก "${b.monster.name}" ใน Monster Gallery แล้ว!</p>` : ''}
      ${leveledUp ? `<p class="evo-banner">⭐ เลเวลอัพ! ตอนนี้ Lv.${state.save.level}</p>` : ''}
      ${newStage ? `<p class="evo-banner">🐱 สำลีวิวัฒนาการ: ${newStage.title}!<br>${newStage.desc}</p>` : ''}
      <div class="result-actions">
        ${primaryWinBtn}
        <button class="result-btn secondary" onclick="playSfx('back'); backToBoard()">${backLabel}</button>
      </div>
    </div>
  ` : `
    <div class="result-card lose">
      <h2>💀 พ่ายแพ้</h2>
      <p>${b.monster.name} เอาชนะสำลีได้ในครั้งนี้</p>
      <p>ลองทบทวน${articleLabel(b.current.lawRef.article)} แล้วมาสู้ใหม่นะ</p>
      <div class="result-actions">
        <button class="result-btn" onclick="rematch()">🔄 ลองใหม่</button>
        <button class="result-btn secondary" onclick="playSfx('back'); backToBoard()">${backLabel}</button>
      </div>
    </div>
  `;
  app.appendChild(overlay);
  if (b.scoreEarned) addScore(b.scoreEarned); // ticks the 🪙 HUD up right as this same screen appears
}
function rematch(){
  document.querySelector('.result-overlay').remove();
  if (state.battle.mode === 'ghosthunt') { startGhostHunt(state.battle.topicKey); return; }
  enterBattle(state.battle.questId, state.battle.mode);
}
function goNextQuest(questId){
  const mode = state.battle.mode;
  document.querySelector('.result-overlay').remove();
  enterBattle(questId, mode);
}
function backToBoard(){
  document.querySelector('.result-overlay').remove();
  state.screen = state.battle.mode === 'training' ? 'training' : state.battle.mode === 'ghosthunt' ? 'ghosthunt' : 'quest';
  state.battle = null;
  render();
}

/* ============ ล่าผี (ghost hunt) — "LAW PLAYER SELECT" world map ============
   pics/game/rpg/map/law_player_select.jpg is a single pre-rendered 16-bit
   arcade world-map illustration with one framed character card per หัวข้อ
   วิชา (see GHOSTHUNT_TOPICS). Each node's `pos` is a hand-calibrated {x,y}
   percentage of the image locating that card's character (verified by
   overlaying test markers on the source image before wiring in) — nodes
   are plain absolutely-positioned hit targets over the art, not drawn UI,
   so the wrapper uses aspect-ratio to keep positions correct at any width.
   Locked nodes (no dataTopics yet) get a dim overlay + 🔒, same "locked
   until content ships" convention as the Quest Board's subject tabs. */
function renderGhostHunt(app){
  playBgm('quest');
  const nodes = GHOSTHUNT_TOPICS.map(node => {
    const playable = node.dataTopics.length > 0;
    const style = `left:${node.pos.x}%; top:${node.pos.y}%`;
    if (!playable) {
      return `<div class="worldmap-node locked" style="${style}" title="${node.topic} (เร็ว ๆ นี้)"><span class="worldmap-lock">🔒</span></div>`;
    }
    return `<a href="#" class="worldmap-node unlocked" style="${style}" title="${node.topic}" onclick="event.preventDefault(); startGhostHunt('${node.topic}')"></a>`;
  }).join('');
  app.innerHTML = `
    <div class="back-row"><a href="#" onclick="goScreen(event,'home')">← กลับหน้าหลัก</a></div>
    <div class="section-title">👻 ล่าผี — เลือกเส้นทาง</div>
    <div class="training-flag">โหมดฝึก: ตอบผิดไม่เสีย HP — ตอบถูกครบเพื่อปราบผีและปลดล็อกลง Monster Gallery</div>
    <p style="color:var(--ink-soft); font-size:12.5px; line-height:1.6; margin:10px 0 14px">
      แตะการ์ดตัวละครบนแผนที่ (จุดที่ปลดล็อกแล้ว) จะสุ่มพบผีไทยหนึ่งตัวจากตำนานพื้นบ้าน ยิ่งหายาก (rank สูง) ยิ่งพบเจอได้ยาก แต่ให้ EXP มากกว่า
      <span class="pixel" style="font-size:9px; letter-spacing:1px; display:block; margin-top:4px">D・C・B・A・S・SS</span>
    </p>
    <div class="worldmap-wrap">
      <img src="${GHOSTHUNT_MAP_IMG}" alt="LAW PLAYER SELECT">
      ${nodes}
    </div>
  `;
}

/* ============ MONSTER GALLERY ============ */
const RANK_COLOR = { D:'#8a8f9e', C:'#3f9d5c', B:'#2e6fd6', A:'#a34ad6', S:'#d69a2e', SS:'#d6392e' };
function renderGallery(app){
  playBgm('quest');
  const cards = DATA.folkGhosts.map(g => {
    const unlocked = !!state.save.unlockedGhosts[g.id];
    if (!unlocked) {
      return `
        <div class="ghost-card locked">
          <div class="ghost-card-art">❓</div>
          <div class="ghost-card-name">???</div>
        </div>
      `;
    }
    return `
      <a href="#" class="ghost-card" onclick="openGalleryDetail(event,'${g.id}')">
        <div class="ghost-card-art"><img src="${monsterSpritePath(g)}" alt="" loading="lazy" onerror="this.style.display='none'"></div>
        <div class="ghost-card-name">${g.name}</div>
        <div class="rank-badge" style="background:${RANK_COLOR[g.rank]}">${g.rank}</div>
      </a>
    `;
  }).join('');
  const unlockedCount = Object.keys(state.save.unlockedGhosts).length;
  app.innerHTML = `
    <div class="back-row"><a href="#" onclick="goScreen(event,'home')">← กลับหน้าหลัก</a></div>
    <div class="section-title">📔 Monster Gallery <span style="color:var(--ink-faint); font-weight:400; font-size:13px">(${unlockedCount}/${DATA.folkGhosts.length})</span></div>
    <div class="ghost-gallery-grid">${cards}</div>
  `;
}
function openGalleryDetail(ev, ghostId){
  ev.preventDefault();
  state.galleryGhostId = ghostId;
  state.screen = 'galleryDetail';
  render();
}
function renderGalleryDetail(app){
  const g = DATA.folkGhosts.find(x => x.id === state.galleryGhostId);
  if (!g) { state.screen = 'gallery'; return render(); }
  app.innerHTML = `
    <div class="back-row"><a href="#" onclick="goScreen(event,'gallery')">← กลับ Gallery</a></div>
    <div class="ghost-detail-card">
      <div class="rank-badge lg" style="background:${RANK_COLOR[g.rank]}">${g.rank}</div>
      <div class="ghost-detail-art"><img src="${monsterSpritePath(g)}" alt="" loading="lazy" onerror="this.style.display='none'"></div>
      <h2>${g.name}</h2>
      <p class="ghost-detail-story">${g.story}</p>
    </div>
  `;
}

/* ============ LAWBOOK ============ */
function renderLawbook(app){
  const entries = Object.keys(state.save.unlockedLawRefs);
  app.innerHTML = `
    <div class="back-row"><a href="#" onclick="goScreen(event,'home')">← กลับหน้าหลัก</a></div>
    <div class="section-title">📖 Lawbook</div>
    <div id="lawbookBody" class="loading-note">กำลังโหลดคลังมาตรา...</div>
  `;
  if (!entries.length) {
    document.getElementById('lawbookBody').innerHTML = '<div class="locked-note">ยังไม่มีมาตราที่ปลดล็อก — ตอบคำถามให้ถูกสะสม ' + UNLOCK_THRESHOLD + ' ครั้งต่อมาตราในสนามรบเพื่อปลดล็อก</div>';
    return;
  }
  ensureCodexLoaded().then(() => renderLawbookEntries(entries)).catch(() => {
    document.getElementById('lawbookBody').innerHTML = '<div class="locked-note">โหลดคลังกฎหมายไม่สำเร็จ ลองใหม่อีกครั้ง</div>';
  });
}
function ensureCodexLoaded(){
  if (codexCache) return Promise.resolve(codexCache);
  return fetch(CODEX_URL).then(r => r.json()).then(json => { codexCache = json; return json; });
}
function renderLawbookEntries(entries){
  const body = document.getElementById('lawbookBody');
  const html = entries.map(key => {
    const [book, article] = key.split(':');
    const progress = state.save.unlockedLawRefs[key];
    if (!progress.unlocked) {
      return `<div class="locked-entry"><span>🔒 ${bookLabel(book)} ${articleLabel(article)}</span><span class="progress">${progress.correct}/${UNLOCK_THRESHOLD}</span></div>`;
    }
    const art = codexCache.books[book] && codexCache.books[book].articles[article];
    if (!art) return '';
    const note = art.lectureNotes && art.lectureNotes[0];
    const caseLawHtml = (art.caseLaw && art.caseLaw.length) ? `
      <div class="caselaw-block">
        <strong>ฎีกาที่เกี่ยวข้อง:</strong>
        ${art.caseLaw.map(c => `
          <div class="caselaw-item">
            <div class="caselaw-cite">${c.citation}<span class="caselaw-year">${c.year ? ' (พ.ศ. ' + c.year + ')' : ''}</span></div>
            <div class="caselaw-summary">${c.summary}</div>
          </div>
        `).join('')}
      </div>
    ` : '';
    return `
      <div class="lawbook-entry">
        <div class="head">
          <span class="num">มาตรา ${article}</span>
          <span class="book">${bookLabel(book)}</span>
        </div>
        <div class="text">${art.text}</div>
        ${note ? `<div class="mnemonic"><strong>เกร็ดช่วยจำ:</strong> ${note.text.slice(0,220)}${note.text.length>220?'…':''}</div>` : ''}
        ${caseLawHtml}
        <button class="play-audio-btn" onclick="playMnemonic('${book}','${article}')">▶ ฟังเพลงช่วยจำ</button>
      </div>
    `;
  }).join('');
  body.className = '';
  body.innerHTML = html;
}

/* ============ STATS (สถิติ/ความคืบหน้า) ============
   Reuses unlockedLawRefs (now tracks wrong too, see recordLawRefProgress)
   and subjectStats (see recordSubjectStat) — no new data source, just a
   read-only view over counters the battle engine already keeps. */
const STATS_SUBJECT_LABELS = {
  civil: { name: 'ขาแพ่ง', icon: '🔑' },
  criminal: { name: 'ขาอาญา', icon: '⚖️' },
  vipeng: { name: 'วิ.แพ่ง', icon: '📜' },
};
function subjectStatLabel(id){
  const known = STATS_SUBJECT_LABELS[id];
  if (known) return known;
  const s = DATA.subjects.find(s => s.id === id);
  return s ? { name: s.name, icon: s.icon } : { name: id, icon: '📘' };
}
function statAccuracyPct(e){ const total = e.correct + (e.wrong || 0); return total ? Math.round(e.correct / total * 100) : 0; }
/* Weak articles = >=2 attempts recorded and not answering perfectly, weakest first. */
function computeWeakArticles(limit){
  const rows = Object.keys(state.save.unlockedLawRefs).map(key => {
    const e = state.save.unlockedLawRefs[key];
    const wrong = e.wrong || 0;
    const attempts = e.correct + wrong;
    return { key, correct: e.correct, wrong, attempts, acc: attempts ? e.correct / attempts : 1 };
  }).filter(r => r.attempts >= 2 && r.acc < 1);
  rows.sort((a, b) => a.acc - b.acc || b.attempts - a.attempts);
  return rows.slice(0, limit || 6);
}
function renderStats(app){
  const st = state.save.streak;
  const allEntries = Object.values(state.save.unlockedLawRefs);
  const totalCorrect = allEntries.reduce((n, e) => n + e.correct, 0);
  const totalWrong = allEntries.reduce((n, e) => n + (e.wrong || 0), 0);
  const totalAttempts = totalCorrect + totalWrong;
  const overallAcc = totalAttempts ? Math.round(totalCorrect / totalAttempts * 100) : 0;

  const subjectIds = Object.keys(state.save.subjectStats);
  const subjectRows = subjectIds.map(id => {
    const e = state.save.subjectStats[id];
    const label = subjectStatLabel(id);
    return { id, label, acc: statAccuracyPct(e), attempts: e.correct + e.wrong };
  }).sort((a, b) => b.attempts - a.attempts);

  const weak = computeWeakArticles(6);

  app.innerHTML = `
    <div class="back-row"><a href="#" onclick="goScreen(event,'home')">← กลับหน้าหลัก</a></div>
    <div class="section-title">📊 สถิติของสำลี</div>

    <div class="stats-top-row">
      <div class="stats-tile">
        <div class="stats-tile-num">🔥 ${st.current}</div>
        <div class="stats-tile-label">วันติดต่อกัน ${st.best > st.current ? '(สูงสุด ' + st.best + ')' : ''}</div>
      </div>
      <div class="stats-tile">
        <div class="stats-tile-num">${overallAcc}%</div>
        <div class="stats-tile-label">ความแม่นยำรวม (${totalAttempts} ครั้ง)</div>
      </div>
    </div>

    ${subjectRows.length ? `
      <div class="stats-section-label">ความแม่นยำแยกวิชา</div>
      <div class="stats-bar-list">
        ${subjectRows.map(r => `
          <div class="stat-bar-row">
            <div class="stat-bar-head"><span>${r.label.icon} ${r.label.name}</span><span>${r.acc}% · ${r.attempts} ครั้ง</span></div>
            <div class="stat-bar-track"><div class="stat-bar-fill" style="width:${r.acc}%"></div></div>
          </div>
        `).join('')}
      </div>
    ` : '<div class="locked-note">ยังไม่มีข้อมูล — ไปลุยด่านหรือล่าผีก่อนเพื่อดูสถิติ</div>'}

    <div class="stats-section-label">🎯 จุดอ่อนที่ควรทบทวน</div>
    ${weak.length ? `
      <div class="weak-list">
        ${weak.map(w => {
          const [book, article] = w.key.split(':');
          return `
            <div class="weak-card">
              <div class="weak-card-main">
                <span class="weak-card-ref">${bookLabel(book)} ${articleLabel(article)}</span>
                <span class="weak-card-acc">${Math.round(w.acc*100)}%</span>
              </div>
              <div class="weak-card-sub">ถูก ${w.correct} · ผิด ${w.wrong}</div>
            </div>
          `;
        }).join('')}
      </div>
      <button class="result-btn" style="width:100%; margin-top:14px" onclick="startWeakReview()">⚔️ ทบทวนจุดอ่อน</button>
    ` : '<div class="locked-note">ยังไม่พบจุดอ่อนชัดเจน — ตอบคำถามให้มากขึ้นอีกหน่อยเพื่อให้ระบบวิเคราะห์ได้แม่นขึ้น (ต้องตอบซ้ำมาตราเดิมอย่างน้อย 2 ครั้ง)</div>'}
  `;
}
function startWeakReview(){
  const weak = computeWeakArticles(5);
  const pool = [];
  const used = new Set();
  weak.forEach(w => {
    const [book, article] = w.key.split(':');
    const matches = DATA.questions.filter(q => q.lawRef && q.lawRef.book === book && String(q.lawRef.article) === article && !used.has(q.id));
    shuffle(matches).slice(0, 2).forEach(q => { pool.push(q); used.add(q.id); });
  });
  if (!pool.length) return;
  const ghost = pickRandomGhost();
  startBattleState({
    questId: null, mode: 'review', monster: ghost, subjectId: null,
    bgPath: subjectBgPath('civil'),
    questionPool: pool,
  });
}
