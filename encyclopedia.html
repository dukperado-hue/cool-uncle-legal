<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>สารานุกรมคำกฎหมาย · Thai Legal Atlas</title>
<meta name="description" content="สารานุกรมคำกฎหมาย (Encyclopedia) ของ Thai Legal Atlas — ค้นคำกฎหมาย จัดเรียงตามตัวอักษร แล้วกระโดดเข้าหน้าแนวคิด มาตรา คดี และความสัมพันธ์เดิมของ Atlas">
<link rel="canonical" href="https://coolunclelab.com/encyclopedia.html">
<!--
  encyclopedia.html :: host for the Encyclopedia (FINALIZATION 3).
  STANDALONE and ADDITIVE:
    - the front DOOR for the existing Legal Concept layer: an alphabetical,
      searchable index of concept terms (Thai · English aliases · Latin)
    - every term links to the FROZEN concept-entry URL concept.html?k=<slug>;
      the concept page keeps rendering provisions / cases / related concepts
      and the structural anchor back into atlas.html
    - reads the SAME atlas-concepts.json through AtlasConcepts.load(); builds
      no second concept dataset
    - needs only concept names + the registry — never loads the full legal
      corpus; provisions/cases open on the concept page, not here
    - never touches atlas.html routing or any provision URL
  atlas-encyclopedia.js emits semantic .atlas-enc-* nodes and injects its own
  scoped stylesheet; this host only provides the palette tokens + page chrome.
-->
<style>
  :root{
    --bg:#FBF9F4; --panel:#fff; --ink:#1f2430; --muted:#5b6472;
    --line:#e6e1d6; --accent:#2E4A7A; --accent-soft:#eaf0f8; --chip:#f2ede1;
    --atlas-brand:#DC143C; --atlas-brand-soft:#fbe2e6; --atlas-header-bg:#DC143C;
    --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:36px; --radius:10px;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --bg:#14161b;--panel:#1c1f27;--ink:#e8eaed;--muted:#9aa3b2;
    --line:#2c313c;--accent:#8fb4e8;--accent-soft:#20293a;--chip:#232733;
    --atlas-brand:#e08a97;--atlas-brand-soft:#3a2126;--atlas-header-bg:#7a1a2c;}}
  :root[data-theme="dark"]{
    --bg:#14161b;--panel:#1c1f27;--ink:#e8eaed;--muted:#9aa3b2;
    --line:#2c313c;--accent:#8fb4e8;--accent-soft:#20293a;--chip:#232733;
    --atlas-brand:#e08a97;--atlas-brand-soft:#3a2126;--atlas-header-bg:#7a1a2c;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"Sarabun","IBM Plex Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;
    line-height:1.7;font-size:15px}
  a{color:var(--accent);text-decoration:none}
  a:hover{text-decoration:underline}
  .enc-wrap{max-width:820px;margin:0 auto;padding:var(--s5) var(--s5) 96px}

  /* ---- global Atlas header — shared with atlas.html/concept.html ---- */
  .atlas-header-top{background:var(--atlas-header-bg)}
  .atlas-header-top-inner{max-width:1120px;margin:0 auto;padding:14px var(--s5);
    display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .atlas-brand{font-size:19px;font-weight:700;letter-spacing:-.01em;color:#fff;
    display:inline-flex;align-items:center;gap:8px}
  .atlas-brand:hover{text-decoration:none;opacity:.9}
  .atlas-brand-mark{font-size:18px;line-height:1}
  .atlas-header-top-sub{font-size:12.5px;color:rgba(255,255,255,.82);
    padding-left:10px;border-left:1px solid rgba(255,255,255,.35)}
  .atlas-navbar{background:var(--panel);border-bottom:1px solid var(--line)}
  .atlas-navbar-inner{max-width:1120px;margin:0 auto;padding:0 var(--s5);
    display:flex;flex-wrap:wrap;align-items:center;gap:2px}
  .atlas-navbar-link{display:inline-block;padding:12px 12px;font-size:13px;
    font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
  .atlas-navbar-link:hover{color:var(--ink);text-decoration:none}
  .atlas-navbar-link.is-current{color:var(--atlas-brand);border-bottom-color:var(--atlas-brand)}
  @media (max-width:760px){
    .atlas-header-top-inner{padding:12px var(--s4)}
    .atlas-header-top-sub{display:none}
    .atlas-navbar-inner{padding:0 var(--s4)}
    .atlas-navbar-link{padding:10px 9px;font-size:12.5px}
  }

  /* ---- this page's own title block ---- */
  .enc-masthead{padding:0 0 var(--s3);border-bottom:2px solid var(--line);margin-bottom:var(--s4)}
  .enc-masthead h1{margin:0;font-size:19px;font-weight:700;color:var(--ink)}
  .atlas-loading,.atlas-enc-empty{padding:40px 6px;text-align:center;color:var(--muted)}
  [hidden]{display:none!important}
  @media (max-width:760px){ .enc-wrap{padding:var(--s4) var(--s4) 72px} }
</style>
</head>
<body>
<header class="atlas-header">
  <div class="atlas-header-top">
    <div class="atlas-header-top-inner">
      <a class="atlas-brand" href="atlas.html">
        <span class="atlas-brand-mark" aria-hidden="true">⚖</span>Thai&nbsp;Legal&nbsp;Atlas</a>
      <span class="atlas-header-top-sub">สารบบกฎหมายไทย</span>
    </div>
  </div>
  <nav class="atlas-navbar" aria-label="เมนูหลักของ Atlas">
    <div class="atlas-navbar-inner">
      <a class="atlas-navbar-link" href="atlas.html">สารบบ</a>
      <a class="atlas-navbar-link is-current" href="encyclopedia.html">สารานุกรม</a>
      <a class="atlas-navbar-link" href="codex-search.html">ค้นมาตรา</a>
      <a class="atlas-navbar-link" href="neural-network.html">รัศมีนิติธรรม</a>
    </div>
  </nav>
</header>

<div class="enc-wrap">
  <header class="enc-masthead">
    <h1>สารานุกรมคำกฎหมาย · Encyclopedia <span style="font-weight:400">(ระยะทดลอง)</span></h1>
  </header>

  <div id="atlas-root"><div class="atlas-loading">กำลังโหลดสารานุกรม…</div></div>
</div>

<script src="atlas-patches.js?v=20260908a"></script>
<script src="atlas-core.js?v=20260908a"></script>
<script src="atlas-concepts.js?v=20260910a"></script>
<script src="atlas-concept-clusters.js?v=20260912a"></script>
<script src="atlas-topics.js?v=20260912a"></script>
<script src="atlas-encyclopedia.js?v=20260912a"></script>
<script>
(function () {
  'use strict';
  var root = document.getElementById('atlas-root');

  // The Encyclopedia index needs only concept names + the registry's
  // subject-area labels — not the full legal corpus. Registry load is
  // best-effort: without it, subject-area chips fall back to their raw keys.
  AtlasCore.loadRegistry('collections-registry.json?v=20260907d')
    .catch(function () { /* labels degrade gracefully */ })
    .then(function () {
      return AtlasEncyclopedia.render(root, {
        url: 'atlas-concepts.json?v=20260912a',
        clustersUrl: 'atlas-concept-clusters.json?v=20260912a',
        topicsUrl: 'atlas-topics.json?v=20260912a'
      });
    })
    .catch(function (err) {
      root.innerHTML = '<div class="atlas-enc-empty">โหลดข้อมูลไม่สำเร็จ: ' +
        String(err && err.message || err) + '</div>';
    });
})();
</script>
</body>
</html>
